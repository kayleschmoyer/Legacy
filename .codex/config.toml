[mcp_servers.legacy-sports-aws]
command = "node"
args = [".github/copilot/hooks/mcp-bootstrap.mjs", "node", "--import", "tsx", "tools/mcp/aws-server/src/index.ts"]

[mcp_servers.legacy-sports-browser]
command = "node"
args = [".github/copilot/hooks/mcp-bootstrap.mjs", "node", "--import", "tsx", "tools/mcp/browser-server/src/index.ts"]

[mcp_servers.stripe]
command = "npx"
args = ["-y", "@stripe/mcp@0.3.3", "--tools=all"]
env = { STRIPE_SECRET_KEY = "${STRIPE_SECRET_KEY}" }
