service: legacy-sports-graphql
configValidationMode: error

plugins:
  - serverless-content-encoding

custom:
  contentEncoding:
    minimumCompressionSize: 0

package:
  individually: true

provider:
  name: aws
  runtime: nodejs20.x
  deploymentBucket:
    name: legacy-sports-lambdas
  region: ${env:AWS_REGION, 'us-east-1'}
  stage: ${env:AWS_STAGE, 'dev'}
  iam:
    role:
      statements:
        - Effect: 'Allow'
          Resource:
            - arn:aws:secretsmanager:us-east-1:176661590736:secret:rds!db-99c143a8-70a6-4da7-bcd6-cab7837608a1-EDjfvm
          Action:
            - secretsmanager:GetResourcePolicy
            - secretsmanager:GetSecretValue
            - secretsmanager:DescribeSecret
            - secretsmanager:ListSecretVersionIds

functions:
  graphql:
    handler: index.handler # Actual handler substituted in during deploy script
    timeout: 30 # optional, in seconds, default is 6
    events:
      - http:
          method: post
          path: graphql
          cors: true
          integration: lambda-proxy
    vpc:
      securityGroupIds:
        'Fn::Split':
          - ','
          - ${env:AWS_VPC_SECURITY_GROUP_IDS}
      subnetIds:
        'Fn::Split':
          - ','
          - ${env:AWS_VPC_SUBNET_IDS}
    environment:
      CREDS_PATH: rds!db-99c143a8-70a6-4da7-bcd6-cab7837608a1
      DB_HOST: legacy-sports.cep4b6aynyet.us-east-1.rds.amazonaws.com
      # DATABASE_URL: ${env:DATABASE_URL}
      # DATABASE_SCHEMAS: ${env:DATABASE_SCHEMAS}
      # JWT_SECRET: ${env:JWT_SECRET}
      # JWT_PG_TYPE_IDENTIFIER: ${env:JWT_PG_TYPE_IDENTIFIER}
