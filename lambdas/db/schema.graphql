type Mutation {
  _placeholder: Boolean

  """
  Record that the user has accepted the privacy policy
  """
  acceptPrivacyPolicy: PrivacyPolicyStatus

  """
  Accept a pending trade offer. Players are swapped between teams immediately.
  """
  acceptTrade(tradeId: Int!): TradeOffer
  addDefaultPositionsToLeague(leagueId: Int!): [LeaguePosition!]
  advancePlayoffBracket(bracketId: Int!): PlayoffBracket

  """
  Automatically advance matchups for leagues where all games are complete. When leagueId is provided, processes only that league (commissioner access). Without leagueId, processes all leagues (admin / system only). Triggered Sundays at 3am EST by EventBridge.
  """
  autoAdvanceMatchups(
    """
    Optional: restrict to a single league. Required for commissioner-level access.
    """
    leagueId: Int
  ): AutoAdvanceMatchupsResult

  """
  Automatically make draft picks for teams that have exceeded their pick deadline. Triggered every minute by EventBridge.
  """
  autoProcessDraftPicks(
    """
    Optional: restrict to a single league. Required for commissioner-level access.
    """
    leagueId: Int
  ): AutoProcessDraftPicksResult

  """
  Automatically select the next game for active leagues. When leagueId is provided, processes only that league (commissioner access). Without leagueId, processes all leagues (admin / system only). Triggered nightly at midnight EST by EventBridge.
  """
  autoSelectGames(
    """
    Optional: restrict to a single league. Required for commissioner-level access.
    """
    leagueId: Int
  ): AutoSelectGamesResult
  awardChampionship(bracketId: Int!): ChampionTrophy

  """
  Cancel a pending trade offer as the team that proposed it.
  """
  cancelTrade(tradeId: Int!): TradeOffer
  cancelWaiverClaim(claimId: Int!): WaiverClaim
  claimFreeAgent(
    dropPlayerId: Int
    faabBid: Int
    leagueId: Int!
    playerId: Int!
  ): WaiverClaim
  commissionerPick(draftId: Int!, playerId: Int!): DraftPick
  createAllMatchups(leagueId: Int!): AdvanceLeagueWeekResponse
  createLeague(maxRosterSize: Int, name: String!): League
  createLeagueAndTeams(
    input: CreateLeagueAndTeamsInput!
  ): CreateLeagueAndTeamsPayload
  createMatchup(input: CreateMatchupInput!): Matchup
  createPlayoffBracket(
    format: String!
    leagueId: Int!
    multiWeekMatchups: Boolean
    season: Int!
    startWeek: Int!
  ): PlayoffBracket
  createTiebreakerRules(
    allowCommissionerOverride: Boolean
    leagueId: Int!
    primaryMethod: TiebreakerMethod!
    secondaryMethod: TiebreakerMethod
    tertiaryMethod: TiebreakerMethod
  ): TiebreakerRule

  """
  Remove an achievement restriction from a league. Commissioner / General Manager access required.
  """
  deleteAchievementRestriction(
    achievementType: String!
    leagueId: Int!
  ): Boolean
  deleteAllLeagues: String
  deleteLeague(leagueId: Int!): String
  disableDeviceToken(deviceToken: String!): Boolean

  """
  Admin only: generate a JWT that authenticates as the specified user for debugging purposes.
  """
  impersonateUser(userId: Int!): ImpersonateUserResult
  initializeDraft(
    draftMode: String
    draftOrder: String
    leagueId: Int!
    selectionMethod: String
  ): Draft
  inviteAssistantManager(teamId: Int!, username: String!): LeagueMember
  joinLeague(inviteCode: String!, teamName: String!): JoinLeaguePayload
  joinLeagueByCode(inviteCode: String!, teamName: String!): Team
  makeDraftPick(draftId: Int!, playerId: Int!): DraftPick
  markAllNotificationsAsRead: Boolean
  markNotificationAsRead(notificationId: Int!): Boolean
  pauseDraft(leagueId: Int!): Draft
  processWaiverClaims(leagueId: Int): ProcessWaiverClaimsResult

  """
  Propose a trade to another team. Provide the players you are offering and the players you want in return.
  """
  proposeTrade(
    expiresInDays: Int
    leagueId: Int!
    message: String
    offeringPlayerIds: [Int!]!
    receivingTeamId: Int!
    requestingPlayerIds: [Int!]!
  ): TradeOffer

  """
  Record user consent for a specific data processing type
  """
  recordConsent(input: RecordConsentInput!): UserConsent
  registerDeviceToken(input: DeviceTokenInput!): DeviceToken

  """
  Reject a pending trade offer as the receiving team manager.
  """
  rejectTrade(tradeId: Int!): TradeOffer
  removeAssistantManager(teamId: Int!, userId: Int!): Boolean
  renameTeam(leagueId: Int!, newName: String!, teamId: Int!): Team

  """
  Request deletion of all personal data (GDPR Art. 17 - Right to Erasure)
  """
  requestDataDeletion: DataRequest

  """
  Request an export of all personal data (GDPR Art. 15 - Right of Access)
  """
  requestDataExport: DataRequest
  resumeDraft(leagueId: Int!): Draft

  """
  Revoke a previously granted consent
  """
  revokeConsent(consentType: ConsentType!): UserConsent
  sendDirectMessage(
    leagueId: Int
    messageText: String!
    toUserId: Int!
  ): DirectMessage
  sendLeagueMessage(
    gifUrl: String
    leagueId: Int!
    messageText: String!
  ): LeagueChatMessage
  sendMatchupMessage(
    gifUrl: String
    matchupId: Int!
    message: String!
    replyToMessageId: Int
  ): MatchupMessage
  startDraft(
    draftMode: String
    draftOrder: String
    leagueId: Int!
    selectionMethod: String
  ): League
  swapMatchupPlayerPositions(
    matchupPlayerIdA: Int!
    matchupPlayerIdB: Int!
    positionIdA: Int
    positionIdB: Int
  ): [MatchupPlayer!]
  swapTeamMemberPositions(
    positionIdA: Int
    positionIdB: Int
    teamMemberIdA: Int!
    teamMemberIdB: Int!
  ): [TeamMember!]
  updateDraftSettings(
    input: UpdateDraftSettingsInput!
  ): UpdateDraftSettingsPayload
  updateLeagueScoringProfile(
    leagueId: Int!
    updates: [UpdateLeagueScoringMultiplierInput!]!
  ): ScoringConfig
  updateLeagueSettings(input: UpdateLeagueSettingsInput!): League
  updateMatchupPlayerPosition(
    matchupPlayerId: Int!
    positionId: Int
  ): MatchupPlayer
  updateMatchupScore(
    matchupId: Int!
    team1Score: Float
    team2Score: Float
  ): Matchup
  updateMatchupStatus(matchupId: Int!, status: MatchupStatus!): Matchup
  updateNotificationPreferences(
    input: NotificationPreferenceInput!
  ): NotificationPreference
  updatePlayoffMatchup(
    highSeedScore: Float
    lowSeedScore: Float
    matchupId: Int!
    status: PlayoffMatchupStatus
  ): PlayoffMatchup
  updateTeamMemberPosition(positionId: Int, teamMemberId: Int!): TeamMember

  """
  Update a user's access level. Requires admin access. Use "admin" to grant admin privileges or "none" to revoke them.
  """
  updateUserRole(accessLevel: String!, userId: Int!): User

  """
  Create or update a single achievement restriction for a league. Commissioner / General Manager access required.
  """
  upsertAchievementRestriction(
    input: UpsertAchievementRestrictionInput!
  ): AchievementRestriction

  """
  Commissioner-only: veto an accepted trade, reversing the player swap.
  """
  vetoTrade(tradeId: Int!): TradeOffer
}

