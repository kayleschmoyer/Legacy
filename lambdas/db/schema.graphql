"""
A player in the context of a draft
"""
type DraftPlayer {
  """
  Stack-rank fallback for Average Draft Position: the player's 1-based rank across the league's entire draftable pool by projected value, using the league's customized scoring settings when it has ever edited them (falling back to default scoring otherwise). Stable for the life of the draft — it does not renumber as other players are drafted, searched for, or filtered out of the current page. Real historical ADP data is not collected yet.
  """
  adp: Int
  brefId: String

  """
  Career batting statistics for the player
  """
  careerBatting: CareerBatting

  """
  The franchise the player is most associated with (e.g. 'NYY', 'BRO'), derived from season rows as the club they played the most games for, tie-broken by most recent season. This is the career franchise, not the present-day one: unlike `players.mlb_team` it is not restricted to the 30 current teams, so defunct and relocated clubs are represented. Null when no season rows are on file.
  """
  club: String

  """
  List of positions this player is eligible to play (e.g. SP, RP, 1B, SS)
  """
  eligiblePositions: [String!]
  firstName: String

  """
  Career hitter average points per game (batting + fielding score / career games)
  """
  hitterAvgPointsPerGame: Float
  id: Int
  lastName: String

  """
  Career pitching average points per game (pitching score / career games)
  """
  pitchingAvgPointsPerGame: Float

  """
  Projected fantasy points per matchup, accounting for the league schedule (hitter_avg_ppg * gamesPerMatchup + pitching_avg_ppg * pitcherStartsPerMatchup)
  """
  projectedMatchupPoints: Float
}

