# Query to fetch all season fielding stats for a player
query GetPlayerAllSeasonFielding($playerId: Int!) {
  player(id: $playerId) {
    id
    firstName
    lastName
    brefId
    seasonFieldings {
      nodes {
        ...SeasonFielding
      }
    }
  }
}

# Import the SeasonFielding fragment
#import "./seasonFielding.fragment.graphql"
