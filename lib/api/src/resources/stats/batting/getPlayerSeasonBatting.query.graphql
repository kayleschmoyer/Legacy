# Query to fetch a player's season batting statistics
query GetPlayerSeasonBatting(
  $playerId: Int!
  $season: String!
  $team: String!
) {
  seasonBatting(playerId: $playerId, season: $season, team: $team) {
    ...SeasonBatting
    player {
      id
      name
      brefId
    }
  }
}

