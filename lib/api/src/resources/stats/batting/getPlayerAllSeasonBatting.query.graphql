# Query to fetch all season batting stats for a player
query GetPlayerAllSeasonBatting($playerId: Int!) {
  player(id: $playerId) {
    id
    firstName
    lastName
    brefId
    seasonBattings {
      nodes {
        ...SeasonBatting
      }
    }
  }
}

# Import the SeasonBatting fragment
#import "./seasonBatting.fragment.graphql"
