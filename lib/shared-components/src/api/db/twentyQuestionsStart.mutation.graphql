mutation TwentyQuestionsStart($difficulty: TwentyQuestionsDifficulty) {
  twentyQuestionsStart(difficulty: $difficulty) {
    id
    status
    difficulty
    questionsUsed
    maxQuestions
    tokensEarned
    questions {
      questionNumber
      category
      parameter
      answer
      isGuess
    }
    targetPlayer {
      id
      firstName
      lastName
      eligiblePositions
    }
  }
}
