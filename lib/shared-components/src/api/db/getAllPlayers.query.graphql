# Query to fetch all players with pagination and sorting support
#import "./player.fragment.graphql"

query GetAllPlayers(
  $limit: Int
  $offset: Int
  $orderBy: String
  $orderDirection: String
) {
  players(
    limit: $limit
    offset: $offset
    orderBy: $orderBy
    orderDirection: $orderDirection
  ) {
    ...Player
  }
}
