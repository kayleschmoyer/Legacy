# Create a new Season Draft Game (creator is added automatically; others join via invite link)
mutation CreateSeasonDraftGame(
  $name: String!
  $statKey: String
  $gameMode: String
  $playerType: String
) {
  createSeasonDraftGame(
    name: $name
    statKey: $statKey
    gameMode: $gameMode
    playerType: $playerType
  )
}
