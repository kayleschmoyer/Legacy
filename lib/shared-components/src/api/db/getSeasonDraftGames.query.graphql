# Fetch all Season Draft Games for the current user
query GetSeasonDraftGames {
  seasonDraftGames {
    id
    name
    status
    statKey
    gameMode
    playerType
    isMyTurn
    inviteCode
    playerCount
    maxPlayers
    picksMade
    totalPicks
    winnerName
    players {
      id
      playerName
    }
  }
}
