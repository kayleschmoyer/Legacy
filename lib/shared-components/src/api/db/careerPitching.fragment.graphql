# Career Pitching fragment defining the fields for career pitching statistics
fragment CareerPitching on CareerPitching {
  playerId
  primaryPosition
  positionsPlayed
  wins
  losses
  games
  gamesStarted
  gamesFinished
  completeGames
  shutouts
  saves
  hits
  runs
  earnedRuns
  homeRuns
  baseOnBalls
  intentionalBaseOnBalls
  strikeouts
  hitByPitch
  balks
  wildPitches
  battersFaced
  outsRecorded
  outRate
  era
  winPercentage
  player {
    id
    firstName
    lastName
  }
}
