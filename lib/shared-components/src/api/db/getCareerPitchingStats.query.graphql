# Query to fetch career pitching statistics with pagination and sorting support
#import "./careerPitching.fragment.graphql"

query GetCareerPitchingStats(
  $limit: Int
  $offset: Int
  $orderBy: String
  $orderDirection: String
  $minGames: Int
  $minWins: Int
  $minStrikeouts: Int
  $searchTerm: String
  $position: String
) {
  careerPitchingStats(
    limit: $limit
    offset: $offset
    orderBy: $orderBy
    orderDirection: $orderDirection
    minGames: $minGames
    minWins: $minWins
    minStrikeouts: $minStrikeouts
    searchTerm: $searchTerm
    position: $position
  ) {
    ...CareerPitching
  }
}
