mutation TwentyQuestionsAsk($input: TwentyQuestionsAskInput!) {
  twentyQuestionsAsk(input: $input) {
    id
    status
    difficulty
    questionsUsed
    maxQuestions
    tokensEarned
    questions {
      questionNumber
      category
      parameter
      answer
      isGuess
    }
    targetPlayer {
      id
      firstName
      lastName
      eligiblePositions
    }
  }
}
