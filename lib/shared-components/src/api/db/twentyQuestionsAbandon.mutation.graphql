mutation TwentyQuestionsAbandon($gameId: String!) {
  twentyQuestionsAbandon(gameId: $gameId) {
    id
    status
    difficulty
    sport
    questionsUsed
    maxQuestions
    tokensEarned
    questions {
      questionNumber
      category
      parameter
      answer
      isGuess
    }
    targetPlayer {
      id
      firstName
      lastName
      eligiblePositions
    }
  }
}
