# Career Batting fragment defining the fields for career batting statistics
fragment CareerBatting on CareerBatting {
  playerId
  primaryPosition
  positionsPlayed
  games
  plateAppearances
  atBats
  runs
  hits
  doubles
  triples
  homeRuns
  rbi
  stolenBases
  caughtStealing
  baseOnBalls
  strikeouts
  totalBases
  groundedIntoDoublePlays
  hitByPitch
  sacrificeHits
  intentionalBaseOnBalls
  battingAverage
  onBasePercentage
  sluggingPercentage
  offensiveWAR
  player {
    id
    firstName
    lastName
    brefId
  }
}
