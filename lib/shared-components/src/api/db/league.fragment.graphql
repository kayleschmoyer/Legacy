fragment LeagueMember on LeagueMember {
  leagueId
  userId
  teamId
  permissionLevel
  username
}

fragment League on League {
  id
  name
  owner
  maxRosterSize
  currentMatchup
  currentWeekNumber
  draftStatus
  leaguePhase
  inviteCode
  playerPool
  weekAdvanceStatus
  waiverType
  waiverEnabled
  faabBudgetDefault
  spStartsPerMatchup
  gamesPerMatchup
  minCareerGames
  minCareerSeasons
  totalMatchups
  playoffEnabled
  playoffFormat
  playoffMultiWeek
  lmNotes
  isMockDraft
  isPublic
  logoUrl
  bannerUrl
  primaryColor
  secondaryColor
  previousLeagueId
  frozenAt
  seasonNumber
  salaryCapEnabled
  salaryCap
  salaryFloor
  luxuryTaxThreshold
  minSalary
  salaryEscalationPct
  salaryDecayPct
  auctionBudget
  auctionMinBid
  eraFilter
  hofOnly
  customEraStartYear
  customEraEndYear
  userMembership {
    ...LeagueMember
  }
}
