query MatchupScores($leagueId: Int!, $weekNum: Int!) {
  matchupScores(leagueId: $leagueId, weekNum: $weekNum) {
    ... on FootballMatchupStats {
      teamId
      teamName
      totalPoints
      projectedPoints
      players {
        playerId
        playerName
        position
        totalPoints
        projectedPoints
        games {
          gameNum
          opponent
          fantasyPoints
          # LS-6454 selected only `receiving` here, because the premium
          # scoring-format simulator on football Team Detail is the only
          # consumer that reads a stat group and the presets differ solely in
          # the reception multiplier. LS-6393 adds the remaining groups: the
          # mobile matchup box score (FootballScoringBreakdown) renders a
          # per-player, per-game pass/rush/recv/kick/def/IDP line, and this is
          # the query that already carries the same week's roster, so a second
          # round trip would only re-fetch what this document returns anyway.
          passing {
            att
            cmp
            yds
            td
            int
          }
          rushing {
            att
            yds
            td
          }
          receiving {
            tgt
            rec
            yds
            td
          }
          kicking {
            fgm
            fga
            xpm
            xpa
          }
          defense {
            sacks
            int
            fumRec
            defTd
            safeties
            ptsAllowed
            ydsAllowed
          }
          idp {
            soloTkl
            astTkl
            sacks
            int
            ff
            fr
            pd
            defTd
          }
        }
      }
    }
  }
}
