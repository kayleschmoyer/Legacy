query GetLeagueStandings($leagueId: Int!, $throughWeek: Int) {
  getLeagueStandings(leagueId: $leagueId, throughWeek: $throughWeek) {
    teamId
    teamName
    wins
    losses
    ties
    medianWins
    medianLosses
    medianTies
    winPercentage
    pointsFor
    pointsAgainst
    avatarUrl
    primaryColor
    secondaryColor
    divisionId
    divisionName
    streak
    clinchStatus
  }
}
