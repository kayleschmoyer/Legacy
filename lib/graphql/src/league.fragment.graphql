fragment LeagueMember on LeagueMember {
  leagueId
  userId
  teamId
  permissionLevel
  username
}

fragment League on League {
  id
  name
  owner
  # Sport and defensive format for football-aware UI (LS-4152)
  sport
  defensiveFormat
  maxRosterSize
  currentMatchup
  currentWeekNumber
  draftStatus
  leaguePhase
  inviteCode
  playerPool
  weekAdvanceStatus
  waiverType
  waiverEnabled
  faabBudgetDefault
  pitcherStartsPerMatchup
  gamesPerMatchup
  minCareerGames
  minCareerSeasons
  totalMatchups
  playoffEnabled
  playoffFormat
  playoffMultiWeek
  lmNotes
  isMockDraft
  isOfflineDraft
  isPublic
  logoUrl
  bannerUrl
  primaryColor
  secondaryColor
  previousLeagueId
  frozenAt
  seasonNumber
  salaryCapEnabled
  salaryCap
  salaryFloor
  luxuryTaxThreshold
  minSalary
  salaryEscalationPct
  salaryDecayPct
  auctionBudget
  auctionMinBid
  eraFilter
  baseballHofOnly
  customEraStartYear
  customEraEndYear
  tradeDeadlineWeek
  allowDraftSlotTrading
  # Roster continuity / keeper mode (LS-8671/LS-8673)
  rosterContinuity
  keeperSettings {
    keeperCount
    costModel
    maxConsecutiveKeeps
    rookieExempt
  }
  userMembership {
    ...LeagueMember
  }
}
