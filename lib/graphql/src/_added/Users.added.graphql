fragment User on User {
  id
  email
  username
  accessLevel
  avatarUrl
  subscriptionTier
  themePreference
}

query GetMyIdentities {
  myIdentities {
    id
    provider
    providerEmail
    providerEmailVerified
    providerUsername
    providerAvatar
    linkedAt
    lastLoginAt
  }
}

fragment AdminUser on User {
  id
  email
  username
  accessLevel
}

query GetAllUsers(
  $limit: Int
  $offset: Int
  $search: String
  $orderBy: String
  $orderDirection: String
  $accessLevel: String
  $includeTestUsers: Boolean
) {
  users(
    limit: $limit
    offset: $offset
    orderBy: $orderBy
    orderDirection: $orderDirection
    search: $search
    accessLevel: $accessLevel
    includeTestUsers: $includeTestUsers
  ) {
    ...User
  }
}

query GetUsersCount(
  $search: String
  $accessLevel: String
  $includeTestUsers: Boolean
) {
  usersCount(
    search: $search
    accessLevel: $accessLevel
    includeTestUsers: $includeTestUsers
  )
}

mutation UpdateUserRole($userId: Int!, $accessLevel: String!) {
  updateUserRole(userId: $userId, accessLevel: $accessLevel) {
    ...User
  }
}

query AdminGetUsers($limit: Int, $offset: Int) {
  users(limit: $limit, offset: $offset) {
    ...AdminUser
  }
}

mutation UpdateUsername($username: String!) {
  updateUsername(username: $username) {
    ...User
  }
}

mutation UpdateUserTheme($themePreference: String!) {
  updateUserTheme(themePreference: $themePreference) {
    id
    themePreference
  }
}

mutation ImpersonateUser($userId: Int!) {
  impersonateUser(userId: $userId) {
    token
  }
}

query MyIdentities {
  myIdentities {
    id
    provider
    providerEmail
    providerEmailVerified
    providerUsername
    providerAvatar
    linkedAt
  }
}

mutation SetCanonicalEmail($identityId: Int!) {
  setCanonicalEmail(identityId: $identityId) {
    user {
      ...User
    }
    changed
  }
}

query GetUserByEmail($email: String!) {
  userByEmail(email: $email) {
    ...User
  }
}

query GetLeaguesForUser($id: Int!) {
  user(id: $id) {
    # leagueMembers field not available on User
    # leagueMembers {
    #   nodes {
    #     league {
    #       ...League
    #     }
    #   }
    # }
    ...User
  }
}
