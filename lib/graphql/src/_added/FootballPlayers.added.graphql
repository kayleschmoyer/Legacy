fragment FootballPlayerHeader on FootballPlayer {
  id
  firstName
  lastName
  position
  isDst
  nflTeam
  pfrId
  headshotUrl
  previousTeams
  projectedFantasyPoints
  adpRank
  careerStats {
    fantasyPoints
    passing {
      g
      yds
      td
      int
      rating
    }
    rushing {
      g
      yds
      td
    }
    receiving {
      g
      rec
      yds
      td
    }
    kicking {
      g
      fgm
      fga
      fgPct
    }
    defense {
      g
      sacks
      int
      ptsAllowedPerG
    }
    idp {
      g
      soloTkl
      astTkl
      totalTkl
      sacks
      int
      ff
    }
  }
}

fragment FootballPlayerDetailExtras on FootballPlayer {
  careerStats {
    defense {
      g
      fumRec
      defTd
      ydsAllowedPerG
    }
  }
  seasonStats {
    passing {
      season
      team
      g
      cmp
      att
      yds
      td
      int
      rating
    }
    rushing {
      season
      team
      g
      att
      yds
      td
      ydsPerAtt
    }
    receiving {
      season
      team
      g
      tgt
      rec
      yds
      td
      ydsPerRec
    }
    defense {
      season
      team
      g
      sacks
      int
      fumRec
      defTd
      ptsAllowed
    }
    kicking {
      season
      team
      g
      fgm
      fga
      xpm
      xpa
    }
    idp {
      season
      team
      g
      soloTkl
      astTkl
      sacks
      int
      pd
      ff
    }
  }
}

query FootballPlayers(
  $positions: [String!]
  $nflTeam: String
  $conference: String
  $freeAgent: Boolean
  $search: String
  $after: String
  $first: Int
  $minProjectedPoints: Float
  $maxAdpRank: Int
  $sortBy: String
  $sortDir: String
) {
  footballPlayers(
    positions: $positions
    nflTeam: $nflTeam
    conference: $conference
    freeAgent: $freeAgent
    search: $search
    after: $after
    first: $first
    minProjectedPoints: $minProjectedPoints
    maxAdpRank: $maxAdpRank
    sortBy: $sortBy
    sortDir: $sortDir
  ) {
    nodes {
      ...FootballPlayerHeader
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query FootballPlayer($id: Int!) {
  footballPlayer(id: $id) {
    ...FootballPlayerHeader
    ...FootballPlayerDetailExtras
  }
}

query FootballPlayerLeagueAvailability(
  $playerIds: [Int!]!
  $leagueIds: [Int!]!
) {
  footballPlayerLeagueAvailability(
    playerIds: $playerIds
    leagueIds: $leagueIds
  ) {
    playerId
    leagueId
    leagueName
    isAvailable
  }
}
