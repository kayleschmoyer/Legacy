# The dashboard summary fragment deliberately omits the standings fields
# (wins/losses/ties/rank/totalTeams). `getUserLeagueSummaries` no longer computes
# them — they are fetched in parallel by `GetUserLeagueStandings` and merged on
# `leagueId` client-side (LS-9528).
fragment UserLeagueSummary on UserLeagueSummary {
  leagueId
  leagueName
  sport
  leaguePhase
  seasonNumber
  draftStatus
  draftScheduledAt
  draftMode
  selectionMethod
  teamCount
  currentWeekNumber
  totalMatchups
  matchupId
  matchupStatus
  matchupEndTime
  userScore
  opponentScore
  opponentTeamName
  eraFilter
  customEraStartYear
  customEraEndYear
  isCommissioner
}

# Archived (offseason) leagues are loaded lazily, off the first-render critical
# path, so `getArchivedUserLeagueSummaries` still returns standings inline.
fragment ArchivedUserLeagueSummary on UserLeagueSummary {
  ...UserLeagueSummary
  wins
  losses
  ties
  rank
  totalTeams
}

query GetUserLeagueSummaries {
  getUserLeagueSummaries {
    ...UserLeagueSummary
  }
}

query GetArchivedUserLeagueSummaries {
  getArchivedUserLeagueSummaries {
    ...ArchivedUserLeagueSummary
  }
}

query GetUserLeagueStandings {
  getUserLeagueStandings {
    leagueId
    wins
    losses
    ties
    rank
    totalTeams
  }
}
