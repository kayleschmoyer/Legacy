fragment SubscriptionInfo on SubscriptionInfo {
  status
  tier
  currentPeriodEnd
  cancelAtPeriodEnd
  gracePeriodEndsAt
  trialEndsAt
  managedBy
}

query GetMySubscription {
  mySubscription {
    ...SubscriptionInfo
  }
}

query GetMyInvoices {
  myInvoices {
    id
    amountPaidCents
    currency
    status
    created
    hostedInvoiceUrl
    invoicePdf
  }
}

# LS-7171: kept separate from SubscriptionInfo so only the pricing page pays for
# the lazy Stripe lookup behind billingInterval.
query GetMyBillingInterval {
  mySubscription {
    billingInterval
  }
}

query GetStripePrices {
  stripePrices {
    monthlyPriceCents
    annualTotalCents
    monthlyPriceId
    annualPriceId
    currency
    trialPeriodDays
  }
}

mutation CreateCheckoutSession(
  $priceId: String!
  $successUrl: String!
  $cancelUrl: String!
  $portalReturnUrl: String!
) {
  createCheckoutSession(
    priceId: $priceId
    successUrl: $successUrl
    cancelUrl: $cancelUrl
    portalReturnUrl: $portalReturnUrl
  ) {
    url
  }
}

mutation CreateBillingPortalSession($returnUrl: String!) {
  createBillingPortalSession(returnUrl: $returnUrl) {
    url
  }
}

mutation CreateSetupIntent {
  createSetupIntent {
    clientSecret
    publishableKey
  }
}

mutation RetryLatestInvoice($setupIntentId: String!) {
  retryLatestInvoice(setupIntentId: $setupIntentId) {
    success
    status
    message
  }
}

query GetDonationPaymentLink {
  donationPaymentLink {
    url
  }
}
