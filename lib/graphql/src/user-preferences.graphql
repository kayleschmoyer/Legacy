fragment UserPreference on UserPreference {
  id
  userId
  statsFormat
  audioEnabled
  onboardingCompletedAt
  createdAt
  updatedAt
}

query GetUserPreferences {
  getUserPreferences {
    ...UserPreference
  }
}

mutation UpdateUserPreferences($input: UserPreferenceInput!) {
  updateUserPreferences(input: $input) {
    ...UserPreference
  }
}
