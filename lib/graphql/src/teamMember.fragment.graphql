fragment TeamMember on TeamMember {
  id
  playerId
  positionId
  teamId
  leagueId
  onTradeBlock
  salary
  askingPrice
  nickname
  isLocked
  player {
    id
    firstName
    lastName
    brefId
    eligiblePositions
    mlbTeam
    nflTeam
    jerseyNumber
    careerBatting {
      games
    }
    seasonsPlayed
  }
}
