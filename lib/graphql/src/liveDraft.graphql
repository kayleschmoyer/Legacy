# Live Draft GraphQL Operations
# Used by the EliteDraftBoard component for pick-by-pick live drafting

mutation InitializeLiveDraft(
  $leagueId: Int!
  $draftOrder: String
  $draftMode: String
  $selectionMethod: String
) {
  initializeDraft(
    leagueId: $leagueId
    draftOrder: $draftOrder
    draftMode: $draftMode
    selectionMethod: $selectionMethod
  ) {
    id
    leagueId
    draftMode
    selectionMethod
    draftOrder
    currentPick
    draftStartedAt
    createdAt
  }
}

mutation MakeDraftPick($draftId: Int!, $playerId: Int!) {
  makeDraftPick(draftId: $draftId, playerId: $playerId) {
    id
    draftId
    teamId
    playerId
    round
    pickNumber
    overallPick
    pickedAt
  }
}

mutation PauseDraft($leagueId: Int!) {
  pauseDraft(leagueId: $leagueId) {
