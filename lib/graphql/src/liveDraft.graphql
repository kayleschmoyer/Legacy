# Fetch career pitching stats for pitcher cards
query GetDraftPitcherStats($limit: Int, $minGames: Int) {
  careerPitchingStats(limit: $limit, minGames: $minGames) {
    playerId
    era
    wins
    losses
    saves
    strikeouts
    games
    gamesStarted
  }
}

# Fetch career batting stats for player cards.
# NOTE: primaryPosition is intentionally omitted to avoid triggering an expensive
# careerFielding DataLoader call (WHERE player_id IN (...) for thousands of IDs)
# that caused 502 timeouts (LS-3113). Position is derived from eligiblePositions
# in the client. player { firstName lastName } is retained (lightweight players
# DataLoader) so the statsLookup fallback in useDraftWebSocket resolves correctly
# for picks that arrive via WebSocket before the available-players refetch completes.
query GetDraftPlayerStats($first: Int, $searchTerm: String, $minGames: Int) {
  careerBattingStats(
    first: $first
    searchTerm: $searchTerm
    minGames: $minGames
  ) {
    edges {
      node {
        playerId
        games
        atBats
        hits
        homeRuns
        rbi
        runs
        stolenBases
        battingAverage
        onBasePercentage
        sluggingPercentage
        offensiveWAR
        player {
          id
          firstName
          lastName
        }
      }
    }
    totalCount
  }
}

# Fetch career pitching stats for pitcher player cards
query GetDraftPitchingStats($limit: Int, $minGames: Int) {
  careerPitchingStats(limit: $limit, minGames: $minGames) {
    playerId
    wins
    losses
    era
    games
    gamesStarted
    strikeouts
    saves
    earnedRuns
    baseOnBalls
    outsRecorded
    winPercentage
    hits
    pitchingWAR
  }
}

# Career football stat totals for the draft board (LS-9478). Football
# analogue of GetDraftPlayerStats/GetDraftPitchingStats — fetched once per
# draft (not scoped to available players) and matched client-side, same
# pattern as the baseball queries above. Only called for football leagues.
query GetDraftFootballPlayerStats {
  getDraftFootballPlayerStats {
    playerId
    passYds
    passTd
    rushYds
    rushTd
    rec
    recTd
    fg
  }
}

# Server-computed draft pick recommendations (LS-467)
# Refetch after each pick to keep suggestions current.
query GetDraftRecommendations($draftId: Int!, $teamId: Int!) {
  getDraftRecommendations(draftId: $draftId, teamId: $teamId) {
    playerId
    playerName
    position
    score
    reason
    signal
    topStats {
      label
      value
    }
  }
}

mutation CreateMockDraft(
  $sport: Sport
  $numTeams: Int!
  $pickPosition: Int!
  $pickTimeLimitSeconds: Int
  $draftOrder: String
  $playerPool: String
  $mode: MockDraftMode
  $controlAllTeams: Boolean
  $isPublic: Boolean
) {
  createMockDraft(
    sport: $sport
    numTeams: $numTeams
    pickPosition: $pickPosition
    pickTimeLimitSeconds: $pickTimeLimitSeconds
    draftOrder: $draftOrder
    playerPool: $playerPool
    mode: $mode
    controlAllTeams: $controlAllTeams
    isPublic: $isPublic
  ) {
    draftId
    inviteCode
    webSocketReady
  }
}

mutation JoinMockDraft($inviteCode: String, $draftId: Int, $teamName: String!) {
  joinMockDraft(
    inviteCode: $inviteCode
    draftId: $draftId
    teamName: $teamName
  ) {
    draftId
    seatId
    sport
  }
}

mutation StartMockDraft($draftId: Int!) {
