mutation DeleteMockDraft($draftId: Int!) {
  deleteMockDraft(draftId: $draftId)
}

query GetDraftRoom($draftId: Int!, $inviteCode: String) {
  draftRoom(draftId: $draftId, inviteCode: $inviteCode) {
    kind
    status
    sport
    leagueId
    openSeatCount
    reservedSlots
    draft {
      id
      leagueId
      status
      sport
      mockMode
      controlAllTeams
      isPublic
      inviteCode
      lobbyExpiresAt
      createdBy
      draftOrder
      currentPick
      pickTimeLimitSeconds
      currentPickDeadline
      draftStartedAt
      draftCompletedAt
      scheduledAt
      autoPickDisabled
    }
    rules {
      sport
      playerPool
      maxRosterSize
      defensiveFormat
      rosterPositions
      isMock
    }
    seats {
      id
      slot
      teamId
      userId
      controller
      seatName
      autoPick
    }
    viewer {
      role
      seatId
      canPick
      canHost
    }
  }
}

