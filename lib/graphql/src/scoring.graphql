query GetLeagueScoringProfile($leagueId: Int!) {
  leagueScoringProfile(leagueId: $leagueId) {
    profileId
    profileName
    stats {
      multiplier
      defaultMultiplier
      isOverride
      isEnabled
      definition {
        id
        statKey
        statGroup
        displayName
        description
        sourceColumn
        defaultMultiplier
        minMultiplier
        maxMultiplier
        stepSize
        isRequired
        enforcePositive
        enforceNegative
      }
    }
    multiplierGroups {
      group
      values {
        statKey
        sourceColumn
        multiplier
      }
    }
  }
}

