# Query to fetch the total count of career pitching records matching filter criteria
query GetCareerPitchingStatsCount(
  $minGames: Int
  $minWins: Int
  $maxWins: Int
  $minStrikeouts: Int
  $maxStrikeouts: Int
  $minERA: Float
  $maxERA: Float
  $searchTerm: String
  $position: String
  $team: String
) {
  careerPitchingStatsCount(
    minGames: $minGames
    minWins: $minWins
    maxWins: $maxWins
    minStrikeouts: $minStrikeouts
    maxStrikeouts: $maxStrikeouts
    minERA: $minERA
    maxERA: $maxERA
    searchTerm: $searchTerm
    position: $position
    team: $team
  )
}
