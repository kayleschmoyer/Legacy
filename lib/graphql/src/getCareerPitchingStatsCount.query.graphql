# Query to fetch the total count of career pitching records matching filter criteria
query GetCareerPitchingStatsCount(
  $minGames: Int
  $minWins: Int
  $minStrikeouts: Int
  $searchTerm: String
  $position: String
  $team: String
) {
  careerPitchingStatsCount(
    minGames: $minGames
    minWins: $minWins
    minStrikeouts: $minStrikeouts
    searchTerm: $searchTerm
    position: $position
    team: $team
  )
}
