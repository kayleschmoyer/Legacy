fragment TradeOfferPlayer on TradeOfferPlayer {
  id
  tradeOfferId
  playerId
  fromTeamId
  playerName
  playerPosition
  salary
}

fragment TradeOfferVote on TradeOfferVote {
  id
  tradeOfferId
  teamId
  teamName
  vote
  createdAt
}

fragment TradeOffer on TradeOffer {
  id
  leagueId
  proposingTeamId
  receivingTeamId
  status
  message
  expiresAt
  respondedAt
  vetoedAt
  createdAt
  updatedAt
  proposingTeamName
  receivingTeamName
  eligibleVoterCount
  players {
    ...TradeOfferPlayer
  }
  votes {
    ...TradeOfferVote
  }
}
