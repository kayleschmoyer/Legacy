# Query to fetch career pitching statistics with pagination and sorting support
#import "./careerPitching.fragment.graphql"

query GetCareerPitchingStats(
  $limit: Int
  $offset: Int
  $orderBy: String
  $orderDirection: String
  $minGames: Int
  $minWins: Int
  $maxWins: Int
  $minStrikeouts: Int
  $maxStrikeouts: Int
  $minERA: Float
  $maxERA: Float
  $searchTerm: String
  $position: String
  $team: String
) {
  careerPitchingStats(
    limit: $limit
    offset: $offset
    orderBy: $orderBy
    orderDirection: $orderDirection
    minGames: $minGames
    minWins: $minWins
    maxWins: $maxWins
    minStrikeouts: $minStrikeouts
    maxStrikeouts: $maxStrikeouts
    minERA: $minERA
    maxERA: $maxERA
    searchTerm: $searchTerm
    position: $position
    team: $team
  ) {
    ...CareerPitching
    ...CareerPitchingStats
  }
}
