query GetTeamWaiverClaims($teamId: Int!, $status: String) {
  teamWaiverClaims(teamId: $teamId, status: $status) {
    id
    leagueId
    teamId
    playerId
    dropPlayerId
    faabBid
    status
    errorMessage
    playerName
    dropPlayerName
    processedAt
    createdAt
  }
}

query GetTeamWaiverPriority($teamId: Int!) {
  teamWaiverPriority(teamId: $teamId) {
    teamId
    waiverType
    priority
    totalTeams
  }
}

mutation CancelWaiverClaim($claimId: Int!) {
  cancelWaiverClaim(claimId: $claimId) {
    id
    status
    errorMessage
    processedAt
  }
}
