fragment Matchup on Matchup {
  id
  weekNumber
  leagueId
  team1Id
  team2Id
  team1Score
  team2Score
  status
  cancellationReason
  statsLoadingStatus
  gamesPerMatchup
  pitcherStartsPerMatchup
  selectedGamesCount
  startTime
  endTime
  lockTime
  updatedAt

  # Scoring provenance (LS-9665/LS-9667): whether this matchup's persisted
  # score was computed before the league's current scoring settings, and —
  # when stale — what changed and when, for the indicator's tooltip.
  scoringIsStale
  scoringChangeLog {
    statDisplayName
    previousMultiplier
    newMultiplier
    changedAt
    changedByUsername
  }
  team1 {
    id
    name
    primaryColor
  }
  team2 {
    id
    name
    primaryColor
  }

  # LS-6323: premium projected-points signal for list rows. Server-gated by
  # ENTITLEMENTS.matchup_projections — null for non-entitled/completed
  # matchups (see MatchupWinProbability resolver).
  winProbability {
    team1ProjectedScore
    team2ProjectedScore
  }
}
