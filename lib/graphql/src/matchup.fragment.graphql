fragment Matchup on Matchup {
  id
  weekNumber
  leagueId
  team1Id
  team2Id
  team1Score
  team2Score
  status
  statsLoadingStatus
  gamesPerMatchup
  pitcherStartsPerMatchup
  selectedGamesCount
  startTime
  endTime
  updatedAt
  team1 {
    id
    name
    primaryColor
  }
  team2 {
    id
    name
    primaryColor
  }

  # LS-6323: premium projected-points signal for list rows. Server-gated by
  # ENTITLEMENTS.matchup_projections — null for non-entitled/completed
  # matchups (see MatchupWinProbability resolver).
  winProbability {
    team1ProjectedScore
    team2ProjectedScore
  }
}
