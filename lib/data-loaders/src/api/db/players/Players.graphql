#     }
#   }
# }

query GetPlayerByBrefId($brefId: String!) {
  playerByBrefId(brefId: $brefId) {
    ...Player
  }
}

query GetAllPlayers {
  players {
    id
    firstName
    lastName
    brefId
  }
}
