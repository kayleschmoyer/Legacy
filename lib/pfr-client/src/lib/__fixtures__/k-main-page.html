<!--
  Synthetic main-page fixture for a K (pfrId TuckJu00, Justin Tucker).
  Two seasons in the `scoring` table. Season 2021 has both FG and XP attempts;
  season 2022 also has FG and XP attempts. The scoring table also includes a
  multi-team season (2023) where the player changed teams mid-season — the
  per-team rows appear first, then the aggregate "2TM" row last, which the
  parser must prefer (last row per season wins via map overwrite).

  Expected season totals:
    2021: kicking(g=17, fgm=37, fga=40, xpm=44, xpa=45)
    2022: kicking(g=17, fgm=31, fga=33, xpm=41, xpa=41)

-->

  <body>
    <div id="content">
      <table id="scoring">
        <thead>
          <tr>
            <th data-stat="year_id">Year</th>
            <th data-stat="team_name_abbr">Tm</th>
            <th data-stat="games">G</th>
            <th data-stat="fgm">FGM</th>
            <th data-stat="fga">FGA</th>

        <tbody>
