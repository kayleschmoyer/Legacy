# Football Roster Display (LS-5446): from the league Overview tab's Quick
# Standings, drill into a team's Team Detail page, open its Roster tab, and
# verify the football position-slot grouping renders (QB/RB/WR/TE/FLEX/K/DST,
# or DL/LB/DB in place of DST for IDP leagues).
#
# NOTE (LS-9615): this is the visual sweep for Team Detail's Roster tab, part
# of the /mobile-qa sweep only — see .agents/skills/mobile-qa/SKILL.md and
# ADR-0016. It does not provide android functional coverage; that is owned by
# the dual-mode Playwright specs under LS-8444.
#
# The Overview → Quick Standings row is the only real navigation entry point
# into Team Detail (added by LS-5446 — previously the page existed but had no
# reachable UI path anywhere in the app); shared with the Lineup/Matchup tab
# flows via maestro/subflows/open-own-team.yaml. Team Detail has no per-tab
# testIDs on its own tab bar, so "Roster" is tapped by visible text, matching
# the league-detail tab-bar convention (see maestro/README.md). Slot cards are
# selected by the `<slot>-card` testID convention (e.g. `qb-card`, `bn-card`)
# added by LS-6433 (FootballLeagueRosterScreen.tsx).
appId: com.legacysports.app
tags:
  - football-team-detail
  - roster
  - authenticated
---
- runFlow:
    file: ../../subflows/launch-authenticated.yaml
- runFlow:
    file: ../../subflows/open-first-league.yaml
- takeScreenshot: maestro/artifacts/football-team-detail/01-before-open-team
- runFlow:
    file: ../../subflows/open-own-team.yaml
# open-own-team.yaml no-ops when Quick Standings isn't rendered (standings-less
# test account) — guard the rest of the flow on "Roster" so it degrades
# gracefully instead of hard-failing on that environment/fixture gap.
- runFlow:
    when:
      visible: "Roster"
    commands:
      - takeScreenshot: maestro/artifacts/football-team-detail/02-after-open-team
      - tapOn: "Roster"
      - extendedWaitUntil:
          visible:
            id: "qb-card"
          timeout: 20000
      - takeScreenshot: maestro/artifacts/football-team-detail/03-roster-qb-flex
      - scrollUntilVisible:
          element:
            id: "k-card"
          direction: DOWN
          timeout: 15000
      - takeScreenshot: maestro/artifacts/football-team-detail/04-roster-k-slot
      # Defensive slot differs by league format (DefensiveFormat): DST for
      # standard leagues, DL/LB/DB for IDP leagues (FootballLeagueRosterScreen
      # getSlotOrder) — check for either rather than assuming one.
      - runFlow:
          when:
            visible:
              id: "dst-card"
          commands:
            - takeScreenshot: maestro/artifacts/football-team-detail/05-roster-dst-slot
      - runFlow:
          when:
            visible:
              id: "dl-card"
          commands:
            - scrollUntilVisible:
                element:
                  id: "db-card"
                direction: DOWN
                timeout: 15000
            - takeScreenshot: maestro/artifacts/football-team-detail/05-roster-idp-slots
      - scrollUntilVisible:
          element:
            id: "bn-card"
          direction: DOWN
          timeout: 15000
      - takeScreenshot: maestro/artifacts/football-team-detail/06-roster-bench-slot
      - back
