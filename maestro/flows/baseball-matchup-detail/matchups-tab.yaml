# Matchups: league Matchups tab, then drill into a matchup card (before/after pair).
appId: com.legacysports.app
tags:
  - baseball-matchup-detail
  - authenticated
---
- runFlow:
    file: ../../subflows/launch-authenticated.yaml
- runFlow:
    file: ../../subflows/open-first-league.yaml
- tapOn: "Matchups"
# Mandatory landing (LS-8446): the matchup-list container renders on the Matchups
# tab regardless of matchup data (pre-season shows an empty-state message inside
# the same container), so a broken tab fails the flow. The matchup-CARD drill-in
# below stays when:-guarded because card presence is genuinely data-dependent.
- extendedWaitUntil:
    visible:
      id: "matchup-list"
    timeout: 20000
- takeScreenshot: maestro/artifacts/baseball-matchup-detail/01-matchups-tab
- runFlow:
    when:
      visible:
        id: "matchup-card"
    commands:
      - takeScreenshot: maestro/artifacts/baseball-matchup-detail/02-before-open-matchup
      - tapOn:
          id: "matchup-card"
          index: 0
      - extendedWaitUntil:
          visible: "Matchup"
          timeout: 20000
      - takeScreenshot: maestro/artifacts/baseball-matchup-detail/03-after-open-matchup
      - scroll
      - takeScreenshot: maestro/artifacts/baseball-matchup-detail/04-matchup-detail-scrolled
      - back
