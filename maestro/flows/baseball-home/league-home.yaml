# League home: "Scoreboard First" home tab (greeting, ticker, league rail,
# quick actions), then the leagues tab list.
appId: com.legacysports.app
tags:
  - baseball-home
  - authenticated
---
- runFlow:
    file: ../../subflows/launch-authenticated.yaml
- takeScreenshot: maestro/artifacts/baseball-home/01-home-screen
- assertVisible:
    id: "home-content"
# The live matchup ticker only renders when one of the account's leagues has a
# matchup in progress, so screenshot it opportunistically (LS-8794).
- runFlow:
    when:
      visible:
        id: "home-live-ticker"
    commands:
      - takeScreenshot: maestro/artifacts/baseball-home/02-live-ticker
# Core navigation (LS-8446, retargeted by LS-8794): the home sport-switcher
# cards are gone from the returning-user layout — sport switching now lives
# behind the league rail and the Leagues tab. The rail and the quick-action
# grid are the static elements of the redesigned home, so assert them loudly:
# a broken home tab fails the flow instead of emitting a screenshot of a blank
# dashboard.
- scrollUntilVisible:
    element:
      id: "home-league-rail"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "home-league-rail"
- takeScreenshot: maestro/artifacts/baseball-home/03-league-rail
- scrollUntilVisible:
    element:
      id: "home-quick-actions"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "home-quick-actions"
- takeScreenshot: maestro/artifacts/baseball-home/04-quick-actions
- tapOn: "Leagues"
- extendedWaitUntil:
    visible:
      id: "leagues-list"
    timeout: 15000
- takeScreenshot: maestro/artifacts/baseball-home/05-leagues-tab
- assertVisible:
    id: "leagues-add-button"
- scroll
- takeScreenshot: maestro/artifacts/baseball-home/06-leagues-scrolled
