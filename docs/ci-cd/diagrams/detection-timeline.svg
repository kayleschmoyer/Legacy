<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="24" y="34" font-size="20" font-weight="700" fill="#1B3A5C">When breakage is detected — before vs after</text>

  <!-- BEFORE lane -->
  <text x="24" y="78" font-weight="700" fill="#991b1b">BEFORE — detection is late, so failures cascade</text>
  <line x1="60" y1="150" x2="900" y2="150" stroke="#cbd5e1" stroke-width="2" marker-end="url(#a2)"/>

  <g>
    <circle cx="140" cy="150" r="6" fill="#3b82f6"/>
    <text x="120" y="128" fill="#334155">PR #1 merges</text>
    <circle cx="300" cy="150" r="6" fill="#3b82f6"/>
    <text x="280" y="128" fill="#334155">PR #2 merges</text>
    <circle cx="460" cy="150" r="6" fill="#3b82f6"/>
    <text x="440" y="128" fill="#334155">PR #3 merges</text>
    <circle cx="620" cy="150" r="6" fill="#3b82f6"/>
    <text x="600" y="128" fill="#334155">PR #4 merges</text>
  </g>
  <!-- nightly detection -->
  <rect x="770" y="120" width="150" height="60" rx="8" fill="#fef2f2" stroke="#C41E3A" stroke-width="1.5"/>
  <text x="784" y="145" fill="#991b1b" font-weight="700">3am nightly</text>
  <text x="784" y="165" fill="#991b1b">integration RED</text>
  <text x="120" y="200" fill="#991b1b" font-size="12">Break introduced here…</text>
  <line x1="150" y1="170" x2="150" y2="186" stroke="#C41E3A" stroke-width="1.5"/>
  <text x="640" y="210" fill="#991b1b" font-size="12">…surfaces here. Which of 4 PRs? Bisect by hand. PRs #2–4 piled on top.</text>
  <path d="M150,205 C 350,235 600,225 770,180" fill="none" stroke="#C41E3A" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- AFTER lane -->
  <text x="24" y="290" font-weight="700" fill="#065f46">AFTER — detection shifts onto the PR that causes it</text>
  <line x1="60" y1="360" x2="900" y2="360" stroke="#cbd5e1" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="96" y="330" width="120" height="60" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="110" y="354" fill="#065f46" font-weight="700">PR #1 open</text>
  <text x="110" y="374" fill="#065f46" font-size="12">Tier 0 blocks</text>

  <circle cx="300" cy="360" r="6" fill="#3b82f6"/>
  <text x="270" y="338" fill="#334155">PR #2 (clean)</text>
  <circle cx="460" cy="360" r="6" fill="#3b82f6"/>
  <text x="430" y="338" fill="#334155">PR #3 (clean)</text>

  <rect x="560" y="330" width="150" height="60" rx="8" fill="#fffbeb" stroke="#C5A55A" stroke-width="1.5"/>
  <text x="574" y="354" fill="#92600e" font-weight="700">PR #4 risky</text>
  <text x="574" y="374" fill="#92600e" font-size="12">Tier 2 runs affected</text>

  <rect x="770" y="330" width="150" height="60" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="784" y="354" fill="#065f46" font-weight="700">3am nightly</text>
  <text x="784" y="374" fill="#065f46">GREEN (backstop)</text>

  <text x="96" y="420" fill="#334155" font-size="12">Each break is attributed to exactly one PR at the moment it is introduced — no cascade, no manual bisect.</text>
</svg>
