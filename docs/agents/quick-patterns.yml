# Quick Patterns for AI Agents
# Optimized lookup for common development tasks

workflow:
  start_new_ticket:
    when: "Starting new ticket from main branch"
    command: "git checkout main && git pull && twig switch LS-{ticket}"

  start_followup:
    when: "Creating follow-up ticket from current branch"
    command: "twig switch LS-{ticket} -p current"

  update_jira:
    start_work:
      when: "Begin working on ticket"
      command: "acli jira workitem transition --key LS-{ticket} --status 'In Progress'"

    code_review:
      when: "PR created and ready for review"
      command: "acli jira workitem transition --key LS-{ticket} --status 'In Review'"

    complete:
      when: "PR merged to main"
      command: "acli jira workitem transition --key LS-{ticket} --status 'Done'"

  create_pr:
    when: "Ready to create pull request"
    command: "twig github pr create-pr"

validation:
  order: ["typecheck", "lint", "test", "build"]

  typecheck:
    when: "First validation step - check TypeScript types"
    command: "pnpm exec nx affected -t typecheck"

  lint:
    when: "Second validation step - fix code quality"
    command: "pnpm exec nx affected -t lint --fix"

  test:
    when: "Third validation step - run unit tests"
    command: "pnpm exec nx affected -t test"

  build:
    when: "Fourth validation step - compile projects"
    command: "pnpm exec nx affected -t build"

troubleshooting:
  module_not_found:
    symptom: "Cannot find module '@legacy-sports/...'"
    command: "pnpm run build:libs"

  db_connection_failed:
    symptom: "Database connection errors"
    command: "pnpm run sync-env"

  nx_cache_issues:
    symptom: "Stale cache or unexpected build results"
    command: "pnpm exec nx reset"

  acli_not_found:
    symptom: "acli command not recognized"
    command: "$env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')"

git:
  commit_and_push:
    when: "Committing changes with conventional format"
    command: "git add . && git commit -m 'feat(scope): message' && git push origin HEAD"
    format: "<type>(<scope>): <message>"
    types: ["feat", "fix", "docs", "style", "refactor", "test", "chore"]

  view_branch_tree:
    when: "Checking branch dependencies"
    command: "twig tree"

  rebase_tree:
    when: "Rebasing dependent branches"
    command: "make rebase-tree"

nx:
  affected:
    when: "Run on changed projects only (recommended)"
    command: "pnpm exec nx affected -t {target}"
    targets: ["typecheck", "lint", "test", "build"]

  specific_project:
    when: "Run specific project target"
    command: "pnpm exec nx run {project}:{target}"

  view_graph:
    when: "Visualize project dependencies"
    command: "pnpm exec nx graph"
