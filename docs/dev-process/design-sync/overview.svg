<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B3A5C"/>
    </marker>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #0A0F1A; }
      .phase { font-size: 14px; font-weight: 700; fill: #ffffff; }
      .label { font-size: 12px; fill: #0A0F1A; }
      .sub { font-size: 11px; fill: #4a5568; }
      .arrow { stroke: #1B3A5C; stroke-width: 2; fill: none; }
      .box { fill: #16223A; stroke: #C5A55A; stroke-width: 1.5; }
      .artifact { fill: #ffffff; stroke: #1B3A5C; stroke-width: 1.5; }
      .pill { fill: #C5A55A; }
      .pillText { font-size: 10px; font-weight: 700; fill: #0A0F1A; }
    </style>
  </defs>

  <text x="450" y="30" text-anchor="middle" class="title">Design Sync Pipeline</text>
  <text x="450" y="50" text-anchor="middle" class="sub">claude.ai/design → repo → implementation</text>

  <!-- Phase 1: Source -->
  <rect x="30" y="90" width="200" height="120" rx="10" class="box"/>
  <text x="130" y="120" text-anchor="middle" class="phase">Claude Design</text>
  <text x="130" y="142" text-anchor="middle" fill="#cbd5e0" font-size="11">(authenticated)</text>
  <text x="130" y="170" text-anchor="middle" fill="#cbd5e0" font-size="11">design pages,</text>
  <text x="130" y="186" text-anchor="middle" fill="#cbd5e0" font-size="11">bundles, tokens,</text>
  <text x="130" y="202" text-anchor="middle" fill="#cbd5e0" font-size="11">component intents</text>

  <!-- Phase 2: Sync agent (cloud) -->
  <rect x="290" y="90" width="280" height="120" rx="10" class="box"/>
  <rect x="290" y="90" width="280" height="28" rx="10" class="pill"/>
  <text x="430" y="109" text-anchor="middle" class="pillText">CLOUD AGENT — /sync-designs</text>
  <text x="430" y="138" text-anchor="middle" fill="#ffffff" font-size="12">discover · fetch · diff vs manifest</text>
  <text x="430" y="158" text-anchor="middle" fill="#ffffff" font-size="12">extract bundles to docs/design/&lt;id&gt;/</text>
  <text x="430" y="178" text-anchor="middle" fill="#ffffff" font-size="12">file 1 Jira ticket per change</text>
  <text x="430" y="198" text-anchor="middle" fill="#ffffff" font-size="12">open single sync PR</text>

  <!-- Phase 3: Consumer agent (local) -->
  <rect x="630" y="90" width="240" height="120" rx="10" class="box"/>
  <rect x="630" y="90" width="240" height="28" rx="10" class="pill"/>
  <text x="750" y="109" text-anchor="middle" class="pillText">LOCAL AGENT — /implement-design</text>
  <text x="750" y="138" text-anchor="middle" fill="#ffffff" font-size="12">completeness gate</text>
  <text x="750" y="158" text-anchor="middle" fill="#ffffff" font-size="12">notify · implement · slice</text>
  <text x="750" y="178" text-anchor="middle" fill="#ffffff" font-size="12">spawn chips per child</text>
  <text x="750" y="198" text-anchor="middle" fill="#ffffff" font-size="12">drive to merge</text>

  <!-- Flow arrows -->
  <path d="M 230 150 L 290 150" class="arrow" marker-end="url(#arrow)"/>
  <text x="260" y="142" text-anchor="middle" class="sub">WebFetch</text>

  <path d="M 570 150 L 630 150" class="arrow" marker-end="url(#arrow)"/>
  <text x="600" y="142" text-anchor="middle" class="sub">Jira ticket</text>

  <!-- Artifacts row -->
  <text x="450" y="260" text-anchor="middle" class="title" font-size="14">Repo artifacts produced</text>

  <rect x="60" y="280" width="200" height="60" rx="8" class="artifact"/>
  <text x="160" y="305" text-anchor="middle" class="label" font-weight="700">docs/design/manifest.json</text>
  <text x="160" y="325" text-anchor="middle" class="sub">{designId, url, lastSyncedHash, jiraKey}</text>

  <rect x="290" y="280" width="200" height="60" rx="8" class="artifact"/>
  <text x="390" y="305" text-anchor="middle" class="label" font-weight="700">docs/design/&lt;id&gt;/</text>
  <text x="390" y="325" text-anchor="middle" class="sub">bundle.json · HTML · tokens · JSX</text>

  <rect x="520" y="280" width="200" height="60" rx="8" class="artifact"/>
  <text x="620" y="305" text-anchor="middle" class="label" font-weight="700">Jira (design-sync bucket)</text>
  <text x="620" y="325" text-anchor="middle" class="sub">1 ticket per changed design</text>

  <rect x="750" y="280" width="120" height="60" rx="8" class="artifact"/>
  <text x="810" y="305" text-anchor="middle" class="label" font-weight="700">Sync PR</text>
  <text x="810" y="325" text-anchor="middle" class="sub">all artifacts above</text>

  <!-- Legend -->
  <rect x="30" y="380" width="14" height="14" class="box"/>
  <text x="52" y="392" class="sub">agent step (cloud or local, user-dispatched)</text>
  <rect x="300" y="380" width="14" height="14" class="artifact"/>
  <text x="322" y="392" class="sub">repo artifact</text>
  <rect x="430" y="380" width="14" height="14" class="pill"/>
  <text x="452" y="392" class="sub">slash command entrypoint</text>

  <text x="450" y="438" text-anchor="middle" class="sub" font-style="italic">User dispatches both agents manually — there is no automatic schedule.</text>
</svg>
