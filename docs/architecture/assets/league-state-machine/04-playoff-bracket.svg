<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .col { font-size: 13px; font-weight: 600; fill: #0f172a; }
      .title { font-size: 18px; font-weight: 600; fill: #0f172a; }
      .seed { fill: #f8fafc; stroke: #334155; stroke-width: 1.2; }
      .winner { fill: #dcfce7; stroke: #166534; stroke-width: 1.5; }
      .champ { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
      .line { stroke: #64748b; stroke-width: 1.3; fill: none; }
      .sublabel { fill: #475569; font-size: 11px; font-style: italic; }
    </style>
  </defs>

  <text x="20" y="30" class="title">Playoff Bracket Formats — created by PlayoffService.createBracket</text>
  <text x="20" y="50" class="sublabel">Wildcards (lower seeds) play in, then top seeds enter at semifinals. Each round = 1 week (or 2 if multiWeekMatchups).</text>

  <!-- 4-team -->
  <text x="20" y="90" class="col">4-team format</text>
  <text x="60"  y="115" class="col">Semifinals</text>
  <text x="280" y="115" class="col">Finals</text>
  <text x="440" y="115" class="col">Champion</text>

  <g>
    <rect x="40"  y="130" width="160" height="30" rx="4" class="seed"/><text x="120" y="150" text-anchor="middle">1 vs 4</text>
    <rect x="40"  y="180" width="160" height="30" rx="4" class="seed"/><text x="120" y="200" text-anchor="middle">2 vs 3</text>
    <rect x="260" y="155" width="160" height="30" rx="4" class="winner"/><text x="340" y="175" text-anchor="middle">W(1/4) vs W(2/3)</text>
    <rect x="440" y="155" width="120" height="30" rx="4" class="champ"/><text x="500" y="175" text-anchor="middle">🏆 Champion</text>
    <path d="M200,145 L230,145 L230,170 L260,170" class="line"/>
    <path d="M200,195 L230,195 L230,170" class="line"/>
    <path d="M420,170 L440,170" class="line"/>
  </g>

  <!-- 6-team -->
  <text x="20" y="260" class="col">6-team format</text>
  <text x="60"  y="285" class="col">Wildcards</text>
  <text x="280" y="285" class="col">Semifinals</text>
  <text x="500" y="285" class="col">Finals</text>
  <text x="700" y="285" class="col">Champion</text>

  <g>
    <rect x="40"  y="300" width="160" height="30" rx="4" class="seed"/><text x="120" y="320" text-anchor="middle">3 vs 6</text>
    <rect x="40"  y="350" width="160" height="30" rx="4" class="seed"/><text x="120" y="370" text-anchor="middle">4 vs 5</text>
    <rect x="260" y="300" width="200" height="30" rx="4" class="winner"/><text x="360" y="320" text-anchor="middle">1 vs W(4/5)</text>
    <rect x="260" y="350" width="200" height="30" rx="4" class="winner"/><text x="360" y="370" text-anchor="middle">2 vs W(3/6)</text>
    <rect x="500" y="325" width="180" height="30" rx="4" class="winner"/><text x="590" y="345" text-anchor="middle">Finals</text>
    <rect x="700" y="325" width="120" height="30" rx="4" class="champ"/><text x="760" y="345" text-anchor="middle">🏆 Champion</text>
    <path d="M200,315 L230,315 L230,365 L260,365" class="line"/>
    <path d="M200,365 L230,365 L230,315 L260,315" class="line"/>
    <path d="M460,315 L480,315 L480,340 L500,340" class="line"/>
    <path d="M460,365 L480,365 L480,340" class="line"/>
    <path d="M680,340 L700,340" class="line"/>
  </g>

  <!-- 8-team note -->
  <text x="20" y="440" class="col">8-team format</text>
  <text x="20" y="465" class="sublabel">Wildcards (all 8 teams play in): 1v8, 2v7, 3v6, 4v5 → Semifinals: 2 matchups of wildcard winners → Finals.</text>
  <text x="20" y="485" class="sublabel">Three rounds total (same as 6-team); with multiWeekMatchups = true the bracket spans 6 weeks.</text>

  <!-- legend -->
  <rect x="20" y="510" width="14" height="14" class="seed"/>     <text x="42"  y="522">round 1 matchup</text>
  <rect x="180" y="510" width="14" height="14" class="winner"/>  <text x="202" y="522">advancement matchup</text>
  <rect x="380" y="510" width="14" height="14" class="champ"/>   <text x="402" y="522">championship</text>
</svg>
