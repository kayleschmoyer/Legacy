<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Console — Legacy Sports (Mockup)</title>

    <!-- HANDOFF
     Final file: "Admin Console.html" (this file). admin-styles.css holds the
     product styles; design_system/colors_and_type.css is the shared token
     foundation.

     Design intent:
     This file is a static mockup. Two surfaces shown side-by-side: a
     resizable "desktop" frame and a single iPhone frame whose inner
     viewport can be toggled between 320 / 360 / 375 / 390 / 428 (all
     inside the $xxs band — that phone frame IS the designed xxs/375
     frame). The state tab bar at the top swaps which conditional render
     is shown in BOTH surfaces simultaneously, so reviewers can compare
     layouts state-for-state.

     LS-9903: this bundle previously had zero coverage between the phone
     frame (≤428, all $xxs) and the fixed 1280px desktop frame — nothing
     exercised the $xs–$xl bands. The desktop frame's width is now driven
     by DESKTOP_WIDTHS (660 $xs / 860 $md / 1120 $xl / 1280 $xxl) and its
     .desktop-body is a real inline-size container (`admin-vp`), so the
     @container rules in admin-styles.css's BREAKPOINTS block produce a
     genuine reflow at each preset, not a rescaled screenshot of the 1280
     layout. $xs/$sm (660–859) share one reflow and $lg/$xl (980–1279)
     share the base/$xxl layout — annotated in admin-styles.css rather
     than framed separately, matching the Nav Bar bundle's convention for
     bands that don't change shape.

     Deliberate deviations: none.
     Open questions for the implementer: none outstanding.
    -->

    <link rel="stylesheet" href="design_system/colors_and_type.css" />
    <link rel="stylesheet" href="admin-styles.css" />

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
      }

      /* iPhone bezel — minimal, custom-built so we can drop our app screen
     into the inner area without React-frame coupling. */
      .iphone {
        border-radius: 56px;
        background: #0a0a0c;
        padding: 12px;
        box-shadow:
          0 0 0 1.5px #2a2c30,
          0 0 0 5px #0a0a0c,
          0 30px 80px rgba(0, 0, 0, 0.55),
          0 12px 30px rgba(0, 0, 0, 0.35);
        position: relative;
        transition: width 280ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .iphone-inner {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 44px;
        overflow: hidden;
        background: var(--bg);
      }
      .iphone .island {
        position: absolute;
        top: 22px;
        left: 50%;
        transform: translateX(-50%);
        width: 118px;
        height: 34px;
        border-radius: 22px;
        background: #000;
        z-index: 50;
      }
      .iphone .home-ind {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 134px;
        height: 5px;
        border-radius: 100px;
        background: rgba(255, 255, 255, 0.7);
        z-index: 60;
        pointer-events: none;
      }
      .iphone .status-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 54px;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 30px 0;
        pointer-events: none;
        color: #fff;
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 16px;
      }
      .iphone .status-bar .right {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .iphone .status-bar .bat {
        width: 26px;
        height: 12px;
        border: 1px solid rgba(255, 255, 255, 0.55);
        border-radius: 3px;
        position: relative;
      }
      .iphone .status-bar .bat::after {
        content: '';
        position: absolute;
        right: -3px;
        top: 3px;
        width: 2px;
        height: 4px;
        background: rgba(255, 255, 255, 0.55);
        border-radius: 1px;
      }
      .iphone .status-bar .bat::before {
        content: '';
        position: absolute;
        inset: 1.5px;
        background: #fff;
        border-radius: 1.5px;
        width: calc(100% - 5px);
      }

      /* mobile screen scrolls */
      .phone-screen {
        width: 100%;
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        padding-top: 50px; /* under status bar */
      }
      .phone-screen::-webkit-scrollbar {
        width: 0;
      }

      /* Desktop preview — bordered viewport with browser chrome.
     Width is driven by an inline style (see DESKTOP_WIDTHS in the
     script below) rather than fixed here, so the frame can be resized
     to any canonical band and .desktop-body's container query rules
     (admin-styles.css) genuinely reflow instead of just re-scaling
     a screenshot of the 1280 layout. */
      .desktop-frame {
        max-width: 100%;
        border-radius: 14px;
        overflow: hidden;
        background: var(--surface-card);
        border: 1px solid #2a3650;
        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.55),
          0 12px 30px rgba(0, 0, 0, 0.3);
        transform-origin: top center;
      }
      .desktop-chrome {
        height: 36px;
        background: linear-gradient(180deg, #1c2538, #131a2c);
        border-bottom: 1px solid #2a3650;
        display: flex;
        align-items: center;
        padding: 0 14px;
        gap: 8px;
      }
      .desktop-chrome .dots {
        display: flex;
        gap: 6px;
      }
      .desktop-chrome .dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
      }
      .desktop-chrome .dot.r {
        background: #ff5f56;
      }
      .desktop-chrome .dot.y {
        background: #ffbd2e;
      }
      .desktop-chrome .dot.g {
        background: #27c93f;
      }
      .desktop-chrome .url {
        flex: 1;
        text-align: center;
        font-family: var(--font-body);
        font-size: 11px;
        color: var(--fg4);
        letter-spacing: 0.02em;
      }
      .desktop-frame .desktop-body {
        height: 820px;
        overflow: auto;
        background: var(--bg);
        /* Real inline-size container — admin-styles.css's BREAKPOINTS
           block below queries this, not the browser viewport, so the
           reflow fires at the frame's chosen width. */
        container-type: inline-size;
        container-name: admin-vp;
      }

      /* Scaled-down desktop on small viewers */
      .desktop-scale {
        transform-origin: top left;
      }

      /* Stage layout — REVIEW SCAFFOLD ONLY. This stacks the two review
         frames (mobile + desktop) vertically once they no longer fit
         side-by-side in the reviewer's own browser window; it is not a
         product breakpoint and 1700 is not a canonical band threshold. */
      .stage-grid {
        gap: 80px;
      }
      @media (max-width: 1700px) {
        .stage-grid {
          flex-direction: column;
          align-items: center;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="app"></div>

    <script type="text/babel" src="admin-component.jsx"></script>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // State catalog grouped by phase
      const STATE_GROUPS = [
        {
          label: 'Auth',
          states: [
            { id: 'auth-check', label: 'Auth check' },
            { id: 'not-admin', label: 'Not admin' },
          ],
        },
        {
          label: 'Users',
          states: [
            { id: 'users-loading', label: 'Loading' },
            { id: 'users-error', label: 'Error' },
            { id: 'empty-search', label: 'No results' },
            { id: 'populated', label: 'Populated' },
            { id: 'impersonating', label: 'Impersonating' },
          ],
        },
        {
          label: 'JWT',
          states: [
            { id: 'jwt-empty', label: 'Empty' },
            { id: 'jwt-valid', label: 'Valid' },
            { id: 'jwt-expired', label: 'Expired' },
            { id: 'jwt-noexp', label: 'No expiry' },
            { id: 'jwt-error', label: 'Decode error' },
          ],
        },
      ];

      const PHONE_WIDTHS = [
        { w: 320, label: 'SE', device: 'iPhone SE' },
        { w: 360, label: '360', device: 'Galaxy / small Android' },
        { w: 375, label: '375', device: 'iPhone 13/14' },
        { w: 390, label: '390', device: 'iPhone 15' },
        { w: 428, label: '428', device: 'Pro Max' },
      ];

      // BREAKPOINTS: canonical bands from lib/design-tokens/src/lib/breakpoints.ts.
      // $xxs (0–659) is the phone frame above (320–428, all inside that band).
      // $xs/$sm (660–859) and $lg/$xl (980–1279) each share one layout — see the
      // BREAKPOINTS comment above the @container rules in admin-styles.css.
      const DESKTOP_WIDTHS = [
        { w: 660, label: '660', token: '$xs' },
        { w: 860, label: '860', token: '$md' },
        { w: 1120, label: '1120', token: '$xl' },
        { w: 1280, label: '1280', token: '$xxl' },
      ];

      function PhoneStatusBar({ time = '9:41' }) {
        return (
          <div className="status-bar">
            <span>{time}</span>
            <span className="right">
              <svg width="17" height="12" viewBox="0 0 17 12" fill="#fff">
                <rect x="0" y="7" width="3" height="5" rx="0.6" />
                <rect x="4.5" y="5" width="3" height="7" rx="0.6" />
                <rect x="9" y="3" width="3" height="9" rx="0.6" />
                <rect x="13.5" y="0" width="3" height="12" rx="0.6" />
              </svg>
              <svg width="15" height="11" viewBox="0 0 15 11" fill="#fff">
                <path d="M7.5 3C9.4 3 11.1 3.7 12.4 5L13.3 4.1C11.7 2.6 9.7 1.7 7.5 1.7C5.3 1.7 3.3 2.6 1.7 4.1L2.6 5C3.9 3.7 5.6 3 7.5 3Z" />
                <path d="M7.5 5.8C8.7 5.8 9.7 6.3 10.5 7L11.4 6.1C10.4 5.1 9 4.5 7.5 4.5C6 4.5 4.6 5.1 3.6 6.1L4.5 7C5.3 6.3 6.3 5.8 7.5 5.8Z" />
                <circle cx="7.5" cy="9" r="1.4" />
              </svg>
              <span className="bat" />
            </span>
          </div>
        );
      }

      function App() {
        const [state, setState] = useState('populated');
        const [phoneW, setPhoneW] = useState(375);
        const [desktopW, setDesktopW] = useState(1280);
        const [theme, setTheme] = useState('mobile'); // 'mobile' | 'desktop' | 'both'
        const [scale, setScale] = useState(1);

        // Compute desktop scale based on container width so the frame fits
        // viewers smaller than the currently selected band.
        useEffect(() => {
          const update = () => {
            const avail = window.innerWidth - 80;
            setScale(avail < desktopW ? Math.max(0.4, avail / desktopW) : 1);
          };
          update();
          window.addEventListener('resize', update);
          return () => window.removeEventListener('resize', update);
        }, [desktopW]);

        const isCompactPhone = phoneW <= 360;
        const phoneLabel =
          PHONE_WIDTHS.find((p) => p.w === phoneW)?.device || 'iPhone';
        const desktopToken =
          DESKTOP_WIDTHS.find((p) => p.w === desktopW)?.token || '$xxl';

        return (
          <>
            <div className="review-bar">
              <div className="review-bar-inner">
                <h1>
                  <span className="dot" />
                  Admin Console{' '}
                  <strong style={{ marginLeft: 6 }}>/admin</strong>
                  <span className="meta" style={{ marginLeft: 14 }}>
                    static mockup · all conditional states
                  </span>
                </h1>

                <div
                  className="surface-toggle"
                  role="tablist"
                  aria-label="Surface"
                >
                  <button
                    className={theme === 'both' ? 'on' : ''}
                    onClick={() => setTheme('both')}
                  >
                    Both
                  </button>
                  <button
                    className={theme === 'mobile' ? 'on' : ''}
                    onClick={() => setTheme('mobile')}
                  >
                    Mobile
                  </button>
                  <button
                    className={theme === 'desktop' ? 'on' : ''}
                    onClick={() => setTheme('desktop')}
                  >
                    Desktop
                  </button>
                </div>

                <div
                  className="review-tabs"
                  role="tablist"
                  aria-label="Conditional state"
                >
                  {STATE_GROUPS.map((g, gi) => (
                    <React.Fragment key={g.label}>
                      {gi > 0 && <span className="divider" />}
                      <span className="group-label">{g.label}</span>
                      {g.states.map((s) => (
                        <button
                          key={s.id}
                          className={state === s.id ? 'on' : ''}
                          onClick={() => setState(s.id)}
                        >
                          {s.label}
                        </button>
                      ))}
                    </React.Fragment>
                  ))}
                </div>

                {(theme === 'mobile' || theme === 'both') && (
                  <div
                    className="width-toggle"
                    role="tablist"
                    aria-label="Mobile width"
                  >
                    {PHONE_WIDTHS.map((p) => (
                      <button
                        key={p.w}
                        className={phoneW === p.w ? 'on' : ''}
                        onClick={() => setPhoneW(p.w)}
                        title={p.device}
                      >
                        {p.label} <span className="px">{p.w}</span>
                      </button>
                    ))}
                  </div>
                )}

                {(theme === 'desktop' || theme === 'both') && (
                  <div
                    className="width-toggle"
                    role="tablist"
                    aria-label="Desktop frame width"
                  >
                    {DESKTOP_WIDTHS.map((p) => (
                      <button
                        key={p.w}
                        className={desktopW === p.w ? 'on' : ''}
                        onClick={() => setDesktopW(p.w)}
                        title={p.token}
                      >
                        {p.token} <span className="px">{p.w}</span>
                      </button>
                    ))}
                  </div>
                )}
              </div>
            </div>

            <div className="stage">
              <div className="stage-grid">
                {(theme === 'mobile' || theme === 'both') && (
                  <div className="frame-wrap">
                    <span className="frame-caption">
                      Mobile · {phoneLabel}
                      <span className="px">{phoneW} × 812</span>
                    </span>
                    <Phone width={phoneW} state={state} compact={true} />
                  </div>
                )}

                {(theme === 'desktop' || theme === 'both') && (
                  <div className="frame-wrap">
                    <span className="frame-caption">
                      Desktop · {desktopW} · {desktopToken}
                      <span className="px">{desktopW} × 820</span>
                    </span>
                    <div
                      style={{
                        width: desktopW * scale,
                        height: 820 * scale + 36 * scale + 4,
                        position: 'relative',
                      }}
                    >
                      <div
                        className="desktop-frame desktop-scale"
                        style={{ width: desktopW, transform: `scale(${scale})` }}
                      >
                        <div className="desktop-chrome">
                          <div className="dots">
                            <span className="dot r" />
                            <span className="dot y" />
                            <span className="dot g" />
                          </div>
                          <div className="url">legacysports.app/admin</div>
                          <div style={{ width: 50 }} />
                        </div>
                        <div className="desktop-body">
                          <AdminPage state={state} compact={false} />
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>

              <footer className="foot" style={{ width: '100%' }}>
                <strong>Mockup notes</strong>
                State tabs above swap the conditional render across both
                surfaces. Search filters live (try "calloway"); accordions
                expand and collapse (Enter/Space toggles, headers are real
                buttons). Motion intent is annotated in HTML/JSX comments —
                no real animations are wired. All copy uses fictional
                placeholder data; no real users are represented.
              </footer>
            </div>
          </>
        );
      }

      function Phone({ width, state, compact }) {
        // 19.5:9 ratio for modern iPhones; SE is shorter but we keep the same frame.
        const height = Math.round((width * 19.5) / 9);
        return (
          <div
            className="iphone"
            style={{ width: width + 24, height: height + 24 }}
          >
            <div className="iphone-inner">
              <div className="island" />
              <PhoneStatusBar />
              <div className="phone-screen">
                <AdminPage state={state} compact={true} />
              </div>
              <div className="home-ind" />
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('app')).render(<App />);
    </script>
  </body>
</html>
