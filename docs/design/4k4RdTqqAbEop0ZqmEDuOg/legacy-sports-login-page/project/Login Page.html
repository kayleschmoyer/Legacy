      "Login Page - Breakpoints.html" artboard set has been re-pinned to the
      four canonical widths that actually carry distinct or boundary layouts
      (375 / 660 / 980 / 1280).
    • Explicit :focus-visible written out for every interactive element
      (brand link, nav link, OAuth buttons, email toggle, form inputs,
      submit button, back link, legal links, tweaks-panel controls) — the
      audit found only one such rule covering 5+ controls.
    • Design-intent comments added throughout src/LoginRoute.css: MOTION
      annotations for every animated/transitioning property, COMPONENT
      annotations for the three reusable patterns (brand lockup, stat-cell,
      auth card, oauth-button), and this HANDOFF block.

  OAuth button colors (Discord blurple #5865F2, Google white-on-dark) are
  UNCHANGED — LS-9004 ruled official third-party OAuth brand treatments
  exempt from the app's banned-color/background rules (docs/design/brand.md
  "Third-party brand exemption"). No fix needed there.

  OPEN QUESTION (not fixed here, flagged for a human-led follow-up per
  LS-8960's ticket note): this design still has no auth-error state or
  four-state switcher. A login page needs at minimum a visible error state
  (bad credentials / OAuth failure / network error) per PROMPT.md's
  Conditional States section — that's a design *addition*, not a source
  fix, and needs product/design input on the copy and affordance before an
  agent should draft it.
