<!doctype html>
<!--
  HANDOFF: Legacy Minigames.html is the final, single-frame mockup for the
  minigames hub + Season Draft + Disclosure flows. Route switching happens
  client-side via the ROUTES table / location hash below (no build step).

  Mechanical re-pass (LS-8959, re-run against docs/agents/pages/PROMPT.md):
  fixed a >1px gold accent stripe on .sdg-hist.me (styles-game.css), snapped
  every @media query to the canonical breakpoint bands (660/800/860/
  980/1120/1280 — see PROMPT.md "Breakpoints"), replaced raw hex repeats and
  raw 'Literata' font-family declarations with the existing --brand-*/
  --font-body custom properties, and added :focus-visible states (a global
  rule in styles.css plus per-control overrides where hover already painted
  over the default outline).

  State switcher + skeletons pass (LS-9018, follow-up to LS-8959): every
  screen (Hub, Disclosure, Season Draft Lobby/Create/Join/Game) now carries
  a visible "Preview" state switcher (button tabs, styled after the
  pre-existing .sdg-phase-toggle) toggling Loading/Error/Empty/Populated.
  Loading renders a dedicated skeleton per screen — built from the shared
  Skel primitive in components/StateSwitcher.jsx — that traces each
  screen's real geometry (hero + card grid on Hub, ticket layout on Join,
  draft header + rosters/scoreboard/history grid on Game, etc.) with the
  shimmer animation defined in styles.css (respects prefers-reduced-motion).
  Error and Empty use the new shared .state-error-card / .state-empty-card
  components. SeasonDraftJoin's old generic spinner (.sdj-loading /
  .sdj-spinner) was replaced by its skeleton — a spinner doesn't mirror
  layout geometry per PROMPT.md "Conditional States". SeasonDraftLobby's
  pre-existing data-driven empty state (.sdl-empty) is now also reachable
  from the switcher instead of only via an empty LOBBY_GAMES array. Page-
  specific states already covered by existing interaction (Disclosure's
  idle/playing/result, SeasonDraftGame's setup/drafting/completed) are left
  as reachable via their normal flows rather than duplicated in the
  switcher, since PROMPT.md's requirement is that every condition the
  reference doc defines is shown somewhere in the mockup, not that every
  control lives in one bar.

  Breakpoint coverage pass (LS-9082, follow-up to LS-9024's bundle audit):
  the mockup was a single fluid page with no dedicated xxs/xxl frames and no
  way to inspect a specific band without resizing the real browser window.
  Added a "Preview" breakpoint toggle (bottom-right on every screen, see
  BreakpointToggle below) that pins the whole app shell to one of the seven
  canonical band widths — including the two PROMPT.md always requires a
  fully designed frame for, xxs (375px) and xxl (1280px) — or back to
  Fluid. All seven bands are now each claimed by exactly one designed
  layout or an explicit BREAKPOINTS annotation:
    xxs (0-659)   -> default mobile layout, styles.css general tweak
    xs  (660)     -> shared xs media queries: styles.css, styles-hub.css,
                     styles-disclosure.css, styles-game.css,
                     styles-create.css, styles-join.css, styles-lobby.css
    sm  (800)     -> styles-game.css
    md  (860)     -> styles-create.css
    lg  (980)     -> styles-hub.css, styles-disclosure.css; shares the
                     xl (1120) layout in styles-game.css (no reflow between
                     the two there)
    xl  (1120)    -> styles-game.css
    xxl (1280)    -> styles.css .page/.appbar-inner max-width cap; shares
                     the xl layout, content centers with growing margins
  Also fixed a mislabeled BREAKPOINTS comment in styles-game.css (a 1120px
  query was annotated "lg (980)" instead of "xl (1120)" — the threshold
  was already correct, only the band name was wrong).
-->
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Legacy Sports — Minigames</title>
<link rel="icon" href="assets/favicon.ico"/>
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="styles-hub.css"/>
<link rel="stylesheet" href="styles-disclosure.css"/>
<link rel="stylesheet" href="styles-lobby.css"/>
<link rel="stylesheet" href="styles-create.css"/>
<link rel="stylesheet" href="styles-join.css"/>
<link rel="stylesheet" href="styles-game.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="components/StateSwitcher.jsx"></script>
<script type="text/babel" src="components/Hub.jsx"></script>
<script type="text/babel" src="components/Disclosure.jsx"></script>
<script type="text/babel" src="components/SeasonDraftLobby.jsx"></script>
<script type="text/babel" src="components/SeasonDraftCreate.jsx"></script>
<script type="text/babel" src="components/SeasonDraftJoin.jsx"></script>
<script type="text/babel" src="components/SeasonDraftGame.jsx"></script>

<script type="text/babel">
const TWEAKS_DEFAULTS = /*EDITMODE-BEGIN*/{
  "startRoute": "hub",
  "showBothFrames": true,
  "accentMode": "gold"
}/*EDITMODE-END*/;

const ROUTES = {
  hub: { label: 'Minigames', crumbs: [] },
  disclosure: { label: 'Who Am I?', crumbs: ['Minigames'] },
  'draft-lobby': { label: 'Season Draft', crumbs: ['Minigames'] },
  'draft-create': { label: 'New Game', crumbs: ['Minigames', 'Season Draft'] },
  'draft-join': { label: 'Join Game', crumbs: ['Minigames', 'Season Draft'] },
  'draft-game': { label: 'Live Draft', crumbs: ['Minigames', 'Season Draft'] },
};

/* BREAKPOINTS: the seven canonical bands (lib/design-tokens/src/lib/breakpoints.ts) as
   selectable preview widths — every screen renders inside the chosen frame so a reviewer
   can inspect any band on demand. xxs (375) and xxl (1280) are the two bands PROMPT.md
   requires a fully designed frame for; the rest are covered by @media reflow (see the
   BREAKPOINTS comments in styles*.css) but are just as inspectable here. */
const BREAKPOINT_FRAMES = [
  { key: 'xxs', width: 375, label: 'XXS · 375' },
  { key: 'xs', width: 660, label: 'XS · 660' },
  { key: 'sm', width: 800, label: 'SM · 800' },
  { key: 'md', width: 860, label: 'MD · 860' },
  { key: 'lg', width: 980, label: 'LG · 980' },
  { key: 'xl', width: 1120, label: 'XL · 1120' },
  { key: 'xxl', width: 1280, label: 'XXL · 1280' },
];

const BreakpointToggle = ({ frameWidth, onChange }) => (
  <div className="bp-toggle" role="group" aria-label="Breakpoint preview width">
    <span className="bp-toggle-label">Preview</span>
    <div className="toggle-group">
      <button
        type="button"
        className={frameWidth === null ? 'on' : ''}
        aria-pressed={frameWidth === null}
        onClick={() => onChange(null)}
      >Fluid</button>
      {BREAKPOINT_FRAMES.map((f) => (
        <button
          key={f.key}
          type="button"
          className={frameWidth === f.width ? 'on' : ''}
          aria-pressed={frameWidth === f.width}
          onClick={() => onChange(f.width)}
        >{f.label}</button>
      ))}
    </div>
  </div>
);

const AppBar = ({ route, onHome, onCrumb }) => {
  const meta = ROUTES[route] || ROUTES.hub;
  return (
    <header className="appbar">
      <div className="appbar-inner">
        <div className="appbar-brand" onClick={onHome}>
          <img src="assets/logo.png" alt="Legacy Sports"/>
          <div className="appbar-wordmark">Legacy Sports<small>MINIGAMES</small></div>
        </div>
        {meta.crumbs.length > 0 && (
          <nav className="appbar-crumbs">
            {meta.crumbs.map((c, i) => (
              <React.Fragment key={i}>
                <a onClick={i === 0 ? onHome : () => onCrumb(i)}>{c}</a>
                <span className="sep">/</span>
              </React.Fragment>
            ))}
            <b>{meta.label}</b>
          </nav>
        )}
        <div className="appbar-right">
          <div className="appbar-avatar">MR</div>
        </div>
      </div>
    </header>
  );
};

const App = () => {
  const [route, setRoute] = React.useState(() => {
    const hash = window.location.hash.replace('#', '');
    return ROUTES[hash] ? hash : 'hub';
  });
  const [frameWidth, setFrameWidth] = React.useState(null);

  React.useEffect(() => {
    window.location.hash = route;
  }, [route]);

  React.useEffect(() => {
    const onHash = () => {
      const h = window.location.hash.replace('#', '');
      if (ROUTES[h]) setRoute(h);
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const nav = (to) => setRoute(to);
  const home = () => setRoute('hub');

  let page;
  switch (route) {
    case 'disclosure':
      page = <Disclosure onBack={home}/>; break;
    case 'draft-lobby':
      page = <SeasonDraftLobby onBack={home} onCreate={() => nav('draft-create')} onOpenGame={() => nav('draft-game')} onJoin={() => nav('draft-join')}/>; break;
    case 'draft-create':
      page = <SeasonDraftCreate onBack={() => nav('draft-lobby')} onCreated={() => nav('draft-game')}/>; break;
    case 'draft-join':
      page = <SeasonDraftJoin onBack={() => nav('draft-lobby')} onJoined={() => nav('draft-game')}/>; break;
    case 'draft-game':
      page = <SeasonDraftGame onBack={() => nav('draft-lobby')}/>; break;
    default:
      page = <Hub onNavigate={(id) => {
        if (id === 'season-draft') nav('draft-lobby');
        else if (id === 'disclosure') nav('disclosure');
      }}/>;
  }

  const shell = (
    <div className="app-root">
      <AppBar route={route} onHome={home} onCrumb={() => home()}/>
      {page}
    </div>
  );

  const frame = BREAKPOINT_FRAMES.find((f) => f.width === frameWidth);

  return (
    <React.Fragment>
      <BreakpointToggle frameWidth={frameWidth} onChange={setFrameWidth}/>
      {frameWidth === null ? shell : (
        <div className="viewport-frame-outer">
          <div>
            <div style={{ width: frameWidth }}>{shell}</div>
            <div className="viewport-frame-label">{frame.label}px frame</div>
          </div>
        </div>
      )}
    </React.Fragment>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
