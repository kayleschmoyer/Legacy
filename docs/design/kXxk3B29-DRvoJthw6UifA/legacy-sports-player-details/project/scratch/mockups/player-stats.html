<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player Statistics — Legacy Sports</title>

    <!-- Fonts: Big Shoulders Display (scoreboard) + Literata (editorial body). No other families. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Literata:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ──────────────────────────────────────────────────────────────
   TOKENS — copied from Legacy Sports design system verbatim.
   Every hex appearing below this block must already exist here.
   ────────────────────────────────────────────────────────────── */
      :root {
        --bg-page: #0a0f1a;
        --bg-subtle: #0d1526;
        --bg-panel: #111b2f;
        --bg-elevated: #16223a;
        --bg-raised: #1c2a47;

        --gold: #c5a55a;
        --gold-light: #d4bb78;
        --gold-dark: #a68b3e;
        --seam: #c41e3a;
        --seam-light: #e63950;
        --navy: #1b3a5c;
        --navy-light: #2c4a7c;

        --fg-1: #e8edf5;
        --fg-2: #8a9bb5;
        --fg-3: #6c80ba;
        --border: #1e2d45;
        --border-soft: rgba(255, 255, 255, 0.06);
        --border-strong: rgba(255, 255, 255, 0.14);

        /* Position palette from DS — used as 1px left accent only (brief rule). */
        --pos-pitcher: #c41e3a;
        --pos-catcher: #7c8794;
        --pos-infield: #8b6f47;
        --pos-outfield: #2d6a4f;
        --pos-utility: #c5a55a;

        --radius-inline: 4px;
        --radius-input: 6px;
        --radius-badge: 8px;
        --radius-btn: 12px;
        --radius-card: 16px;
        --radius-panel: 20px;
        --radius-pill: 9999px;

        --shadow-md: 0 4px 14px rgba(8, 12, 20, 0.55);
        --shadow-lg: 0 12px 32px rgba(8, 12, 20, 0.65);

        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);

        --font-display: 'Big Shoulders Display', system-ui, sans-serif;
        --font-body: 'Literata', Georgia, serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg-page);
        color: var(--fg-1);
        font-family: var(--font-body);
        font-size: 15px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        /* Signature night-stadium wash. Fixed per DS guidance. */
        background-image:
          radial-gradient(
            ellipse at 20% 0%,
            rgba(27, 58, 92, 0.22) 0%,
            transparent 55%
          ),
          radial-gradient(
            ellipse at 80% 10%,
            rgba(196, 30, 58, 0.1) 0%,
            transparent 45%
          ),
          radial-gradient(
            ellipse at 50% 90%,
            rgba(197, 165, 90, 0.08) 0%,
            transparent 50%
          );
        background-attachment: fixed;
        min-height: 100vh;
      }

      /* Generic tabular numerals for EVERY number anywhere in the document.
   Brief: "Stats columns use tabular-nums" — applied site-wide because
   we're a stats product; mis-aligned digits anywhere would undermine trust. */
      .num,
      td,
      th,
      .stat,
      .score,
      .chip,
      input[type='number'] {
        font-variant-numeric: tabular-nums;
      }

      /* ──────────────────────────────────────────────────────────────
   REVIEWER CHROME — state switcher + viewport switcher.
   This chrome is NOT part of the product. It's the mockup's own UI
   so a reviewer can toggle the states the reference doc enumerates.
   ────────────────────────────────────────────────────────────── */
      .reviewer-bar {
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(10, 15, 26, 0.82);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border);
        padding: 10px 20px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 20px;
        font-family: var(--font-display);
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--fg-2);
      }
      .reviewer-bar .rb-label {
        color: var(--fg-3);
        font-weight: 700;
        letter-spacing: 0.18em;
      }
      .reviewer-bar .rb-group {
        display: flex;
        gap: 4px;
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: var(--radius-pill);
        padding: 4px;
      }
      .reviewer-bar .rb-group button {
        font: inherit;
        color: inherit;
        background: transparent;
        border: 0;
        padding: 7px 13px;
        border-radius: var(--radius-pill);
        cursor: pointer;
        font-weight: 700;
        letter-spacing: 0.1em;
        transition: all 150ms var(--ease);
      }
      .reviewer-bar .rb-group button.on {
        background: var(--navy);
        color: var(--fg-1);
        box-shadow: 0 1px 2px rgba(8, 12, 20, 0.4);
      }
      .reviewer-bar .rb-group button:hover:not(.on) {
        color: var(--fg-1);
      }
      .reviewer-bar .rb-spacer {
        flex: 1;
      }
      .reviewer-bar .rb-note {
        font-family: var(--font-body);
        font-size: 12px;
        text-transform: none;
        letter-spacing: 0;
        color: var(--fg-3);
        font-style: italic;
      }

      /* ──────────────────────────────────────────────────────────────
   VIEWPORT STAGE — shows mobile (375) and desktop (1280) side-by-side
   by default, or one at a time via the toggle.
   ────────────────────────────────────────────────────────────── */
      .stage {
        display: grid;
        gap: 40px;
        padding: 32px;
        grid-template-columns: 375px 1fr;
        align-items: start;
        max-width: 1720px;
        margin: 0 auto;
      }
      .stage[data-view='mobile'] {
        grid-template-columns: 375px;
        justify-content: center;
      }
      .stage[data-view='desktop'] {
        grid-template-columns: 1fr;
      }
      .stage[data-view='desktop'] .frame-mobile {
        display: none;
      }
      .stage[data-view='mobile'] .frame-desktop {
        display: none;
      }

      .viewport-heading {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--fg-3);
        margin: 0 0 10px 4px;
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .viewport-heading .dim {
        font-family: var(--font-body);
        font-weight: 400;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: none;
        color: var(--fg-3);
      }

      /* Device-ish wrapper — no bezel illustration; just a clean edge so the
   reviewer can see exactly where the viewport ends. */
      .frame {
        background: var(--bg-page);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: var(--shadow-lg);
        /* Restore the background wash inside the frame because body bg doesn't reach. */
        background-image:
          radial-gradient(
            ellipse at 20% 0%,
            rgba(27, 58, 92, 0.22) 0%,
            transparent 55%
          ),
          radial-gradient(
            ellipse at 80% 10%,
            rgba(196, 30, 58, 0.1) 0%,
            transparent 45%
          ),
          radial-gradient(
            ellipse at 50% 90%,
            rgba(197, 165, 90, 0.08) 0%,
            transparent 50%
          ),
          var(--bg-page);
      }
      .frame-mobile {
        width: 375px;
      }
      .frame-desktop {
        width: 100%;
        max-width: 1280px;
      }

      /* The app itself scrolls inside the frame so the reviewer chrome stays put. */
      .viewport {
        overflow: auto;
        max-height: calc(100vh - 140px);
      }
      .frame-mobile .viewport {
        max-height: 812px;
      } /* one iPhone 14-ish screen */

      /* ──────────────────────────────────────────────────────────────
   APP SHELL — sticky nav mirroring ui_kits/web/styles.css (.ls-nav).
   ────────────────────────────────────────────────────────────── */
      .app-nav {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(10, 15, 26, 0.75);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border);
      }
      .app-nav-inner {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 12px 20px;
        max-width: 1280px;
        margin: 0 auto;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
      }
      .brand img {
        height: 32px;
        width: auto;
        display: block;
      }
      .brand .wordmark {
        display: flex;
        flex-direction: column;
        line-height: 1;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 13px;
        letter-spacing: 0.04em;
        color: var(--gold-light);
      }
      .brand .wordmark span {
        color: var(--fg-1);
        font-size: 10px;
        letter-spacing: 0.16em;
        font-weight: 700;
        margin-top: 3px;
      }

      .primary-tabs {
        display: flex;
        gap: 2px;
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: var(--radius-pill);
        padding: 4px;
        margin-left: auto;
      }
      .primary-tabs a {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--fg-2);
        text-decoration: none;
        padding: 7px 13px;
        border-radius: var(--radius-pill);
        transition: all 150ms var(--ease);
      }
      .primary-tabs a.on {
        background: var(--navy);
        color: var(--fg-1);
      }
      .primary-tabs a:hover:not(.on) {
        color: var(--fg-1);
      }

      .nav-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .icon-btn {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--fg-2);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .icon-btn:hover {
        border-color: var(--border-strong);
        background: rgba(255, 255, 255, 0.04);
      }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--navy) 0%, var(--gold) 100%);
        border: 1px solid rgba(197, 165, 90, 0.45);
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 11px;
        color: var(--fg-1);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        letter-spacing: 0.04em;
      }

      /* Mobile — hide primary tabs, show a compact bar. */
      .frame-mobile .primary-tabs {
        display: none;
      }
      .frame-mobile .app-nav-inner {
        padding: 10px 14px;
        gap: 10px;
      }

      /* ──────────────────────────────────────────────────────────────
   PAGE SHELL
   ────────────────────────────────────────────────────────────── */
      .page {
        max-width: 1280px;
        margin: 0 auto;
        padding: 32px 24px 80px;
      }
      .frame-mobile .page {
        padding: 20px 14px 56px;
        min-width: 0;
        overflow-x: hidden;
      }
      .frame-mobile .page > * {
        min-width: 0;
        max-width: 100%;
      }

      /* Editorial page header — masthead style, not a card. The brief calls for
   "editorial hierarchy", so the page title behaves like a magazine lede: large
   condensed display head, serif dek, rule underneath. */
      .masthead {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 24px;
      }
      .masthead .eyebrow {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--gold);
      }
      .masthead h1 {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 52px;
        line-height: 0.95;
        letter-spacing: -0.02em;
        color: #ffffff;
      }
      .frame-mobile .masthead h1 {
        font-size: 36px;
      }
      .masthead .dek {
        font-family: var(--font-body);
        font-size: 16px;
        line-height: 1.55;
        color: var(--fg-2);
        max-width: 70ch; /* 70ch brief requirement */
        font-style: italic;
      }
      .masthead .meta-row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 8px;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--fg-3);
      }
      .masthead .dot {
        color: var(--gold);
      }

      /* ──────────────────────────────────────────────────────────────
   VIEW MODE TABS — Combined / Hitters / Pitchers
   Editorial treatment: gold underline on active (not a pill — keeps
   the masthead period energy).
   ────────────────────────────────────────────────────────────── */
      .view-tabs {
        display: flex;
        gap: 0;
        border-bottom: 1px solid var(--border);
        margin-bottom: 20px;
      }
      .view-tabs button {
        background: transparent;
        border: 0;
        color: var(--fg-2);
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 14px 18px;
        cursor: pointer;
        position: relative;
      }
      .view-tabs button .count {
        font-family: var(--font-body);
        font-weight: 400;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: none;
        color: var(--fg-3);
        margin-left: 6px;
      }
      .view-tabs button.on {
        color: var(--fg-1);
      }
      /* NOTE: 2px underline — NOT a border-left/right stripe. Brief allows underline. */
      .view-tabs button.on::after {
        content: '';
        position: absolute;
        left: 14px;
        right: 14px;
        bottom: -1px;
        height: 2px;
        background: var(--gold);
        border-radius: 2px;
      }

      /* ──────────────────────────────────────────────────────────────
   FILTER BAR — search + faceted dropdowns + page size + actions.
   Laid out as a single horizontal band, not a card grid; it's a
   control surface, not content.
   ────────────────────────────────────────────────────────────── */
      .filters {
        display: grid;
        grid-template-columns:
          minmax(240px, 1.3fr) repeat(3, minmax(130px, 1fr))
          auto auto;
        gap: 10px;
        padding: 14px;
        background: var(--bg-subtle);
        border: 1px solid var(--border);
        border-radius: var(--radius-panel);
        margin-bottom: 14px;
      }
      .frame-mobile .filters {
        grid-template-columns: 1fr 1fr;
        padding: 10px;
        gap: 8px;
        border-radius: var(--radius-card);
      }
      .frame-mobile .filters .field-search {
        grid-column: 1 / -1;
      }
      .frame-mobile .filters .field-actions {
        grid-column: 1 / -1;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .frame-mobile .filters {
        min-width: 0;
      }
      .frame-mobile .filters .field {
        min-width: 0;
      }
      .frame-mobile .filters .field select,
      .frame-mobile .filters .field input {
        min-width: 0;
        width: 100%;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .field label {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--fg-3);
        padding-left: 2px;
      }
      .field .input,
      .field select {
        appearance: none;
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: var(--radius-input);
        color: var(--fg-1);
        font-family: var(--font-body);
        font-size: 14px;
        padding: 9px 12px;
        outline: 0;
        transition: border-color 150ms var(--ease);
        /* MOTION: 150ms border color shift on focus; no motion on layout. */
      }
      .field .input:focus,
      .field select:focus {
        border-color: var(--navy-light);
      }
      .field .input::placeholder {
        color: var(--fg-3);
        font-style: italic;
      }

      .field.with-icon {
        position: relative;
      }
      .field.with-icon .input {
        padding-left: 34px;
      }
      .field.with-icon .icon {
        position: absolute;
        left: 11px;
        top: calc(50% + 7px);
        transform: translateY(-50%);
        width: 14px;
        height: 14px;
        color: var(--fg-3);
      }
      .field select {
        background-image:
          linear-gradient(45deg, transparent 50%, var(--fg-3) 50%),
          linear-gradient(135deg, var(--fg-3) 50%, transparent 50%);
        background-position:
          calc(100% - 14px) 17px,
          calc(100% - 9px) 17px;
        background-size:
          5px 5px,
          5px 5px;
        background-repeat: no-repeat;
        padding-right: 26px;
      }
      .field-actions {
        display: flex;
        align-items: flex-end;
        gap: 8px;
      }

      .btn {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 10px 14px;
        border-radius: var(--radius-btn);
        border: 1px solid var(--border);
        background: var(--bg-panel);
        color: var(--fg-1);
        cursor: pointer;
        transition: all 150ms var(--ease);
        /* MOTION: 150ms color/border hover; press translateY(-1px). */
        display: inline-flex;
        align-items: center;
        gap: 6px;
        /* Touch target — ≥44×44 on mobile handled by min-height below */
      }
      .btn:hover {
        border-color: var(--border-strong);
        background: var(--bg-elevated);
      }
      .btn-primary {
        background: var(--navy);
        border-color: var(--navy-light);
      }
      .btn-primary:hover {
        background: var(--navy-light);
      }
      .btn-gold {
        background: var(--gold);
        color: #111;
        border-color: var(--gold-dark);
      }
      .btn-gold:hover {
        background: var(--gold-light);
      }
      .btn-sm {
        padding: 7px 11px;
        font-size: 10px;
      }
      .btn-ghost {
        background: transparent;
      }

      /* Touch targets — annotated for reviewer. */
      .frame-mobile .btn {
        min-height: 44px;
        padding-left: 16px;
        padding-right: 16px;
      } /* ≥44px tap target */

      /* ──────────────────────────────────────────────────────────────
   ACTIVE FILTER CHIPS — surfaces current state of the faceted query
   without requiring the user to revisit each dropdown.
   ────────────────────────────────────────────────────────────── */
      .active-filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0 2px 16px;
        align-items: center;
      }
      .active-filters .label-inline {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--fg-3);
        margin-right: 4px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 10px 5px 12px;
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: var(--radius-pill);
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--fg-1);
      }
      .chip .chip-key {
        color: var(--fg-3);
        margin-right: 2px;
      }
      .chip button {
        background: transparent;
        border: 0;
        color: var(--fg-3);
        cursor: pointer;
        padding: 0;
        width: 16px;
        height: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
      }
      .chip button:hover {
        background: rgba(255, 255, 255, 0.08);
        color: var(--fg-1);
      }
      .chip-clear-all {
        background: transparent;
        border: 0;
        color: var(--gold-light);
        font-family: var(--font-body);
        font-size: 13px;
        font-style: italic;
        cursor: pointer;
        padding: 4px 8px;
      }
      .chip-clear-all:hover {
        color: var(--gold);
      }

      /* ──────────────────────────────────────────────────────────────
   RESULTS META — rowcount + page selector + export/share.
   ────────────────────────────────────────────────────────────── */
      .results-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 4px 14px;
        font-family: var(--font-body);
        font-size: 13px;
        color: var(--fg-2);
      }
      .results-meta strong {
        font-family: var(--font-display);
        font-weight: 800;
        color: var(--fg-1);
        font-size: 15px;
        letter-spacing: 0.02em;
      }
      .results-meta .right {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .results-meta .page-size {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--fg-3);
      }
      .results-meta .page-size select {
        padding: 6px 24px 6px 10px;
        font-size: 12px;
      }

      /* ──────────────────────────────────────────────────────────────
   STATS TABLE — the heart of the page. Dense, crisp, editorial.
   Bigger visual weight than a generic admin table because "data is
   the product" per the brief.
   ────────────────────────────────────────────────────────────── */
      .stats-table-wrap {
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        overflow: hidden;
        box-shadow: var(--shadow-md);
        /* Horizontal scroll for narrow viewports — stats tables demand wide real estate. */
        overflow-x: auto;
      }
      .stats-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        min-width: 980px;
      }
      .frame-mobile .stats-table {
        min-width: 860px;
      } /* horizontal scroll inside frame */

      .stats-table thead th {
        background: var(--bg-panel);
        border-bottom: 1px solid var(--border);
        padding: 12px 10px;
        text-align: right;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--fg-2);
        white-space: nowrap;
        position: sticky;
        top: 0;
        cursor: pointer;
        user-select: none;
      }
      .stats-table thead th.sticky-left {
        position: sticky;
        left: 0;
        z-index: 2;
        background: var(--bg-panel);
        text-align: left;
      }
      .stats-table thead th .sort {
        color: var(--fg-3);
        margin-left: 4px;
        font-size: 10px;
      }
      .stats-table thead th.sorted {
        color: var(--gold-light);
      }
      .stats-table thead th.sorted .sort {
        color: var(--gold);
      }

      .stats-table tbody td {
        padding: 12px 10px;
        border-bottom: 1px solid var(--border);
        font-family: var(--font-display);
        font-weight: 600; /* condensed for density */
        font-size: 15px;
        color: var(--fg-1);
        text-align: right;
        white-space: nowrap;
      }
      .stats-table tbody td.sticky-left {
        position: sticky;
        left: 0;
        background: var(--bg-elevated);
        text-align: left;
      }
      .stats-table tbody tr:hover td {
        background: var(--bg-raised);
      }
      .stats-table tbody tr:hover td.sticky-left {
        background: var(--bg-raised);
      }

      /* Player cell — name in serif (reverence), team/pos in condensed */
      .player-cell {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-left: 4px;
      }
      .player-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        flex: none;
        background: var(--bg-raised);
        border: 1px solid var(--border);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 12px;
        letter-spacing: 0.04em;
        color: var(--fg-1);
      }
      .player-name {
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 15px;
        color: var(--fg-1);
        display: flex;
        flex-direction: column;
        line-height: 1.25;
      }
      .player-name .name {
        white-space: nowrap;
      }
      .player-name .era {
        font-family: var(--font-body);
        font-style: italic;
        font-weight: 400;
        font-size: 11px;
        color: var(--fg-3);
        letter-spacing: 0.02em;
      }

      /* Position chip — DS spec. 1px accent comes from the position chip only,
   NOT a border stripe on the row (which would violate the brief). */
      .pos-chip {
        display: inline-flex;
        align-items: center;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 10px;
        letter-spacing: 0.1em;
        padding: 3px 7px;
        border-radius: var(--radius-inline);
        color: #fff;
        min-width: 30px;
        justify-content: center;
      }
      .pos-P {
        background: var(--pos-pitcher);
      }
      .pos-C {
        background: var(--pos-catcher);
        color: #111;
      }
      .pos-IF {
        background: var(--pos-infield);
      }
      .pos-OF {
        background: var(--pos-outfield);
      }
      .pos-U {
        background: var(--pos-utility);
        color: #111;
      }

      .team-abbr {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.08em;
        color: var(--fg-2);
      }

      /* Leader highlight — gold for the best value in a stat column.
   Used for HR, RBI, AVG leaders in populated state to give the table
   a "headline" layer of reading without decorative accents. */
      .leader {
        color: var(--gold-light);
      }
      .leader::after {
        content: '';
        display: inline-block;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--gold);
        margin-left: 6px;
        vertical-align: middle;
        transform: translateY(-1px);
      }

      /* ──────────────────────────────────────────────────────────────
   PAGINATION
   ────────────────────────────────────────────────────────────── */
      .pagination {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 4px 0;
        font-family: var(--font-body);
        font-size: 13px;
        color: var(--fg-2);
        flex-wrap: wrap;
        gap: 10px;
      }
      .frame-mobile .pagination {
        justify-content: center;
        text-align: center;
      }
      .frame-mobile .pagination .pager {
        flex-wrap: wrap;
        justify-content: center;
      }
      .frame-mobile .pagination .meta,
      .frame-mobile .pagination .rows-per-page {
        width: 100%;
        text-align: center;
      }
      .pagination .pager {
        display: flex;
        gap: 4px;
      }
      .pagination .pager button {
        min-width: 34px;
        height: 34px;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--fg-2);
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.04em;
        border-radius: var(--radius-input);
        cursor: pointer;
        transition: all 150ms var(--ease);
      }
      .pagination .pager button:hover {
        border-color: var(--border-strong);
        color: var(--fg-1);
      }
      .pagination .pager button.on {
        background: var(--navy);
        color: var(--fg-1);
        border-color: var(--navy-light);
      }
      .pagination .pager button[disabled] {
        opacity: 0.35;
        cursor: not-allowed;
      }

      /* ──────────────────────────────────────────────────────────────
   STATE — LOADING (skeleton shimmer mirroring table geometry)
   ────────────────────────────────────────────────────────────── */
      /* MOTION: skeleton shimmer, 1.4s linear infinite; honor prefers-reduced-motion. */
      @keyframes shimmer {
        0% {
          background-position: -400px 0;
        }
        100% {
          background-position: 400px 0;
        }
      }
      .skel {
        display: inline-block;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.04) 0%,
          rgba(255, 255, 255, 0.1) 50%,
          rgba(255, 255, 255, 0.04) 100%
        );
        background-size: 800px 100%;
        background-repeat: no-repeat;
        background-color: rgba(255, 255, 255, 0.04);
        border-radius: 4px;
        animation: shimmer 1.4s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .skel {
          animation: none;
        }
      }

      .skel-block {
        display: block;
        height: 14px;
      }
      .skel-row td {
        padding: 14px 10px;
      }
      .skel-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
      }
      .skel-pill {
        width: 34px;
        height: 18px;
        border-radius: var(--radius-inline);
      }

      /* ──────────────────────────────────────────────────────────────
   STATE — ERROR
   ────────────────────────────────────────────────────────────── */
      .error-card {
        display: flex;
        gap: 20px;
        align-items: flex-start;
        padding: 28px;
        background: var(--bg-elevated);
        border: 1px solid rgba(196, 30, 58, 0.35);
        border-radius: var(--radius-card);
        box-shadow: var(--shadow-md);
      }
      .error-card .icon-wrap {
        flex: none;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgba(196, 30, 58, 0.12);
        border: 1px solid rgba(196, 30, 58, 0.4);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--seam-light);
      }
      .error-card h3 {
        margin: 0 0 6px;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 22px;
        color: var(--fg-1);
        letter-spacing: -0.005em;
      }
      .error-card p {
        margin: 0 0 14px;
        color: var(--fg-2);
        max-width: 70ch;
        font-family: var(--font-body);
      }
      .error-card code {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 12px;
        color: var(--fg-3);
        background: rgba(255, 255, 255, 0.03);
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid var(--border);
      }
      .error-card .err-actions {
        display: flex;
        gap: 10px;
        margin-top: 4px;
      }

      /* ──────────────────────────────────────────────────────────────
   STATE — EMPTY
   Editorial illustration: a faint crosshatched scorecard with the
   mockup-fictional caption "No at-bats for that query." Uses existing
   palette tokens only.
   ────────────────────────────────────────────────────────────── */
      .empty-card {
        padding: 48px 32px 56px;
        background: var(--bg-elevated);
        border: 1px dashed var(--border-strong);
        border-radius: var(--radius-card);
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .empty-card .illus {
        width: 120px;
        height: 120px;
        color: var(--fg-3);
      }
      .empty-card h3 {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 28px;
        color: var(--fg-1);
        letter-spacing: -0.01em;
      }
      .empty-card p {
        margin: 0;
        max-width: 56ch;
        color: var(--fg-2);
        font-style: italic;
      }
      .empty-card .suggestions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-top: 6px;
      }

      /* ──────────────────────────────────────────────────────────────
   DETAIL MODAL PREVIEW — in the brief, clicking a player opens the
   Player Detail modal. We render a compact summary of it in the
   same file under the 'Populated' state so reviewers can see how
   the detail view relates without leaving the page.
   Shown below the table; NOT a state.
   ────────────────────────────────────────────────────────────── */
      .detail-preview {
        margin-top: 40px;
        padding: 24px;
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: var(--radius-panel);
      }
      .detail-preview .dp-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 18px;
      }
      .detail-preview .dp-title h2 {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 32px;
        letter-spacing: -0.01em;
        color: #ffffff;
        line-height: 1;
      }
      .detail-preview .dp-title .sub {
        font-family: var(--font-body);
        color: var(--fg-2);
        margin-top: 6px;
        font-style: italic;
      }
      .detail-preview .dp-title .positions {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      .detail-preview .hero-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 22px;
      }
      .frame-mobile .detail-preview .hero-stats {
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .frame-mobile .detail-preview {
        padding: 16px;
      }
      .frame-mobile .detail-preview .hero-stat {
        padding: 10px 10px;
      }
      .frame-mobile .detail-preview .hero-stat .value {
        font-size: 22px;
      }
      .frame-mobile .detail-preview .hero-stat .label {
        font-size: 9px;
      }
      .hero-stat {
        padding: 16px 18px;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .hero-stat .label {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--fg-3);
      }
      .hero-stat .value {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 36px;
        line-height: 1;
        color: var(--fg-1);
        font-variant-numeric: tabular-nums;
      }
      .hero-stat.accent .value {
        color: var(--gold-light);
      }

      /* Career summary cards */
      .career-cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr) 1.3fr;
        gap: 8px;
      }
      .frame-mobile .career-cards {
        grid-template-columns: repeat(2, 1fr);
      }
      .career-stat {
        padding: 14px 16px;
        background: var(--bg-subtle);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .career-stat .k {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--fg-3);
      }
      .career-stat .v {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 22px;
        color: var(--fg-1);
        font-variant-numeric: tabular-nums;
      }

      /* Detail tabs */
      .detail-tabs {
        display: flex;
        gap: 2px;
        margin-top: 22px;
        border-bottom: 1px solid var(--border);
        overflow-x: auto;
      }
      .detail-tabs button {
        background: transparent;
        border: 0;
        color: var(--fg-2);
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 12px 14px;
        cursor: pointer;
        position: relative;
        white-space: nowrap;
      }
      .detail-tabs button.on {
        color: var(--fg-1);
      }
      /* MOTION: crossfade, 140ms, on tab switch (annotation only) */
      .detail-tabs button.on::after {
        content: '';
        position: absolute;
        left: 14px;
        right: 14px;
        bottom: -1px;
        height: 2px;
        background: var(--gold);
        border-radius: 2px;
      }

      /* Mini career-arc chart — inline SVG, no external libs; stand-in for Recharts. */
      .career-arc {
        margin-top: 18px;
        padding: 18px 16px 8px;
        background: var(--bg-subtle);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
      }
      .career-arc .legend {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--fg-3);
        margin-bottom: 8px;
      }
      .career-arc .legend .right {
        color: var(--fg-2);
      }
      .career-arc svg {
        width: 100%;
        display: block;
      }

      /* Season table (inside detail preview) — slimmer than main stats table */
      .season-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        margin-top: 18px;
        min-width: 620px;
      }
      .season-table th {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--fg-3);
        text-align: right;
        padding: 10px 10px;
        border-bottom: 1px solid var(--border);
      }
      .season-table th:first-child {
        text-align: left;
      }
      .season-table td {
        padding: 10px 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 14px;
        color: var(--fg-1);
        text-align: right;
      }
      .season-table td:first-child {
        text-align: left;
        color: var(--gold-light);
      }
      .season-table tbody tr:hover td {
        background: rgba(255, 255, 255, 0.02);
      }
      .season-table-wrap {
        overflow-x: auto;
      }

      /* Utility */
      .sr-only {
        position: absolute !important;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .hide {
        display: none !important;
      }

      /* Responsive collapse — desktop preview at narrow widths */
      @media (max-width: 900px) {
        .stage {
          grid-template-columns: 1fr !important;
          padding: 16px;
        }
        .stage .frame-mobile {
          margin: 0 auto;
        }
      }
    </style>
  </head>
  <body>
    <!-- ──────────────────────────────────────────────────────────────
     REVIEWER CHROME
     ────────────────────────────────────────────────────────────── -->
    <div
      class="reviewer-bar"
      role="toolbar"
      aria-label="Mockup reviewer controls"
    >
      <span class="rb-label">State</span>
      <div class="rb-group" id="state-switcher">
        <button data-state="populated" class="on">Populated</button>
        <button data-state="loading">Loading</button>
        <button data-state="error">Error</button>
        <button data-state="empty">Empty</button>
      </div>

      <span class="rb-label">Viewport</span>
      <div class="rb-group" id="view-switcher">
        <button data-view="both" class="on">Both</button>
        <button data-view="mobile">Mobile 375</button>
        <button data-view="desktop">Desktop 1280</button>
      </div>

      <span class="rb-spacer"></span>
      <span class="rb-note"
        >Route · <strong style="color: var(--fg-2)">/players/stats</strong> ·
        click a row to see the detail modal</span
      >
    </div>

    <main class="stage" id="stage" data-view="both" data-state="populated">
      <!-- ──────────────────────────────────────────────────────────
       MOBILE FRAME (375px)
       ────────────────────────────────────────────────────────── -->
      <section class="frame-column">
        <h2 class="viewport-heading">
          Mobile <span class="dim">375 × 812</span>
        </h2>
        <div class="frame frame-mobile">
          <div class="viewport" id="vp-mobile">
            <!-- content injected by renderPage() -->
          </div>
        </div>
      </section>

      <!-- ──────────────────────────────────────────────────────────
       DESKTOP FRAME (1280px)
       ────────────────────────────────────────────────────────── -->
      <section class="frame-column">
        <h2 class="viewport-heading">
          Desktop <span class="dim">1280 × flex</span>
        </h2>
        <div class="frame frame-desktop">
          <div class="viewport" id="vp-desktop">
            <!-- content injected by renderPage() -->
          </div>
        </div>
      </section>
    </main>

    <!-- ──────────────────────────────────────────────────────────────
     SVG ICON SPRITE (inline so the file stays self-contained).
     Style: Lucide-ish 1.8px stroke, two-tone with seam-red or gold accent.
     ────────────────────────────────────────────────────────────── -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <!-- Search (magnifier) -->
        <symbol
          id="i-search"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </symbol>
        <!-- Chevron down -->
        <symbol
          id="i-chevron-down"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m6 9 6 6 6-6" />
        </symbol>
        <!-- Sliders -->
        <symbol
          id="i-sliders"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M4 6h10" />
          <path d="M18 6h2" />
          <path d="M4 12h4" />
          <path d="M12 12h8" />
          <path d="M4 18h12" />
          <path d="M20 18h0" />
          <circle cx="16" cy="6" r="2" />
          <circle cx="10" cy="12" r="2" />
          <circle cx="18" cy="18" r="2" />
        </symbol>
        <!-- Share -->
        <symbol
          id="i-share"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="18" cy="5" r="2.5" />
          <circle cx="6" cy="12" r="2.5" />
          <circle cx="18" cy="19" r="2.5" />
          <path d="m8.2 10.8 7.6-4.4" />
          <path d="m8.2 13.2 7.6 4.4" />
        </symbol>
        <!-- Download -->
        <symbol
          id="i-download"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 4v12" />
          <path d="m7 11 5 5 5-5" />
          <path d="M5 20h14" />
        </symbol>
        <!-- Bell -->
        <symbol
          id="i-bell"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 7H4c0-1 2-2 2-7Z" />
          <path d="M10 19a2 2 0 0 0 4 0" />
          <!-- Seam-red accent dot signalling unread -->
          <circle cx="18" cy="6" r="2.5" fill="#C41E3A" stroke="none" />
        </symbol>
        <!-- Warning (used in error state) -->
        <symbol
          id="i-warning"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M10.3 3.5 2.5 17.5A2 2 0 0 0 4.2 20.5h15.6a2 2 0 0 0 1.7-3L13.7 3.5a2 2 0 0 0-3.4 0Z"
          />
          <path d="M12 10v5" />
          <path d="M12 18.5v.01" />
        </symbol>
        <!-- Baseball scorecard (for empty illustration) -->
        <symbol
          id="i-scorecard"
          viewBox="0 0 120 120"
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <!-- Paper -->
          <rect x="18" y="14" width="84" height="96" rx="6" />
          <!-- Header rule -->
          <path d="M26 26h68" />
          <path d="M26 32h40" opacity=".7" />

            <th>SB</th><th>R</th><th>2B</th><th>3B</th><th>BB</th><th>SO</th>
            <th>AVG</th><th>OBP</th><th>SLG</th><th>oWAR</th>
          </tr>
        </thead>
        <tbody>${skelRows}</tbody>
      </table>
    </div>
  `;
      }

      /* Error — red-bordered card with retry. Neutral/actionable voice per DS. */
      function renderError() {
        return `
    <div class="error-card" role="alert">
      <div class="icon-wrap">
        <svg width="22" height="22" aria-hidden="true"><use href="#i-warning"/></svg>
      </div>
      <div>
        <h3>Unable to load player statistics</h3>
        <p>We couldn't reach the stats service. The rest of the league is still up — this affects only the player almanac. Your filter state has been preserved; we'll re-run the query when you retry.</p>
        <p style="margin:10px 0 14px;font-size:13px;color:var(--fg-3)">
          Request ID · <code>stats.query.7fc1c2</code> · 503 after 3 retries
        </p>
        <div class="err-actions">
          <button class="btn btn-primary" type="button">Retry</button>
          <button class="btn btn-ghost" type="button">Clear filters &amp; retry</button>
        </div>
      </div>
    </div>
  `;
      }

      /* Empty — "No at-bats for that query". Scorecard illustration in DS palette. */
      function renderEmpty() {
        return `
    <div class="empty-card" role="status">
      <svg class="illus" aria-hidden="true"><use href="#i-scorecard"/></svg>
      <h3>No at-bats for that query.</h3>
      <p>No catchers on the <strong style="color:var(--fg-1);font-style:normal">San Diego Padres</strong> hit more than 350 home runs between 1901 and 1919. Widen any one of these and try again.</p>
      <div class="suggestions">
        <button class="chip" type="button">Drop HR minimum</button>
        <button class="chip" type="button">Any era</button>
        <button class="chip" type="button">Any team</button>
      </div>
    </div>
  `;
      }

      /* Pagination */
      function renderPagination() {
        return `
    <div class="pagination" aria-label="Pagination">
      <span>Showing <strong style="color:var(--fg-1);font-family:var(--font-display);font-weight:800">1–25</strong> of <strong style="color:var(--fg-1);font-family:var(--font-display);font-weight:800">1,247</strong></span>
      <div class="pager">
        <button disabled aria-label="First page">«</button>
        <button disabled aria-label="Previous page">‹</button>
        <button class="on" aria-current="page">1</button>
        <button>2</button>
        <button>3</button>
        <button>…</button>
        <button>50</button>
        <button aria-label="Next page">›</button>
        <button aria-label="Last page">»</button>
      </div>
    </div>
  `;
      }

      /* Detail-preview: not a separate page state; this is a contextual
   preview anchored under the table so reviewers can see how a row-click
   navigates to the Player Detail modal without leaving the stats page. */
      function renderDetailPreview(isMobile) {
        /* Simple inline SVG career arc — AVG by year, 2014–2025 for Ortiz-Lang. */
        const pts = [
          0.271, 0.284, 0.296, 0.314, 0.308, 0.321, 0.303, 0.299, 0.317, 0.324,
          0.311, 0.305,
        ];
        const yrs = [
          2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024,
          2025,
        ];
        const W = 640,
          H = 130,
          PAD = 24;
        const xs = pts.map(
          (_, i) => PAD + i * ((W - PAD * 2) / (pts.length - 1)),
        );
        const minV = Math.min(...pts) - 0.01;
        const maxV = Math.max(...pts) + 0.01;
        const ys = pts.map(
          (v) => PAD + (1 - (v - minV) / (maxV - minV)) * (H - PAD * 2),
        );
        const path = xs
          .map(
            (x, i) => (i ? 'L' : 'M') + x.toFixed(1) + ' ' + ys[i].toFixed(1),
          )
          .join(' ');
        const area =
          path +
          ` L ${xs[xs.length - 1].toFixed(1)} ${H - PAD} L ${xs[0].toFixed(1)} ${H - PAD} Z`;

        return `
    <!-- Detail modal preview — rendered INLINE under the table for review purposes.
         In-app this opens as a full-page modal over the list (see detail.md). -->
    <section class="detail-preview" aria-label="Player detail modal — preview">
      <header class="dp-head">
        <div class="dp-title">
          <span class="eyebrow" style="color:var(--gold)">Player Detail · Opens as Modal</span>
          <h2 style="margin-top:6px">Ruben Ortiz-Lang</h2>
          <div class="sub">12 seasons · New York Yankees · bats L / throws L</div>
          <div class="positions">
            <span class="pos-chip pos-OF">OF</span>
            <span class="pos-chip pos-OF">CF</span>
            <span class="pos-chip pos-OF">LF</span>
            <span class="pos-chip pos-U">DH</span>
          </div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-sm btn-ghost" type="button">← Back</button>
          <button class="btn btn-sm btn-ghost" type="button">Close</button>
        </div>
      </header>

      <!-- Hero stats — three glance numbers for hitters: AVG · HR · RBI -->
      <div class="hero-stats" aria-label="Career hero stats">
        <div class="hero-stat accent">
          <span class="label">Career AVG</span>
          <span class="value">.305</span>
        </div>
        <div class="hero-stat">
          <span class="label">Home Runs</span>
          <span class="value">438</span>
        </div>
        <div class="hero-stat">
          <span class="label">RBI</span>
          <span class="value">1,284</span>
        </div>
      </div>

      <!-- Career summary cards — condensed 4-up row. Brief says "treat different information differently" —
           this is "Career Batting", explicitly NOT the same template as the main stats row. -->
      <div class="career-cards">
        <div class="career-stat"><span class="k">Games</span><span class="v">1,742</span></div>
        <div class="career-stat"><span class="k">Hits</span><span class="v">1,926</span></div>
        <div class="career-stat"><span class="k">Stolen Bases</span><span class="v">121</span></div>
        <div class="career-stat"><span class="k">oWAR (Offensive Wins Above Replacement)</span><span class="v">58.4</span></div>
      </div>

      <!-- Tabs — dynamic per player: Career Arc / Batting / Pitching / Fielding -->
      <div class="detail-tabs" role="tablist" aria-label="Detail tabs">
        <button class="on" role="tab">Career Arc</button>
        <button role="tab">Batting</button>
        <button role="tab">Fielding</button>
      </div>

      <!-- Career Arc — inline SVG stand-in for Recharts.
           Style matches DS: gold line, single area fill, subtle grid dots only. -->
      <div class="career-arc">
        <div class="legend">
          <span>Batting Average by Season · 2014–2025</span>
          <span class="right">Peak · <strong style="color:var(--gold-light)">.324 (2023)</strong></span>
        </div>
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
          <defs>
            <linearGradient id="arc-fill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#C5A55A" stop-opacity="0.28"/>
              <stop offset="100%" stop-color="#C5A55A" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <!-- Baseline grid -->
          ${[0.25, 0.5, 0.75]
            .map((f) => {
              const y = PAD + f * (H - PAD * 2);
              return `<line x1="${PAD}" x2="${W - PAD}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,0.06)" />`;
            })
            .join('')}
          <path d="${area}" fill="url(#arc-fill)" />
          <path d="${path}" fill="none" stroke="#C5A55A" stroke-width="1.6" />
          ${xs.map((x, i) => `<circle cx="${x}" cy="${ys[i]}" r="${i === 8 ? 4 : 2.2}" fill="${i === 8 ? '#D4BB78' : '#0A0F1A'}" stroke="#C5A55A" stroke-width="1.4"/>`).join('')}
          ${xs.map((x, i) => (i % 3 === 0 || i === xs.length - 1 ? `<text x="${x}" y="${H - 6}" text-anchor="middle" font-family="Big Shoulders Display" font-size="10" fill="#6C80BA" letter-spacing="0.1em">${yrs[i]}</text>` : '')).join('')}
        </svg>
      </div>

      <!-- Season table — newest first, drops the leading zero on rate stats. -->
      <div class="season-table-wrap">
        <table class="season-table" aria-label="Season batting">
          <thead>
            <tr>
              <th>Year</th><th>G</th><th>PA</th><th>AB</th><th>H</th><th>HR</th><th>RBI</th><th>SB</th><th>AVG</th><th>OBP</th><th>SLG</th>
            </tr>
          </thead>
          <tbody>
            ${[
              [2025, 146, 629, 554, 169, 38, 112, 11, 0.305, 0.368, 0.554],
              [2024, 152, 648, 571, 178, 41, 121, 14, 0.311, 0.372, 0.571],
              [2023, 149, 632, 553, 179, 44, 128, 17, 0.324, 0.385, 0.598],
              [2022, 142, 601, 527, 167, 39, 117, 12, 0.317, 0.374, 0.581],
              [2021, 138, 574, 508, 152, 32, 98, 15, 0.299, 0.359, 0.528],
              [2020, 58, 247, 216, 65, 14, 38, 6, 0.301, 0.361, 0.528],
            ]
              .map(
                (r) => `
              <tr>
                <td>${r[0]}</td><td>${fi(r[1])}</td><td>${fi(r[2])}</td><td>${fi(r[3])}</td>
                <td>${fi(r[4])}</td><td>${fi(r[5])}</td><td>${fi(r[6])}</td><td>${fi(r[7])}</td>
                <td>${f3(r[8])}</td><td>${f3(r[9])}</td><td>${f3(r[10])}</td>
              </tr>
            `,
              )
              .join('')}
          </tbody>
        </table>
      </div>
    </section>
  `;
      }

      /* ──────────────────────────────────────────────────────────
   Reviewer chrome wiring
   ────────────────────────────────────────────────────────── */
      const stage = document.getElementById('stage');
      const vpMobile = document.getElementById('vp-mobile');
      const vpDesktop = document.getElementById('vp-desktop');

      function renderAll() {
        const state = stage.dataset.state;
        vpMobile.innerHTML = renderApp(state, true);
        vpDesktop.innerHTML = renderApp(state, false);
      }

      document
        .getElementById('state-switcher')
        .addEventListener('click', (e) => {
          const btn = e.target.closest('button[data-state]');
          if (!btn) return;
          document
            .querySelectorAll('#state-switcher button')
            .forEach((b) => b.classList.toggle('on', b === btn));
          stage.dataset.state = btn.dataset.state;
          /* MOTION: states crossfade on switch — 140ms. We don't implement it here; the
     brief asks for annotation only. The renderAll swap is instant. */
          renderAll();
        });

      document
        .getElementById('view-switcher')
        .addEventListener('click', (e) => {
          const btn = e.target.closest('button[data-view]');
          if (!btn) return;
          document
            .querySelectorAll('#view-switcher button')
            .forEach((b) => b.classList.toggle('on', b === btn));
          stage.dataset.view = btn.dataset.view;
        });

      renderAll();
    </script>
  </body>
</html>
