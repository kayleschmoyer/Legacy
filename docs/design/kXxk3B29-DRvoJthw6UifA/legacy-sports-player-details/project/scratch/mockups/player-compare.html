<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player Comparison — Legacy Sports</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Literata:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-page: #0a0f1a;
        --bg-subtle: #0d1526;
        --bg-panel: #111b2f;
        --bg-elevated: #16223a;
        --bg-raised: #1c2a47;
        --gold: #c5a55a;
        --gold-light: #d4bb78;
        --gold-dark: #a68b3e;
        --seam: #c41e3a;
        --seam-light: #e63950;
        --navy: #1b3a5c;
        --navy-light: #2c4a7c;
        --fg-1: #e8edf5;
        --fg-2: #8a9bb5;
        --fg-3: #6c80ba;
        --border: #1e2d45;
        --border-strong: rgba(255, 255, 255, 0.14);
        /* Comparison slot accents (per spec) */
        --slot-0: #c5a55a;
        --slot-1: #60a5fa;
        --slot-2: #34d399;
        --slot-3: #f87171;
        --radius-input: 6px;
        --radius-btn: 12px;
        --radius-card: 16px;
        --radius-panel: 20px;
        --radius-pill: 9999px;
        --shadow-md: 0 4px 14px rgba(8, 12, 20, 0.55);
        --shadow-lg: 0 12px 32px rgba(8, 12, 20, 0.65);
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        --font-display: 'Big Shoulders Display', system-ui, sans-serif;
        --font-body: 'Literata', Georgia, serif;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg-page);
        color: var(--fg-1);
        font-family: var(--font-body);
        font-size: 15px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        background-image:
          radial-gradient(
            ellipse at 20% 0%,
            rgba(27, 58, 92, 0.22) 0%,
            transparent 55%
          ),
          radial-gradient(
            ellipse at 80% 10%,
            rgba(196, 30, 58, 0.1) 0%,
            transparent 45%
          ),
          radial-gradient(
            ellipse at 50% 90%,
            rgba(197, 165, 90, 0.08) 0%,
            transparent 50%
          );
        background-attachment: fixed;
        min-height: 100vh;
      }
      td,
      th,
      .stat,
      .num {
        font-variant-numeric: tabular-nums;
      }

      .reviewer-bar {
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(10, 15, 26, 0.82);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border);
        padding: 10px 20px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 20px;
        font-family: var(--font-display);
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--fg-2);
      }
      .reviewer-bar .rb-label {
        color: var(--fg-3);
        font-weight: 700;
        letter-spacing: 0.18em;
      }
      .reviewer-bar .rb-group {
        display: flex;
        gap: 4px;
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: var(--radius-pill);
        padding: 4px;
      }
      .reviewer-bar .rb-group button {
        font: inherit;
        color: inherit;
        background: transparent;
        border: 0;
        padding: 7px 13px;
        border-radius: var(--radius-pill);
        cursor: pointer;
        font-weight: 700;
        letter-spacing: 0.1em;
        transition: all 150ms var(--ease);
      }
      .reviewer-bar .rb-group button.on {
        background: var(--navy);
        color: var(--fg-1);
      }
      .reviewer-bar .rb-group button:hover:not(.on) {
        color: var(--fg-1);
      }
      .reviewer-bar .rb-spacer {
        flex: 1;
      }
      .reviewer-bar .rb-note {
        font-family: var(--font-body);
        font-size: 12px;
        text-transform: none;
        letter-spacing: 0;
        color: var(--fg-3);
        font-style: italic;
      }

      .stage {
        display: grid;
        gap: 40px;
        padding: 32px;
        grid-template-columns: 375px 1fr;
        align-items: start;
        max-width: 1720px;
        margin: 0 auto;
      }
      .stage[data-view='mobile'] {
        grid-template-columns: 375px;
        justify-content: center;
      }
      .stage[data-view='desktop'] {
        grid-template-columns: 1fr;
      }
      .stage[data-view='desktop'] .frame-mobile {
        display: none;
      }
      .stage[data-view='mobile'] .frame-desktop {
        display: none;
      }
      .viewport-heading {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--fg-3);
        margin: 0 0 10px 4px;
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      .viewport-heading .dim {
        font-family: var(--font-body);
        font-weight: 400;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: none;
      }
      .frame {
        background: var(--bg-page);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: var(--shadow-lg);
        background-image:
          radial-gradient(
            ellipse at 20% 0%,
            rgba(27, 58, 92, 0.22) 0%,
            transparent 55%
          ),
          radial-gradient(
            ellipse at 80% 10%,
            rgba(196, 30, 58, 0.1) 0%,
            transparent 45%
          ),
          radial-gradient(
            ellipse at 50% 90%,
            rgba(197, 165, 90, 0.08) 0%,
            transparent 50%
          ),
          var(--bg-page);
      }
      .frame-mobile {
        width: 375px;
      }
      .frame-desktop {
        width: 100%;
        max-width: 1280px;
      }
      .viewport {
        overflow: auto;
        max-height: calc(100vh - 140px);
      }
      .frame-mobile .viewport {
        max-height: 812px;
      }

      .app-nav {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(10, 15, 26, 0.75);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border);
      }
      .app-nav-inner {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 12px 20px;
        max-width: 1280px;
        margin: 0 auto;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
      }
      .brand img {
        height: 32px;
      }
      .brand .wordmark {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 13px;
        letter-spacing: 0.04em;
        color: var(--gold-light);
        line-height: 1;
        display: flex;
        flex-direction: column;
      }
      .brand .wordmark span {
        color: var(--fg-1);
        font-size: 10px;
        letter-spacing: 0.16em;
        margin-top: 3px;
      }
      .primary-tabs {
        display: flex;
        gap: 2px;
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: var(--radius-pill);
        padding: 4px;
        margin-left: auto;
      }
      .primary-tabs a {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--fg-2);
        text-decoration: none;
        padding: 7px 13px;
        border-radius: var(--radius-pill);
      }
      .primary-tabs a.on {
        background: var(--navy);
        color: var(--fg-1);
      }
      .frame-mobile .primary-tabs {
        display: none;
      }
      .nav-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--navy), var(--gold));
        border: 1px solid rgba(197, 165, 90, 0.45);
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 11px;
        color: var(--fg-1);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .page {
        max-width: 1280px;
        margin: 0 auto;
        padding: 32px 24px 80px;
      }
      .frame-mobile .page {
        padding: 20px 14px 56px;
        min-width: 0;
        overflow-x: hidden;
      }
      .frame-mobile .page > * {
        min-width: 0;
        max-width: 100%;
      }

      /* Premium gate — gold-bordered strip on top of the page. Persists even in populated state
   because the feature is premium-gated per spec. */
      .gate {
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 14px 18px;
        background: linear-gradient(
          90deg,
          rgba(197, 165, 90, 0.1),
          rgba(197, 165, 90, 0.02)
        );
        border: 1px solid rgba(197, 165, 90, 0.35);
        border-radius: var(--radius-card);
        margin-bottom: 22px;
      }
      .frame-mobile .gate {
        flex-wrap: wrap;
        gap: 10px;
        padding: 12px 14px;
      }
      .frame-mobile .gate .copy p {
        font-size: 12px;
      }
      .frame-mobile .gate .btn {
        margin-left: auto;
      }
      .gate .lock {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        flex: none;
        background: rgba(197, 165, 90, 0.15);
        color: var(--gold-light);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .gate .copy {
        flex: 1;
      }
      .gate .copy strong {
        font-family: var(--font-display);
        font-weight: 800;
        letter-spacing: 0.04em;
        color: var(--gold-light);
        font-size: 13px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .gate .copy p {
        margin: 2px 0 0;
        font-family: var(--font-body);
        color: var(--fg-2);
        font-size: 13px;
      }
      .btn {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 10px 14px;
        border-radius: var(--radius-btn);
        border: 1px solid var(--border);
        background: var(--bg-panel);
        color: var(--fg-1);
        cursor: pointer;
        transition: all 150ms var(--ease);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn:hover {
        border-color: var(--border-strong);
        background: var(--bg-elevated);
      }
      .btn-primary {
        background: var(--navy);
        border-color: var(--navy-light);
      }
      .btn-gold {
        background: var(--gold);
        color: #111;
        border-color: var(--gold-dark);
      }
      .frame-mobile .btn {
        min-height: 44px;
      }

      .masthead {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 22px;
      }
      .masthead .eyebrow {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--gold);
      }
      .masthead h1 {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 52px;
        line-height: 0.95;
        letter-spacing: -0.02em;
        color: #fff;
      }
      .frame-mobile .masthead h1 {
        font-size: 34px;
      }
      .masthead .dek {
        font-family: var(--font-body);
        font-size: 16px;
        line-height: 1.55;
        color: var(--fg-2);
        max-width: 70ch;
        font-style: italic;
      }

      /* Selection row — search + slot chips */
      .selector {
        background: var(--bg-subtle);
        border: 1px solid var(--border);
        border-radius: var(--radius-panel);
        padding: 14px;
        margin-bottom: 22px;
      }
      .frame-mobile .selector {
        padding: 12px;
      }
      .frame-mobile .selector .field {
        flex-basis: auto;
        width: 100%;
      }
      .frame-mobile .selector .input {
        width: 100%;
        min-width: 0;
      }
      .frame-mobile .slots {
        gap: 6px;
      }
      .frame-mobile .slot-chip {
        font-size: 11px;
        padding: 5px 8px 5px 6px;
        max-width: 100%;
      }
      .frame-mobile .slot-chip > span:not(.dot):not(.x) {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 140px;
      }
      .selector .top {
        display: flex;
        gap: 12px;
        align-items: flex-end;
        flex-wrap: wrap;
      }
      .frame-mobile .selector .top {
        flex-direction: column;
        align-items: stretch;
      }
      .selector .field {
        flex: 1 1 320px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        position: relative;
      }
      .selector .field label {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--fg-3);
        padding-left: 2px;
      }
      .selector .input {
        appearance: none;
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: var(--radius-input);
        color: var(--fg-1);
        font-family: var(--font-body);
        font-size: 14px;
        padding: 10px 14px;
        outline: 0;
        transition: border-color 150ms var(--ease);
      }
      .selector .input:focus {
        border-color: var(--navy-light);
      }
      .selector .input[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .selector .input::placeholder {
        color: var(--fg-3);
        font-style: italic;
      }
      .selector .hint {
        font-family: var(--font-body);
        font-size: 13px;
        color: var(--fg-3);
        font-style: italic;
        margin-top: 2px;
      }

      /* Slot chips */
      .slots {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 14px;
      }
      .slot-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px 6px 8px;
        border: 1px solid;
        border-radius: var(--radius-pill);
        background: var(--bg-panel);
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.06em;
        color: var(--fg-1);
      }
      .slot-chip .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: none;
      }
      .slot-chip .serif {
        font-family: var(--font-body);
        font-weight: 500;
        letter-spacing: 0;
      }
      .slot-chip .x {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: transparent;
        border: 0;
        color: var(--fg-3);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .slot-chip .x:hover {
        background: rgba(255, 255, 255, 0.08);
        color: var(--fg-1);
      }
      .slot-chip.s0 {
        border-color: rgba(197, 165, 90, 0.5);
      }
      .slot-chip.s0 .dot {
        background: var(--slot-0);
      }
      .slot-chip.s1 {
        border-color: rgba(96, 165, 250, 0.5);
      }
      .slot-chip.s1 .dot {
        background: var(--slot-1);
      }
      .slot-chip.s2 {
        border-color: rgba(52, 211, 153, 0.5);
      }
      .slot-chip.s2 .dot {
        background: var(--slot-2);
      }
      .slot-chip.s3 {
        border-color: rgba(248, 113, 113, 0.5);
      }
      .slot-chip.s3 .dot {
        background: var(--slot-3);
      }
      .slot-chip .count {
        font-size: 10px;
        color: var(--fg-3);
        letter-spacing: 0.12em;
      }

      /* Suggestions dropdown */
      .dropdown {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        right: 0;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        box-shadow: var(--shadow-lg);
        z-index: 5;
        overflow: hidden;
      }
      .dropdown .opt {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        cursor: pointer;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      }
      .dropdown .opt:last-child {
        border-bottom: 0;
      }
      .dropdown .opt:hover {
        background: var(--bg-raised);
      }
      .dropdown .opt .l {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .dropdown .opt .name {
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 14px;
        color: var(--fg-1);
      }
      .dropdown .opt .era {
        font-family: var(--font-body);
        font-size: 12px;
        color: var(--fg-3);
        font-style: italic;
      }
      .dropdown .opt .r {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.08em;
        color: var(--fg-3);
        text-transform: uppercase;
      }

      /* Comparison section head */
      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin: 32px 0 14px;
        flex-wrap: wrap;
      }
      .frame-mobile .section-head {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
      .frame-mobile .section-head .meta {
        font-size: 12px;
      }
      .section-head h2 {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 22px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--fg-1);
      }
      .section-head .meta {
        font-family: var(--font-body);
        font-size: 13px;
        color: var(--fg-3);
        font-style: italic;
      }

      /* Comparison table — columns per player, rows per stat. */
      .cmp-wrap {
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        overflow: hidden;
        box-shadow: var(--shadow-md);
        background: var(--bg-elevated);
        overflow-x: auto;
      }
      .cmp {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        min-width: 720px;
      }
      .frame-mobile .cmp {
        min-width: 0;
      }
      .frame-mobile .cmp thead th {
        padding: 10px 6px;
        font-size: 9px;
        letter-spacing: 0.08em;
      }
      .frame-mobile .cmp thead th.stat-col {
        min-width: 90px;
        width: 38%;
      }
      .frame-mobile .cmp thead th.player-col {
        width: auto;
        padding: 10px 6px;
      }
      .frame-mobile .cmp thead .pname .name {
        font-size: 12px;
        line-height: 1.1;
      }
      .frame-mobile .cmp thead .pname .era {
        font-size: 9px;
      }
      .frame-mobile .cmp thead .pname .line {
        width: 20px;
        height: 2px;
        margin-top: 4px;
      }
      .frame-mobile .cmp tbody td {
        padding: 9px 6px;
        font-size: 13px;
      }
      .frame-mobile .cmp tbody td.stat-col {
        font-size: 12px;
      }
      .frame-mobile .cmp tbody td.stat-col .desc {
        font-size: 10px;
      }
      .frame-mobile .cmp tbody td.best::after {
        content: '';
        padding: 0;
        margin: 0;
      }
      .frame-mobile .cmp tbody td.best::before {
        margin-right: 3px;
      }
      .frame-mobile .cmp .group-row td {
        font-size: 10px;
        padding: 8px 10px;
        letter-spacing: 0.14em;
      }
      .cmp thead th {
        background: var(--bg-panel);
        border-bottom: 1px solid var(--border);
        padding: 16px 14px;
        text-align: left;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--fg-2);
        position: sticky;
        top: 0;
      }
      .cmp thead th.stat-col {
        width: 34%;
        min-width: 180px;
      }
      .cmp thead th.player-col {
        width: 22%;
        text-align: right;
        border-left: 1px solid var(--border);
      }
      .cmp thead .pname {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 2px;
      }
      .cmp thead .pname .name {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 18px;
        letter-spacing: 0;
        color: var(--fg-1);
        text-transform: none;
      }
      .cmp thead .pname .era {
        font-family: var(--font-body);
        font-style: italic;
        font-size: 11px;
        color: var(--fg-3);
        letter-spacing: 0.02em;
        text-transform: none;
      }
      .cmp thead .pname .line {
        display: inline-block;
        width: 32px;
        height: 3px;
        border-radius: 2px;
        margin-top: 6px;
      }
      .cmp thead th.p0 .pname .line {
        background: var(--slot-0);
      }
      .cmp thead th.p1 .pname .line {
        background: var(--slot-1);
      }
      .cmp thead th.p2 .pname .line {
        background: var(--slot-2);
      }
      .cmp thead th.p3 .pname .line {
        background: var(--slot-3);
      }

      .cmp .group-row td {
        background: var(--bg-subtle);
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--gold-light);
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
      }
      .cmp tbody td {
        padding: 13px 14px;
        border-bottom: 1px solid var(--border);
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 16px;
        color: var(--fg-1);
        text-align: right;
      }
      .cmp tbody td.stat-col {
        text-align: left;
        font-family: var(--font-body);
        font-weight: 500;
        font-size: 14px;
        color: var(--fg-2);
      }
      .cmp tbody td.stat-col .desc {
        display: block;
        font-family: var(--font-body);
        font-weight: 400;
        font-size: 11px;
        color: var(--fg-3);
        font-style: italic;
        margin-top: 1px;
      }
      .cmp tbody tr:last-child td {
        border-bottom: 0;
      }
      .cmp tbody td.best {
        color: var(--gold-light);
        position: relative;
      }
      .cmp tbody td.best::before {
        content: '▲';
        display: inline-block;
        color: var(--gold);
        font-size: 9px;
        margin-right: 6px;
        transform: translateY(-2px);
      }
      .cmp tbody td.best::after {
        content: 'BEST';
        display: inline-block;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 9px;
        letter-spacing: 0.16em;
        background: rgba(197, 165, 90, 0.14);
        color: var(--gold);
        padding: 2px 6px;
        border-radius: 3px;
        margin-left: 8px;
        vertical-align: middle;
      }

      /* Season breakdown per player */
      .season-block {
        margin-top: 22px;
        padding: 18px;
        background: var(--bg-subtle);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        border-top-width: 3px;
      }
      .frame-mobile .season-block {
        padding: 14px;
      }
      .frame-mobile .season-block .sh {
        flex-wrap: wrap;
        gap: 4px;
      }
      .frame-mobile .season-block .sh h3 {
        font-size: 17px;
      }
      .frame-mobile .season-block .sh .era {
        width: 100%;
        font-size: 11px;
      }
      .season-block.s0 {
        border-top-color: var(--slot-0);
      }
      .season-block.s1 {
        border-top-color: var(--slot-1);
      }
      .season-block.s2 {
        border-top-color: var(--slot-2);
      }
      .season-block.s3 {
        border-top-color: var(--slot-3);
      }
      .season-block .sh {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 12px;
      }
      .season-block .sh h3 {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 20px;
        color: var(--fg-1);
        letter-spacing: -0.005em;
      }
      .season-block .sh .era {
        font-family: var(--font-body);
        font-style: italic;
        color: var(--fg-3);
        font-size: 12px;
      }
      .sb-table-wrap {
        overflow-x: auto;
      }
      .sb-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        min-width: 620px;
      }
      .sb-table th {
        padding: 10px 10px;
        border-bottom: 1px solid var(--border);
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--fg-3);
        text-align: right;
      }
      .sb-table th:first-child {
        text-align: left;
      }
      .sb-table td {
        padding: 10px 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 14px;
        color: var(--fg-1);
        text-align: right;
        white-space: nowrap;
      }
      .sb-table td:first-child {
        text-align: left;
        color: var(--gold-light);
        font-weight: 800;
        letter-spacing: 0.04em;
      }
      .sb-table tbody tr:last-child td {
        border-bottom: 0;
      }

      /* Empty (0 players) */
      .empty-card {
        padding: 60px 32px;
        background: var(--bg-elevated);
        border: 1px dashed var(--border-strong);
        border-radius: var(--radius-card);
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .frame-mobile .empty-card {
        padding: 40px 20px;
      }
      .frame-mobile .empty-card h3 {
        font-size: 24px;
      }
      .empty-card h3 {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 30px;
        color: var(--fg-1);
        letter-spacing: -0.01em;
      }
      .empty-card p {
        margin: 0;
        max-width: 56ch;
        color: var(--fg-2);
        font-style: italic;
      }
      .empty-card .illus {
        width: 140px;
        height: 110px;
        color: var(--fg-3);
      }

      /* 1 player — "add at least 2" nudge */
      .nudge {
        padding: 22px;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .frame-mobile .nudge {
        padding: 16px;
        gap: 12px;
      }
      .frame-mobile .nudge .num {
        font-size: 34px;
      }
      .frame-mobile .nudge .t {
        font-size: 15px;
      }
      .frame-mobile .nudge .d {
        font-size: 13px;
      }
      .nudge .num {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 44px;
        color: var(--gold);
        line-height: 1;
      }
      .nudge .t {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 17px;
        color: var(--fg-1);
        letter-spacing: 0.02em;
      }
      .nudge .d {
        margin: 4px 0 0;
        color: var(--fg-2);
        font-style: italic;
      }

      /* Loading */
      @keyframes shimmer {
        0% {
          background-position: -400px 0;
        }
        100% {
          background-position: 400px 0;
        }
      }
      .skel {
        display: inline-block;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.04) 0%,
          rgba(255, 255, 255, 0.1) 50%,
          rgba(255, 255, 255, 0.04) 100%
        );
        background-size: 800px 100%;
        background-repeat: no-repeat;
        background-color: rgba(255, 255, 255, 0.04);
        border-radius: 4px;
        animation: shimmer 1.4s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .skel {
          animation: none;
        }
      }

      /* Error */
      .error-card {
        display: flex;
        gap: 20px;
        align-items: flex-start;
        padding: 28px;
        background: var(--bg-elevated);
        border: 1px solid rgba(196, 30, 58, 0.35);
        border-radius: var(--radius-card);
        box-shadow: var(--shadow-md);
      }
      .frame-mobile .error-card {
        flex-direction: column;
        padding: 20px;
        gap: 12px;
      }
      .error-card .icon-wrap {
        flex: none;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgba(196, 30, 58, 0.12);
        border: 1px solid rgba(196, 30, 58, 0.4);
        color: var(--seam-light);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .error-card h3 {
        margin: 0 0 6px;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 22px;
        color: var(--fg-1);
      }
      .error-card p {
        margin: 0 0 14px;
        color: var(--fg-2);
        max-width: 70ch;
        font-family: var(--font-body);
      }

      @media (max-width: 900px) {
        .stage {
          grid-template-columns: 1fr !important;
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>

    <div

    <script>
      /* Three fictional players for the 'Populated' state. */
      const PLAYERS = [
        {
          slot: 0,
          name: 'Ruben Ortiz-Lang',
          era: '2014–2025',
          pos: 'OF',
          F: { fantasy: 482.4, avg: 3.31, hit: 312.1, pitch: 0, field: 170.3 },
          B: {

            H: 1926,
            HR: 438,
            RBI: 1284,

            AVG: 0.305,
            OBP: 0.372,
            SLG: 0.558,
          },
          A: { AS: 3, MVP: 1, CY: 0, GG: 2, SS: 2, WS: 1 },
          seasons: [
            [2025, 146, 629, 554, 169, 38, 112, 11, 0.305, 0.368, 0.554],
            [2024, 152, 648, 571, 178, 41, 121, 14, 0.311, 0.372, 0.571],
            [2023, 149, 632, 553, 179, 44, 128, 17, 0.324, 0.385, 0.598],
            [2022, 142, 601, 527, 167, 39, 117, 12, 0.317, 0.374, 0.581],
          ],
        },
        {
          slot: 1,
          name: 'Otis Lamarr',
          era: '1978–1994',
          pos: 'OF',
          F: { fantasy: 538.1, avg: 3.57, hit: 341.2, pitch: 0, field: 196.9 },
          B: {
            G: 2214,
            H: 2681,
            HR: 512,
            RBI: 1611,
            R: 1420,
            SB: 57,
            BB: 744,
            TB: 4811,
            oWAR: 74.3,
            AVG: 0.319,
            OBP: 0.375,
            SLG: 0.592,
          },
          A: { AS: 9, MVP: 2, CY: 0, GG: 4, SS: 3, WS: 2 },
          seasons: [
            [1994, 152, 658, 588, 189, 34, 108, 4, 0.321, 0.378, 0.567],
            [1993, 149, 632, 562, 188, 41, 128, 6, 0.334, 0.391, 0.612],
            [1992, 151, 648, 574, 192, 38, 122, 5, 0.335, 0.388, 0.601],
            [1991, 144, 608, 538, 171, 33, 104, 3, 0.318, 0.371, 0.553],
          ],
        },
        {
          slot: 2,
          name: 'Henry Keogh',
          era: '2009–2024',
          pos: '1B',
          F: { fantasy: 501.7, avg: 3.28, hit: 298.5, pitch: 0, field: 203.2 },
          B: {
            G: 1908,
            H: 2145,
            HR: 412,
            RBI: 1397,
            R: 1192,
            SB: 22,
            BB: 782,
            TB: 3827,
            oWAR: 62.1,
            AVG: 0.302,
            OBP: 0.371,
            SLG: 0.549,
          },
          A: { AS: 5, MVP: 0, CY: 0, GG: 3, SS: 4, WS: 0 },
          seasons: [
            [2024, 141, 601, 528, 160, 28, 104, 1, 0.303, 0.371, 0.541],
            [2023, 149, 638, 563, 177, 34, 118, 2, 0.314, 0.384, 0.574],
            [2022, 152, 652, 578, 174, 32, 112, 1, 0.301, 0.367, 0.531],
            [2021, 148, 627, 556, 168, 31, 108, 3, 0.302, 0.369, 0.547],
          ],
        },
      ];

      const f3 = (n) => n.toFixed(3).replace(/^0/, '');
      const f2 = (n) => n.toFixed(2);
      const fi = (n) => n.toLocaleString('en-US');

      /* Stat-row definitions */
      const GROUPS = [
        {
          title: 'Fantasy Scoring Projections',
          rows: [
            {
              k: 'Fantasy Score',
              desc: 'Projected season total',
              path: 'F.fantasy',
              fmt: f2,
              higher: true,
            },
            {
              k: 'Avg Pts / Game',
              desc: 'Across all seasons',
              path: 'F.avg',
              fmt: f2,
              higher: true,
            },
            {
              k: 'Hitter Score',
              desc: '',
              path: 'F.hit',
              fmt: f2,
              higher: true,
            },
            {
              k: 'Field Score',
              desc: '',
              path: 'F.field',
              fmt: f2,
              higher: true,
            },
          ],
        },
        {
          title: 'Career Batting',
          rows: [
            { k: 'Games', path: 'B.G', fmt: fi, higher: true },
            { k: 'Hits', path: 'B.H', fmt: fi, higher: true },
            { k: 'Home Runs', path: 'B.HR', fmt: fi, higher: true },
            { k: 'RBI', path: 'B.RBI', fmt: fi, higher: true },
            { k: 'Runs', path: 'B.R', fmt: fi, higher: true },
            { k: 'Stolen Bases', path: 'B.SB', fmt: fi, higher: true },
            { k: 'Walks', path: 'B.BB', fmt: fi, higher: true },
            { k: 'Total Bases', path: 'B.TB', fmt: fi, higher: true },
            {
              k: 'oWAR',
              desc: 'Offensive Wins Above Replacement',
              path: 'B.oWAR',
              fmt: f2,
              higher: true,
            },
            { k: 'Avg Season AVG', path: 'B.AVG', fmt: f3, higher: true },
            { k: 'Avg Season OBP', path: 'B.OBP', fmt: f3, higher: true },
            { k: 'Avg Season SLG', path: 'B.SLG', fmt: f3, higher: true },
          ],
        },
        {
          title: 'Career Achievements',
          rows: [
            { k: 'All-Star Selections', path: 'A.AS', fmt: fi, higher: true },
            { k: 'MVP Awards', path: 'A.MVP', fmt: fi, higher: true },
            { k: 'Cy Young Awards', path: 'A.CY', fmt: fi, higher: true },
            { k: 'Gold Gloves', path: 'A.GG', fmt: fi, higher: true },
            { k: 'Silver Sluggers', path: 'A.SS', fmt: fi, higher: true },
            { k: 'World Series Rings', path: 'A.WS', fmt: fi, higher: true },
          ],
        },
      ];

      function get(obj, path) {
        return path.split('.').reduce((o, k) => o?.[k], obj);
      }

      function renderApp(state, isMobile) {
        return `
    ${renderNav(isMobile)}
    <div class="page">
      ${renderGate()}
      ${renderMasthead()}
      ${renderSelector(state)}
      ${renderBody(state, isMobile)}
    </div>
  `;
      }

      function renderNav(isMobile) {
        return `
    <nav class="app-nav">
      <div class="app-nav-inner">
        <a href="#" class="brand"><img src="../../assets/logo.png" alt=""/><div class="wordmark">LEGACY SPORTS<span>FANTASY BASEBALL</span></div></a>
        ${
          isMobile
            ? ''
            : `
          <div class="primary-tabs">
            <a href="#">Home</a><a href="#">Leagues</a><a href="#">Scoreboard</a>
            <a href="#" class="on">Players</a><a href="#">Draft</a>
          </div>
        `
        }
        <div class="nav-right"><div class="avatar">MB</div></div>
      </div>
    </nav>
  `;
      }

      function renderGate() {
        /* The feature is premium-gated per spec. We keep the gate copy visible
     (subscriber context) rather than showing a full lock screen, which would
     hide the real content from reviewers. */
        return `
    <div class="gate" role="note">
      <div class="lock"><svg width="18" height="18"><use href="#i-lock"/></svg></div>
      <div class="copy">
        <strong>Premium · Player Comparison</strong>
        <p>Compare up to 4 players side-by-side with career stats, scoring projections, and season breakdowns.</p>
      </div>
      <button class="btn btn-gold" type="button">Subscribed</button>
    </div>
  `;
      }

      function renderMasthead() {
        return `
    <header class="masthead">
      <span class="eyebrow">Premium · Head-to-Head</span>
      <h1>Compare up to four.</h1>
      <p class="dek">Set legends beside stars beside rookies, line up the numbers that actually decide a draft, and read the whole story across eras.</p>
    </header>
  `;
      }

      function renderSelector(state) {
        /* Slots visible reflect current state */
        const used = state === 'populated' ? 3 : state === 'one' ? 1 : 0;
        const locked = used >= 4;
        const visiblePlayers = PLAYERS.slice(0, used);

        return `
    <!-- Selection surface — search autocomplete + per-slot chips.
         MOTION: dropdown fade+slide 150ms ease-standard; chips scale-in 120ms. -->
    <section class="selector" aria-label="Player selection">
      <div class="top">
        <div class="field">
          <label for="cmp-search">Add player · up to 4</label>
          <input id="cmp-search" class="input" type="search"
            placeholder="${locked ? '4 players selected — remove one to add more' : 'Search player name…'}"
            value="${used === 0 ? '' : ''}"
            ${locked ? 'disabled' : ''}/>
          <span class="hint">${used < 2 ? 'Add at least 2 players to run the comparison.' : `${used} of 4 selected · ${4 - used} slot${4 - used === 1 ? '' : 's'} open`}</span>
          ${
            used === 0
              ? `
          <div class="dropdown" role="listbox" aria-label="Player suggestions">
            <div class="opt"><div class="l"><span class="name">Ruben Ortiz-Lang</span><span class="era">OF · NYY · 2014–2025</span></div><span class="r">.305 AVG · 438 HR</span></div>
            <div class="opt"><div class="l"><span class="name">Otis Lamarr</span><span class="era">OF · CHC · 1978–1994</span></div><span class="r">.319 AVG · 512 HR</span></div>
            <div class="opt"><div class="l"><span class="name">Henry Keogh</span><span class="era">1B · BOS · 2009–2024</span></div><span class="r">.302 AVG · 412 HR</span></div>
            <div class="opt"><div class="l"><span class="name">Preston Walden Jr.</span><span class="era">OF · SFG · 1962–1977</span></div><span class="r">.306 AVG · 349 HR</span></div>
          </div>`
              : ''
          }
        </div>
      </div>
      ${
        used > 0
          ? `
      <div class="slots" aria-label="Selected players">
        ${visiblePlayers
          .map(
            (p, i) => `
          <span class="slot-chip s${i}">
            <span class="dot" aria-hidden="true"></span>
            <span>${p.name}</span>
            <span class="serif" style="color:var(--fg-3)">· ${p.era}</span>
            <button class="x" aria-label="Remove ${p.name}">×</button>
          </span>
        `,
          )
          .join('')}
        ${Array.from({ length: 4 - used })
          .map(
            (_, i) => `
          <span class="slot-chip" style="border-style:dashed; border-color:var(--border); color:var(--fg-3)">
            <span class="dot" style="background:var(--border-strong)"></span>
            <span class="serif" style="font-style:italic">Slot ${used + i + 1} · empty</span>
          </span>
        `,
          )
          .join('')}
      </div>
      `
          : ''
      }
    </section>
  `;
      }

      function renderBody(state, isMobile) {
        if (state === 'loading') return renderLoading();
        if (state === 'error') return renderError();
        if (state === 'empty') return renderEmptyState();
        if (state === 'one') return renderOnePlayer();
        return renderPopulated(isMobile);
      }

      function renderPopulated(isMobile) {
        const players = PLAYERS;
        const tableRows = GROUPS.map((g) => {
          const rows = g.rows
            .map((row) => {
              const vals = players.map((p) => get(p, row.path));
              const best = row.higher ? Math.max(...vals) : Math.min(...vals);
              const cells = vals
                .map((v, i) => {
                  const isBest =
                    v === best && vals.filter((x) => x === best).length === 1;
                  return `<td class="${isBest ? 'best' : ''}">${row.fmt(v)}</td>`;
                })
                .join('');
              return `
        <tr>
          <td class="stat-col">${row.k}${row.desc ? `<span class="desc">${row.desc}</span>` : ''}</td>
          ${cells}
        </tr>
      `;
            })
            .join('');
          return `
      <tr class="group-row"><td colspan="${1 + players.length}">${g.title}</td></tr>
      ${rows}
    `;
        }).join('');

        return `
    <div class="section-head">
      <h2>Head-to-Head</h2>
      <span class="meta">Gold ▲ marks the leader in each row · ties show no leader</span>
    </div>
    <!-- MOTION: table rows stagger-fade 140ms on data refresh; honor prefers-reduced-motion (crossfade only). -->
    <div class="cmp-wrap">
      <table class="cmp" aria-label="Player comparison table">
        <thead>
          <tr>
            <th class="stat-col" scope="col">Metric</th>
            ${players
              .map(
                (p, i) => `
              <th class="player-col p${i}" scope="col">
                <div class="pname">
                  <span class="name">${p.name}</span>
                  <span class="era">${p.pos} · ${p.era}</span>
                  <span class="line" aria-hidden="true"></span>
                </div>
              </th>
            `,
              )
              .join('')}
          </tr>
        </thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>

    <div class="section-head">
      <h2>Season by Season</h2>
      <span class="meta">Four most recent per player · full log inside Player Detail</span>
    </div>
    ${players
      .map(
        (p, i) => `
      <section class="season-block s${i}" aria-label="Seasons for ${p.name}">
        <div class="sh">
          <h3 style="color: var(--slot-${i})">${p.name}</h3>
          <span class="era">${p.pos} · ${p.era} · showing 4 of ${12 + i * 2} seasons</span>
        </div>
        <div class="sb-table-wrap">
          <table class="sb-table" aria-label="Season batting for ${p.name}">
            <thead>
              <tr><th>Year</th><th>G</th><th>PA</th><th>AB</th><th>H</th><th>HR</th><th>RBI</th><th>SB</th><th>AVG</th><th>OBP</th><th>SLG</th></tr>
            </thead>
            <tbody>
              ${p.seasons
                .map(
                  (r) => `
                <tr>
                  <td>${r[0]}</td><td>${fi(r[1])}</td><td>${fi(r[2])}</td><td>${fi(r[3])}</td>
                  <td>${fi(r[4])}</td><td>${fi(r[5])}</td><td>${fi(r[6])}</td><td>${fi(r[7])}</td>
                  <td>${f3(r[8])}</td><td>${f3(r[9])}</td><td>${f3(r[10])}</td>
                </tr>
              `,
                )
                .join('')}
            </tbody>
          </table>
        </div>
      </section>
    `,
      )
      .join('')}
  `;
      }

      function renderEmptyState() {
        return `
    <div class="empty-card" role="status">
      <svg class="illus" aria-hidden="true"><use href="#i-scorecard"/></svg>
      <h3>Nobody on deck yet.</h3>
      <p>Search above and add at least two players to begin comparing. You can mix eras — put Babe Ruth next to Ruben Ortiz-Lang and see the numbers land.</p>
    </div>
  `;
      }

      function renderOnePlayer() {
        return `
    <div class="nudge" role="note">
      <span class="num">1/4</span>
      <div>
        <p class="t">One player on deck.</p>
        <p class="d">Add at least one more player to run the head-to-head — the comparison table and season breakdown unlock at two.</p>
      </div>
    </div>
    <!-- Show preview of the single selected player's career card so the page isn't bare. -->
    <section class="season-block s0" style="margin-top:22px">
      <div class="sh"><h3 style="color:var(--slot-0)">${PLAYERS[0].name}</h3><span class="era">${PLAYERS[0].pos} · ${PLAYERS[0].era} · awaiting opponent</span></div>
      <div class="sb-table-wrap">
        <table class="sb-table">
          <thead><tr><th>Year</th><th>G</th><th>PA</th><th>AB</th><th>H</th><th>HR</th><th>RBI</th><th>SB</th><th>AVG</th><th>OBP</th><th>SLG</th></tr></thead>
          <tbody>
            ${PLAYERS[0].seasons
              .map(
                (r) => `
              <tr><td>${r[0]}</td><td>${fi(r[1])}</td><td>${fi(r[2])}</td><td>${fi(r[3])}</td><td>${fi(r[4])}</td><td>${fi(r[5])}</td><td>${fi(r[6])}</td><td>${fi(r[7])}</td><td>${f3(r[8])}</td><td>${f3(r[9])}</td><td>${f3(r[10])}</td></tr>
            `,
              )
              .join('')}
          </tbody>
        </table>
      </div>
    </section>
  `;
      }

      function renderLoading() {
        /* The per-slot queries run in parallel (spec: 4× useGetAllPlayerSeasonStatsQuery);
     when one is pending, the CELL shows a spinner rather than the whole table.
     Here we show skeletons in the cells for two of the three slots. */
        return `
    <div class="section-head"><h2>Head-to-Head</h2><span class="meta">Loading season stats for 2 of 3 players…</span></div>
    <div class="cmp-wrap" aria-busy="true">
      <table class="cmp">
        <thead>
          <tr>
            <th class="stat-col">Metric</th>
            ${PLAYERS.map((p, i) => `<th class="player-col p${i}"><div class="pname"><span class="name">${p.name}</span><span class="era">${p.pos} · ${p.era}</span><span class="line"></span></div></th>`).join('')}
          </tr>
        </thead>
        <tbody>
          <tr class="group-row"><td colspan="4">Career Batting</td></tr>
          ${['Games', 'Hits', 'Home Runs', 'RBI', 'Runs', 'oWAR']
            .map(
              (k) => `
            <tr>
              <td class="stat-col">${k}</td>
              <td style="text-align:right">${fi(1000 + Math.floor(Math.random() * 900))}</td>
              <td style="text-align:right"><span class="skel" style="width:64px;height:16px"></span></td>
              <td style="text-align:right"><span class="skel" style="width:64px;height:16px"></span></td>
            </tr>
          `,
            )
            .join('')}
        </tbody>
      </table>
    </div>
    <p style="text-align:center; margin-top:18px; font-family:var(--font-body); color:var(--fg-3); font-style:italic">Resolving 2 of 3 season-stat queries…</p>
  `;
      }

      function renderError() {
        return `
    <div class="error-card" role="alert">
      <div class="icon-wrap"><svg width="22" height="22"><use href="#i-warning"/></svg></div>
      <div>
        <h3>One of the comparisons didn't come through</h3>
        <p>Henry Keogh's season archive returned an error. Your selection is preserved; retry just the affected slot without rebuilding the comparison.</p>
        <p style="margin:10px 0 14px; font-size:13px; color:var(--fg-3)">Failed slot · <strong style="color:var(--fg-2)">Henry Keogh</strong> · 504 gateway timeout after 2 retries</p>
        <div style="display:flex; gap:10px">
          <button class="btn btn-primary">Retry Keogh</button>
          <button class="btn">Remove Keogh &amp; continue</button>
        </div>
      </div>
    </div>
  `;
      }

      const stage = document.getElementById('stage');
      const vpMobile = document.getElementById('vp-mobile');
      const vpDesktop = document.getElementById('vp-desktop');
      function renderAll() {
        const state = stage.dataset.state;
        vpMobile.innerHTML = renderApp(state, true);
        vpDesktop.innerHTML = renderApp(state, false);
      }
      document
        .getElementById('state-switcher')
        .addEventListener('click', (e) => {
          const btn = e.target.closest('button[data-state]');
          if (!btn) return;
          document
            .querySelectorAll('#state-switcher button')
            .forEach((b) => b.classList.toggle('on', b === btn));
          stage.dataset.state = btn.dataset.state;
          renderAll();
        });
      document
        .getElementById('view-switcher')
        .addEventListener('click', (e) => {
          const btn = e.target.closest('button[data-view]');
          if (!btn) return;
          document
            .querySelectorAll('#view-switcher button')
            .forEach((b) => b.classList.toggle('on', b === btn));
          stage.dataset.view = btn.dataset.view;
        });
      renderAll();
    </script>
  </body>
</html>
