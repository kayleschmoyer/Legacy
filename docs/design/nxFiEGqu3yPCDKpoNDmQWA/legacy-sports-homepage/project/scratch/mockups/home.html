<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Legacy Sports — Home Page Mockup</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <!--
  ============================================================
  Legacy Sports — /  (Home page)
  Design mockup: four states × two variants × two viewports.
  Single self-contained HTML. No build step. Google Fonts only.
  ------------------------------------------------------------
  Design intent in short:
  - Editorial hierarchy, not a uniform card grid. One league
    earns the hero slot (the one that demands the manager's
    attention next — active matchup, live draft, or upcoming
    draft). The rest live in a denser list below. A right rail
    carries "On This Day in Baseball" so history is always
    present without competing with the matchup.
  - The accent palette is strict. Gold = wins / first place /
    trophies. Seam red = live draft / losing / errors. Navy =
    primary action and selected state. Nothing else is colored.
  - Progressive disclosure: archived leagues start folded; new
    users see a quieter hero that leads to "Create" / "Join".
  ============================================================
-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Literata:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ── Tokens — mirrored from design-system colors_and_type.css ──────── */
      :root {
        --bg-page: #0a0f1a;
        --bg-subtle: #0d1526;
        --bg-panel: #111b2f;
        --bg-elevated: #16223a;
        --bg-raised: #1c2a47;

        --brand-navy: #1b3a5c;
        --brand-navy-light: #2c4a7c;
        --brand-navy-dark: #143050;
        --brand-gold: #c5a55a;
        --brand-gold-light: #d4bb78;
        --brand-gold-dark: #a68b3e;
        --brand-seam-red: #c41e3a;
        --brand-seam-red-lt: #e63950;

        --text-primary: #e8edf5;
        --text-secondary: #8a9bb5;
        --text-muted: #6c80ba;
        --border: #1e2d45;
        --border-strong: #2f3b53;

        --success: #4aae7c;
        --warning: #c89452;

        --pos-pitcher: #c41e3a;
        --pos-infield: #8b6f47;
        --pos-outfield: #2d6a4f;

        --font-display:
          'Big Shoulders Display', 'Oswald', system-ui, sans-serif;
        --font-body: 'Literata', Georgia, 'Times New Roman', serif;
        --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;

        --r-2: 6px;
        --r-3: 8px;
        --r-4: 12px;
        --r-5: 16px;
        --r-6: 20px;
        --r-7: 24px;
        --r-pill: 9999px;

        --shadow-md: 0 4px 14px rgba(8, 12, 20, 0.55);
        --shadow-lg: 0 12px 32px rgba(8, 12, 20, 0.65);
        --shadow-gold:
          0 0 0 1px rgba(197, 165, 90, 0.35),
          0 6px 24px rgba(197, 165, 90, 0.25);
        --shadow-seam:
          0 0 0 1px rgba(196, 30, 58, 0.45), 0 6px 20px rgba(196, 30, 58, 0.3);

        --ease-std: cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: #05080f;
        color: var(--text-primary);
        font-family: var(--font-body);
        font-size: 16px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      /* ── Mockup reviewer chrome (NOT part of the product) ───────────── */
      .review-bar {
        position: sticky;
        top: 0;
        z-index: 100;
        background: #05080f;
        border-bottom: 1px solid #111;
        padding: 14px 24px;
        display: flex;
        gap: 28px;
        align-items: center;
        flex-wrap: wrap;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #6c80ba;
      }
      .review-bar .rb-title {
        color: var(--brand-gold-light);
        letter-spacing: 0.2em;
      }
      .review-bar .rb-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .review-bar .rb-group > span:first-child {
        color: #445676;
        margin-right: 4px;
      }
      .review-bar button {
        background: transparent;
        border: 1px solid #1e2d45;
        color: #8a9bb5;
        font-family: inherit;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 7px 13px;
        border-radius: var(--r-pill);
        cursor: pointer;
        transition: all 150ms var(--ease-std);
      }
      .review-bar button:hover {
        color: #e8edf5;
        border-color: #2f3b53;
      }
      .review-bar button.on {
        background: #1b3a5c;
        border-color: #2c4a7c;
        color: #fff;
      }
      .review-bar .rb-spacer {
        flex: 1;
      }
      .review-bar .rb-note {
        font-family: var(--font-body);
        font-weight: 400;
        font-size: 12px;
        letter-spacing: 0;
        text-transform: none;
        color: #445676;
      }

      /* ── Stage — holds desktop + mobile frames side by side ───────────── */
      .stage {
        padding: 32px 24px 96px;
        display: grid;
        grid-template-columns: 1fr 420px;
        gap: 32px;
        align-items: flex-start;
        max-width: 1840px;
        margin: 0 auto;
      }
      @media (max-width: 1500px) {
        .stage {
          grid-template-columns: 1fr;
        }
      }

      .frame {
        background: var(--bg-page);
        border: 1px solid #111;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        position: relative;
      }
      .frame-label {
        position: absolute;
        top: -28px;
        left: 0;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #445676;
      }
      .frame-label b {
        color: var(--brand-gold-light);
        font-weight: 700;
      }

      .frame-desktop {
        min-height: 1100px;
      }
      .frame-mobile {
        width: 375px;
        min-height: 812px;
        margin-left: auto;
        margin-right: auto;
        border-radius: 28px;
      }

      /* ── Night-stadium background wash (page-internal) ───────────────── */
      .nightstadium {
        background:
          radial-gradient(
            ellipse at 20% 0%,
            rgba(27, 58, 92, 0.22) 0%,
            transparent 55%
          ),
          radial-gradient(
            ellipse at 80% 10%,
            rgba(196, 30, 58, 0.1) 0%,
            transparent 45%
          ),
          radial-gradient(
            ellipse at 50% 90%,
            rgba(197, 165, 90, 0.08) 0%,
            transparent 50%
          ),
          var(--bg-page);
        background-attachment: local;
        min-height: 100%;
      }

      /* ── Sticky top nav ──────────────────────────────────────────────── */
      .nav {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(10, 15, 26, 0.78);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border);
      }
      .nav-inner {
        max-width: 1280px;
        margin: 0 auto;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
      }
      .brand img {
        height: 36px;
        width: 36px;
      }
      .brand .wordmark {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 14px;
        letter-spacing: 0.04em;
        line-height: 1;
        color: var(--brand-gold-light);
      }
      .brand .wordmark .sub {
        display: block;
        color: var(--text-primary);
        font-size: 11px;
        letter-spacing: 0.16em;
      }
      .nav-tabs {
        display: flex;
        gap: 2px;
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: var(--r-pill);
        padding: 4px;
        margin-left: 24px;
      }
      .nav-tabs a {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 7px 14px;
        border-radius: var(--r-pill);
        color: var(--text-secondary);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 150ms var(--ease-std);
        text-decoration: none;
      }
      .nav-tabs a.on {
        background: var(--brand-navy);
        color: #fff;
      }
      .nav-tabs a:hover:not(.on) {
        color: var(--text-primary);
      }
      .nav-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .icon-btn {
        background: transparent;
        border: 1px solid var(--border);
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--text-secondary);
        position: relative;
      }
      .icon-btn:hover {
        border-color: var(--border-strong);
        background: rgba(255, 255, 255, 0.03);
      }
      .icon-btn .bell-dot {
        position: absolute;
        top: 8px;
        right: 9px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--brand-seam-red-lt);
        box-shadow: 0 0 0 2px var(--bg-page);
      }
      .avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: linear-gradient(135deg, #1b3a5c 0%, #c5a55a 100%);
        border: 1px solid rgba(197, 165, 90, 0.45);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 12px;
        color: #fff;
        letter-spacing: 0.04em;
      }

      /* ── Page shell ──────────────────────────────────────────────────── */
      .page {
        max-width: 1280px;
        margin: 0 auto;
        padding: 40px 24px 80px;
      }

      /* ── Compact header (returning user) ─────────────────────────────── */
      .page-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 24px;
        margin-bottom: 36px;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--border);
      }
      .page-head .welcome {
        display: flex;
        align-items: baseline;
        gap: 20px;
        flex-wrap: wrap;
      }
      .eyebrow {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--brand-gold-light);
      }
      .h1 {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: clamp(36px, 4.4vw, 56px);
        line-height: 1.02;
        letter-spacing: -0.02em;
        color: #fff;
        margin: 6px 0 0;
      }
      .h2 {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 32px;
        line-height: 1.1;
        letter-spacing: -0.01em;
        color: var(--text-primary);
        margin: 0;
      }
      .h3 {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 22px;
        line-height: 1.15;
        margin: 0;
        color: var(--text-primary);
      }
      .h4 {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 18px;
        line-height: 1.2;
        letter-spacing: 0.01em;
        color: var(--text-primary);
        margin: 0;
      }
      .lede {
        font-family: var(--font-body);
        font-size: 18px;
        line-height: 1.55;
        color: var(--text-secondary);
        max-width: 62ch;
        margin: 0;
      }
      p {
        font-family: var(--font-body);
        color: var(--text-secondary);
        line-height: 1.55;
        margin: 0;
        max-width: 70ch;
      }

      .meta {
        font-family: var(--font-body);
        font-size: 13px;
        color: var(--text-secondary);
      }

      .record-line {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-secondary);
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-variant-numeric: tabular-nums;
      }
      .record-line b {
        color: var(--text-primary);
        font-weight: 800;
        letter-spacing: 0.04em;
      }
      .record-line .sep {
        color: #445676;
      }

      .head-ctas {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      /* ── Buttons ─────────────────────────────────────────────────────── */
      .btn {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 11px 20px;
        border-radius: var(--r-4);
        border: 1px solid transparent;
        cursor: pointer;
        transition: all 150ms var(--ease-std);
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
      }
      .btn-primary {
        background: var(--brand-navy);
        color: #fff;
        border-color: var(--brand-navy-light);
      }
      .btn-primary:hover {
        background: var(--brand-navy-light);
        transform: translateY(-1px);
      }
      .btn-gold {
        background: var(--brand-gold);
        color: #111;
      }
      .btn-gold:hover {
        background: var(--brand-gold-light);
        transform: translateY(-1px);
      }
      .btn-ghost {
        background: transparent;
        color: var(--text-primary);
        border-color: var(--border-strong);
      }
      .btn-ghost:hover {
        border-color: #4d5d80;
        background: rgba(255, 255, 255, 0.03);
      }
      .btn-sm {
        padding: 8px 14px;
        font-size: 11px;
      }
      .btn[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn svg {
        width: 14px;
        height: 14px;
      }

      /* ── Section header ──────────────────────────────────────────────── */
      .section {
        margin-top: 56px;
      }
      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
        margin-bottom: 20px;
      }
      .section-head .sh-left {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .section-head .sh-right {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .text-link {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--brand-gold-light);
        cursor: pointer;
        border: 0;
        background: transparent;
        padding: 0;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .text-link:hover {
        color: var(--brand-gold);
      }

      /* ── Chips / badges ──────────────────────────────────────────────── */
      .chip {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 5px 11px;
        border-radius: var(--r-pill);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        border: 1px solid transparent;
      }
      .chip-live {
        background: rgba(196, 30, 58, 0.15);
        color: #e63950;
        border-color: rgba(196, 30, 58, 0.4);
      }
      .chip-active {
        background: rgba(34, 197, 94, 0.12);
        color: #6fd39a;
        border-color: rgba(34, 197, 94, 0.4);
      }
      .chip-pre {
        background: rgba(197, 165, 90, 0.12);
        color: var(--brand-gold-light);
        border-color: rgba(197, 165, 90, 0.4);
      }
      .chip-off {
        background: rgba(108, 128, 186, 0.1);
        color: var(--text-muted);
        border-color: #1e2d45;
      }
      .chip-soon {
        background: rgba(200, 148, 82, 0.1);
        color: #e3b870;
        border-color: rgba(200, 148, 82, 0.35);
      }
      .chip-win {
        background: rgba(197, 165, 90, 0.1);
        color: var(--brand-gold-light);
        border-color: rgba(197, 165, 90, 0.35);
      }
      .chip-loss {
        background: rgba(196, 30, 58, 0.1);
        color: #e07a8c;
        border-color: rgba(196, 30, 58, 0.3);
      }
      .chip-rank-1 {
        background: rgba(197, 165, 90, 0.12);
        color: var(--brand-gold-light);
        border-color: rgba(197, 165, 90, 0.4);
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        display: inline-block;
        background: currentColor;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.35;
          transform: scale(0.85);
        }
      }
      .dot-pulse {
        animation: pulse 1.4s var(--ease-std) infinite;
      }

      /* ── Hero league card (the "next up" feature card) ───────────────── */
      /* MOTION: on route enter, hero slides up 12px + crossfade, 300ms ease-out-quart */
      .league-hero {
        position: relative;
        border-radius: var(--r-7);
        overflow: hidden;
        background:
          linear-gradient(
            135deg,
            rgba(27, 58, 92, 0.35) 0%,
            rgba(10, 15, 26, 0) 55%
          ),
          linear-gradient(180deg, rgba(197, 165, 90, 0.05), transparent 45%),
          #0f1a2d;
        border: 1px solid rgba(197, 165, 90, 0.22);
        box-shadow: var(--shadow-lg);
        padding: 32px;
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 32px;
        align-items: center;
      }
      .league-hero::before {
        /* subtle stadium-lamp glow in the corner */
        content: '';
        position: absolute;
        top: -120px;
        right: -120px;
        width: 360px;
        height: 360px;
        background: radial-gradient(
          circle,
          rgba(197, 165, 90, 0.18) 0%,
          transparent 65%
        );
        pointer-events: none;
      }
      .hero-left {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }
      .hero-head-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .hero-title {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 36px;
        line-height: 1.05;
        letter-spacing: -0.01em;
        color: #fff;
        margin: 0;
      }
      .hero-sub {
        font-family: var(--font-body);
        font-style: italic;
        color: var(--text-secondary);
        font-size: 15px;
        margin: 0;
      }
      .hero-footer {
        display: flex;
        gap: 18px;
        align-items: center;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-secondary);
      }
      .hero-footer .sep {
        color: #445676;
      }
      .hero-footer b {
        color: var(--text-primary);
        font-weight: 700;
      }

      /* Hero matchup panel (right side) */
      .matchup {
        background: rgba(10, 15, 26, 0.55);
        border: 1px solid var(--border);
        border-radius: var(--r-5);
        padding: 20px 22px;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 20px;
        align-items: center;
      }
      .matchup-side {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        text-align: center;
      }
      .matchup-side .team-badge {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: linear-gradient(135deg, #1b3a5c 0%, #0e1e33 100%);
        border: 1px solid var(--border-strong);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 18px;
        color: #fff;
        letter-spacing: 0.04em;
      }
      .matchup-side .team-badge.you {
        background: linear-gradient(135deg, #1b3a5c 0%, #c5a55a 100%);
        border-color: rgba(197, 165, 90, 0.5);
      }
      .matchup-side .team-badge.opp {
        background: linear-gradient(135deg, #8b1a2b 0%, #4a0f17 100%);
        border-color: rgba(196, 30, 58, 0.4);
      }
      .matchup-side .team-name {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-primary);
      }
      .matchup-side .team-rec {
        font-family: var(--font-body);
        font-size: 12px;
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
      }
      .matchup-side .score {
        font-family: var(--font-display);
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        font-size: 52px;
        line-height: 1;
        color: #fff;
        margin-top: 2px;
      }
      .matchup-side.leading .score {
        color: var(--brand-gold-light);
      }
      .vs {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 15px;
        letter-spacing: 0.22em;
        color: var(--text-muted);
      }

      /* ── League list (secondary) ─────────────────────────────────────── */
      .league-list {
        display: flex;
        flex-direction: column;
        gap: 1px;
        background: var(--border);
        border: 1px solid var(--border);
        border-radius: var(--r-5);
        overflow: hidden;
      }
      .league-row {
        background: var(--bg-elevated);
        padding: 18px 22px;
        display: grid;
        grid-template-columns: minmax(220px, 1.6fr) 1fr 1fr auto;
        gap: 24px;
        align-items: center;
        cursor: pointer;
        transition: background 150ms var(--ease-std);
        /* MOTION: on hover, background shifts to --bg-raised over 150ms */
      }
      .league-row:hover {
        background: var(--bg-raised);
      }
      .league-row .lr-main {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .league-row .lr-name {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 18px;
        color: var(--text-primary);
        letter-spacing: -0.005em;
      }
      .league-row .lr-era {
        font-family: var(--font-body);
        font-style: italic;
        font-size: 13px;
        color: var(--text-secondary);
      }
      .league-row .lr-status {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .league-row .lr-score {
        font-family: var(--font-body);
        font-size: 13px;
        color: var(--text-secondary);
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .league-row .lr-score .big {
        font-family: var(--font-display);
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        font-size: 22px;
        color: var(--text-primary);
        line-height: 1;
      }
      .league-row .lr-score .big.win {
        color: var(--brand-gold-light);
      }
      .league-row .lr-score .big.loss {
        color: #e07a8c;
      }
      .league-row .lr-week {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
      }
      .league-row .lr-chev {
        color: var(--text-muted);
      }

      /* Archived toggle */
      .archive-toggle {
        margin-top: 16px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: transparent;
        border: 1px dashed var(--border);
        color: var(--text-secondary);
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 10px 16px;
        border-radius: var(--r-pill);
        cursor: pointer;
        transition: all 150ms var(--ease-std);
      }
      .archive-toggle:hover {
        color: var(--text-primary);
        border-color: var(--border-strong);
      }
      .archive-toggle svg {
        width: 12px;
        height: 12px;
      }

      /* ── Right rail: On This Day ─────────────────────────────────────── */
      .dashboard-split {
        display: grid;
        grid-template-columns: 1fr 360px;
        gap: 32px;
        align-items: flex-start;
        margin-top: 56px;
      }
      @media (max-width: 1024px) {
        .dashboard-split {
          grid-template-columns: 1fr;
        }
      }

      .rail {
        position: sticky;
        top: 88px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .rail-card {
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: var(--r-5);
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .rail-card .rail-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .rail-card .rail-head .date {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }
      .rail-title {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 20px;
        letter-spacing: -0.005em;
        color: var(--text-primary);
        margin: 0;
      }
      .otd-item {
        padding: 16px 0;
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .otd-item:first-of-type {
        border-top: 0;
        padding-top: 4px;
      }
      .otd-year {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 14px;
        letter-spacing: 0.08em;
        color: var(--brand-gold-light);
        font-variant-numeric: tabular-nums;
      }
      .otd-headline {
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 15px;
        line-height: 1.4;
        color: var(--text-primary);
        text-wrap: pretty;
      }
      .otd-body {
        font-family: var(--font-body);
        font-style: italic;
        font-size: 13px;
        line-height: 1.5;
        color: var(--text-secondary);
        max-width: 70ch;
      }
      .otd-stat {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        color: var(--text-muted);
        display: inline-flex;
        gap: 10px;
        margin-top: 4px;
      }
      .otd-stat b {
        color: var(--text-secondary);
        font-weight: 500;
      }

      /* ── Sports section (simple two-card row) ────────────────────────── */
      .sport-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .sport-card {
        position: relative;
        padding: 28px;
        border-radius: var(--r-6);
        border: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        gap: 20px;
        color: #fff;
        cursor: pointer;
        transition: all 220ms var(--ease-std);
        text-align: left;
        text-decoration: none;
        font-family: inherit;
        background: inherit;
      }
      .sport-bb {
        background: linear-gradient(
          135deg,
          #0a0f1a 0%,
          #1b3a5c 70%,
          #143050 100%
        );
      }
      .sport-bb:hover {
        transform: translateY(-3px);
        border-color: rgba(197, 165, 90, 0.35);
        box-shadow: var(--shadow-lg);
      }
      .sport-fb {
        background: linear-gradient(
          135deg,
          #0a0f1a 0%,
          #0f2a1a 65%,
          #1a3a2a 100%
        );
        opacity: 0.6;
        cursor: not-allowed;
      }
      .sport-card .sc-icon {
        width: 64px;
        height: 64px;
        border-radius: var(--r-5);
        background: rgba(10, 15, 26, 0.55);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .sport-card .sc-icon img {
        width: 36px;
        height: 36px;
      }
      .sport-card .sc-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .sport-card .sc-title {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 26px;
        letter-spacing: -0.005em;
      }
      .sport-card .sc-sub {
        font-family: var(--font-body);
        font-size: 14px;
        color: var(--text-secondary);
      }
      .sport-card .sc-chip {
        position: absolute;
        top: 16px;
        right: 16px;
      }

      /* ── Explore stats CTA (returning user only) ─────────────────────── */
      .stats-cta {
        background:
          linear-gradient(135deg, rgba(27, 58, 92, 0.2), transparent 65%),
          var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: var(--r-5);
        padding: 24px 28px;
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .stats-cta .sc-badge {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        background: rgba(197, 165, 90, 0.08);
        border: 1px solid rgba(197, 165, 90, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .stats-cta .sc-copy {
        flex: 1;
        min-width: 0;
      }
      .stats-cta .sc-copy .h4 {
        margin-bottom: 4px;
      }
      .stats-cta .sc-copy p {
        font-size: 14px;
      }

      /* ── Getting Started hero (new user) ─────────────────────────────── */
      .gs-hero {
        padding: 48px 0 32px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 40px;
      }
      .gs-hero .gs-title {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: clamp(44px, 5.2vw, 68px);
        line-height: 0.98;
        letter-spacing: -0.025em;
        color: #fff;
        margin: 0;
      }
      .gs-hero .gs-title em {
        font-style: normal;
        color: var(--brand-gold-light);
      }
      .gs-hero .gs-lede {
        max-width: 60ch;
        font-size: 18px;
      }
      .gs-hero .gs-ctas {
        display: flex;
        gap: 12px;
        margin-top: 14px;
        flex-wrap: wrap;
      }

      /* Featured-leagues strip (new-user discovery) */
      .featured-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 18px;
      }

      /* ── Error state card ────────────────────────────────────────────── */
      .error-card {
        background: var(--bg-panel);
        border: 1px solid rgba(196, 30, 58, 0.35);
        border-radius: var(--r-6);
        padding: 40px;
        display: flex;
        gap: 24px;
        align-items: flex-start;
        box-shadow: var(--shadow-seam);
      }
      .error-card .ec-icon {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: rgba(196, 30, 58, 0.15);
        border: 1px solid rgba(196, 30, 58, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        color: var(--brand-seam-red-lt);
      }
      .error-card .ec-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .error-card .ec-body p {
        max-width: 60ch;
      }
      .error-card .ec-actions {
        display: flex;
        gap: 10px;
        margin-top: 8px;
      }
      .error-inline-code {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--text-muted);
        background: rgba(0, 0, 0, 0.25);
        padding: 3px 7px;
        border-radius: 4px;
        border: 1px solid var(--border);
      }

      /* ── Empty state (returning dashboard, no leagues yet) ───────────── */
      .empty-card {
        background:
          radial-gradient(
            ellipse at 50% 0%,
            rgba(27, 58, 92, 0.35) 0%,
            transparent 60%
          ),
          var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: var(--r-7);
        padding: 64px 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        text-align: center;
      }
      .empty-card .ec-glyph {
        width: 88px;
        height: 88px;
        border-radius: 24px;
        background: rgba(197, 165, 90, 0.08);
        border: 1px solid rgba(197, 165, 90, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 8px;
      }
      .empty-card .ec-glyph img {
        width: 52px;
        height: 52px;
      }
      .empty-card .h2 {
        font-size: 32px;
      }
      .empty-card .lede {
        text-align: center;
        margin: 0 auto;
      }
      .empty-card .ec-ctas {
        display: flex;
        gap: 12px;
        margin-top: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }

      /* ── Loading skeletons ───────────────────────────────────────────── */
      /* MOTION: skeleton shimmer — 1.4s linear infinite; pauses when prefers-reduced-motion */
      @keyframes shimmer {
        0% {
          background-position: -400px 0;
        }
        100% {
          background-position: 400px 0;
        }
      }
      .skel {
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.03) 0%,
          rgba(255, 255, 255, 0.08) 40%,
          rgba(255, 255, 255, 0.03) 80%
        );
        background-size: 800px 100%;
        animation: shimmer 1.4s linear infinite;
        border-radius: 6px;
      }
      @media (prefers-reduced-motion: reduce) {
        .skel {
          animation: none;
        }
      }
      .skel-text {
        height: 14px;
      }
      .skel-text.lg {
        height: 22px;
      }
      .skel-text.xl {
        height: 32px;
      }
      .skel-block {
        border-radius: var(--r-5);
      }

      .skel-hero {
        border-radius: var(--r-7);
        border: 1px solid var(--border);
        padding: 32px;
        background: var(--bg-panel);
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 32px;
        align-items: center;
      }
      .skel-hero .skh-left {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .skel-hero .skh-right {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .skel-row {
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--r-4);
        padding: 20px 22px;
        display: grid;
        grid-template-columns: 1.6fr 1fr 1fr;
        gap: 24px;
        align-items: center;
      }
      .skel-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      /* ── Onboarding tutorial modal (overlay, new user first visit) ───── */
      .modal-overlay {
        position: absolute;
        inset: 0;
        background: rgba(5, 8, 15, 0.72);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px;
        z-index: 50;
        /* MOTION: fade+scale 200ms ease-out on mount; fade out 150ms on dismiss */
      }
      .modal {
        width: 100%;
        max-width: 560px;
        background: var(--bg-elevated);
        border: 1px solid rgba(197, 165, 90, 0.25);
        border-radius: var(--r-7);
        padding: 36px;
        box-shadow: var(--shadow-lg);
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .modal .step-dots {
        display: flex;
        gap: 8px;
      }
      .modal .step-dots span {
        width: 24px;
        height: 3px;
        border-radius: 2px;
        background: var(--border);
      }
      .modal .step-dots span.on {
        background: var(--brand-gold);
      }
      .modal ol {
        padding-left: 18px;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-family: var(--font-body);
        color: var(--text-secondary);
        line-height: 1.5;
      }
      .modal ol b {
        color: var(--text-primary);
        font-weight: 600;
      }
      .modal .modal-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 8px;
      }

      /* ── Mobile frame-specific overrides ─────────────────────────────── */
      .frame-mobile .page {
        padding: 20px 16px 60px;
      }
      .frame-mobile .nav-inner {
        padding: 10px 16px;
        gap: 12px;
      }
      .frame-mobile .nav-tabs {
        display: none;
      } /* tabs collapse to a drawer; not shown in mockup */
      .frame-mobile .brand img {
        height: 30px;
        width: 30px;
      }
      .frame-mobile .brand .wordmark {
        font-size: 12px;
      }
      .frame-mobile .brand .wordmark .sub {
        font-size: 9px;
      }
      .frame-mobile .page-head {
        flex-direction: column;
        align-items: stretch;
        gap: 16px;
        padding-bottom: 18px;
        margin-bottom: 22px;
      }
      .frame-mobile .page-head .welcome {
        flex-direction: column;
        gap: 6px;
      }
      .frame-mobile .h1 {
        font-size: 34px;
      }
      .frame-mobile .h2 {
        font-size: 24px;
      }
      .frame-mobile .head-ctas {
        display: flex;
        gap: 8px;
      }
      .frame-mobile .head-ctas .btn {
        flex: 1;
        justify-content: center;
        padding: 10px 12px;
        font-size: 11px;
      }
      .frame-mobile .league-hero {
        grid-template-columns: 1fr;
        padding: 22px;
        gap: 22px;
      }
      .frame-mobile .hero-title {
        font-size: 26px;
      }
      .frame-mobile .matchup {
        padding: 16px 12px;
        gap: 8px;
      }
      .frame-mobile .matchup-side .score {
        font-size: 38px;
      }
      .frame-mobile .matchup-side .team-badge {
        width: 44px;
        height: 44px;
        font-size: 15px;
      }
      .frame-mobile .vs {
        font-size: 12px;
        letter-spacing: 0.18em;
      }
      .frame-mobile .league-row {
        grid-template-columns: 1fr auto;
        gap: 12px;
        padding: 16px;
      }
      .frame-mobile .league-row .lr-main {
        grid-column: 1 / span 2;
      }
      .frame-mobile .league-row .lr-status {
        order: 2;
      }
      .frame-mobile .league-row .lr-score {
        order: 3;
        grid-column: 1;
        text-align: left;
      }
      .frame-mobile .league-row .lr-score .big {
        font-size: 18px;
      }
      .frame-mobile .league-row .lr-week {
        order: 4;
        grid-column: 2;
        text-align: right;
        align-self: center;
      }
      .frame-mobile .league-row .lr-chev {
        display: none;
      }
      .frame-mobile .dashboard-split {
        grid-template-columns: 1fr;
        gap: 36px;
        margin-top: 36px;
      }
      .frame-mobile .rail {
        position: static;
      }
      .frame-mobile .sport-grid {
        grid-template-columns: 1fr;
      }
      .frame-mobile .section {
        margin-top: 36px;
      }
      .frame-mobile .gs-hero {
        padding: 24px 0 16px;
        margin-bottom: 24px;
      }
      .frame-mobile .gs-hero .gs-title {
        font-size: 40px;
      }
      .frame-mobile .gs-hero .gs-ctas .btn {
        flex: 1 1 140px;
        justify-content: center;
      }
      .frame-mobile .error-card {
        padding: 24px;
        flex-direction: column;
        gap: 14px;
      }
      .frame-mobile .empty-card {
        padding: 40px 22px;
      }
      .frame-mobile .stats-cta {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
        padding: 20px;
      }
      .frame-mobile .nav-right {
        gap: 8px;
      }
      .frame-mobile .icon-btn,
      .frame-mobile .avatar {
        width: 36px;
        height: 36px;
      } /* ≥44×44 on real devices — scale ratio preserved here for mockup; annotate below */
      .frame-mobile .modal-overlay {
        padding: 20px;
      }
      .frame-mobile .modal {
        padding: 22px;
        border-radius: var(--r-6);
      }

      /* ── Visually-hidden (for a11y) ──────────────────────────────────── */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* ── Utility ─────────────────────────────────────────────────────── */
      .flex {
        display: flex;
      }
      .gap-8 {
        gap: 8px;
      }
      .mt-8 {
        margin-top: 8px;
      }
      .mono-num {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }

      /* Hide-by-default state containers — JS toggles one on */
      .state {
        display: none;
      }
      .state.on {
        display: block;
      }
    </style>
  </head>

  <body>
    <!-- ═════════════════════════════════════════════════════════════════
     REVIEW BAR  (mockup chrome only — not part of the product)
     ───────────────────────────────────────────────────────────────── -->
    <div class="review-bar">
      <span class="rb-title">Legacy Sports · Home · /</span>

      <div class="rb-group" role="tablist" aria-label="Variant">
        <span>Variant</span>
        <button data-variant="returning" class="on">Returning</button>
        <button data-variant="new">Getting&nbsp;Started</button>
      </div>

      <div class="rb-group" role="tablist" aria-label="State">
        <span>State</span>
        <button data-state="populated" class="on">Populated</button>
        <button data-state="loading">Loading</button>
        <button data-state="error">Error</button>
        <button data-state="empty">Empty</button>
      </div>

      <div class="rb-spacer"></div>
      <span class="rb-note">Desktop 1280&thinsp;· Mobile 375</span>
    </div>

    <!-- ═════════════════════════════════════════════════════════════════
     STAGE — desktop frame + mobile frame side-by-side
     ───────────────────────────────────────────────────────────────── -->
    <div class="stage">
      <!-- ──────────── DESKTOP FRAME ──────────── -->
      <section class="frame frame-desktop" aria-label="Desktop preview">
        <span class="frame-label"><b>Desktop</b> · 1280px · /</span>
        <div class="nightstadium" id="desktop-root">
          <!-- Nav is shared across all states/variants -->
          <header class="nav">
            <div class="nav-inner">
              <a class="brand" href="#">
                <img
                  src="../../assets/logo.png"
                  alt="Legacy Sports"
                  onerror="this.style.display = 'none'"
                />
                <div class="wordmark">
                  LEGACY<span class="sub">SPORTS</span>
                </div>
              </a>
              <nav class="nav-tabs" aria-label="Primary">
                <a class="on" href="#">Home</a>
                <a href="#">Scoreboard</a>
                <a href="#">My League</a>
                <a href="#">Draft</a>
                <a href="#">Stats</a>
              </nav>
              <div class="nav-right">
                <button class="icon-btn" aria-label="Notifications">
                  <!-- Lucide bell, 18px -->
                  <svg
                    width="18"

    <!-- ═════════════════════════════════════════════════════════════════
     STATE SWITCHER JS
     ───────────────────────────────────────────────────────────────── -->
    <script>
      (function () {
        var variant = 'returning';
        var state = 'populated';

        var desktopMain = document.getElementById('desktop-main');
        var mobileMain = document.getElementById('mobile-main');

        function render() {
          var id = 'tpl-' + variant + '-' + state;
          var tpl = document.getElementById(id);
          if (!tpl) return;
          // Clone into each frame. We render the same nodes twice (once per frame)
          // so the desktop and mobile CSS scoping can style them differently.
          desktopMain.innerHTML = '';
          mobileMain.innerHTML = '';
          desktopMain.appendChild(tpl.content.cloneNode(true));
          mobileMain.appendChild(tpl.content.cloneNode(true));
        }

        document
          .querySelectorAll('.review-bar button[data-variant]')
          .forEach(function (b) {
            b.addEventListener('click', function () {
              document
                .querySelectorAll('.review-bar button[data-variant]')
                .forEach(function (x) {
                  x.classList.remove('on');
                });
              b.classList.add('on');
              variant = b.getAttribute('data-variant');
              render();
            });
          });
        document
          .querySelectorAll('.review-bar button[data-state]')
          .forEach(function (b) {
            b.addEventListener('click', function () {
              document
                .querySelectorAll('.review-bar button[data-state]')
                .forEach(function (x) {
                  x.classList.remove('on');
                });
              b.classList.add('on');
              state = b.getAttribute('data-state');
              render();
            });
          });

        render();
      })();
    </script>
