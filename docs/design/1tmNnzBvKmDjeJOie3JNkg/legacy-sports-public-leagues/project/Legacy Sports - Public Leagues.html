<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Legacy Sports — Browse Public Leagues</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="assets/favicon.ico" />
    <link rel="stylesheet" href="colors_and_type.css" />

    <!--
  Design intent:
  - Page reference: leagues.md (/baseball/leagues)
  - This is a *discovery* surface, not a scoreboard. The editorial hook is
    "which clubhouse do I walk into?" — so every card is an editorial
    "card stock" listing, not a generic tile. Draft status is the
    headline; the era/pool is the dateline; spots-available is the
    invitation.
  - Mobile (375) is primary: shown full-height as the left column.
    Desktop (1280) sits alongside for side-by-side review.
  - All four states are togglable per the PROMPT — a top state switcher
    drives both mobile + desktop panels.
-->

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>

    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg1);
        font-family: var(--font-body);
      }

      /* ── Review frame ────────────────────────────────
     This outer shell is NOT part of the product — it's the
     design-review scaffolding that lets a reviewer toggle
     states and see mobile + desktop side-by-side. The product
     itself is inside .prod-mobile / .prod-desktop. */
      .review {
        min-height: 100vh;
        padding: 24px 24px 96px;
        background:
          radial-gradient(
            ellipse at 20% 0%,
            rgba(27, 58, 92, 0.22) 0%,
            transparent 55%
          ),
          radial-gradient(
            ellipse at 80% 10%,
            rgba(196, 30, 58, 0.1) 0%,
            transparent 45%
          ),
          radial-gradient(
            ellipse at 50% 90%,
            rgba(197, 165, 90, 0.08) 0%,
            transparent 50%
          ),
          var(--bg);
        background-attachment: fixed;
      }
      .review-head {
        max-width: 1720px;
        margin: 0 auto 20px;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-end;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--outline-subtle);
      }
      .review-title {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 22px;
        letter-spacing: 0.02em;
        color: var(--fg1);
      }
      .review-title span {
        color: var(--brand-gold-light);
      }
      .review-sub {
        font-family: var(--font-body);
        color: var(--fg3);
        font-size: 13px;
        margin-top: 4px;
        max-width: 60ch;
      }
      .state-switcher {
        display: inline-flex;
        gap: 4px;
        background: var(--surface-panel);
        border: 1px solid var(--outline-subtle);
        border-radius: 9999px;
        padding: 5px;
      }
      .state-switcher button {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 8px 14px;
        border-radius: 9999px;
        border: 0;
        color: var(--fg3);
        background: transparent;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 150ms var(--ease-standard);
      }
      .state-switcher button.on {
        background: var(--brand-navy);
        color: #fff;
      }
      .state-switcher button:hover:not(.on) {
        color: var(--fg1);
      }
      .state-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        display: inline-block;
        opacity: 0.7;
      }

      .stage {
        max-width: 1720px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 412px 1fr;
        gap: 28px;
        align-items: start;
      }
      .stage-label {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--fg3);
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .stage-label .px {
        font-family: var(--font-mono);
        font-weight: 500;
        color: var(--fg4);
        font-size: 11px;
      }

      /* Mobile device frame — 375×812 */
      .prod-mobile {
        width: 412px;
        height: 860px;
        border-radius: 36px;
        padding: 12px;
        background: #000;
        box-shadow:
          var(--shadow-xl),
          0 0 0 1px rgba(255, 255, 255, 0.08);
        position: sticky;
        top: 24px;
      }
      .prod-mobile-inner {
        width: 100%;
        height: 100%;
        border-radius: 28px;
        overflow: hidden;
        background: var(--bg);
        position: relative;
      }
      .m-statusbar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 36px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 22px 0;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 13px;
        color: var(--fg1);
        z-index: 40;
        pointer-events: none;
        letter-spacing: 0.02em;
      }
      .m-statusbar svg {
        vertical-align: middle;
      }
      .m-scroll {
        width: 100%;
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        padding-top: 36px;
        background:
          radial-gradient(
            ellipse at 50% 0%,
            rgba(27, 58, 92, 0.25) 0%,
            transparent 45%
          ),
          radial-gradient(
            ellipse at 80% 20%,
            rgba(196, 30, 58, 0.08) 0%,
            transparent 40%
          ),
          var(--bg);
      }

      /* Desktop frame — 1280 max */
      .prod-desktop {
        width: 100%;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid var(--outline-subtle);
        background: var(--bg);
        box-shadow: var(--shadow-xl);
      }
      .browser-chrome {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        background: #0a0f1a;
        border-bottom: 1px solid var(--outline-subtle);
      }
      .browser-dots {
        display: flex;
        gap: 6px;
      }
      .browser-dots span {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #2a3550;
      }
      .browser-url {
        flex: 1;
        margin: 0 12px;
        padding: 6px 14px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--outline-subtle);
        border-radius: 8px;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--fg3);
        max-width: 520px;
      }
      .browser-url b {
        color: var(--fg1);
        font-weight: 500;
      }
      .d-scroll {
        background:
          radial-gradient(
            ellipse at 20% 0%,
            rgba(27, 58, 92, 0.22) 0%,
            transparent 55%
          ),
          radial-gradient(
            ellipse at 80% 10%,
            rgba(196, 30, 58, 0.1) 0%,
            transparent 45%
          ),
          radial-gradient(
            ellipse at 50% 90%,
            rgba(197, 165, 90, 0.08) 0%,
            transparent 50%
          ),
          var(--bg);
        min-height: 820px;
        max-height: 1480px;
        overflow-y: auto;
      }

      /* ── Shared product styles ─────────────────────── */

      /* Top nav — mirrors UI kit, compact variant on mobile */
      .ls-nav {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(10, 15, 26, 0.78);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--panel-border);
      }
      .nav-inner {
        max-width: 1280px;
        margin: 0 auto;
        padding: 10px 24px;
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        text-decoration: none;
      }
      .brand img {
        height: 34px;
      }
      .wordmark {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 13px;
        letter-spacing: 0.04em;
        color: var(--brand-gold-light);
        line-height: 1;
      }
      .wordmark span {
        color: var(--fg1);
        font-size: 10px;
        letter-spacing: 0.16em;
        display: block;
      }
      .tabs {
        display: flex;
        gap: 4px;
        margin-left: 24px;
        background: var(--surface-panel);
        border: 1px solid var(--outline-subtle);
        border-radius: 9999px;
        padding: 4px;
      }
      .tabs a {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 7px 12px;
        border-radius: 9999px;
        color: var(--fg3);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 150ms var(--ease-standard);
      }
      .tabs a.on {
        background: var(--brand-navy);
        color: #fff;
      }
      .nav-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .icon-btn {
        background: transparent;
        border: 1px solid var(--outline-subtle);
        color: var(--fg2);
        width: 34px;
        height: 34px;
        border-radius: 9999px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--grad-avatar);
        border: 1px solid rgba(197, 165, 90, 0.45);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 11px;
        color: #fff;
        letter-spacing: 0.04em;
      }

      .mobile-nav {
        padding: 10px 16px;
        justify-content: space-between;
      }
      .mobile-nav .tabs {
        display: none;
      }

      /* Page shell */
      .page {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 24px 96px;
      }
      .m-page {
        padding: 20px 18px 80px;
      }

      /* ── Page header ───────────────────────────────── */
      .hdr {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 20px;
        margin-bottom: 28px;
      }
      .hdr-l .eyebrow {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--brand-gold-light);
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .hdr-l .eyebrow::before {
        content: '';
        width: 18px;
        height: 1px;
        background: var(--brand-gold);
        opacity: 0.6;
      }
      .hdr-l h1 {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: clamp(32px, 4vw, 48px);
        line-height: 1;
        letter-spacing: -0.02em;
        color: var(--fg1-strong);
        margin: 6px 0 10px;
      }
      .hdr-l .sub {
        font-family: var(--font-body);
        color: var(--fg2);
        font-size: 16px;
        line-height: 1.55;
        max-width: 58ch;
        margin: 0;
      }
      .m-page .hdr-l h1 {
        font-size: 30px;
      }
      .m-page .hdr-l .sub {
        font-size: 14px;
      }

      .create-cta {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 11px 16px;
        border-radius: 12px;
        background: transparent;
        color: var(--fg1);
        border: 1px solid var(--outline-default);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 150ms var(--ease-standard);
        white-space: nowrap;
      }
      .create-cta:hover {
        border-color: var(--brand-gold);
        color: var(--brand-gold-light);
        background: rgba(197, 165, 90, 0.06);
        transform: translateY(-1px);
      }
      .create-cta svg {
        width: 14px;
        height: 14px;
      }

      /* ── Controls bar: search + filters + count ───── */
      .controls {
        background: var(--surface-panel);
        border: 1px solid var(--outline-subtle);
        border-radius: 16px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-bottom: 22px;
      }
      .search-wrap {
        position: relative;
      }
      .search-wrap svg {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--fg4);
        pointer-events: none;
      }
      .search-input {
        width: 100%;
        padding: 13px 14px 13px 44px;
        font-family: var(--font-body);
        font-size: 15px;
        color: var(--fg1);
        background: rgba(10, 15, 26, 0.55);
        border: 1px solid var(--outline-subtle);
        border-radius: 10px;
        outline: none;
        transition: all 150ms var(--ease-standard);
      }
      .search-input::placeholder {
        color: var(--fg4);
        font-style: italic;
      }
      .search-input:focus {
        border-color: var(--focus-ring);
        box-shadow: 0 0 0 3px rgba(78, 142, 214, 0.18);
      }

      .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        align-items: center;
      }
      .filter-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
      }
      .filter-label {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--fg4);
      }
      .filter-pills {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .pill {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 8px 14px;
        border-radius: 9999px;
        background: transparent;
        color: var(--fg3);
        border: 1px solid var(--outline-subtle);
        cursor: pointer;
        transition: all 150ms var(--ease-standard);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .pill:hover {
        color: var(--fg1);
        border-color: var(--outline-default);
      }
      .pill.on {
        background: rgba(27, 58, 92, 0.5);
        color: #fff;
        border-color: var(--brand-navy-light);
      }
      .pill.on-gold {
        background: rgba(197, 165, 90, 0.1);
        color: var(--brand-gold-light);
        border-color: rgba(197, 165, 90, 0.5);
      }
      .pill .dot-live {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #e63950;
        animation: ls-pulse 1.4s infinite;
      }
      @keyframes ls-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      /* Results header */
      .results-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 14px;
        padding: 0 4px;
      }
      .results-count {
        font-family: var(--font-body);
        color: var(--fg2);
        font-size: 14px;
      }
      .results-count b {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 22px;
        color: var(--fg1);
        letter-spacing: 0.02em;
        font-variant-numeric: tabular-nums;
        margin-right: 6px;
        vertical-align: -1px;
      }
      .results-count .sep {
        color: var(--fg4);
        margin: 0 6px;
      }
      .refresh-btn {
        background: transparent;
        border: 0;
        color: var(--fg3);
        cursor: pointer;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 8px;
        transition: all 150ms var(--ease-standard);
      }
      .refresh-btn:hover {
        color: var(--fg1);
        background: rgba(255, 255, 255, 0.04);
      }
      .refresh-btn.spinning svg {
        animation: spin 900ms linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── League card — the editorial listing ───────── */
      .league-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .league-card {
        background: var(--surface-card);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        box-shadow: var(--shadow-md);
        overflow: hidden;
        transition: all 220ms var(--ease-standard);
        position: relative;
      }
      .league-card:hover {
        border-color: rgba(197, 165, 90, 0.3);
        transform: translateY(-1px);
        box-shadow: var(--shadow-lg);
      }

      /* Member-state card: gold-tinted surface, navy→gold glow */
      .league-card.is-member {
        background:
          linear-gradient(
            135deg,
            rgba(27, 58, 92, 0.35) 0%,
            rgba(197, 165, 90, 0.08) 100%
          ),
          var(--surface-card);
        border-color: rgba(197, 165, 90, 0.45);
        box-shadow:
          var(--shadow-md),
          0 0 0 1px rgba(197, 165, 90, 0.15);
      }
      .league-card.is-full {
        opacity: 0.78;
      }

      /* Member ribbon — slim horizontal strip at top of member cards */
      .member-ribbon {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 22px;
        background: linear-gradient(
          90deg,
          var(--brand-navy) 0%,
          rgba(27, 58, 92, 0.4) 100%
        );
        border-bottom: 1px solid rgba(197, 165, 90, 0.3);
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--brand-gold-light);
      }
      .member-ribbon svg {
        width: 14px;
        height: 14px;
      }

      .card-body {
        padding: 20px 22px;
      }

      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 14px;
        margin-bottom: 14px;
      }
      .card-title {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 24px;
        line-height: 1.1;
        color: var(--fg1-strong);
        margin: 0;
        letter-spacing: -0.01em;
      }
      .card-dateline {
        font-family: var(--font-body);
        font-size: 13px;
        color: var(--fg3);
        margin-top: 6px;
        font-style: italic;
      }
      .card-dateline .sep {
        margin: 0 8px;
        color: var(--fg4);
      }

      /* Draft status chip — upper right */
      .draft-chip {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 6px 11px;
        border-radius: 9999px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .draft-chip .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      .draft-chip.s-live {
        background: rgba(196, 30, 58, 0.14);
        color: #e63950;
        border: 1px solid rgba(196, 30, 58, 0.4);
      }
      .draft-chip.s-queued {
        background: rgba(91, 132, 196, 0.14);
        color: var(--info-fg);
        border: 1px solid var(--info-border);
      }
      .draft-chip.s-open {
        background: rgba(197, 165, 90, 0.12);
        color: var(--brand-gold-light);
        border: 1px solid rgba(197, 165, 90, 0.4);
      }
      .draft-chip.s-paused {
        background: rgba(200, 148, 82, 0.14);
        color: var(--warning-fg);
        border: 1px solid var(--warning-border);
      }
      .draft-chip.s-completed {
        background: rgba(108, 128, 186, 0.12);
        color: var(--fg3);
        border: 1px solid var(--outline-default);
      }
      .pulse {
        animation: ls-pulse 1.4s infinite;
      }

      /* Stat line — three-column editorial readout */
      .stat-line {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 16px;
        align-items: end;
        padding: 14px 0;
        border-top: 1px solid var(--outline-subtle);
        border-bottom: 1px solid var(--outline-subtle);
        margin-bottom: 14px;
      }
      .stat-cell .lbl {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--fg4);
        margin-bottom: 4px;
      }
      .stat-cell .val {
        font-family: var(--font-body);
        font-size: 14px;
        color: var(--fg1);
        font-weight: 500;
      }
      .stat-cell .val em {
        font-style: normal;
        color: var(--fg3);
      }

        line-height: 1;
        font-variant-numeric: tabular-nums;

        color: var(--fg4);
        font-size: 15px;
        font-weight: 600;
        margin-left: 2px;

      .spots-num.is-full {
        color: var(--fg3);

      .spots-lbl {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--fg4);

      .spots-bar {
        height: 4px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 2px;
        overflow: hidden;
        position: relative;

        height: 100%;

          90deg,
          var(--brand-gold-dark),

      .btn {

        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;

        border-radius: 12px;
        border: 1px solid transparent;

        transition: all 150ms var(--ease-standard);
        display: inline-flex;
        align-items: center;
        gap: 6px;

        background: var(--brand-navy);
        color: #fff;
        border-color: var(--brand-navy-light);

        background: var(--brand-navy-light);
        transform: translateY(-1px);

      .btn-gold {
        background: var(--brand-gold);
        color: #111827;
      }
      .btn-gold:hover {
        background: var(--brand-gold-light);
        transform: translateY(-1px);
      }
      .btn-ghost {
        background: transparent;
        color: var(--fg1);
        border-color: var(--outline-default);
      }
      .btn-ghost:hover {
        border-color: var(--outline-strong);
        background: rgba(255, 255, 255, 0.04);

      .btn-sm {
        padding: 8px 14px;
        font-size: 11px;
      }

      .full-label {
        font-family: var(--font-body);
        font-size: 14px;
        color: var(--fg3);
        font-style: italic;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .full-label::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--fg4);
      }

      /* Inline join form — slides in under actions */
      .join-form {
        margin-top: 14px;
        padding: 16px;
        background: rgba(10, 15, 26, 0.5);
        border: 1px solid var(--outline-subtle);
        border-radius: 12px;
        animation: join-slide 220ms var(--ease-standard);
        /* MOTION: slide in from top, 220ms ease-standard, on "Join" click */

      @keyframes join-slide {
        from {
          opacity: 0;
          transform: translateY(-4px);

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .join-form-lbl {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--brand-gold-light);
        margin-bottom: 8px;
      }
      .join-input-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: stretch;
      }
      .join-input {
        flex: 1;
        min-width: 200px;
        padding: 11px 14px;
        font-family: var(--font-body);
        font-size: 15px;
        color: var(--fg1);
        background: rgba(10, 15, 26, 0.7);
        border: 1px solid var(--outline-default);
        border-radius: 8px;
        outline: none;
      }
      .join-input::placeholder {
        color: var(--fg4);
        font-style: italic;
      }
      .join-input:focus {
        border-color: var(--focus-ring);
        box-shadow: 0 0 0 3px rgba(78, 142, 214, 0.18);
      }
      .join-form-meta {
        margin-top: 8px;
        font-family: var(--font-body);
        font-size: 12px;
        color: var(--fg4);
        display: flex;
        justify-content: space-between;
      }
      .join-form-meta .count {
        font-family: var(--font-mono);
      }

      /* Join success card (takes over the card body) */

        padding: 22px 22px 22px 22px;
        display: flex;
        align-items: center;
        gap: 14px;
        background: linear-gradient(
          135deg,
          rgba(74, 174, 124, 0.15) 0%,
          rgba(45, 106, 79, 0.08) 100%

        border-top: 1px solid rgba(74, 174, 124, 0.35);

      .join-success .icon {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(74, 174, 124, 0.22);
        color: #6fd39a;

        align-items: center;
        justify-content: center;
        flex-shrink: 0;

      .join-success .msg {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 16px;
        color: var(--fg1);
        letter-spacing: 0.02em;
      }
      .join-success .sub {
        font-family: var(--font-body);
        font-size: 13px;
        color: var(--fg3);
        margin-top: 2px;
        font-style: italic;
      }

      .join-error {
        margin-top: 10px;
        padding: 10px 14px;
        background: rgba(196, 30, 58, 0.1);
        border: 1px solid rgba(196, 30, 58, 0.4);
        border-radius: 8px;
        font-family: var(--font-body);
        font-size: 13px;
        color: #e07a8c;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .join-error svg {
        flex-shrink: 0;
        color: #e63950;
      }

     MOTION: skeleton shimmer, 1.6s linear infinite */

        background: rgba(255, 255, 255, 0.04);
        border-radius: 6px;
        position: relative;
        overflow: hidden;
      }
      .sk::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.05) 50%,
          transparent 100%

        animation: shimmer 1.6s linear infinite;

      @keyframes shimmer {
        0% {

        100% {

        background: var(--surface-card);

        border-radius: 16px;

        flex-direction: column;
        gap: 14px;

      .sk-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 14px;

      .sk-title {
        height: 24px;
        width: 60%;

      .sk-sub {
        height: 14px;
        width: 40%;
        margin-top: 4px;

      .sk-chip {
        height: 22px;
        width: 88px;
        border-radius: 9999px;
      }
      .sk-grid {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 16px;
        padding: 14px 0;
        border-top: 1px solid var(--outline-subtle);
        border-bottom: 1px solid var(--outline-subtle);
      }
      .sk-stat {
        height: 36px;
        width: 80%;
      }
      .sk-btn {
        height: 42px;
        width: 140px;
        border-radius: 12px;
        margin-left: auto;
      }

        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 32px;
        color: var(--fg3);
      }
      .ls-spinner {
        width: 32px;
        height: 32px;
        border-radius: 50%;

        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--fg3);

      .error-card {
        background:
          linear-gradient(
            135deg,
            rgba(196, 30, 58, 0.08) 0%,
            rgba(16, 15, 26, 0.4) 100%

        border-radius: 16px;

        display: flex;
        gap: 18px;
        align-items: flex-start;

        height: 44px;
        border-radius: 50%;
        background: rgba(196, 30, 58, 0.18);

        align-items: center;
        justify-content: center;

      .empty-card {
        background: var(--surface-card);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 48px 32px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;

        font-weight: 700;
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--fg4);
        margin-top: 8px;
      }

      /* ── Footer CTA ──────────────────────────────── */
      .footer-cta {
        margin-top: 32px;
        padding: 32px 28px;
        background:
          linear-gradient(
            135deg,
            rgba(27, 58, 92, 0.35) 0%,
            rgba(10, 15, 26, 0.2) 100%
          ),
          var(--surface-card);
        border: 1px solid rgba(197, 165, 90, 0.25);
        border-radius: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
      }
      .footer-cta-l h3 {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 26px;
        color: var(--fg1-strong);
        margin: 0;
        letter-spacing: -0.01em;
      }
      .footer-cta-l p {
        font-family: var(--font-body);
        color: var(--fg2);
        margin: 6px 0 0;
        max-width: 48ch;
        line-height: 1.5;
      }

      /* ── Mobile tweaks ──────────────────────────── */
      @media (max-width: 720px) {
        .hdr {
          flex-direction: column;
          align-items: flex-start;
        }
        .card-top {
          flex-direction: column;
        }
        .stat-line {
          grid-template-columns: 1fr 1fr;
        }
        .stat-line .spots {
          grid-column: 1 / -1;
          border-top: 1px solid var(--outline-subtle);
          padding-top: 10px;
        }
        .footer-cta {
          flex-direction: column;
          align-items: flex-start;
        }
      }

      /* Mobile frame scoped rules */
      .m-scroll .hdr {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 20px;
      }
      .m-scroll .card-top {
        flex-direction: column;
        align-items: flex-start;
      }
      .m-scroll .card-top .draft-chip {
        align-self: flex-start;
      }
      .m-scroll .card-title {
        font-size: 22px;
      }
      .m-scroll .stat-line {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .m-scroll .stat-line .spots {
        grid-column: 1 / -1;
        border-top: 1px solid var(--outline-subtle);
        padding-top: 12px;
        margin-top: 2px;
      }
      .m-scroll .card-actions {
        justify-content: stretch;
      }
      .m-scroll .card-actions .btn {
        flex: 1;
        justify-content: center;
      }
      .m-scroll .controls {
        padding: 14px;
      }
      .m-scroll .filter-row {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }
      .m-scroll .footer-cta {
        flex-direction: column;
        align-items: flex-start;
        padding: 24px 20px;
      }

      /* Stage-label placement on narrow screens */
      @media (max-width: 1320px) {
        .stage {
          grid-template-columns: 1fr;
          gap: 40px;
        }
        .prod-mobile {
          position: static;
          margin: 0 auto;
        }
      }

      /* Hide scrollbars inside frames */
      .m-scroll::-webkit-scrollbar,
      .d-scroll::-webkit-scrollbar {
        width: 8px;
      }
      .m-scroll::-webkit-scrollbar-thumb,
      .d-scroll::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 4px;
      }
    </style>

        const [refreshing, setRefreshing] = React.useState(false);

        // Simulate filter/search narrowing (keeps the demo lively).

          const q = search.trim().toLowerCase();
          if (

            !lg.name.toLowerCase().includes(q) &&
            !lg.era.toLowerCase().includes(q)

            return false;
          if (draftFilter !== 'all') {
            if (draftFilter === 'open' && lg.draftStatus !== 'not-started')

            if (draftFilter === 'queued' && lg.draftStatus !== 'queued')

                              style={{ marginTop: 6 }}

                          <div>

                            <div

                          setJoiningId(null);

                      </div>
                      <button className="btn btn-gold">
                        <Icon.plus /> Create a League
                      </button>
                    </div>

                </>

            </div>

      /* ── League card ────────────────────────────────── */
      const LeagueCard = ({
        lg,
        joining,
        joined,
        joinError,
        teamName,
        onOpenJoin,
        onCancelJoin,
        onTeamNameChange,
        onSubmitJoin,
      }) => {
        const status = DRAFT_STATUS_LABEL[lg.draftStatus];
        const pool = POOL_LABEL[lg.playerPool];
        const spotsFillPct =
          ((lg.totalSpots - lg.availableSpots) / lg.totalSpots) * 100;

        if (lg.isAlreadyMember) cardCls.push('is-member');
        if (lg.isFull) cardCls.push('is-full');

          <article className={cardCls.join(' ')}>
            {lg.isAlreadyMember && (
              <div className="member-ribbon">

              <>
                <div className="card-body" style={{ paddingBottom: 0 }}>

                      <h2 className="card-title">{lg.name}</h2>
                      <div className="card-dateline">

                        <span className="sep">·</span>Commissioner{' '}
                        {lg.commissioner}
                      </div>

                    <span className={`draft-chip ${status.cls}`}>
                      {status.pulse && <span className="dot pulse" />}
                      {status.full}

                  </div>

                  <div className="icon">
                    <Icon.check />
                  </div>
                  <div>
                    <div className="msg">Joined · Welcome to {lg.name}</div>

                    <div className="sub">Redirecting to your clubhouse…</div>
                  </div>
                </div>
              </>

              <div className="card-body">
                <div className="card-top">
                  <div>
                    <h2 className="card-title">{lg.name}</h2>
                    <div className="card-dateline">
                      {lg.era}
                      <span className="sep">·</span>
                      Commissioner {lg.commissioner}
                      <span className="sep">·</span>
                      {lg.scoring}
                    </div>
                  </div>
                  <span className={`draft-chip ${status.cls}`}>
                    {status.pulse && <span className="dot pulse" />}
                    {status.full}
                  </span>
                </div>

                <div className="stat-line">
                  <div className="stat-cell">
                    <div className="lbl">Player Pool</div>
                    <div className={`val ${pool.cls}`}>{pool.name}</div>
                  </div>
                  <div className="stat-cell">
                    <div className="lbl">Roster</div>
                    <div className="val">
                      <span
                        style={{
                          fontFamily: 'var(--font-display)',
                          fontWeight: 800,
                          fontSize: 18,
                          letterSpacing: '.02em',
                        }}
                      >
                        {lg.maxRosterSize}
                      </span>{' '}
                      <em>players / team</em>
                    </div>
                  </div>
                  <div className="stat-cell spots">
                    <div className="spots-top">
                      <span className="spots-lbl">Spots Open</span>
                    </div>
                    <div className="spots-num" style={{ marginBottom: 8 }}>
                      <span className={lg.isFull ? 'is-full' : ''}>
                        {lg.availableSpots}
                      </span>
                      <span className="of"> / {lg.totalSpots}</span>
                    </div>
                    <div className="spots-bar">
                      <div
                        className={`fill ${lg.isFull ? 'is-full' : ''}`}
                        style={{ width: `${spotsFillPct}%` }}
                      />
                    </div>
                  </div>
                </div>

                {lg.draftDate && !lg.isAlreadyMember && !joining && (
                  <div
                    style={{
                      display: 'flex',
                      alignItems: 'center',
                      gap: 8,
                      marginBottom: 14,
                      fontFamily: 'var(--font-body)',
                      fontSize: 13,

                      {lg.draftDate}

                  </div>

                  <div className="join-form">

      ReactDOM.createRoot(document.getElementById('app')).render(<App />);
    </script>
