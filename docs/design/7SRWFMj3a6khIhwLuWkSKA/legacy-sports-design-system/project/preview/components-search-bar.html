<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        padding: 24px;
        color: var(--fg1);
        font-family: var(--font-body);
      }
      .wrap {
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-width: 680px;
      }
      .lab {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--fg3);
        margin-bottom: 6px;
      }
      .bar {
        display: flex;
        background: var(--surface-card);
        border: 1px solid var(--outline-default);
        border-radius: var(--radius-pill);
        padding: 6px 6px 6px 16px;
        align-items: center;
        gap: 10px;
        transition: all 150ms;
      }
      .bar.focus {
        border-color: var(--focus-ring);
        box-shadow: 0 0 0 3px rgba(78, 142, 214, 0.18);
      }
      .bar svg {
        width: 16px;
        height: 16px;
        stroke: var(--fg3);
        fill: none;
        stroke-width: 1.8;
        flex-shrink: 0;
      }
      .bar input {
        flex: 1;
        background: transparent;
        border: 0;
        outline: 0;
        color: var(--fg1);
        font-family: var(--font-body);
        font-size: 14px;
      }
      .bar input::placeholder {
        color: var(--fg4);
      }
      .bar .filter {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: var(--brand-navy);
        color: #fff;
        border: 0;
        padding: 8px 14px;
        border-radius: 9999px;
        cursor: pointer;
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .chip {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 5px 12px;
        border-radius: 9999px;
        background: rgba(27, 58, 92, 0.22);
        color: var(--fg2);
        border: 1px solid var(--outline-default);
        cursor: pointer;
      }
      .chip.on {
        background: var(--brand-navy);
        color: #fff;
        border-color: var(--brand-navy-light);
      }
      .results {
        background: var(--surface-card);
        border: 1px solid var(--outline-default);
        border-radius: var(--radius-3);
        padding: 6px;
        box-shadow: var(--shadow-md);
      }
      .r {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: var(--radius-2);
      }
      .r:hover {
        background: var(--bg-hover);
      }
      .av {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--grad-navy);
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--brand-gold-light);
      }
      .r .nm {
        font-family: var(--font-body);
        font-size: 14px;
        color: var(--fg1);
      }
      .r .meta {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--fg3);
        margin-left: auto;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>
        <div class="lab">Default · idle</div>
        <div class="bar">
          <svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" /></svg
          ><input placeholder="Search players, teams, eras…" />
        </div>
      </div>
      <div>
        <div class="lab">Focus · with filter button</div>
        <div class="bar focus">
          <svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" /></svg
          ><input value="ruth" /><button class="filter">Filter · 2</button>
        </div>
      </div>
      <div>
        <div class="lab">Active filter chips</div>
        <div class="chips">
          <span class="chip on">Pitchers ×</span
          ><span class="chip on">1920s ×</span><span class="chip">+ Era</span
          ><span class="chip">+ Team</span><span class="chip">Reset</span>
        </div>
      </div>
      <div>
        <div class="lab">Open · with results</div>
        <div class="bar focus">
          <svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" /></svg
          ><input value="ruth" />
        </div>
        <div class="results" style="margin-top: 6px">
          <div class="r">
            <div class="av">BR</div>
            <div class="nm">Babe Ruth</div>
            <div class="meta">1927 · NYY · 60 HR</div>
          </div>
          <div class="r">
            <div class="av">CR</div>
            <div class="nm">Charlie Ruth</div>
            <div class="meta">1893 · LOU · 12 W</div>
          </div>
          <div class="r">
            <div
              class="av"
              style="background: var(--surface-panel); color: var(--fg3)"
            >
              +
            </div>
            <div class="nm" style="color: var(--fg3)">See all 12 results</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
