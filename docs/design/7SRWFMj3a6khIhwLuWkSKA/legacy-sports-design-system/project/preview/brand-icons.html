<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        padding: 18px;
        color: var(--fg1);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 10px;
      }
      .i {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 10px 4px;
        background: var(--surface-panel);
        border-radius: var(--radius-3);
        border: 1px solid var(--outline-subtle);
      }
      .i img {
        width: 28px;
        height: 28px;
      }
      .i span {
        font-family: var(--font-mono);
        font-size: 9px;
        color: var(--fg3);
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <div class="i">
        <img src="../icons/brand/baseball.svg" /><span>baseball</span>
      </div>
      <div class="i">
        <img src="../icons/brand/football.svg" /><span>football</span>
      </div>
      <div class="i">
        <img src="../icons/brand/trophy.svg" /><span>trophy</span>
      </div>
      <div class="i">
        <img src="../icons/brand/draft.svg" /><span>draft</span>
      </div>
      <div class="i">
        <img src="../icons/brand/live.svg" /><span>live</span>
      </div>
      <div class="i">
        <img src="../icons/brand/matchup.svg" /><span>matchup</span>
      </div>
      <div class="i">
        <img src="../icons/brand/stats.svg" /><span>stats</span>
      </div>
      <div class="i">
        <img src="../icons/brand/roster.svg" /><span>roster</span>
      </div>
      <div class="i">
        <img src="../icons/brand/standings.svg" /><span>standings</span>
      </div>
      <div class="i">
        <img src="../icons/brand/league.svg" /><span>league</span>
      </div>
      <div class="i">
        <img src="../icons/brand/scoreboard.svg" /><span>scoreboard</span>
      </div>
      <div class="i">
        <img src="../icons/brand/commissioner.svg" /><span>commish</span>
      </div>
      <div class="i">
        <img src="../icons/brand/secure.svg" /><span>secure</span>
      </div>
      <div class="i">
        <img src="../icons/brand/award.svg" /><span>award</span>
      </div>
      <div class="i">
        <img src="../icons/brand/bell.svg" /><span>bell</span>
      </div>
      <div class="i"><img src="../icons/brand/zap.svg" /><span>zap</span></div>
    </div>
  </body>
</html>
