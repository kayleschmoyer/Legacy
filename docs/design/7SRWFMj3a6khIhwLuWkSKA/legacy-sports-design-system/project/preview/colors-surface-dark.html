<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        padding: 20px;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: stretch;
        flex-wrap: wrap;
      }
      .sw {
        flex: 1;
        min-width: 0;
        border-radius: var(--radius-4);
        padding: 14px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 100px;
        border: 1px solid var(--outline-subtle);
        color: var(--fg1);
      }
      .sw .name {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .sw .hex {
        font-family: var(--font-mono);
        font-size: 11px;
        opacity: 0.65;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="sw" style="background: #0a0f1a">
        <div class="name">BG</div>
        <div class="hex">#0A0F1A</div>
      </div>
      <div class="sw" style="background: #0d1526">
        <div class="name">Surface Subtle</div>
        <div class="hex">#0D1526</div>
      </div>
      <div class="sw" style="background: #111b2f">
        <div class="name">Panel</div>
        <div class="hex">#111B2F</div>
      </div>
      <div class="sw" style="background: #16223a">
        <div class="name">Card</div>
        <div class="hex">#16223A</div>
      </div>
      <div class="sw" style="background: #1c2a47">
        <div class="name">Raised</div>
        <div class="hex">#1C2A47</div>
      </div>
    </div>
  </body>
</html>
