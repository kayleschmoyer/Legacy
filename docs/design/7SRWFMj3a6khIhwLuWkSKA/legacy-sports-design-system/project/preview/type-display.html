<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        padding: 24px;
        color: var(--fg1);
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .r {
        display: flex;
        align-items: baseline;
        gap: 14px;
      }
      .lbl {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--fg3);
        width: 68px;
        flex: none;
      }
    </style>
  </head>
  <body>
    <div class="stack">
      <div class="r">
        <span class="lbl">H1 / 48</span
        ><span
          style="
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 48px;
            letter-spacing: -0.02em;
            line-height: 1;
          "
          >Build Your Dynasty</span
        >
      </div>
      <div class="r">
        <span class="lbl">H2 / 36</span
        ><span
          style="
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 36px;
            letter-spacing: -0.01em;
            line-height: 1.1;
          "
          >Everything you need to win</span
        >
      </div>
      <div class="r">
        <span class="lbl">H3 / 28</span
        ><span
          style="
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 28px;
            line-height: 1.1;
          "
          >Your Leagues</span
        >
      </div>
      <div class="r">
        <span class="lbl">H4 / 22</span
        ><span
          style="
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 22px;
            line-height: 1.2;
          "
          >Dead Ball Dynasty</span
        >
      </div>
    </div>
  </body>
</html>
