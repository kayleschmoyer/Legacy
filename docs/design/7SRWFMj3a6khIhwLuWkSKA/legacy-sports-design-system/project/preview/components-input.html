<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        padding: 24px;
        color: var(--fg1);
        font-family: var(--font-body);
      }
      .wrap {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        max-width: 820px;
      }
      .lab {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--fg3);
        margin-bottom: 8px;
      }
      .demo {
        background: var(--surface-panel);
        border: 1px solid var(--panel-border);
        border-radius: var(--radius-5);
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      label {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--fg3);
      }
      .inp {
        background: var(--surface-card);
        border: 1px solid var(--outline-default);
        border-radius: var(--radius-2);
        padding: 11px 14px;
        color: var(--fg1);
        font-family: var(--font-body);
        font-size: 15px;
        outline: none;
        transition: all 150ms;
        width: 100%;
        box-sizing: border-box;
      }
      .inp::placeholder {
        color: var(--fg4);
      }
      .focus {
        border-color: var(--focus-ring);
        box-shadow: 0 0 0 3px rgba(78, 142, 214, 0.22);
      }
      .err {
        border-color: var(--danger);
        box-shadow: 0 0 0 3px var(--danger-soft);
      }
      .dis {
        opacity: 0.5;
        pointer-events: none;
      }
      .help {
        font-family: var(--font-body);
        font-size: 12px;
        color: var(--fg3);
      }
      .help.error {
        color: var(--danger-fg);
      }
      .adorn {
        position: relative;
      }
      .adorn svg {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 16px;
        height: 16px;
        stroke: var(--fg3);
        fill: none;
        stroke-width: 1.8;
      }
      .adorn .inp {
        padding-left: 38px;
      }
      .text-area {
        min-height: 88px;
        resize: vertical;
        font-family: var(--font-body);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>
        <div class="lab">Default · placeholder · filled</div>
        <div class="demo">
          <label>League Name</label
          ><input class="inp" placeholder="Dead Ball Dynasty" />
          <label>Manager</label><input class="inp" value="Connie Mack" />
        </div>
      </div>
      <div>
        <div class="lab">Focus / error / disabled</div>
        <div class="demo">
          <label>Focused</label><input class="inp focus" value="0410" />
          <label>Error</label><input class="inp err" value="not-a-number" />
          <div class="help error">Must be a 4-digit year</div>
          <label>Disabled</label><input class="inp dis" value="Locked" />
        </div>
      </div>
      <div>
        <div class="lab">With leading icon (search)</div>
        <div class="demo">
          <div class="adorn">
            <svg viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.3-4.3" /></svg
            ><input class="inp" placeholder="Search players, teams, eras…" />
          </div>
        </div>
      </div>
      <div>
        <div class="lab">Textarea</div>
        <div class="demo">
          <label>Commissioner Note</label
          ><textarea
            class="inp text-area"
            placeholder="Trade deadline moved to Friday at 8pm. Don't forget to set lineups."
          ></textarea>
        </div>
      </div>
    </div>
  </body>
</html>
