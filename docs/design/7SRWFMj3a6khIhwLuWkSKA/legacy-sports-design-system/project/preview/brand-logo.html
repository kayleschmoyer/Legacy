<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        padding: 24px;
        color: var(--fg1);
      }
      .wrap {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .wordmark {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 26px;
        letter-spacing: 0.02em;
        color: var(--brand-gold-light);
        line-height: 1;
      }
      .sub {
        font-family: var(--font-body);
        font-size: 13px;
        color: var(--fg3);
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">
        <img src="../assets/logo.png" style="height: 52px" />
        <div>
          <div class="wordmark">LEGACY SPORTS</div>
          <div class="sub">Where history plays on.</div>
        </div>
      </div>
    </div>
  </body>
</html>
