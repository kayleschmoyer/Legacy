<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        padding: 24px;
        color: var(--fg1);
        font-family: var(--font-body);
      }
      .wrap {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        max-width: 840px;
      }
      .lab {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--fg3);
        margin-bottom: 8px;
      }
      .demo {
        background: var(--surface-panel);
        border: 1px solid var(--panel-border);
        border-radius: var(--radius-5);
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .field {
        background: var(--surface-card);
        border: 1px solid var(--outline-default);
        border-radius: var(--radius-2);
        padding: 11px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
      }
      .field svg {
        width: 16px;
        height: 16px;
        stroke: var(--fg3);
        fill: none;
        stroke-width: 1.8;
      }
      .field span {
        font-family: var(--font-mono);
        font-size: 14px;
        color: var(--fg1);
      }
      .field.empty span {
        color: var(--fg4);
      }
      .flabel {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--fg3);
        margin-bottom: 4px;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .time-pick {
        display: flex;
        gap: 8px;
        align-items: center;
        background: var(--surface-card);
        border: 1px solid var(--outline-default);
        border-radius: var(--radius-2);
        padding: 8px 10px;
        justify-content: center;
      }
      .tnum {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 22px;
        color: var(--fg1);
        font-variant-numeric: tabular-nums;
        min-width: 34px;
        text-align: center;
      }
      .tcol {
        color: var(--fg3);
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 22px;
      }
      .ampm {
        display: flex;
        background: var(--surface-card);
        border: 1px solid var(--outline-default);
        border-radius: var(--radius-2);
        padding: 3px;
        width: fit-content;
      }
      .ampm button {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.08em;
        padding: 6px 10px;
        border: 0;
        background: transparent;
        color: var(--fg3);
        cursor: pointer;
        border-radius: 4px;
      }
      .ampm button.on {
        background: var(--brand-navy);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>
        <div class="lab">DatePicker · field</div>
        <div class="demo">
          <div>
            <div class="flabel">Draft Date</div>
            <div class="field">
              <span>Apr 12, 2026</span
              ><svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <path d="M16 2v4M8 2v4M3 10h18" />
              </svg>
            </div>
          </div>
          <div>
            <div class="flabel">Trade Deadline</div>
            <div class="field empty">
              <span>Pick a date…</span
              ><svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <path d="M16 2v4M8 2v4M3 10h18" />
              </svg>
            </div>
          </div>
        </div>
      </div>
      <div>
        <div class="lab">DateTimePicker · combined</div>
        <div class="demo">
          <div class="row">
            <div>
              <div class="flabel">Date</div>
              <div class="field">
                <span>Fri Apr 12</span
                ><svg viewBox="0 0 24 24">
                  <rect x="3" y="4" width="18" height="18" rx="2" />
                </svg>
              </div>
            </div>
            <div>
              <div class="flabel">Time</div>
              <div class="field">
                <span>8:00 PM</span
                ><svg viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="10" />
                  <path d="M12 6v6l4 2" />
                </svg>
              </div>
            </div>
          </div>
          <div class="time-pick">
            <span class="tnum">08</span><span class="tcol">:</span
            ><span class="tnum">00</span>
            <div class="ampm" style="margin-left: 6px">
              <button>AM</button><button class="on">PM</button>
            </div>
          </div>
        </div>
      </div>
      <div>
        <div class="lab">Range · two fields</div>
        <div class="demo">
          <div class="row">
            <div>
              <div class="flabel">Season Start</div>
              <div class="field">
                <span>Apr 1, 2026</span
                ><svg viewBox="0 0 24 24">
                  <rect x="3" y="4" width="18" height="18" rx="2" />
                </svg>
              </div>
            </div>
            <div>
              <div class="flabel">Season End</div>
              <div class="field">
                <span>Sep 28, 2026</span
                ><svg viewBox="0 0 24 24">
                  <rect x="3" y="4" width="18" height="18" rx="2" />
                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div>
        <div class="lab">Inline error</div>
        <div class="demo">
          <div>
            <div class="flabel">Trade Deadline</div>
            <div
              class="field"
              style="
                border-color: var(--danger);
                box-shadow: 0 0 0 3px var(--danger-soft);
              "
            >
              <span>Mar 1, 2025 (past)</span
              ><svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="18" rx="2" />
              </svg>
            </div>
            <div
              style="
                font-family: var(--font-body);
                font-size: 12px;
                color: var(--danger-fg);
                margin-top: 4px;
              "
            >
              Deadline must be after season start
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
