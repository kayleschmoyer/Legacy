<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        padding: 0;
        color: var(--fg1);
        min-height: 200px;
      }
      .hero {
        padding: 32px;
        background: var(--grad-hero), var(--bg);
        background-attachment: fixed;
        min-height: 200px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
      }
      .eyebrow {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--brand-gold-light);
      }
      h1 {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.02em;
        line-height: 1;
        margin: 0;
      }
      .sub {
        font-family: var(--font-body);
        font-size: 17px;
        color: var(--fg2);
        max-width: 520px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <div class="eyebrow">Night Stadium · Signature Background</div>
      <h1>Build Your Dynasty.<br />Dominate Your League.</h1>
      <p class="sub">
        The only fantasy baseball platform powered by real MLB history — draft
        legends across every era.
      </p>
    </div>
  </body>
</html>
