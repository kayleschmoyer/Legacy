<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        padding: 20px;
        color: var(--fg1);
      }
      .card {
        background: var(--surface-card);
        border-left: 4px solid var(--pos-pitcher);
        border-radius: var(--radius-3);
        padding: 14px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 520px;
        margin-bottom: 10px;
        box-shadow: var(--shadow-sm);
      }
      .l {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .av {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--grad-navy);
        border: 2px solid var(--brand-gold);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-weight: 800;
        color: var(--brand-gold-light);
      }
      .name {
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 15px;
      }
      .sub {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--fg3);
        margin-top: 2px;
      }
      .pchip {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 10px;
        letter-spacing: 0.08em;
        padding: 3px 8px;
        border-radius: 4px;
        color: #fff;
        display: inline-block;
        margin-right: 6px;
      }
      .stat {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 22px;
        font-variant-numeric: tabular-nums;
      }
      .of {
        border-left-color: var(--pos-outfield);
      }
      .if {
        border-left-color: var(--pos-infield);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="l">
        <div class="av">RJ</div>
        <div>
          <div>
            <span class="pchip" style="background: var(--pos-pitcher)">P</span
            ><span class="name">Randy Johnson</span>
          </div>
          <div class="sub">1998 · ARI · 329 K · 2.48 ERA</div>
        </div>
      </div>
      <div class="stat">24.5</div>
    </div>
    <div class="card of">
      <div class="l">
        <div
          class="av"
          style="background: linear-gradient(135deg, #2d6a4f, #1b3a5c)"
        >
          BB
        </div>
        <div>
          <div>
            <span class="pchip" style="background: var(--pos-outfield)">OF</span
            ><span class="name">Barry Bonds</span>
          </div>
          <div class="sub">2001 · SF · .328 · 73 HR</div>
        </div>
      </div>
      <div class="stat">31.2</div>
    </div>
    <div class="card if">
      <div class="l">
        <div
          class="av"
          style="background: linear-gradient(135deg, #8b6f47, #1b3a5c)"
        >
          LG
        </div>
        <div>
          <div>
            <span class="pchip" style="background: var(--pos-infield)">SS</span
            ><span class="name">Lou Gehrig</span>
          </div>
          <div class="sub">1927 · NYY · .373 · 47 HR</div>
        </div>
      </div>
      <div class="stat">27.8</div>
    </div>
  </body>
</html>
