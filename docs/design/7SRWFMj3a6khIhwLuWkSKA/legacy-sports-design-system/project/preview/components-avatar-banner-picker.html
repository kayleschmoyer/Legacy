<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        padding: 24px;
        color: var(--fg1);
        font-family: var(--font-body);
      }
      .wrap {
        display: flex;
        flex-direction: column;
        gap: 18px;
        max-width: 760px;
      }
      .lab {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--fg3);
        margin-bottom: 8px;
      }
      .demo {
        background: var(--surface-panel);
        border: 1px solid var(--panel-border);
        border-radius: var(--radius-5);
        padding: 18px;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .opt {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--grad-avatar);
        background-clip: padding-box;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--fg1-strong);
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 18px;
        border: 0;
        cursor: pointer;
        position: relative;
      }
      .opt.sel {
        box-shadow:
          0 0 0 2px var(--brand-gold),
          var(--shadow-gold);
      }
      .opt.sel::after {
        content: '✓';
        position: absolute;
        bottom: -2px;
        right: -2px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--brand-gold);
        color: #111;
        font-size: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
      }
      .opt.upload {
        background: var(--surface-card);
        box-shadow:
          inset 0 0 0 1px var(--outline-default),
          inset 0 0 0 2px transparent;
        color: var(--fg3);
      }
      .opt.upload {
        background-image: none;
        background-color: var(--surface-card);
      }
      .opt svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
      }
      .banners {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }
      .banner {
        aspect-ratio: 3/1;
        border-radius: var(--radius-3);
        background-clip: padding-box;
        border: 0;
        cursor: pointer;
        position: relative;
      }
      .banner.sel {
        box-shadow:
          0 0 0 2px var(--brand-gold),
          var(--shadow-gold);
      }
      .b1 {
        background: linear-gradient(135deg, #1b3a5c, #143050);
      }
      .b2 {
        background: linear-gradient(135deg, #1b3a5c, #c5a55a);
      }
      .b3 {
        background: linear-gradient(135deg, #0a0f1a, #c41e3a);
      }
      .b4 {
        background: linear-gradient(135deg, #2d6a4f, #0a0f1a);
      }
      .b5 {
        background: linear-gradient(135deg, #8b6f47, #1b3a5c);
      }
      .b6 {
        background: linear-gradient(135deg, #c5a55a, #a68b3e);
      }
      .b7 {
        background: linear-gradient(135deg, #1b3a5c, #2d6a4f);
      }
      .b8 {
        background: #0a0f1a;
        box-shadow: inset 0 0 0 1px var(--outline-default);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--fg3);
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>
        <div class="lab">AvatarPicker · grid + upload</div>
        <div class="demo">
          <div class="row">
            <div
              class="opt sel"
              style="background: linear-gradient(135deg, #c41e3a, #8b1a2b)"
            >
              P
            </div>
            <div
              class="opt"
              style="background: linear-gradient(135deg, #7c8794, #1b3a5c)"
            >
              C
            </div>
            <div
              class="opt"
              style="background: linear-gradient(135deg, #8b6f47, #1b3a5c)"
            >
              IF
            </div>
            <div
              class="opt"
              style="background: linear-gradient(135deg, #2d6a4f, #1b3a5c)"
            >
              OF
            </div>
            <div class="opt" style="background: var(--grad-gold); color: #111">
              U
            </div>
            <div class="opt" style="background: var(--grad-navy)">RJ</div>
            <div class="opt upload">
              <svg viewBox="0 0 24 24">
                <path
                  d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"
                />
              </svg>
            </div>
          </div>
        </div>
      </div>
      <div>
        <div class="lab">BannerPicker · 8 presets</div>
        <div class="demo">
          <div class="banners">
            <div class="banner b1 sel"></div>
            <div class="banner b2"></div>
            <div class="banner b3"></div>
            <div class="banner b4"></div>
            <div class="banner b5"></div>
            <div class="banner b6"></div>
            <div class="banner b7"></div>
            <div class="banner b8">Upload</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
