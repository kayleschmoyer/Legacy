<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        padding: 20px;
        color: var(--fg1);
      }
      .card {
        background: var(--surface-card);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: var(--radius-5);
        padding: 20px;
        max-width: 420px;
        box-shadow: var(--shadow-md);
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      .title {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 20px;
      }
      .meta {
        font-family: var(--font-body);
        color: var(--fg3);
        font-size: 13px;
        margin-top: 4px;
      }
      .score-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 16px;
        background: rgba(255, 255, 255, 0.02);
        border-radius: var(--radius-3);
        margin-bottom: 8px;
      }
      .tm {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .abbr {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.04em;
      }
      .sc {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 28px;
        font-variant-numeric: tabular-nums;
      }
      .rec {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--fg3);
      }
      .dot {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
      .dot-navy {
        background: linear-gradient(135deg, #2c4a7c 0%, #143050 100%);
      }
      .dot-red {
        background: linear-gradient(135deg, #e63950 0%, #8b1a2b 100%);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="row">
        <div>
          <div class="title">Dead Ball Dynasty</div>
          <div class="meta">Week 14/22 · 12 teams</div>
        </div>
      </div>
      <div class="score-row">
        <div class="tm">
          <div class="dot dot-navy"></div>
          <div>
            <div class="abbr">NYY Yankees</div>
            <div class="rec">8-4 · 1st</div>
          </div>
        </div>
        <div class="sc">127.5</div>
      </div>
      <div class="score-row">
        <div class="tm">
          <div class="dot dot-red"></div>
          <div>
            <div class="abbr">BOS Red Sox</div>
            <div class="rec">7-5 · 2nd</div>
          </div>
        </div>
        <div class="sc" style="color: var(--fg3)">112.3</div>
      </div>
    </div>
  </body>
</html>
