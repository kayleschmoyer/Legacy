<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        padding: 24px;
        color: var(--fg1);
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }
      .btn {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 12px 20px;
        border-radius: var(--radius-4);
        border: 1px solid transparent;
        cursor: pointer;
        transition: all var(--dur-fast) var(--ease-standard);
      }
      .primary {
        background: var(--brand-navy);
        color: #fff;
        border-color: var(--brand-navy-light);
      }
      .primary:hover {
        background: var(--brand-navy-light);
        transform: translateY(-1px);
      }
      .gold {
        background: var(--brand-gold);
        color: #111;
      }
      .gold:hover {
        background: var(--brand-gold-light);
      }
      .ghost {
        background: transparent;
        color: var(--fg1);
        border-color: var(--outline-default);
      }
      .ghost:hover {
        border-color: var(--outline-strong);
        background: rgba(255, 255, 255, 0.04);
      }
      .seam {
        background: var(--brand-seam-red);
        color: #fff;
      }
      .pill {
        border-radius: 9999px;
        padding: 8px 16px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <button class="btn primary">Create a League</button>
      <button class="btn gold">View League</button>
      <button class="btn seam">Join Draft</button>
      <button class="btn ghost">Cancel</button>
      <button class="btn primary pill">Week 14/22</button>
    </div>
  </body>
</html>
