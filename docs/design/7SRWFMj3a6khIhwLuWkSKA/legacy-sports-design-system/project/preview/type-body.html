<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        padding: 24px;
        color: var(--fg1);
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .r {
        display: flex;
        align-items: baseline;
        gap: 14px;
      }
      .lbl {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--fg3);
        width: 72px;
        flex: none;
      }
    </style>
  </head>
  <body>
    <div class="stack">
      <div class="r">
        <span class="lbl">LEDE / 18</span
        ><span
          style="
            font-family: var(--font-body);
            font-size: 18px;
            line-height: 1.6;
            color: var(--fg2);
          "
          >The only fantasy baseball platform powered by real MLB history.</span
        >
      </div>
      <div class="r">
        <span class="lbl">BODY / 16</span
        ><span
          style="
            font-family: var(--font-body);
            font-size: 16px;
            line-height: 1.55;
            color: var(--fg2);
          "
          >Draft legends across every era and compete on archived
          statistics.</span
        >
      </div>
      <div class="r">
        <span class="lbl">CAPTION / 14</span
        ><span
          style="
            font-family: var(--font-body);
            font-size: 14px;
            color: var(--fg3);
          "
          >Week 14/22 · 12 teams · Draft: Fri Apr 12</span
        >
      </div>
      <div class="r">
        <span class="lbl">EYEBROW / 12</span
        ><span
          style="
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--fg3);
          "
          >Features · All Sports</span
        >
      </div>
    </div>
  </body>
</html>
