<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        padding: 24px;
        color: var(--fg1);
      }
      .wrap {
        display: flex;
        flex-direction: column;
        gap: 18px;
        max-width: 680px;
      }
      .lab {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--fg3);
        margin-bottom: 8px;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .b {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 4px 10px;
        border-radius: 9999px;
        border: 1px solid;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .info {
        background: var(--info-soft);
        color: var(--info-fg);
        border-color: var(--info-border);
      }
      .success {
        background: var(--success-soft);
        color: var(--success-fg);
        border-color: var(--success-border);
      }
      .warning {
        background: var(--warning-soft);
        color: var(--warning-fg);
        border-color: var(--warning-border);
      }
      .error {
        background: var(--danger-soft);
        color: var(--danger-fg);
        border-color: var(--danger-border);
      }
      .neutral {
        background: rgba(127, 144, 174, 0.12);
        color: var(--fg3);
        border-color: var(--outline-default);
      }
      .accent {
        background: rgba(197, 165, 90, 0.12);
        color: var(--brand-gold-light);
        border-color: rgba(197, 165, 90, 0.4);
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }
      @keyframes p {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      .pulse {
        animation: p 1.4s var(--ease-standard) infinite;
      }
      .demo {
        background: var(--surface-panel);
        border: 1px solid var(--panel-border);
        border-radius: var(--radius-5);
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>
        <div class="lab">Variants</div>
        <div class="demo">
          <div class="row">
            <span class="b info">Info</span><span class="b success">Active</span
            ><span class="b warning">Coming Soon</span
            ><span class="b error">Error</span
            ><span class="b neutral">Final</span
            ><span class="b accent">Premium</span>
          </div>
        </div>
      </div>
      <div>
        <div class="lab">With dot indicators</div>
        <div class="demo">
          <div class="row">
            <span class="b error"
              ><span class="dot pulse" style="background: #e63950"></span>Draft
              Live</span
            ><span class="b accent"
              ><span class="dot" style="background: var(--brand-gold)"></span
              >Pre-Draft</span
            ><span class="b success"
              ><span class="dot" style="background: #4aae7c"></span>On
              Time</span
            >
          </div>
        </div>
      </div>
      <div>
        <div class="lab">Sizes (xs/sm/md)</div>
        <div class="demo">
          <div class="row">
            <span class="b info" style="font-size: 9px; padding: 2px 8px"
              >XS</span
            ><span class="b info" style="font-size: 11px">SM</span
            ><span class="b info" style="font-size: 13px; padding: 6px 14px"
              >MD</span
            >
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
