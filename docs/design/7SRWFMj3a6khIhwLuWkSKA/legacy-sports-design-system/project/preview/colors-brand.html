<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        padding: 20px;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: stretch;
        flex-wrap: wrap;
      }
      .sw {
        flex: 1;
        min-width: 0;
        border-radius: var(--radius-4);
        padding: 14px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 100px;
        border: 1px solid var(--outline-subtle);
      }
      .sw .name {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: inherit;
      }
      .sw .hex {
        font-family: var(--font-mono);
        font-size: 11px;
        opacity: 0.75;
        color: inherit;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="sw" style="background: var(--brand-navy); color: #fff">
        <div class="name">Brand Navy</div>
        <div class="hex">#1B3A5C</div>
      </div>
      <div class="sw" style="background: var(--brand-navy-dark); color: #fff">
        <div class="name">Navy Dark</div>
        <div class="hex">#143050</div>
      </div>
      <div class="sw" style="background: var(--brand-seam-red); color: #fff">
        <div class="name">Seam Red</div>
        <div class="hex">#C41E3A</div>
      </div>
      <div class="sw" style="background: var(--brand-gold); color: #111">
        <div class="name">Aged Gold</div>
        <div class="hex">#C5A55A</div>
      </div>
      <div class="sw" style="background: var(--brand-gold-light); color: #111">
        <div class="name">Gold Light</div>
        <div class="hex">#D4BB78</div>
      </div>
    </div>
  </body>
</html>
