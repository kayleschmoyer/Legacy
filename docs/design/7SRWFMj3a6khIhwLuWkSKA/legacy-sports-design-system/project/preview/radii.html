<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        padding: 20px;
        color: var(--fg1);
      }
      .row {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .box {
        width: 56px;
        height: 56px;
        background: var(--brand-navy);
        border: 1px solid var(--outline-default);
      }
      .lbl {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--fg3);
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="item">
        <div class="box" style="border-radius: 4px"></div>
        <div class="lbl">4 · chip</div>
      </div>
      <div class="item">
        <div class="box" style="border-radius: 6px"></div>
        <div class="lbl">6 · input</div>
      </div>
      <div class="item">
        <div class="box" style="border-radius: 8px"></div>
        <div class="lbl">8 · badge</div>
      </div>
      <div class="item">
        <div class="box" style="border-radius: 12px"></div>
        <div class="lbl">12 · button</div>
      </div>
      <div class="item">
        <div class="box" style="border-radius: 16px"></div>
        <div class="lbl">16 · card</div>
      </div>
      <div class="item">
        <div class="box" style="border-radius: 20px"></div>
        <div class="lbl">20 · panel</div>
      </div>
      <div class="item">
        <div class="box" style="border-radius: 24px"></div>
        <div class="lbl">24 · hero</div>
      </div>
      <div class="item">
        <div class="box" style="border-radius: 9999px"></div>
        <div class="lbl">pill</div>
      </div>
    </div>
  </body>
</html>
