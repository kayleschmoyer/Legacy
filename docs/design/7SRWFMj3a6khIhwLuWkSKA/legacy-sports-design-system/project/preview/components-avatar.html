<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        padding: 24px;
        color: var(--fg1);
        font-family: var(--font-body);
      }
      .wrap {
        display: flex;
        flex-direction: column;
        gap: 18px;
        max-width: 680px;
      }
      .lab {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--fg3);
        margin-bottom: 8px;
      }
      .demo {
        background: var(--surface-panel);
        border: 1px solid var(--panel-border);
        border-radius: var(--radius-5);
        padding: 18px;
        display: flex;
        gap: 18px;
        align-items: center;
        flex-wrap: wrap;
      }
      .av {
        border-radius: 50%;
        background: var(--grad-avatar);
        background-clip: padding-box;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--fg1-strong);
        font-family: var(--font-display);
        font-weight: 800;
        border: 0;
        box-shadow: var(--shadow-sm);
      }
      .xs {
        width: 24px;
        height: 24px;
        font-size: 10px;
      }
      .sm {
        width: 32px;
        height: 32px;
        font-size: 12px;
      }
      .md {
        width: 44px;
        height: 44px;
        font-size: 14px;
      }
      .lg {
        width: 64px;
        height: 64px;
        font-size: 20px;
      }
      .xl {
        width: 88px;
        height: 88px;
        font-size: 28px;
      }
      .gold {
        box-shadow:
          0 0 0 2px var(--brand-gold),
          var(--shadow-sm);
      }
      .seam {
        box-shadow:
          0 0 0 2px var(--brand-seam-red),
          var(--shadow-sm);
      }
      .cap {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--fg3);
        margin-top: 6px;
        text-align: center;
      }
      .col {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>
        <div class="lab">Sizes</div>
        <div class="demo">
          <div class="col">
            <div class="av xs">RJ</div>
            <div class="cap">xs · 24</div>
          </div>
          <div class="col">
            <div class="av sm">BB</div>
            <div class="cap">sm · 32</div>
          </div>
          <div class="col">
            <div class="av md">LG</div>
            <div class="cap">md · 44</div>
          </div>
          <div class="col">
            <div class="av lg">TC</div>
            <div class="cap">lg · 64</div>
          </div>
          <div class="col">
            <div class="av xl">SM</div>
            <div class="cap">xl · 88</div>
          </div>
        </div>
      </div>
      <div>
        <div class="lab">Ring variants</div>
        <div class="demo">
          <div class="col">
            <div class="av lg">JD</div>
            <div class="cap">none</div>
          </div>
          <div class="col">
            <div class="av lg gold">JD</div>
            <div class="cap">gold · champion</div>
          </div>
          <div class="col">
            <div class="av lg seam">JD</div>
            <div class="cap">seam · live</div>
          </div>
          <div class="col">
            <div
              class="av lg"
              style="
                box-shadow:
                  0 0 0 2px var(--success),
                  0 0 0 4px var(--success-soft);
              "
            >
              JD
            </div>
            <div class="cap">success</div>
          </div>
        </div>
      </div>
      <div>
        <div class="lab">Fallback states</div>
        <div class="demo">
          <div class="col">
            <div
              class="av md"
              style="
                background: var(--surface-card);
                color: var(--fg3);
                box-shadow: inset 0 0 0 1px var(--outline-default);
              "
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <circle cx="12" cy="8" r="4" />
                <path d="M4 21a8 8 0 0 1 16 0" />
              </svg>
            </div>
            <div class="cap">empty</div>
          </div>
          <div class="col">
            <div
              class="av md"
              style="background: var(--surface-card); color: var(--fg3)"
            >
              ??
            </div>
            <div class="cap">unknown</div>
          </div>
          <div class="col">
            <div class="av md" style="background: var(--brand-navy)">RJ</div>
            <div class="cap">initials</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
