<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Legacy Sports — Web UI Kit</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="../../assets/favicon.ico" />
    <link rel="stylesheet" href="../../colors_and_type.css" />
    <link rel="stylesheet" href="styles.css" />
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <!-- BREAKPOINTS: canonical Tamagui bands (lib/design-tokens/src/lib/breakpoints.ts),
         mirrored in preview/breakpoints.html. Every band is claimed below by a
         designed frame or an explicit annotation — none left to chance.
           xxs (0–659px)    — fully designed frame: condensed nav (wordmark
                              subtitle + marketing links drop), single-column
                              grids, tighter page padding. See styles.css
                              "xxs" block (max-width: 659px).
           xs (660–799px)   — shares xxs's single-column feature/sport grid
                              and stacked matchup header; nav/page padding
                              return to the desktop treatment. See styles.css
                              "≤ xs" block (max-width: 799px).
           sm (800–859px)   — two-column feature/sport grids resume; nav
                              tabs and draft board still follow the shared
                              ≤ md treatment below.
           md (860–979px)   — shares sm's two-column grids; no layout change
                              of its own at this threshold. See styles.css
                              "≤ md" block (max-width: 979px) for the
                              nav/draft rule shared by sm through md.
           lg (980–1119px)  — top nav tabs return, draft board splits into
                              its two-column grid; this is the file's base
                              (unmodified) desktop layout.
           xl (1120–1279px) — shares lg's base desktop layout; content still
                              caps at the shared max-widths.
           xxl (1280px+)    — fully designed frame: four-column feature
                              grid, wider league/game card grid, full-bleed
                              page padding. See styles.css "xxl" block
                              (min-width: 1280px).
         Reflow thresholds: 660 / 800 / 860 / 980 / 1120 / 1280 — no invented
         breakpoints. -->
    <div id="app"></div>
    <script type="text/babel" src="Nav.jsx"></script>
    <script type="text/babel" src="Landing.jsx"></script>
    <script type="text/babel" src="Dashboard.jsx"></script>
    <script type="text/babel" src="Scoreboard.jsx"></script>
    <script type="text/babel" src="League.jsx"></script>
    <script type="text/babel" src="Draft.jsx"></script>
    <script type="text/babel" data-presets="react">
      const App = () => {
        const initial = localStorage.getItem('ls-screen') || 'landing';
        const [screen, setScreen] = React.useState(initial);
        const [league, setLeague] = React.useState(null);
        React.useEffect(() => {
          localStorage.setItem('ls-screen', screen);
        }, [screen]);
        const loggedIn = screen !== 'landing';
        const goto = (s) => setScreen(s === 'league' ? 'league' : s);
        return (
          <div data-screen-label={screen}>
            <Nav current={screen} onNav={goto} loggedIn={loggedIn} />
            {screen === 'landing' && (
              <Landing onEnter={() => setScreen('home')} />
            )}
            {screen === 'home' && (
              <Dashboard
                onOpenLeague={(lg) => {
                  setLeague(lg);
                  setScreen('league');
                }}
              />
            )}
            {screen === 'scoreboard' && <Scoreboard />}
            {screen === 'league' && <League league={league} />}
            {screen === 'draft' && <DraftBoard />}
          </div>
        );
      };
      ReactDOM.createRoot(document.getElementById('app')).render(<App />);
    </script>
  </body>
</html>
