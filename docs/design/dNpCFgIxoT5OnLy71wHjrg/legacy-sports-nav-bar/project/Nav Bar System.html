<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Legacy Sports — Nav Bar System</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="assets/logo.png" />
    <link rel="stylesheet" href="assets/colors_and_type.css?v=7" />
    <link rel="stylesheet" href="styles.css?v=7" />
    <link rel="stylesheet" href="interaction-states.css?v=1" />
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="app"></div>

    <script>
      const TWEAKS_DEFAULTS = /*EDITMODE-BEGIN*/ {
        theme: 'dark',
      }; /*EDITMODE-END*/
    </script>

    <script type="text/babel" src="NavParts.jsx"></script>
    <script type="text/babel" src="NavPopovers.jsx"></script>
    <script type="text/babel" src="NavBars.jsx"></script>
    <script type="text/babel" src="NavStates.jsx"></script>
    <script type="text/babel" data-presets="react">
      // Mini helper: place a popover into a nav with proper active state tracking
      const openPop = (pop) => {
        const fn = (kind) => App._setPop && App._setPop(kind);
        fn._ = pop;
        return fn;
      };

      // Callout labels for anatomy drawing
      const Callout = ({ children, style }) => (
        <div className="anatomy-label" style={style}>
          {children}
        </div>
      );

      // ── The top-level canvas ──────────────────────────────────
      // Preview-host origin for the EDITMODE protocol: this mockup is loaded
      // in an iframe by Claude Design's editor at whatever origin is hosting
      // that session, so the target can't be a fixed hostname. Derive it from
      // document.referrer (set by the embedding frame) instead of '*'.
      const editModeTargetOrigin = (() => {
        try {
          return document.referrer ? new URL(document.referrer).origin : '*';
        } catch (e) {
          return '*';
        }
      })();

      const App = () => {
        const initial =
          JSON.parse(localStorage.getItem('ls-tweaks') || 'null') ||
          TWEAKS_DEFAULTS;
        const [theme, setTheme] = React.useState(initial.theme || 'dark');
        const [editMode, setEditMode] = React.useState(false);
        const [pop, setPop] = React.useState(null);
        App._setPop = setPop;

        React.useEffect(() => {
          document.documentElement.setAttribute('data-theme', theme);
          localStorage.setItem('ls-tweaks', JSON.stringify({ theme }));
          if (window.parent !== window) {
            window.parent.postMessage(
              { type: '__edit_mode_set_keys', edits: { theme } },
              editModeTargetOrigin,
            );
          }
        }, [theme]);

        // Tweaks protocol
        React.useEffect(() => {
          const handler = (e) => {
            const d = e.data;
            if (!d || !d.type) return;
            if (d.type === '__activate_edit_mode') setEditMode(true);
            if (d.type === '__deactivate_edit_mode') setEditMode(false);
          };
          window.addEventListener('message', handler);
          window.parent.postMessage(
            { type: '__edit_mode_available' },
            editModeTargetOrigin,
          );
          return () => window.removeEventListener('message', handler);
        }, []);

        const popFn = (kind) => setPop(pop === kind ? null : kind);
        popFn._ = pop;

        // Mobile drawer toggle per-frame
        const [drawerA, setDrawerA] = React.useState(false);

        // §02 — data state driving every nav surface at once
        const [navState, setNavState] = React.useState('populated');
        const retryTimer = React.useRef(null);
        const retry = () => {
          setNavState('loading');
          clearTimeout(retryTimer.current);
          retryTimer.current = setTimeout(() => setNavState('populated'), 1100);
        };
        React.useEffect(() => () => clearTimeout(retryTimer.current), []);
        const stateHint = (NAV_STATES.find((s) => s.id === navState) || {}).hint;

        // §05 — which device chrome wraps the shared mobile mock
        const [chrome, setChrome] = React.useState('native');

        return (
          <div className="canvas" data-screen-label="Nav System">
            <div className="canvas-head">
              <div>
                <span className="eyebrow">The Clubhouse — UI Navigation</span>
                <h1>Nav Bar System</h1>
                <p>
                  Night-stadium glass, pill tabs, league-switcher, ticker, and a
                  commissioner's keychain of menus — worked across desktop,
                  tablet, mobile web, and native iOS. Every surface uses the
                  same tokens so the Dugout feels like one room.
                </p>
              </div>
              <div
                style={{
                  display: 'flex',
                  flexDirection: 'column',
                  gap: 8,
                  alignItems: 'flex-end',
                }}
              >
                <div
                  style={{
                    fontFamily: 'var(--font-display)',
                    fontWeight: 700,
                    fontSize: 11,
                    letterSpacing: '0.14em',
                    textTransform: 'uppercase',
                    color: 'var(--fg3)',
                  }}
                >
                  3 surfaces · 4 data states · 1 system
                </div>
                <div style={{ display: 'flex', gap: 6 }}>
                  <span className="ls-chip ls-chip-live">
                    <span className="ls-dot-pulse" /> Baseball · Live
                  </span>
                </div>
              </div>
            </div>

            {/* ═══════════════════════════════════════════════════
          §01 — DESKTOP · ANATOMY
          ═══════════════════════════════════════════════════ */}
            <div className="section">
              <div className="section-head">
                <div
                  style={{ display: 'flex', alignItems: 'baseline', gap: 16 }}
                >
                  <span className="num">§ 01</span>
                  <h2>Desktop · Anatomy</h2>
                </div>
                <p>
                  Glass-blur strip, 56px tall. Logo + league-switcher on the
                  left, pill tabs centered, search + utilities on the right.
                  Ticker slides in underneath.
                </p>
              </div>

              {/* BREAKPOINTS: this full-search layout serves xl–xxl (1120–1280px+) as one
              continuum — nothing in the anatomy changes between xl and xxl, only the
              viewport grows. The frame below is designed at 1280px (xxl). */}
              <p className="caption">
                <span className="dot" />
                Logged-in default · 1280px (xxl, 1280px+; shared unchanged with xl, 1120–1279px)
                <span className="hint">
                  The everyday state — one league selected, ticker on
                </span>
              </p>
              <div className="slab anatomy-wrap">
                <NavDesktop
                  current="players"
                  openPop={null}
                  showTicker={true}
                />
                <div
                  className="slab-content fake-content-wrap"
                  style={{ padding: '32px' }}
                >
                  <div
                    style={{
                      fontFamily: 'var(--font-display)',
                      fontWeight: 800,
                      fontSize: 14,
                      letterSpacing: '0.16em',
                      color: 'var(--fg3)',
                    }}
                  >
                    WELCOME, MIGUEL
                  </div>
                  <div className="fake-pagetitle">
                    Week 14 · Legends of Summer
                  </div>
                  <div className="fake-card-row">
                    <div className="fake-card" />
                    <div className="fake-card" />
                    <div className="fake-card" />
                  </div>
                </div>
              </div>

              <div className="spec-grid">
                <div className="spec-card">
                  <span className="k">Height</span>
                  <span className="v">56 px</span>
                  <span className="desc">
                    Sticky, top:0, z:20. 12px vertical padding, glass blur 16px.
                  </span>
                </div>
                <div className="spec-card">
                  <span className="k">Surface</span>
                  <span className="v">rgba(10,15,26,.78)</span>
                  <span className="desc">
                    Night stadium glass + 140% saturate. 1px border-bottom in
                    panel-border.
                  </span>
                </div>
                <div className="spec-card">
                  <span className="k">Tabs</span>
                  <span className="v">Pill group · 12px</span>
                  <span className="desc">
                    Big Shoulders 700, 0.08em tracking. Active pill = brand-navy
                    + inner gold seam.
                  </span>
                </div>
                <div className="spec-card">
                  <span className="k">Ticker</span>
                  <span className="v">36 px · ↔ 40s loop</span>
                  <span className="desc">
                    Linear CSS scroll. Seam-red label when at least one game is
                    live.
                  </span>
                </div>
              </div>
            </div>

            {/* ═══════════════════════════════════════════════════
          §02 — DATA STATES (switchable)
          ═══════════════════════════════════════════════════ */}
            <div className="section" data-screen-label="Data states">
              <div className="section-head">
                <div style={{ display: 'flex', alignItems: 'baseline', gap: 16 }}>
                  <span className="num">§ 02</span>
                  <h2>Data States</h2>
                </div>
                <p>
                  One switch drives every surface at once — top nav and ticker,
                  the notification tray and league dropdown, and the mobile
                  header + dugout rail.
                </p>
              </div>

              <div className="state-switch-bar">
                <StateSwitch value={navState} onChange={setNavState} />
                <p className="sw-hint">{stateHint}</p>
              </div>

              <p className="caption">
                <span
                  className="dot"
                  style={
                    navState === 'error'
                      ? { background: 'var(--brand-seam-red)' }
                      : undefined
                  }
                />
                Desktop · {navState}
                <span className="hint">
                  Retry anywhere returns the nav to loading, then populated
                </span>
              </p>
              <div className="slab">
                <NavDesktopState state={navState} onRetry={retry} />
              </div>

              <div className="state-grid">
                <div className="state-panels">
                  <div className="state-panel">
                    <p className="caption">Notification tray</p>
                    <NotifTrayState state={navState} onRetry={retry} />
                  </div>
                  <div className="state-panel">
                    <p className="caption">League switcher menu</p>
                    <LeagueDropdownState state={navState} onRetry={retry} />
                  </div>
                </div>
                <div>
                  <p
                    className="caption"
                    style={{ justifyContent: 'center', textAlign: 'center' }}
                  >
                    Mobile · header + dugout rail
                  </p>
                  <PhoneMockState state={navState} onRetry={retry} />
                </div>
              </div>
            </div>

            {/* ═══════════════════════════════════════════════════
          §03 — DESKTOP STATES
          ═══════════════════════════════════════════════════ */}
            <div className="section">
              <div className="section-head">
                <div
                  style={{ display: 'flex', alignItems: 'baseline', gap: 16 }}
                >
                  <span className="num">§ 03</span>
                  <h2>Desktop · Menus & Modes</h2>
                </div>
                <p>
                  Every open-menu, live-draft, scrolled, and search-focused
                  state the nav steps through.
                </p>
              </div>

              <p className="caption">
                <span className="dot" />
                Logged out · marketing
                <span className="hint">
                  No league context — gold CTA dominates
                </span>
              </p>
              <div className="slab">
                <NavDesktopLoggedOut />
                <div className="slab-content">
                  <div className="placeholder">
                    Landing hero — "Build Your Dynasty. Dominate Your League."
                  </div>
                </div>
              </div>

              <p className="caption">
                <span className="dot" style={{ background: 'var(--brand-seam-red)' }} />
                Draft live · seam-red glow
                <span className="hint">
                  League switcher crest pulses; ticker label turns seam-red
                </span>
              </p>
              <div className="slab">
                <NavDesktop
                  current="players"
                  draftLive={true}
                  openPop={null}
                  showTicker={true}
                />
                <div className="slab-content">
                  <div
                    style={{ display: 'flex', gap: 14, alignItems: 'center' }}
                  >
                    <span className="ls-chip ls-chip-live">
                      <span className="ls-dot-pulse" /> Draft Live
                    </span>
                    <div
                      style={{
                        fontFamily: 'var(--font-body)',
                        color: 'var(--fg2)',
                        fontSize: 14,
                      }}
                    >
                      Round 4 · Pick 7 of 12 ·{' '}
                      <span
                        style={{
                          color: 'var(--brand-gold-light)',
                          fontFamily: 'var(--font-display)',
                          fontWeight: 700,
                          letterSpacing: '0.04em',
                        }}
                      >
                        YOU'RE ON THE CLOCK IN 2 PICKS
                      </span>
                    </div>
                  </div>
                </div>
              </div>

              <p className="caption">
                <span className="dot" />
                Scrolled · compact
                <span className="hint">
                  Wordmark hides, logo shrinks to 30px — content takes the
                  foreground
                </span>
              </p>
              <div className="slab">
                <NavDesktop
                  current="players"
                  compact={true}
                  openPop={null}
                  showTicker={false}
                />
                <div className="slab-content">
                  <div className="placeholder">
                    Page has scrolled 80px — nav condenses, ticker retracts.
                  </div>
                </div>
              </div>

              <div className="slab-grid-2">
                <div>
                  <p className="caption">
                    <span className="dot" />
                    Notification tray open
                  </p>
                  <div className="slab slab-tall">
                    <NavDesktopStatic stateKind="notif" />
                    <div className="slab-content">
                      <div className="placeholder">
                        Press the bell — mark all read, or dive into any single
                        event.
                      </div>
                    </div>
                  </div>
                </div>
                <div>
                  <p className="caption">
                    <span className="dot" />
                    Profile menu open
                  </p>
                  <div className="slab slab-tall">
                    <NavDesktopStatic stateKind="profile" />
                    <div className="slab-content">
                      <div className="placeholder">
                        Commissioner shortcut lives here when applicable.
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div className="slab-grid-2">
                <div>
                  <p className="caption">
                    <span className="dot" />
                    League switcher open
                  </p>
                  <div className="slab slab-tall">
                    <NavDesktopStatic stateKind="league" />
                    <div className="slab-content">
                      <div className="placeholder">
                        Drop the crest, swap leagues, or create a new one.
                      </div>
                    </div>
                  </div>
                </div>
                <div>
                  <p className="caption">
                    <span className="dot" />
                    Help & support open
                  </p>
                  <div className="slab slab-tall">
                    <NavDesktopStatic stateKind="help" />
                    <div className="slab-content">
                      <div className="placeholder">
                        Rules, support, bug reports and shortcuts — one
                        keystroke from any screen.
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            {/* ═══════════════════════════════════════════════════
          §03 — TABLET
          ═══════════════════════════════════════════════════ */}
            <div className="section">
              <div className="section-head">
                <div
                  style={{ display: 'flex', alignItems: 'baseline', gap: 16 }}
                >
                  <span className="num">§ 04</span>
                  <h2>Tablet · Collapsed</h2>
                </div>
                <p>
                  Canonical bands xs–lg (660–1119px). Search retracts to an
                  icon; wordmark folds to just the shield. Pills stay.
                </p>
              </div>

              {/* BREAKPOINTS: this collapsed layout serves xs, sm, md, and lg
              (660–1119px) as a single continuum — the icon-only search and folded
              wordmark don't change again until xl (1120px), where §01's full
              anatomy takes over. Replaces the previously invented "900–1100px"
              tablet range, which didn't align to any of the seven canonical
              bands in lib/design-tokens/src/lib/breakpoints.ts. The frames below
              are designed at 1024px, which falls in the lg band (980–1119px). */}
              <div
                className="slab"
                style={{ maxWidth: 960, margin: '0 auto 24px' }}
              >
                <div className="frame-label">
                  <div className="fl-left">
                    <span>iPad · Landscape</span>
                    <span className="sz">1024 × 768 (lg, 980–1119px)</span>
                    <span className="tag">Logged in</span>
                  </div>
                </div>
                <NavTablet current="players" />
                <div className="slab-content">
                  <div className="placeholder">
                    Same pill group, tighter right cluster. No inline search —
                    opens palette.
                  </div>
                </div>
              </div>

              <div className="slab" style={{ maxWidth: 960, margin: '0 auto' }}>
                <div className="frame-label">
                  <div className="fl-left">
                    <span>iPad · Draft Room</span>
                    <span className="sz">1024 × 768 (lg, 980–1119px)</span>
                    <span className="tag live">Draft Live</span>
                  </div>
                </div>
                <NavTablet current="players" draftLive={true} />
                <div className="slab-content">
                  <div className="placeholder">
                    Seam-red glow follows the user into smaller viewports.
                  </div>
                </div>
              </div>
            </div>

            {/* ═══════════════════════════════════════════════════
          §05 — MOBILE (one mock, two chromes)
          ═══════════════════════════════════════════════════ */}
            <div className="section" data-screen-label="Mobile">
              <div className="section-head">
                <div
                  style={{ display: 'flex', alignItems: 'baseline', gap: 16 }}
                >
                  <span className="num">§ 05</span>
                  <h2>Mobile · Web & Native</h2>
                </div>
                <p>
                  One mock, two chromes. Web and native render the same header,
                  dugout rail, and drawer — only the device chrome differs, so
                  the two platforms can't drift apart.
                </p>
              </div>

              <div className="state-switch-bar">
                <div
                  className="state-switch"
                  role="radiogroup"
                  aria-label="Device chrome"
                >
                  {[
                    { id: 'web', label: 'Mobile web' },
                    { id: 'native', label: 'Native iOS' },
                  ].map((c) => (
                    <button
                      key={c.id}
                      type="button"
                      role="radio"
                      aria-checked={chrome === c.id}
                      tabIndex={chrome === c.id ? 0 : -1}
                      className="state-switch-btn"
                      onClick={() => setChrome(c.id)}
                    >
                      <span className="sw-dot" aria-hidden="true" />
                      {c.label}
                    </button>
                  ))}
                </div>
                <p className="sw-hint">
                  {chrome === 'web'
                    ? 'Browser chrome: URL bar above our header, no home indicator — the rail sits on the browser toolbar.'
                    : 'Device chrome: status bar and home indicator belong to iOS; our header sits inside the safe area.'}
                </p>
              </div>

              <div className="slab-grid-3" style={{ justifyItems: 'center' }}>
                {[
                  { label: 'Home · default', props: { current: 'home' } },
                  {
                    label: 'Games · draft live',
                    props: { current: 'games', draftLive: true },
                  },
                  {
                    label: 'Drawer open',
                    props: { current: 'home', drawer: true },
                  },
                ].map((m) => (
                  <div key={m.label}>
                    <p
                      className="caption"
                      style={{ justifyContent: 'center', textAlign: 'center' }}
                    >
                      {m.label}
                    </p>
                    <PhoneMock chrome={chrome} {...m.props} />
                  </div>
                ))}
              </div>
            </div>

            {/* ═══════════════════════════════════════════════════
          §06 — TOKENS
          ═══════════════════════════════════════════════════ */}
            <div className="section">
              <div className="section-head">
                <div
                  style={{ display: 'flex', alignItems: 'baseline', gap: 16 }}
                >
                  <span className="num">§ 06</span>
                  <h2>Tokens · Anatomy</h2>
                </div>
                <p>
                  Every pixel is a token pulled from the Legacy Sports
                  foundation. No new colors or type scales were invented for the
                  nav.
                </p>
              </div>

              <div className="spec-grid">
                <div className="spec-card">
                  <span className="k">Nav height</span>
                  <span className="v">56 px</span>
                  <span className="desc">
                    Desktop + tablet. Mobile header: 58px. Mobile bottom bar:
                    72px incl. safe area.
                  </span>
                </div>
                <div className="spec-card">
                  <span className="k">Pill radius</span>
                  <span className="v">9999 px</span>
                  <span className="desc">
                    Per the design system — chips and navigation pills are fully
                    round.
                  </span>
                </div>
                <div className="spec-card">
                  <span className="k">Tab label</span>
                  <span className="v">Big Shoulders · 12/700</span>
                  <span className="desc">
                    Uppercase, 0.08em tracking. Icons always 14px, 0.7 opacity
                    at rest.
                  </span>
                </div>
                <div className="spec-card">
                  <span className="k">Glass surface</span>
                  <span className="v">rgba(10,15,26,.78)</span>
                  <span className="desc">
                    backdrop-filter: blur(16px) saturate(140%). Dark mode
                    only — no light-theme variant.
                  </span>
                </div>
                <div className="spec-card">
                  <span className="k">Active pill</span>
                  <div className="swatch-row">
                    <span
                      className="swatch"
                      style={{ background: '#1B3A5C' }}
                    />
                    <span
                      style={{
                        fontFamily: 'var(--font-mono)',
                        fontSize: 12,
                        color: 'var(--fg2)',
                      }}
                    >
                      #1B3A5C
                    </span>
                  </div>
                  <span className="desc">
                    Brand navy. Inner 1px gold seam gives it a helmet-shell
                    depth.
                  </span>
                </div>
                <div className="spec-card">
                  <span className="k">Draft live</span>
                  <div className="swatch-row">
                    <span
                      className="swatch"
                      style={{ background: '#C41E3A' }}
                    />
                    <span
                      style={{
                        fontFamily: 'var(--font-mono)',
                        fontSize: 12,
                        color: 'var(--fg2)',
                      }}
                    >
                      #C41E3A
                    </span>
                  </div>
                  <span className="desc">
                    Seam red. Glow applied to the Games pill and the nav's lower
                    border.
                  </span>
                </div>
                <div className="spec-card">
                  <span className="k">Notif badge</span>
                  <div className="swatch-row">
                    <span
                      className="swatch"
                      style={{ background: '#C41E3A' }}
                    />
                    <span
                      style={{
                        fontFamily: 'var(--font-mono)',
                        fontSize: 12,
                        color: 'var(--fg2)',
                      }}
                    >
                      18 px · pill
                    </span>
                  </div>
                  <span className="desc">
                    Seam red dot with 2px ring in the current surface color
                    (masks the border).
                  </span>
                </div>
                <div className="spec-card">
                  <span className="k">Z-index</span>
                  <span className="v">20 / 40 / 60</span>
                  <span className="desc">
                    Nav: 20. Drawer scrim: 40. Dynamic island / safe area: 60.
                  </span>
                </div>
              </div>
            </div>

            {/* ═══════════════════════════════════════════════════
          §07 — BREAKPOINTS
          ═══════════════════════════════════════════════════ */}
            <div className="section" data-screen-label="Breakpoints">
              <div className="section-head">
                <div
                  style={{ display: 'flex', alignItems: 'baseline', gap: 16 }}
                >
                  <span className="num">§ 07</span>
                  <h2>Breakpoints</h2>
                </div>
                <p>
                  All seven canonical bands are implemented mobile-first in
                  styles.css. Resize the frame — the nav above reflows through
                  every row of this ledger.
                </p>
              </div>

              <div className="bp-ledger">
                {[
                  { t: '$xxs', r: '0 – 659', d: 'Phone · portrait', n: 'Single column, 12px gutters. Wordmark and inline search hide; pill labels tighten. 44px touch targets.' },
                  { t: '$xs', r: '660 – 799', d: 'Phone · standard', n: '16px gutters, 2-up spec cards and content cards. Nav stays icon-led.' },
                  { t: '$sm', r: '800 – 859', d: 'Landscape · small tablet', n: '$gtSm content appears: wordmark returns, full tab labels, menu panels go 2-up, header row un-stacks.' },
                  { t: '$md', r: '860 – 979', d: 'Tablet · portrait', n: 'Primary top nav at full pill width; 3-up content cards. Still 44px targets — touch is likely.' },
                  { t: '$lg', r: '980 – 1119', d: 'Tablet · landscape', n: 'Inline search returns; 3-up phone grid and spec cards. Targets relax to 40px for pointer input.' },
                  { t: '$xl', r: '1120 – 1279', d: 'Laptop', n: 'Paired slabs sit side by side, specs go 4-up, state phone moves alongside its panels. Full 24px radii.' },
                  { t: '$xxl', r: '1280 +', d: 'Desktop & wide', n: 'Nav inner caps at 1280, page canvas at 1480. The primary design target.' },
                ].map((b) => (
                  <div className="bp-row" key={b.t}>
                    <span className="bp-token">{b.t}</span>
                    <span className="bp-range">{b.r}</span>
                    <span className="bp-device">{b.d}</span>
                    <span className="bp-note">{b.n}</span>
                  </div>
                ))}
              </div>
            </div>
            {editMode && (
              <div className="tweaks-panel">
                <div className="tweaks-head">
                  <span className="dot" />
                  <span className="title">Tweaks</span>
                </div>
                <div className="tweaks-body">

                      fontFamily: 'var(--font-body)',

                      color: 'var(--fg4)',
                      lineHeight: 1.5,
                    }}

                    Dark mode only — the app has no light theme (see
                    brand.md).

                </div>
              </div>
            )}
          </div>
        );
      };

      // ── A nav where the pop menu is forced open (for the screenshots) ──
      const NavDesktopStatic = ({ stateKind }) => {

      // ── iOS status bar (shared) ──
      const IosStatusBar = () => (

            <svg

      // ── One phone mock, two device chromes ──────────────────
      // Web and native share every nav part; only the chrome differs.
      const PhoneMock = ({ current = 'home', draftLive, drawer, chrome = 'native' }) => (
        <div className={`phone-frame chrome-${chrome}`} style={{ height: 720 }}>
          <IosStatusBar />
          {chrome === 'web' && (
            <div className="mob-urlbar">
              <span className="lock" aria-hidden="true">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
              </span>
              <span className="url">legacysports.app/{current}</span>

          )}
          <MobileHeader draftLive={draftLive} showLeague={true} />
          <div className="phone-content" style={{ flex: 1 }}>
            <div className="phone-fake-content">
              <div className="card" />

      window.IosStatusBar = IosStatusBar;
      window.App = App;
      ReactDOM.createRoot(document.getElementById('app')).render(<App />);
    </script>
  </body>
