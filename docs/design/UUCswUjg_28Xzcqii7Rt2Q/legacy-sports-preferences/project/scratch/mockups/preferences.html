<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preferences — Legacy Sports</title>

    <!--
  PREFERENCES — Mobile breakpoints
  ================================
  Per page reference doc: /preferences. Sections collapsible, auto-save
  banner appears on change for 2s, notifications shown only when authed.

  Editorial decision: this page is settings, not a scoreboard — so the
  scoreboard-condensed display face is reserved for section *headers*
  and ON/OFF state labels. Body copy and the actual setting names sit
  in Literata, where they read like an encyclopedia of toggles, not a
  control panel. We use seam-red ONLY for destructive (none here) and
  errors; gold ONLY for the save-confirmation tick (a positive outcome).

  We render THREE mobile breakpoints in one canvas:
    · 360px (small Android)
    · 375px (iPhone primary, per PROMPT)
    · 414px (iPhone Plus / Pro Max)
  Toggle the four conditional states with the tabs at the very top.

  No build step. Open file directly. -->

    <link rel="stylesheet" href="../../design-system/colors_and_type.css" />

    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: #060912;
        color: var(--fg1);
        font-family: var(--font-body);
        min-height: 100vh;
      }

      /* ── Canvas chrome ────────────────────────────────────────── */
      .canvas {
        min-height: 100vh;
        padding: 28px 20px 80px;
        background:
          radial-gradient(
            ellipse at 18% 0%,
            rgba(27, 58, 92, 0.18) 0%,
            transparent 55%
          ),
          radial-gradient(
            ellipse at 82% 8%,
            rgba(196, 30, 58, 0.07) 0%,
            transparent 45%
          ),
          radial-gradient(
            ellipse at 50% 90%,
            rgba(197, 165, 90, 0.05) 0%,
            transparent 50%
          ),
          #060912;
        background-attachment: fixed;
      }

      .canvas-head {
        max-width: 1500px;
        margin: 0 auto 28px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .canvas-title {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .canvas-title .badge {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 4px 9px;
        border-radius: 4px;
        background: rgba(197, 165, 90, 0.12);
        color: var(--brand-gold-light);
        border: 1px solid rgba(197, 165, 90, 0.4);
      }
      .canvas-title h1 {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 22px;
        letter-spacing: -0.005em;
        color: var(--fg1-strong);
        margin: 0;
      }
      .canvas-title .meta {
        font-family: var(--font-body);
        color: var(--fg3);
        font-size: 13px;
      }

      /* State switcher */
      .state-tabs {
        display: inline-flex;
        gap: 4px;
        background: var(--surface-panel);
        border: 1px solid var(--outline-subtle);
        border-radius: 9999px;
        padding: 5px;
        align-self: flex-start;
      }
      .state-tabs button {
        background: transparent;
        border: 0;
        color: var(--fg3);
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 8px 14px;
        border-radius: 9999px;
        cursor: pointer;
        transition: all 150ms var(--ease-standard);
      }
      .state-tabs button.on {
        background: var(--brand-navy);
        color: #fff;
      }
      .state-tabs button:hover:not(.on) {
        color: var(--fg1);
      }

      /* Frame strip */
      .frame-row {
        max-width: 1500px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(3, max-content);
        gap: 32px;
        justify-content: center;
        align-items: start;
      }
      @media (max-width: 1280px) {
        .frame-row {
          grid-template-columns: repeat(2, max-content);
        }
      }
      @media (max-width: 880px) {
        .frame-row {
          grid-template-columns: 1fr;
          justify-content: stretch;
        }
      }

      .frame {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .frame-label {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }
      .frame-label .name {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--fg3);
      }
      .frame-label .px {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--fg4);
      }

      .device {
        background: #0a0f1a;
        border-radius: 36px;
        padding: 10px;
        border: 1px solid #1a233a;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.02),
          var(--shadow-xl);
      }
      .device-screen {
        border-radius: 28px;
        overflow: hidden;
        background: var(--bg);
        height: 760px;
        width: var(--w);
        position: relative;
        isolation: isolate;
      }

      /* ── In-app shell ────────────────────────────────────────── */
      .app {
        width: 100%;
        height: 100%;
        overflow: auto;
        position: relative;
        background:
          radial-gradient(
            ellipse at 20% 0%,
            rgba(27, 58, 92, 0.22) 0%,
            transparent 55%
          ),
          radial-gradient(
            ellipse at 80% 10%,
            rgba(196, 30, 58, 0.1) 0%,
            transparent 45%
          ),
          radial-gradient(
            ellipse at 50% 90%,
            rgba(197, 165, 90, 0.08) 0%,
            transparent 50%
          ),
          var(--bg);
        background-attachment: local;
      }
      /* Hide scrollbars in mocks for cleanliness */
      .app::-webkit-scrollbar {
        width: 4px;
      }
      .app::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.06);
        border-radius: 2px;
      }

      /* Status bar (iOS faux) */
      .statusbar {
        height: 44px;
        padding: 0 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: var(--font-display);
        font-weight: 700;
        color: var(--fg1);
        font-size: 14px;
        letter-spacing: 0.02em;
      }
      .statusbar .icons {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .statusbar svg {
        fill: var(--fg1);
      }

      /* Mobile nav */
      .mnav {
        position: sticky;
        top: 0;
        z-index: 30;
        height: 52px;
        padding: 0 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: rgba(10, 15, 26, 0.82);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--panel-border);
      }
      .mnav-back {
        width: 36px;
        height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
        background: transparent;
        border: 1px solid var(--outline-subtle);
        color: var(--fg2);
        cursor: pointer;
      }
      .mnav-title {
        font-family: var(--font-display);
        font-weight: 800;
        letter-spacing: 0.04em;
        font-size: 14px;
        color: var(--brand-gold-light);
        text-transform: uppercase;
      }
      .mnav-title span {
        color: var(--fg1);
        font-size: 11px;
        letter-spacing: 0.16em;
        display: block;
        line-height: 1;
      }
      .mnav-right {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .mnav .av {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--grad-avatar);
        border: 1px solid rgba(197, 165, 90, 0.45);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 11px;
        color: #fff;
        letter-spacing: 0.04em;
      }

      /* Page header */
      .ph {
        padding: 22px 20px 8px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .ph .eyebrow {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--brand-gold-light);
      }
      .ph h1 {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 36px;
        letter-spacing: -0.015em;
        line-height: 1;
        color: var(--fg1-strong);
        margin: 0;
      }
      .ph .sub {
        font-family: var(--font-body);
        font-size: 14px;
        color: var(--fg3);
        line-height: 1.5;
        max-width: 56ch;
        margin-top: 6px;
      }

      /* Sections */
      .sections {
        padding: 14px 16px 32px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .sec {
        background: var(--surface-card);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: var(--radius-5);
        overflow: hidden;
        box-shadow: var(--shadow-md);
      }
      /* MOTION: section open/close — height transitions 200ms ease-out, chevron rotates 180deg */
      .sec-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 18px;
        background: transparent;
        border: 0;
        width: 100%;
        cursor: pointer;
        text-align: left;
        color: var(--fg1);
        /* Touch target ≥ 44px ✓ — actual hit-area 56px */
        min-height: 56px;
      }
      .sec-head-l {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .sec-icon {
        width: 36px;
        height: 36px;
        border-radius: var(--radius-3);
        background: rgba(27, 58, 92, 0.5);
        border: 1px solid var(--outline-subtle);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .sec-icon svg {
        width: 18px;
        height: 18px;
      }
      .sec-titles {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .sec-title {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 17px;
        letter-spacing: 0.005em;
        color: var(--fg1);
        line-height: 1.15;
      }
      .sec-meta {
        font-family: var(--font-body);
        font-size: 12px;
        color: var(--fg3);
        line-height: 1.3;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chev {
        width: 24px;
        height: 24px;
        color: var(--fg3);
        transition: transform 200ms var(--ease-standard);
        flex-shrink: 0;
      }
      .sec.collapsed .chev {
        transform: rotate(-90deg);
      }
      .sec.collapsed .sec-body {
        display: none;
      }

      .sec-body {
        border-top: 1px solid var(--outline-subtle);
        padding: 6px 0 4px;
      }

      /* Setting row */
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 18px;
        min-height: 56px; /* Touch target ≥ 44px ✓ */
      }
      .row + .row {
        border-top: 1px solid rgba(255, 255, 255, 0.04);
      }
      .row-l {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .row-label {
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 15px;
        color: var(--fg1);
        line-height: 1.3;
      }
      .row-help {
        font-family: var(--font-body);
        font-size: 12px;
        color: var(--fg3);
        line-height: 1.45;
        max-width: 32ch;
        text-wrap: pretty;
      }

      /* Toggle */
      .toggle {
        flex-shrink: 0;
        position: relative;
        width: 48px;
        height: 28px;
        border-radius: 9999px;
        background: var(--surface-raised);
        border: 1px solid var(--outline-default);
        cursor: pointer;
        transition:
          background 150ms var(--ease-standard),
          border-color 150ms var(--ease-standard);
        /* Touch target ≥ 44px ✓ — wrapped in 44px hit pad below */
      }
      .toggle::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--fg2);
        transition:
          transform 180ms var(--ease-standard),
          background 150ms;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      }
      .toggle.on {
        background: var(--brand-navy);
        border-color: var(--brand-navy-light);
      }
      .toggle.on::after {
        transform: translateX(20px);
        background: #fff;
      }
      .toggle-pad {
        /* Invisible 44px hit area around the visible toggle */
        padding: 8px;
        margin: -8px;
        cursor: pointer;
        flex-shrink: 0;
      }

      /* Segmented control */
      .seg {
        display: inline-flex;
        background: var(--bg-press);
        border: 1px solid var(--outline-subtle);
        border-radius: 9999px;
        padding: 3px;
        gap: 2px;
        flex-shrink: 0;
      }
      .seg button {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--fg3);
        background: transparent;
        border: 0;
        padding: 7px 12px;
        border-radius: 9999px;
        cursor: pointer;
        transition: all 150ms var(--ease-standard);
        min-height: 30px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .seg button.on {
        background: var(--brand-navy);
        color: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      }
      .seg button:not(.on):hover {
        color: var(--fg1);
      }
      .seg button .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
      }

      /* Theme picker — bigger tactile cards (it's a deliberate choice, not a switch) */
      .theme-pick {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
        padding: 6px 18px 14px;
      }
      .theme-card {
        background: var(--bg-press);
        border: 1px solid var(--outline-subtle);
        border-radius: var(--radius-4);
        padding: 10px 8px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
        cursor: pointer;
        transition: all 150ms var(--ease-standard);
        /* Touch target ≥ 44px ✓ */
        min-height: 96px;
        color: inherit;
      }
      .theme-card:hover {
        border-color: var(--outline-default);
      }
      .theme-card.on {
        border-color: var(--brand-gold);
        background: rgba(197, 165, 90, 0.06);
        box-shadow: 0 0 0 1px rgba(197, 165, 90, 0.35);
      }
      .theme-swatch {
        width: 100%;
        height: 44px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .theme-swatch.system {
        background: linear-gradient(90deg, #0a0f1a 50%, #f5f7fa 50%);
      }
      .theme-swatch.light {
        background: #f5f7fa;
      }
      .theme-swatch.dark {
        background: #0a0f1a;
        position: relative;
      }
      .theme-swatch.dark::before {
        content: '';
        position: absolute;
        inset: 6px;
        background: linear-gradient(
          135deg,
          transparent 30%,
          rgba(27, 58, 92, 0.4) 70%
        );
        border-radius: 3px;
      }
      .theme-card-name {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--fg2);
      }
      .theme-card.on .theme-card-name {
        color: var(--fg1-strong);
      }

      /* Number stepper */
      .stepper-row {
        padding: 8px 18px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.04);
      }
      .stepper-row .row-l {
        padding: 0;
      }
      .stepper {
        display: flex;
        align-items: stretch;
        gap: 0;
        background: var(--bg-press);
        border: 1px solid var(--outline-subtle);
        border-radius: var(--radius-4);
        overflow: hidden;
        width: 100%;
        max-width: 100%;
      }
      .stepper button {
        width: 44px;
        background: transparent;
        border: 0;
        color: var(--fg2);
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 22px;
        cursor: pointer;
        transition: background 100ms;
        /* Touch target ≥ 44px ✓ */
      }
      .stepper button:hover {
        background: rgba(255, 255, 255, 0.04);
        color: var(--fg1);
      }
      .stepper-val {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-family: var(--font-display);
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        font-size: 22px;
        color: var(--fg1-strong);
        border-left: 1px solid var(--outline-subtle);
        border-right: 1px solid var(--outline-subtle);
      }
      .stepper-val small {
        font-family: var(--font-body);
        font-weight: 400;
        font-size: 12px;
        color: var(--fg3);
        letter-spacing: 0;
        text-transform: none;
      }
      .stepper-help {
        font-family: var(--font-body);
        font-size: 12px;
        color: var(--fg3);
        line-height: 1.45;
      }

      /* Notification subgroup heading */
      .subhead {
        padding: 14px 18px 6px;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--fg3);
        border-top: 1px solid rgba(255, 255, 255, 0.04);
      }
      .sec-body > .subhead:first-child {
        border-top: 0;
      }

      /* Auth gate hint (if you switch to unauthed empty state) */
      .gate {
        margin: 8px 18px 18px;
        padding: 14px 16px;
        background: rgba(27, 58, 92, 0.18);
        border: 1px solid rgba(91, 132, 196, 0.25);
        border-radius: var(--radius-3);
        font-family: var(--font-body);
        font-size: 13px;
        color: var(--fg2);
        line-height: 1.5;
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .gate svg {
        flex-shrink: 0;
        color: var(--info-fg);
        margin-top: 2px;
      }
      .gate strong {
        color: var(--fg1);
        font-weight: 600;
      }

      /* Auto-save banner */
      .save-banner {
        position: absolute;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        background: rgba(10, 15, 26, 0.92);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(197, 165, 90, 0.5);
        box-shadow:
          0 0 0 1px rgba(197, 165, 90, 0.18),
          0 12px 28px rgba(8, 12, 20, 0.6);
        border-radius: 9999px;
        padding: 10px 18px 10px 14px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        z-index: 50;
        /* MOTION: rises 12px from below + fades in 220ms ease-out, dismisses after 2s with reverse */
      }
      .save-banner .check {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--brand-gold);
        color: #1a1408;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .save-banner .check svg {
        width: 14px;
        height: 14px;
      }
      .save-banner .txt {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--fg1-strong);
      }
      .save-banner .lbl {
        font-family: var(--font-body);
        font-size: 12px;
        color: var(--fg3);
        margin-left: 4px;
      }

      /* ── Skeleton (loading state) ────────────────────────────── */
      /* MOTION: skeleton shimmer, 1.4s linear infinite */
      .skel {
        position: relative;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 6px;
      }
      .skel::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.06) 50%,
          transparent 100%
        );
        animation: shimmer 1.4s linear infinite;
      }
      @keyframes shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }
      .skel.title {
        height: 36px;
        width: 65%;
        border-radius: 4px;
      }
      .skel.sub {
        height: 14px;
        width: 80%;
        margin-top: 8px;
      }
      .skel.row-label-s {
        height: 14px;
        width: 55%;
      }
      .skel.row-help-s {
        height: 11px;
        width: 75%;
        margin-top: 6px;
      }
      .skel.toggle-s {
        width: 48px;
        height: 28px;
        border-radius: 9999px;
      }
      .skel.seg-s {
        width: 130px;
        height: 30px;
        border-radius: 9999px;
      }
      .skel.icon-s {
        width: 36px;
        height: 36px;
        border-radius: var(--radius-3);
      }
      .skel.sec-title-s {
        height: 17px;
        width: 60%;
      }

      /* ── Error state (inside notifications section) ─────────── */
      .err {
        margin: 8px 18px 16px;
        padding: 16px;
        background: rgba(176, 46, 68, 0.12);
        border: 1px solid rgba(196, 30, 58, 0.4);
        border-radius: var(--radius-3);
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .err svg {
        flex-shrink: 0;
        color: var(--danger-fg);
        margin-top: 2px;
      }
      .err-body {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
        min-width: 0;
      }
      .err-title {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.04em;
        color: var(--fg1-strong);
      }
      .err-msg {
        font-family: var(--font-body);
        font-size: 13px;
        color: var(--fg2);
        line-height: 1.5;
      }
      .err-retry {
        align-self: flex-start;
        margin-top: 8px;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 8px 14px;
        border-radius: var(--radius-2);
        background: transparent;
        color: var(--fg1);
        border: 1px solid rgba(255, 255, 255, 0.16);
        cursor: pointer;
        min-height: 36px;
      }
      .err-retry:hover {
        border-color: var(--brand-gold);
        color: var(--brand-gold-light);
      }

      /* ── Empty state (auth-gated) ─────────────────────────────
     Shown when the user is not signed in and lands on /preferences:
     they still get appearance + sports preferences (localStorage),
     but the notifications section becomes a sign-in prompt. */
      .empty {
        margin: 8px 18px 18px;
        padding: 24px 18px;
        background:
          radial-gradient(
            ellipse at 50% 0%,
            rgba(197, 165, 90, 0.08) 0%,
            transparent 70%
          ),
          var(--bg-press);
        border: 1px solid var(--outline-subtle);
        border-radius: var(--radius-4);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        text-align: center;
      }
      .empty .glyph {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: rgba(27, 58, 92, 0.35);
        border: 1px solid var(--outline-subtle);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--brand-gold-light);
      }
      .empty .glyph svg {
        width: 24px;
        height: 24px;
      }
      .empty-title {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 17px;
        letter-spacing: 0.005em;
        color: var(--fg1-strong);
        margin-top: 4px;
      }
      .empty-msg {
        font-family: var(--font-body);
        font-size: 13px;
        color: var(--fg3);
        line-height: 1.5;
        max-width: 30ch;
      }
      .empty-cta {
        margin-top: 6px;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 10px 16px;
        border-radius: var(--radius-4);
        background: var(--brand-navy);
        color: #fff;
        border: 1px solid var(--brand-navy-light);
        cursor: pointer;
        min-height: 40px;
      }

      /* ── State visibility toggling ──────────────────────────── */
      .state-only {
        display: none;
      }
      body[data-state='loading'] .state-loading {
        display: block;
      }
      body[data-state='loading'] .state-loaded {
        display: none;
      }

      body[data-state='populated'] .state-populated {
        display: block;
      }
      body[data-state='populated'] .state-not-populated {
        display: none;
      }

      body[data-state='empty'] .state-empty {
        display: flex;
      }
      body[data-state='empty'] .state-not-empty {
        display: none;
      }

      body[data-state='error'] .state-error {
        display: block;
      }
      body[data-state='error'] .state-not-error {
        display: none;
      }
    </style>

                    <div class="row-label" style="font-size: 13px">
                      Close game threshold
                    </div>
                    <div class="row-help">
                      How tight is "close"? Margin in fantasy points.
                    </div>
                  </div>
                  <div
                    class="stepper"
                    role="group"
                    aria-label="Close game threshold"
                  >
                    <button data-step="-10" aria-label="Decrease 10">−</button>
                    <button
                      data-step="-1"
                      aria-label="Decrease 1"
                      style="font-size: 16px"
                    >
                      −1
                    </button>
                    <div class="stepper-val">
                      <span data-threshold>50</span><small>pts</small>
                    </div>
                    <button
                      data-step="1"
                      aria-label="Increase 1"
                      style="font-size: 16px"
                    >
                      +1
                    </button>
                    <button data-step="10" aria-label="Increase 10">+</button>
                  </div>
                </div>

                <div class="row">
                  <div class="row-l">
                    <div class="row-label state-loaded">Matchup reminders</div>
                    <div class="row-help state-loaded">
                      Heads-up the night before lineups lock.
                    </div>
                    <div class="state-only state-loading">
                      <div class="skel row-label-s"></div>
                      <div class="skel row-help-s"></div>
                    </div>
                  </div>
                  <div class="state-loaded">
                    <div class="toggle-pad" data-toggle="reminders">
                      <div
                        class="toggle"
                        role="switch"
                        aria-checked="false"
                      ></div>
                    </div>
                  </div>
                  <div class="state-only state-loading">
                    <div class="skel toggle-s"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- ═════ EMPTY (unauthed) — replaces notifications when no session ═════ -->
          <div
            class="sec state-only state-empty"
            data-section="notifications-empty"
            style="flex-direction: column"
          >
            <button
              class="sec-head"
              aria-expanded="true"
              style="cursor: default"
            >
              <div class="sec-head-l">
                <span class="sec-icon">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="#C5A55A"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M6 8a6 6 0 1 1 12 0c0 4 1.5 6 1.5 6h-15S6 12 6 8z"
                    />
                    <path d="M10 19a2 2 0 0 0 4 0" />
                  </svg>
                </span>
                <div class="sec-titles">
                  <div class="sec-title">Notifications</div>
                  <div class="sec-meta">Sign in to manage</div>
                </div>
              </div>
            </button>
            <div class="sec-body">
              <div class="empty">
                <div class="glyph">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <rect x="3" y="11" width="18" height="11" rx="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                  </svg>
                </div>
                <div class="empty-title">Sign in to set alerts</div>
                <div class="empty-msg">
                  Push, email, and matchup alerts live with your account.
                  Appearance and stat preferences above are saved on this
                  device.
                </div>
                <button class="empty-cta">Sign In</button>
              </div>
            </div>
          </div>
        </div>

        <!-- ═════ AUTO-SAVE BANNER ═════ -->
        <!-- MOTION: rises 12px from below + fades in 220ms ease-out, holds 2s, fades out 180ms -->
        <div
          class="save-banner"
          id="save-banner"
          aria-live="polite"
          aria-hidden="true"
          style="display: none"
        >
          <span class="check">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M5 12l5 5L20 7" />
            </svg>
          </span>
          <span class="txt">Saved</span>
          <span class="lbl">just now</span>
        </div>
      </div>
    </template>

    <script>
      // ══════════════════════════════════════════════════════════
      // Inject the same app template into all three frames
      // ══════════════════════════════════════════════════════════
      (function mount() {
        const tpl = document.getElementById('tpl-app');
        ['screen-360', 'screen-375', 'screen-414'].forEach((id) => {
          const host = document.getElementById(id);
          const node = tpl.content.cloneNode(true);
          host.appendChild(node);
        });
      })();

      // ══════════════════════════════════════════════════════════
      // State switcher — shows loading / error / empty / populated
      // ══════════════════════════════════════════════════════════
      document.querySelectorAll('[data-state-btn]').forEach((btn) => {
        btn.addEventListener('click', () => {
          document
            .querySelectorAll('[data-state-btn]')
            .forEach((b) => b.classList.remove('on'));
          btn.classList.add('on');
          document.body.dataset.state = btn.dataset.stateBtn;
        });
      });

      // ══════════════════════════════════════════════════════════
      // Demo interactivity — only inside populated state
      //   · Toggles flip
      //   · Segmented controls switch
      //   · Theme cards swap
      //   · Section collapse
      //   · Save banner shows for 2s on any change
      //   · Stepper updates threshold
      // Operates across ALL three frames so the reviewer can watch
      // a change ripple in unison.
      // ══════════════════════════════════════════════════════════
      function flashSaveBanners() {
        document
          .querySelectorAll('#save-banner, [id="save-banner"]')
          .forEach((b) => {
            // Each frame has its own banner (cloned id collisions are harmless here)
            b.style.display = 'inline-flex';
            b.style.opacity = '0';
            b.style.transform = 'translateX(-50%) translateY(12px)';
            requestAnimationFrame(() => {
              b.style.transition =
                'opacity 220ms cubic-bezier(0.2,0.8,0.2,1), transform 220ms cubic-bezier(0.2,0.8,0.2,1)';
              b.style.opacity = '1';
              b.style.transform = 'translateX(-50%) translateY(0)';
            });
            clearTimeout(b._t);
            b._t = setTimeout(() => {
              b.style.opacity = '0';
              b.style.transform = 'translateX(-50%) translateY(12px)';
              setTimeout(() => {
                b.style.display = 'none';
              }, 220);
            }, 2000);
          });
      }

      // Toggles
      document.addEventListener('click', (e) => {
        const pad = e.target.closest('[data-toggle]');
        if (pad) {
          const key = pad.dataset.toggle;
          const next = !pad.querySelector('.toggle').classList.contains('on');
          // Sync across all frames
          document
            .querySelectorAll(`[data-toggle="${key}"] .toggle`)
            .forEach((t) => {
              t.classList.toggle('on', next);
              t.setAttribute('aria-checked', String(next));
            });
          flashSaveBanners();
          return;
        }
        const segBtn = e.target.closest('.seg button');
        if (segBtn) {
          const seg = segBtn.closest('.seg');
          const key = seg.dataset.seg;
          const val = segBtn.dataset.val;
          document.querySelectorAll(`.seg[data-seg="${key}"]`).forEach((s) => {
            s.querySelectorAll('button').forEach((b) =>
              b.classList.toggle('on', b.dataset.val === val),
            );
          });
          flashSaveBanners();
          return;
        }
        const themeBtn = e.target.closest('.theme-card');
        if (themeBtn) {
          const val = themeBtn.dataset.theme;
          document.querySelectorAll('.theme-pick').forEach((p) => {
            p.querySelectorAll('.theme-card').forEach((c) =>
              c.classList.toggle('on', c.dataset.theme === val),
            );
          });
          flashSaveBanners();
          return;
        }
        const stepBtn = e.target.closest('[data-step]');
        if (stepBtn) {
          const delta = parseInt(stepBtn.dataset.step, 10);
          document.querySelectorAll('[data-threshold]').forEach((el) => {
            const v = Math.max(
              1,
              Math.min(200, (parseInt(el.textContent, 10) || 50) + delta),
            );
            el.textContent = v;
          });
          flashSaveBanners();
          return;
        }
        const head = e.target.closest('.sec-head');
        if (head && !head.closest('[data-section="notifications-empty"]')) {
          const sec = head.closest('.sec');
          // Sync collapse state across frames by section id
          const key = sec.dataset.section;
          const next = !sec.classList.contains('collapsed');
          document
            .querySelectorAll(`.sec[data-section="${key}"]`)
            .forEach((s) => {
              s.classList.toggle('collapsed', next);
              const h = s.querySelector('.sec-head');
              if (h) h.setAttribute('aria-expanded', String(!next));
            });
        }
      });
    </script>
  </body>
</html>
