<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>My Roster · Dead Ball Archive</title>

    <link rel="stylesheet" href="ds/colors_and_type.css" />
    <link rel="stylesheet" href="league-styles.css?v=4" />

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>

    <style>
      /* Role bar (per-product, lives inside the design). */
      .role-switch-bar {
        position: sticky;
        top: 0;
        z-index: 60;
        background: rgba(10, 15, 26, 0.86);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--panel-border);
      }
      .role-switch-inner {
        max-width: 1280px;
        margin: 0 auto;
        padding: 10px 24px;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .role-switch-inner .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--brand-gold-light);
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .role-switch-inner .brand .sub {
        color: var(--fg3);
        font-size: 10px;
        letter-spacing: 0.18em;
        border-left: 1px solid var(--outline-subtle);
        padding-left: 10px;
        margin-left: 4px;
      }
      .role-switch-inner .spacer {
        flex: 1;
      }
      .role-switch {
        display: inline-flex;
        padding: 3px;
        background: var(--surface-panel);
        border: 1px solid var(--outline-subtle);
        border-radius: 9999px;
      }
      .role-switch button {
        background: transparent;
        border: 0;
        color: var(--fg3);
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 6px 12px;
        border-radius: 9999px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .role-switch button.on {
        background: var(--brand-navy);
        color: #fff;
      }
      .role-switch button:hover:not(.on) {
        color: var(--fg1);
      }
      .season-select {
        background: var(--surface-subtle);
        border: 1px solid var(--outline-subtle);
        color: var(--fg1);
        font-family: var(--font-body);
        font-size: 12px;
        padding: 7px 12px;
        border-radius: var(--radius-3);
      }

      /* Designer preview toolbar (outside the product). */
      .mock-toolbar {
        position: sticky;
        top: 0;
        z-index: 90;
        background: #07090f;
        border-bottom: 1px solid rgba(197, 165, 90, 0.28);
        font-family: var(--font-display);
      }
      .mock-toolbar-inner {
        max-width: 1280px;
        margin: 0 auto;
        padding: 9px 18px;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .mock-eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 800;
        font-size: 10px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--brand-gold-light);
      }
      .mock-eyebrow::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 9999px;
        background: var(--brand-gold-light);
        box-shadow: 0 0 8px var(--brand-gold);
      }
      .mock-eyebrow .dim {
        color: var(--fg4);
        letter-spacing: 0.18em;
        font-weight: 600;
      }
      .mock-toolbar .spacer {
        flex: 1;
      }
      .mock-group {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .mock-group-label {
        font-size: 9px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--fg4);
        font-weight: 700;
      }
      .mock-seg {
        display: inline-flex;
        padding: 3px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 9999px;
      }
      .mock-seg button {
        background: transparent;
        border: 0;
        cursor: pointer;
        color: var(--fg3);
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 6px 12px;
        border-radius: 9999px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition:
          color 120ms,
          background 120ms;
      }
      .mock-seg button.on {
        background: var(--brand-gold);
        color: #1a1308;
        box-shadow:
          0 0 0 1px rgba(197, 165, 90, 0.4),
          0 4px 14px rgba(197, 165, 90, 0.22);
      }
      .mock-seg button:hover:not(.on) {
        color: var(--fg1);
      }
      .mock-seg svg {
        width: 13px;
        height: 13px;
      }

      /* Device frame for non-desktop preview. */
      .mock-stage {
        padding: 28px 16px 80px;
        background:
          radial-gradient(
            circle at 50% 0%,
            rgba(27, 58, 92, 0.22),
            transparent 60%
          ),
          #05080f;
        min-height: calc(100vh - 50px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .mock-frame {
        position: relative;
        background: #0a0f1a;
        border-radius: 20px;
        padding: 12px;
        max-width: 100%;
        box-shadow:
          0 0 0 2px rgba(255, 255, 255, 0.04),
          0 0 0 8px #0e1320,
          0 0 0 10px rgba(197, 165, 90, 0.18),
          0 30px 80px rgba(0, 0, 0, 0.7);
        overflow: hidden;
      }
      .mock-frame.is-phone {
        border-radius: 36px;
        padding: 12px;
      }
      .mock-frame.is-tablet {
        border-radius: 22px;
        padding: 14px;
      }
      .mock-frame.is-laptop,
      .mock-frame.is-desktop {
        border-radius: 14px;
        padding: 10px;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.06),
          0 0 0 8px #0e1320,
          0 30px 80px rgba(0, 0, 0, 0.65);
      }
      .mock-frame .notch {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        width: 110px;
        height: 22px;
        border-radius: 0 0 14px 14px;
        background: #05070d;
        z-index: 2;
        pointer-events: none;
      }
      .mock-frame:not(.is-phone) .notch {
        display: none;
      }
      .mock-frame iframe {
        display: block;
        border: 0;
        background: #0a0f1a;
        border-radius: 12px;
        width: 100%;
        height: 100%;
      }
      .mock-frame.is-phone iframe {
        border-radius: 22px;
      }
      .mock-cap {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--fg4);
        letter-spacing: 0.04em;
      }
      .mock-cap b {
        color: var(--brand-gold-light);
        font-weight: 600;
        font-family: var(--font-display);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .mock-cap .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 9px;
        border-radius: 9999px;
        background: rgba(197, 165, 90, 0.1);
        color: var(--brand-gold-light);
        border: 1px solid rgba(197, 165, 90, 0.32);
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .mock-cap .sep {
        color: var(--outline-subtle);
      }

      /* When embedded inside an iframe, hide the mockup toolbar (defense in depth). */
      body[data-embedded='1'] .mock-toolbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" src="Icons.jsx"></script>
    <script type="text/babel" src="Data.jsx"></script>
    <script type="text/babel" src="DataFootball.jsx"></script>
    <script type="text/babel" src="Shared.jsx"></script>
    <script type="text/babel" src="LeagueHero.jsx"></script>
    <script type="text/babel" src="TabPageShell.jsx"></script>
    <script type="text/babel" src="TabRoster.jsx"></script>

    <script type="text/babel" data-presets="env,react">
      // ── Mockup wrapper: lets you toggle sport + viewport size from this HTML page. ──
      const _params = new URLSearchParams(window.location.search);
      const _embedded = _params.get('embedded') === '1';
      const _urlSport = _params.get('sport');
      const _storedSport =
        !_embedded && localStorage.getItem('ls-mockup-sport');
      const _initSport = _urlSport || _storedSport || 'baseball';

      // Make sure window.MY_ROSTER etc. point at the right bundle BEFORE any component renders.
      window.setSport(_initSport);
      if (_embedded) document.body.dataset.embedded = '1';

      const SportIcon = ({ sport, size = 13 }) => {
        const I = window.Icons;
        return sport === 'football' ? (
          <I.Football size={size} />
        ) : (
          <I.Baseball size={size} />
        );
      };

      // Simple inline glyphs for viewport sizes (no matching brand icons exist).
      const Glyph = {
        Desktop: ({ size = 13 }) => (
          <svg
            width={size}
            height={size}
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
          >
            <rect x="2" y="4" width="20" height="13" rx="2" />
            <path d="M8 21h8M12 17v4" />
          </svg>
        ),
        Tablet: ({ size = 13 }) => (
          <svg
            width={size}
            height={size}
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
          >
            <rect x="5" y="2" width="14" height="20" rx="2" />
            <path d="M11 18h2" />
          </svg>
        ),
        Mobile: ({ size = 13 }) => (
          <svg
            width={size}
            height={size}
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
          >
            <rect x="7" y="2" width="10" height="20" rx="2.2" />
            <path d="M11 18h2" />
          </svg>
        ),
      };

      // Named design-system breakpoints. `tier` matches the CSS breakpoint tier the
      // current width falls into (see league-styles.css header).
      // `full` means "don't constrain, use the browser viewport."
      const VIEWPORTS = {
        full: {
          label: 'Full',
          w: null,
          h: null,
          tier: 'live',
          device: 'desktop',
          icon: Glyph.Desktop,
        },
        xs: {
          label: 'XS 390',
          w: 390,
          h: 844,
          tier: 'XS',
          device: 'phone',
          icon: Glyph.Mobile,
        },
        sm: {
          label: 'SM 600',
          w: 600,
          h: 900,
          tier: 'SM',
          device: 'phone',
          icon: Glyph.Mobile,
        },
        md: {
          label: 'MD 834',
          w: 834,
          h: 1180,
          tier: 'MD',
          device: 'tablet',
          icon: Glyph.Tablet,
        },
        lg: {
          label: 'LG 1100',
          w: 1100,
          h: 820,
          tier: 'LG',
          device: 'laptop',
          icon: Glyph.Desktop,
        },
        xl: {
          label: 'XL 1280',
          w: 1280,
          h: 860,
          tier: 'XL',
          device: 'desktop',
          icon: Glyph.Desktop,
        },
      };

      // Maps an actual width back to which breakpoint tier the CSS applies.
      const tierFor = (w) => {
        if (w == null) return null;
        if (w >= 1280) return 'XL';
        if (w >= 1100) return 'LG';
        if (w >= 780) return 'MD';
        if (w >= 600) return 'SM';
        return 'XS';
      };
      const TIER_NOTES = {
        XS: 'Compact phone · tabs hidden, hero shrunk, single column',
        SM: 'Phablet · still inside the mobile media query (<780)',
        MD: 'Tablet · tabs visible, 2-col grids enabled',
        LG: 'Desktop · full multi-column grids',
        XL: 'Wide desktop · max content width (1280)',
      };

      const DevToolbar = ({ sport, setSport, viewport, setViewport }) => (
        <div className="mock-toolbar">
          <div className="mock-toolbar-inner">
            <span className="mock-eyebrow">
              Mockup Preview <span className="dim">· Roster</span>
            </span>
            <span className="spacer" />
            <div className="mock-group">
              <span className="mock-group-label">Sport</span>
              <div className="mock-seg">
                <button
                  className={sport === 'baseball' ? 'on' : ''}
                  onClick={() => setSport('baseball')}
                >
                  <SportIcon sport="baseball" />
                  Baseball
                </button>
                <button
                  className={sport === 'football' ? 'on' : ''}
                  onClick={() => setSport('football')}
                >
                  <SportIcon sport="football" />
                  Football
                </button>
              </div>
            </div>
            <div className="mock-group">
              <span className="mock-group-label">Breakpoint</span>
              <div className="mock-seg">
                {Object.entries(VIEWPORTS).map(([k, v]) => {
                  const Ico = v.icon;
                  return (
                    <button
                      key={k}
                      className={viewport === k ? 'on' : ''}
                      onClick={() => setViewport(k)}
                      title={
                        v.tier !== 'live'
                          ? `${v.tier} tier · ${v.w}px`
                          : 'Use the actual browser viewport'
                      }
                    >
                      <Ico />
                      {v.label}
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      );

      const ProductView = () => (
        <window.TabPageShell activeTab="roster">
          {({ league, isCommish, isMember }) =>
            isMember ? (
              <window.TabRoster league={league} />
            ) : (
              <div className="ls-card" style={{ padding: 24 }}>
                Member access required.
              </div>
            )
          }
        </window.TabPageShell>
      );

      const Page = () => {
        const [sport, setSport] = React.useState(_initSport);
        const [viewport, setViewport] = React.useState(() => {
          const saved =
            !_embedded && localStorage.getItem('ls-mockup-viewport');
          return saved && VIEWPORTS[saved] ? saved : 'full';
        });

        React.useEffect(() => {
          if (window.SPORT !== sport) window.setSport(sport);
          if (!_embedded) localStorage.setItem('ls-mockup-sport', sport);
        }, [sport]);

        React.useEffect(() => {
          if (!_embedded) localStorage.setItem('ls-mockup-viewport', viewport);
        }, [viewport]);

        // Embedded mode (rendered inside an iframe by the outer mockup shell): just the product.
        if (_embedded) return <ProductView />;

        const vp = VIEWPORTS[viewport];
        const showIframe = viewport !== 'full';

        return (
          <>
            <DevToolbar
              sport={sport}
              setSport={setSport}
              viewport={viewport}
              setViewport={setViewport}
            />
            {showIframe ? (
              <div className="mock-stage">
                <div
                  className={`mock-frame is-${vp.device}`}
                  style={{ width: vp.w + 24, height: vp.h + 24 }}
                >
                  <div className="notch" />
                  <iframe
                    key={sport + ':' + viewport}
                    title={`${vp.label} preview`}
                    src={`Tab Roster.html?embedded=1&sport=${sport}`}
                  />
                </div>
                <div className="mock-cap">
                  <span className="pill">
                    {vp.tier} · {vp.w}px
                  </span>
                  <span className="sep">·</span>
                  <span>{TIER_NOTES[tierFor(vp.w)]}</span>
                  <span className="sep">·</span>
                  <b>{sport === 'football' ? 'Football' : 'Baseball'}</b>
                </div>
              </div>
            ) : (
              <ProductView key={sport} />
            )}
          </>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<Page />);
    </script>
  </body>
</html>
