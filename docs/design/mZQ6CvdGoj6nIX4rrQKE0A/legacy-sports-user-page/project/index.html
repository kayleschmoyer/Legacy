  Final file: index.html (loads app.jsx as the entry point via profile.jsx / settings.jsx / helpers.jsx / data.jsx).

      JetBrains Mono via a Google Fonts @import rather than a <link> tag in <head>. This file mirrors
      the shared design-system stylesheet used by every synced project (see its own header comment);
      changing the font-loading strategy site-wide is out of scope for a single-page ticket and was
      left as-is — flag for a design-system-level ticket if this needs to change everywhere.
    - Settings is a form-driven owner page with no async data fetch in the real app, so it keeps a
      single populated state; the Loading/Error/Empty matrix is implemented on the Profile view, which
      is the page that actually renders remote profile data.
