<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Create League (Modal) — Legacy Sports</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="assets/favicon.ico" />
    <link rel="stylesheet" href="colors_and_type.css" />
    <link rel="stylesheet" href="shared.css?v=6" />
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
    <style>
      /* Behind-modal mock dashboard — establishes context that the modal sits *on top of* a live app.
     Purposefully muted so the modal content is dominant. */
      .ls-mock-dash {
        max-width: 1280px;
        margin: 0 auto;
        padding: 32px 24px;
        filter: blur(1px) saturate(0.7);
        pointer-events: none;
      }
      .ls-mock-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-top: 16px;
      }
      .ls-mock-card {
        background: var(--surface-card);
        border: 1px solid var(--outline-subtle);
        border-radius: var(--radius-5);
        padding: 20px;
        height: 180px;
      }
      @container (max-width: 720px) {
        .ls-mock-row {
          grid-template-columns: 1fr;
        }
        .ls-mock-card {
          height: 100px;
        }
        .ls-mock-dash {
          padding: 20px 14px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="text/babel" src="CreateForm.jsx"></script>
    <script type="text/babel" data-presets="react">
      // ── Modal-based Create League.
      // Modal portals INSIDE the viewport frame so container queries still fire and
      // switching to mobile correctly squeezes the modal. The Sport switch sits at the
      // top of the modal body — first decision before the stepper.

      const { useState, useEffect, useMemo } = React;

      // MOTION:
      //   - modal scale-up from 0.96 + fade 180ms ease-out-quart on open
      //   - backdrop fade 140ms
      //   - step-pane crossfade 140ms (prefers-reduced-motion safe)
      //   - viewport frame width transition 280ms

      const VIEWPORTS = [
        { id: 'mobile', label: 'Mobile', w: 390 },
        { id: 'tablet', label: 'Tablet', w: 768 },
        { id: 'laptop', label: 'Laptop', w: 1024 },
        { id: 'desktop', label: 'Desktop', w: 1280 },
        { id: 'full', label: 'Full', w: null },
      ];

      const STEPS = [
        { id: 'basic', label: 'Basics', icon: 'league' },
        { id: 'roster', label: 'Roster', icon: 'roster' },
        { id: 'era', label: 'Era', icon: 'trophy' },
        { id: 'draft', label: 'Draft', icon: 'draft' },
        { id: 'waivers', label: 'Waivers', icon: 'scoreboard' },
      ];

      const MockDash = ({ sport }) => (
        <div className="ls-mock-dash" aria-hidden="true">
          <div
            style={{
              fontFamily: 'var(--font-display)',
              fontSize: 36,
              fontWeight: 800,
              color: 'var(--fg2)',
            }}
          >
            Welcome, Mickey
          </div>
          <div
            style={{
              fontFamily: 'var(--font-body)',
              color: 'var(--fg3)',
              marginTop: 6,
            }}
          >
            Your {sport} leagues
          </div>
          <div className="ls-mock-row">
            {[0, 1, 2].map((i) => (
              <div key={i} className="ls-mock-card" />
            ))}
          </div>
        </div>
      );

      const TopNav = ({ sport }) => (
        <header className="ls-nav">
          <div className="ls-nav-inner">
            <a className="ls-brand">
              <img src="assets/logo.png" alt="" />
              <div className="ls-wordmark">
                LEGACY
                <br />
                <span>SPORTS</span>
              </div>
            </a>
            <div className="ls-breadcrumb">
              <a>{sport === 'football' ? 'Football' : 'Baseball'}</a>
              <span className="sep">/</span>
              <span className="cur">Home</span>
            </div>
            <div className="ls-nav-right">
              <button className="ls-icon-btn">
                <img src="icons/brand/bell.svg" width="20" height="20" />
              </button>
              <div className="ls-avatar">MJ</div>
            </div>
          </div>
        </header>
      );

      // ── Design tools strip ─────────────────────────────
      const DesignTools = ({
        state,
        setState,
        step,
        setStep,
        viewport,
        setViewport,
      }) => (
        <div className="ls-design-tools">
          <span className="ls-design-tools-title">
            Design · Create League · Modal
          </span>
          <div className="ls-tools-divider" />
          <div className="ls-tools-group">
            <span className="ls-tools-label">Viewport</span>
            <div
              className="ls-tools-pills"
              role="tablist"
              aria-label="Viewport"
            >
              {VIEWPORTS.map((v) => (
                <button
                  key={v.id}
                  className={viewport === v.id ? 'on' : ''}
                  onClick={() => setViewport(v.id)}
                >
                  {v.label}
                  {v.w && <span className="vp-w">{v.w}</span>}
                </button>
              ))}
            </div>
          </div>
          <div className="ls-tools-divider" />
          <div className="ls-tools-group">
            <span className="ls-tools-label">State</span>
            <div className="ls-tools-pills" role="tablist" aria-label="State">
              {['populated', 'loading', 'empty', 'error'].map((s) => (
                <button
                  key={s}
                  className={state === s ? 'on' : ''}
                  onClick={() => setState(s)}
                >
                  {s}
                </button>
              ))}
            </div>
          </div>
          <div className="ls-tools-divider" />
          <div className="ls-tools-group">
            <span className="ls-tools-label">Step</span>
            <div className="ls-tools-pills" role="tablist" aria-label="Step">
              {STEPS.map((s) => (
                <button
                  key={s.id}
                  className={step === s.id ? 'on' : ''}
                  onClick={() => setStep(s.id)}
                >
                  {s.label}
                </button>
              ))}
            </div>
          </div>
          <div className="ls-tools-spacer" />
          <a className="ls-tools-link" href="Create League - Page.html">
            Page version →
          </a>
        </div>
      );

      // ── Upgrade sub-modal ─────────────────────────────
      const UpgradeModal = ({ feature, onClose, onUnlock, frameRef }) =>
        ReactDOM.createPortal(
          <div
            className="ls-backdrop"
            style={{ zIndex: 200 }}
            onClick={onClose}
          >
            <div
              className="ls-modal"
              style={{ maxWidth: 440 }}
              onClick={(e) => e.stopPropagation()}
            >
              <div className="ls-modal-head">
                <div className="ico">
                  <img src="icons/brand/trophy.svg" width="24" height="24" />
                </div>
                <div className="ls-modal-title-wrap">
                  <div className="ls-modal-title" style={{ fontSize: 22 }}>
                    Premium feature
                  </div>
                  <div className="ls-modal-sub">
                    {feature} requires Legacy Commissioner.
                  </div>
                </div>
                <button className="ls-modal-close" onClick={onClose}>
                  <svg
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2.4"
                    strokeLinecap="round"
                  >
                    <line x1="6" y1="6" x2="18" y2="18" />
                    <line x1="18" y1="6" x2="6" y2="18" />
                  </svg>
                </button>
              </div>
              <div className="ls-modal-body">
                <div className="ls-premium-banner">
                  <div className="ls-premium-icon">
                    <img src="icons/brand/award.svg" width="18" height="18" />
                  </div>
                  <div className="ls-premium-body">
                    <div className="ls-premium-title">$49 / season</div>
                    <div className="ls-premium-sub">
                      Unlimited leagues · all eras · FAAB · salary cap · keepers
                    </div>
                  </div>
                </div>
              </div>
              <div className="ls-modal-foot">
                <div className="progress" />
                <button className="ls-btn ls-btn-ghost" onClick={onClose}>
                  Not now
                </button>
                <button className="ls-btn ls-btn-gold" onClick={onUnlock}>
                  Unlock
                </button>
              </div>
            </div>
          </div>,
          frameRef.current || document.body,
        );

      // ── Loading / Error / Empty bodies for modal ──────
      const ModalBodySkeleton = () => (
        <div className="ls-modal-grid" aria-busy="true">
          {[0, 1, 2, 3].map((i) => (
            <div key={i}>
              <div
                className="ls-skel"
                style={{ width: 90, height: 10, marginBottom: 10 }}
              />
              <div className="ls-skel" style={{ width: '100%', height: 44 }} />
            </div>
          ))}
          <div className="ls-field-full">
            <div
              className="ls-skel"
              style={{ width: 130, height: 10, marginBottom: 10 }}
            />
            <div
              style={{
                display: 'grid',
                gridTemplateColumns: 'repeat(4,1fr)',
                gap: 8,
              }}
            >
              {[0, 1, 2, 3, 4, 5, 6, 7].map((j) => (
                <div key={j} className="ls-skel" style={{ height: 68 }} />
              ))}
            </div>
          </div>
        </div>
      );

      const ModalBodyError = ({ onRetry }) => (
        <div className="ls-error">
          <div className="ls-error-icon">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              strokeWidth="2.4"
              strokeLinecap="round"
            >
              <line x1="12" y1="8" x2="12" y2="13" />
              <circle cx="12" cy="17" r="1.1" />
            </svg>
          </div>
          <div style={{ flex: 1 }}>
            <div className="ls-error-title">Unable to load league settings</div>
            <div className="ls-error-msg">
              The defaults couldn't be fetched from the server. Try again, or
              close this dialog and retry from your dashboard.
            </div>
          </div>
          <button className="ls-btn ls-btn-ghost ls-btn-sm" onClick={onRetry}>
            Retry
          </button>
        </div>
      );

      const ModalBodyEmpty = ({ onBegin, sport }) => (
        <div className="ls-empty-state" style={{ padding: '48px 24px' }}>
          <img
            src={`icons/brand/${sport === 'football' ? 'football' : 'baseball'}.svg`}
            width="48"
            height="48"
            alt=""
            style={{ opacity: 0.7 }}
          />
          <div className="ls-empty-title" style={{ fontSize: 20 }}>
            Ready when you are
          </div>
          <div className="ls-empty-sub">
            Name your league and we'll take it from there. Every other setting
            has a sensible default you can change later.
          </div>
          <button className="ls-btn ls-btn-gold" onClick={onBegin}>
            Start with a name
          </button>
        </div>
      );

      // ── The modal itself ──────────────────────────────
      const CreateModal = ({
        state,
        step,
        setStep,
        onClose,
        sport,
        setSport,
        frameRef,
      }) => {
        const [f, setF] = useState(() => {
          const url = new URLSearchParams(location.search);
          return { ...DEFAULT_FORM, sport, leagueName: url.get('name') || '' };
        });
        const [visited, setVisited] = useState(new Set(['basic']));
        const [submitting, setSubmitting] = useState(false);
        const [upgrade, setUpgrade] = useState(null);
        const [serverError, setServerError] = useState(false);

        const set = (patch) => setF((prev) => ({ ...prev, ...patch }));
        const switchSport = (next) => {
          setSport(next);
          setF((prev) => applySportSwitch(prev, next));
        };

        useEffect(() => {
          setVisited((v) => new Set([...v, step]));
        }, [step]);

        const errs = useMemo(() => validateForm(f), [f]);
        const disabled = state === 'loading' || submitting;
        const sportName = sportLabel(f);

        const idx = STEPS.findIndex((s) => s.id === step);
        const next = () => idx < STEPS.length - 1 && setStep(STEPS[idx + 1].id);
        const prev = () => idx > 0 && setStep(STEPS[idx - 1].id);

        const progress = (visited.size / STEPS.length) * 100;
        const canSubmit =
          Object.keys(errs).length === 0 && f.leagueName.trim().length >= 3;

        const renderStep = () => {
          if (state === 'loading') return <ModalBodySkeleton />;
          if (state === 'error') return <ModalBodyError onRetry={() => {}} />;
          if (state === 'empty')
            return <ModalBodyEmpty sport={f.sport} onBegin={() => {}} />;
          switch (step) {
            case 'basic':
              return (
                <div className="ls-modal-grid">
                  <BasicSection f={f} set={set} disabled={disabled} />
                </div>
              );
            case 'roster':
              return (
                <div className="ls-modal-grid">
                  <RosterSection f={f} set={set} disabled={disabled} />
                </div>
              );
            case 'era':
              return (
                <>
                  {!window.__premium && (
                    <div className="ls-premium-banner">
                      <div className="ls-premium-icon">
                        <img
                          src="icons/brand/trophy.svg"
                          width="18"
                          height="18"
                        />
                      </div>
                      <div className="ls-premium-body">
                        <div className="ls-premium-title">
                          Historical eras are premium
                        </div>
                        <div className="ls-premium-sub">
                          All Eras is free. Any specific era (or HOF-only) needs
                          Legacy Commissioner.
                        </div>
                      </div>
                      <button
                        className="ls-btn ls-btn-gold ls-btn-sm"
                        onClick={() => setUpgrade('Historical eras')}
                      >
                        Unlock
                      </button>
                    </div>
                  )}
                  <div className="ls-modal-grid">
                    <EraSection f={f} set={set} disabled={disabled} />
                  </div>
                </>
              );
            case 'draft':
              return (
                <div className="ls-modal-grid">
                  <DraftSection f={f} set={set} disabled={disabled} />
                </div>
              );
            case 'waivers':
              return (
                <div className="ls-modal-grid">
                  <WaiversSection
                    f={f}
                    set={set}
                    disabled={disabled}
                    onUpgrade={(feat) => setUpgrade(feat)}
                  />
                </div>
              );
            default:
              return null;
          }
        };

        // Portal into the viewport frame so container queries + theme tokens cascade.
        return ReactDOM.createPortal(
          <div className="ls-backdrop" onClick={onClose}>
            <div
              className="ls-modal"
              onClick={(e) => e.stopPropagation()}
              role="dialog"
              aria-modal="true"
              aria-labelledby="create-title"
            >
              {/* Head */}
              <div className="ls-modal-head">
                <div className="ico">
                  <img
                    src={`icons/brand/${f.sport === 'football' ? 'football' : 'league'}.svg`}
                    width="26"
                    height="26"
                    alt=""
                  />
                </div>
                <div className="ls-modal-title-wrap">
                  <div className="ls-modal-title" id="create-title">
                    Create {sportName} League
                  </div>
                  <div className="ls-modal-sub">
                    Configure settings and draft rules · takes about two minutes
                  </div>
                </div>
                <button
                  className="ls-modal-close"
                  onClick={onClose}
                  aria-label="Close"
                >
                  <svg
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2.4"
                    strokeLinecap="round"
                  >
                    <line x1="6" y1="6" x2="18" y2="18" />
                    <line x1="18" y1="6" x2="6" y2="18" />
                  </svg>
                </button>
              </div>

              {/* Sport selector — first decision, above the stepper */}
              <div className="ls-modal-sport-bar">
                <div className="ls-eyebrow">Sport</div>
                <SportSwitcher
                  value={f.sport}
                  onChange={switchSport}
                  disabled={disabled}
                  compact
                />
              </div>

              {/* Stepper */}
              <div className="ls-stepper" role="tablist">
                {STEPS.map((s, i) => {
                  const done = visited.has(s.id) && s.id !== step;
                  return (
                    <React.Fragment key={s.id}>
                      <button
                        className={`ls-step ${step === s.id ? 'on' : ''} ${done ? 'done' : ''}`}
                        onClick={() => setStep(s.id)}
                        role="tab"
                        aria-selected={step === s.id}
                      >
                        <span className="ls-step-num">
                          {done ? (
                            <svg
                              width="10"
                              height="10"
                              viewBox="0 0 24 24"
                              fill="none"
                              stroke="currentColor"
                              strokeWidth="3.2"
                              strokeLinecap="round"
                            >
                              <polyline points="20 6 9 17 4 12" />
                            </svg>
                          ) : (
                            i + 1
                          )}
                        </span>
                        {s.label}
                      </button>
                      {i < STEPS.length - 1 && (
                        <span className="ls-step-sep">—</span>
                      )}
                    </React.Fragment>
                  );
                })}
              </div>

              {serverError && state !== 'error' && (
                <div style={{ padding: '16px 28px 0' }}>
                  <div className="ls-error">
                    <div className="ls-error-icon">
                      <svg
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        strokeWidth="2.4"
                        strokeLinecap="round"
                      >
                        <line x1="12" y1="8" x2="12" y2="13" />
                        <circle cx="12" cy="17" r="1.1" />
                      </svg>
                    </div>
                    <div style={{ flex: 1 }}>
                      <div className="ls-error-title">Submit failed</div>
                      <div className="ls-error-msg">
                        The commissioner service didn't respond. Your settings
                        are preserved — try Create League again.
                      </div>
                    </div>
                    <button
                      className="ls-btn ls-btn-ghost ls-btn-sm"
                      onClick={() => setServerError(false)}
                    >
                      Dismiss
                    </button>
                  </div>
                </div>
              )}

              {/* Body */}
              <div className="ls-modal-body">
                <div>
                  <div className="ls-eyebrow" style={{ marginBottom: 4 }}>
                    Step {idx + 1} of {STEPS.length}
                  </div>
                  <div className="ls-h3">{stepTitle(step)}</div>
                  <div className="ls-meta" style={{ marginTop: 4 }}>
                    {stepSub(step, f)}
                  </div>
                </div>
                {renderStep()}
                {state === 'populated' && (
                  <div
                    style={{
                      marginTop: 4,
                      padding: '14px 16px',
                      background: 'rgba(27,58,92,.12)',
                      border: '1px solid var(--outline-subtle)',
                      borderRadius: 'var(--radius-3)',
                      display: 'flex',
                      justifyContent: 'space-between',
                      gap: 16,
                      flexWrap: 'wrap',
                    }}
                  >
                    <div>
                      <div className="ls-eyebrow">Current scorecard</div>
                      <div
                        style={{
                          fontFamily: 'var(--font-display)',
                          fontWeight: 800,
                          fontSize: 18,
                          color: 'var(--fg1-strong)',
                          marginTop: 2,
                        }}
                      >
                        {f.leagueName || (
                          <span
                            style={{
                              color: 'var(--fg4)',
                              fontStyle: 'italic',
                              fontWeight: 400,
                            }}
                          >
                            Untitled League
                          </span>
                        )}
                      </div>
                    </div>
                    <div
                      className="ls-mono"
                      style={{
                        color: 'var(--fg2)',
                        fontSize: 13,
                        alignSelf: 'center',
                        textAlign: 'right',
                      }}
                    >
                      {sportLeague(f)} · {f.numberOfTeams} TEAMS ·{' '}
                      {f.numberOfDivisions} DIV ·{' '}
                      {scheduleLabel(f.schedulingStrategy).toUpperCase()} ·{' '}
                      {eraLabel(f).toUpperCase()}
                      {f.hofOnly ? ' · HOF' : ''}
                      <br />
                      {f.draftMode.toUpperCase()} ·{' '}
                      {f.selectionMethod.toUpperCase()} ·{' '}
                      {f.draftOrder.toUpperCase()} ·{' '}
                      {f.waiverType === 'faab'
                        ? `FAAB $${f.faabBudgetDefault}`
                        : 'STD WAIVERS'}
                      {f.salaryCapEnabled ? ` · $${f.salaryCap}M CAP` : ''}
                    </div>
                  </div>
                )}
              </div>

              {/* Foot — progress + nav */}
              <div className="ls-modal-foot">
                <div className="progress">
                  <div
                    className="ls-mono"
                    style={{ color: 'var(--fg3)', fontSize: 11 }}
                  >
                    {visited.size}/{STEPS.length}
                  </div>
                  <div
                    className="ls-progress-bar"
                    title={`${Math.round(progress)}% complete`}
                  >
                    <div
                      className="ls-progress-fill"
                      style={{ width: `${progress}%` }}
                    />
                  </div>
                  {Object.keys(errs).length > 0 ? (
                    <span
                      style={{
                        color: 'var(--danger-fg)',
                        fontSize: 12,
                        fontFamily: 'var(--font-body)',
                      }}
                    >
                      {Object.values(errs)[0]}
                    </span>
                  ) : (
                    <span
                      style={{
                        color: 'var(--fg3)',
                        fontSize: 12,
                        fontFamily: 'var(--font-body)',
                      }}
                    >
                      Sensible defaults in place. You can revisit any step.
                    </span>
                  )}
                </div>
                {idx > 0 && (
                  <button
                    className="ls-btn ls-btn-ghost"
                    onClick={prev}
                    disabled={disabled}
                  >
                    ← Back
                  </button>
                )}
                {idx < STEPS.length - 1 ? (
                  <button
                    className="ls-btn ls-btn-primary"
                    onClick={next}
                    disabled={disabled}
                  >
                    Next →
                  </button>
                ) : (
                  <button
                    className="ls-btn ls-btn-primary"
                    disabled={disabled || !canSubmit}
                    onClick={() => {
                      setSubmitting(true);
                      setTimeout(() => {
                        setSubmitting(false);
                        setServerError(true);
                      }, 1400);
                    }}
                  >
                    {submitting ? (
                      <>
                        <span className="ls-spinner" /> Creating…
                      </>
                    ) : (
                      'Create League'
                    )}
                  </button>
                )}
              </div>
            </div>

            {upgrade && (
              <UpgradeModal
                feature={upgrade}
                frameRef={frameRef}
                onClose={() => setUpgrade(null)}
                onUnlock={() => {
                  window.__premium = true;
                  setUpgrade(null);
                }}
              />
            )}
          </div>,
          frameRef.current || document.body,
        );
      };

      const stepTitle = (s) =>
        ({
          basic: 'Basic Settings',
          roster: 'Roster & Schedule',
          era: 'Era & History',
          draft: 'Draft Settings',
          waivers: 'Waivers, Budget & Salary Cap',
        })[s];
      const stepSub = (s, f) =>
        ({
          basic:
            'Name, size, and visibility — the essentials. Everything else has a default.',
          roster: 'How the season runs and who is eligible to draft.',
          era:
            'The signature control — pick a decade, a range, or the full ' +
            (f.sport === 'football' ? 'century' : '150 years') +
            '.',
          draft: `Set how ${f.leagueName || 'your league'} drafts, and when.`,
          waivers: 'In-season free-agency rules and optional cap enforcement.',
        })[s];

      const App = () => {
        const [state, setState] = useState('populated');
        const [step, setStep] = useState('basic');
        const [viewport, setViewport] = useState('desktop');
        const [sport, setSport] = useState('baseball');
        const [modalOpen, setModalOpen] = useState(true);
        const frameRef = React.useRef(null);
        const vp = VIEWPORTS.find((v) => v.id === viewport) || VIEWPORTS[3];

        return (
          <div data-screen-label="02 Create League (Modal)">
            <DesignTools
              state={state}
              setState={setState}
              step={step}
              setStep={setStep}
              viewport={viewport}
              setViewport={setViewport}
            />
            <div className="ls-vp-stage">
              <div className="ls-vp-meta">
                <span className="lbl">{vp.label}</span>
                <span className="dot" />
                <span>{vp.w ? `${vp.w}px` : 'fluid · 100%'}</span>
                <span className="dot" />
                <span>Sport: {sport}</span>
              </div>
              <div
                ref={frameRef}
                className={`ls-vp-frame size-${viewport}`}
                data-sport={sport}
                style={
                  vp.w ? { width: vp.w, maxWidth: '100%' } : { width: '100%' }
                }
              >
                <TopNav sport={sport} />
                <MockDash sport={sport} />
                {!modalOpen && (
                  <div
                    style={{
                      position: 'absolute',
                      bottom: 24,
                      right: 24,
                      zIndex: 40,
                    }}
                  >
                    <button
                      className="ls-btn ls-btn-gold"
                      onClick={() => setModalOpen(true)}
                    >
                      + New League
                    </button>
                  </div>
                )}
                {modalOpen && (
                  <CreateModal
                    state={state}
                    step={step}
                    setStep={setStep}
                    sport={sport}
                    setSport={setSport}
                    frameRef={frameRef}
                    onClose={() => setModalOpen(false)}
                    key={state}
                  />
                )}
              </div>
            </div>
          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById('app')).render(<App />);
    </script>
  </body>
</html>
