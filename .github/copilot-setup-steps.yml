# =============================================================================
# Copilot Coding Agent — Cloud Environment Setup
# =============================================================================
# This file defines the steps GitHub Copilot's coding agent runs to bootstrap
# its cloud environment before working on tasks. It runs in a Codespace-like
# Ubuntu container with Docker support.
#
# What this sets up:
#   - Node.js 22 + pnpm 9.12.1 (matches .nvmrc / packageManager)
#   - All workspace dependencies (pnpm install)
#   - Local PostgreSQL via Docker Compose (no AWS needed)
#   - Dev seed database restore (anonymized data)
#   - Database migrations
#   - Git LFS (for dev-seed.dump)
#   - GitHub CLI authentication (for PR creation via MCP server)
#
# What this does NOT set up (by design):
#   - twig CLI (not needed — cloud agents work in single-branch ephemeral envs)
#   - acli CLI (Jira operations use the MCP server exclusively)
#   - AWS credentials (no cloud AWS interactions from agent environment)
#   - Worktree management (agent gets its own isolated checkout)
# =============================================================================

steps:
  - name: Install Node.js
    uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
    with:
      node-version-file: .nvmrc

  - name: Enable pnpm via corepack
    run: |
      corepack enable
      corepack prepare pnpm@9.12.1 --activate

  - name: Generate GitHub App token (Agent Author bot)
    uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
    id: agent-author-token
    with:
      app-id: 3158619
      private-key: ${{ secrets.AGENT_AUTHOR_APP_PRIVATE_KEY }}

  - name: Authenticate GitHub CLI
    run: |
      if ! command -v gh &> /dev/null; then
        echo "ERROR: gh CLI not found on PATH. Install from https://cli.github.com"
        exit 1
      fi
      # Prefer the scoped Agent Author app token (short-lived, least-privilege).
      # Falls back to GITHUB_TOKEN if the app token wasn't generated.
      TOKEN="${AGENT_AUTHOR_TOKEN:-$GITHUB_TOKEN}"
      if [ -n "$TOKEN" ]; then
        echo "$TOKEN" | gh auth login --with-token
        echo "gh auth: authenticated via ${AGENT_AUTHOR_TOKEN:+Agent Author app token}${AGENT_AUTHOR_TOKEN:-GITHUB_TOKEN}"
      else
        echo "WARNING: No GitHub token available — gh CLI will not be authenticated"
        echo "PR creation via the legacy-sports-github MCP server will fail"
      fi
      # Export GH_TOKEN so the legacy-sports-github MCP server picks it up.
      # The MCP server checks GH_TOKEN first, then GITHUB_TOKEN at runtime.
      if [ -n "$AGENT_AUTHOR_TOKEN" ]; then
        echo "::add-mask::$AGENT_AUTHOR_TOKEN"
        echo "GH_TOKEN=$AGENT_AUTHOR_TOKEN" >> "$GITHUB_ENV"
        echo "GH_TOKEN exported to environment for MCP server"
      fi
    env:
      AGENT_AUTHOR_TOKEN: ${{ steps.agent-author-token.outputs.token }}

  - name: Install dependencies
    run: pnpm install --frozen-lockfile

  - name: Pull Git LFS objects
    run: |
      if ! command -v git-lfs &> /dev/null && ! git lfs version &> /dev/null; then
        echo "git-lfs not found — installing..."
        apt-get update && apt-get install -y git-lfs
      fi
      git lfs install
      git lfs pull

  - name: Start PostgreSQL
    run: docker compose up -d postgres

  - name: Wait for PostgreSQL to be healthy
    run: |
      echo "Waiting for PostgreSQL..."
      for i in $(seq 1 60); do
        if docker compose exec -T postgres pg_isready -U legacy_sports -d legacy_sports_dev > /dev/null 2>&1; then
          echo "PostgreSQL is ready (after ${i}s)"
          exit 0
        fi
        sleep 1
      done
      echo "PostgreSQL failed to start within 60s"
      exit 1

  - name: Restore dev seed database
    run: |
      SEED_FILE="resources/dev-seed.dump"
      PG_CONTAINER="ls-postgres"
      PG_USER="legacy_sports"
      PG_DB="legacy_sports_dev"

      # Verify seed dump exists (requires git lfs pull)
      if [ ! -f "$SEED_FILE" ] || [ $(stat -c%s "$SEED_FILE" 2>/dev/null || echo 0) -lt 1000 ]; then
        echo "ERROR: $SEED_FILE is missing or is an LFS pointer. Run 'git lfs pull' first."
        exit 1
      fi

      # Copy dump into container
      docker cp "$SEED_FILE" "${PG_CONTAINER}:/tmp/restore.dump"

      # Drop and recreate database
      docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d postgres -c \
        "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '$PG_DB' AND pid <> pg_backend_pid();" > /dev/null 2>&1
      docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d postgres -c "DROP DATABASE IF EXISTS $PG_DB;"
      docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d postgres -c "CREATE DATABASE $PG_DB OWNER $PG_USER;"

      # Recreate schemas
      docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -c "CREATE SCHEMA IF NOT EXISTS app_internal;"
      docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -c "GRANT ALL PRIVILEGES ON SCHEMA public TO $PG_USER;"
      docker exec "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -c "GRANT ALL PRIVILEGES ON SCHEMA app_internal TO $PG_USER;"

      # Restore from dump (pg_restore returns non-zero for warnings like "table does not exist" during --clean;
      # capture exit code and warn but don't fail on minor issues)
      RESTORE_EXIT=0
      docker exec "$PG_CONTAINER" pg_restore -U "$PG_USER" -d "$PG_DB" --no-owner --no-privileges --clean --if-exists /tmp/restore.dump || RESTORE_EXIT=$?
      if [ $RESTORE_EXIT -ne 0 ]; then
        echo "WARNING: pg_restore exited with code $RESTORE_EXIT (non-fatal warnings are expected with --clean --if-exists)"
      fi

      echo "Dev seed restored (exit code: $RESTORE_EXIT)"

  - name: Export DATABASE_URL for MCP servers
    run: |
      # Define once here — all subsequent steps (including migrations) inherit from $GITHUB_ENV
      {
        echo "DATABASE_URL=postgresql://legacy_sports:legacy_sports_dev@localhost:5432/legacy_sports_dev"
        echo "USE_LOCAL_CREDENTIALS=true"
      } >> "$GITHUB_ENV"

  - name: Export Jira credentials for MCP servers
    run: |
      # OAuth 2.0 (preferred) — all three vars must be present
      if [ -n "$JIRA_CLIENT_ID" ] && [ -n "$JIRA_CLIENT_SECRET" ] && [ -n "$JIRA_CLOUD_ID" ]; then
        {
          echo "JIRA_CLIENT_ID<<EOF"
          echo "$JIRA_CLIENT_ID"
          echo "EOF"
          echo "JIRA_CLIENT_SECRET<<EOF"
          echo "$JIRA_CLIENT_SECRET"
          echo "EOF"
          echo "JIRA_CLOUD_ID<<EOF"
          echo "$JIRA_CLOUD_ID"
          echo "EOF"
          echo "JIRA_SITE_URL<<EOF"
          echo "${JIRA_SITE_URL:-https://bkrupa.atlassian.net}"
          echo "EOF"
        } >> "$GITHUB_ENV"
        echo "Jira OAuth credentials exported"
      # Basic Auth fallback — both vars must be present
      elif [ -n "$JIRA_EMAIL" ] && [ -n "$JIRA_API_TOKEN" ]; then
        {
          echo "JIRA_EMAIL<<EOF"
          echo "$JIRA_EMAIL"
          echo "EOF"
          echo "JIRA_API_TOKEN<<EOF"
          echo "$JIRA_API_TOKEN"
          echo "EOF"
        } >> "$GITHUB_ENV"
        echo "Jira Basic Auth credentials exported"
      else
        echo "WARNING: No complete Jira credentials found — jira_auth_status will report configured: false"
        echo "Add JIRA_CLIENT_ID + JIRA_CLIENT_SECRET + JIRA_CLOUD_ID (OAuth) or JIRA_EMAIL + JIRA_API_TOKEN (Basic Auth) to the copilot environment"
      fi
    env:
      JIRA_CLIENT_ID: ${{ secrets.JIRA_CLIENT_ID }}
      JIRA_CLIENT_SECRET: ${{ secrets.JIRA_CLIENT_SECRET }}
      JIRA_CLOUD_ID: ${{ secrets.JIRA_CLOUD_ID }}
      JIRA_SITE_URL: ${{ secrets.JIRA_SITE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

  - name: Apply database migrations
    run: cd lib/db-client && pnpm run db:migrate
    # DATABASE_URL and USE_LOCAL_CREDENTIALS are inherited from $GITHUB_ENV above

  - name: Create local .env for MCP servers
    run: |
      if [ -f .env ]; then
        echo ".env already exists — skipping creation"
        exit 0
      fi
      # DATABASE_URL and USE_LOCAL_CREDENTIALS are already in $GITHUB_ENV from the export step above
      cat > .env <<EOF
      USE_LOCAL_CREDENTIALS=${USE_LOCAL_CREDENTIALS}
      DB_HOST=localhost:5432
      DB_USER=legacy_sports
      DB_PASSWORD=legacy_sports_dev
      DB_NAME=legacy_sports_dev
      DATABASE_URL=${DATABASE_URL}
      DB_CERT_PATH=
      DB_SECRET_NAME=
      JWT_SECRET=cloud-agent-jwt-secret-not-for-production
      COOKIE_SECRET=cloud-agent-cookie-secret-not-for-production
      EOF
