name: Deploy Serverless Lambda

inputs:
  lambda-directory:
    required: true
    type: string

runs:
  using: 'composite'
  steps:
    - name: Build
      working-directory: ${{ inputs.lambda-directory }}
      shell: bash
      run: npx nx --verbose build

    - name: Bundle Serverless Package
      working-directory: ${{ inputs.lambda-directory }}
      shell: bash
      run: npx serverless package

    - name: LS Serverless dir
      working-directory: ${{ inputs.lambda-directory }}
      shell: bash
      run: ls .serverless

    - name: Deploy Lambda
      working-directory: ${{ inputs.lambda-directory }}
      shell: bash
      run: npx serverless deploy -p .serverless
