name: Setup Python

inputs:
  include-dev:
    required: true
    type: boolean
    default: true

runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' 
  
    - name: Get Python Version
      id: full-python-version
      shell: bash
      run: echo "version=$(python --version)" >> "$GITHUB_OUTPUT"  

    - name: Install and configure Poetry
      uses: snok/install-poetry@v1
      with:
        version: 1.8.3
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Set up Poetry cache
      uses: actions/cache@v2
      id: cached-poetry-dependencies
      with:
        path: .venv
        key: root-venv-${{ runner.os }}-${{ steps.full-python-version.outputs.version }}-${{ hashFiles('**/poetry.lock') }}-with-dev:${{ inputs.include-dev}}

    - name: Install Poetry Dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true' && 
      shell: bash
      run: poetry install

    - name: Install Poetry Dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true' && inputs.include-dev
      shell: bash
      run: poetry install

    - name: Install Poetry Dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true' && !inputs.include-dev
      shell: bash
      run: poetry install --only main --sync

    
