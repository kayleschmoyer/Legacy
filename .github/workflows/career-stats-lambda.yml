name: Career Stats Lambda

# Controls when the workflow will run
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - lambdas/career_stats_lambda/**

env:
  AWS_REGION: 'us-east-1'
  IMAGE_TAG: ${{ github.sha }}
  FUNCTION_NAME: career-stats-lambda
  WORKING_DIRECTORY: lambdas/career_stats_lambda
  SRC_DIRECTORY: career_stats_lambda

defaults:
  run:
    working-directory: .

# Permission can be added at job level or workflow level
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout

jobs:
  build:
    name: Deploy Career Stats Lambda
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: ./.github/workflows/setup-python

      - name: Setup AWS
        uses: ./.github/workflows/setup-aws
        id: setup-aws
        with:
          aws-region: ${{ env.AWS_REGION }}

      - name: Create distro directory
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: mkdir -p /tmp/dist/${{ env.FUNCTION_NAME }}

      - name: Copy dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: cp --recursive .venv/lib/python*/site-packages/* /tmp/dist/${{ env.FUNCTION_NAME }}
      
      - name: Copy source
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: cp -v --recursive ${{ env.SRC_DIRECTORY }}/* /tmp/dist/${{ env.FUNCTION_NAME }}

      - name: Zip package
        working-directory: /tmp/dist/${{ env.FUNCTION_NAME }}
        id: create-zip
        env:
          FILENAME: /tmp/dist/deploy-${{ env.FUNCTION_NAME }}.zip
        run: |
          zip -r ${{ env.FILENAME }} .
          echo "filename=${{ env.FILENAME }}" >> "$GITHUB_OUTPUT"  
          
      - name: Update lambda image
        run: |
          aws lambda update-function-code \
            --function-name ${FUNCTION_NAME} \
            --zip-file fileb://${{ steps.create-zip.outputs.filename }}
