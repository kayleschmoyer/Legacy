name: Merge Queue Management

on:
  pull_request:
    types: [labeled, unlabeled]
  pull_request_review:
    types: [submitted]

jobs:
  manage-merge-queue:
    if: github.event.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MERGE_QUEUE_APP_ID }}
          private-key: ${{ secrets.MERGE_QUEUE_APP_PRIVATE_KEY }}

      - name: Handle Merge Queue Label Added
        if: |
          github.event_name == 'pull_request' && 
          github.event.action == 'labeled' &&
          github.event.label.name == 'merge-when-ready'
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const pr = context.payload.pull_request;

            // Add confirmation comment
            await github.rest.issues.createComment({
              issue_number: pr.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 **Added to merge queue!**\n\n' +
                    'This PR will be automatically merged when:\n' +
                    '- All status checks pass ✅\n' +
                    '- No merge conflicts exist ✅\n' +
                    '- Required reviews are approved ✅\n\n' +
                    'The merge queue responds immediately to status changes, new commits, and reviews. ' +
                    'Remove the `merge-when-ready` label to exit the queue.'
            });

      - name: Handle Merge Queue Label Removed
        if: |
          github.event_name == 'pull_request' && 
          github.event.action == 'unlabeled' &&
          github.event.label.name == 'merge-when-ready'
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const pr = context.payload.pull_request;

            // Add confirmation comment
            await github.rest.issues.createComment({
              issue_number: pr.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⏹️ **Removed from merge queue.**\n\n' +
                    'This PR will no longer be automatically merged. ' +
                    'Add the `merge-when-ready` label to add it back to the queue.'
            });

      - name: Auto-Add on Approval (Optional)
        if: |
          github.event_name == 'pull_request_review' &&
          github.event.review.state == 'approved'
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            // Optional: Automatically add to queue when approved
            // Uncomment the code below if you want this behavior
            /*
            const pr = context.payload.pull_request;

            // Check if PR already has the label
            const hasLabel = pr.labels.some(label => label.name === 'merge-when-ready');

            if (!hasLabel) {
              await github.rest.issues.addLabels({
                issue_number: pr.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['merge-when-ready']
              });
              
              await github.rest.issues.createComment({
                issue_number: pr.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '✅ **Auto-added to merge queue** after approval!\n\n' +
                      'This PR will be automatically merged when all checks pass.'
              });
            }
            */
            console.log('Auto-add on approval is currently disabled. Edit workflow to enable.');
