name: Deploy Game Selection Lambda

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lambdas/game-selection/**"
      - ".github/workflows/deploy-game-selection.yml"

# Prevent concurrent deployments of the same Lambda
# Terraform state locking (DynamoDB) handles cross-Lambda conflicts
concurrency:
  group: lambda-deployment-game-selection
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_SERVICE_NAME: legacy-sports-game-selection
  AWS_STAGE: dev

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy Game Selection Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true

      - name: Validate Deployment Readiness
        uses: ./.github/actions/deployment-gate
        with:
          artifacts-ready: 'true'
          quality-passed: 'true'
          required-components: ''
          environment: 'production'

      - name: "☁️ Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::176661590736:role/legacy-sports-dev-github-actions
          role-session-name: GitHubActions-DeployGameSelection
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Game Selection Lambda
        uses: ./.github/actions/deploy-lambda
        with:
          lambda-name: game-selection
          build-output-file: dev.js
          terraform-target: aws_lambda_function.game_selection
          aws-region: ${{ env.AWS_REGION }}
          aws-stage: ${{ env.AWS_STAGE }}

      - name: Update Deployment Badge
        if: always()
        uses: ./.github/actions/update-deployment-badge
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          gist-id: ${{ secrets.CI_BADGES_GIST_ID }}
          deployment-name: "Game Selection Lambda"
          deployment-status: ${{ job.status }}
          workflow-run-id: ${{ github.run_id }}
          branch: ${{ github.ref_name }}
