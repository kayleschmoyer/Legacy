name: Deploy Game Selection Lambda (DEPRECATED)

# ⚠️ DEPRECATED: This workflow is deprecated in favor of the new upload pattern
# Use upload-game-selection.yml instead, which uploads to S3 and lets the central
# lambda-terraform-apply workflow handle infrastructure deployment
# This workflow is kept for reference only and will be removed in a future update

on:
  workflow_dispatch:
    inputs:
      confirm_deprecated:
        description: 'WARNING: This workflow is deprecated. Type "yes" to run anyway'
        required: true
        default: "no"
  # push:  # Disabled - replaced by upload-game-selection.yml
  #   branches: [main]
  #   paths:
  #     - "lambdas/game-selection/**"
  #     - ".github/workflows/deploy-game-selection.yml"

# IMPORTANT: Infrastructure Configuration
# These values are currently hardcoded for the dev environment.
# FUTURE IMPROVEMENT: Move to AWS Systems Manager Parameter Store
# See deploy-gql.yml for detailed improvement recommendations.
env:
  AWS_REGION: us-east-1
  AWS_SERVICE_NAME: legacy-sports-game-selection
  AWS_STAGE: dev # TODO: Parameterize for multi-environment support

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy Game Selection Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Check Deprecation Confirmation
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_deprecated != 'yes'
        run: |
          echo "::error::⚠️ This workflow is DEPRECATED"
          echo "::error::Use upload-game-selection.yml instead"
          echo "::error::The new pattern: Upload to S3 → Central Terraform applies infrastructure"
          exit 1

      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: true

      - name: "☁️ Detect DTE Availability"
        id: detect-dte
        uses: ./.github/actions/detect-dte
        with:
          nx-cloud-token: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

      - name: "☁️ Start Nx Cloud CI Run"
        id: start-dte
        if: steps.detect-dte.outputs.dte-available == 'true'
        continue-on-error: true
        run: |
          echo "🚀 Starting Nx Cloud DTE..."
          DTE_START_OUTPUT=$(mktemp)
          DTE_START_RESULT=0

          pnpm exec nx-cloud start-ci-run --distribute-on="${{ steps.detect-dte.outputs.optimal-agents }} linux-medium-js" 2>&1 | tee "$DTE_START_OUTPUT" || DTE_START_RESULT=$?

          if [ $DTE_START_RESULT -ne 0 ] || grep -qi "quota\|limit\|exceeded\|insufficient\|disabled\|unauthorized\|authorization\|401" "$DTE_START_OUTPUT"; then
            echo "::warning title=DTE Unavailable::Nx Cloud DTE unavailable. Build will proceed with local execution."
            cat "$DTE_START_OUTPUT"
            rm -f "$DTE_START_OUTPUT"
            exit 1
          fi

          rm -f "$DTE_START_OUTPUT"
          echo "✅ DTE session started"

      - name: Validate Deployment Readiness
        uses: ./.github/actions/deployment-gate
        with:
          artifacts-ready: "true"
          quality-passed: "true"
          required-components: ""
          environment: "production"

      - name: "☁️ Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::176661590736:role/legacy-sports-dev-github-actions
          role-session-name: GitHubActions-DeployGameSelection
          aws-region: ${{ env.AWS_REGION }}

      - name: 🏗️ Build and Package Game Selection Lambda
        id: build
        uses: ./.github/actions/build-lambda
        with:
          lambda-name: game-selection
          build-output-file: dev.js
          aws-region: ${{ env.AWS_REGION }}
          aws-stage: ${{ env.AWS_STAGE }}
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          sentry-org: ${{ secrets.SENTRY_ORG }}
          sentry-project: lambda-game-selection

      - name: 🚀 Deploy Game Selection Infrastructure
        uses: ./.github/actions/deploy-lambda-infrastructure
        with:
          lambda-name: game-selection
          terraform-target: aws_lambda_function.game_selection
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Deployment Badge
        if: always()
        uses: ./.github/actions/update-deployment-badge
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          gist-id: ${{ secrets.CI_BADGES_GIST_ID }}
          deployment-name: "Game Selection Lambda"
          deployment-status: ${{ job.status }}
          workflow-run-id: ${{ github.run_id }}
          branch: ${{ github.ref_name }}
