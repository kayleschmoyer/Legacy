name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps/**
      - db/**
      - lambdas/**
      - package-lock.json
      - poetry.lock
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup NPM
        uses: ./.github/workflows/setup-npm
      
      - name: Setup Python
        uses: ./.github/workflows/setup-python

      - uses: nrwl/nx-set-shas@v4

      # Nx Affected runs only tasks affected by the changes in this PR/commit. Learn more: https://nx.dev/ci/features/affected
      - name: "Lint"
        run: npx nx affected -t lint
      - name: "Build"
        run: npx nx affected -t build
      - name: "Test"
        run: npx nx affected -t test

  build-ios:
    if: ${{ vars.BUILD_IOS == 'true' }}
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup NPM
        uses: ./.github/workflows/setup-npm

      - uses: nrwl/nx-set-shas@v4

      # Nx Affected runs only tasks affected by the changes in this PR/commit. Learn more: https://nx.dev/ci/features/affected
      - name: "Build Image"
        run: npx nx build-ios app

      - name: "Run Tests"
        run: npx nx test-ios app

  build-android:
    if: ${{ vars.BUILD_ANDROID == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'


      - name: Setup NPM
        uses: ./.github/workflows/setup-npm

      - uses: nrwl/nx-set-shas@v4

      # Nx Affected runs only tasks affected by the changes in this PR/commit. Learn more: https://nx.dev/ci/features/affected
      - name: "Build Image"
        run: npx nx build-android app

      - name: "Run Tests"
        run: npx nx test-android app
