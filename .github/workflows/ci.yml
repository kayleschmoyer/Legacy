name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps/**
      - lambdas/**
      - lib/**
      - package-lock.json
      - poetry.lock
  pull_request:

# Cancel in-progress runs for the same workflow on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  NX_CLOUD_DISTRIBUTED_EXECUTION: false

jobs:
  main:
    name: Main CI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          # Use filter: tree:0 for better performance and fetch-depth: 0 for full history
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Connect your workspace by running "nx connect" and uncomment this line to enable task distribution
      # - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      # Cache node_modules using official Node.js action
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: 'main'
          error-on-no-successful-workflow: false

      # Prepend any command with "nx-cloud record --" to record its logs to Nx Cloud
      # - run: npx nx-cloud record -- echo Hello World

      - name: Validate Package.json Standards
        run: node scripts/validate-package-json-standards.js

      - name: Validate Workspace Dependencies
        run: node scripts/validate-workspace-deps.js

      # Run setup-ci for affected projects first
      - name: Setup CI
        run: npx nx affected -t setup-ci

      # Run each target separately for better error visibility and performance
      - name: Lint Affected Projects
        run: npx nx affected -t lint

      - name: Test Affected Projects
        run: npx nx affected -t test

      # Show which projects will be built
      - name: Show Build Plan
        run: |
          echo "Projects that will be built:"
          npx nx show projects --affected --json
          echo ""
          echo "Build dependency graph:"
          npx nx affected -t build --dry-run
          echo ""
          echo "Available targets for affected projects:"
          for project in $(npx nx show projects --affected); do
            echo "Project: $project"
            npx nx show project $project --json | jq -r '.targets | keys[]' | sed 's/^/  - /'
          done

      - name: Build Affected Projects  
        run: |
          echo "Building affected projects with error handling..."
          
          # Get list of affected projects
          affected_projects=$(npx nx show projects --affected)
          
          # Try to build all projects
          if npx nx affected -t build --verbose --skip-nx-cache; then
            echo "✅ All builds succeeded"
          else
            echo "❌ Some builds failed. Attempting individual project builds for better error visibility..."
            
            # Build each project individually to identify specific failures
            for project in $affected_projects; do
              echo "Building project: $project"
              if npx nx build $project --verbose; then
                echo "✅ $project built successfully"
              else
                echo "❌ Failed to build $project"
                # Continue with other projects to see all failures
              fi
            done
            
            # Exit with error since some builds failed
            exit 1
          fi

      # Run format and bundle targets if they exist
      - name: Format Check Affected Projects
        run: npx nx affected -t format || echo "Format target not available for affected projects"
        continue-on-error: true

      - name: Bundle Affected Projects  
        run: npx nx affected -t bundle || echo "Bundle target not available for affected projects"
        continue-on-error: true

  build-ios:
    name: Build iOS
    if: ${{ vars.BUILD_IOS == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: 'main'
          error-on-no-successful-workflow: false

      # Only build iOS if the app project is affected
      - name: Check if iOS build is needed
        id: check-ios
        run: |
          if npx nx show projects --affected --json | grep -q '"app"'; then
            echo "build_needed=true" >> $GITHUB_OUTPUT
          else
            echo "build_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build iOS App
        if: steps.check-ios.outputs.build_needed == 'true'
        run: npx nx build-ios app

      - name: Test iOS App
        if: steps.check-ios.outputs.build_needed == 'true'
        run: npx nx test-ios app

  build-android:
    name: Build Android
    if: ${{ vars.BUILD_ANDROID == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: 'main'
          error-on-no-successful-workflow: false

      # Only build Android if the app project is affected
      - name: Check if Android build is needed
        id: check-android
        run: |
          if npx nx show projects --affected --json | grep -q '"app"'; then
            echo "build_needed=true" >> $GITHUB_OUTPUT
          else
            echo "build_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Android App
        if: steps.check-android.outputs.build_needed == 'true'
        run: npx nx build-android app

      - name: Test Android App
        if: steps.check-android.outputs.build_needed == 'true'
        run: npx nx test-android app
