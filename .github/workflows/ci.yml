name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps/**
      - lambdas/**
      - lib/**
      - package-lock.json
      - poetry.lock
  pull_request:

# Cancel in-progress runs for the same workflow on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  NX_CLOUD_DISTRIBUTED_EXECUTION: false

jobs:
  main:
    name: Main CI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup NPM
        uses: ./.github/workflows/setup-npm

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Validate Package.json Standards
        run: node scripts/validate-package-json-standards.js

      - name: Validate Workspace Dependencies
        run: node scripts/validate-workspace-deps.js

      - name: Setup CI
        run: npx nx affected -t setup-ci

      - name: Run CI Tasks
        run: npx nx affected -t lint build test format bundle prebuild

  build-ios:
    name: Build iOS
    if: ${{ vars.BUILD_IOS == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup NPM
        uses: ./.github/workflows/setup-npm

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Build iOS App
        run: npx nx build-ios app

      - name: Test iOS App
        run: npx nx test-ios app

  build-android:
    name: Build Android
    if: ${{ vars.BUILD_ANDROID == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup NPM
        uses: ./.github/workflows/setup-npm

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Build Android App
        run: npx nx build-android app

      - name: Test Android App
        run: npx nx test-android app
