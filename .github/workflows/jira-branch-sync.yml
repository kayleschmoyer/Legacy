name: "Jira Branch Sync"

# Keeps Jira ticket statuses in sync with branch/PR activity.
# Only runs when there is actual activity on LS-* branches or their PRs —
# no unnecessary polling; each trigger is scoped to a real change.
#
# Transitions applied:
#   push to LS-*/...   (no open PR yet)  → In Progress
#   PR opened / reopened                 → In Review
#   PR closed + merged                   → Done
#   PR closed without merging            → In Progress
#
# Ticket key extraction (from branch/title/body, combined and deduped):
#   - Branch name — all LS-#### matches (e.g. LS-1234/description → LS-1234)
#   - PR title — all LS-#### matches (PR events only)
#   - PR body — only LS-#### matches preceded by a closing keyword on the same
#     line: closes/close/closed, fixes/fix/fixed, resolves/resolve/resolved,
#     completes/complete/completed (case-insensitive). Bare references such as
#     "unblocks LS-1791" or "blocked by LS-1791" are intentionally excluded to
#     prevent accidentally transitioning tickets that are merely mentioned.
#   All discovered keys are merged, normalized, sorted, and deduplicated
#   before transitions are applied.
#
# Multi-ticket branches (e.g. claude/ls818-wvV62) are supported via branch
# name and PR title/body parsing. Include all LS-#### keys in any of these
# locations to ensure every associated ticket is transitioned automatically.
#
# Independently of whether the child ticket transition succeeded or was
# skipped, the workflow also syncs the parent epic status (if any) based
# on the aggregate state of all its children:
#   Any child In Progress / In Review / Done  → Epic "In Progress"
#   All children In Review or Done            → Epic "In Review"
#   All children Done                         → Epic "Done"
#
# Epics with the Jira label "pinned-status" are excluded from automatic
# status transitions — they remain at whatever status was set manually.
#
# Authentication: Uses Atlassian OAuth 2.0 (client credentials grant).
# The JIRA_CREDENTIALS secret must be a JSON object:
#   {"client_id":"...","client_secret":"...","cloud_id":"..."}

on:
  push:
    branches:
      - "LS-*/**"
      - "LS-*/*"
      - "claude/**"
  pull_request:
    types: [opened, reopened, closed]

concurrency:
  group: jira-branch-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sync-jira:
    name: Sync Jira Ticket
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      # -----------------------------------------------------------------------
      # 1. Determine the branch name regardless of trigger type
      # -----------------------------------------------------------------------
      - name: Resolve branch name
        id: branch
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Branch: $BRANCH"

      # -----------------------------------------------------------------------
      # 2. Extract Jira ticket keys (LS-####) from branch name and PR metadata
      # -----------------------------------------------------------------------
      - name: Extract ticket keys
        id: ticket
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          BRANCH="${{ steps.branch.outputs.name }}"

          # Extract all LS-#### keys from branch name
          BRANCH_KEYS=$(echo "$BRANCH" | grep -oiP 'LS-\d+' | tr '[:lower:]' '[:upper:]' || true)

          # For PR events, also extract from PR title and body.
          # Title: all LS-#### matches (titles are terse and primary).
          # Body: only LS-#### matches preceded by a closing keyword on the same
          # line (closes/fixes/resolves/completes). Bare references such as
          # "unblocks LS-1791" are intentionally excluded to prevent accidentally
          # transitioning tickets that are merely mentioned.
          PR_KEYS=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TITLE_KEYS=$(echo "$PR_TITLE" | grep -oiP 'LS-\d+' | tr '[:lower:]' '[:upper:]' || true)
            BODY_KEYS=$(echo "$PR_BODY" \
              | grep -ioP '(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|complete[sd]?)\s+LS-\d+' \
              | grep -oiP 'LS-\d+' \
              | tr '[:lower:]' '[:upper:]' || true)
            PR_KEYS=$(printf '%s\n%s' "$TITLE_KEYS" "$BODY_KEYS")
          fi

          # Combine and deduplicate all keys
          ALL_KEYS=$(printf '%s\n%s' "$BRANCH_KEYS" "$PR_KEYS" \
            | grep -E '^LS-[0-9]+$' | sort -u | tr '\n' ' ' | xargs)

          if [[ -z "$ALL_KEYS" ]]; then
            echo "⏭️  No Jira ticket keys found in branch '$BRANCH' or PR metadata — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "keys=$ALL_KEYS" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Tickets: $ALL_KEYS"
          fi

      # -----------------------------------------------------------------------
      # 3. Determine the desired Jira transition name
      # -----------------------------------------------------------------------
      - name: Determine target status
        id: target
        if: steps.ticket.outputs.skip != 'true'
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          if [[ "$EVENT" == "push" ]]; then
            # Only transition to In Progress on push when the branch has no
            # associated open PR (GitHub sets GITHUB_BASE_REF for PRs; for
            # plain pushes it is empty).
            echo "transition=In Progress" >> "$GITHUB_OUTPUT"

          elif [[ "$EVENT" == "pull_request" ]]; then
            if [[ "$ACTION" == "opened" || "$ACTION" == "reopened" ]]; then
              echo "transition=In Review" >> "$GITHUB_OUTPUT"
            elif [[ "$ACTION" == "closed" && "$MERGED" == "true" ]]; then
              echo "transition=Done" >> "$GITHUB_OUTPUT"
            elif [[ "$ACTION" == "closed" && "$MERGED" != "true" ]]; then
              # PR was closed without merging — move ticket back to In Progress
              echo "transition=In Progress" >> "$GITHUB_OUTPUT"
            else
              echo "transition=" >> "$GITHUB_OUTPUT"
            fi
          fi

          echo "Transition: $(cat "$GITHUB_OUTPUT" | grep transition | cut -d= -f2-)"

      # -----------------------------------------------------------------------
      # 4. Skip if there is nothing to transition (e.g. PR synchronize)
      # -----------------------------------------------------------------------
      - name: Check if transition is needed
        id: guard
        if: steps.ticket.outputs.skip != 'true'
        run: |
          TARGET="${{ steps.target.outputs.transition }}"
          if [[ -z "$TARGET" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️  No transition needed for this event — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # -----------------------------------------------------------------------
      # 4b. Obtain Jira OAuth access token
      # -----------------------------------------------------------------------
      - name: Authenticate with Jira (OAuth 2.0)
        id: auth
        if: steps.ticket.outputs.skip != 'true' && steps.guard.outputs.skip != 'true'
        env:
          JIRA_CREDENTIALS: ${{ secrets.JIRA_CREDENTIALS }}
        run: |
          # Validate that JIRA_CREDENTIALS is set and is valid JSON before parsing.
          if [[ -z "$JIRA_CREDENTIALS" ]]; then
            echo "❌ JIRA_CREDENTIALS secret is not set."
            echo "   Expected a JSON object: {\"client_id\":\"...\",\"client_secret\":\"...\",\"cloud_id\":\"...\"}"
            exit 1
          fi

          if ! echo "$JIRA_CREDENTIALS" | jq empty 2>/dev/null; then
            echo "❌ JIRA_CREDENTIALS is not valid JSON."
            echo "   Expected format: {\"client_id\":\"...\",\"client_secret\":\"...\",\"cloud_id\":\"...\"}"
            echo "   Update the JIRA_CREDENTIALS repository secret with the correct JSON format."
            exit 1
          fi

          CLIENT_ID=$(echo "$JIRA_CREDENTIALS" | jq -r '.client_id')
          CLIENT_SECRET=$(echo "$JIRA_CREDENTIALS" | jq -r '.client_secret')
          CLOUD_ID=$(echo "$JIRA_CREDENTIALS" | jq -r '.cloud_id')

          if [[ -z "$CLIENT_ID" || "$CLIENT_ID" == "null" ]] || \
             [[ -z "$CLIENT_SECRET" || "$CLIENT_SECRET" == "null" ]] || \
             [[ -z "$CLOUD_ID" || "$CLOUD_ID" == "null" ]]; then
            echo "❌ JIRA_CREDENTIALS JSON is missing required fields."
            echo "   Required: client_id, client_secret, cloud_id"
            echo "   Got keys: $(echo "$JIRA_CREDENTIALS" | jq -r 'keys | join(", ")')"
            exit 1
          fi

          # Mask secrets
          echo "::add-mask::$CLIENT_SECRET"
          echo "::add-mask::$CLIENT_ID"

          # Exchange client credentials for an access token (use jq for JSON-safe encoding)
          TOKEN_REQUEST_JSON=$(jq -n \
            --arg client_id "$CLIENT_ID" \
            --arg client_secret "$CLIENT_SECRET" \
            '{grant_type:"client_credentials",client_id:$client_id,client_secret:$client_secret}')

          TOKEN_RESPONSE=$(curl -sf \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$TOKEN_REQUEST_JSON" \
            "https://auth.atlassian.com/oauth/token" \
            2>&1) || {
            echo "❌ Failed to obtain OAuth access token from Atlassian."
            echo "   Check that client_id and client_secret are valid."
            echo "   Response keys: $(echo "$TOKEN_RESPONSE" | jq -r 'keys | join(", ")' 2>/dev/null || echo '(non-JSON response)')"
            exit 1
          }

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token')

          if [[ -z "$ACCESS_TOKEN" || "$ACCESS_TOKEN" == "null" ]]; then
            echo "❌ OAuth token response did not contain an access_token."
            echo "   Response keys: $(echo "$TOKEN_RESPONSE" | jq -r 'keys | join(", ")')"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          echo "✅ OAuth access token obtained"

          # Export to GITHUB_ENV for subsequent steps
          JIRA_API_BASE="https://api.atlassian.com/ex/jira/$CLOUD_ID"
          {
            echo "JIRA_ACCESS_TOKEN=$ACCESS_TOKEN"
            echo "JIRA_API_BASE=$JIRA_API_BASE"
          } >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # 4c. Define reusable retry wrapper for Jira API calls
      # -----------------------------------------------------------------------
      - name: Define Jira API helper
        if: steps.ticket.outputs.skip != 'true' && steps.guard.outputs.skip != 'true'
        run: |
          # Write a reusable retry function to a sourceable script.
          # Retries 3 times with exponential backoff (2s, 4s, 8s).
          # Fails fast on 401/403 (auth errors). Retries on 429/5xx.
          cat > /tmp/jira-api.sh << 'FUNC_EOF'
          jira_api() {
            local METHOD="${1:-GET}"
            local URL="$2"
            local DATA="${3:-}"
            local MAX_RETRIES=3
            local RETRY_DELAY=2

            for attempt in $(seq 1 $MAX_RETRIES); do
              local CURL_ARGS=(
                -s -w "\n%{http_code}"
                --header "Authorization: Bearer $JIRA_ACCESS_TOKEN"
                --header "Accept: application/json"
                --connect-timeout 10
                --max-time 30
              )

              if [[ "$METHOD" == "POST" ]]; then
                CURL_ARGS+=(--request POST --header "Content-Type: application/json")
                if [[ -n "$DATA" ]]; then
                  CURL_ARGS+=(--data "$DATA")
                fi
              fi

              local RAW_RESPONSE
              RAW_RESPONSE=$(curl "${CURL_ARGS[@]}" "$URL" 2>&1) || true

              local HTTP_CODE
              HTTP_CODE=$(echo "$RAW_RESPONSE" | tail -1)
              local BODY
              BODY=$(echo "$RAW_RESPONSE" | head -n -1)

              # Success
              if [[ "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
                echo "$BODY"
                return 0
              fi

              # Auth errors — fail immediately, no point retrying
              if [[ "$HTTP_CODE" == "401" || "$HTTP_CODE" == "403" ]]; then
                echo "❌ Auth error (HTTP $HTTP_CODE) — not retrying" >&2
                echo "$BODY" >&2
                return 1
              fi

              # Rate limit — respect Retry-After if present
              if [[ "$HTTP_CODE" == "429" ]]; then
                local WAIT=$RETRY_DELAY
                local RETRY_AFTER
                RETRY_AFTER=$(echo "$BODY" | jq -r '.retryAfter // empty' 2>/dev/null || true)
                if [[ -n "$RETRY_AFTER" && "$RETRY_AFTER" =~ ^[0-9]+$ ]]; then
                  WAIT=$RETRY_AFTER
                fi
                echo "⚠️  Rate limited (429). Retry $attempt/$MAX_RETRIES in ${WAIT}s..." >&2
                sleep "$WAIT"
                RETRY_DELAY=$((RETRY_DELAY * 2))
                continue
              fi

              # Server errors (5xx) — retry with backoff
              if [[ "$HTTP_CODE" =~ ^5[0-9][0-9]$ ]]; then
                echo "⚠️  Server error (HTTP $HTTP_CODE). Retry $attempt/$MAX_RETRIES in ${RETRY_DELAY}s..." >&2
                sleep "$RETRY_DELAY"
                RETRY_DELAY=$((RETRY_DELAY * 2))
                continue
              fi

              # Other errors — fail
              echo "❌ Unexpected HTTP $HTTP_CODE" >&2
              echo "$BODY" >&2
              return 1
            done

            echo "❌ All $MAX_RETRIES retries exhausted" >&2
            return 1
          }
          FUNC_EOF
          echo "✅ Jira API retry helper defined"

      # -----------------------------------------------------------------------
      # 5. Transition all extracted ticket keys to the target status
      # -----------------------------------------------------------------------
      - name: Apply Jira transitions
        id: apply
        if: steps.ticket.outputs.skip != 'true' && steps.guard.outputs.skip != 'true'
        env:
          KEYS: ${{ steps.ticket.outputs.keys }}
          TARGET: ${{ steps.target.outputs.transition }}
        run: |
          source /tmp/jira-api.sh

          FAILED_TICKETS=""
          for TICKET in $KEYS; do
            echo "--- $TICKET → $TARGET ---"

            RESPONSE=$(jira_api GET "$JIRA_API_BASE/rest/api/3/issue/$TICKET/transitions") || {
              echo "❌ Failed to fetch transitions for $TICKET"
              FAILED_TICKETS="$FAILED_TICKETS $TICKET"
              continue
            }

            TRANSITION_ID=$(echo "$RESPONSE" | jq -r --arg t "$TARGET" \
              '.transitions[] | select(.name == $t) | .id' | head -1)

            if [[ -z "$TRANSITION_ID" ]]; then
              echo "⚠️  Transition '$TARGET' is not available for $TICKET."
              echo "Available: $(echo "$RESPONSE" | jq -r '[.transitions[].name] | join(", ")')"
              continue
            fi

            if jira_api POST "$JIRA_API_BASE/rest/api/3/issue/$TICKET/transitions" \
              "{\"transition\":{\"id\":\"$TRANSITION_ID\"}}" > /dev/null; then
              echo "✅ $TICKET → $TARGET"
            else
              echo "❌ Failed to transition $TICKET to '$TARGET' after retries"
              FAILED_TICKETS="$FAILED_TICKETS $TICKET"
            fi
          done

          if [[ -n "$FAILED_TICKETS" ]]; then
            echo "❌ Some tickets failed to transition:$FAILED_TICKETS"
            exit 1
          fi

      # -----------------------------------------------------------------------
      # 6. Sync parent epics for all transitioned tickets
      # -----------------------------------------------------------------------
      - name: Sync parent epics
        if: steps.ticket.outputs.skip != 'true' && steps.guard.outputs.skip != 'true'
        env:
          KEYS: ${{ steps.ticket.outputs.keys }}
        run: |
          source /tmp/jira-api.sh

          # Collect unique parent epic keys across all tickets
          EPIC_KEYS=""
          for TICKET in $KEYS; do
            RESPONSE=$(jira_api GET "$JIRA_API_BASE/rest/api/3/issue/$TICKET?fields=parent") || {
              echo "⚠️  Could not fetch ticket $TICKET details — skipping epic sync for this ticket."
              continue
            }

            PARENT_KEY=$(echo "$RESPONSE" | jq -r '.fields.parent.key // empty')
            PARENT_TYPE=$(echo "$RESPONSE" | jq -r '.fields.parent.fields.issuetype.name // empty')

            if [[ -z "$PARENT_KEY" ]]; then
              echo "ℹ️  $TICKET has no parent — skipping."
            elif [[ "$PARENT_TYPE" != "Epic" ]]; then
              echo "ℹ️  $TICKET parent ($PARENT_KEY) is type '$PARENT_TYPE', not Epic — skipping."
            else
              EPIC_KEYS=$(printf '%s\n%s' "$EPIC_KEYS" "$PARENT_KEY" | grep -v '^$' | sort -u)
              echo "Parent epic for $TICKET: $PARENT_KEY"
            fi
          done

          if [[ -z "$EPIC_KEYS" ]]; then
            echo "ℹ️  No parent epics found — skipping epic sync."
            exit 0
          fi

          # Debounce: when a parent PR merges, the merge queue retargets
          # dependent PRs to main. This fires new pull_request events,
          # triggering concurrent jira-branch-sync runs. Both the parent's
          # "Done" transition and the child's "In Review" transition race
          # to recalculate epic status simultaneously. A short delay lets
          # concurrent ticket transitions settle before we read children.
          echo "⏳ Waiting 10s for concurrent ticket transitions to settle..."
          sleep 10

          # Sync each unique parent epic
          for EPIC_KEY in $EPIC_KEYS; do
            echo "--- Syncing epic $EPIC_KEY ---"

            # Check for pinned-status label
            LABEL_RESPONSE=$(jira_api GET "$JIRA_API_BASE/rest/api/3/issue/$EPIC_KEY?fields=labels") || {
              echo "⚠️  Could not fetch labels for $EPIC_KEY — proceeding with sync."
              LABEL_RESPONSE=""
            }
            LABELS=$(echo "$LABEL_RESPONSE" | jq -r '.fields.labels[]? // empty' 2>/dev/null || true)

            if echo "$LABELS" | grep -qx "pinned-status"; then
              echo "🔒 Epic $EPIC_KEY has 'pinned-status' label — skipping auto-sync."
              continue
            fi

            # Fetch all children of the epic via JQL search (paginated)
            ENCODED_JQL=$(echo -n "parent=$EPIC_KEY" | jq -sRr @uri)
            ALL_STATUSES=""
            START_AT=0
            PAGE_SIZE=200
            TOTAL=0

            while true; do
              CHILD_RESPONSE=$(jira_api GET "$JIRA_API_BASE/rest/api/3/search?jql=$ENCODED_JQL&fields=status&maxResults=$PAGE_SIZE&startAt=$START_AT") || {
                echo "⚠️  Could not fetch children of $EPIC_KEY — skipping epic sync."
                break
              }

              TOTAL=$(echo "$CHILD_RESPONSE" | jq -r '.total')
              PAGE_STATUSES=$(echo "$CHILD_RESPONSE" | jq -r '.issues[].fields.status.name')
              FETCHED=$(echo "$CHILD_RESPONSE" | jq -r '.issues | length')

              ALL_STATUSES=$(printf '%s\n%s' "$ALL_STATUSES" "$PAGE_STATUSES" | grep -v '^$')

              START_AT=$((START_AT + FETCHED))
              if [[ "$START_AT" -ge "$TOTAL" ]]; then
                break
              fi
            done

            if [[ "$TOTAL" == "0" ]]; then
              echo "ℹ️  Epic $EPIC_KEY has no children — skipping."
              continue
            fi

            echo "Children ($TOTAL):"
            echo "$ALL_STATUSES" | sort | uniq -c

            # Classify aggregate status
            ALL_DONE=true
            ALL_REVIEW_OR_DONE=true
            ANY_ACTIVE=false

            while IFS= read -r STATUS; do
              [[ -z "$STATUS" ]] && continue
              case "$STATUS" in
                "Done")
                  ANY_ACTIVE=true
                  ;;
                "In Review")
                  ANY_ACTIVE=true
                  ALL_DONE=false
                  ;;
                "In Progress")
                  ANY_ACTIVE=true
                  ALL_DONE=false
                  ALL_REVIEW_OR_DONE=false
                  ;;
                *)
                  # Any other status (To Do, Backlog, etc.)
                  ALL_DONE=false
                  ALL_REVIEW_OR_DONE=false
                  ;;
              esac
            done <<< "$ALL_STATUSES"

            if [[ "$ALL_DONE" == "true" ]]; then
              EPIC_TARGET="Done"
            elif [[ "$ALL_REVIEW_OR_DONE" == "true" ]]; then
              EPIC_TARGET="In Review"
            elif [[ "$ANY_ACTIVE" == "true" ]]; then
              EPIC_TARGET="In Progress"
            else
              echo "ℹ️  No children are active yet — epic $EPIC_KEY stays as-is."
              continue
            fi

            # Skip if epic is already at the target status
            CURRENT_RESPONSE=$(jira_api GET "$JIRA_API_BASE/rest/api/3/issue/$EPIC_KEY?fields=status") || {
              echo "⚠️  Could not fetch epic $EPIC_KEY status — skipping."
              continue
            }

            CURRENT=$(echo "$CURRENT_RESPONSE" | jq -r '.fields.status.name')
            echo "Epic $EPIC_KEY is currently: $CURRENT (target: $EPIC_TARGET)"

            if [[ "$CURRENT" == "$EPIC_TARGET" ]]; then
              echo "ℹ️  Epic already at '$EPIC_TARGET' — no transition needed."
              continue
            fi

            # Fetch available transitions and apply (non-fatal — epic sync is best-effort)
            TRANS_RESPONSE=$(jira_api GET "$JIRA_API_BASE/rest/api/3/issue/$EPIC_KEY/transitions") || {
              echo "⚠️  Could not fetch transitions for $EPIC_KEY — skipping."
              continue
            }

            TRANSITION_ID=$(echo "$TRANS_RESPONSE" | jq -r --arg t "$EPIC_TARGET" \
              '.transitions[] | select(.name == $t) | .id' | head -1)

            if [[ -z "$TRANSITION_ID" ]]; then
              echo "⚠️  Transition '$EPIC_TARGET' not available for epic $EPIC_KEY."
              echo "Available: $(echo "$TRANS_RESPONSE" | jq -r '[.transitions[].name] | join(", ")')"
              continue
            fi

            jira_api POST "$JIRA_API_BASE/rest/api/3/issue/$EPIC_KEY/transitions" \
              "{\"transition\":{\"id\":\"$TRANSITION_ID\"}}" > /dev/null && \
              echo "✅ Epic $EPIC_KEY → $EPIC_TARGET" || \
              echo "⚠️  Failed to transition epic $EPIC_KEY to '$EPIC_TARGET' after retries"
          done
