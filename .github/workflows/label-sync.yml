name: Label Sync

# Keeps GitHub labels in sync with .github/labels.yml (source of truth).
# Fires on push to main when the file changes, or on manual dispatch.
# Sync is exhaustive: labels not listed in the file are deleted from the repo.

on:
  push:
    branches: [main]
    paths:
      - ".github/labels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync labels
    # Guard against workflow_dispatch from non-main branches mutating repo-wide labels
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Sync labels from .github/labels.yml
        # TODO(LS-4140): re-pin to a tagged release once upstream cuts v2.3.4+.
        # Currently pinned to a post-v2.3.3 main commit because upstream merged
        # Node 24 support (PR #316) but has not published a new tag yet.
        uses: EndBug/label-sync@1cd399a63f3d27e0a890cec8d1c29efad3e5db3d # main (post-v2.3.3, node24)
        with:
          config-file: .github/labels.yml
          delete-other-labels: true
          token: ${{ secrets.GITHUB_TOKEN }}
