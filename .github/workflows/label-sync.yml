name: Label Sync

# Keeps GitHub labels in sync with .github/labels.yml (source of truth).
# Fires on push to main when the file changes, or on manual dispatch.
# Sync is exhaustive: labels not listed in the file are deleted from the repo.

on:
  push:
    branches: [main]
    paths:
      - ".github/labels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync labels
    # Guard against workflow_dispatch from non-main branches mutating repo-wide labels
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Sync labels from .github/labels.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/sync-labels.py .github/labels.yml

      - name: Annotate summary on sync failure
        if: failure()
        run: |
          {
            echo '## ⚠️ Labels not synced — manual intervention required'
            echo ''
            echo 'The label sync step failed. Check the step logs above for error details.'
            echo ''
            echo 'Once the issue is resolved, re-trigger with:'
            echo '```'
            echo 'gh workflow run label-sync.yml'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
