name: "Jira Status Audit"

# Detects and repairs drift between Jira ticket statuses and GitHub PR
# states, and audits epic statuses against their children's aggregate state.
#
# PR audit (declared-ticket-linkage RFC §4, LS-7897): reads each PR's
# declared `<!-- jira-link -->` marker via tools/jira-sync (PR-title key
# fallback for pre-marker PRs, branch-name fallback for pre-convention
# PRs), computes the expected Jira status from the PR state
# (merged → Done, open draft → In Progress, open ready → In Review), and
# auto-repairs drift. Repairs are forward-only: the monotonic guard is
# consulted with a non-pull_request event, under which downgrades are
# never permitted; anything the guard refuses gets the jira-mismatch
# label plus a comment stating the proposed action.
#
# Dry-run by default: auto-repair writes are gated on the repo var
# JIRA_AUDIT_AUTO_REPAIR being 'true'. Until then, allowed repairs are
# labeled with the proposed action instead of applied (per the RFC open
# question — flip the var after a clean week of dry-run proposals).
#
# Epic audit: applies rollup logic (same as jira-branch-sync.yml) to all
# epics — recalculates expected status from children and transitions.
# Done epics are included so they can be demoted when a child is reopened.
#
# Jira sync is one-directional (GitHub → Jira). If someone manually changes
# a ticket status in Jira, GitHub PRs remain unaware. Similarly, epics can
# drift out of sync when children are transitioned outside of PR activity.
#
# Triggering via Jira webhook:
#   For near-real-time audits, configure Jira to call the
#   /github-webhook/jira Lambda route on issue transitions. That route
#   validates the Jira request (X-Jira-Webhook-Secret header) and fires
#   the repository_dispatch event to GitHub.
#
#   This fires the audit immediately when a ticket is manually transitioned
#   in Jira, rather than waiting for the weekly backstop cron.
#
#   Direct POSTs to GitHub's /dispatches endpoint are also supported, but
#   the sender login must be in the JIRA_DISPATCH_ALLOWED_SENDERS repo var
#   to pass the Verify dispatch sender allowlist check.
#
# Authentication: Uses Atlassian OAuth 2.0 (client credentials grant).

on:
  repository_dispatch:
    types: [jira-issue-updated]
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 06:00 UTC (backstop for webhook gaps)
  workflow_dispatch:

# Debounce rapid-fire dispatch events (e.g. Jira bulk transitions / retries).
# Only the most recent event matters — cancel any in-progress run.
concurrency:
  group: jira-status-audit
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    name: Audit Jira ↔ GitHub Status
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      # Guard against unauthorized repository_dispatch callers.
      # The dispatch endpoint requires a PAT or GitHub App token with repo scope,
      # but any collaborator with that access could trigger this workflow and gain
      # access to JIRA_CREDENTIALS and PR write permissions. Allowlist the expected
      # sender logins (the dedicated Jira automation bot/GitHub App). Scheduled and
      # manual runs are not subject to this check.
      - name: Verify dispatch sender
        if: github.event_name == 'repository_dispatch'
        env:
          SENDER: ${{ github.event.sender.login }}
          # Comma-separated list of allowed senders (GitHub App/bot logins).
          # Update JIRA_DISPATCH_ALLOWED_SENDERS in repo vars to add/remove bots.
          # Include both the GitHub App bot login ([bot] suffix) and the
          # machine-user login (no suffix) since fine-grained PATs owned by
          # a machine user appear without the [bot] suffix in sender.login.
          ALLOWED: ${{ vars.JIRA_DISPATCH_ALLOWED_SENDERS || 'legacy-sports-review-bot,legacy-sports-review-bot[bot]' }}
        run: |
          IFS=',' read -ra ALLOWED_LOGINS <<< "$ALLOWED"
          for login in "${ALLOWED_LOGINS[@]}"; do
            login="${login// /}"  # trim whitespace
            if [[ "$SENDER" == "$login" ]]; then
              echo "✅ Authorized dispatch sender: $SENDER"
              exit 0
            fi
          done
          echo "::error::Unauthorized repository_dispatch sender: '$SENDER'. Allowed: $ALLOWED"
          exit 1

      # The audit only ever runs from the default branch (schedule /
      # repository_dispatch / workflow_dispatch), so this checks out the
      # same commit the workflow file came from — the jira-sync engine and
      # this workflow always move together.
      - name: Checkout (workflow context + jira-sync engine)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          sparse-checkout: |
            .github
            tools/jira-sync
          sparse-checkout-cone-mode: true

      - name: Authenticate with Jira (OAuth 2.0)
        id: auth
        env:
          JIRA_CREDENTIALS: ${{ secrets.JIRA_CREDENTIALS }}
        run: |
          if [[ -z "$JIRA_CREDENTIALS" ]]; then
            echo "::warning::JIRA_CREDENTIALS not set — skipping audit"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CLIENT_ID=$(echo "$JIRA_CREDENTIALS" | jq -r '.client_id')
          CLIENT_SECRET=$(echo "$JIRA_CREDENTIALS" | jq -r '.client_secret')
          CLOUD_ID=$(echo "$JIRA_CREDENTIALS" | jq -r '.cloud_id')

          echo "::add-mask::$CLIENT_SECRET"
          echo "::add-mask::$CLIENT_ID"

          TOKEN_RESPONSE=$(curl -sf \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$(jq -n --arg id "$CLIENT_ID" --arg secret "$CLIENT_SECRET" \
              '{grant_type:"client_credentials",client_id:$id,client_secret:$secret}')" \
            "https://auth.atlassian.com/oauth/token" 2>&1) || {
            echo "::warning::Failed to obtain Jira OAuth token — skipping audit"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token')
          echo "::add-mask::$ACCESS_TOKEN"

          {
            echo "JIRA_ACCESS_TOKEN=$ACCESS_TOKEN"
            echo "JIRA_API_BASE=https://api.atlassian.com/ex/jira/$CLOUD_ID"
          } >> "$GITHUB_ENV"

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "✅ Jira authenticated"

      # -------------------------------------------------------------------
      # Define reusable retry wrapper for Jira API calls
      # -------------------------------------------------------------------
      - name: Define Jira API helper
        if: steps.auth.outputs.skip != 'true'
        run: |
          cat > /tmp/jira-api.sh << 'FUNC_EOF'
          jira_api() {
            local METHOD="${1:-GET}"
            local URL="$2"
            local DATA="${3:-}"
            local MAX_RETRIES=3
            local RETRY_DELAY=2
            local TMP_BODY
            TMP_BODY=$(mktemp)
            # shellcheck disable=SC2064
            trap "rm -f '$TMP_BODY'" RETURN

            for attempt in $(seq 1 $MAX_RETRIES); do
              local CURL_ARGS=(
                -sS -o "$TMP_BODY" -w '%{http_code}'
                --header "Authorization: Bearer $JIRA_ACCESS_TOKEN"
                --header "Accept: application/json"
                --connect-timeout 10
                --max-time 30
              )

              if [[ "$METHOD" == "POST" ]]; then
                CURL_ARGS+=(--request POST --header "Content-Type: application/json")
                if [[ -n "$DATA" ]]; then
                  CURL_ARGS+=(--data "$DATA")
                fi
              fi

              local HTTP_CODE
              HTTP_CODE=$(curl "${CURL_ARGS[@]}" "$URL" 2>/dev/null) || {
                echo "❌ curl transport error for $URL" >&2
                sleep "$RETRY_DELAY"
                RETRY_DELAY=$((RETRY_DELAY * 2))
                continue
              }

              local BODY
              BODY=$(cat "$TMP_BODY")

              if [[ "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
                echo "$BODY"
                return 0
              fi

              if [[ "$HTTP_CODE" == "401" || "$HTTP_CODE" == "403" ]]; then
                echo "❌ Auth error (HTTP $HTTP_CODE) — not retrying" >&2
                echo "$BODY" >&2
                return 1
              fi

              if [[ "$HTTP_CODE" == "429" ]]; then
                local WAIT=$RETRY_DELAY
                local RETRY_AFTER
                RETRY_AFTER=$(echo "$BODY" | jq -r '.retryAfter // empty' 2>/dev/null || true)
                if [[ -n "$RETRY_AFTER" && "$RETRY_AFTER" =~ ^[0-9]+$ ]]; then
                  WAIT=$RETRY_AFTER
                fi
                echo "⚠️  Rate limited (429). Retry $attempt/$MAX_RETRIES in ${WAIT}s..." >&2
                sleep "$WAIT"
                RETRY_DELAY=$((RETRY_DELAY * 2))
                continue
              fi

              if [[ "$HTTP_CODE" =~ ^5[0-9][0-9]$ ]]; then
                echo "⚠️  Server error (HTTP $HTTP_CODE). Retry $attempt/$MAX_RETRIES in ${RETRY_DELAY}s..." >&2
                sleep "$RETRY_DELAY"
                RETRY_DELAY=$((RETRY_DELAY * 2))
                continue
              fi

              echo "❌ Unexpected HTTP $HTTP_CODE" >&2
              echo "$BODY" >&2
              return 1
            done

            echo "❌ All $MAX_RETRIES retries exhausted" >&2
            return 1
          }
          FUNC_EOF
          echo "✅ Jira API retry helper defined"

      # -------------------------------------------------------------------
      # Audit PR ↔ Jira Status (marker-first, forward-only auto-repair)
      #
      # Scans open PRs plus recently merged PRs (the two observed drift
      # classes: open-PR tickets demoted to In Progress, merged-PR tickets
      # stuck In Progress). Key + expected status come from
      # `tools/jira-sync audit`; repairs go through the monotonic guard.
      # -------------------------------------------------------------------
      - name: Audit PR ↔ Jira Status
        id: pr-audit
        if: steps.auth.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_REPAIR: ${{ vars.JIRA_AUDIT_AUTO_REPAIR || 'false' }}
        run: |
          source /tmp/jira-api.sh
          echo "🔍 Fetching open PRs and recently merged PRs..."

          # Fail closed: anything other than the literal 'true' means dry-run.
          if [[ "$AUTO_REPAIR" != "true" ]]; then
            AUTO_REPAIR=false
          fi

          # gh pr list paginates the GitHub API internally (pages of 100) up
          # to --limit, so no manual cursor handling is needed below the cap.
          # A cap hit is made loud (::warning + step summary) instead of
          # silently truncating the audit.
          FIELDS="number,title,body,isDraft,headRefName,state,labels"
          LIMIT=500
          OPEN_PRS=$(gh pr list --state open --json "$FIELDS" --limit "$LIMIT")
          MERGED_SINCE=$(date -u -d '14 days ago' +%Y-%m-%d)
          MERGED_PRS=$(gh pr list --state merged --search "merged:>=$MERGED_SINCE" --json "$FIELDS" --limit "$LIMIT")

          CAPPED=""
          if [[ "$(echo "$OPEN_PRS" | jq 'length')" -ge "$LIMIT" ]]; then
            echo "::warning::open-PR list hit the $LIMIT cap — some open PRs were not audited; raise LIMIT in jira-status-audit.yml"
            CAPPED="$CAPPED open"
          fi
          if [[ "$(echo "$MERGED_PRS" | jq 'length')" -ge "$LIMIT" ]]; then
            echo "::warning::merged-PR list hit the $LIMIT cap — some merged PRs were not audited; raise LIMIT or shorten the merged window"
            CAPPED="$CAPPED merged"
          fi

          # Open PRs first: when a ticket has both an open PR and an older
          # merged PR, the open PR's expectation wins (see SEEN_KEYS below).
          # Use temp files to avoid ARG_MAX limits when PR lists are large.
          OPEN_FILE=$(mktemp)
          MERGED_FILE=$(mktemp)
          printf '%s' "$OPEN_PRS" > "$OPEN_FILE"
          printf '%s' "$MERGED_PRS" > "$MERGED_FILE"
          PRS=$(jq -c -s '.[0] + .[1]' "$OPEN_FILE" "$MERGED_FILE")
          rm -f "$OPEN_FILE" "$MERGED_FILE"
          TOTAL=$(echo "$PRS" | jq 'length')
          echo "Scanning $TOTAL PRs (open + merged since $MERGED_SINCE), auto-repair: $AUTO_REPAIR"

          SKIPPED=0
          IN_SYNC=0
          REPAIRED=0
          PROPOSED=0
          REFUSED=0
          ERRORS=0
          LABELS_CLEARED=0
          DRIFT_LOG=""
          declare -A SEEN_KEYS

          PR_FILE=$(mktemp)
          while read -r PR; do
            printf '%s' "$PR" > "$PR_FILE"
            NUMBER=$(echo "$PR" | jq -r '.number')

            AUDIT=$(node tools/jira-sync/src/cli.js audit --pr-file "$PR_FILE") || {
              echo "  ⚠️  PR #$NUMBER: audit planning failed — skipping"
              ERRORS=$((ERRORS + 1))
              continue
            }

            if [[ "$(echo "$AUDIT" | jq -r '.skip')" == "true" ]]; then
              echo "  ⏭️  PR #$NUMBER: $(echo "$AUDIT" | jq -r '.reason')"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            KEY=$(echo "$AUDIT" | jq -r '.key')
            EXPECTED=$(echo "$AUDIT" | jq -r '.expected')
            SOURCE=$(echo "$AUDIT" | jq -r '.source')

            # One verdict per ticket: the first PR declaring a key wins, and
            # open PRs are processed before merged ones.
            if [[ -n "${SEEN_KEYS[$KEY]:-}" ]]; then
              echo "  ⏭️  PR #$NUMBER: $KEY already audited via PR #${SEEN_KEYS[$KEY]} — skipping"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            SEEN_KEYS[$KEY]=$NUMBER

            JIRA_RESPONSE=$(jira_api GET "$JIRA_API_BASE/rest/api/3/issue/$KEY?fields=status") || {
              echo "  ⚠️  PR #$NUMBER: could not fetch $KEY — skipping"
              ERRORS=$((ERRORS + 1))
              continue
            }
            CURRENT=$(echo "$JIRA_RESPONSE" | jq -r '.fields.status.name')

            # Check label presence from already-fetched PR data (no extra API call needed).
            HAS_LABEL=$(echo "$PR" | jq -r '[.labels[].name] | map(select(. == "jira-mismatch")) | length // 0')
            HAS_LABEL_BOOL=false
            if [[ "$HAS_LABEL" != "0" ]]; then
              HAS_LABEL_BOOL=true
            fi

            # Repairs are forward-only: the guard sees a non-pull_request
            # event (schedule / repository_dispatch / workflow_dispatch),
            # under which no downgrade is ever permitted. In-sync tickets
            # short-circuit past the guard.
            ALLOWED=false
            GUARD_REASON=""
            if [[ "$CURRENT" != "$EXPECTED" ]]; then
              GUARD=$(node tools/jira-sync/src/cli.js guard \
                --current "$CURRENT" \
                --target "$EXPECTED" \
                --event-name "$GITHUB_EVENT_NAME")
              ALLOWED=$(echo "$GUARD" | jq -r '.allowed')
              GUARD_REASON=$(echo "$GUARD" | jq -r '.reason')
            fi

            # All label/repair branching is decided by the unit-tested
            # engine (tools/jira-sync decideAuditAction); this loop only
            # executes the returned actions.
            ACTION_JSON=$(node tools/jira-sync/src/cli.js audit-action \
              --current "$CURRENT" --expected "$EXPECTED" \
              --guard-allowed "$ALLOWED" --auto-repair "$AUTO_REPAIR" \
              --has-label "$HAS_LABEL_BOOL")
            ACTION=$(echo "$ACTION_JSON" | jq -r '.action')
            ADD_LABEL=$(echo "$ACTION_JSON" | jq -r '.addLabel')
            REMOVE_LABEL=$(echo "$ACTION_JSON" | jq -r '.removeLabel')

            if [[ "$ACTION" == "in-sync" ]]; then
              IN_SYNC=$((IN_SYNC + 1))
              if [[ "$REMOVE_LABEL" == "true" ]]; then
                gh pr edit "$NUMBER" --remove-label "jira-mismatch" 2>/dev/null || true
                LABELS_CLEARED=$((LABELS_CLEARED + 1))
                echo "  ✅ PR #$NUMBER ($KEY): drift resolved, label removed"
              fi
              continue
            fi

            echo "  ❌ PR #$NUMBER ($KEY via $SOURCE): Jira='$CURRENT', expected='$EXPECTED'"

            if [[ "$ACTION" == "repair" ]]; then
              TRANS_RESPONSE=$(jira_api GET "$JIRA_API_BASE/rest/api/3/issue/$KEY/transitions") || {
                echo "     ⚠️  could not fetch transitions for $KEY"
                ERRORS=$((ERRORS + 1))
                continue
              }
              TRANSITION_ID=$(echo "$TRANS_RESPONSE" | jq -r --arg t "$EXPECTED" \
                '.transitions[] | select(.name == $t or .to.name == $t) | .id' | head -1)
              if [[ -z "$TRANSITION_ID" ]]; then
                echo "     ⚠️  transition '$EXPECTED' not available for $KEY"
                ERRORS=$((ERRORS + 1))
                continue
              fi
              if jira_api POST "$JIRA_API_BASE/rest/api/3/issue/$KEY/transitions" \
                "{\"transition\":{\"id\":\"$TRANSITION_ID\"}}" > /dev/null; then
                echo "     ✅ repaired: $KEY '$CURRENT' → '$EXPECTED'"
                REPAIRED=$((REPAIRED + 1))
                DRIFT_LOG="${DRIFT_LOG}"$'\n'"| #$NUMBER | $KEY | $CURRENT | $EXPECTED | repaired |"
                # removeLabel is applied only after the transition succeeded.
                if [[ "$REMOVE_LABEL" == "true" ]]; then
                  gh pr edit "$NUMBER" --remove-label "jira-mismatch" 2>/dev/null || true
                fi
              else
                echo "     ❌ failed to transition $KEY after retries"
                ERRORS=$((ERRORS + 1))
              fi
              continue
            fi

            # Dry-run proposal or guard-refused drift: jira-mismatch label
            # plus a comment stating the proposed action.
            if [[ "$ACTION" == "propose" ]]; then
              VERDICT="proposed (dry-run)"
              DETAIL="The audit would transition **${KEY}** \`${CURRENT}\` → \`${EXPECTED}\`,"
              DETAIL+=" but auto-repair is in its dry-run period"
              DETAIL+=" (repo var \`JIRA_AUDIT_AUTO_REPAIR\` is not \`true\`)."
              PROPOSED=$((PROPOSED + 1))
            else
              VERDICT="guard-refused"
              DETAIL="The audit proposes transitioning **${KEY}** \`${CURRENT}\` → \`${EXPECTED}\`,"
              DETAIL+=" but the monotonic guard refuses (${GUARD_REASON})."
              DETAIL+=" Manual review needed — automation never moves tickets backward."
              REFUSED=$((REFUSED + 1))
            fi
            DRIFT_LOG="${DRIFT_LOG}"$'\n'"| #$NUMBER | $KEY | $CURRENT | $EXPECTED | $VERDICT |"

            if [[ "$ADD_LABEL" == "true" ]]; then
              gh pr edit "$NUMBER" --add-label "jira-mismatch" 2>/dev/null || true
              COMMENT_BODY_FILE=$(mktemp)
              cat > "$COMMENT_BODY_FILE" <<COMMENT_EOF
          ⚠️ **Jira Status Mismatch**

          ${DETAIL}

          _Detected by the Jira Status Audit workflow._
          COMMENT_EOF
              gh pr comment "$NUMBER" --body-file "$COMMENT_BODY_FILE" 2>/dev/null || true
              rm -f "$COMMENT_BODY_FILE"
            fi
          done < <(echo "$PRS" | jq -c '.[]')
          rm -f "$PR_FILE"

          echo ""
          echo "## 🔍 PR Status Audit" >> $GITHUB_STEP_SUMMARY
          echo "- **PRs scanned**: $TOTAL (open + merged since $MERGED_SINCE)" >> $GITHUB_STEP_SUMMARY
          echo "- **Auto-repair enabled**: $AUTO_REPAIR" >> $GITHUB_STEP_SUMMARY
          echo "- **In sync**: $IN_SYNC" >> $GITHUB_STEP_SUMMARY
          echo "- **Repaired**: $REPAIRED" >> $GITHUB_STEP_SUMMARY
          echo "- **Proposed (dry-run)**: $PROPOSED" >> $GITHUB_STEP_SUMMARY
          echo "- **Guard-refused**: $REFUSED" >> $GITHUB_STEP_SUMMARY
          echo "- **Skipped (no declared ticket / duplicate key)**: $SKIPPED" >> $GITHUB_STEP_SUMMARY
          echo "- **Stale labels cleared**: $LABELS_CLEARED" >> $GITHUB_STEP_SUMMARY
          if [[ "$ERRORS" -gt 0 ]]; then
            echo "- **Errors**: $ERRORS" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ -n "$CAPPED" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **List cap hit** ($LIMIT) for:$CAPPED — some PRs were not audited. Raise LIMIT in jira-status-audit.yml." >> $GITHUB_STEP_SUMMARY
          fi

          if [[ -n "$DRIFT_LOG" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Drift detected" >> $GITHUB_STEP_SUMMARY
            echo "| PR | Ticket | Was | Expected | Action |" >> $GITHUB_STEP_SUMMARY
            echo "|----|--------|-----|----------|--------|" >> $GITHUB_STEP_SUMMARY
            printf '%s\n' "$DRIFT_LOG" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ All PR ↔ Jira statuses match." >> $GITHUB_STEP_SUMMARY
          fi

      # -------------------------------------------------------------------
      # Audit Epic rollup status
      #
      # Applies the same rollup logic as jira-branch-sync.yml:
      #   All children Done                         → Epic "Done"
      #   All children In Review or Done            → Epic "In Review"
      #   Any child In Progress or In Review        → Epic "In Progress"
      #   No children active (all To Do / Backlog / Done-only) → no change
      #
      # Epics with the "pinned-status" Jira label are excluded.
      # -------------------------------------------------------------------
      - name: Audit Epic Rollup Status
        id: epic-audit
        if: steps.auth.outputs.skip != 'true'
        run: |
          source /tmp/jira-api.sh
          echo ""
          echo "🔍 Auditing epic rollup statuses..."

          # Fetch all epics in the LS project (paginated).
          # We include Done epics so the audit can demote a Done epic back to
          # In Progress / In Review when a child is reopened (LS-4683).
          ENCODED_JQL=$(echo -n 'project = LS AND issuetype = Epic' | jq -sRr @uri)
          ALL_EPICS="[]"
          START_AT=0
          PAGE_SIZE=100

          while true; do
            RESPONSE=$(jira_api GET "$JIRA_API_BASE/rest/api/3/search?jql=$ENCODED_JQL&fields=status,labels,summary&maxResults=$PAGE_SIZE&startAt=$START_AT") || {
              echo "❌ Failed to fetch epics — skipping epic audit"
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "## 🏛️ Epic Rollup Audit" >> $GITHUB_STEP_SUMMARY
              echo "❌ Failed to fetch epics from Jira." >> $GITHUB_STEP_SUMMARY
              exit 0
            }

            TOTAL=$(echo "$RESPONSE" | jq -r '.total')
            FETCHED=$(echo "$RESPONSE" | jq -r '.issues | length')
            PAGE_ISSUES=$(echo "$RESPONSE" | jq -c '.issues')
            ALL_EPICS=$(echo "$ALL_EPICS $PAGE_ISSUES" | jq -s '.[0] + .[1]')

            START_AT=$((START_AT + FETCHED))
            if [[ "$START_AT" -ge "$TOTAL" ]]; then
              break
            fi
          done

          EPIC_COUNT=$(echo "$ALL_EPICS" | jq 'length')
          echo "Found $EPIC_COUNT epics"

          TRANSITIONED=0
          SKIPPED_PINNED=0
          ALREADY_CORRECT=0
          NO_ACTIVE_CHILDREN=0
          ERRORS=0
          TRANSITION_LOG=""

          for i in $(seq 0 $((EPIC_COUNT - 1))); do
            EPIC=$(echo "$ALL_EPICS" | jq -c ".[$i]")
            EPIC_KEY=$(echo "$EPIC" | jq -r '.key')
            EPIC_STATUS=$(echo "$EPIC" | jq -r '.fields.status.name')
            EPIC_SUMMARY=$(echo "$EPIC" | jq -r '.fields.summary')
            EPIC_LABELS=$(echo "$EPIC" | jq -r '.fields.labels[]?' 2>/dev/null || true)

            # Skip pinned epics
            if echo "$EPIC_LABELS" | grep -qx "pinned-status"; then
              echo "  🔒 $EPIC_KEY: pinned — skipping"
              SKIPPED_PINNED=$((SKIPPED_PINNED + 1))
              continue
            fi

            # Fetch all children (paginated)
            CHILD_JQL=$(echo -n "parent=$EPIC_KEY" | jq -sRr @uri)
            ALL_STATUSES=""
            CHILD_START=0
            CHILD_TOTAL=0
            CHILD_FETCH_FAILED=false

            while true; do
              CHILD_RESPONSE=$(jira_api GET "$JIRA_API_BASE/rest/api/3/search?jql=$CHILD_JQL&fields=status&maxResults=200&startAt=$CHILD_START") || {
                echo "  ⚠️  $EPIC_KEY: could not fetch children — skipping"
                ERRORS=$((ERRORS + 1))
                CHILD_FETCH_FAILED=true
                break
              }

              CHILD_TOTAL=$(echo "$CHILD_RESPONSE" | jq -r '.total')
              PAGE_STATUSES=$(echo "$CHILD_RESPONSE" | jq -r '.issues[].fields.status.name')
              CHILD_FETCHED=$(echo "$CHILD_RESPONSE" | jq -r '.issues | length')

              if [[ -n "$ALL_STATUSES" && -n "$PAGE_STATUSES" ]]; then
                ALL_STATUSES=$(printf '%s\n%s' "$ALL_STATUSES" "$PAGE_STATUSES")
              elif [[ -n "$PAGE_STATUSES" ]]; then
                ALL_STATUSES="$PAGE_STATUSES"
              fi

              CHILD_START=$((CHILD_START + CHILD_FETCHED))
              if [[ "$CHILD_START" -ge "$CHILD_TOTAL" ]]; then
                break
              fi
            done

            # Skip epic if child fetch failed partway through pagination
            if [[ "$CHILD_FETCH_FAILED" == "true" ]]; then
              continue
            fi

            if [[ "$CHILD_TOTAL" == "0" || -z "$ALL_STATUSES" ]]; then
              echo "  ℹ️  $EPIC_KEY: no children — skipping"
              continue
            fi

            # Apply rollup logic (same as jira-branch-sync.yml)
            ALL_DONE=true
            ALL_REVIEW_OR_DONE=true
            ANY_ACTIVE=false

            while IFS= read -r STATUS; do
              case "$STATUS" in
                "Done")
                  # Done alone is not "active work" — only In Progress / In Review
                  # should pull an epic out of To Do / Backlog. See LS-4683.
                  ;;
                "In Review")
                  ANY_ACTIVE=true
                  ALL_DONE=false
                  ;;
                "In Progress")
                  ANY_ACTIVE=true
                  ALL_DONE=false
                  ALL_REVIEW_OR_DONE=false
                  ;;
                *)
                  ALL_DONE=false
                  ALL_REVIEW_OR_DONE=false
                  ;;
              esac
            done <<< "$ALL_STATUSES"

            # Determine expected epic status
            if [[ "$ALL_DONE" == "true" ]]; then
              EXPECTED_STATUS="Done"
            elif [[ "$ALL_REVIEW_OR_DONE" == "true" ]]; then
              EXPECTED_STATUS="In Review"
            elif [[ "$ANY_ACTIVE" == "true" ]]; then
              EXPECTED_STATUS="In Progress"
            else
              echo "  ℹ️  $EPIC_KEY: no active children — skipping"
              NO_ACTIVE_CHILDREN=$((NO_ACTIVE_CHILDREN + 1))
              continue
            fi

            # Check if epic is already correct
            if [[ "$EPIC_STATUS" == "$EXPECTED_STATUS" ]]; then
              ALREADY_CORRECT=$((ALREADY_CORRECT + 1))
              continue
            fi

            echo "  🔄 $EPIC_KEY: '$EPIC_STATUS' → '$EXPECTED_STATUS' ($EPIC_SUMMARY)"

            # Fetch available transitions and apply
            TRANS_RESPONSE=$(jira_api GET "$JIRA_API_BASE/rest/api/3/issue/$EPIC_KEY/transitions") || {
              echo "  ⚠️  $EPIC_KEY: could not fetch transitions — skipping"
              ERRORS=$((ERRORS + 1))
              continue
            }

            TRANSITION_ID=$(echo "$TRANS_RESPONSE" | jq -r --arg t "$EXPECTED_STATUS" \
              '.transitions[] | select(.name == $t or .to.name == $t) | .id' | head -1)

            if [[ -z "$TRANSITION_ID" ]]; then
              AVAILABLE=$(echo "$TRANS_RESPONSE" | jq -r '[.transitions[] | "\(.name)→\(.to.name)"] | join(", ")')
              echo "  ⚠️  $EPIC_KEY: transition '$EXPECTED_STATUS' not available (available: $AVAILABLE)"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            jira_api POST "$JIRA_API_BASE/rest/api/3/issue/$EPIC_KEY/transitions" \
              "{\"transition\":{\"id\":\"$TRANSITION_ID\"}}" > /dev/null && {
              echo "  ✅ $EPIC_KEY → $EXPECTED_STATUS"
              TRANSITIONED=$((TRANSITIONED + 1))
              TRANSITION_LOG="${TRANSITION_LOG}"$'\n'"| $EPIC_KEY | $EPIC_SUMMARY | $EPIC_STATUS | $EXPECTED_STATUS |"
            } || {
              echo "  ⚠️  $EPIC_KEY: transition failed"
              ERRORS=$((ERRORS + 1))
            }
          done

          echo ""
          echo "## 🏛️ Epic Rollup Audit" >> $GITHUB_STEP_SUMMARY
          echo "- **Epics scanned**: $EPIC_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- **Already correct**: $ALREADY_CORRECT" >> $GITHUB_STEP_SUMMARY
          echo "- **Transitioned**: $TRANSITIONED" >> $GITHUB_STEP_SUMMARY
          echo "- **Pinned (skipped)**: $SKIPPED_PINNED" >> $GITHUB_STEP_SUMMARY
          echo "- **No active children**: $NO_ACTIVE_CHILDREN" >> $GITHUB_STEP_SUMMARY
          if [[ "$ERRORS" -gt 0 ]]; then
            echo "- **Errors**: $ERRORS" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "$TRANSITIONED" -gt 0 ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Transitions applied" >> $GITHUB_STEP_SUMMARY
            echo "| Epic | Summary | Was | Now |" >> $GITHUB_STEP_SUMMARY
            echo "|------|---------|-----|-----|" >> $GITHUB_STEP_SUMMARY
            printf '%s\n' "$TRANSITION_LOG" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ All epic statuses match their children's aggregate state." >> $GITHUB_STEP_SUMMARY
          fi
