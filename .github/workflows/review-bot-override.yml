name: Review Bot Override (W5)

# Sets the bot-review commit status to success when a maintainer overrides the
# reviewer bot, providing an audit-able escape hatch for cases where the bot
# persistently misapplies a rule.
#
# Two override paths:
#   1. Human review (primary) — a maintainer/CODEOWNER submits an APPROVE review
#      on the PR. This is the real signal: a human with admin/maintain permission
#      vouching for the change. Flips bot-review to success + audit comment,
#      dismisses any active bot CHANGES_REQUESTED review (so GitHub's
#      reviewDecision no longer blocks the merge queue), and applies
#      merge-when-ready so the PR proceeds to merge with no further human
#      action — a human APPROVE fully replaces the bot review (LS pipeline
#      automation policy). The reviewer itself also stands down when a human
#      maintainer approval exists (see reviewer/index.mjs
#      findHumanMaintainerApproval), so no bot cycle clobbers this override.
#   2. review-bot-override label (fallback) — a maintainer applies the label.
#      Kept for cases where flipping the status without a formal review is
#      preferable. Same effect as the human-review path. The applier must have
#      admin/maintain permission, the same bar as path 1 (LS-10965): a label
#      applied by anyone else (including any bot/app) is removed, a rejection
#      comment is posted, and bot-review is left untouched.
#
# Mirrors the security-override pattern in security-scanning.yml.
#
# Fires on:
#   pull_request_review submitted — maintainer APPROVE → flip bot-review to success
#   labeled   — override label applied by a maintainer → flip bot-review to
#               success + audit comment; by anyone else → remove label + comment
#   unlabeled — override label removed → flip bot-review to pending, cycle
#               bot:ready-for-review to re-fire W1 (LS-10965) + audit comment
#
# The reviewer workflow (W1) skips its run when this label is present, so the
# override status is preserved across subsequent push/label events.

on:
  pull_request:
    types: [labeled, unlabeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: review-bot-override-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  override:
    if: >-
      (github.event_name == 'pull_request' && github.event.label.name == 'review-bot-override') ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # App token (reviewer bot identity): labels applied with the default
      # GITHUB_TOKEN do not emit `labeled` events to other workflows, so the
      # merge-when-ready label added on the human-APPROVE path below would
      # never wake the merge queue. The app token also lets the dismissal and
      # audit comment carry the bot identity used everywhere else.
      - name: Generate reviewer app token
        id: reviewer-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.REVIEWER_BOT_APP_ID || '3142924' }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - name: Apply or remove bot-review override
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          # LS-10965: removes an unauthorized override label without emitting
          # an `unlabeled` event to workflows (see the fallback path below).
          DEFAULT_GITHUB_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ steps.reviewer-token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.payload.pull_request.head.sha;
            const prNumber = context.payload.pull_request.number;
            const prUrl = context.payload.pull_request.html_url;

            async function setBotReview(state, description) {
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha,
                state,
                context: 'bot-review',
                description,
                target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              });
            }

            // PRIMARY PATH: a human maintainer/CODEOWNER APPROVE review overrides
            // the bot. We only treat the review as an override if the author has
            // admin/maintain permission on the repo — a real code-owner signal,
            // not just any contributor approving.
            if (context.eventName === 'pull_request_review') {
              const review = context.payload.review;
              const reviewer = review.user.login;

              // Bot reviews (including the reviewer bot's own APPROVE) never count.
              if (review.user.type === 'Bot') {
                core.info(`Review by bot ${reviewer} — ignoring (only human maintainer reviews override).`);
                return;
              }

              let role = null;
              try {
                const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner,
                  repo,
                  username: reviewer,
                });
                role = perm.role_name || perm.permission;
              } catch (err) {
                core.info(`Could not resolve permission for @${reviewer}: ${err.message || err} — not overriding.`);
                return;
              }

              if (!['admin', 'maintain'].includes(role)) {
                core.info(`@${reviewer} has role '${role}', not a maintainer/CODEOWNER — not overriding bot-review.`);
                return;
              }

              await setBotReview('success', `Bot review overridden by human APPROVE from @${reviewer}`);

              // Dismiss any ACTIVE bot CHANGES_REQUESTED review: GitHub's
              // reviewDecision stays CHANGES_REQUESTED while one exists (a
              // human APPROVE does not clear it), and the merge queue gates
              // on reviewDecision — without this the PR stays blocked even
              // with bot-review green.
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner,
                repo,
                pull_number: prNumber,
                per_page: 100,
              });
              const activeBotBlocks = reviews.filter(
                (r) => r.user?.type === 'Bot' && r.state === 'CHANGES_REQUESTED',
              );
              for (const r of activeBotBlocks) {
                try {
                  await github.rest.pulls.dismissReview({
                    owner,
                    repo,
                    pull_number: prNumber,
                    review_id: r.id,
                    message: `Superseded by human maintainer APPROVE from @${reviewer}`,
                  });
                  core.info(`Dismissed bot CHANGES_REQUESTED review ${r.id}.`);
                } catch (err) {
                  core.warning(`Could not dismiss bot review ${r.id}: ${err.message || err}`);
                }
              }

              // Human approval is a merge signal: queue the PR exactly as the
              // reviewer bot does on its own APPROVE, so no further human
              // action is needed to reach merge.
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: prNumber,
                  labels: ['merge-when-ready'],
                });
              } catch (err) {
                core.warning(`Could not add merge-when-ready: ${err.message || err}`);
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: [
                  '> [!NOTE]',
                  '> **Bot Review Override — Human Approval**',
                  `> @${reviewer} (maintainer) submitted an APPROVE review, so the \`bot-review\` required check has been set to \`success\`,` +
                  ' any active bot `CHANGES_REQUESTED` review has been dismissed, and `merge-when-ready` has been applied.',
                  '>',
                  '> This human approval supersedes the reviewer bot\'s blocking findings — no bot review is needed. If the approval is later' +
                  ' dismissed or the PR is updated, re-run the reviewer (apply `bot:ready-for-review`) to re-evaluate.',
                ].join('\n'),
              });

              core.summary.addRaw(`## ✅ Bot Review Override — Human Approval\n\n`);
              core.summary.addRaw(`**Approved by:** @${reviewer} (maintainer)\n\n`);
              core.summary.addRaw(`**PR:** ${prUrl}\n\n`);
              core.summary.addRaw(`The \`bot-review\` commit status on \`${sha.slice(0, 7)}\` has been set to \`success\`.\n`);
              await core.summary.write();
              return;
            }

            // FALLBACK PATH: maintainer-applied label.
            const applier = context.payload.sender.login;
            const isLabeled = context.payload.action === 'labeled';

            if (isLabeled) {
              // LS-10965: the label is only an override when a maintainer
              // applied it. Labels can be applied by anyone with triage/write
              // access — including the Agent Author app whose PRs this gate
              // reviews — so check the applier exactly as the human-APPROVE
              // path above checks the reviewer (admin/maintain only). Bot
              // senders never qualify. The reviewer (W1) applies the same
              // check before its auto-approve path (reviewer/index.mjs), so a
              // concurrent W1 run on this labeled event cannot bypass it.
              let applierRole = null;
              if (context.payload.sender.type !== 'Bot') {
                try {
                  const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
                    owner,
                    repo,
                    username: applier,
                  });
                  applierRole = perm.role_name || perm.permission;
                } catch (err) {
                  core.info(`Could not resolve permission for @${applier}: ${err.message || err} — treating as unauthorized.`);
                }
              }

              if (!['admin', 'maintain'].includes(applierRole)) {
                core.warning(
                  `review-bot-override applied by @${applier} (role '${applierRole}') — not a maintainer; removing label, bot-review untouched.`,
                );
                // Remove with the workflow's GITHUB_TOKEN, NOT the reviewer
                // app token: events caused by GITHUB_TOKEN do not trigger
                // workflows, so this removal does not re-enter this
                // workflow's unlabeled path (which would flip bot-review to
                // pending and re-fire W1 on the PR's legitimate status).
                try {
                  const defaultGithub = getOctokit(process.env.DEFAULT_GITHUB_TOKEN);
                  await defaultGithub.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: prNumber,
                    name: 'review-bot-override',
                  });
                } catch (err) {
                  if (err.status !== 404) {
                    core.warning(`Could not remove unauthorized review-bot-override label: ${err.message || err}`);
                  }
                }

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: [
                    '> [!WARNING]',
                    '> **Bot Review Override Rejected**',
                    `> The \`review-bot-override\` label was applied by @${applier}, who does not have admin or maintain permission.` +
                    ' The label has been removed and the `bot-review` check was not changed.',
                    '>',
                    '> Only a maintainer can override the reviewer bot — via this label or an APPROVE review.',
                  ].join('\n'),
                });

                core.summary.addRaw(`## ⛔ Bot Review Override Rejected\n\n`);
                core.summary.addRaw(`**Applied by:** @${applier} (role: ${applierRole ?? 'unknown'})\n\n`);
                core.summary.addRaw(`**PR:** ${prUrl}\n\n`);
                core.summary.addRaw(`The label was removed; \`bot-review\` on \`${sha.slice(0, 7)}\` was not changed.\n`);
                await core.summary.write();
                return;
              }

              // Flip bot-review to success
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha,
                state: 'success',
                context: 'bot-review',
                description: 'Bot review overridden via review-bot-override label',
                target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              });

              // Audit comment
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: [
                  '> [!WARNING]',
                  '> **Bot Review Override Applied**',
                  `> The \`review-bot-override\` label was applied by @${applier} (maintainer). The \`bot-review\` required check has been set to \`success\`.`,
                  '>',
                  '> This override bypasses the reviewer bot\'s blocking findings. Apply only after the' +
                  ' bot\'s findings have been reviewed and confirmed inapplicable or incorrect' +
                  ' (e.g. after filing `CANNOT-COMPLY` in Cycle 3). Remove the label to restore the' +
                  ' normal review gate.',
                ].join('\n'),
              });

              core.summary.addRaw(`## ✅ Bot Review Override Applied\n\n`);
              core.summary.addRaw(`**Applied by:** @${applier}\n\n`);
              core.summary.addRaw(`**PR:** ${prUrl}\n\n`);
              core.summary.addRaw(`The \`bot-review\` commit status on \`${sha.slice(0, 7)}\` has been set to \`success\`.\n`);
              await core.summary.write();
            } else {
              // Label removed — set back to pending, then re-fire the
              // reviewer so the normal gate re-adjudicates this SHA.
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha,
                state: 'pending',
                context: 'bot-review',
                description: 'Override removed — re-running Reviewer (W1)',
                target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              });

              // LS-10965: `unlabeled` is not a W1 trigger, so the pending
              // above used to sit until the merge queue's stale-pending
              // self-heal (an hour, and only while the PR is queued). Cycle
              // bot:ready-for-review (remove, then add) so a fresh `labeled`
              // event fires W1 — a bare re-add of a present label emits no
              // event. `github` here is the reviewer app token minted above:
              // labels changed with the default GITHUB_TOKEN would not
              // trigger W1 at all. Best-effort: on failure the audit comment
              // tells the human how to re-trigger manually.
              let retriggered = false;
              if (context.payload.pull_request.state === 'open') {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: prNumber,
                    name: 'bot:ready-for-review',
                  });
                } catch (err) {
                  if (err.status !== 404) {
                    core.warning(`Could not remove bot:ready-for-review before re-adding: ${err.message || err}`);
                  }
                }
                try {
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: prNumber,
                    labels: ['bot:ready-for-review'],
                  });
                  retriggered = true;
                } catch (err) {
                  core.warning(`Could not apply bot:ready-for-review to re-trigger W1: ${err.message || err}`);
                }
              }

              // Audit comment
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: [
                  '> [!NOTE]',
                  '> **Bot Review Override Removed**',
                  `> The \`review-bot-override\` label was removed by @${applier}. ` +
                    'The `bot-review` check is now `pending` ' +
                    (retriggered
                      ? 'and `bot:ready-for-review` has been re-applied to start a new review cycle.'
                      : '— re-apply `bot:ready-for-review` to trigger a new review cycle.'),
                ].join('\n'),
              });

              core.summary.addRaw(`## ⏳ Bot Review Override Removed\n\n`);
              core.summary.addRaw(`**Removed by:** @${applier}\n\n`);
              core.summary.addRaw(`**PR:** ${prUrl}\n\n`);
              core.summary.addRaw(`The \`bot-review\` commit status on \`${sha.slice(0, 7)}\` has been set to \`pending\`` +
                (retriggered ? ' and Reviewer (W1) re-triggered.\n' : '.\n'));
              await core.summary.write();
            }
