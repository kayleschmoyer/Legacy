name: Build Android App

on:
  # Build Android app after CI pipeline succeeds (for mobile-specific changes)
  workflow_run:
    workflows: ["🚀 Legacy Sports CI Pipeline"]
    types: [completed]
    branches: [main]
  # Also run on direct push to main for mobile changes
  push:
    branches: [main]
    paths:
      - "apps/app/**"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Type"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug
      create_releases:
        description: "Create GitHub Releases"
        required: false
        default: true
        type: boolean

# Required permissions for nx-set-shas action
permissions:
  actions: read
  contents: read

# Cancel in-progress builds for the same workflow
concurrency:
  group: ${{ github.workflow }}-android-${{ github.event.inputs.build_type || 'release' }}
  cancel-in-progress: true

env:
  # Version Matrix Configuration
  JAVA_VERSION: "17"                    # LTS version, compatible with RN 0.79.6
  NODE_VERSION: "22"                    # Latest LTS, matches development environment
  ANDROID_API_LEVEL: "35"              # Target SDK for Google Play compliance
  NDK_VERSION: "27.1.12297006"         # Stable NDK for RN 0.79.6
  
  # Build optimization environment variables with improved network timeouts and cache limits
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.caching=true -Dorg.gradle.caching.debug=false -Dorg.gradle.cache.cleanup=true -Dorg.gradle.internal.network.retry.max.count=3"
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
  NODE_OPTIONS: "--max-old-space-size=4096"
  
  # Cache optimization - reduce compression time during cleanup
  ACTIONS_CACHE_COMPRESSION_LEVEL: "1"  # Lower compression = faster cleanup
  ACTIONS_CACHE_MAX_SIZE: "5GB"         # Limit cache size

jobs:
  setup:
    name: Setup and Version
    runs-on: ubuntu-latest
    # Only run if CI pipeline succeeded (for workflow_run) or for direct triggers
    if: >
      github.event_name != 'workflow_run' || 
      github.event.workflow_run.conclusion == 'success'
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      commit_sha: ${{ steps.version.outputs.commit_sha }}
      build_type: ${{ steps.platform.outputs.build_type }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Extract Version Info
        id: version
        run: |
          VERSION=$(node -p "require('./apps/app/package.json').version")
          COMMIT_SHA=${GITHUB_SHA:0:7}
          BUILD_NUMBER=$(date +%Y%m%d_%H%M%S)

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Set Build Type
        id: platform
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: setup
    outputs:
      apk_path: ${{ steps.build.outputs.apk_path }}
      apk_name: ${{ steps.build.outputs.apk_name }}

    steps:
      - name: Verify Branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "❌ This workflow only runs on main branch or manual dispatch"
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-dependencies: true
          set-nx-shas: true
          skip-system-deps: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Verify Version Matrix
        run: |
          echo "## 📋 Build Version Matrix" >> $GITHUB_STEP_SUMMARY
          echo "- **Java**: $(java -version 2>&1 | head -n1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Node.js**: $(node --version)" >> $GITHUB_STEP_SUMMARY
          echo "- **NPM**: $(npm --version)" >> $GITHUB_STEP_SUMMARY
          echo "- **Android API Level**: ${{ env.ANDROID_API_LEVEL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **NDK Version**: ${{ env.NDK_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **React Native**: $(node -p "require('./apps/app/package.json').dependencies['react-native'] || require('./package.json').dependencies['react-native']")" >> $GITHUB_STEP_SUMMARY

      # Android-specific caching for Gradle artifacts
      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-9  
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/app/android/gradle/wrapper/gradle-wrapper.properties', 'apps/app/android/app/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle Wrapper Permissions
        run: |
          cd apps/app/android
          chmod +x gradlew

      - name: Verify Gradle Setup
        timeout-minutes: 15
        run: |
          cd apps/app/android
          
          echo "📥 Ensuring Gradle wrapper is available..."
          echo "🕐 Gradle setup started at $(date)"
          
          # Set network timeout environment variables for better CI reliability
          export GRADLE_OPTS="$GRADLE_OPTS -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"
          
          # Version compatibility validation
          echo "🔍 Validating version matrix compatibility..."
          
          # Check Java version compatibility
          JAVA_VERSION=$(java -version 2>&1 | head -n 1 | cut -d'"' -f2 | cut -d'.' -f1-2)
          echo "Java version detected: $JAVA_VERSION"
          
          # Check Gradle version with increased timeout for network-dependent operations
          echo "🔍 Checking Gradle wrapper version..."
          timeout 420s ./gradlew --version --no-daemon || {
            echo "⚠️  Gradle version check failed - checking connectivity and retrying with offline mode"
            timeout 120s ./gradlew --version --offline --no-daemon || {
              echo "❌ Gradle setup failed completely - check network connectivity and gradle wrapper"
              exit 1
            }
          }
          
          # Validate Android SDK configuration
          echo "🔍 Validating Android SDK configuration..."
          echo "Target Android API Level: ${{ env.ANDROID_API_LEVEL }}"
          echo "NDK Version: ${{ env.NDK_VERSION }}"
          
          # Quick validation that build.gradle is parseable (without dependency resolution)
          echo "🔍 Validating build configuration..."
          timeout 240s ./gradlew help --quiet --no-daemon > /dev/null || {
            echo "⚠️  Build configuration issue detected - showing details:"
            timeout 180s ./gradlew help --no-daemon --info  # Show error details with more info
          }
          
          echo "✅ Gradle setup and version matrix verified at $(date)"

      - name: Check Cache Status
        run: |
          echo "📊 Current cache status:"
          echo "  Gradle wrapper: $(ls ~/.gradle/wrapper/ 2>/dev/null | wc -l) files"
          echo "  Gradle caches: $(ls ~/.gradle/caches/ 2>/dev/null | wc -l) entries"
          echo "  Node modules: $(ls node_modules/ 2>/dev/null | wc -l) packages"
          echo ""
          echo "💡 Dependencies will be downloaded during build if not cached"

      - name: Generate React Native Bundle
        timeout-minutes: 10
        run: |
          cd apps/app

          # Ensure assets directory exists
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res

          # Check Metro cache status
          echo "📊 Checking Metro cache status..."
          ls -la ~/.metro/ 2>/dev/null || echo "No Metro cache found"
          ls -la node_modules/.cache/metro/ 2>/dev/null || echo "No Metro node_modules cache found"

          # Set environment optimizations for bundling with cache utilization
          export REACT_NATIVE_PACKAGER_CACHE_DISABLED=false
          export RCT_METRO_PORT=8082

          # Generate bundle with optimizations for CI and cache utilization
          echo "📦 Generating React Native bundle for Android (with caching)..."
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/ \
            --minify true \
            --verbose || {
            echo "⚠️ Bundle generation failed, trying with reset-cache..."
            npx react-native bundle \
              --platform android \
              --dev false \
              --entry-file index.js \
              --bundle-output android/app/src/main/assets/index.android.bundle \
              --assets-dest android/app/src/main/res/ \
              --minify true \
              --reset-cache
          }

          # Verify bundle was created and show cache effectiveness
          if [ -f "android/app/src/main/assets/index.android.bundle" ]; then
            BUNDLE_SIZE=$(du -h android/app/src/main/assets/index.android.bundle | cut -f1)
            echo "✅ Bundle generated successfully: $BUNDLE_SIZE"
            
            # Check if Hermes cache is being used
            ls -la android/app/build/generated/assets/ 2>/dev/null | head -3 || echo "No Hermes assets cache"
          else
            echo "❌ Bundle generation failed"
            exit 1
          fi

      - name: Build Android APK
        id: build
        timeout-minutes: 25
        run: |
          cd apps/app/android

          # Kill any existing Gradle daemons to prevent conflicts
          ./gradlew --stop || true

          # Use CI-optimized Gradle properties
          cp gradle-ci.properties gradle.properties

          # Configure build optimizations with cache awareness
          export _JAVA_OPTIONS="-Xmx4096m"

          # Check cache effectiveness before build
          echo "📊 Cache Status Summary:"
          echo "  Gradle Wrapper: $(ls ~/.gradle/wrapper/ 2>/dev/null | wc -l) items"
          echo "  Gradle Dependencies: $(ls ~/.gradle/caches/modules-2/ 2>/dev/null | wc -l) items"
          echo "  Kotlin Cache: $(ls ~/.gradle/kotlin/ 2>/dev/null | wc -l) items"
          echo "  Build Cache: $(ls ~/.gradle/caches/build-cache-* 2>/dev/null | wc -l) items"

          # Determine build type
          BUILD_TYPE="${{ needs.setup.outputs.build_type }}"

          # Common Gradle flags for CI optimization with aggressive caching
          GRADLE_FLAGS="--no-daemon --stacktrace --parallel --max-workers=4 --build-cache --configuration-cache-problems=warn --no-scan --info"

          # Start build with timing
          echo "🏗️  Starting Android $BUILD_TYPE build at $(date)"
          BUILD_START_TIME=$(date +%s)

          if [ "$BUILD_TYPE" == "release" ]; then
            echo "📦 Building Release APK..."
            ./gradlew assembleRelease $GRADLE_FLAGS
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
            APK_NAME="legacy-sports-${{ needs.setup.outputs.version }}-${{ needs.setup.outputs.commit_sha }}.apk"
          else
            echo "🔧 Building Debug APK..."
            ./gradlew assembleDebug $GRADLE_FLAGS
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
            APK_NAME="legacy-sports-${{ needs.setup.outputs.version }}-${{ needs.setup.outputs.commit_sha }}-debug.apk"
          fi

          # Calculate build time
          BUILD_END_TIME=$(date +%s)
          BUILD_DURATION=$((BUILD_END_TIME - BUILD_START_TIME))
          echo "⏱️  Build completed in ${BUILD_DURATION} seconds"

          # Verify APK was created
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK not found at $APK_PATH"
            exit 1
          fi

          # Get APK info
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "✅ APK built successfully: $APK_SIZE"
          ls -la "$APK_PATH"

          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Cache Cleanup & Optimization
        if: always()
        run: |
          echo "🧹 Cleaning up cache for optimal performance..."
          
          # Remove large temporary files but keep useful caches
          find ~/.gradle/caches -name "*.lock" -delete 2>/dev/null || true
          find ~/.gradle/caches -name "gc.properties" -delete 2>/dev/null || true
          
          # Clean up old build outputs but preserve dependencies
          rm -rf apps/app/android/build/intermediates/incremental 2>/dev/null || true
          rm -rf apps/app/android/app/build/intermediates/incremental 2>/dev/null || true
          
          # Show final cache sizes
          echo "📊 Final Cache Summary:"
          du -sh ~/.gradle/caches 2>/dev/null || echo "  Gradle caches: Not found"
          du -sh ~/.gradle/wrapper 2>/dev/null || echo "  Gradle wrapper: Not found"
          du -sh ~/.metro 2>/dev/null || echo "  Metro cache: Not found"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ needs.setup.outputs.build_type }}
          path: apps/app/android/${{ steps.build.outputs.apk_path }}
          retention-days: 30

      - name: Cache Cleanup for Faster Compression
        if: always()
        run: |
          echo "🧹 Cleaning up large cache directories to speed up post-job cleanup..."
          
          # Remove large temporary build artifacts that don't need to be cached
          rm -rf apps/app/android/app/build/intermediates/merged_assets/ || true
          rm -rf apps/app/android/app/build/intermediates/incremental/ || true
          rm -rf apps/app/android/app/build/outputs/logs/ || true
          rm -rf ~/.gradle/caches/build-cache-* || true
          rm -rf ~/.android/build-cache || true
          rm -rf /tmp/metro-* /tmp/haste-map-* || true
          
          # Clean up large node_modules that can be restored from npm cache
          find node_modules -name "*.log" -delete || true
          find node_modules -name ".DS_Store" -delete || true
          
          # Compress remaining gradle caches to reduce cleanup time
          find ~/.gradle/caches -name "*.lock" -delete || true
          
          echo "✅ Cache cleanup completed. Remaining cache sizes:"
          du -sh ~/.gradle/caches 2>/dev/null || echo "  Gradle caches: Cleaned"
          du -sh node_modules 2>/dev/null || echo "  Node modules: $(du -sh node_modules | cut -f1)"
          
          echo "💡 Post-job cache compression should be much faster now"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [setup, build-android]
    if: github.event.inputs.create_releases != 'false'

    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v5
        with:
          name: android-apk-${{ needs.setup.outputs.build_type }}
          path: ./artifacts

      - name: Rename APK
        run: |
          cd artifacts
          mv *.apk "${{ needs.build-android.outputs.apk_name }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ needs.setup.outputs.version }}-${{ needs.setup.outputs.build_number }}
          name: "Android Release v${{ needs.setup.outputs.version }} (${{ needs.setup.outputs.commit_sha }})"
          draft: false
          prerelease: ${{ needs.setup.outputs.build_type == 'debug' }}
          generate_release_notes: true
          body: |
            ## 🤖 Android APK Release

            **Version:** ${{ needs.setup.outputs.version }}  
            **Build Number:** ${{ needs.setup.outputs.build_number }}  
            **Commit:** ${{ needs.setup.outputs.commit_sha }}  
            **Build Type:** ${{ needs.setup.outputs.build_type }}

            ### 📱 Installation Instructions
            1. Download the APK file below
            2. Enable "Install from Unknown Sources" in Android settings
            3. Install the APK on your Android device

            ### 🔧 Build Information
            - **Platform:** Android
            - **Build Type:** ${{ needs.setup.outputs.build_type }}
            - **Java Version:** ${{ env.JAVA_VERSION }}
            - **Built with:** React Native + Expo SDK 52
          files: ./artifacts/${{ needs.build-android.outputs.apk_name }}

  notify:
    name: Notify Build Results
    runs-on: ubuntu-latest
    needs: [setup, build-android, create-release]
    if: always()

    steps:
      - name: Build Summary
        run: |
          echo "## 📱 Android Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.setup.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Number:** ${{ needs.setup.outputs.build_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ needs.setup.outputs.commit_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type:** ${{ needs.setup.outputs.build_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Android Status:** ${{ needs.build-android.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Status:** ${{ needs.create-release.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.build-android.result }}" == "success" ]; then
            echo "✅ **Android APK built successfully!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📦 **Download:** Check the releases page or artifacts section above." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Android build failed.** Check the logs above for details." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check Build Artifacts
        if: needs.build-android.result == 'success'
        run: |
          echo "Build artifacts information:"
          echo "APK Name: ${{ needs.build-android.outputs.apk_name }}"
          echo "APK Path: ${{ needs.build-android.outputs.apk_path }}"
