name: Build Android App

on:
  # Run on direct push to main for mobile changes
  push:
    branches: [main]
    paths:
      - "apps/app/**"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Type"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug
      create_releases:
        description: "Create GitHub Releases"
        required: false
        default: true
        type: boolean

# Required permissions for nx-set-shas action and creating releases
permissions:
  actions: read
  contents: write # Required for creating GitHub releases

# Cancel in-progress builds for the same workflow
concurrency:
  group: ${{ github.workflow }}-android-${{ github.event.inputs.build_type || 'release' }}
  cancel-in-progress: true

env:
  # Version Matrix Configuration
  JAVA_VERSION: "17" # LTS version, compatible with RN 0.79.6
  NODE_VERSION: "22" # Node 22 LTS
  ANDROID_API_LEVEL: "35" # Target SDK for Google Play compliance
  NDK_VERSION: "27.1.12297006" # Stable NDK for RN 0.79.6

  # Gradle CI flags — daemon disabled, parallel enabled, caching on
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.jvmargs=-Xmx4096m
    -Dorg.gradle.caching=true
    -Dorg.gradle.internal.http.connectionTimeout=120000
    -Dorg.gradle.internal.http.socketTimeout=120000
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    outputs:
      apk_path: ${{ steps.build.outputs.apk_path }}
      apk_name: ${{ steps.build.outputs.apk_name }}
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      commit_sha: ${{ steps.version.outputs.commit_sha }}
      build_type: ${{ steps.version.outputs.build_type }}

    steps:
      - name: Verify Branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "❌ This workflow only runs on main branch or manual dispatch"
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Extract Version Info
        id: version
        run: |
          VERSION=$(node -p "require('./apps/app/package.json').version")
          COMMIT_SHA=${GITHUB_SHA:0:7}
          BUILD_NUMBER=$(date +%Y%m%d_%H%M%S)
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-dependencies: true
          set-nx-shas: false
          skip-system-deps: true

      # setup-java with built-in Gradle caching — replaces manual cache step
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"
          cache-dependency-path: |
            apps/app/app.json
            pnpm-lock.yaml

      - name: Run Expo Prebuild
        run: |
          cd apps/app
          npx expo prebuild --platform android --no-install
          chmod +x android/gradlew
          echo "✅ Expo prebuild completed"

      - name: Build Android APK
        id: build
        timeout-minutes: 25
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          EXPO_PUBLIC_APP_VERSION: ${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_number }}
        run: |
          cd apps/app/android

          BUILD_TYPE="${{ steps.version.outputs.build_type }}"

          # Gradle flags — parallel, build cache, configuration cache
          GRADLE_FLAGS="--no-daemon --stacktrace --parallel --max-workers=4 --build-cache --configuration-cache --configuration-cache-problems=warn"

          # Debug builds: single ABI (arm64-v8a) to cut native compilation ~50%
          # Release builds: all architectures for full device compatibility
          if [ "$BUILD_TYPE" == "debug" ]; then
            ABI_FLAG="-PreactNativeArchitectures=arm64-v8a"
          else
            ABI_FLAG=""
          fi

          echo "🏗️  Starting Android $BUILD_TYPE build at $(date)"
          BUILD_START_TIME=$(date +%s)

          if [ "$BUILD_TYPE" == "release" ]; then
            ./gradlew assembleRelease $GRADLE_FLAGS $ABI_FLAG
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
            APK_NAME="legacy-sports-${{ steps.version.outputs.version }}-${{ steps.version.outputs.commit_sha }}.apk"
          else
            ./gradlew assembleDebug $GRADLE_FLAGS $ABI_FLAG
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
            APK_NAME="legacy-sports-${{ steps.version.outputs.version }}-${{ steps.version.outputs.commit_sha }}-debug.apk"
          fi

          BUILD_END_TIME=$(date +%s)
          echo "⏱️  Build completed in $((BUILD_END_TIME - BUILD_START_TIME)) seconds"

          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK not found at $APK_PATH"
            exit 1
          fi

          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "✅ APK built successfully: $APK_SIZE"

          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-apk-${{ steps.version.outputs.build_type }}
          path: apps/app/android/${{ steps.build.outputs.apk_path }}
          retention-days: 30

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-android
    if: github.event.inputs.create_releases != 'false'

    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v7
        with:
          name: android-apk-${{ needs.build-android.outputs.build_type }}
          path: ./artifacts

      - name: Rename APK
        run: |
          cd artifacts
          mv *.apk "${{ needs.build-android.outputs.apk_name }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ needs.build-android.outputs.version }}-${{ needs.build-android.outputs.build_number }}
          name: "Android Release v${{ needs.build-android.outputs.version }} (${{ needs.build-android.outputs.commit_sha }})"
          draft: false
          prerelease: ${{ needs.build-android.outputs.build_type == 'debug' }}
          generate_release_notes: true
          body: |
            ## 🤖 Android APK Release

            **Version:** ${{ needs.build-android.outputs.version }}  
            **Build Number:** ${{ needs.build-android.outputs.build_number }}  
            **Commit:** ${{ needs.build-android.outputs.commit_sha }}  
            **Build Type:** ${{ needs.build-android.outputs.build_type }}

            ### 📱 Installation Instructions
            1. Download the APK file below
            2. Enable "Install from Unknown Sources" in Android settings
            3. Install the APK on your Android device

            ### 🔧 Build Information
            - **Platform:** Android
            - **Build Type:** ${{ needs.build-android.outputs.build_type }}
            - **Java Version:** ${{ env.JAVA_VERSION }}
            - **Built with:** React Native 0.79 + Expo SDK 53
          files: ./artifacts/${{ needs.build-android.outputs.apk_name }}

  notify:
    name: Notify Build Results
    runs-on: ubuntu-latest
    needs: [build-android, create-release]
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Build Summary
        run: |
          echo "## 📱 Android Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.build-android.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Number:** ${{ needs.build-android.outputs.build_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ needs.build-android.outputs.commit_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type:** ${{ needs.build-android.outputs.build_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Android Status:** ${{ needs.build-android.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Status:** ${{ needs.create-release.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.build-android.result }}" == "success" ]; then
            echo "✅ **Android APK built successfully!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📦 **Download:** Check the releases page or artifacts section above." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Android build failed.** Check the logs above for details." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check Build Artifacts
        if: needs.build-android.result == 'success'
        run: |
          echo "Build artifacts information:"
          echo "APK Name: ${{ needs.build-android.outputs.apk_name }}"
          echo "APK Path: ${{ needs.build-android.outputs.apk_path }}"

      - name: Update Deployment Badge
        if: always()
        uses: ./.github/actions/update-deployment-badge
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          gist-id: ${{ secrets.CI_BADGES_GIST_ID }}
          deployment-name: "Build Android APK"
          deployment-status: ${{ needs.build-android.result }}
          workflow-run-id: ${{ github.run_id }}
          branch: ${{ github.ref_name }}
