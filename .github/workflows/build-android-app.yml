name: Build Android App

# Triggering:
#   - Primary: called from the umbrella Deploy workflow via workflow_call, gated
#     behind Apply Lambda Infrastructure completing (LS-8765). Before this, this
#     workflow triggered directly off `push: branches: [main]` with no ordering
#     relative to the Lambda deploy — the same client-ships-ahead-of-server race
#     that deploy-web.yml closed for the web app (LS-9374/LS-9369, see its own
#     header) was still open for the Android app. A shared GraphQL fragment
#     (lib/graphql/src/teamMember.fragment.graphql) querying a newly-added field
#     shipped in an Android build minutes after merge while the `graphql` Lambda
#     — deployed via a separate, slower Upload Lambdas / Apply Lambda
#     Infrastructure step — hadn't picked up the new field yet, producing
#     `Cannot query field "nflTeam" on type "Player"` CombinedGraphQLErrors for
#     every GetTeamMembers/GetTeamTradeOffers request until the Lambda deploy
#     caught up (Rollbar #212, ~9 days as installed base cycled through the
#     broken build before it stopped being requested).
#   - Manual: workflow_dispatch for targeted one-off builds.
on:
  workflow_call:
    inputs:
      build_type:
        description: "Build Type"
        required: false
        default: "release"
        type: string
      create_releases:
        description: "Create GitHub Releases"
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Type"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug
      create_releases:
        description: "Create GitHub Releases"
        required: false
        default: true
        type: boolean

# Required permissions for nx-set-shas action and creating releases
permissions:
  actions: read
  contents: write # Required for creating GitHub releases
  id-token: write # Required for OIDC auth to AWS when publishing the APK to S3 (LS-9454)

# Cancel in-progress builds for the same branch/workflow combination
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.build_type || 'release' }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  # Version Matrix Configuration
  JAVA_VERSION: "17" # LTS version, compatible with RN 0.81.5
  NODE_VERSION: "22"
  ANDROID_API_LEVEL: "35" # Target SDK for Google Play compliance
  NDK_VERSION: "27.1.12297006" # Stable NDK for RN 0.81.5

  # Gradle CI env — build-android composite action handles daemon/parallel/cache flags
  GRADLE_OPTS: >-
    -Dorg.gradle.internal.http.connectionTimeout=120000
    -Dorg.gradle.internal.http.socketTimeout=120000
  # 2GB is sufficient for Metro bundler; 4GB + Gradle workers exceeded 8GB RAM on c6a.xlarge (OOM kill)
  NODE_OPTIONS: "--max-old-space-size=2048"

jobs:
  build-android:
    name: Build Android APK
    # LS-8910: this job needs the Android SDK/NDK/Gradle wrapper, which only
    # the dedicated Android runner pool's AMI carries after the base/android
    # Packer split. Falls back straight to GitHub-hosted ubuntu-latest (NOT
    # to vars.CI_RUNNER_LABEL) when ANDROID_RUNNER_LABEL is unset — GitHub's
    # hosted runner images ship a usable Android SDK, so this fails safe.
    # Falling back to the default self-hosted pool instead would be unsafe:
    # once that pool's AMI is rebuilt off the new Android-SDK-free base
    # source, this job would fail there with a missing-SDK error.
    runs-on: ${{ vars.ANDROID_RUNNER_LABEL || 'ubuntu-latest' }}
    # EXPO_PUBLIC_* values are inlined into the JS bundle by Metro
    # (babel-preset-expo) during the Gradle assemble step inside the
    # build-android composite action. They MUST live in the *job* environment:
    # job-level env (and anything written to $GITHUB_ENV) propagates into
    # composite-action steps, but env set on a `uses:` step does NOT
    # (actions/runner#1483). Without these the app falls back to the localhost
    # defaults baked into app.json / mobileOAuthConfig.ts and cannot reach the
    # backend on a physical device — the OAuth code-exchange fetch hits
    # http://localhost:5001 and Android blocks it (CLEARTEXT), which surfaces as
    # the post-redirect "login failed" / auth-redirect loop.
    #
    # Platform-neutral secrets are prefixed here with EXPO_PUBLIC_ for Metro/Babel.
    # The web build applies VITE_ prefixes to the same underlying secrets — see
    # .github/workflows/deploy-web.yml "Build Web App". Keeping the secrets
    # framework-agnostic ensures web and mobile can never drift onto different backends.
    #
    # EXPO_PUBLIC_BYPASS_AUTH is intentionally NOT set — leaving it unset keeps
    # real authentication enforced in shipped builds.
    env:
      EXPO_PUBLIC_OAUTH_PROXY: ${{ secrets.OAUTH_PROXY_URL }}
      EXPO_PUBLIC_GRAPHQL_HOST: ${{ secrets.GRAPHQL_HOST }}
      EXPO_PUBLIC_WEBSOCKET_URL: ${{ secrets.WEBSOCKET_URL }}
      EXPO_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      EXPO_PUBLIC_ROLLBAR_ACCESS_TOKEN: ${{ secrets.ROLLBAR_CLIENT_ACCESS_TOKEN }}
      # Stripe subscription config — mobile-only, no web CI equivalent. These are
      # publishable identifiers (not sensitive), but are read from repo secrets
      # so the subscription screen can render plans. If the secrets are unset the
      # references resolve to empty strings and the rest of the app is unaffected.
      EXPO_PUBLIC_STRIPE_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_MONTHLY_PRICE_ID }}
      EXPO_PUBLIC_STRIPE_ANNUAL_PRICE_ID: ${{ secrets.STRIPE_ANNUAL_PRICE_ID }}
      # GIF picker in league chat (LeagueChatTab). Reuse the same neutral Giphy
      # secret the web build prefixes as VITE_GIPHY_API_KEY — one Giphy app, both
      # platforms. Unset → the picker silently renders no results.
      EXPO_PUBLIC_GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
      # GrowthBook SDK client key (feature flags — docs/feature-flags.md). Same
      # neutral secret the web build prefixes as VITE_GROWTHBOOK_CLIENT_KEY
      # (deploy-web.yml). The native root layout (apps/app/src/app/_layout.tsx)
      # skips loadFeatures when the key is empty, so an unset secret leaves flags
      # at their in-code fallbacks without breaking the build.
      EXPO_PUBLIC_GROWTHBOOK_CLIENT_KEY: ${{ secrets.GROWTHBOOK_CLIENT_KEY }}
      # League invite/share deep-link base. Without this the app falls back to the
      # hard-coded https://legacysports.app default (app/.../league/[leagueId].tsx),
      # which is NOT the production web domain — invite links would 404. Pin it to
      # the same custom domain the web app deploys to (deploy-web.yml CNAME).
      EXPO_PUBLIC_APP_BASE_URL: https://legacy-fantasy.com
    outputs:
      apk_path: ${{ steps.build.outputs.apk-path }}
      apk_name: ${{ steps.apk-name.outputs.apk_name }}
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      commit_sha: ${{ steps.version.outputs.commit_sha }}
      build_type: ${{ steps.version.outputs.build_type }}

    steps:
      - name: Verify Branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && [ "$GITHUB_EVENT_NAME" != "workflow_call" ]; then
            echo "❌ This workflow only runs on main branch or manual dispatch"
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Extract Version Info
        id: version
        run: |
          VERSION=$(node -p "require('./apps/app/package.json').version")
          COMMIT_SHA=${GITHUB_SHA:0:7}
          BUILD_NUMBER=$(date +%Y%m%d_%H%M%S)
          BUILD_TYPE="${{ inputs.build_type || 'release' }}"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT

          # Surface the app version to the JS bundle for Rollbar release tagging
          # (app.config.js mirrors APP_VERSION -> EXPO_PUBLIC_APP_VERSION; writing
          # to $GITHUB_ENV makes it available to the composite build-android steps,
          # mirroring deploy-web's VITE_APP_VERSION).
          echo "EXPO_PUBLIC_APP_VERSION=$VERSION" >> $GITHUB_ENV

          # Derive the Jira proxy URL from the same API base as GraphQL (same API
          # Gateway custom domain, different path) — mirrors deploy-web.yml /
          # deploy-pr-preview.yml / rollback.yml so the native in-app bug report
          # (help.tsx) reaches the same jira-proxy endpoint as web (LS-8842).
          echo "EXPO_PUBLIC_JIRA_PROXY_URL=${EXPO_PUBLIC_GRAPHQL_HOST%/graphql}/jira" >> $GITHUB_ENV

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-dependencies: true
          set-nx-shas: false
          skip-system-deps: true

      # Self-hosted Android runners already have JDK 17 + JAVA_HOME baked in via
      # the runner_android Packer source (terraform/runners/packer/runner-ami.pkr.hcl),
      # so skip the download there. The gate uses `vars.ANDROID_RUNNER_LABEL == ''`
      # (matching the `runs-on` expression above, not `vars.CI_RUNNER_LABEL` —
      # LS-8910 split the Android pool onto its own label) because
      # `runner.labels` is NOT a valid GitHub Actions context — the older
      # `!contains(runner.labels, ...)` form always evaluated to true and
      # silently re-downloaded the JDK/SDK on every self-hosted run (LS-4933).
      - name: Setup Java
        if: ${{ vars.ANDROID_RUNNER_LABEL == '' }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"
          cache-dependency-path: |
            apps/app/app.json
            pnpm-lock.yaml

      - name: Setup Android SDK
        if: ${{ vars.ANDROID_RUNNER_LABEL == '' }}
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: "platform-tools platforms;android-${{ env.ANDROID_API_LEVEL }} build-tools;${{ env.ANDROID_API_LEVEL }}.0.0 ndk;${{ env.NDK_VERSION }}"

      # Self-hosted runners bake the Android SDK into the AMI at /opt/android-sdk
      # and rely on /opt/actions-runner/.env to surface ANDROID_HOME to job steps
      # (LS-4936). When that mechanism doesn't take effect (stale AMI, runner
      # agent not reading .env), Gradle fails with "SDK location not found".
      # Belt-and-suspenders: if ANDROID_HOME is empty but the SDK exists on disk,
      # export it explicitly so the build doesn't depend solely on the AMI .env.
      - name: Ensure ANDROID_HOME (self-hosted fallback)
        if: ${{ vars.ANDROID_RUNNER_LABEL != '' }}
        shell: bash
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            echo "✅ ANDROID_HOME already set: $ANDROID_HOME"
            exit 0
          fi
          SDK_DIR="/opt/android-sdk"
          if [ ! -d "$SDK_DIR" ]; then
            echo "❌ ANDROID_HOME is unset and $SDK_DIR does not exist on this runner."
            echo "   Expected the AMI to bake the SDK there (terraform/runners/packer/runner-ami.pkr.hcl)."
            exit 1
          fi
          echo "⚠️ ANDROID_HOME was not inherited from /opt/actions-runner/.env — exporting from workflow."
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          if [ -d "$SDK_DIR/build-tools/${{ env.ANDROID_API_LEVEL }}.0.0" ]; then
            echo "$SDK_DIR/build-tools/${{ env.ANDROID_API_LEVEL }}.0.0" >> "$GITHUB_PATH"
          fi

      - name: Build Android APK
        id: build
        uses: ./.github/actions/build-android
        with:
          build-type: ${{ steps.version.outputs.build_type }}
          extra-gradle-flags: "--configuration-cache --configuration-cache-problems=warn"
        timeout-minutes: 40

      # LS-9603: upload the Hermes-composed sourcemap so Rollbar can symbolicate
      # release-build crashes (bytecode offsets -> real file/line/function
      # names). Keyed to EXPO_PUBLIC_APP_VERSION — the same code_version value
      # the mobile Rollbar SDK reports at runtime (getRollbarConfigFromEnv in
      # lib/rollbar/src/lib/rollbar.native.ts). Debug builds aren't uploaded —
      # they aren't distributed to real users, and Rollbar sourcemaps aren't
      # queryable/replaceable per-version, so only the version real crashes
      # will actually report against should get one.
      - name: Upload Hermes sourcemap to Rollbar
        if: steps.version.outputs.build_type == 'release'
        uses: ./.github/actions/rollbar-sourcemap-upload
        with:
          rollbar-access-token: ${{ secrets.ROLLBAR_ACCESS_TOKEN }}
          version: ${{ steps.version.outputs.version }}
          search-dir: apps/app/android/app/build
          minified-url: "app://android/index.android.bundle"

      - name: Set APK Name
        id: apk-name
        run: |
          BUILD_TYPE="${{ steps.version.outputs.build_type }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            APK_NAME="legacy-sports-${{ steps.version.outputs.version }}-${{ steps.version.outputs.commit_sha }}-debug.apk"
          else
            APK_NAME="legacy-sports-${{ steps.version.outputs.version }}-${{ steps.version.outputs.commit_sha }}.apk"
          fi
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-apk-${{ steps.version.outputs.build_type }}
          path: apps/app/android/${{ steps.build.outputs.apk-path }}
          retention-days: 3

  smoke-android:
    name: Boot Smoke (Emulator)
    # GH-hosted ubuntu-latest is used here (not the self-hosted m7a.xlarge runner)
    # because reactivecircus/android-emulator-runner requires KVM, which is exposed
    # on GH-hosted Linux runners but not on non-metal EC2 instances.
    runs-on: ubuntu-latest
    needs: build-android
    # Release APKs ship arm64-v8a + x86_64 so an x86_64 emulator can boot them.
    # Debug APKs ship arm64-v8a only and would require slow ARM emulation — out of scope.
    if: needs.build-android.outputs.build_type == 'release'
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        # Needed for scripts/ci/android-boot-smoke.sh — the emulator-runner
        # invokes its `script:` in the workspace dir, so the script file
        # must be on disk before that step runs.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-apk-${{ needs.build-android.outputs.build_type }}
          path: ./artifacts

      - name: AVD Cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-x86_64-google_apis

      - name: Boot emulator and verify APK launches
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6G
          force-avd-creation: false
          emulator-options: -no-window -no-snapshot-save -no-boot-anim -gpu swiftshader_indirect -noaudio -accel on
          disable-animations: true
          # Invoke the script as a single command — reactivecircus/android-emulator-runner
          # splits multi-line inline `script:` blocks across separate `sh -c` calls, which
          # breaks multi-line shell constructs like if/then/fi. See LS-4755 for details.
          script: bash scripts/ci/android-boot-smoke.sh

      # The script prints its capture to the job log too, but the log is
      # truncated in the GH UI and expires with the run. Keeping the raw file
      # means a boot failure can be diagnosed after the fact instead of
      # re-running the job to watch it happen again (LS-8821).
      - name: Upload boot logcat
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-boot-logcat
          path: ./artifacts/logcat-boot.txt
          if-no-files-found: warn
          retention-days: 14

  create-release:
    name: Create GitHub Release
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    needs: [build-android, smoke-android]
    # smoke-android is skipped for debug builds (arm64-only); accept skipped as well as success.
    if: |
      always() &&
      inputs.create_releases != false &&
      needs.build-android.result == 'success' &&
      (needs.smoke-android.result == 'success' || needs.smoke-android.result == 'skipped')

    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-apk-${{ needs.build-android.outputs.build_type }}
          path: ./artifacts

      - name: Rename APK
        run: |
          cd artifacts
          mv *.apk "${{ needs.build-android.outputs.apk_name }}"

      - name: Stable-named copy for QR / direct-download URL
        if: needs.build-android.outputs.build_type == 'release'
        run: |
          cp "artifacts/${{ needs.build-android.outputs.apk_name }}" \
             "artifacts/legacy-sports-latest.apk"
          sha256sum "artifacts/legacy-sports-latest.apk" | awk '{print $1}' \
             > "artifacts/legacy-sports-latest.apk.sha256"

      # LS-9454: publish the same bytes to the private bucket the gated download
      # route reads (LS-9455). This is additive — the public GitHub release
      # below is unchanged and still carries the APK.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME || 'arn:aws:iam::176661590736:role/legacy-sports-dev-github-actions' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish APK to private download bucket
        env:
          BUCKET: ${{ vars.APP_DOWNLOADS_BUCKET || 'legacy-sports-dev-app-downloads' }}
          APK_NAME: ${{ needs.build-android.outputs.apk_name }}
          VERSION: ${{ needs.build-android.outputs.version }}
          BUILD_NUMBER: ${{ needs.build-android.outputs.build_number }}
        run: |
          set -euo pipefail
          # Versioned key is written for every build type, so a debug build is
          # still retrievable by version without being reachable as "current".
          aws s3 cp "artifacts/${APK_NAME}" \
            "s3://${BUCKET}/android/v${VERSION}-${BUILD_NUMBER}/${APK_NAME}"
          echo "Published s3://${BUCKET}/android/v${VERSION}-${BUILD_NUMBER}/${APK_NAME}"

      - name: Update current APK pointer
        # Release builds only — a debug build must never become the artifact the
        # download route serves. Mirrors the gate on the stable-named copy above.
        if: needs.build-android.outputs.build_type == 'release'
        env:
          BUCKET: ${{ vars.APP_DOWNLOADS_BUCKET || 'legacy-sports-dev-app-downloads' }}
        run: |
          set -euo pipefail
          aws s3 cp "artifacts/legacy-sports-latest.apk" \
            "s3://${BUCKET}/android/current/legacy-sports-latest.apk"
          aws s3 cp "artifacts/legacy-sports-latest.apk.sha256" \
            "s3://${BUCKET}/android/current/legacy-sports-latest.apk.sha256"
          echo "Updated s3://${BUCKET}/android/current/legacy-sports-latest.apk"

      # Composed once and shared by both the primary action and the `gh api`
      # retry below, so the two paths cannot drift apart.
      - name: Compose release body
        env:
          VERSION: ${{ needs.build-android.outputs.version }}
          BUILD_NUMBER: ${{ needs.build-android.outputs.build_number }}
          COMMIT_SHA: ${{ needs.build-android.outputs.commit_sha }}
          BUILD_TYPE: ${{ needs.build-android.outputs.build_type }}
        run: |
          cat > "${RUNNER_TEMP}/release-body.md" <<EOF
          ## 🤖 Android APK Release

          **Version:** ${VERSION}
          **Build Number:** ${BUILD_NUMBER}
          **Commit:** ${COMMIT_SHA}
          **Build Type:** ${BUILD_TYPE}

          ### 📱 Installation Instructions
          1. Download the APK file below
          2. Enable "Install from Unknown Sources" in Android settings
          3. Install the APK on your Android device

          ### 🔧 Build Information
          - **Platform:** Android
          - **Build Type:** ${BUILD_TYPE}
          - **Java Version:** ${{ env.JAVA_VERSION }}
          - **Built with:** React Native 0.81 + Expo SDK 54
          EOF

      - name: Create Release
        id: release
        # Failure here is handled by the retry step below, not by ending the job.
        continue-on-error: true
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: android-v${{ needs.build-android.outputs.version }}-${{ needs.build-android.outputs.build_number }}
          name: "Android Release v${{ needs.build-android.outputs.version }} (${{ needs.build-android.outputs.commit_sha }})"
          draft: false
          prerelease: ${{ needs.build-android.outputs.build_type == 'debug' }}
          make_latest: ${{ needs.build-android.outputs.build_type == 'release' }}
          generate_release_notes: true
          body_path: ${{ runner.temp }}/release-body.md
          files: |
            ./artifacts/${{ needs.build-android.outputs.apk_name }}
            ./artifacts/legacy-sports-latest.apk
            ./artifacts/legacy-sports-latest.apk.sha256

      # LS-9913: port of the LS-9907 fix — softprops/action-gh-release classifies
      # *any* 403 as a permanent permission error and refuses to retry ("Skip
      # retry — your GitHub token/PAT does not have the required permission to
      # create a release"). That 403 is frequently a transient GitHub App
      # installation throttle rather than a real permission problem. Retrying
      # with backoff recovers the release instead of silently losing it.
      - name: Retry release creation
        id: release-retry
        if: steps.release.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-v${{ needs.build-android.outputs.version }}-${{ needs.build-android.outputs.build_number }}
          TITLE: "Android Release v${{ needs.build-android.outputs.version }} (${{ needs.build-android.outputs.commit_sha }})"
          BUILD_TYPE: ${{ needs.build-android.outputs.build_type }}
        run: |
          # Deliberately no `set -e`: a failed attempt inside the loop must fall
          # through to the next retry rather than abort the step.
          set -uo pipefail
          BODY="$(cat "${RUNNER_TEMP}/release-body.md")"
          PRERELEASE=false
          MAKE_LATEST=false
          if [ "${BUILD_TYPE}" = "debug" ]; then
            PRERELEASE=true
          fi
          if [ "${BUILD_TYPE}" = "release" ]; then
            MAKE_LATEST=true
          fi

          for attempt in 1 2 3; do
            backoff=$((attempt * 30))
            echo "::notice::Release retry ${attempt}/3 — waiting ${backoff}s for the transient failure to clear"
            sleep "${backoff}"

            # The first attempt can create the release and still report failure,
            # so check for an existing one before POSTing a duplicate.
            if url="$(gh release view "${TAG}" --json url --jq .url 2>/dev/null)"; then
              echo "::notice::Release ${TAG} already exists: ${url}"
              echo "url=${url}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            if url="$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
              --method POST \
              -f tag_name="${TAG}" \
              -f target_commitish="${GITHUB_SHA}" \
              -f name="${TITLE}" \
              -F draft=false \
              -F prerelease="${PRERELEASE}" \
              -F generate_release_notes=true \
              -f make_latest="${MAKE_LATEST}" \
              -f body="${BODY}" \
              --jq .html_url)"; then
              echo "::notice::Created release ${TAG} on retry ${attempt}: ${url}"
              echo "url=${url}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            echo "::warning::Release retry ${attempt}/3 failed for ${TAG}"
          done

          # Assembled in parts so the annotation stays a single line without
          # tripping yamllint's 200-character limit.
          MSG="Could not create GitHub release ${TAG} after 3 retries."
          MSG="${MSG} THE ANDROID BUILD ITSELF SUCCEEDED — the APK is still"
          MSG="${MSG} available as a workflow artifact on this run."
          MSG="${MSG} Only the release artifact is missing; create it manually"
          MSG="${MSG} with: gh release create ${TAG} --target ${GITHUB_SHA}"
          echo "::error::${MSG}"
          exit 1

      # LS-9979: `gh api ... POST` above only creates the release object — it
      # never runs softprops/action-gh-release's `files:` upload, so a release
      # recovered via the retry step above (including the "already exists"
      # branch, which can be a release a prior attempt created but never
      # finished attaching assets to) would otherwise ship with no APK.
      - name: Upload release asset (retry path)
        id: release-asset-retry
        if: steps.release-retry.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-v${{ needs.build-android.outputs.version }}-${{ needs.build-android.outputs.build_number }}
          APK_NAME: ${{ needs.build-android.outputs.apk_name }}
        run: |
          # --clobber makes each attempt idempotent: a retry-of-retry that
          # re-uploads an asset a prior attempt already attached succeeds
          # instead of failing on "asset already exists".
          set -uo pipefail
          for attempt in 1 2 3; do
            if gh release upload "${TAG}" \
              "./artifacts/${APK_NAME}" \
              ./artifacts/legacy-sports-latest.apk \
              ./artifacts/legacy-sports-latest.apk.sha256 \
              --clobber; then
              echo "::notice::Uploaded release asset(s) for ${TAG}"
              exit 0
            fi
            echo "::warning::Release asset upload retry ${attempt}/3 failed for ${TAG}"
            backoff=$((attempt * 30))
            sleep "${backoff}"
          done

          # Assembled in parts so the annotation stays a single line without
          # tripping yamllint's 200-character limit.
          MSG="Could not upload release asset(s) for ${TAG} after 3 retries."
          MSG="${MSG} The release exists but has no attached APK — upload"
          MSG="${MSG} manually with: gh release upload ${TAG} <file> --clobber"
          echo "::error::${MSG}"
          exit 1

      # Self-publish the "Released" date badge to the CI badges gist so the
      # README badge no longer depends on shields.io's shared GitHub token pool
      # (which renders "unable to select next github token from pool" whenever
      # that pool is rate-limited). Only release builds become `make_latest`, so
      # only they advance the badge — mirroring github/release-date semantics.
      - name: Publish Released date badge
        if: needs.build-android.outputs.build_type == 'release'
        shell: bash
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.CI_BADGES_GIST_ID }}
        run: |
          RELEASE_DATE=$(date -u '+%Y-%m-%d')

          # shields.io endpoint schema. Label/color/style match the previous
          # img.shields.io/github/release-date badge so the README is unchanged
          # visually. for-the-badge keeps it consistent with the Download button.
          if command -v jq >/dev/null 2>&1; then
            jq -n --arg message "$RELEASE_DATE" '{
              schemaVersion: 1,
              label: "Released",
              message: $message,
              color: "C5A55A",
              namedLogo: "github",
              logoColor: "white",
              style: "for-the-badge",
              cacheSeconds: 300
            }' > Released.json
            PAYLOAD=$(jq -n --rawfile content Released.json \
              '{files: {"Released.json": {content: $content}}}')
          else
            # jq-less fallback (no escaping needed — the date has no special chars)
            printf '{"schemaVersion":1,"label":"Released","message":"%s","color":"C5A55A","namedLogo":"github","logoColor":"white","style":"for-the-badge","cacheSeconds":300}' \
              "$RELEASE_DATE" > Released.json
            BADGE_CONTENT=$(sed 's/\\/\\\\/g; s/"/\\"/g' Released.json | tr -d '\n')
            PAYLOAD="{\"files\":{\"Released.json\":{\"content\":\"${BADGE_CONTENT}\"}}}"
          fi

          HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/released_badge_response.json \
            -X PATCH \
            -H "Authorization: Bearer ${GIST_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/gists/${GIST_ID}" \
            -d "$PAYLOAD")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Released badge updated to ${RELEASE_DATE}"
          else
            echo "❌ Failed to update Released badge (HTTP ${HTTP_CODE})"
            cat /tmp/released_badge_response.json
            exit 1
          fi

  notify:
    name: Notify Build Results
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    needs: [build-android, smoke-android, create-release]
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build commit changelog
        id: changelog
        if: needs.build-android.result == 'success' && needs.create-release.result == 'success'
        shell: bash
        run: |
          BEFORE="${{ github.event.before }}"

          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            # Push event: show only commits in this specific push
            COMMITS=$(git log "${BEFORE}..HEAD" \
              --pretty=format:'[`%h`](https://github.com/${{ github.repository }}/commit/%H) %s' \
              --first-parent)
          else
            # workflow_dispatch or first push: fall back to last 20 commits
            COMMITS=$(git log --pretty=format:'[`%h`](https://github.com/${{ github.repository }}/commit/%H) %s' \
              --first-parent -20)
          fi

          {
            echo "commits<<CHANGELOG_EOF"
            echo "$COMMITS"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compute release tag
        id: meta
        if: needs.build-android.result == 'success' && needs.create-release.result == 'success'
        run: |
          TAG="android-v${{ needs.build-android.outputs.version }}-${{ needs.build-android.outputs.build_number }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/${{ github.repository }}/releases/tag/${TAG}" >> "$GITHUB_OUTPUT"

      - name: Discord Release Notification
        if: needs.build-android.result == 'success' && needs.create-release.result == 'success'
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          status: success
          title: "Android Release ${{ steps.meta.outputs.tag }}"
          description: "A new Android release. [View on GitHub](${{ steps.meta.outputs.url }})"
          commits: ${{ steps.changelog.outputs.commits }}
          thread-name: "Android Release ${{ steps.meta.outputs.tag }}"

      - name: Build Summary
        run: |
          echo "## 📱 Android Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.build-android.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Number:** ${{ needs.build-android.outputs.build_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ needs.build-android.outputs.commit_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type:** ${{ needs.build-android.outputs.build_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Android Status:** ${{ needs.build-android.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Boot Smoke Status:** ${{ needs.smoke-android.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Status:** ${{ needs.create-release.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.build-android.result }}" == "success" ]; then
            echo "✅ **Android APK built successfully!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📦 **Download:** Check the releases page or artifacts section above." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Android build failed.** Check the logs above for details." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check Build Artifacts
        if: needs.build-android.result == 'success'
        run: |
          echo "Build artifacts information:"
          echo "APK Name: ${{ needs.build-android.outputs.apk_name }}"
          echo "APK Path: ${{ needs.build-android.outputs.apk_path }}"

      - name: Update Deployment Badge
        if: always()
        uses: ./.github/actions/update-deployment-badge
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          gist-id: ${{ secrets.CI_BADGES_GIST_ID }}
          deployment-name: "Build Android APK"
          deployment-status: ${{ needs.build-android.result }}
          workflow-run-id: ${{ github.run_id }}
          branch: ${{ github.ref_name }}
