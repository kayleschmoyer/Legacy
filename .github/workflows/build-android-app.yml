name: Build Android App

on:
  push:
    branches: [main]
    paths:
      - 'apps/app/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
      create_releases:
        description: 'Create GitHub Releases'
        required: false
        default: true
        type: boolean

# Cancel in-progress builds for the same workflow
concurrency:
  group: ${{ github.workflow }}-android-${{ github.event.inputs.build_type || 'release' }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'

jobs:
  setup:
    name: Setup and Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      commit_sha: ${{ steps.version.outputs.commit_sha }}
      build_type: ${{ steps.platform.outputs.build_type }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Extract Version Info
        id: version
        run: |
          VERSION=$(node -p "require('./apps/app/package.json').version")
          COMMIT_SHA=${GITHUB_SHA:0:7}
          BUILD_NUMBER=$(date +%Y%m%d_%H%M%S)

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Set Build Type
        id: platform
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: setup
    outputs:
      apk_path: ${{ steps.build.outputs.apk_path }}
      apk_name: ${{ steps.build.outputs.apk_name }}

    steps:
      - name: Verify Branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "❌ This workflow only runs on main branch or manual dispatch"
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Nx SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/app/android/.gradle
            apps/app/android/app/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate React Native Bundle
        run: |
          cd apps/app
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/

      - name: Build Android APK
        id: build
        run: |
          cd apps/app/android

          # Determine build type
          BUILD_TYPE="${{ needs.setup.outputs.build_type }}"

          if [ "$BUILD_TYPE" == "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
            APK_NAME="legacy-sports-${{ needs.setup.outputs.version }}-${{ needs.setup.outputs.commit_sha }}.apk"
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
            APK_NAME="legacy-sports-${{ needs.setup.outputs.version }}-${{ needs.setup.outputs.commit_sha }}-debug.apk"
          fi

          # Verify APK was created
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK not found at $APK_PATH"
            exit 1
          fi

          # Get APK info
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "✅ APK built successfully: $APK_SIZE"
          ls -la "$APK_PATH"

          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ needs.setup.outputs.build_type }}
          path: apps/app/android/${{ steps.build.outputs.apk_path }}
          retention-days: 30

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [setup, build-android]
    if: github.event.inputs.create_releases != 'false'

    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk-${{ needs.setup.outputs.build_type }}
          path: ./artifacts

      - name: Rename APK
        run: |
          cd artifacts
          mv *.apk "${{ needs.build-android.outputs.apk_name }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ needs.setup.outputs.version }}-${{ needs.setup.outputs.build_number }}
          name: 'Android Release v${{ needs.setup.outputs.version }} (${{ needs.setup.outputs.commit_sha }})'
          draft: false
          prerelease: ${{ needs.setup.outputs.build_type == 'debug' }}
          generate_release_notes: true
          body: |
            ## 🤖 Android APK Release

            **Version:** ${{ needs.setup.outputs.version }}  
            **Build Number:** ${{ needs.setup.outputs.build_number }}  
            **Commit:** ${{ needs.setup.outputs.commit_sha }}  
            **Build Type:** ${{ needs.setup.outputs.build_type }}

            ### 📱 Installation Instructions
            1. Download the APK file below
            2. Enable "Install from Unknown Sources" in Android settings
            3. Install the APK on your Android device

            ### 🔧 Build Information
            - **Platform:** Android
            - **Build Type:** ${{ needs.setup.outputs.build_type }}
            - **Java Version:** ${{ env.JAVA_VERSION }}
            - **Built with:** React Native + Expo SDK 52
          files: ./artifacts/${{ needs.build-android.outputs.apk_name }}

  notify:
    name: Notify Build Results
    runs-on: ubuntu-latest
    needs: [setup, build-android, create-release]
    if: always()

    steps:
      - name: Build Summary
        run: |
          echo "## 📱 Android Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.setup.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Number:** ${{ needs.setup.outputs.build_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ needs.setup.outputs.commit_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type:** ${{ needs.setup.outputs.build_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Android Status:** ${{ needs.build-android.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Status:** ${{ needs.create-release.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.build-android.result }}" == "success" ]; then
            echo "✅ **Android APK built successfully!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📦 **Download:** Check the releases page or artifacts section above." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Android build failed.** Check the logs above for details." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check Build Artifacts
        if: needs.build-android.result == 'success'
        run: |
          echo "Build artifacts information:"
          echo "APK Name: ${{ needs.build-android.outputs.apk_name }}"
          echo "APK Path: ${{ needs.build-android.outputs.apk_path }}"
