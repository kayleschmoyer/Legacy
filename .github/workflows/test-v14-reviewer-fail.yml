name: Test V14 Reviewer Failure Path

# Manually trigger the reviewer with REVIEWER_FORCE_FAIL=true to exercise:
#   - withRetry exhaustion (30s / 90s / 270s backoff)
#   - postInfraErrorReview (REQUEST_CHANGES with "Review bot infrastructure error" body)
#   - addLabelAsApp('review-bot-degraded')
#   - W4 self-healing trigger (label application fires the real reviewer without force-fail)
#
# workflow_dispatch is required here so this workflow lives on the default branch
# (GitHub only runs workflow_dispatch triggers for workflows on the default branch).
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to run the failure-path reviewer against"
        required: true
        type: number

permissions:
  contents: read
  id-token: write # required for OIDC auth to AWS (S3 reviewer telemetry)
  actions: write # required to dispatch label-pager.yml for W4 AC4 verification

jobs:
  reviewer-force-fail:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - name: Generate reviewer app token
        id: reviewer-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        with:
          client-id: ${{ vars.REVIEWER_BOT_APP_ID || '3142924' }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - name: Configure AWS credentials
        continue-on-error: true # telemetry is best-effort; don't block on auth failure
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6
        with:
          role-to-assume: ${{ vars.AWS_CI_ARTIFACTS_ROLE_ARN || 'arn:aws:iam::176661590736:role/legacy-sports-dev-ci-artifacts' }}
          aws-region: us-east-1
      - name: Fetch PR head SHA
        id: pr-sha
        env:
          GH_TOKEN: ${{ steps.reviewer-token.outputs.token }}
        run: |
          sha=$(gh pr view ${{ inputs.pr_number }} --json headRefOid --jq '.headRefOid')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Run reviewer (force-fail mode)
        continue-on-error: true # reviewer exits non-zero after retry exhaustion — expected
        env:
          GH_TOKEN: ${{ steps.reviewer-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD_SHA: ${{ steps.pr-sha.outputs.sha }}
          LLM_PROVIDER: gemini
          REVIEWER_MODEL: gemini-2.5-flash
          REVIEWER_BOT_APP_ID: ${{ vars.REVIEWER_BOT_APP_ID || '3142924' }}
          REVIEWER_BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          REVIEWER_TELEMETRY_BUCKET: ${{ vars.REVIEWER_TELEMETRY_BUCKET || 'legacy-sports-dev-reviewer-telemetry' }}
          REVIEWER_FORCE_FAIL: "true"
          GEMINI_CODE_REVIEW_API_KEY: ${{ secrets.GEMINI_CODE_REVIEW_API_KEY }}
        run: |
          echo "[test-v14] Running reviewer with REVIEWER_FORCE_FAIL=true against PR #${{ inputs.pr_number }}"
          node .github/scripts/reviewer/index.mjs
      - name: Verify force-fail completed
        run: echo '[test-v14] Reviewer force-fail run complete — verify REQUEST_CHANGES and review-bot-degraded label on PR #${{ inputs.pr_number }}'
      - name: Verify review-bot-degraded label applied (AC3)
        env:
          GH_TOKEN: ${{ steps.reviewer-token.outputs.token }}
        run: |
          labels=$(gh pr view "${{ inputs.pr_number }}" --json labels --jq '[.labels[].name]')
          if echo "$labels" | grep -q '"review-bot-degraded"'; then
            echo "[test-v14] review-bot-degraded label confirmed on PR #${{ inputs.pr_number }} — AC3 verified"
          else
            echo "ERROR: review-bot-degraded label not found on PR #${{ inputs.pr_number }}"
            echo "Current labels: $labels"
            exit 1
          fi
      - name: Trigger W4 (label-pager) — verify escalation page fires (AC4)
        # GitHub does not deliver pull_request.labeled events when labels are applied from
        # workflow_dispatch context (LS-4120), so we manually dispatch label-pager.yml here.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dispatch_after=$(date -u -d '-5 seconds' '+%Y-%m-%dT%H:%M:%SZ')
          gh workflow run label-pager.yml \
            --ref "$GITHUB_REF_NAME" \
            -f pr_number=${{ inputs.pr_number }} \
            -f label_name=review-bot-degraded
          echo "[test-v14] W4 dispatched; polling for run ID..."
          run_id=""
          for i in $(seq 1 12); do
            sleep 5
            run_id=$(gh run list --workflow=label-pager.yml --limit=10 --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"$dispatch_after\")] | .[0].databaseId // empty")
            if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
              echo "[test-v14] W4 run $run_id found (attempt $i/12)"
              break
            fi
            echo "[test-v14] Waiting for W4 run... (attempt $i/12)"
          done
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "ERROR: W4 (label-pager) run did not appear within ~60s of dispatch"
            exit 1
          fi
          gh run watch "$run_id" --exit-status
          echo "[test-v14] W4 (label-pager) completed successfully — AC4 verified"
      - name: Simulate W1 self-healing — run reviewer without force-fail (AC5)
        # Mirrors what review.yml does when triggered by the review-bot-degraded labeled event.
        # The reviewer posts a real review and removes the review-bot-degraded label.
        env:
          GEMINI_CODE_REVIEW_API_KEY: ${{ secrets.GEMINI_CODE_REVIEW_API_KEY }}
          GH_TOKEN: ${{ steps.reviewer-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD_SHA: ${{ steps.pr-sha.outputs.sha }}
          LLM_PROVIDER: gemini
          REVIEWER_MODEL: gemini-2.5-flash
          REVIEWER_BOT_APP_ID: ${{ vars.REVIEWER_BOT_APP_ID || '3142924' }}
          REVIEWER_BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          REVIEWER_TELEMETRY_BUCKET: ${{ vars.REVIEWER_TELEMETRY_BUCKET || 'legacy-sports-dev-reviewer-telemetry' }}
        run: |
          echo "[test-v14] Simulating W1 self-healing: running reviewer without REVIEWER_FORCE_FAIL against PR #${{ inputs.pr_number }}"
          node .github/scripts/reviewer/index.mjs
          echo "[test-v14] W1 self-healing simulation complete — AC5 verified"
