name: Deploy Draft Processor Lambda

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lambdas/draft-processor/**"
      - ".github/workflows/deploy-draft-processor.yml"

# Prevent concurrent deployments of the same Lambda
# Terraform state locking (DynamoDB) handles cross-Lambda conflicts
concurrency:
  group: lambda-deployment-draft-processor
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_SERVICE_NAME: legacy-sports-draft-processor
  AWS_STAGE: dev
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy Draft Processor Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true

      - name: Validate Deployment Readiness
        uses: ./.github/actions/deployment-gate
        with:
          artifacts-ready: "true"
          quality-passed: "true"
          required-components: ""
          environment: "production"

      - name: "☁️ Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::176661590736:role/legacy-sports-dev-github-actions
          role-session-name: GitHubActions-DeployDraftProcessor
          aws-region: ${{ env.AWS_REGION }}

      - name: 🏗️ Build and Package Draft Processor Lambda
        id: build
        uses: ./.github/actions/build-lambda
        with:
          lambda-name: draft-processor
          aws-region: ${{ env.AWS_REGION }}
          aws-stage: ${{ env.AWS_STAGE }}

      - name: 🚀 Deploy Draft Processor Infrastructure
        uses: ./.github/actions/deploy-lambda-infrastructure
        with:
          lambda-name: draft-processor
          terraform-target: aws_lambda_function.draft_processor
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Deployment Badge
        if: always()
        uses: ./.github/actions/update-deployment-badge
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          gist-id: ${{ secrets.CI_BADGES_GIST_ID }}
          deployment-name: "Draft Processor Lambda"
          deployment-status: ${{ job.status }}
          workflow-run-id: ${{ github.run_id }}
          branch: ${{ github.ref_name }}
