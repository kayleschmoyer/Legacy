name: Deploy Draft Processor Lambda

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lambdas/draft-processor/**"
      - ".github/workflows/deploy-draft-processor.yml"

# Cancel in-progress deployments for the same workflow
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  AWS_SERVICE_NAME: legacy-sports-draft-processor
  AWS_STAGE: dev

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy Draft Processor Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true

      - name: Validate Deployment Readiness
        uses: ./.github/actions/deployment-gate
        with:
          artifacts-ready: 'true'
          quality-passed: 'true'
          required-components: ''
          environment: 'production'

      - name: "☁️ Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::176661590736:role/legacy-sports-dev-github-actions
          role-session-name: GitHubActions-DeployDraftProcessor
          aws-region: ${{ env.AWS_REGION }}

      - name: Build Draft Processor Lambda
        run: |
          echo "🚀 Building Draft Processor Lambda specifically..."
          echo "::notice::Building only draft-processor project for targeted deployment"
          
          # Build only the draft-processor and its dependencies
          if npx nx build draft-processor --verbose 2>&1 | tee build.log; then
            echo "✅ Draft Processor Lambda built successfully"
            
            # Verify build artifacts exist
            if [ -f "lambdas/draft-processor/dist/index.js" ]; then
              echo "✅ Build artifacts verified: lambdas/draft-processor/dist/index.js"
              BUILD_SIZE=$(du -sh lambdas/draft-processor/dist/index.js | cut -f1)
              echo "📊 Draft Processor Lambda bundle size: $BUILD_SIZE"
            else
              echo "❌ Build artifacts missing: lambdas/draft-processor/dist/index.js"
              exit 1
            fi
            
            echo "## 🚀 Draft Processor Lambda Build Summary" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
            echo "- **Project**: draft-processor" >> $GITHUB_STEP_SUMMARY
            echo "- **Bundle Size**: $BUILD_SIZE" >> $GITHUB_STEP_SUMMARY
            echo "- **Output**: lambdas/draft-processor/dist/" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Draft Processor Lambda build failed"
            echo "## ❌ Build Errors" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            tail -20 build.log >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Package and Deploy Draft Processor Lambda
        working-directory: lambdas/draft-processor
        run: |
          # Create version string
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          COMMIT_SHA=$(echo $GITHUB_SHA | cut -c1-8)
          VERSION="${TIMESTAMP}-${COMMIT_SHA}"

          # Create deployment package from built artifacts
          zip -r "draft-processor-${VERSION}.zip" dist/

          # Get S3 bucket name from SSM parameter store
          echo "🔍 Getting S3 bucket name from SSM..."
          if S3_BUCKET=$(aws ssm get-parameter --name "/legacy-sports/${AWS_STAGE}/s3/lambda-deployments-bucket" --query "Parameter.Value" --output text --region ${{ env.AWS_REGION }} 2>/dev/null); then
            echo "✅ Found S3 bucket from SSM: $S3_BUCKET"
          else
            echo "⚠️ SSM parameter not found, using default bucket name"
            S3_BUCKET="legacy-sports-dev-lambdas-cca20ad9"
          fi

          # Upload to S3
          aws s3 cp "draft-processor-${VERSION}.zip" "s3://${S3_BUCKET}/draft-processor/" --region ${{ env.AWS_REGION }}

          # Update SSM parameter
          aws ssm put-parameter \
            --name "/legacy-sports/${AWS_STAGE}/lambda/draft-processor/version" \
            --value "$VERSION" \
            --overwrite \
            --region ${{ env.AWS_REGION }}

          echo "✅ Lambda package uploaded: draft-processor-${VERSION}.zip"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "S3_BUCKET=${S3_BUCKET}" >> $GITHUB_ENV

      - name: "🏗️ Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13"

      - name: "🔧 Initialize Terraform"
        working-directory: terraform
        run: |
          echo "🔧 Initializing Terraform..."
          if terraform init; then
            echo "✅ Terraform initialization successful"
          else
            echo "❌ Terraform initialization failed"
            echo "## Terraform Initialization Errors" >> $GITHUB_STEP_SUMMARY
            echo "Check that:" >> $GITHUB_STEP_SUMMARY
            echo "- Terraform configuration files exist in terraform/" >> $GITHUB_STEP_SUMMARY
            echo "- Backend configuration is valid" >> $GITHUB_STEP_SUMMARY
            echo "- AWS credentials are properly configured" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: "🚀 Deploy Infrastructure"
        working-directory: terraform
        run: |
          echo "📋 Planning Terraform changes..."
          terraform plan -target=aws_lambda_function.draft_processor
          
          echo "🚀 Applying Terraform changes..."
          terraform apply -target=aws_lambda_function.draft_processor -auto-approve
          
          echo "✅ Infrastructure deployment completed"

      - name: Update Deployment Badge
        if: always()
        uses: ./.github/actions/update-deployment-badge
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          gist-id: ${{ secrets.CI_BADGES_GIST_ID }}
          deployment-name: "Draft Processor Lambda"
          deployment-status: ${{ job.status }}
          workflow-run-id: ${{ github.run_id }}
          branch: ${{ github.ref_name }}
