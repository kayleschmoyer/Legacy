name: Setup NPM

runs:
  using: "composite"
  steps:
    # Cache node_modules
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Get Node Version
      id: full-node-version
      shell: bash
      run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"

    - name: Set up NPM cache
      uses: actions/cache@v2
      id: cached-npm-dependencies
      with:
        path: node_modules
        key: root-node_modules-${{ runner.os }}-${{ steps.full-node-version.outputs.version }}-${{ hashFiles('**/package-lock.json') }}

    - name: Install NPM Dependencies
      if: steps.cached-npm-dependencies.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --legacy-peer-deps
