name: Setup NPM
description: Setup Node.js and NPM with caching

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Get Node Version
      id: full-node-version
      shell: bash
      run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"

    - name: Cache node_modules
      uses: actions/cache@v4
      id: cached-npm-dependencies
      with:
        path: node_modules
        key: node_modules-${{ runner.os }}-${{ steps.full-node-version.outputs.version }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          node_modules-${{ runner.os }}-${{ steps.full-node-version.outputs.version }}-
          node_modules-${{ runner.os }}-

    - name: Install Dependencies
      if: steps.cached-npm-dependencies.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --legacy-peer-deps
