name: Setup NPM
description: Setup Node.js and install NPM dependencies with caching

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '20'
  working-directory:
    description: 'Working directory for npm operations'
    required: false
    default: '.'
  skip-cache:
    description: 'Skip cache and force fresh install'
    required: false
    default: 'false'

outputs:
  cache-hit:
    description: 'Whether dependencies were restored from cache'
    value: ${{ steps.install-deps.outputs.cache-hit }}
  node-version:
    description: 'The Node.js version being used'
    value: ${{ steps.install-deps.outputs.node-version }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Install Dependencies
      id: install-deps
      uses: ./.github/workflows/install-dependencies
      with:
        working-directory: ${{ inputs.working-directory }}
        skip-cache: ${{ inputs.skip-cache }}
        cache-prefix: 'npm-deps'
