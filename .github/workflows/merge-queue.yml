name: Enhanced Merge Queue

on:
  # Manual trigger for on-demand queue processing
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no actual merging)"
        type: boolean
        default: false
      force_check:
        description: "Force check all PRs even if not labeled"
        type: boolean
        default: false
      is_retry:
        description: "Internal: set by self-dispatch when retrying after pending checks (prevents recursive retries)"
        type: boolean
        default: false
  # Trigger on pull request events for immediate response
  pull_request:
    types:
      - labeled # When merge-when-ready label is added
      - unlabeled # When label is removed
      # NOTE: 'synchronize' and 'reopened' are intentionally omitted.
      # They fire before CI registers check runs on the new SHA, which causes
      # validateStatusChecks to see an empty check list and incorrectly conclude
      # all checks are passing — merging the PR before CI has even started.
      # The 'workflow_run' trigger below handles re-evaluation once CI finishes.
  # Trigger on PR review events
  pull_request_review:
    types: [submitted] # When someone approves/requests changes
  # NOTE: GitHub Actions does NOT support 'pull_request_review_thread' as a
  # workflow trigger. Supported pull-request-related triggers are
  # pull_request, pull_request_review, pull_request_review_comment, and
  # pull_request_target. Adding pull_request_review_thread caused this
  # workflow file to fail GitHub's expression validator entirely and
  # register with name = file path. The "thread resolved without an
  # accompanying review submission" gap is now covered by the manual
  # `gh workflow run merge-queue.yml` dispatch and by the workflow_run
  # rerun on the next CI Orchestrator completion.
  # Trigger when CI Orchestrator workflow completes for PR branches (not push-to-main)
  workflow_run:
    workflows: ["Legacy Sports CI Orchestrator"]
    types: [completed]
    branches-ignore:
      - main

# Ensure only one merge queue run processes at a time to prevent race conditions
concurrency:
  group: merge-queue
  cancel-in-progress: false

jobs:
  process-merge-queue:
    if: |
      github.repository_owner == 'bkrupa' && 
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
        github.event_name == 'pull_request_review' ||
        (github.event_name == 'pull_request' && github.event.action == 'labeled' && (github.event.label.name == 'merge-when-ready' || github.event.label.name == 'merge-to-parent')) ||
        (github.event_name == 'pull_request' && github.event.action == 'unlabeled' && (github.event.label.name == 'merge-when-ready' || github.event.label.name == 'merge-to-parent'))
      )
    # Prefer self-hosted runner when available to avoid consuming GitHub Actions
    # budget. This job only makes API calls — no builds or node_modules needed.
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
      statuses: read
      actions: write

    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.MERGE_QUEUE_APP_ID }}
          private-key: ${{ secrets.MERGE_QUEUE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: true

      # ── Lightweight comment steps (inlined from merge-queue-management) ──

      - name: Comment – Added to Merge Queue
        if: |
          github.event_name == 'pull_request' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'merge-when-ready'
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const pr = context.payload.pull_request;
            const targetsMain = pr.base.ref === 'main';
            const parentNote = targetsMain
              ? ''
              : '\n\n> ⚠️ This PR targets `' + pr.base.ref + '` (non-main). ' +
                'You must also add the `merge-to-parent` label before it can be merged.';
            await github.rest.issues.createComment({
              issue_number: pr.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 **Added to merge queue!**\n\n' +
                    'This PR will be automatically merged when:\n' +
                    '- All status checks pass ✅\n' +
                    '- No merge conflicts exist ✅\n' +
                    '- No unresolved review comments ✅\n' +
                    '- Required reviews are approved ✅\n' +
                    (targetsMain ? '' : '- `merge-to-parent` label is present ✅\n') +
                    '\nThe merge queue responds immediately to status changes, new commits, and reviews. ' +
                    'Remove the `merge-when-ready` label to exit the queue.' +
                    parentNote
            });

      - name: Comment – Removed from Merge Queue
        if: |
          github.event_name == 'pull_request' &&
          github.event.action == 'unlabeled' &&
          github.event.label.name == 'merge-when-ready'
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const pr = context.payload.pull_request;
            await github.rest.issues.createComment({
              issue_number: pr.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⏹️ **Removed from merge queue.**\n\n' +
                    'This PR will no longer be automatically merged. ' +
                    'Add the `merge-when-ready` label to add it back to the queue.'
            });

      - name: Comment – merge-to-parent Added
        if: |
          github.event_name == 'pull_request' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'merge-to-parent'
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const pr = context.payload.pull_request;
            const targetsMain = pr.base.ref === 'main';
            const body = targetsMain
              ? '🏷️ **`merge-to-parent` label added** — but this PR targets `main`, so only `merge-when-ready` is needed.'
              : '🏷️ **`merge-to-parent` label added.**\n\n' +
                'This PR targets `' + pr.base.ref + '` (non-main). Both `merge-when-ready` **and** `merge-to-parent` are required for the merge queue to process it.';
            await github.rest.issues.createComment({
              issue_number: pr.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Comment – merge-to-parent Removed
        if: |
          github.event_name == 'pull_request' &&
          github.event.action == 'unlabeled' &&
          github.event.label.name == 'merge-to-parent'
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const pr = context.payload.pull_request;
            if (pr.base.ref !== 'main') {
              await github.rest.issues.createComment({
                issue_number: pr.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '⏹️ **`merge-to-parent` label removed.**\n\n' +
                      'This PR targets `' + pr.base.ref + '` (non-main) and requires both `merge-when-ready` and `merge-to-parent` to be merged automatically.'
              });
            }

      # ── Heavy merge-queue processing ──

      # When multiple CI runs complete within seconds, multiple workflow_run triggers
      # fire. With cancel-in-progress: false, the concurrency group serializes runs:
      # one executes while one queues, and any further arrivals replace the queued run.
      # This sleep works WITH that behavior — while the running job sleeps, new triggers
      # replace the single queued slot, so when this run finishes processing, only the
      # most recent trigger remains to execute (which then scans all merge-ready PRs).
      - name: Debounce (let concurrent triggers settle)
        if: github.event_name == 'workflow_run' || github.event_name == 'pull_request_review'
        run: sleep 30

      - name: Process Enhanced Merge Queue
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const isDryRun = ${{ github.event.inputs.dry_run || false }};
            const forceCheck = ${{ github.event.inputs.force_check || false }};
            const isRetry = ${{ github.event.inputs.is_retry || false }};
            await require('./.github/scripts/merge-queue-processor.js')({ github, context, isDryRun, forceCheck, isRetry });
