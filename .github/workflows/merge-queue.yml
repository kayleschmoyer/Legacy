name: Enhanced Merge Queue

on:
  # Manual trigger for on-demand queue processing
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no actual merging)"
        type: boolean
        default: false
      force_check:
        description: "Force check all PRs even if not labeled"
        type: boolean
        default: false
  # Trigger on pull request events for immediate response
  pull_request:
    types:
      - labeled # When merge-when-ready label is added
      - unlabeled # When label is removed
      # NOTE: 'synchronize' and 'reopened' are intentionally omitted.
      # They fire before CI registers check runs on the new SHA, which causes
      # validateStatusChecks to see an empty check list and incorrectly conclude
      # all checks are passing — merging the PR before CI has even started.
      # The 'workflow_run' trigger below handles re-evaluation once CI finishes.
  # Trigger on PR review events
  pull_request_review:
    types: [submitted] # When someone approves/requests changes
  # Trigger when CI Orchestrator workflow completes for PR branches (not push-to-main)
  workflow_run:
    workflows: ["🧠 Legacy Sports CI Orchestrator"]
    types: [completed]
    branches-ignore:
      - main

# Ensure only one merge queue run processes at a time to prevent race conditions
concurrency:
  group: merge-queue
  cancel-in-progress: false

jobs:
  process-merge-queue:
    if: |
      github.repository_owner == 'bkrupa' && 
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
        github.event_name == 'pull_request_review' ||
        (github.event_name == 'pull_request' && github.event.action == 'labeled' && (github.event.label.name == 'merge-when-ready' || github.event.label.name == 'merge-to-parent')) ||
        (github.event_name == 'pull_request' && github.event.action == 'unlabeled' && (github.event.label.name == 'merge-when-ready' || github.event.label.name == 'merge-to-parent'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
      statuses: read

    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MERGE_QUEUE_APP_ID }}
          private-key: ${{ secrets.MERGE_QUEUE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: true

      # ── Lightweight comment steps (inlined from merge-queue-management) ──

      - name: Comment – Added to Merge Queue
        if: |
          github.event_name == 'pull_request' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'merge-when-ready'
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const pr = context.payload.pull_request;
            const targetsMain = pr.base.ref === 'main';
            const parentNote = targetsMain
              ? ''
              : '\n\n> ⚠️ This PR targets `' + pr.base.ref + '` (non-main). ' +
                'You must also add the `merge-to-parent` label before it can be merged.';
            await github.rest.issues.createComment({
              issue_number: pr.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 **Added to merge queue!**\n\n' +
                    'This PR will be automatically merged when:\n' +
                    '- All status checks pass ✅\n' +
                    '- No merge conflicts exist ✅\n' +
                    '- No unresolved review comments ✅\n' +
                    '- Required reviews are approved ✅\n' +
                    (targetsMain ? '' : '- `merge-to-parent` label is present ✅\n') +
                    '\nThe merge queue responds immediately to status changes, new commits, and reviews. ' +
                    'Remove the `merge-when-ready` label to exit the queue.' +
                    parentNote
            });

      - name: Comment – Removed from Merge Queue
        if: |
          github.event_name == 'pull_request' &&
          github.event.action == 'unlabeled' &&
          github.event.label.name == 'merge-when-ready'
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const pr = context.payload.pull_request;
            await github.rest.issues.createComment({
              issue_number: pr.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⏹️ **Removed from merge queue.**\n\n' +
                    'This PR will no longer be automatically merged. ' +
                    'Add the `merge-when-ready` label to add it back to the queue.'
            });

      - name: Comment – merge-to-parent Added
        if: |
          github.event_name == 'pull_request' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'merge-to-parent'
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const pr = context.payload.pull_request;
            const targetsMain = pr.base.ref === 'main';
            const body = targetsMain
              ? '🏷️ **`merge-to-parent` label added** — but this PR targets `main`, so only `merge-when-ready` is needed.'
              : '🏷️ **`merge-to-parent` label added.**\n\n' +
                'This PR targets `' + pr.base.ref + '` (non-main). Both `merge-when-ready` **and** `merge-to-parent` are required for the merge queue to process it.';
            await github.rest.issues.createComment({
              issue_number: pr.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Comment – merge-to-parent Removed
        if: |
          github.event_name == 'pull_request' &&
          github.event.action == 'unlabeled' &&
          github.event.label.name == 'merge-to-parent'
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const pr = context.payload.pull_request;
            if (pr.base.ref !== 'main') {
              await github.rest.issues.createComment({
                issue_number: pr.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '⏹️ **`merge-to-parent` label removed.**\n\n' +
                      'This PR targets `' + pr.base.ref + '` (non-main) and requires both `merge-when-ready` and `merge-to-parent` to be merged automatically.'
              });
            }

      # ── Heavy merge-queue processing ──

      - name: Process Enhanced Merge Queue
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const isDryRun = ${{ github.event.inputs.dry_run || false }};
            const forceCheck = ${{ github.event.inputs.force_check || false }};
            const isTriggeredByWorkflow = context.eventName === 'workflow_run';

            console.log(`🔄 Starting merge queue processing (${isDryRun ? 'DRY RUN' : 'LIVE'})...`);
            if (isTriggeredByWorkflow) {
              console.log(`⚡ Triggered by CI Orchestrator completion - checking merge-ready PRs`);
            }

            // Get PRs with merge-when-ready label (or all if force_check is true)
            // Use paginate to fetch ALL open PRs (default page size is 30)
            const allPRs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            const mergeReadyPRs = forceCheck 
              ? allPRs 
              : allPRs.filter(pr => 
                  pr.labels.some(label => label.name === 'merge-when-ready')
                );

            console.log(`📋 Found ${mergeReadyPRs.length} PRs with merge-when-ready label (from ${allPRs.length} open)`);

            for (const pr of mergeReadyPRs) {
              console.log(`\n🔍 Processing PR #${pr.number}: ${pr.title}`);
              
              try {
                // Get fresh PR details
                const prDetails = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: pr.number
                });
                
                // Validate PR state
                const validationResult = await validatePRForMerge(prDetails.data);
                
                if (validationResult.canMerge) {
                  console.log(`✅ PR #${pr.number} is ready for merge`);
                  
                  if (!isDryRun) {
                    await performMerge(prDetails.data);
                  } else {
                    console.log(`🏃 DRY RUN: Would merge PR #${pr.number}`);
                  }
                } else {
                  console.log(`❌ PR #${pr.number} cannot be merged: ${validationResult.reason}`);
                  await reportMergeBlocker(prDetails.data, validationResult);
                }
                
              } catch (error) {
                console.error(`💥 Error processing PR #${pr.number}: ${error.message}`);
                await reportProcessingError(pr, error);
              }
            }

            console.log(`\n🏁 Merge queue processing complete`);

            // Helper Functions
            async function validatePRForMerge(pr) {
              // Check if PR is draft
              if (pr.draft) {
                return { canMerge: false, reason: 'PR is in draft state' };
              }
              
              // For non-main targets, require the merge-to-parent label
              if (pr.base.ref !== 'main') {
                const hasMergeToParent = pr.labels.some(l => l.name === 'merge-to-parent');
                if (!hasMergeToParent) {
                  return {
                    canMerge: false,
                    reason: `PR targets \`${pr.base.ref}\` (non-main). Add the \`merge-to-parent\` label in addition to \`merge-when-ready\` to allow merging into a non-main branch.`
                  };
                }
              }

              // Check mergeable state
              if (pr.mergeable === false) {
                return { canMerge: false, reason: 'PR has merge conflicts that must be resolved' };
              }
              
              if (pr.mergeable === null) {
                return { canMerge: false, reason: 'GitHub is still calculating mergeable state, will retry next cycle' };
              }
              
              // Reviews are no longer required - skip review check
              // const reviews = await github.rest.pulls.listReviews({
              //   owner,
              //   repo,
              //   pull_number: pr.number
              // });
              // 
              // const approvals = reviews.data.filter(review => 
              //   review.state === 'APPROVED' && review.user.type === 'User'
              // );
              // 
              // if (approvals.length === 0) {
              //   return { canMerge: false, reason: 'PR requires at least one approval from a reviewer' };
              // }
              
              // Check for unresolved review threads (including Copilot)
              const unresolvedResult = await checkUnresolvedReviewThreads(pr.number);
              if (unresolvedResult.hasUnresolved) {
                return {
                  canMerge: false,
                  reason: `PR has ${unresolvedResult.count} unresolved review comment thread(s)`,
                  unresolvedThreads: unresolvedResult.threads
                };
              }

              // Check status checks
              const checksResult = await validateStatusChecks(pr.head.sha);
              if (!checksResult.allPassing) {
                return { 
                  canMerge: false, 
                  reason: "Status checks failing: " + checksResult.failingChecks.join(', '),
                  failingChecks: checksResult.failingChecks
                };
              }
              
              // Check if any checks are still in progress
              if (checksResult.inProgress) {
                return {
                  canMerge: false,
                  reason: "Waiting for status checks to complete: " + checksResult.pendingChecks.join(', '),
                  isPending: true
                };
              }
              
              return { canMerge: true };
            }

            async function checkUnresolvedReviewThreads(prNumber) {
              const query = `
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100) {
                        nodes {
                          isResolved
                          isOutdated
                          comments(first: 1) {
                            nodes {
                              author {
                                login
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `;

              const result = await github.graphql(query, {
                owner,
                repo,
                number: prNumber
              });

              const allThreads = result.repository.pullRequest.reviewThreads.nodes;
              // Outdated threads (on stale diffs) don't block merge
              const unresolvedThreads = allThreads.filter(t => !t.isResolved && !t.isOutdated);

              const threads = unresolvedThreads.map(t => {
                const author = t.comments.nodes[0]?.author?.login ?? 'unknown';
                return author;
              });

              return {
                hasUnresolved: unresolvedThreads.length > 0,
                count: unresolvedThreads.length,
                threads
              };
            }

            async function validateStatusChecks(sha) {
              // Get check runs
              const checks = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: sha
              });
              
              // Get commit statuses  
              const statuses = await github.rest.repos.listCommitStatusesForRef({
                owner,
                repo,
                ref: sha
              });
              
              const failingChecks = [];
              const pendingChecks = [];
              
              // Guard: if no check runs exist yet for this SHA, CI hasn't started.
              // Treat this as pending rather than all-passing to avoid premature merges.
              const relevantChecks = checks.data.check_runs.filter(
                c => c.name !== 'process-merge-queue'
              );
              if (relevantChecks.length === 0) {
                pendingChecks.push('CI checks not yet registered for this SHA');
              }
              
              // Validate check runs
              for (const check of checks.data.check_runs) {
                // Skip merge queue checks to avoid circular dependency
                if (check.name === 'process-merge-queue') {
                  continue;
                }
                
                // Only consider it failing if it's completed with a non-success conclusion
                if (check.status === 'completed' && check.conclusion !== 'success') {
                  // Explicitly failed checks
                  if (check.conclusion === 'failure' || check.conclusion === 'cancelled' || check.conclusion === 'timed_out') {
                    failingChecks.push(check.name + " (" + check.conclusion + ")");
                  }
                  // Skipped checks are not considered failures - they're optional
                  // 'action_required' and 'neutral' are also not considered failures
                } else if (check.status !== 'completed') {
                  // Track pending checks (in_progress, queued, etc.)
                  pendingChecks.push(check.name + " (" + check.status + ")");
                }
              }
              
              // Validate commit statuses
              const statusesByContext = {};
              for (const status of statuses.data) {
                if (!statusesByContext[status.context] || 
                    new Date(status.created_at) > new Date(statusesByContext[status.context].created_at)) {
                  statusesByContext[status.context] = status;
                }
              }
              
              for (const [context, status] of Object.entries(statusesByContext)) {
                // Only consider it failing if it's explicitly failed, not pending
                if (status.state === 'failure' || status.state === 'error') {
                  failingChecks.push(context + " (" + status.state + ")");
                } else if (status.state === 'pending') {
                  // Track pending statuses
                  pendingChecks.push(context + " (pending)");
                }
              }
              
              return {
                allPassing: failingChecks.length === 0,
                failingChecks,
                inProgress: pendingChecks.length > 0,
                pendingChecks
              };
            }

            async function findOrCreateComment(pr, commentBody, commentType = 'merge-queue') {
              const commentMarker = "<!-- MERGE-QUEUE-STATUS -->";
              
              // Ensure comment body includes the marker at the start
              if (!commentBody.includes(commentMarker)) {
                commentBody = commentMarker + "\n" + commentBody;
              }
              
              // Find existing merge queue comments by marker
              const comments = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: pr.number
              });
              
              // Look for existing merge queue comment by unified marker
              const existingComment = comments.data.find(comment => 
                comment.body && comment.body.includes(commentMarker)
              );
              
              if (existingComment) {
                // Update existing comment
                console.log(`🔄 Updating existing merge queue comment #${existingComment.id}`);
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existingComment.id,
                  body: commentBody
                });
                return existingComment.id;
              } else {
                // Create new comment
                console.log(`✨ Creating new merge queue comment`);
                const newComment = await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body: commentBody
                });
                return newComment.data.id;
              }
            }

            async function performMerge(pr) {
              try {
                console.log(`🚀 Merging PR #${pr.number}...`);
                
                // Sanitize commit message: remove null bytes and other control characters
                // that cause GitHub's merge API to return HTTP 500.
                const sanitize = (s) => (s || '').replace(/\x00/g, '').replace(/[\x01-\x08\x0B\x0C\x0E-\x1F]/g, '');
                
                const mergeResult = await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: pr.number,
                  merge_method: 'squash',
                  commit_title: sanitize(pr.title + " (#" + pr.number + ")"),
                  commit_message: sanitize("Merged via automated merge queue\n\n" + (pr.body || ''))
                });
                
                console.log(`✅ Successfully merged PR #${pr.number}`);
                
                // Note: GitHub App tokens automatically trigger workflows after merge
                // No manual workflow dispatch needed
                
                // Re-target any dependent PRs that used this branch as their base
                await retargetDependentPRs(pr);

                // Delete the source branch after a successful merge
                await deleteBranch(pr);
                
                // Post success comment (reuse existing comment if available)
                const successComment = "## 🎉 Successfully Merged!\n\n" +
                      "This PR has been automatically merged via the merge queue.\n\n" +
                      "**Merge Details:**\n" +
                      "- Method: Squash merge\n" +
                      "- Commit SHA: `" + mergeResult.data.sha + "`\n" +
                      "- Merged at: " + new Date().toISOString() + "\n\n" +
                      "Thank you for your contribution! 🚀\n\n" +
                      "---\n" +
                      "*Automated message from merge queue system*";
                
                await findOrCreateComment(pr, successComment, 'success');
                
              } catch (error) {
                console.error(`❌ Failed to merge PR #${pr.number}: ${error.message}`);
                
                // Check if it's a permissions error
                if (error.message.includes('Resource not accessible') || error.status === 403) {
                  console.error('🔒 PERMISSION ERROR: GitHub Actions does not have permission to merge PRs');
                  console.error('📋 Fix: Go to Settings → Actions → General → Workflow permissions');
                  console.error('✅ Enable: "Read and write permissions" + "Allow GitHub Actions to create and approve pull requests"');
                }
                
                throw error;
              }
            }

            async function reportMergeBlocker(pr, validation) {
              // Don't report a blocker comment if checks are just pending
              if (validation.isPending) {
                console.log(`⏳ Checks still in progress for PR #${pr.number}, will retry in next cycle`);
                return; // Silently wait - no comment needed
              }
              
              let comment = "## 🚫 Merge Queue: Cannot Merge\n\n" +
                           "**Reason:** " + validation.reason + "\n\n" +
                           "### 🛠️ How to Fix:";
              
              if (validation.reason.includes('merge conflicts')) {
                comment += "\n1. Sync your branch with the latest main:\n" +
                          "   ```bash\n" +
                          "   git checkout main\n" +
                          "   git pull origin main\n" +
                          "   git checkout " + pr.head.ref + "\n" +
                          "   git merge main  # Resolve any conflicts\n" +
                          "   git push origin " + pr.head.ref + "\n" +
                          "   ```";
              } else if (validation.reason.includes('merge-to-parent')) {
                comment += "\n1. Add the `merge-to-parent` label to this PR\n" +
                          "2. This PR targets `" + pr.base.ref + "` (non-main), so both `merge-when-ready` and `merge-to-parent` labels are required";
              } else if (validation.reason.includes('approval')) {
                // Reviews are no longer required - this case should not occur
                comment += "\n1. Check the PR status and resolve any issues\n" +
                          "2. Ensure all requirements are met";
              } else if (validation.unresolvedThreads) {
                comment += "\n1. Resolve all open review comment threads on the PR\n" +
                          "2. Threads from the following reviewer(s) are unresolved:\n" +
                          [...new Set(validation.unresolvedThreads)].map(a => "   - @" + a).join('\n') + "\n" +
                          "3. Open each thread on the **Files changed** tab and click **Resolve conversation**";
              } else if (validation.failingChecks) {
                comment += "\n1. Fix the failing checks:\n" +
                          validation.failingChecks.map(check => "   - " + check).join('\n') + "\n" +
                          "2. Push your fixes to trigger CI re-run";
              } else {
                comment += "\n1. Check the PR status and resolve any issues\n" +
                          "2. Ensure all requirements are met";
              }
              
              comment += "\n\nThe merge queue will automatically retry once the issues are resolved.\n\n" +
                        "---\n" +
                        "*Automated message from merge queue system*";
              
              await findOrCreateComment(pr, comment, 'blocker');
            }

            async function reportProcessingError(pr, error) {
              console.error("Processing error for PR #" + pr.number + ":", error);
              
              let errorComment = "## ⚠️ Merge Queue Processing Error\n\n" +
                    "An error occurred while processing this PR for automatic merge:\n\n" +
                    "**Error:** " + error.message + "\n\n";
              
              // Add specific guidance for permission errors
              if (error.message.includes('Resource not accessible') || error.status === 403) {
                errorComment += "### 🔒 Permission Issue Detected\n\n" +
                      "This appears to be a GitHub Actions permissions issue. " +
                      "The workflow needs additional permissions to merge PRs.\n\n" +
                      "**Administrator Action Required:**\n" +
                      "1. Go to **Settings** → **Actions** → **General**\n" +
                      "2. Scroll to **Workflow permissions**\n" +
                      "3. Select **\"Read and write permissions\"**\n" +
                      "4. Check **\"Allow GitHub Actions to create and approve pull requests\"**\n" +
                      "5. Click **Save**\n\n" +
                      "After updating permissions, the merge queue will retry automatically.\n\n";
              } else {
                errorComment += "### 🔧 Next Steps:\n" +
                      "1. This may be a temporary issue - the merge queue will retry in the next cycle\n" +
                      "2. If the error persists, you can manually merge this PR\n" +
                      "3. Contact the team if you believe this is a system issue\n\n" +
                      "**Troubleshooting:**\n" +
                      "- Ensure the PR is in a mergeable state\n" +
                      "- Verify all required checks are passing\n" +
                      "- Check that the branch is up to date\n\n";
              }
              
              errorComment += "---\n*Automated message from merge queue system*";
              
              await findOrCreateComment(pr, errorComment, 'error');
            }

            async function retargetDependentPRs(mergedPR) {
              const mergedBranch = mergedPR.head.ref;
              const targetBase = mergedPR.base.ref; // typically 'main'

              console.log(`\n🔀 Checking for open PRs based on merged branch '${mergedBranch}'...`);

              // Find all open PRs whose base branch is the one we just merged
              const openPRs = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                base: mergedBranch
              });

              if (openPRs.data.length === 0) {
                console.log(`   No dependent PRs found for '${mergedBranch}'`);
                return;
              }

              console.log(`   Found ${openPRs.data.length} dependent PR(s) to re-target → '${targetBase}'`);

              for (const dependentPR of openPRs.data) {
                try {
                  // Update the base branch of the dependent PR
                  await github.rest.pulls.update({
                    owner,
                    repo,
                    pull_number: dependentPR.number,
                    base: targetBase
                  });

                  console.log(`   ✅ PR #${dependentPR.number} (${dependentPR.title}) re-targeted to '${targetBase}'`);

                  // Remove "Waiting on Parent" label if present
                  const waitingLabel = 'Waiting on Parent';
                  const hasWaitingLabel = dependentPR.labels.some(label => label.name === waitingLabel);
                  if (hasWaitingLabel) {
                    try {
                      await github.rest.issues.removeLabel({
                        owner,
                        repo,
                        issue_number: dependentPR.number,
                        name: waitingLabel
                      });
                      console.log(`   🏷️ Removed '${waitingLabel}' label from PR #${dependentPR.number}`);
                    } catch (labelError) {
                      console.warn(`   ⚠️ Could not remove '${waitingLabel}' label from PR #${dependentPR.number}: ${labelError.message}`);
                    }
                  }

                  // Notify on the dependent PR
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: dependentPR.number,
                    body: `🔀 **Base branch updated automatically**\n\n` +
                          `PR #${mergedPR.number} (\`${mergedBranch}\`) was merged into \`${targetBase}\`. ` +
                          `This PR's base has been re-targeted from \`${mergedBranch}\` → \`${targetBase}\`.\n\n` +
                          `If you have merge conflicts, rebase onto \`${targetBase}\`:\n` +
                          '```bash\n' +
                          `git fetch origin\n` +
                          `git rebase origin/${targetBase}\n` +
                          `git push --force-with-lease\n` +
                          '```\n\n' +
                          `---\n*Automated message from merge queue system*`
                  });
                } catch (error) {
                  console.error(`   ❌ Failed to re-target PR #${dependentPR.number}: ${error.message}`);
                }
              }
            }

            async function deleteBranch(pr) {
              const branchName = pr.head.ref;

              // Never delete protected branches
              if (branchName === 'main' || branchName === 'master' || branchName === 'develop') {
                console.log(`🛡️ Skipping deletion of protected branch '${branchName}'`);
                return;
              }

              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branchName}`
                });
                console.log(`🗑️ Deleted branch '${branchName}' after merge`);
              } catch (error) {
                // Branch deletion is best-effort — do not fail the merge over it
                console.warn(`⚠️ Could not delete branch '${branchName}': ${error.message}`);
              }
            }
