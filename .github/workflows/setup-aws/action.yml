name: Setup AWS

inputs:
  aws-region:
    required: true
    type: string
    default: us-east-1
  certificate-url:
    required: true
    type: string
    default: https://truststore.pki.rds.amazonaws.com/us-east-1/us-east-1-bundle.pem
  certificate-file:
    required: true
    type: string
    default: aws-certs.pem
  installed-cert-location:
    required: true
    type: string
    default: /usr/local/share/ca-certificates/aws-certs.crt 

outputs:
  ecr-registry: 
    description: "The ECR registry that was signed in to."
    value: ${{ steps.login-ecr.outputs.registry }}
  cert-file: 
    description: "The file path for the AWS Cert .pem file."
    value: ${{ steps.get-certificate-file-name.outputs.value }}
  installed-cert-location:
    description: "The location that the cert file was installed."
    value: ${{ inputs.installed-cert-location }}

runs:
  using: "composite"
  steps:
    - name: configure aws credentials
      uses: aws-actions/configure-aws-credentials@v1.7.0
      with:
        role-to-assume: arn:aws:iam::176661590736:role/GithubActionsECRIntegration #change to reflect your IAM role’s ARN
        role-session-name: GitHub_to_AWS_via_FederatedOIDC
        aws-region: ${{ inputs.aws-region }}

    - name: Sts GetCallerIdentity
      shell: bash
      run: aws sts get-caller-identity

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set Certificate File Name
      id: get-certificate-file-name
      shell: bash
      run: echo "value=$(pwd)/${{ env.CERTIFICATE_FILE }}" >> "$GITHUB_OUTPUT" 

    - name: Download AWS Certs
      shell: bash
      run: wget -O ${{ inputs.certificate-file }} ${{ inputs.certificate-url }}

    - name: Install AWS Certs
      shell: bash
      run: sudo cp ${{ inputs.certificate-file }} ${{ inputs.installed-cert-location }}

    - name: Test Cert
      shell: bash
      run: openssl x509 -in ${{ inputs.installed-cert-location }} -text -noout

    - name: Update Certs
      shell: bash
      run: sudo VERBOSE=1 update-ca-certificates -v
