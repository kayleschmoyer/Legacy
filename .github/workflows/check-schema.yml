name: "GraphQL Schema Check"

# =============================================================================
# Single job that runs on every PR when GraphQL files change:
#
#   1. Generates schema.graphql from the Pothos implementation (once).
#   2. Verifies the committed SDL matches (drift check). Fails + posts a
#      PR comment with the diff if they differ.
#   3. Runs every project's codegen target against the generated schema.
#      Fails if any codegen target exits non-zero.
#   4. Contract gate (LS integration-safety system, Tier 0): diffs the PR
#      schema against the base branch for breaking changes and validates every
#      committed UI operation against the new schema. Breaking changes block
#      unless the `schema-breaking-ok` label acknowledges them; invalid
#      operations always block.
#
# Fix locally:
#   pnpm exec nx run db:print-schema          # regen schema.graphql
#   pnpm run codegen                          # regen all codegen outputs
#   node .github/scripts/schema-contract/check-contract.mjs \
#     --old <base schema> --new lambdas/db/schema.graphql   # contract gate
# =============================================================================

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "lambdas/db/src/schema/**"
      - "lambdas/db/schema.graphql"
      - "**/*.graphql"
      - "lib/codegen/**"
      - "lib/api/**"
      - ".github/workflows/check-schema.yml"
      - ".github/actions/setup/**"
  # push-to-main trigger removed: PRs are the gatekeeper — schema drift
  # is validated before merge.  Re-enable with workflow_dispatch if needed.
  workflow_dispatch:

concurrency:
  group: schema-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # LS-1652: Restrict self-hosted runners to PR authors with write permission
  # ---------------------------------------------------------------------------
  check-runner-access:
    name: "Resolve Runner Label"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner-label: ${{ steps.resolve.outputs.runner-label }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          sparse-checkout: .github/actions/resolve-runner-label
      - name: "Resolve Runner Label"
        id: resolve
        uses: ./.github/actions/resolve-runner-label
        with:
          runner-label: ${{ vars.CI_RUNNER_LABEL }}

  # ---------------------------------------------------------------------------
  # Schema drift check + codegen compatibility (single runner, one print-schema)
  # ---------------------------------------------------------------------------
  check-schema-and-codegen:
    name: "GraphQL Schema & Codegen"
    needs: [check-runner-access]
    runs-on: ${{ needs.check-runner-access.outputs.runner-label }}
    timeout-minutes: 15
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: false
          include-optional-deps: false

      - name: "Generate schema.graphql from implementation"
        run: pnpm exec nx run db:print-schema

      # --- Schema drift check ---

      - name: "Check for schema drift"
        id: drift-check
        shell: bash
        run: |
          if git diff --exit-code lambdas/db/schema.graphql; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "✅  schema.graphql is up-to-date"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "❌  schema.graphql is out of sync with the implementation"
            git diff lambdas/db/schema.graphql > "$RUNNER_TEMP/schema.diff" || true
          fi

      - name: "Show diff"
        if: steps.drift-check.outputs.drift == 'true'
        shell: bash
        run: |
          echo ""
          echo "==========================================================="
          echo "  schema.graphql is out of sync with lambdas/db/src/schema/"
          echo "==========================================================="
          echo ""
          echo "Run the following command locally and commit the result:"
          echo ""
          echo "  pnpm exec nx run db:print-schema"
          echo ""
          echo "--- Diff (committed vs generated) ---"
          git diff lambdas/db/schema.graphql

      - name: "Fail on drift"
        if: steps.drift-check.outputs.drift == 'true'
        run: exit 1

      # --- Codegen compatibility check ---
      # Reuses the schema.graphql already generated above instead of running
      # print-schema a second time.

      - name: "Run all codegen targets against generated schema"
        id: codegen-check
        shell: bash
        env:
          # Point every codegen config at the generated SDL file instead of a
          # live HTTP endpoint. graphql-codegen accepts file paths as schema
          # sources; GRAPHQL_SCHEMA is read first by all codegen.ts configs.
          # pnpm run codegen also runs scripts/fix-apollo-codegen.js as a
          # post-processing step (see root package.json "codegen" script).
          GRAPHQL_SCHEMA: ${{ github.workspace }}/lambdas/db/schema.graphql
        run: |
          set -o pipefail
          pnpm run codegen 2>&1 | tee "$RUNNER_TEMP/schema-codegen.log"

      # --- Contract gate: breaking-change diff + operation validation ---
      # Runs even when codegen failed (always()) so the clean, human-readable
      # contract report is produced regardless. The breaking-change diff is the
      # net-new signal over the codegen check: it catches field/enum/arg/
      # nullability removals that are type-valid for current operations but
      # break deployed clients and the nightly live-backend suite.

      - name: "Fetch base branch schema"
        if: always() && steps.drift-check.outcome == 'success'
        id: base-schema
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_REF:-}" ]; then
            echo "no-base=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No base ref (manual run) — validating operations only, skipping breaking-change diff."
            exit 0
          fi
          # Fetch only the base tip; FETCH_HEAD then points at it regardless of
          # whether the shallow checkout populated refs/remotes/origin/<base>.
          git fetch --depth=1 origin "$BASE_REF" >/dev/null 2>&1 || true
          if git show "FETCH_HEAD:lambdas/db/schema.graphql" > /tmp/base-schema.graphql 2>/dev/null; then
            echo "no-base=false" >> "$GITHUB_OUTPUT"
          else
            echo "no-base=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Base branch has no lambdas/db/schema.graphql — validating operations only."
          fi

      - name: "GraphQL contract gate"
        if: always() && steps.drift-check.outcome == 'success'
        id: contract
        shell: bash
        run: |
          set +e
          OLD_ARG=""
          if [ "${{ steps.base-schema.outputs.no-base }}" != "true" ]; then
            OLD_ARG="--old /tmp/base-schema.graphql"
          fi
          node .github/scripts/schema-contract/check-contract.mjs \
            $OLD_ARG --new lambdas/db/schema.graphql --json > /tmp/contract.json
          node -e "const r=require('/tmp/contract.json'); process.stdout.write(r.body + '\n')" | tee /tmp/contract.md
          node -e "const r=require('/tmp/contract.json'); console.log('has_breaking='+(r.hasBreaking?'true':'false')); console.log('has_invalid='+(r.hasInvalidOps?'true':'false'))" >> "$GITHUB_OUTPUT"

      - name: "Post contract gate comment"
        if: >-
          always() && github.event_name == 'pull_request' &&
          (steps.contract.outputs.has_breaking == 'true' || steps.contract.outputs.has_invalid == 'true')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- contract-gate -->';
            const body = marker + '\n' + fs.readFileSync('/tmp/contract.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: "Fail on contract violation"
        if: always() && steps.drift-check.outcome == 'success'
        shell: bash
        env:
          HAS_BREAKING: ${{ steps.contract.outputs.has_breaking }}
          HAS_INVALID: ${{ steps.contract.outputs.has_invalid }}
          ACK: ${{ contains(github.event.pull_request.labels.*.name, 'schema-breaking-ok') }}
        run: |
          set -euo pipefail
          # Fail closed: empty outputs mean the contract step errored (e.g. the
          # schema failed to build) and produced no result — never pass vacuously.
          if [ -z "${HAS_BREAKING:-}" ] || [ -z "${HAS_INVALID:-}" ]; then
            echo "::error::Contract gate produced no result — the 'GraphQL contract gate' step errored. Inspect its logs."
            exit 1
          fi
          if [ "$HAS_INVALID" = "true" ]; then
            echo "::error::Committed GraphQL operations no longer validate against the schema in this PR. See the contract gate comment for the affected files."
            exit 1
          fi
          if [ "$HAS_BREAKING" = "true" ] && [ "$ACK" != "true" ]; then
            echo "::error::Breaking schema changes detected. Update affected clients/integration specs, or add the 'schema-breaking-ok' label to acknowledge an intentional break."
            exit 1
          fi
          if [ "$HAS_BREAKING" = "true" ]; then
            echo "✅ Contract gate passed (breaking changes acknowledged via schema-breaking-ok label)."
          else
            echo "✅ Contract gate passed."
          fi

      - name: "Label PR on Schema Drift"
        if: always() && github.event.pull_request.number
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue.number;
            if (!prNumber) return;

            const driftDetected = '${{ steps.drift-check.outputs.drift }}' === 'true';
            const codegenFailed = '${{ steps.codegen-check.outcome }}' === 'failure';
            const label = 'CI: Schema Drift';

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const existingLabels = pr.labels.map(l => l.name);

            async function withRetry(fn, retries = 3) {
              for (let i = 0; i < retries; i++) {
                try { return await fn(); }
                catch (e) {
                  const isPrimaryRateLimit = e.status === 429;
                  const isSecondaryRateLimit = e.status === 403 && /secondary rate limit/i.test(typeof e.message === 'string' ? e.message : '');
                  if ((isPrimaryRateLimit || isSecondaryRateLimit) && i < retries - 1) {
                    const delay = Math.pow(2, i) * 1000;
                    core.warning(`Rate limited (${e.status}), retrying in ${delay}ms…`);
                    await new Promise(r => setTimeout(r, delay));
                  } else throw e;
                }
              }
            }

            const shouldHaveLabel = driftDetected || codegenFailed;
            const hasLabel = existingLabels.includes(label);
            if (shouldHaveLabel && !hasLabel) {
              await withRetry(() => github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: [label],
              }));
              core.info(`Label added: ${label}`);
            } else if (!shouldHaveLabel && hasLabel) {
              await withRetry(() => github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name: label,
              }));
              core.info(`Label removed: ${label}`);
            }

      - name: "Update CI status comment (schema section)"
        if: always() && github.event.pull_request.number
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DRIFT: ${{ steps.drift-check.outputs.drift }}
          CODEGEN_OUTCOME: ${{ steps.codegen-check.outcome }}
          DIFF_FILE: ${{ runner.temp }}/schema.diff
          CODEGEN_LOG: ${{ runner.temp }}/schema-codegen.log
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { applySection } = require('./.github/scripts/ci-failure-capture/sticky-comment.js');
            const { statusHeading, detailsBlock, fixLine } = require('./.github/scripts/ci-failure-capture/render.js');
            const { distill } = require('./.github/scripts/ci-failure-capture/extract.js');

            const prNumber = context.issue.number;
            if (!prNumber) return;

            const drift = process.env.DRIFT === 'true';
            const codegenFailed = process.env.CODEGEN_OUTCOME === 'failure';
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;

            // Both green → clear the schema section (heals a previously-failing PR).
            if (!drift && !codegenFailed) {
              await applySection({ github, context, prNumber, key: 'schema', content: null, producer: 'check-schema' });
              return;
            }

            const summary = drift ? 'schema.graphql out of sync' : 'codegen failed';
            const parts = [statusHeading('GraphQL Schema', 'fail', summary), ''];

            if (drift) {
              let diff = '';
              try { diff = fs.readFileSync(process.env.DIFF_FILE, 'utf8'); } catch {}
              const lines = diff.split('\n');
              const capped = lines.length > 50
                ? [...lines.slice(0, 50), `… (${lines.length - 50} more lines — full diff in the run)`]
                : lines;
              parts.push(detailsBlock({
                check: 'schema-drift',
                label: 'schema drift',
                sublabel: 'committed vs generated',
                excerpt: capped.join('\n'),
              }), '');
            }

            if (codegenFailed) {
              let log = '';
              try { log = fs.readFileSync(process.env.CODEGEN_LOG, 'utf8'); } catch {}
              const { summary: cgSummary, excerpt } = distill({ tool: 'generic', text: log, runUrl });
              parts.push(detailsBlock({
                check: 'schema-codegen',
                label: 'codegen',
                sublabel: cgSummary || '',
                excerpt,
              }), '');
            }

            parts.push(fixLine('pnpm exec nx run db:print-schema && pnpm run codegen', runUrl));

            await applySection({
              github, context, prNumber,
              key: 'schema',
              content: parts.join('\n').trim(),
              producer: 'check-schema',
            });
