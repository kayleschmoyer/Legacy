name: "GraphQL Schema Check"

# =============================================================================
# Single job that runs on every PR when GraphQL files change:
#
#   1. Generates schema.graphql from the Pothos implementation (once).
#   2. Verifies the committed SDL matches (drift check). Fails + posts a
#      PR comment with the diff if they differ.
#   3. Runs every project's codegen target against the generated schema.
#      Fails if any codegen target exits non-zero.
#
# Fix locally:
#   pnpm exec nx run db:print-schema          # regen schema.graphql
#   pnpm run codegen                          # regen all codegen outputs
# =============================================================================

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "lambdas/db/src/schema/**"
      - "lambdas/db/schema.graphql"
      - "**/*.graphql"
      - "lib/codegen/**"
      - "lib/api/**"
      - ".github/workflows/check-schema.yml"
      - ".github/actions/setup/**"
  # push-to-main trigger removed: PRs are the gatekeeper — schema drift
  # is validated before merge.  Re-enable with workflow_dispatch if needed.
  workflow_dispatch:

concurrency:
  group: schema-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # LS-1652: Restrict self-hosted runners to PR authors with write permission
  # ---------------------------------------------------------------------------
  check-runner-access:
    name: "Resolve Runner Label"
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 2
    outputs:
      runner-label: ${{ steps.resolve.outputs.runner-label }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions/resolve-runner-label
      - name: "Resolve Runner Label"
        id: resolve
        uses: ./.github/actions/resolve-runner-label
        with:
          runner-label: ${{ vars.CI_RUNNER_LABEL }}

  # ---------------------------------------------------------------------------
  # Schema drift check + codegen compatibility (single runner, one print-schema)
  # ---------------------------------------------------------------------------
  check-schema-and-codegen:
    name: "GraphQL Schema & Codegen"
    needs: [check-runner-access]
    runs-on: ${{ needs.check-runner-access.outputs.runner-label }}
    timeout-minutes: 15
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v6

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: false
          include-optional-deps: false

      - name: "Generate schema.graphql from implementation"
        run: pnpm exec nx run db:print-schema

      # --- Schema drift check ---

      - name: "Check for schema drift"
        id: drift-check
        shell: bash
        run: |
          if git diff --exit-code lambdas/db/schema.graphql; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "✅  schema.graphql is up-to-date"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "❌  schema.graphql is out of sync with the implementation"
          fi

      - name: "Show diff"
        if: steps.drift-check.outputs.drift == 'true'
        shell: bash
        run: |
          echo ""
          echo "==========================================================="
          echo "  schema.graphql is out of sync with lambdas/db/src/schema/"
          echo "==========================================================="
          echo ""
          echo "Run the following command locally and commit the result:"
          echo ""
          echo "  pnpm exec nx run db:print-schema"
          echo ""
          echo "--- Diff (committed vs generated) ---"
          git diff lambdas/db/schema.graphql

      - name: "Post PR comment on drift"
        if: >-
          steps.drift-check.outputs.drift == 'true' &&
          github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## ❌ GraphQL Schema Out of Sync',
                '',
                '`lambdas/db/schema.graphql` does not match the Pothos schema implementation.',
                '',
                'Please regenerate it and include the updated file in this PR:',
                '',
                '```bash',
                'pnpm exec nx run db:print-schema',
                'git add lambdas/db/schema.graphql',
                '```',
              ].join('\n'),
            });

      - name: "Fail on drift"
        if: steps.drift-check.outputs.drift == 'true'
        run: exit 1

      # --- Codegen compatibility check ---
      # Reuses the schema.graphql already generated above instead of running
      # print-schema a second time.

      - name: "Run all codegen targets against generated schema"
        id: codegen-check
        shell: bash
        env:
          # Point every codegen config at the generated SDL file instead of a
          # live HTTP endpoint. graphql-codegen accepts file paths as schema
          # sources; GRAPHQL_SCHEMA is read first by all codegen.ts configs.
          # pnpm run codegen also runs scripts/fix-apollo-codegen.js as a
          # post-processing step (see root package.json "codegen" script).
          GRAPHQL_SCHEMA: ${{ github.workspace }}/lambdas/db/schema.graphql
        run: pnpm run codegen

      - name: "Label PR on Schema Drift"
        if: always() && github.event.pull_request.number
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue.number;
            if (!prNumber) return;

            const driftDetected = '${{ steps.drift-check.outputs.drift }}' === 'true';
            const codegenFailed = '${{ steps.codegen-check.outcome }}' === 'failure';
            const label = 'CI: Schema Drift';

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const existingLabels = pr.labels.map(l => l.name);

            if (driftDetected || codegenFailed) {
              if (!existingLabels.includes(label)) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  labels: [label],
                });
                core.info(`Added label: ${label}`);
              }
            } else if (existingLabels.includes(label)) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: label,
                });
                core.info(`Removed label: ${label}`);
              } catch (e) {
                // Label may have been removed already
              }
            }
