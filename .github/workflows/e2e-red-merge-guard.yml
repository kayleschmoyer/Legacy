name: "E2E Red Merge Guard"

# Post-merge tripwire (LS-9467, AC4). A PR that adds/edits an e2e spec under
# apps/web-e2e/src/tests/** and still carries the "CI: E2E Failure" label at
# merge time means main just inherited a spec that was red going in — the
# exact PR #6909 pattern (a deterministically-broken spec merged via the
# CI-Gate cancelled/timeout race fixed in ci-gate.js's
# cancelledJobHadRealFailure). That gate fix should make this structurally
# rare going forward; this workflow is the belt-and-suspenders alarm for
# whatever path still lets it through (a maintainer bypass_actor merge, a
# label desync, a future regression in the gate itself).
#
# Deliberately alert-only, not a Jira auto-file: filing a real ticket needs
# Jira credentials this workflow doesn't have, and every "CI: E2E Failure"
# occurrence here is already a live, actionable signal — a loud PR comment +
# a dedicated label is enough for a human or the next agent sweep to act on
# without new automation infra. Revisit if this fires often enough to justify
# the Jira wiring.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: e2e-red-merge-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  guard:
    name: "Detect red-E2E merge"
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'CI: E2E Failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Check for e2e spec changes and alert"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });
            const touchesE2eSpecs = files.some((f) =>
              f.filename.startsWith('apps/web-e2e/src/tests/'),
            );
            if (!touchesE2eSpecs) {
              core.info(
                `PR #${prNumber} carries "CI: E2E Failure" but touches no ` +
                  'apps/web-e2e/src/tests/** file — not the merged-red-spec ' +
                  'pattern this guard watches for. Skipping.',
              );
              return;
            }

            const ALERT_LABEL = 'main:red-e2e-merged';
            try {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: prNumber,
                labels: [ALERT_LABEL],
              });
            } catch (e) {
              core.warning(`Could not apply "${ALERT_LABEL}" label: ${e.message}`);
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: [
                '> [!CAUTION]',
                '> **Merged with a red E2E spec — main is now blocked for every affected PR (LS-9467)**',
                '>',
                `> This PR touches \`apps/web-e2e/src/tests/**\` and merged while still carrying ` +
                'the `CI: E2E Failure` label. The spec it added/changed was red on the merge-gating ' +
                'run, so \`main\` has likely just inherited a deterministic E2E failure that will ' +
                'block the `e2e-affected CI Gate` required check on every subsequent affected PR ' +
                '(the exact pattern behind LS-9467, source incident PR #6909).',
                '>',
                '> **Action needed:** revert this spec or fix it forward on `main` immediately — ' +
                'do not wait for the normal review queue. If this alert is a false positive (the ' +
                'label was stale and the spec is actually green), remove the ' +
                `\`main:red-e2e-merged\` label after confirming.`,
              ].join('\n'),
            });
            core.summary.addRaw(
              `## 🚨 Red E2E spec merged to main\n\nPR #${prNumber} — see the PR comment for details.\n`,
            );
            await core.summary.write();
