name: Build iOS App (DISABLED)

# DISABLED: iOS builds require Apple Developer Program ($99/year)
# This workflow is disabled until iOS certificates are configured
# To enable: replace workflow_dispatch trigger with push/paths triggers

on:
  workflow_dispatch:
    inputs:
      force_enable:
        description: "WARNING: Force enable iOS build (will fail without certificates)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      build_type:
        description: "Build Configuration"
        required: false
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
      create_release:
        description: "Create GitHub Release"
        required: false
        default: true
        type: boolean

# Required permissions for nx-set-shas action and creating releases
permissions:
  actions: read
  contents: write # Required for creating GitHub releases

# Cancel in-progress builds for the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.build_type || 'Release' }}
  cancel-in-progress: true

env:
  # iOS build configuration
  IOS_VERSION: "17.0"
  XCODE_VERSION: "15.4"

jobs:
  build-ios-ipa:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      commit_sha: ${{ steps.version.outputs.commit_sha }}
      build_config: ${{ steps.version.outputs.build_config }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: 20
          install-dependencies: true
          set-nx-shas: true
          skip-system-deps: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install CocoaPods
        run: |
          cd apps/app/ios
          pod install --repo-update

      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: |
            apps/app/ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('apps/app/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Generate React Native Bundle
        run: |
          cd apps/app
          pnpm exec react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output ios/main.jsbundle \
            --assets-dest ios/

      - name: Extract Version Info
        id: version
        run: |
          # Extract version from package.json
          VERSION=$(node -p "require('./apps/app/package.json').version")
          # Get commit SHA (short)
          COMMIT_SHA=${GITHUB_SHA:0:7}
          # Create build number from timestamp
          BUILD_NUMBER=$(date +%Y%m%d_%H%M%S)
          # Determine build configuration
          BUILD_CONFIG="${{ github.event.inputs.build_type || 'Release' }}"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "build_config=$BUILD_CONFIG" >> $GITHUB_OUTPUT
          echo "artifact_name=legacy-sports-ios-v${VERSION}-${BUILD_NUMBER}-${COMMIT_SHA}" >> $GITHUB_OUTPUT

      - name: Update Build Number in Info.plist
        run: |
          # Update CFBundleVersion with our build number
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.version.outputs.build_number }}" apps/app/ios/App/Info.plist
          # Update CFBundleShortVersionString with version
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" apps/app/ios/App/Info.plist

      - name: Build iOS App for Simulator
        if: steps.version.outputs.build_config == 'Debug'
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          EXPO_PUBLIC_APP_VERSION: ${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_number }}
        run: |
          cd apps/app/ios
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration ${{ steps.version.outputs.build_config }} \
            -sdk iphonesimulator \
            -arch x86_64 \
            -derivedDataPath ./build \
            build

      - name: Build iOS App for Device (Archive)
        if: steps.version.outputs.build_config == 'Release'
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          EXPO_PUBLIC_APP_VERSION: ${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_number }}
        run: |
          cd apps/app/ios

          # Create archive
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration ${{ steps.version.outputs.build_config }} \
            -sdk iphoneos \
            -archivePath ./build/App.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export IPA (Release only)
        if: steps.version.outputs.build_config == 'Release'
        run: |
          cd apps/app/ios

          # Create export options plist
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          EOF

          # Export IPA
          xcodebuild \
            -exportArchive \
            -archivePath ./build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath ./build/export \
            -allowProvisioningUpdates

      - name: Rename and Prepare Artifacts
        id: artifacts
        run: |
          cd apps/app/ios

          if [ "${{ steps.version.outputs.build_config }}" == "Release" ]; then
            # For Release builds, we have an IPA
            mv build/export/App.ipa build/export/${{ steps.version.outputs.artifact_name }}.ipa
            
            # Create a latest symlink
            ln -s ${{ steps.version.outputs.artifact_name }}.ipa build/export/legacy-sports-ios-latest.ipa
            
            echo "ipa_path=apps/app/ios/build/export/${{ steps.version.outputs.artifact_name }}.ipa" >> $GITHUB_OUTPUT
            echo "latest_path=apps/app/ios/build/export/legacy-sports-ios-latest.ipa" >> $GITHUB_OUTPUT
          else
            # For Debug builds, create a zip of the .app bundle
            cd build/Build/Products/Debug-iphonesimulator
            zip -r "${{ steps.version.outputs.artifact_name }}.app.zip" App.app
            mv "${{ steps.version.outputs.artifact_name }}.app.zip" ../../../../
            
            echo "app_zip_path=apps/app/ios/${{ steps.version.outputs.artifact_name }}.app.zip" >> $GITHUB_OUTPUT
          fi

      - name: Upload IPA as GitHub Artifact (Release)
        if: steps.version.outputs.build_config == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            ${{ steps.artifacts.outputs.ipa_path }}
            ${{ steps.artifacts.outputs.latest_path }}
          retention-days: 3
          if-no-files-found: error

      - name: Upload App Bundle as GitHub Artifact (Debug)
        if: steps.version.outputs.build_config == 'Debug'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: ${{ steps.artifacts.outputs.app_zip_path }}
          retention-days: 3
          if-no-files-found: error

      - name: Create Release (Release builds only)
        if: |
          steps.version.outputs.build_config == 'Release' && 
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_number }}
          name: iOS IPA v${{ steps.version.outputs.version }} (${{ steps.version.outputs.commit_sha }})
          body: |
            ## iOS IPA Release

            **Version:** ${{ steps.version.outputs.version }}  
            **Build:** ${{ steps.version.outputs.build_number }}  
            **Commit:** ${{ steps.version.outputs.commit_sha }}  
            **Configuration:** ${{ steps.version.outputs.build_config }}  
            **Built:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')

            ### Download
            - 📱 **IPA File:** `${{ steps.version.outputs.artifact_name }}.ipa`

            ### Installation Options

            #### Option 1: Sideload with Tools
            - Use tools like **AltStore**, **Sideloadly**, or **3uTools**
            - Requires Apple ID (free developer account works)

            #### Option 2: Xcode Installation
            1. Download and extract the IPA
            2. Open Xcode → Window → Devices and Simulators
            3. Connect your iOS device
            4. Drag the .app bundle to your device

            #### Option 3: TestFlight (if configured)
            - Upload to App Store Connect for TestFlight distribution

            > **Note:** This is a development build without proper code signing. For production use, proper provisioning profiles and distribution certificates are required.
          files: ${{ steps.artifacts.outputs.ipa_path }}
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        run: |
          echo "## 🎉 iOS Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build Number:** ${{ steps.version.outputs.build_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Configuration:** ${{ steps.version.outputs.build_config }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ steps.version.outputs.commit_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.version.outputs.build_config }}" == "Release" ]; then
            echo "### 📥 IPA Download Options:" >> $GITHUB_STEP_SUMMARY
            echo "1. **GitHub Artifacts:** Available in this workflow run for 3 days" >> $GITHUB_STEP_SUMMARY
            echo "2. **GitHub Release:** Tagged release with permanent download link" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📱 Installation Methods:" >> $GITHUB_STEP_SUMMARY
            echo "- **Sideloading:** Use AltStore, Sideloadly, or similar tools" >> $GITHUB_STEP_SUMMARY
            echo "- **Xcode:** Install via Xcode Devices and Simulators" >> $GITHUB_STEP_SUMMARY
            echo "- **TestFlight:** Upload to App Store Connect (requires developer account)" >> $GITHUB_STEP_SUMMARY
            
            if [ -f "${{ steps.artifacts.outputs.ipa_path }}" ]; then
              IPA_SIZE=$(du -h "${{ steps.artifacts.outputs.ipa_path }}" | cut -f1)
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### 📱 IPA Details:" >> $GITHUB_STEP_SUMMARY
              echo "**File Size:** $IPA_SIZE" >> $GITHUB_STEP_SUMMARY
              echo "**File Name:** ${{ steps.version.outputs.artifact_name }}.ipa" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### 📥 Debug App Bundle:" >> $GITHUB_STEP_SUMMARY
            echo "- **GitHub Artifacts:** Available in this workflow run for 3 days" >> $GITHUB_STEP_SUMMARY
            echo "- **Installation:** Use iOS Simulator or Xcode for device installation" >> $GITHUB_STEP_SUMMARY
          fi

  notify-release:
    name: Discord Release Notification
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    needs: build-ios-ipa
    # Mirror the create-release step condition: Release config on push to main, or manual dispatch with create_release=true
    if: >-
      !cancelled() &&
      needs.build-ios-ipa.result == 'success' &&
      needs.build-ios-ipa.outputs.build_config == 'Release' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
      )

    steps:
      - name: Checkout (for commit history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build commit changelog
        id: changelog
        shell: bash
        env:
          RELEASE_TAG: ios-v${{ needs.build-ios-ipa.outputs.version }}-${{ needs.build-ios-ipa.outputs.build_number }}
        run: |
          PREV_TAG=$(git tag --list 'ios-v*' --sort=-version:refname | { grep -v "^${RELEASE_TAG}$" || true; } | head -n 1)

          if [ -n "$PREV_TAG" ]; then
            echo "Commits since ${PREV_TAG}:"
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:'[`%h`](https://github.com/${{ github.repository }}/commit/%H) %s' --first-parent -20)
          else
            echo "No previous iOS release tag found — showing last 20 commits"
            COMMITS=$(git log --pretty=format:'[`%h`](https://github.com/${{ github.repository }}/commit/%H) %s' --first-parent -20)
          fi

          {
            echo "commits<<CHANGELOG_EOF"
            echo "$COMMITS"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compute release tag
        id: meta
        run: |
          TAG="ios-v${{ needs.build-ios-ipa.outputs.version }}-${{ needs.build-ios-ipa.outputs.build_number }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/${{ github.repository }}/releases/tag/${TAG}" >> "$GITHUB_OUTPUT"

      - name: Post Release Summary
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          status: success
          title: "iOS Release ${{ steps.meta.outputs.tag }}"
          description: "A new iOS release. [View on GitHub](${{ steps.meta.outputs.url }})"
          commits: ${{ steps.changelog.outputs.commits }}
          thread-name: "iOS Release ${{ steps.meta.outputs.tag }}"
