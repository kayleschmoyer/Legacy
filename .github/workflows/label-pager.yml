name: Label Pager (W4)

# Event-driven escalation paging: fires immediately when an escalation label
# is applied to a PR. Routes via ESCALATION_WEBHOOK_URL (Discord/Slack/PD);
# channel/team routing is configured at the webhook side, not here.
# bot:ready-for-review is intentionally excluded — it is NOT an escalation.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  page:
    if: contains(fromJson('["needs-human-arbitration","needs-human-security-review","review-bot-degraded","ci-stuck"]'), github.event.label.name)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send escalation page
        env:
          WEBHOOK: ${{ secrets.ESCALATION_WEBHOOK_URL }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          LABEL: ${{ github.event.label.name }}
        run: |
          curl -fsS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg pr_url "$PR_URL" --arg label "$LABEL" --arg title "$PR_TITLE" \
                  '{ text: ("Escalation: \($label) on \($pr_url) — \($title)") }')"
