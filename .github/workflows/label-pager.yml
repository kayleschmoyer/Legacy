name: Label Pager (W4)

# Event-driven escalation paging: fires immediately when an escalation label
# is applied to a PR. Routes via ESCALATION_WEBHOOK_URL (Discord webhook —
# payload uses the 'content' field); channel routing is configured at the webhook side.
# bot:ready-for-review is intentionally excluded — it is NOT an escalation.
#
# workflow_dispatch: manual trigger for test workflows running in workflow_dispatch
# context where GitHub does not deliver pull_request.labeled events (LS-4120).

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number the escalation label was applied to"
        required: true
        type: number
      label_name:
        description: "Escalation label name"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  page:
    if: >-
      contains(fromJson('["needs-human-arbitration","needs-human-security-review","needs-human-review","review-bot-degraded","ci-stuck"]'),
        github.event_name == 'workflow_dispatch' && inputs.label_name || github.event.label.name)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send escalation page
        env:
          WEBHOOK: ${{ secrets.ESCALATION_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ github.event_name == 'workflow_dispatch' && inputs.label_name || github.event.label.name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_URL="https://github.com/${{ github.repository }}/pull/${{ inputs.pr_number }}"
            PR_TITLE=$(gh pr view "${{ inputs.pr_number }}" --json title --jq '.title')
          else
            PR_URL="${{ github.event.pull_request.html_url }}"
            PR_TITLE="${{ github.event.pull_request.title }}"
          fi
          curl -fsS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg pr_url "$PR_URL" --arg label "$LABEL" --arg title "$PR_TITLE" \
                  '{ content: ("Escalation: \($label) on \($pr_url) — \($title)") }')"
