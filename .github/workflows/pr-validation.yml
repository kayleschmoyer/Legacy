name: PR Validation

# This workflow provides comprehensive validation for pull requests
# It replaces the previous duplicate validation in ci.yml for PRs
on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel in-progress runs for the same workflow on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  affected-validation:
    name: Validate Affected Projects
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: 20
          install-dependencies: true
          set-nx-shas: true

      - name: Validate Workspace
        uses: ./.github/actions/validate-workspace

      - name: Show Affected Projects
        run: |
          echo "Projects affected by this PR:"
          npx nx show projects --affected
          echo ""
          echo "Tasks that will be run:"
          echo "npx nx affected -t lint test build"

      - name: Run Affected Validation
        uses: ./.github/actions/nx-tasks
        with:
          tasks: 'lint test build'
          scope: 'affected'
          parallel: '3'
          verbose: 'false'

  # Separate job for checking affected lambda deployments
  lambda-validation:
    name: Validate Lambda Changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: contains(github.event.pull_request.changed_files, 'lambdas/')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: 20
          install-dependencies: true
          set-nx-shas: true

      # Check if any lambda projects are affected
      - name: Check Affected Lambda Projects
        id: check-lambdas
        run: |
          affected_projects=$(npx nx show projects --affected --json)
          lambda_projects=$(echo "$affected_projects" | jq -r '.[] | select(contains("db") or contains("game-selection") or contains("oauth-proxy") or contains("stats-lambda"))')

          if [ -n "$lambda_projects" ]; then
            echo "affected_lambdas=true" >> $GITHUB_OUTPUT
            echo "Lambda projects affected: $lambda_projects"
          else
            echo "affected_lambdas=false" >> $GITHUB_OUTPUT
            echo "No lambda projects affected"
          fi

      # Run lambda-specific validation
      - name: Validate Lambda Projects
        if: steps.check-lambdas.outputs.affected_lambdas == 'true'
        run: |
          # Test lambda packaging
          npx nx affected -t package --projects=tag:lambda

          # Run deployment plan to validate configurations
          npx nx affected -t deploy:plan --projects=tag:lambda

  # Job specifically for mobile app changes
  mobile-validation:
    name: Validate Mobile App Changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: contains(github.event.pull_request.changed_files, 'apps/app/')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: 20
          install-dependencies: true
          set-nx-shas: true

      # Check if mobile app is affected
      - name: Check if Mobile App is Affected
        id: check-mobile
        run: |
          if npx nx show projects --affected --json | grep -q '"app"'; then
            echo "mobile_affected=true" >> $GITHUB_OUTPUT
            echo "Mobile app is affected by this PR"
          else
            echo "mobile_affected=false" >> $GITHUB_OUTPUT
            echo "Mobile app is not affected by this PR"
          fi

      # Run mobile-specific validation
      - name: Validate Mobile App
        if: steps.check-mobile.outputs.mobile_affected == 'true'
        run: |
          # Lint mobile app
          npx nx lint app

          # Test mobile app
          npx nx test app

          # Check if the app can be built (dry run)
          echo "Validating mobile app build configuration..."
          npx nx build app --dry-run || echo "Build configuration validated"

      # Run E2E tests for mobile if affected
      - name: Run Mobile E2E Tests
        if: steps.check-mobile.outputs.mobile_affected == 'true'
        run: npx nx test app-e2e

  # iOS build job for PR validation
  build-ios:
    name: Build iOS (PR)
    runs-on: macos-latest
    timeout-minutes: 45
    if: contains(github.event.pull_request.changed_files, 'apps/app/')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: 20
          install-dependencies: true
          set-nx-shas: true

      # Only build iOS if the app project is affected
      - name: Check if iOS build is needed
        id: check-ios
        run: |
          if npx nx show projects --affected --json | grep -q '"app"'; then
            echo "build_needed=true" >> $GITHUB_OUTPUT
          else
            echo "build_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build iOS App
        if: steps.check-ios.outputs.build_needed == 'true'
        run: npx nx build-ios app

      - name: Test iOS App
        if: steps.check-ios.outputs.build_needed == 'true'
        run: npx nx test-ios app

  # Android build job for PR validation
  build-android:
    name: Build Android (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: contains(github.event.pull_request.changed_files, 'apps/app/')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: 20
          install-dependencies: true
          set-nx-shas: true

      # Only build Android if the app project is affected
      - name: Check if Android build is needed
        id: check-android
        run: |
          if npx nx show projects --affected --json | grep -q '"app"'; then
            echo "build_needed=true" >> $GITHUB_OUTPUT
          else
            echo "build_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Android App
        if: steps.check-android.outputs.build_needed == 'true'
        run: npx nx build-android app

      - name: Test Android App
        if: steps.check-android.outputs.build_needed == 'true'
        run: npx nx test-android app

  # Summary job that depends on all validation jobs
  pr-validation-summary:
    name: PR Validation Summary
    runs-on: ubuntu-latest
    needs:
      [
        affected-validation,
        lambda-validation,
        mobile-validation,
        build-ios,
        build-android,
      ]
    if: always()

    steps:
      - name: Summary
        run: |
          {
            echo "## PR Validation Summary"
            echo ""
            echo "- **Affected Validation**: ${{ needs.affected-validation.result }}"
            echo "- **Lambda Validation**: ${{ needs.lambda-validation.result }}"
            echo "- **Mobile Validation**: ${{ needs.mobile-validation.result }}"
            echo "- **iOS Build**: ${{ needs.build-ios.result }}"
            echo "- **Android Build**: ${{ needs.build-android.result }}"
          } >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.affected-validation.result }}" == "success" && 
                ("${{ needs.lambda-validation.result }}" == "success" || "${{ needs.lambda-validation.result }}" == "skipped") && 
                ("${{ needs.mobile-validation.result }}" == "success" || "${{ needs.mobile-validation.result }}" == "skipped") &&
                ("${{ needs.build-ios.result }}" == "success" || "${{ needs.build-ios.result }}" == "skipped") &&
                ("${{ needs.build-android.result }}" == "success" || "${{ needs.build-android.result }}" == "skipped") ]]; then
            {
              echo ""
              echo "✅ All validations passed! This PR is ready for review."
            } >> $GITHUB_STEP_SUMMARY
          else
            {
              echo ""
              echo "❌ Some validations failed. Please check the failed jobs above."
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
