# Original workflow content (commented out):

# name: PR Validation
#
# # This workflow provides comprehensive validation for pull requests using Nx DTE
# # It replaces multiple parallel jobs with a single job that leverages Nx's distributed task execution
# on:
#   pull_request:
#     types: [opened, synchronize, reopened]
#   merge_group:

# Cancel in-progress runs for the same workflow on the same PR or merge group
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write
  checks: read
  issues: write # Explicitly needed for commenting on PRs

env:
  # Nx Cloud access token for enhanced CI features (set as GitHub secret)
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  # Base Nx configuration (cloud-specific settings will be set conditionally based on availability test)
  NX_DAEMON: false
  NX_CLOUD_TIMEOUT: 300000
  # Default settings for local execution (will be overridden if cloud is available)
  NX_PARALLEL: 2
  NX_CLOUD_DISTRIBUTED_EXECUTION: false

jobs:
  # Core validation using Nx DTE - consolidates lint, test, build into optimal task distribution
  core-validation:
    name: Code Quality & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: true

      - name: Configure Nx Cloud
        id: nx-cloud
        uses: ./.github/actions/configure-nx-cloud
        with:
          agent-count: "8"
          local-parallel: "2"
          workflow-type: "pr-validation"
          nx-cloud-access-token-candidate: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

      - name: Lint, Test & Build
        uses: ./.github/actions/nx-tasks
        with:
          tasks: "lint test build"
          scope: "affected"
          parallel: "4"
          verbose: "false"

      - name: Package Lambdas
        shell: bash
        run: |
          echo "📦 Packaging lambda functions locally on GitHub runner..."
          echo "This ensures zip utilities are available and avoids cross-platform issues."

          # Use Nx affected to run package task for affected lambda projects only
          # This will automatically detect affected lambdas and handle empty results gracefully
          npx nx affected -t package --base=origin/main --head=HEAD || echo "No lambda projects with package targets were affected"

      - name: Check Formatting
        shell: bash
        run: |
          echo "🎨 Checking code formatting with Prettier..."
          npx nx format:check --base=origin/main --head=HEAD
          if [ $? -eq 0 ]; then
            echo "✅ All files are properly formatted"
          else
            echo "❌ Some files are not properly formatted"
            echo "Run 'npx nx format:write' to fix formatting issues"
            exit 1
          fi

  # Package validation - separate job since it's conditional and has special permissions
  package-validation:
    name: Package Standards
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for package.json changes
        id: check-changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            package:
              - '**/package.json'

      - name: Setup
        if: steps.check-changes.outputs.package == 'true'
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: false

      - name: Validate Standards
        if: steps.check-changes.outputs.package == 'true'
        uses: ./.github/actions/validate-workspace
        with:
          comment-on-failure: ${{ github.event_name == 'pull_request' && github.event.pull_request != null }}

  # Lambda deployment validation - separate since it needs AWS secrets for terraform plan
  lambda-deployment-validation:
    name: Lambda Deployment Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Check for lambda changes
        id: check-lambda-changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            lambdas:
              - 'lambdas/**'

      - name: Setup
        if: steps.check-lambda-changes.outputs.lambdas == 'true'
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: true

      - name: Run Deployment Plans
        if: steps.check-lambda-changes.outputs.lambdas == 'true'
        run: |
          echo "🚀 Running Terraform deployment plans for affected lambda functions..."

          # Check if we have any lambda projects with deploy:plan target
          echo "Checking for lambda projects with deployment plans..."

          # List all projects and filter for lambda-related ones
          if projects_output=$(npx nx show projects --json 2>&1); then
            echo "Successfully retrieved project list"
            
            # Validate JSON and extract lambda projects
            if echo "$projects_output" | jq empty 2>/dev/null; then
              lambda_projects=$(echo "$projects_output" | jq -r '.[] | select(. == "db" or . == "oauth-proxy" or . == "stats-lambda" or . == "game-selection")' 2>/dev/null)
              
              if [ -n "$lambda_projects" ]; then
                echo "Found lambda projects with deployment capabilities:"
                echo "$lambda_projects"
                echo ""
                
                # Run terraform plan for affected lambda projects (without --dry-run since terraform doesn't support it)
                echo "Running terraform plan validation for affected lambda projects..."
                
                # Use a more targeted approach - run deploy:plan only on affected projects
                if npx nx affected -t deploy:plan --skip-nx-cache 2>&1; then
                  echo "✅ Terraform deployment plans completed successfully"
                else
                  echo "⚠️  Some terraform plans had issues, but this is expected in PR validation (missing terraform state, credentials, etc.)"
                  echo "This step validates that terraform configurations are syntactically correct"
                fi
              else
                echo "No lambda projects found with deployment capabilities"
              fi
            else
              echo "❌ Failed to parse projects JSON: $projects_output"
              echo "Skipping terraform plan validation"
            fi
          else
            echo "❌ Failed to get project list: $projects_output"
            echo "Skipping terraform plan validation"
          fi

  # Mobile validation - separate since it's conditional and platform-specific
  mobile-validation:
    name: Mobile Validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Check for mobile app changes
        id: check-mobile-changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            app:
              - 'apps/app/**'
              - 'lib/shared-components/**'
              - 'lib/tamagui-config/**'

      - name: Setup
        if: steps.check-mobile-changes.outputs.app == 'true'
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: true

      - name: Check Mobile Changes
        id: check-mobile
        if: steps.check-mobile-changes.outputs.app == 'true'
        run: |
          echo "📱 Checking if mobile app is affected by this PR..."
          if npx nx show projects --affected --json | grep -q '"app"'; then
            echo "mobile_affected=true" >> $GITHUB_OUTPUT
            echo "Mobile app is affected by this PR"
          else
            echo "mobile_affected=false" >> $GITHUB_OUTPUT
            echo "Mobile app is not affected by this PR"
          fi

      - name: Validate App Config
        if: steps.check-mobile.outputs.mobile_affected == 'true'
        run: |
          echo "🔧 Validating mobile app build configuration..."
          # Mobile-specific validation that wasn't covered in core validation
          npx nx build app --dry-run || echo "Build configuration validated"

      - name: Run E2E Tests
        if: steps.check-mobile.outputs.mobile_affected == 'true'
        run: |
          echo "🧪 Running mobile app E2E tests..."
          npx nx test app-e2e

  # iOS build - separate since it requires macOS runner
  build-ios:
    name: iOS Build
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Check for mobile app changes
        id: check-ios-changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            app:
              - 'apps/app/**'
              - 'lib/shared-components/**'
              - 'lib/tamagui-config/**'

      - name: Setup
        if: steps.check-ios-changes.outputs.app == 'true'
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: true

      - name: Check iOS Changes
        id: check-ios
        if: steps.check-ios-changes.outputs.app == 'true'
        run: |
          echo "🍎 Checking if iOS build is needed for this PR..."
          if npx nx show projects --affected --json | grep -q '"app"'; then
            echo "build_needed=true" >> $GITHUB_OUTPUT
          else
            echo "build_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build iOS
        if: steps.check-ios.outputs.build_needed == 'true'
        run: |
          echo "🔨 Building iOS application..."
          npx nx build-ios app

      - name: Test iOS
        if: steps.check-ios.outputs.build_needed == 'true'
        run: |
          echo "🧪 Testing iOS application..."
          npx nx test-ios app

  # Android build - separate since it needs Java/Android setup
  build-android:
    name: Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Check for mobile app changes
        id: check-android-changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            app:
              - 'apps/app/**'
              - 'lib/shared-components/**'
              - 'lib/tamagui-config/**'

      - name: Setup Java
        if: steps.check-android-changes.outputs.app == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup
        if: steps.check-android-changes.outputs.app == 'true'
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: true

      - name: Check Android Changes
        id: check-android
        if: steps.check-android-changes.outputs.app == 'true'
        run: |
          echo "🤖 Checking if Android build is needed for this PR..."
          if npx nx show projects --affected --json | grep -q '"app"'; then
            echo "build_needed=true" >> $GITHUB_OUTPUT
          else
            echo "build_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Android
        if: steps.check-android.outputs.build_needed == 'true'
        timeout-minutes: 12
        run: |
          echo "🔨 Building Android application..."
          cd apps/app/android
          chmod +x gradlew
          # Kill any existing Gradle daemons
          ./gradlew --stop || true
          # Use CI-optimized Gradle properties
          cp gradle-ci.properties gradle.properties
          ./gradlew assembleDebug --no-daemon --stacktrace --no-parallel --max-workers=2 --no-build-cache

      - name: Test Android
        if: steps.check-android.outputs.build_needed == 'true'
        run: |
          echo "🧪 Testing Android application..."
          npx nx test-android app

  # Lightweight summary job - no setup overhead needed
  pr-validation-summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [core-validation, package-validation, lambda-deployment-validation, mobile-validation, build-ios, build-android]
    if: always()

    steps:
      - name: Generate Summary
        run: |
          echo "📊 Generating PR validation summary report..."
          {
            echo "## PR Validation Summary"
            echo ""
            echo "### Core Tasks (Nx DTE)"
            echo "- **Code Quality & Build** (lint, test, build): ${{ needs.core-validation.result }}"
            echo ""
            echo "### Conditional Validations"
            echo "- **Package.json Standards**: ${{ needs.package-validation.result }}"
            echo "- **Lambda Deployment Validation**: ${{ needs.lambda-deployment-validation.result }}"
            echo "- **Mobile Validation**: ${{ needs.mobile-validation.result }}"
            echo "- **iOS Build**: ${{ needs.build-ios.result }}"
            echo "- **Android Build**: ${{ needs.build-android.result }}"
          } >> $GITHUB_STEP_SUMMARY

          # Check if all required validations passed
          if [[ "${{ needs.core-validation.result }}" == "success" && 
                ("${{ needs.package-validation.result }}" == "success" || "${{ needs.package-validation.result }}" == "skipped") &&
                ("${{ needs.lambda-deployment-validation.result }}" == "success" || "${{ needs.lambda-deployment-validation.result }}" == "skipped") && 
                ("${{ needs.mobile-validation.result }}" == "success" || "${{ needs.mobile-validation.result }}" == "skipped") &&
                ("${{ needs.build-ios.result }}" == "success" || "${{ needs.build-ios.result }}" == "skipped") &&
                ("${{ needs.build-android.result }}" == "success" || "${{ needs.build-android.result }}" == "skipped") ]]; then
            {
              echo ""
              echo "✅ All validations passed! This PR is ready for review."
              echo ""
              if [ "${{ env.NX_LOCAL_FALLBACK }}" = "true" ]; then
                echo "**Execution Mode**: Validation ran in local fallback mode (Nx Cloud unavailable/quota exceeded)."
              else
                echo "**Nx DTE Performance**: Core validation tasks were distributed across ${{ env.NX_CLOUD_DISTRIBUTED_EXECUTION_AGENT_COUNT }} agents for optimal performance."
              fi
            } >> $GITHUB_STEP_SUMMARY
          else
            {
              echo ""
              echo "❌ Some validations failed. Please check the failed jobs above."
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
