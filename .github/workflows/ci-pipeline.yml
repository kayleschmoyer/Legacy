name: "Legacy Sports CI Pipeline"

# =============================================================================
# Legacy Sports CI Pipeline — Multi-Job Architecture
# =============================================================================
# Each logical stage runs as its own GitHub Actions job so that:
#   - detect-changes runs quickly (~30 s) to determine affected components
#   - quality-gates and build-validation run in PARALLEL on dedicated runners
#   - e2e runs only after both quality-gates AND build-validation pass
#   - summarize always runs to post PR comments and update badges
#
# Nx remote cache (GitHub Actions cache) provides cross-run caching.
# All tasks run locally with --parallel for concurrency.
# =============================================================================

on:
  workflow_call:
    inputs:
      debug_mode:
        description: "Enable debug mode for detailed logging"
        required: false
        type: boolean
        default: false
      e2e-test-patterns:
        description: "Playwright grep pattern for E2E tests. Empty string runs all tests."
        required: false
        type: string
        default: "@critical"
      e2e-exclude-patterns:
        description: "Playwright grep-invert pattern to exclude tests. Empty string excludes nothing."
        required: false
        type: string
        default: "@slow"
      e2e-shard-total:
        description: "Number of E2E shards (2 for PRs, 3 for nightly full suite)"
        required: false
        type: number
        default: 2
      runner-label:
        description: "Runner label resolved by the caller (falls back to vars.CI_RUNNER_LABEL or ubuntu-latest)"
        required: false
        type: string
        default: ""
    outputs:
      overall-status:
        value: ${{ jobs.summarize.outputs.overall-status }}
      deployment-ready:
        value: ${{ jobs.summarize.outputs.deployment-ready }}
      web-affected:
        value: ${{ jobs.detect-changes.outputs.web }}
      mobile-affected:
        value: ${{ jobs.detect-changes.outputs.mobile }}
      lambdas-affected:
        value: ${{ jobs.detect-changes.outputs.lambdas }}
      terraform-affected:
        value: ${{ jobs.detect-changes.outputs.terraform }}
      workflow-duration:
        value: ${{ jobs.summarize.outputs.workflow-duration }}

# Permissions inherited from the calling workflow (ci-orchestrator).
# See ci-orchestrator.yml for the full permission rationale.
permissions:
  actions: read
  contents: read
  pull-requests: write
  checks: read
  issues: write
  id-token: write # Required for OIDC auth to AWS (S3 CI artifacts)

env:
  NX_DAEMON: false
  NX_SKIP_NX_CACHE: false
  NX_CACHE_DIRECTORY: .nx-cache
  NODE_OPTIONS: "--max_old_space_size=4096"
  # Disable Nx Cloud globally — this repo uses local caching only.
  # Without this, Nx may emit "Ambiguous Distribution Configuration" warnings
  # when cloud env vars are present but start-ci-run was not called.
  NX_NO_CLOUD: true

jobs:
  # ============================================================================
  # STAGE 1 — Detect project changes
  # ============================================================================
  detect-changes:
    name: "Detect Project Changes"
    runs-on: ${{ inputs.runner-label || vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    outputs:
      web: ${{ steps.detect.outputs.web }}
      mobile: ${{ steps.detect.outputs.mobile }}
      lambdas: ${{ steps.detect.outputs.lambdas }}
      terraform: ${{ steps.detect.outputs.terraform }}
      e2e: ${{ steps.detect.outputs.e2e }}
      api-surface: ${{ steps.detect.outputs.api-surface }}
      affected-components: ${{ steps.detect.outputs.affected-components }}
      requires-full-build: ${{ steps.detect.outputs.requires-full-build }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: false # detect-changes uses only git + dorny/paths-filter + jq — no node_modules needed
          set-nx-shas: true
          include-optional-deps: false

      - name: "Detect Project Changes"
        id: detect
        uses: ./.github/actions/detect-changes
        with:
          force-full-build: ${{ github.ref == 'refs/heads/main' || inputs.debug_mode }}

  # ============================================================================
  # STAGE 2 — Quality gates
  #
  # Runs lint + typecheck + test via `nx affected` with local parallelism.
  # Nx remote cache (via GitHub Actions cache) avoids redundant work.
  # ============================================================================
  quality-gates:
    name: "Quality Gates"
    needs: [detect-changes]
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'skip-ci') &&
      needs.detect-changes.result == 'success'
    runs-on: ${{ inputs.runner-label || vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      NX_PARALLEL: 2
      NODE_OPTIONS: "--max_old_space_size=2048"
      NX_VERBOSE_LOGGING: ${{ inputs.debug_mode || contains(github.event.pull_request.labels.*.name, 'ci-debug') }}
    outputs:
      result: ${{ steps.check-results.outputs.result }}
      migration-immutability-result: ${{ steps.quality.outputs.migration-immutability-result }}
      formatting-result: ${{ steps.quality.outputs.formatting-result }}
      formatting-failed-projects: ${{ steps.quality.outputs.formatting-failed-projects }}
      lint-result: ${{ steps.quality.outputs.lint-result }}
      lint-failed-projects: ${{ steps.quality.outputs.lint-failed-projects }}
      typecheck-result: ${{ steps.quality.outputs.typecheck-result }}
      typecheck-failed-projects: ${{ steps.quality.outputs.typecheck-failed-projects }}
      test-result: ${{ steps.quality.outputs.test-result }}
      test-failed-projects: ${{ steps.quality.outputs.test-failed-projects }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: true
          include-optional-deps: false

      - name: "Setup uv"
        uses: astral-sh/setup-uv@v7

      - name: "Lint Agent Skills"
        run: node scripts/lint-skills.js

      - name: "Code Quality Gates"
        id: quality
        uses: ./.github/actions/quality-gates
        with:
          parallel: "2"

      - name: "Collect Quality Gate Results"
        id: check-results
        if: always()
        shell: bash
        run: |
          RESULT="${{ steps.quality.outputs.result }}"
          echo "result=${RESULT:-failure}" >> $GITHUB_OUTPUT

  # ============================================================================
  # STAGE 2b — Build validation (runs in PARALLEL with quality gates)
  #
  # Builds are independent of lint/typecheck/test — running them in parallel
  # saves 5–15 min of wall-clock time on the happy path.  The e2e job below
  # gates on both quality-gates AND build-validation before proceeding.
  # ============================================================================
  build-validation:
    name: "Build Validation"
    needs: [detect-changes]
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'skip-ci') &&
      needs.detect-changes.result == 'success'
    runs-on: ${{ inputs.runner-label || vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      NX_VERBOSE_LOGGING: ${{ inputs.debug_mode || contains(github.event.pull_request.labels.*.name, 'ci-debug') }}
    outputs:
      overall-result: ${{ steps.build.outputs.overall-result }}
      artifacts-ready: ${{ steps.build.outputs.artifacts-ready }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: false
          include-optional-deps: false

      # detect-changes derives web/mobile/lambdas from broad source categories
      # (app-code, lib-code, lambda-code, config). Nx `affected` handles
      # fine-grained project selection inside each build step.
      # requires-full-build covers integration builds and dependency changes.
      - name: "Build Validation"
        id: build
        uses: ./.github/actions/build-validation
        with:
          should-build-web: >-
            ${{
              needs.detect-changes.outputs.requires-full-build == 'true'
              || needs.detect-changes.outputs.web == 'true'
              || needs.detect-changes.outputs.e2e == 'true'
              || needs.detect-changes.outputs.api-surface == 'true'
            }}
          should-build-mobile: >-
            ${{
              needs.detect-changes.outputs.requires-full-build == 'true'
              || needs.detect-changes.outputs.mobile == 'true'
            }}
          should-build-lambdas: >-
            ${{
              needs.detect-changes.outputs.requires-full-build == 'true'
              || needs.detect-changes.outputs.lambdas == 'true'
            }}
          should-validate-terraform: ${{ needs.detect-changes.outputs.requires-full-build == 'true' || needs.detect-changes.outputs.terraform == 'true' }}
          execution-mode: "local"
          optimal-agents: "4"

      # Upload web build to S3 so the e2e job can consume it without relying solely on Nx remote-cache.
      # Skipped when web wasn't built; e2e falls back to cache in that case.
      - name: "Upload Web Build to S3"
        if: steps.build.outputs.web-result == 'success'
        uses: ./.github/actions/s3-artifact
        with:
          mode: upload
          name: web-build
          path: dist/apps/web

  # ============================================================================
  # STAGE 3 — E2E tests (runs after BOTH quality gates AND build pass)
  # ============================================================================
  e2e:
    name: "E2E Tests (Shard ${{ matrix.shard }})"
    needs: [detect-changes, quality-gates, build-validation]
    if: >-
      needs.quality-gates.result == 'success' &&
      needs.quality-gates.outputs.result == 'success' &&
      needs.build-validation.result == 'success' &&
      needs.build-validation.outputs.overall-result == 'success' &&
      (needs.detect-changes.outputs.web == 'true' ||
      needs.detect-changes.outputs.e2e == 'true' ||
      needs.detect-changes.outputs.api-surface == 'true' ||
      needs.detect-changes.outputs.requires-full-build == 'true')
    runs-on: ${{ inputs.runner-label || vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ inputs.e2e-shard-total == 3 && fromJSON('["1/3","2/3","3/3"]') || fromJSON('["1/2","2/2"]') }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: false
          include-optional-deps: false

      # Download the pre-built web artifact from S3; skipped when
      # web wasn't built (artifacts-ready=false) to avoid noisy warnings.
      - name: "Download Web Build from S3"
        if: needs.build-validation.outputs.artifacts-ready == 'true'
        id: download-web
        uses: ./.github/actions/s3-artifact
        with:
          mode: download
          name: web-build
          path: dist/apps/web

      - name: "E2E Testing"
        id: e2e
        uses: ./.github/actions/e2e-testing
        with:
          should-run-e2e: ${{ needs.build-validation.outputs.artifacts-ready }}
          shard: ${{ matrix.shard }}
          test-patterns: ${{ inputs.e2e-test-patterns }}
          test-patterns-invert: ${{ inputs.e2e-exclude-patterns }}
          e2e-commissioner-email: ${{ secrets.E2E_COMMISSIONER_EMAIL }}
          e2e-commissioner-password: ${{ secrets.E2E_COMMISSIONER_PASSWORD }}
          e2e-manager-1-email: ${{ secrets.E2E_MANAGER_1_EMAIL }}
          e2e-manager-1-password: ${{ secrets.E2E_MANAGER_1_PASSWORD }}
          e2e-manager-2-email: ${{ secrets.E2E_MANAGER_2_EMAIL }}
          e2e-manager-2-password: ${{ secrets.E2E_MANAGER_2_PASSWORD }}
          e2e-manager-3-email: ${{ secrets.E2E_MANAGER_3_EMAIL }}
          e2e-manager-3-password: ${{ secrets.E2E_MANAGER_3_PASSWORD }}

      - name: "Upload Blob Report to S3"
        if: ${{ !cancelled() }}
        uses: ./.github/actions/s3-artifact
        with:
          mode: upload
          name: playwright-blobs/${{ strategy.job-index }}
          path: blob-report/
          if-no-files-found: warn

  # ============================================================================
  # STAGE 3b — Merge E2E shard reports and deploy to GitHub Pages
  # ============================================================================
  deploy-playwright-report:
    name: "Deploy Playwright Report"
    needs: [e2e]
    # Serialize pushes to bkrupa/legacy-sports-deploys gh-pages branch.
    # Concurrent runs from different PRs would otherwise race: both clone the
    # same branch HEAD, then the second push fails with "fetch first" because
    # the first push already advanced the ref. cancel-in-progress: false queues
    # them instead of cancelling so every PR's report still lands.
    concurrency:
      group: deploy-playwright-report-gh-pages
      cancel-in-progress: false
    # Dependabot-triggered runs do not have access to repository secrets, so the
    # GitHub App token mint required to push to bkrupa/legacy-sports-deploys
    # always fails ("appId option is required"). The Playwright HTML report is
    # cosmetic for dep bumps anyway — skip the job entirely so dependabot PRs
    # do not show a stuck failed required check.
    if: "!cancelled() && needs.e2e.result != 'skipped' && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]')"
    runs-on: ${{ inputs.runner-label || vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v6

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: false
          set-nx-shas: false
          include-optional-deps: false

      - name: "Download All Blob Reports from S3"
        id: download-blobs
        uses: ./.github/actions/s3-artifact
        with:
          mode: download
          name: playwright-blobs
          path: all-blob-reports

      - name: "Check for Blob Reports"
        id: check-reports
        run: |
          # S3 downloads may preserve shard subdirectories (0/, 1/, etc.) — flatten them
          if [ -d "all-blob-reports" ]; then
            find all-blob-reports -mindepth 2 -type f -exec mv {} all-blob-reports/ \; 2>/dev/null || true
            find all-blob-reports -mindepth 1 -type d -empty -delete 2>/dev/null || true
          fi
          COUNT=$(find all-blob-reports -name '*.zip' -type f 2>/dev/null | wc -l)
          if [ "$COUNT" -gt 0 ]; then
            echo "has-reports=true" >> $GITHUB_OUTPUT
            echo "Found $COUNT blob report(s) — proceeding with merge"
          else
            echo "has-reports=false" >> $GITHUB_OUTPUT
            echo "No blob reports found — E2E tests were skipped or produced no output"
          fi

      - name: "Merge Playwright Reports"
        if: steps.check-reports.outputs.has-reports == 'true'
        run: |
          pnpm dlx playwright@1.58.2 merge-reports --reporter html ./all-blob-reports

      - name: "Generate App Token"
        id: app-token
        if: steps.check-reports.outputs.has-reports == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PREVIEW_APP_ID }}
          private-key: ${{ secrets.PREVIEW_APP_PRIVATE_KEY }}
          owner: bkrupa
          repositories: legacy-sports-deploys

      - name: "Deploy Playwright Report"
        if: steps.check-reports.outputs.has-reports == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ steps.app-token.outputs.token }}
          external_repository: bkrupa/legacy-sports-deploys
          publish_branch: gh-pages
          publish_dir: ./playwright-report
          destination_dir: playwright-report/${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}

      - name: "Comment Playwright Report URL"
        if: steps.check-reports.outputs.has-reports == 'true' && github.event.pull_request.number
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: playwright-report
          number: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          message: |
            ## 🎭 Playwright Report

            | | |
            |---|---|
            | **Report** | [View Full Report](https://bkrupa.github.io/legacy-sports-deploys/playwright-report/pr-${{ github.event.pull_request.number }}/) |
            | **Run** | [Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
            | **Commit** | `${{ github.event.pull_request.head.sha }}` |

  # ============================================================================
  # STAGE 4 — Summarize results (runs on failure/skip, but not cancellation — posts PR comment, updates badges)
  # ============================================================================
  summarize:
    name: "Summarize & Report"
    needs: [detect-changes, quality-gates, build-validation, e2e]
    if: "!cancelled() && !contains(github.event.pull_request.labels.*.name, 'skip-ci')"
    runs-on: ${{ inputs.runner-label || vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      overall-status: ${{ steps.collect-results.outputs.overall-status }}
      workflow-duration: ${{ steps.collect-results.outputs.workflow-duration }}
      deployment-ready: ${{ steps.deployment-gate.outputs.deployment-ready }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v6

      # Minimal setup — only needs node to run composite actions, not nx tasks
      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: false
          set-nx-shas: false
          include-optional-deps: false

      - name: "Debug: Job Results"
        shell: bash
        run: |
          echo "::group::Raw needs.*.result values (for phantom-failure debugging)"
          echo "detect-changes.result     = ${{ needs.detect-changes.result }}"
          echo "quality-gates.result      = ${{ needs.quality-gates.result }}"
          echo "quality-gates.output      = ${{ needs.quality-gates.outputs.result }}"
          echo "build-validation.result   = ${{ needs.build-validation.result }}"
          echo "build-validation.output   = ${{ needs.build-validation.outputs.overall-result }}"
          echo "e2e.result                = ${{ needs.e2e.result }}"
          echo "::endgroup::"

      - name: "Collect Results"
        id: collect-results
        uses: ./.github/actions/collect-results
        with:
          step-results: |
            {
              "detect-changes":   "${{ needs.detect-changes.result }}",
              "quality-gates":    "${{ needs.quality-gates.outputs.result || needs.quality-gates.result }}",
              "build-validation": "${{ needs.build-validation.outputs.overall-result || needs.build-validation.result }}",
              "e2e-testing":      "${{ needs.e2e.result }}"
            }
          workflow-start-time: ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
          failure-threshold: "quality-gates,build-validation,e2e-testing"

      - name: "Deployment Gate"
        id: deployment-gate
        if: >-
          steps.collect-results.outputs.overall-status == 'success' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: ./.github/actions/deployment-gate
        with:
          artifacts-ready: ${{ needs.build-validation.outputs.artifacts-ready }}
          quality-passed: ${{ needs.quality-gates.outputs.result == 'success' }}
          execution-plan: "{}"
          environment: "production"

      - name: "CI Pipeline Reporting"
        id: ci-reporting
        uses: ./.github/actions/ci-reporting
        with:
          status: ${{ steps.collect-results.outputs.overall-status }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          event-name: ${{ github.event_name }}
          pr-number: ${{ github.event.pull_request.number }}
          execution-mode: "local"
          optimal-agents: "4"
          step-results: ${{ steps.collect-results.outputs.step-results }}
          workflow-duration: ${{ steps.collect-results.outputs.workflow-duration }}
          run-id: ${{ github.run_id }}
          quality-gates-subsections: |
            {
              "migration-immutability": "${{ needs.quality-gates.outputs.migration-immutability-result }}",
              "formatting": "${{ needs.quality-gates.outputs.formatting-result }}",
              "lint":        "${{ needs.quality-gates.outputs.lint-result }}",
              "typecheck":   "${{ needs.quality-gates.outputs.typecheck-result }}",
              "test":        "${{ needs.quality-gates.outputs.test-result }}"
            }
          project-failures: |
            {
              "formatting": "${{ needs.quality-gates.outputs.formatting-failed-projects }}",
              "lint":        "${{ needs.quality-gates.outputs.lint-failed-projects }}",
              "typecheck":   "${{ needs.quality-gates.outputs.typecheck-failed-projects }}",
              "test":        "${{ needs.quality-gates.outputs.test-failed-projects }}"
            }

      - name: "Update CI Status Badges"
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: ./.github/actions/update-badges
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          gist-id: ${{ secrets.CI_BADGES_GIST_ID }}
          workflow-status: ${{ steps.collect-results.outputs.overall-status }}
          step-results: |
            {
              "Change Detection": "${{ needs.detect-changes.result }}",
              "Quality Gates":    "${{ needs.quality-gates.outputs.result || needs.quality-gates.result }}",
              "Build Validation": "${{ needs.build-validation.result }}",
              "E2E Testing":      "${{ needs.e2e.result }}"
            }
          workflow-run-id: ${{ github.run_id }}
          branch: ${{ github.ref_name }}
          commit-sha: ${{ github.sha }}

      - name: "Label PR on Failure"
        if: always() && github.event.pull_request.number
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue.number;
            if (!prNumber) return;

            // Overall job-level results (always available even when outputs are lost)
            const qgJobResult = '${{ needs.quality-gates.result }}';

            // Map CI stage results to label names
            const labelMap = {
              'CI: Migration Immutability': '${{ needs.quality-gates.outputs.migration-immutability-result }}',
              'CI: Formatting': '${{ needs.quality-gates.outputs.formatting-result }}',
              'CI: Lint Failure': '${{ needs.quality-gates.outputs.lint-result }}',
              'CI: Type Error': '${{ needs.quality-gates.outputs.typecheck-result }}',
              'CI: Test Failure': '${{ needs.quality-gates.outputs.test-result }}',
              'CI: Build Failure': '${{ needs.build-validation.outputs.overall-result || needs.build-validation.result }}',
              'CI: E2E Failure': '${{ needs.e2e.result }}',
            };

            // Determine which labels to add (failed)
            const labelsToAdd = [];

            // Track whether any quality-gate subsection reported failure
            const qgLabels = ['CI: Migration Immutability', 'CI: Formatting', 'CI: Lint Failure', 'CI: Type Error', 'CI: Test Failure'];
            let anyQgSubsectionFailed = false;

            for (const [label, result] of Object.entries(labelMap)) {
              if (result === 'failure' || result === 'cancelled') {
                labelsToAdd.push(label);
                if (qgLabels.includes(label)) anyQgSubsectionFailed = true;
              }
              // Empty/missing results are left alone (don't add or remove)
            }

            // Fallback: if quality-gates job failed but no subsection reported
            // failure (outputs lost due to runner interruption), add a generic label
            if (qgJobResult === 'failure' && !anyQgSubsectionFailed) {
              labelsToAdd.push('CI: Quality Gates');
              core.info('Quality gates failed but subsection outputs are missing — adding fallback label');
            }

            // Get existing labels on the PR
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const existingLabels = pr.labels.map(l => l.name);

            // Compute final desired label set: preserve non-CI labels, replace CI
            // labels entirely with labelsToAdd. A single PUT avoids the N sequential
            // DELETEs that trigger GitHub's secondary rate limit.
            const allCiLabels = new Set([...Object.keys(labelMap), 'CI: Quality Gates']);
            const nonCiLabels = existingLabels.filter(l => !allCiLabels.has(l));
            const finalLabels = [...nonCiLabels, ...labelsToAdd];

            async function withRetry(fn, retries = 3) {
              for (let i = 0; i < retries; i++) {
                try { return await fn(); }
                catch (e) {
                  const isPrimaryRateLimit = e.status === 429;
                  const isSecondaryRateLimit = e.status === 403 && /secondary rate limit/i.test(typeof e.message === 'string' ? e.message : '');
                  if ((isPrimaryRateLimit || isSecondaryRateLimit) && i < retries - 1) {
                    const delay = Math.pow(2, i) * 1000;
                    core.warning(`Rate limited (${e.status}), retrying in ${delay}ms…`);
                    await new Promise(r => setTimeout(r, delay));
                  } else throw e;
                }
              }
            }

            await withRetry(() => github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: finalLabels,
            }));
            core.info(`Labels set: [${finalLabels.join(', ')}]`);

      - name: "Discord CI Failure"
        if: >-
          always() &&
          steps.collect-results.outputs.overall-status == 'failure' &&
          github.ref == 'refs/heads/main'
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_CI_WEBHOOK_URL }}
          status: failure
          title: "CI Pipeline Failure"
          description: "Failed steps: ${{ steps.collect-results.outputs.failed-steps }}"

      - name: "Final Status"
        run: |
          STATUS="${{ steps.collect-results.outputs.overall-status }}"
          if [ "$STATUS" = "success" ]; then
            echo "CI Pipeline completed successfully!"
            echo "Duration: ${{ steps.collect-results.outputs.workflow-duration }}s"
          else
            echo "FAILED: CI Pipeline failed"
            echo "Failed Steps: ${{ steps.collect-results.outputs.failed-steps }}"
            echo "Duration: ${{ steps.collect-results.outputs.workflow-duration }}s"
            exit 1
          fi
