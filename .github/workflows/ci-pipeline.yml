name: "Legacy Sports CI Pipeline"

# =============================================================================
# Legacy Sports CI Pipeline — Multi-Job Architecture
# =============================================================================
# Each logical stage runs as its own GitHub Actions job so that:
#   - detect-changes runs quickly (~30 s) to determine affected components
#   - quality-gates and build-validation run in PARALLEL on dedicated runners
#   - e2e runs only after both quality-gates AND build-validation pass
#   - summarize always runs to post PR comments and update badges
#
# Nx remote cache (GitHub Actions cache) provides cross-run caching.
# All tasks run locally with --parallel for concurrency.
# =============================================================================

on:
  workflow_call:
    inputs:
      debug_mode:
        description: "Enable debug mode for detailed logging"
        required: false
        type: boolean
        default: false
      e2e-test-patterns:
        description: "Playwright grep pattern for E2E tests. Empty string runs all tests."
        required: false
        type: string
        default: "@critical"
      e2e-exclude-patterns:
        description: "Playwright grep-invert pattern to exclude tests. Empty string excludes nothing."
        required: false
        type: string
        default: "@slow"
      e2e-shard-total:
        description: "Number of E2E shards (1 for PRs with @critical filter, 2 for broader runs, 3 for nightly full suite)"
        required: false
        type: number
        default: 1
      runner-label:
        description: "Runner label resolved by the caller (falls back to vars.CI_RUNNER_LABEL or ubuntu-latest)"
        required: false
        type: string
        default: ""
    outputs:
      overall-status:
        value: ${{ jobs.summarize.outputs.overall-status }}
      deployment-ready:
        value: ${{ jobs.summarize.outputs.deployment-ready }}
      web-affected:
        value: ${{ jobs.detect-changes.outputs.web }}
      mobile-affected:
        value: ${{ jobs.detect-changes.outputs.mobile }}
      lambdas-affected:
        value: ${{ jobs.detect-changes.outputs.lambdas }}
      terraform-affected:
        value: ${{ jobs.detect-changes.outputs.terraform }}
      workflow-duration:
        value: ${{ jobs.summarize.outputs.workflow-duration }}

# Permissions inherited from the calling workflow (ci-orchestrator).
# See ci-orchestrator.yml for the full permission rationale.
permissions:
  actions: read
  contents: read
  pull-requests: write
  checks: read
  issues: write
  statuses: write # Required for granular commit status posting (lint, format, test, build, custom-checks)
  id-token: write # Required for OIDC auth to AWS (S3 CI artifacts)

env:
  NX_DAEMON: false
  NX_SKIP_NX_CACHE: false
  NX_CACHE_DIRECTORY: .nx-cache
  NODE_OPTIONS: "--max_old_space_size=4096"
  # Disable Nx Cloud globally — this repo uses local caching only.
  # Without this, Nx may emit "Ambiguous Distribution Configuration" warnings
  # when cloud env vars are present but start-ci-run was not called.
  NX_NO_CLOUD: true

jobs:
  # ============================================================================
  # STAGE 1 — Detect project changes
  # ============================================================================
  detect-changes:
    name: "Detect Project Changes"
    # LS-3884: change detection is pure git + paths-filter — no build tooling needed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    outputs:
      web: ${{ steps.detect.outputs.web }}
      mobile: ${{ steps.detect.outputs.mobile }}
      lambdas: ${{ steps.detect.outputs.lambdas }}
      terraform: ${{ steps.detect.outputs.terraform }}
      e2e: ${{ steps.detect.outputs.e2e }}
      api-surface: ${{ steps.detect.outputs.api-surface }}
      affected-components: ${{ steps.detect.outputs.affected-components }}
      requires-full-build: ${{ steps.detect.outputs.requires-full-build }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: false # detect-changes uses only git + dorny/paths-filter + jq — no node_modules needed
          set-nx-shas: true
          include-optional-deps: false

      - name: "Detect Project Changes"
        id: detect
        uses: ./.github/actions/detect-changes
        with:
          force-full-build: ${{ github.ref == 'refs/heads/main' || inputs.debug_mode }}

  # ============================================================================
  # STAGE 2a — Lint & Format (LS-3884: stateless nx tasks on ubuntu-latest)
  #
  # Runs prettier + nx affected lint. No self-hosted infra required.
  # Runs in parallel with quality-gates (typecheck+test) to keep wall time flat.
  # ============================================================================
  lint-format:
    name: "Lint & Format"
    needs: [detect-changes]
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'skip-ci') &&
      needs.detect-changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NX_VERBOSE_LOGGING: ${{ inputs.debug_mode || contains(github.event.pull_request.labels.*.name, 'ci-debug') }}
    outputs:
      result: ${{ steps.check-results.outputs.result }}
      formatting-result: ${{ steps.format.outputs.result }}
      formatting-failed-projects: ${{ steps.format.outputs.failed-projects }}
      lint-result: ${{ steps.lint.outputs.result }}
      lint-failed-projects: ${{ steps.lint.outputs.failed-projects }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: true
          include-optional-deps: false

      - name: "Code Formatting Check"
        id: format
        if: "!cancelled()"
        shell: bash
        run: |
          echo "::notice::To fix locally — Humans: make fmt  |  Agents: make_run({ target: 'fmt' })"
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          CHANGED=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" | sort)
          if [ -n "$CHANGED" ]; then
            CHANGED=$(echo "$CHANGED" | while IFS= read -r f; do
              if [ -f "$f" ] && [ ! -L "$f" ]; then printf '%s\n' "$f"; fi
            done) || true
          fi
          if [ -z "$CHANGED" ]; then
            echo "result=success" >> $GITHUB_OUTPUT
            echo "failed-projects=" >> $GITHUB_OUTPUT
          elif echo "$CHANGED" | xargs pnpm exec prettier --check --ignore-unknown 2>&1 | tee format-check.log; then
            echo "result=success" >> $GITHUB_OUTPUT
            echo "failed-projects=" >> $GITHUB_OUTPUT
          else
            echo "::error::Code formatting check failed. Run 'make fmt' to fix (agents: make_run({ target: 'fmt' }))."
            FAILED=$(grep -oE "apps/[^/]+|lib/[^/]+|lambdas/[^/]+" format-check.log 2>/dev/null | sort -u | paste -sd ',' -) || true
            echo "result=failure" >> $GITHUB_OUTPUT
            echo "failed-projects=${FAILED:-formatting}" >> $GITHUB_OUTPUT
          fi

      - name: "ESLint"
        id: lint
        if: "!cancelled()"
        shell: bash
        run: |
          if pnpm exec nx affected -t lint --parallel=2 2>&1 | tee lint.log; then
            echo "result=success" >> $GITHUB_OUTPUT
            echo "failed-projects=" >> $GITHUB_OUTPUT
          else
            FAILED=$(grep -oE "nx run [^:]+:lint" lint.log 2>/dev/null | sed 's/nx run //;s/:lint//' | sort -u | paste -sd ',' -) || true
            echo "result=failure" >> $GITHUB_OUTPUT
            echo "failed-projects=${FAILED:-lint}" >> $GITHUB_OUTPUT
          fi

      - name: "Collect Lint & Format Results"
        id: check-results
        if: always()
        shell: bash
        run: |
          FMT="${{ steps.format.outputs.result }}"
          LINT="${{ steps.lint.outputs.result }}"
          if [ "$FMT" = "success" ] && [ "$LINT" = "success" ]; then
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "result=failure" >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # STAGE 2b — Quality gates (typecheck + test on self-hosted)
  #
  # Lint and format run in the parallel lint-format job above (ubuntu-latest).
  # This job handles typecheck + test which benefit from self-hosted compute
  # (high memory, fast disk I/O, persistent Nx cache on the runner).
  # ============================================================================
  quality-gates:
    name: "Quality Gates"
    needs: [detect-changes]
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'skip-ci') &&
      needs.detect-changes.result == 'success'
    runs-on: ${{ inputs.runner-label || vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      NX_PARALLEL: 2
      NODE_OPTIONS: "--max_old_space_size=2048"
      NX_VERBOSE_LOGGING: ${{ inputs.debug_mode || contains(github.event.pull_request.labels.*.name, 'ci-debug') }}
    outputs:
      result: ${{ steps.check-results.outputs.result }}
      migration-immutability-result: ${{ steps.quality.outputs.migration-immutability-result }}
      typecheck-result: ${{ steps.quality.outputs.typecheck-result }}
      typecheck-failed-projects: ${{ steps.quality.outputs.typecheck-failed-projects }}
      test-result: ${{ steps.quality.outputs.test-result }}
      test-failed-projects: ${{ steps.quality.outputs.test-failed-projects }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: true
          include-optional-deps: false

      - name: "Setup uv"
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: "Lint Agent Skills"
        run: node scripts/lint-skills.js

      - name: "Code Quality Gates"
        id: quality
        uses: ./.github/actions/quality-gates
        with:
          parallel: "2"
          skip-formatting: "true"
          skip-lint: "true"

      - name: "Collect Quality Gate Results"
        id: check-results
        if: always()
        shell: bash
        run: |
          RESULT="${{ steps.quality.outputs.result }}"
          echo "result=${RESULT:-failure}" >> $GITHUB_OUTPUT

  # ============================================================================
  # STAGE 2b — Build validation (runs in PARALLEL with quality gates)
  #
  # Builds are independent of lint/typecheck/test — running them in parallel
  # saves 5–15 min of wall-clock time on the happy path.  The e2e job below
  # gates on both quality-gates AND build-validation before proceeding.
  # ============================================================================
  build-validation:
    name: "Build Validation"
    needs: [detect-changes]
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'skip-ci') &&
      needs.detect-changes.result == 'success'
    runs-on: ${{ inputs.runner-label || vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      NX_VERBOSE_LOGGING: ${{ inputs.debug_mode || contains(github.event.pull_request.labels.*.name, 'ci-debug') }}
    outputs:
      overall-result: ${{ steps.build.outputs.overall-result }}
      artifacts-ready: ${{ steps.build.outputs.artifacts-ready }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: true
          include-optional-deps: false

      # detect-changes derives web/mobile/lambdas from broad source categories
      # (app-code, lib-code, lambda-code, config). Within each enabled category,
      # `nx affected` provides fine-grained project selection so only truly
      # impacted projects are built. requires-full-build covers integration builds.
      - name: "Build Validation"
        id: build
        uses: ./.github/actions/build-validation
        with:
          should-build-web: >-
            ${{
              needs.detect-changes.outputs.requires-full-build == 'true'
              || needs.detect-changes.outputs.web == 'true'
              || needs.detect-changes.outputs.e2e == 'true'
              || needs.detect-changes.outputs.api-surface == 'true'
            }}
          should-build-mobile: >-
            ${{
              needs.detect-changes.outputs.requires-full-build == 'true'
              || needs.detect-changes.outputs.mobile == 'true'
            }}
          should-build-lambdas: >-
            ${{
              needs.detect-changes.outputs.requires-full-build == 'true'
              || needs.detect-changes.outputs.lambdas == 'true'
            }}
          should-validate-terraform: ${{ needs.detect-changes.outputs.requires-full-build == 'true' || needs.detect-changes.outputs.terraform == 'true' }}
          execution-mode: "local"
          optimal-agents: "4"

      # Upload web build to S3 so the e2e job can consume it without relying solely on Nx remote-cache.
      # Skipped when web wasn't built; e2e falls back to cache in that case.
      - name: "Upload Web Build to S3"
        if: steps.build.outputs.web-result == 'success'
        uses: ./.github/actions/s3-artifact
        with:
          mode: upload
          name: web-build
          path: dist/apps/web

  # ============================================================================
  # STAGE 2c — Granular required checks
  #
  # These jobs emit the named commit status contexts that ruleset.json will
  # require once T17 activates the staged rules. They run in parallel with
  # quality-gates and build-validation during the transition period (T31→T17).
  # Each job posts its status via createCommitStatus so the context name exactly
  # matches the ruleset entry — independent of reusable-workflow name prefixing.
  # ============================================================================
  lint:
    name: "lint"
    needs: [detect-changes]
    if: always() && !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    runs-on: ${{ inputs.runner-label || vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      NX_VERBOSE_LOGGING: ${{ inputs.debug_mode || contains(github.event.pull_request.labels.*.name, 'ci-debug') }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: true
          include-optional-deps: false

      - name: "Lint"
        run: pnpm exec nx affected -t lint

      - name: "Post Commit Status"
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.payload?.pull_request?.head?.sha || context.sha;
            if (!sha) { core.warning('No SHA - skipping commit status'); return; }
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: state === 'success' ? 'Passed' : 'Failed',
              context: 'lint',
            });

  format:
    name: "format"
    needs: [detect-changes]
    if: always() && !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    runs-on: ${{ inputs.runner-label || vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: false
          include-optional-deps: false

      - name: "Format Check"
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"

          if [ -z "$BASE_SHA" ]; then
            echo "No pull request base SHA; running Prettier check on the repository."
            pnpm exec prettier --check --ignore-unknown .
            exit 0
          fi

          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA" \
            | xargs -0 -r pnpm exec prettier --check --ignore-unknown

      - name: "Post Commit Status"
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.payload?.pull_request?.head?.sha || context.sha;
            if (!sha) { core.warning('No SHA - skipping commit status'); return; }
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: state === 'success' ? 'Passed' : 'Failed',
              context: 'format',
            });

  test:
    name: "test"
    needs: [detect-changes]
    if: always() && !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    runs-on: ${{ inputs.runner-label || vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      NX_VERBOSE_LOGGING: ${{ inputs.debug_mode || contains(github.event.pull_request.labels.*.name, 'ci-debug') }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: true
          include-optional-deps: false

      - name: "Test"
        run: pnpm exec nx affected -t test

      - name: "Post Commit Status"
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.payload?.pull_request?.head?.sha || context.sha;
            if (!sha) { core.warning('No SHA - skipping commit status'); return; }
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: state === 'success' ? 'Passed' : 'Failed',
              context: 'test',
            });

  build:
    name: "build"
    needs: [detect-changes]
    if: always() && !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    runs-on: ${{ inputs.runner-label || vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      NX_VERBOSE_LOGGING: ${{ inputs.debug_mode || contains(github.event.pull_request.labels.*.name, 'ci-debug') }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: true
          include-optional-deps: false

      - name: "Build"
        uses: ./.github/actions/build-validation
        with:
          should-build-web: >-
            ${{
              needs.detect-changes.outputs.requires-full-build == 'true'
              || needs.detect-changes.outputs.web == 'true'
              || needs.detect-changes.outputs.e2e == 'true'
              || needs.detect-changes.outputs.api-surface == 'true'
            }}
          should-build-mobile: >-
            ${{
              needs.detect-changes.outputs.requires-full-build == 'true'
              || needs.detect-changes.outputs.mobile == 'true'
            }}
          should-build-lambdas: >-
            ${{
              needs.detect-changes.outputs.requires-full-build == 'true'
              || needs.detect-changes.outputs.lambdas == 'true'
            }}
          should-validate-terraform: ${{ needs.detect-changes.outputs.requires-full-build == 'true' || needs.detect-changes.outputs.terraform == 'true' }}
          execution-mode: "local"
          optimal-agents: "4"

      - name: "Post Commit Status"
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.payload?.pull_request?.head?.sha || context.sha;
            if (!sha) { core.warning('No SHA - skipping commit status'); return; }
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: state === 'success' ? 'Passed' : 'Failed',
              context: 'build',
            });

  custom-checks:
    name: "custom-checks"
    needs: [detect-changes]
    if: always() && !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    runs-on: ${{ inputs.runner-label || vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: true
          include-optional-deps: false

      - name: "Setup uv"
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: "Migration Immutability Check"
        run: node scripts/check-migration-immutability.js --branch

      - name: "Run Custom Check Scripts"
        run: |
          # Each .github/checks/*.sh script is an independent required check.
          # Per design §9.4: adding a check = adding a script here.
          CHECKS_DIR=".github/checks"
          if compgen -G "$CHECKS_DIR/*.sh" > /dev/null 2>&1; then
            for script in "$CHECKS_DIR"/*.sh; do
              echo "Running $script..."
              bash "$script"
            done
          fi
          echo "All custom checks passed"

      - name: "Post Commit Status"
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.payload?.pull_request?.head?.sha || context.sha;
            if (!sha) { core.warning('No SHA - skipping commit status'); return; }
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: state === 'success' ? 'Passed' : 'Failed',
              context: 'custom-checks',
            });

  # ============================================================================
  # STAGE 3 — E2E tests (runs after lint-format, quality gates, AND build pass)
  # ============================================================================
  e2e:
    name: "E2E Tests (Shard ${{ matrix.shard }})"
    needs: [detect-changes, lint-format, quality-gates, build-validation]
    if: >-
      needs.lint-format.result == 'success' &&
      needs.lint-format.outputs.result == 'success' &&
      needs.quality-gates.result == 'success' &&
      needs.quality-gates.outputs.result == 'success' &&
      needs.build-validation.result == 'success' &&
      needs.build-validation.outputs.overall-result == 'success' &&
      (needs.detect-changes.outputs.web == 'true' ||
      needs.detect-changes.outputs.e2e == 'true' ||
      needs.detect-changes.outputs.api-surface == 'true' ||
      needs.detect-changes.outputs.requires-full-build == 'true')
    runs-on: ${{ inputs.runner-label || vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ inputs.e2e-shard-total == 3 && fromJSON('["1/3","2/3","3/3"]') || inputs.e2e-shard-total == 1 && fromJSON('["1/1"]') || fromJSON('["1/2","2/2"]') }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: false
          include-optional-deps: false

      # Download the pre-built web artifact from S3; skipped when
      # web wasn't built (artifacts-ready=false) to avoid noisy warnings.
      - name: "Download Web Build from S3"
        if: needs.build-validation.outputs.artifacts-ready == 'true'
        id: download-web
        uses: ./.github/actions/s3-artifact
        with:
          mode: download
          name: web-build
          path: dist/apps/web

      - name: "E2E Testing"
        id: e2e
        uses: ./.github/actions/e2e-testing
        with:
          should-run-e2e: ${{ needs.build-validation.outputs.artifacts-ready }}
          shard: ${{ matrix.shard }}
          test-patterns: ${{ inputs.e2e-test-patterns }}
          test-patterns-invert: ${{ inputs.e2e-exclude-patterns }}
          e2e-commissioner-email: ${{ secrets.E2E_COMMISSIONER_EMAIL }}
          e2e-commissioner-password: ${{ secrets.E2E_COMMISSIONER_PASSWORD }}
          e2e-manager-1-email: ${{ secrets.E2E_MANAGER_1_EMAIL }}
          e2e-manager-1-password: ${{ secrets.E2E_MANAGER_1_PASSWORD }}
          e2e-manager-2-email: ${{ secrets.E2E_MANAGER_2_EMAIL }}
          e2e-manager-2-password: ${{ secrets.E2E_MANAGER_2_PASSWORD }}
          e2e-manager-3-email: ${{ secrets.E2E_MANAGER_3_EMAIL }}
          e2e-manager-3-password: ${{ secrets.E2E_MANAGER_3_PASSWORD }}

      - name: "Upload Blob Report to S3"
        if: ${{ !cancelled() }}
        uses: ./.github/actions/s3-artifact
        with:
          mode: upload
          name: playwright-blobs/${{ strategy.job-index }}
          path: blob-report/
          if-no-files-found: warn

  # ============================================================================
  # STAGE 3b — Merge E2E shard reports and deploy to GitHub Pages
  # ============================================================================
  deploy-playwright-report:
    name: "Deploy Playwright Report"
    needs: [e2e]
    # Each deploy workflow pushes to a unique subdirectory of the gh-pages branch
    # on bkrupa/legacy-sports-deploys. Push conflicts are handled by the retry-
    # with-rebase loop in the deploy step below. A shared concurrency group is
    # NOT used because GitHub only queues one pending job per group — a third
    # job cancels the pending one, which was causing Playwright deploys to be
    # cancelled during bursts of PR preview deploys.
    #
    # Dependabot-triggered runs do not have access to repository secrets, so the
    # GitHub App token mint required to push to bkrupa/legacy-sports-deploys
    # always fails ("appId option is required"). The Playwright HTML report is
    # cosmetic for dep bumps anyway — skip the job entirely so dependabot PRs
    # do not show a stuck failed required check.
    if: >-
      !cancelled() &&
      needs.e2e.result != 'skipped' &&
      ((github.event_name != 'pull_request' && github.event_name != 'pull_request_review') ||
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: false
          set-nx-shas: false
          include-optional-deps: false

      - name: "Download All Blob Reports from S3"
        id: download-blobs
        uses: ./.github/actions/s3-artifact
        with:
          mode: download
          name: playwright-blobs
          path: all-blob-reports

      - name: "Check for Blob Reports"
        id: check-reports
        run: |
          # S3 downloads may preserve shard subdirectories (0/, 1/, etc.) — flatten them
          if [ -d "all-blob-reports" ]; then
            find all-blob-reports -mindepth 2 -type f -exec mv {} all-blob-reports/ \; 2>/dev/null || true
            find all-blob-reports -mindepth 1 -type d -empty -delete 2>/dev/null || true
          fi
          COUNT=$(find all-blob-reports -name '*.zip' -type f 2>/dev/null | wc -l)
          if [ "$COUNT" -gt 0 ]; then
            echo "has-reports=true" >> $GITHUB_OUTPUT
            echo "Found $COUNT blob report(s) — proceeding with merge"
          else
            echo "has-reports=false" >> $GITHUB_OUTPUT
            echo "No blob reports found — E2E tests were skipped or produced no output"
          fi

      - name: "Merge Playwright Reports"
        if: steps.check-reports.outputs.has-reports == 'true'
        run: |
          pnpm dlx playwright@1.58.2 merge-reports --reporter html ./all-blob-reports

      - name: "Generate App Token"
        id: app-token
        if: steps.check-reports.outputs.has-reports == 'true'
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        with:
          app-id: ${{ secrets.PREVIEW_APP_ID }}
          private-key: ${{ secrets.PREVIEW_APP_PRIVATE_KEY }}
          repositories: legacy-sports-deploys

      - name: "Deploy Playwright Report"
        if: steps.check-reports.outputs.has-reports == 'true'
        env:
          DEPLOY_TOKEN: ${{ steps.app-token.outputs.token }}
          DEST_DIR: playwright-report/${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${DEPLOY_TOKEN}@github.com/bkrupa/legacy-sports-deploys.git"

          # Retry clone to handle transient GitHub App token propagation delays.
          # The token mint and clone race — GitHub's auth backend may not have
          # propagated the new installation token by the time git clone fires,
          # causing a spurious "repository not found" (~once per PR).
          CLONE_RETRIES=5
          for attempt in $(seq 1 $CLONE_RETRIES); do
            rm -rf _deploy
            if git clone --depth 1 --single-branch --branch gh-pages "$REPO_URL" _deploy; then
              break
            fi
            [ "$attempt" -eq "$CLONE_RETRIES" ] && { echo "Clone failed after ${CLONE_RETRIES} attempts"; exit 1; }
            echo "Clone attempt ${attempt} failed — retrying in ${attempt}s..."
            sleep "$attempt"
          done
          cd _deploy

          rm -rf "${DEST_DIR}"
          mkdir -p "${DEST_DIR}"
          cp -r ../playwright-report/. "${DEST_DIR}/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .

          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi

          git commit -m "deploy ${DEST_DIR}"

          # Push with pull-rebase retry to handle races from other workflows
          # pushing to the same gh-pages branch between our clone and push.
          # Jitter avoids thundering-herd when multiple deploys retry together.
          MAX_RETRIES=7
          for attempt in $(seq 1 $MAX_RETRIES); do
            if git push origin gh-pages; then
              echo "Push succeeded (attempt ${attempt})"
              exit 0
            fi
            JITTER=$((RANDOM % 5))
            echo "Push failed (attempt ${attempt}) — retrying in $((attempt * 2 + JITTER))s..."
            sleep $((attempt * 2 + JITTER))
            git pull --rebase origin gh-pages
          done

          echo "Push failed after ${MAX_RETRIES} attempts"
          exit 1

      - name: "Comment Playwright Report URL"
        if: steps.check-reports.outputs.has-reports == 'true' && github.event.pull_request.number
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: playwright-report
          number: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          message: |
            ## 🎭 Playwright Report

            | | |
            |---|---|
            | **Report** | [View Full Report](https://bkrupa.github.io/legacy-sports-deploys/playwright-report/pr-${{ github.event.pull_request.number }}/) |
            | **Run** | [Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
            | **Commit** | `${{ github.event.pull_request.head.sha }}` |

  # ============================================================================
  # STAGE 4 — Summarize results (runs on failure/skip, but not cancellation — posts PR comment, updates badges)
  # ============================================================================
  summarize:
    name: "Summarize & Report"
    needs: [detect-changes, lint-format, quality-gates, build-validation, e2e, lint, format, test, build, custom-checks]
    if: "always() && !cancelled() && !contains(github.event.pull_request.labels.*.name, 'skip-ci')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      overall-status: ${{ steps.collect-results.outputs.overall-status }}
      workflow-duration: ${{ steps.collect-results.outputs.workflow-duration }}
      deployment-ready: ${{ steps.deployment-gate.outputs.deployment-ready }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Minimal setup — only needs node to run composite actions, not nx tasks
      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: false
          set-nx-shas: false
          include-optional-deps: false

      - name: "Debug: Job Results"
        shell: bash
        run: |
          echo "::group::Raw needs.*.result values (for phantom-failure debugging)"
          echo "detect-changes.result     = ${{ needs.detect-changes.result }}"
          echo "lint-format.result        = ${{ needs.lint-format.result }}"
          echo "lint-format.output        = ${{ needs.lint-format.outputs.result }}"
          echo "quality-gates.result      = ${{ needs.quality-gates.result }}"
          echo "quality-gates.output      = ${{ needs.quality-gates.outputs.result }}"
          echo "build-validation.result   = ${{ needs.build-validation.result }}"
          echo "build-validation.output   = ${{ needs.build-validation.outputs.overall-result }}"
          echo "e2e.result                = ${{ needs.e2e.result }}"
          echo "lint.result               = ${{ needs.lint.result }}"
          echo "format.result             = ${{ needs.format.result }}"
          echo "test.result               = ${{ needs.test.result }}"
          echo "build.result              = ${{ needs.build.result }}"
          echo "custom-checks.result      = ${{ needs.custom-checks.result }}"
          echo "::endgroup::"

      - name: "Collect Results"
        id: collect-results
        uses: ./.github/actions/collect-results
        with:
          step-results: |
            {
              "detect-changes":   "${{ needs.detect-changes.result }}",
              "lint-format":      "${{ needs.lint-format.outputs.result || needs.lint-format.result }}",
              "quality-gates":    "${{ needs.quality-gates.outputs.result || needs.quality-gates.result }}",
              "build-validation": "${{ needs.build-validation.outputs.overall-result || needs.build-validation.result }}",
              "e2e-testing":      "${{ needs.e2e.result }}"
            }
          workflow-start-time: ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
          failure-threshold: "lint-format,quality-gates,build-validation,e2e-testing"

      - name: "Deployment Gate"
        id: deployment-gate
        if: >-
          steps.collect-results.outputs.overall-status == 'success' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: ./.github/actions/deployment-gate
        with:
          artifacts-ready: ${{ needs.build-validation.outputs.artifacts-ready }}
          quality-passed: ${{ needs.lint-format.outputs.result == 'success' && needs.quality-gates.outputs.result == 'success' }}
          execution-plan: "{}"
          environment: "production"

      - name: "CI Pipeline Reporting"
        id: ci-reporting
        uses: ./.github/actions/ci-reporting
        with:
          status: ${{ steps.collect-results.outputs.overall-status }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          event-name: ${{ github.event_name }}
          pr-number: ${{ github.event.pull_request.number }}
          execution-mode: "local"
          optimal-agents: "4"
          step-results: ${{ steps.collect-results.outputs.step-results }}
          workflow-duration: ${{ steps.collect-results.outputs.workflow-duration }}
          run-id: ${{ github.run_id }}
          quality-gates-subsections: |
            {
              "migration-immutability": "${{ needs.quality-gates.outputs.migration-immutability-result }}",
              "formatting": "${{ needs.lint-format.outputs.formatting-result }}",
              "lint":        "${{ needs.lint-format.outputs.lint-result }}",
              "typecheck":   "${{ needs.quality-gates.outputs.typecheck-result }}",
              "test":        "${{ needs.quality-gates.outputs.test-result }}"
            }
          project-failures: |
            {
              "formatting": "${{ needs.lint-format.outputs.formatting-failed-projects }}",
              "lint":        "${{ needs.lint-format.outputs.lint-failed-projects }}",
              "typecheck":   "${{ needs.quality-gates.outputs.typecheck-failed-projects }}",
              "test":        "${{ needs.quality-gates.outputs.test-failed-projects }}"
            }

      - name: "Update CI Status Badges"
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: ./.github/actions/update-badges
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          gist-id: ${{ secrets.CI_BADGES_GIST_ID }}
          workflow-status: ${{ steps.collect-results.outputs.overall-status }}
          step-results: |
            {
              "Change Detection": "${{ needs.detect-changes.result }}",
              "Quality Gates":    "${{ needs.quality-gates.outputs.result || needs.quality-gates.result }}",
              "Build Validation": "${{ needs.build-validation.result }}",
              "E2E Testing":      "${{ needs.e2e.result }}"
            }
          workflow-run-id: ${{ github.run_id }}
          branch: ${{ github.ref_name }}
          commit-sha: ${{ github.sha }}

      - name: "Label PR on Failure"
        if: always() && github.event.pull_request.number
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue.number;
            if (!prNumber) return;

            // Overall job-level results (always available even when outputs are lost)
            const lfJobResult = '${{ needs.lint-format.result }}';
            const qgJobResult = '${{ needs.quality-gates.result }}';

            // Map CI stage results to label names
            const labelMap = {
              'CI: Migration Immutability': '${{ needs.quality-gates.outputs.migration-immutability-result }}',
              'CI: Formatting': '${{ needs.lint-format.outputs.formatting-result }}',
              'CI: Lint Failure': '${{ needs.lint-format.outputs.lint-result }}',
              'CI: Type Error': '${{ needs.quality-gates.outputs.typecheck-result }}',
              'CI: Test Failure': '${{ needs.quality-gates.outputs.test-result }}',
              'CI: Build Failure': '${{ needs.build-validation.outputs.overall-result || needs.build-validation.result }}',
              'CI: E2E Failure': '${{ needs.e2e.result }}',
            };

            // Determine which labels to add (failed)
            const labelsToAdd = [];

            // Track whether any quality-gate or lint-format subsection reported failure
            const lfLabels = ['CI: Formatting', 'CI: Lint Failure'];
            const qgLabels = ['CI: Migration Immutability', 'CI: Type Error', 'CI: Test Failure'];
            let anyLfSubsectionFailed = false;
            let anyQgSubsectionFailed = false;

            for (const [label, result] of Object.entries(labelMap)) {
              if (result === 'failure' || result === 'cancelled') {
                labelsToAdd.push(label);
                if (lfLabels.includes(label)) anyLfSubsectionFailed = true;
                if (qgLabels.includes(label)) anyQgSubsectionFailed = true;
              }
              // Empty/missing results are left alone (don't add or remove)
            }

            // Fallback: if lint-format job failed but no subsection reported
            // failure (outputs lost due to runner interruption), add a generic label
            if (lfJobResult === 'failure' && !anyLfSubsectionFailed) {
              labelsToAdd.push('CI: Lint & Format');
              core.info('Lint & format failed but subsection outputs are missing — adding fallback label');
            }

            // Fallback: if quality-gates job failed but no subsection reported
            // failure (outputs lost due to runner interruption), add a generic label
            if (qgJobResult === 'failure' && !anyQgSubsectionFailed) {
              labelsToAdd.push('CI: Quality Gates');
              core.info('Quality gates failed but subsection outputs are missing — adding fallback label');
            }

            // Get existing labels on the PR
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const existingLabels = pr.labels.map(l => l.name);

            // Compute final desired label set: preserve non-CI labels, replace CI
            // labels entirely with labelsToAdd. A single PUT avoids the N sequential
            // DELETEs that trigger GitHub's secondary rate limit.
            const allCiLabels = new Set([...Object.keys(labelMap), 'CI: Lint & Format', 'CI: Quality Gates']);
            const nonCiLabels = existingLabels.filter(l => !allCiLabels.has(l));
            const finalLabels = [...nonCiLabels, ...labelsToAdd];

            async function withRetry(fn, retries = 3) {
              for (let i = 0; i < retries; i++) {
                try { return await fn(); }
                catch (e) {
                  const isPrimaryRateLimit = e.status === 429;
                  const isSecondaryRateLimit = e.status === 403 && /secondary rate limit/i.test(typeof e.message === 'string' ? e.message : '');
                  if ((isPrimaryRateLimit || isSecondaryRateLimit) && i < retries - 1) {
                    const delay = Math.pow(2, i) * 1000;
                    core.warning(`Rate limited (${e.status}), retrying in ${delay}ms…`);
                    await new Promise(r => setTimeout(r, delay));
                  } else throw e;
                }
              }
            }

            await withRetry(() => github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: finalLabels,
            }));
            core.info(`Labels set: [${finalLabels.join(', ')}]`);

      - name: "Discord CI Failure"
        if: >-
          always() &&
          steps.collect-results.outputs.overall-status == 'failure' &&
          github.ref == 'refs/heads/main'
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_PLAYWRIGHT_WEBHOOK_URL }}
          status: failure
          title: "CI Pipeline Failure"
          description: "Failed steps: ${{ steps.collect-results.outputs.failed-steps }}"

      - name: "Final Status"
        run: |
          STATUS="${{ steps.collect-results.outputs.overall-status }}"
          if [ "$STATUS" = "success" ]; then
            echo "CI Pipeline completed successfully!"
            echo "Duration: ${{ steps.collect-results.outputs.workflow-duration }}s"
          else
            echo "FAILED: CI Pipeline failed"
            echo "Failed Steps: ${{ steps.collect-results.outputs.failed-steps }}"
            echo "Duration: ${{ steps.collect-results.outputs.workflow-duration }}s"
            exit 1
          fi
