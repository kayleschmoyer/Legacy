name: "🚀 Legacy Sports CI Pipeline"

# =============================================================================
# Legacy Sports CI Pipeline - Unified PR & Integration Testing
# =============================================================================
# 
# This unified pipeline serves dual purposes using composable actions:
# 
# 🎯 PR Mode (affected-only):
# - Fast feedback on pull requests
# - Tests only changed components  
# - Optimized for developer productivity
#
# 🌐 Integration Mode (full workspace):
# - Comprehensive validation on main branch
# - Tests ALL projects to catch integration issues
# - Replaces separate integration-build workflow
# 
# Architecture Benefits:
# - Single source of truth for all validation logic
# - Composable actions ensure consistency
# - No code duplication between PR and integration testing
# - 50% reduction in CI resource usage
# =============================================================================

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      debug_mode:
        description: "Enable debug mode for detailed logging"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write
  checks: read
  issues: write

env:
  IOS_BUILDS_ENABLED: false
  NX_DAEMON: false
  NX_PARALLEL: 4
  NX_CACHE_DIRECTORY: .nx-cache
  NX_SKIP_NX_CACHE: false
  NODE_OPTIONS: "--max_old_space_size=4096"
  NX_VERBOSE_LOGGING: ${{ github.event.inputs.debug_mode == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-debug') }}
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  ci-pipeline:
    name: "CI Pipeline (Fully Composable)"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    outputs:
      # High-level results
      overall-status: ${{ steps.collect-results.outputs.overall-status }}
      deployment-ready: ${{ steps.deployment-gate.outputs.deployment-ready }}
      
      # Component results
      web-affected: ${{ steps.detect-changes.outputs.web }}
      mobile-affected: ${{ steps.detect-changes.outputs.mobile }}
      lambdas-affected: ${{ steps.detect-changes.outputs.lambdas }}
      terraform-affected: ${{ steps.detect-changes.outputs.terraform }}
      
      # Performance metrics
      execution-strategy: ${{ steps.execution-plan.outputs.strategy }}
      workflow-duration: ${{ steps.collect-results.outputs.workflow-duration }}
      dte-available: ${{ steps.detect-dte.outputs.dte-available }}

    steps:
      # ======================================================================
      # STAGE 1: ENVIRONMENT SETUP & INTELLIGENCE
      # ======================================================================

      - name: "🚀 Checkout Repository"
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: tree:0

      - name: "🔧 Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: true

      - name: "☁️ Detect DTE Availability"
        id: detect-dte
        uses: ./.github/actions/detect-dte
        with:
          nx-cloud-token: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

      - name: "🔍 Detect Project Changes"
        id: detect-changes
        uses: ./.github/actions/detect-changes
        with:
          # Force full build on main branch (integration mode) or debug mode
          force-full-build: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.debug_mode == 'true') }}

      - name: "📊 Generate Execution Plan"
        id: execution-plan
        uses: ./.github/actions/execution-plan
        with:
          affected-components: ${{ steps.detect-changes.outputs.affected-components }}
          execution-mode: ${{ steps.detect-dte.outputs.execution-mode }}
          dte-available: ${{ steps.detect-dte.outputs.dte-available }}
          optimal-agents: ${{ steps.detect-dte.outputs.optimal-agents }}
          requires-full-build: ${{ steps.detect-changes.outputs.requires-full-build }}
          ios-enabled: ${{ env.IOS_BUILDS_ENABLED }}
          event-name: ${{ github.event_name }}

      # ======================================================================
      # STAGE 2: VALIDATION PIPELINE
      # ======================================================================

      - name: "🎨 Code Quality Gates"
        id: quality-gates
        uses: ./.github/actions/quality-gates
        with:
          execution-mode: ${{ steps.detect-dte.outputs.execution-mode }}
          dte-available: ${{ steps.detect-dte.outputs.dte-available }}
          optimal-agents: ${{ steps.detect-dte.outputs.optimal-agents }}

      - name: "🏗️ Build Validation"
        id: build-validation
        if: success() && steps.quality-gates.outputs.result == 'success'
        uses: ./.github/actions/build-validation
        with:
          should-build-web: ${{ steps.execution-plan.outputs.should-build-web }}
          should-build-mobile: ${{ steps.execution-plan.outputs.should-build-mobile }}
          should-build-lambdas: ${{ steps.execution-plan.outputs.should-build-lambdas }}
          should-validate-terraform: ${{ steps.execution-plan.outputs.should-validate-terraform }}
          execution-mode: ${{ steps.detect-dte.outputs.execution-mode }}
          optimal-agents: ${{ steps.detect-dte.outputs.optimal-agents }}

      - name: "🎭 E2E Testing"
        id: e2e-testing
        if: steps.build-validation.outputs.overall-result == 'success' || steps.build-validation.outputs.overall-result == ''
        uses: ./.github/actions/e2e-testing
        with:
          should-run-e2e: ${{ steps.execution-plan.outputs.should-run-e2e }}

      # ======================================================================
      # STAGE 3: RESULTS & DEPLOYMENT READINESS
      # ======================================================================

      - name: "� Stop DTE Agents"
        if: always() && steps.detect-dte.outputs.dte-available == 'true'
        run: |
          echo "🛑 Stopping Nx Cloud DTE agents..."
          npx nx-cloud stop-all-agents || echo "⚠️ Failed to stop agents (they may have already stopped)"
          echo "✅ Agent cleanup complete"

      - name: "�📊 Collect Results"
        id: collect-results
        if: always()
        uses: ./.github/actions/collect-results
        with:
          step-results: |
            {
              "detect-dte": "${{ steps.detect-dte.conclusion }}",
              "detect-changes": "${{ steps.detect-changes.conclusion }}",
              "execution-plan": "${{ steps.execution-plan.conclusion }}",
              "quality-gates": "${{ steps.quality-gates.outputs.result || steps.quality-gates.conclusion }}",
              "build-validation": "${{ steps.build-validation.outputs.overall-result || steps.build-validation.conclusion }}",
              "e2e-testing": "${{ steps.e2e-testing.outputs.result || steps.e2e-testing.conclusion }}"
            }
          workflow-start-time: ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
          failure-threshold: "quality-gates,build-validation"

      - name: "🚀 Deployment Gate"
        id: deployment-gate
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/deployment-gate
        with:
          artifacts-ready: ${{ steps.build-validation.outputs.artifacts-ready }}
          quality-passed: ${{ steps.quality-gates.outputs.result == 'success' }}
          execution-plan: ${{ steps.execution-plan.outputs.execution-plan }}
          environment: "production"

      - name: "📢 CI Pipeline Reporting"
        id: ci-reporting
        if: always()
        uses: ./.github/actions/ci-reporting
        with:
          status: ${{ steps.collect-results.outputs.overall-status }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          event-name: ${{ github.event_name }}
          pr-number: ${{ github.event.pull_request.number }}
          execution-mode: ${{ steps.detect-dte.outputs.execution-mode }}
          optimal-agents: ${{ steps.detect-dte.outputs.optimal-agents }}
          fallback-reason: ${{ steps.detect-dte.outputs.fallback-reason }}
          execution-plan: ${{ steps.execution-plan.outputs.execution-plan }}
          step-results: ${{ steps.collect-results.outputs.step-results }}
          workflow-duration: ${{ steps.collect-results.outputs.workflow-duration }}
          run-id: ${{ github.run_id }}

      # ======================================================================
      # FINAL STATUS ORCHESTRATION
      # ======================================================================

      - name: "🎖️ Update CI Status Badges"
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: ./.github/actions/update-badges
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          gist-id: ${{ secrets.CI_BADGES_GIST_ID }}
          workflow-status: ${{ steps.collect-results.outputs.overall-status }}
          step-results: |
            {
              "DTE Detection": "${{ steps.detect-dte.outcome }}",
              "Change Detection": "${{ steps.detect-changes.outcome }}",
              "Execution Plan": "${{ steps.execution-plan.outcome }}",
              "Quality Gates": "${{ steps.quality-gates.outputs.result || steps.quality-gates.outcome }}",
              "Build Validation": "${{ steps.build-validation.outcome }}",
              "E2E Testing": "${{ steps.e2e-testing.outcome }}",
              "Deployment Gate": "${{ steps.deployment-gate.outcome }}"
            }
          workflow-run-id: ${{ github.run_id }}
          branch: ${{ github.ref_name }}
          commit-sha: ${{ github.sha }}
          dte-status: ${{ steps.detect-dte.outputs.dte-available }}

      - name: "🎉 Success Summary"
        if: steps.collect-results.outputs.overall-status == 'success'
        run: |
          echo "🎉 CI Pipeline completed successfully!"
          echo ""
          echo "📊 Final Summary:"
          echo "- Strategy: ${{ steps.execution-plan.outputs.strategy }}"
          echo "- Duration: ${{ steps.collect-results.outputs.workflow-duration }}s"
          echo "- Execution Mode: ${{ steps.detect-dte.outputs.execution-mode }}"
          echo ""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "✅ This PR is ready for review and merge!"
          elif [ "${{ steps.deployment-gate.outputs.deployment-ready }}" = "true" ]; then
            echo "🚀 Ready for deployment using ${{ steps.deployment-gate.outputs.deployment-strategy }} strategy!"
          fi

      - name: "❌ Failure Summary"
        if: steps.collect-results.outputs.overall-status != 'success'
        run: |
          echo "❌ CI Pipeline failed"
          echo ""
          echo "Failed Steps: ${{ steps.collect-results.outputs.failed-steps }}"
          echo "Duration: ${{ steps.collect-results.outputs.workflow-duration }}s"
          echo ""
          echo "Check the detailed PR comment for specific guidance on fixing the issues."
          exit 1
