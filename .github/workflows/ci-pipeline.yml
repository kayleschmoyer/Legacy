name: "Legacy Sports CI Pipeline"

# =============================================================================
# Legacy Sports CI Pipeline — Multi-Job Architecture
# =============================================================================
# Each logical stage runs as its own GitHub Actions job so that:
#   - detect-changes runs quickly (~30 s) to determine affected components
#   - lint (which also runs the format check, LS-8901), test, build,
#     custom-checks run in PARALLEL
#   - e2e runs only after lint, test, and build all pass
#   - summarize always runs to post PR comments and update badges
#
# Nx remote cache (GitHub Actions cache) provides cross-run caching.
# All tasks run locally with --parallel for concurrency.
# =============================================================================

on:
  workflow_call:
    inputs:
      debug_mode:
        description: "Enable debug mode for detailed logging"
        required: false
        type: boolean
        default: false
      e2e-test-patterns:
        description: "Playwright grep pattern for E2E tests. Empty string runs all tests."
        required: false
        type: string
        default: "@critical"
      e2e-exclude-patterns:
        description: "Playwright grep-invert pattern to exclude tests. Empty string excludes nothing."
        required: false
        type: string
        default: "@slow"
      e2e-shard-total:
        description: "Number of E2E shards (1 for PRs with @critical filter, 2 for broader runs, 3 for nightly full suite)"
        required: false
        type: number
        default: 1
      runner-label:
        description: "Runner label resolved by the caller (falls back to vars.CI_RUNNER_LABEL or ubuntu-latest)"
        required: false
        type: string
        default: ""
      pr-number:
        description: >-
          PR number this run is scoped to. Populated by the orchestrator for
          the native pull_request/pull_request_review triggers (from the
          event payload) and, per LS-9148, for workflow_dispatch runs that
          were dispatched with a pr_number input. Empty for PR-less runs
          (e.g. workflow_dispatch with no pr_number).
        required: false
        type: string
        default: ""
      base-sha:
        description: >-
          PR base SHA to diff format-check against (LS-9148 — resolved by the
          orchestrator for workflow_dispatch runs; falls back to
          github.event.pull_request.base.sha on native PR triggers)
        required: false
        type: string
        default: ""
      head-sha:
        description: >-
          PR head SHA to diff format-check against (LS-9148 — resolved by the
          orchestrator for workflow_dispatch runs; falls back to
          github.event.pull_request.head.sha on native PR triggers)
        required: false
        type: string
        default: ""
    outputs:
      overall-status:
        value: ${{ jobs.summarize.outputs.overall-status }}
      deployment-ready:
        value: ${{ jobs.summarize.outputs.deployment-ready }}
      web-affected:
        value: ${{ jobs.detect-changes.outputs.web }}
      mobile-affected:
        value: ${{ jobs.detect-changes.outputs.mobile }}
      lambdas-affected:
        value: ${{ jobs.detect-changes.outputs.lambdas }}
      terraform-affected:
        value: ${{ jobs.detect-changes.outputs.terraform }}
      workflow-duration:
        value: ${{ jobs.summarize.outputs.workflow-duration }}

# Permissions inherited from the calling workflow (ci-orchestrator).
# See ci-orchestrator.yml for the full permission rationale.
permissions:
  actions: read
  contents: read
  pull-requests: write
  checks: read
  issues: write
  statuses: write # Required for granular commit status posting (lint/format, test, build, custom-checks)
  id-token: write # Required for OIDC auth to AWS (S3 CI artifacts)

env:
  NX_DAEMON: false
  NX_SKIP_NX_CACHE: false
  NX_CACHE_DIRECTORY: .nx-cache
  NODE_OPTIONS: "--max_old_space_size=4096"
  # Disable Nx Cloud globally — this repo uses local caching only.
  # Without this, Nx may emit "Ambiguous Distribution Configuration" warnings
  # when cloud env vars are present but start-ci-run was not called.
  NX_NO_CLOUD: true

jobs:
  # ============================================================================
  # STAGE 1 — Detect project changes
  # ============================================================================
  detect-changes:
    name: "Detect Project Changes"
    # LS-3884: change detection is pure git + paths-filter — no build tooling needed
    # ubuntu-latest: install-dependencies: false — no self-hosted AMI benefit; runs on every push (LS-9450)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    outputs:
      web: ${{ steps.detect.outputs.web }}
      mobile: ${{ steps.detect.outputs.mobile }}
      lambdas: ${{ steps.detect.outputs.lambdas }}
      terraform: ${{ steps.detect.outputs.terraform }}
      e2e: ${{ steps.detect.outputs.e2e }}
      api-surface: ${{ steps.detect.outputs.api-surface }}
      affected-components: ${{ steps.detect.outputs.affected-components }}
      requires-full-build: ${{ steps.detect.outputs.requires-full-build }}
      # Hermetic e2e affected-spec selection (LS-7846). The e2e job consumes
      # these to run @critical PLUS the specs the PR's changed files map to,
      # or the FULL suite (sharded) when a broad surface changed.
      e2e-affected-run-all: ${{ steps.e2e-select.outputs.run-all }}
      e2e-affected-specs: ${{ steps.e2e-select.outputs.specs }}
      e2e-grep: ${{ steps.e2e-select.outputs.grep }}
      e2e-grep-invert: ${{ steps.e2e-select.outputs.grep-invert }}
      e2e-shard-matrix: ${{ steps.e2e-select.outputs.shard-matrix }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: false # detect-changes uses only git + dorny/paths-filter + jq — no node_modules needed
          set-nx-shas: true
          include-optional-deps: false

      - name: "Detect Project Changes"
        id: detect
        uses: ./.github/actions/detect-changes
        with:
          force-full-build: ${{ github.ref == 'refs/heads/main' || inputs.debug_mode }}

      # Hermetic e2e affected-spec selection (LS-7846). Maps the PR's changed
      # files to the e2e specs that exercise the affected surfaces, using the
      # shared selector + apps/web-e2e/src/e2e-surface-map.json. Emits:
      #   run-all     — "true" when a broad surface (schema, shared-components,
      #                 shared e2e harness) changed → run the FULL suite, sharded.
      #   specs       — newline list of affected spec files (narrow changes).
      #   grep/invert — Playwright grep for the main e2e run (@critical safety
      #                 net for narrow changes; "" = all tests when run-all).
      #   shard-matrix— JSON array consumed by the e2e job's matrix.
      # Over-selection is safe; under-selection risks a missed regression.
      - name: "Compute affected hermetic E2E specs"
        id: e2e-select
        shell: bash
        env:
          BASE_REF: ${{ steps.detect.outputs.base-ref-used }}
          HEAD_REF: ${{ steps.detect.outputs.head-ref-used }}
          GREP_NARROW: ${{ inputs.e2e-test-patterns }}
          GREP_INVERT: ${{ inputs.e2e-exclude-patterns }}
          SHARD_TOTAL: ${{ inputs.e2e-shard-total }}
        run: |
          # NOTE: deliberately NOT `set -e`. This step must never fail the
          # detect-changes job — on any selection error it degrades to
          # @critical-only (today's behaviour) and always emits valid outputs.
          set -uo pipefail
          MANIFEST="apps/web-e2e/src/e2e-surface-map.json"

          # Compute changed files; fall back to empty (no affected specs, @critical
          # still runs) if the diff cannot be computed (e.g. shallow/new branch).
          : > /tmp/e2e-changed.txt
          if [ -n "${BASE_REF:-}" ] && [ -n "${HEAD_REF:-}" ]; then
            git diff --name-only --diff-filter=AMRD "$BASE_REF" "$HEAD_REF" > /tmp/e2e-changed.txt 2>/dev/null || : > /tmp/e2e-changed.txt
          fi

          RUN_ALL=false
          SPECS=""
          if node .github/scripts/integration-select/select-specs.mjs \
               --manifest "$MANIFEST" \
               --changed-from-stdin --json < /tmp/e2e-changed.txt > /tmp/e2e-select.json 2>/tmp/e2e-select.err; then
            cat /tmp/e2e-select.json
            RUN_ALL=$(node -e "process.stdout.write(String(require('/tmp/e2e-select.json').runAll))" 2>/dev/null || echo false)
            SPECS=$(node -e "process.stdout.write(require('/tmp/e2e-select.json').specs.join('\n'))" 2>/dev/null || echo "")
          else
            echo "::warning::E2E spec selection failed — falling back to @critical-only. Details:"
            cat /tmp/e2e-select.err || true
          fi

          # LS-9449: an over-selected "narrow" run is strictly worse than the
          # run-all path — the same (or more) specs on ONE shard with a
          # 30-minute budget instead of three, plus a full mobile re-run of the
          # same list on one shard. 203 affected spec files (~1888
          # tests) ran 26-31 minutes and got cancelled at the job timeout on
          # three consecutive runs. Promote to the full-suite sharded path
          # (both the chromium and — since LS-9658 — the Mobile Chrome jobs
          # shard it) once the selection is too large for the single-shard
          # budgets. 100 files ≈ ~930 tests ≈ ~12 min/shard — comfortable
          # margin under both timeouts.
          SPEC_COUNT=$(printf '%s\n' "$SPECS" | grep -c . || true)
          if [ "$RUN_ALL" != "true" ] && [ "${SPEC_COUNT:-0}" -ge 100 ]; then
            echo "::notice::Affected spec count ${SPEC_COUNT} >= 100 — promoting to the full-suite sharded run (single-shard timeout protection, LS-9449)"
            RUN_ALL=true
            SPECS=""
          fi

          # Default grep (narrow change): @critical safety net, exclude @slow.
          GREP="$GREP_NARROW"
          if [ "$RUN_ALL" = "true" ]; then
            # Broad change → run the whole hermetic suite (still excludes @slow),
            # sharded so it stays within the per-job timeout budget.
            GREP=""
            SHARD_MATRIX='["1/3","2/3","3/3"]'
          else
            case "${SHARD_TOTAL:-1}" in
              3) SHARD_MATRIX='["1/3","2/3","3/3"]' ;;
              1) SHARD_MATRIX='["1/1"]' ;;
              *) SHARD_MATRIX='["1/2","2/2"]' ;;
            esac
          fi

          # Defense-in-depth (review thread 01KTJCV6WH4CGS5DDKG92XPBJD): the grep
          # values originate from the trusted orchestrator (static "@critical" /
          # "@slow"), never from PR-controlled data — but the downstream
          # e2e-testing action evals the grep into a shell command, so constrain
          # both to a safe Playwright-grep charset before emitting. Anything
          # outside it falls back to the @critical/@slow defaults.
          SAFE_GREP_RE='^[A-Za-z0-9@|()_.*-]*$'
          if ! [[ "$GREP" =~ $SAFE_GREP_RE ]]; then
            echo "::warning::e2e grep pattern '$GREP' has unexpected characters — falling back to @critical"
            GREP="@critical"
          fi
          if ! [[ "$GREP_INVERT" =~ $SAFE_GREP_RE ]]; then
            echo "::warning::e2e grep-invert pattern '$GREP_INVERT' has unexpected characters — falling back to @slow"
            GREP_INVERT="@slow"
          fi

          {
            echo "run-all=$RUN_ALL"
            echo "grep=$GREP"
            echo "grep-invert=$GREP_INVERT"
            echo "shard-matrix=$SHARD_MATRIX"
            echo "specs<<__E2E_SPECS__"
            echo "$SPECS"
            echo "__E2E_SPECS__"
          } >> "$GITHUB_OUTPUT"

          echo "::notice::E2E selection — run-all=$RUN_ALL, affected specs=$(echo "$SPECS" | grep -c . || true), shards=$SHARD_MATRIX"

      # LS-9661 SHADOW MODE (observe-only): derive a second surface map from
      # the real module graph (spec imports ∪ app-shell closure ∪ visited-route
      # page closures) and run the SAME selector over the SAME changed files,
      # then log the diff. The live selection above is untouched — the flip to
      # the derived map happens in a later PR, only after the shadow period
      # shows no high-confidence under-selection (corroborated nightly by the
      # LS-7850 auditor running against the derived map). The greppable
      # `E2E-SELECT-SHADOW` line is the measurement record for the LS-8905
      # 79% escalation-rate before/after. This step must never fail the job.
      - name: "Shadow: graph-derived E2E selection (LS-9661)"
        shell: bash
        run: |
          set -uo pipefail
          warn_and_stop() {
            echo "::warning::LS-9661 shadow selection: $1 (observe-only — no impact on live selection)"
            exit 0
          }
          START=$(date +%s)
          node .github/scripts/e2e-graph/derive-surface-map.mjs \
            --out /tmp/derived-surface-map.json \
            || warn_and_stop "derive-surface-map.mjs failed"
          echo "::notice::LS-9661 derived map generated in $(( $(date +%s) - START ))s"
          [ -f /tmp/e2e-changed.txt ] || : > /tmp/e2e-changed.txt
          node .github/scripts/integration-select/select-specs.mjs \
            --manifest /tmp/derived-surface-map.json \
            --changed-from-stdin --json \
            < /tmp/e2e-changed.txt > /tmp/e2e-select-derived.json \
            || warn_and_stop "select-specs.mjs (derived manifest) failed"
          [ -f /tmp/e2e-select.json ] \
            || warn_and_stop "live selection JSON absent (selection error fallback) — shadow diff skipped"
          node .github/scripts/e2e-graph/shadow-compare.mjs \
            --live /tmp/e2e-select.json \
            --derived /tmp/e2e-select-derived.json \
            --promote-at 100 \
            --md-out /tmp/e2e-shadow.md \
            || warn_and_stop "shadow-compare.mjs failed"
          cat /tmp/e2e-shadow.md >> "$GITHUB_STEP_SUMMARY" || true

  # ============================================================================
  # STAGE 2 — Granular CI jobs (run in parallel)
  #
  # When this workflow is invoked via workflow_call from ci-orchestrator.yml's
  # "🚀 CI Pipeline" job, GitHub creates check runs named
  # "🚀 CI Pipeline / <job-id>". Since the LS-8014 config cutover these check
  # runs are informational — the required CI signal is the aggregate "CI Gate"
  # commit status posted by the summarize job (see ruleset.json and
  # .agents/skills/pr-lifecycle/references/ci-checks-reference.md).
  # Jobs run in parallel after detect-changes; e2e gates on all of these passing.
  # ============================================================================
  # LS-8901: lint and format are both fast nx-affected-style checks with no
  # isolation requirement between them — merged into one job (one checkout,
  # one pnpm install) to save a runner spin-up + dependency install per PR
  # push. Tradeoff: a lint failure and a format failure now surface as ONE
  # check-run row instead of two; `lint-failure-excerpt` / `format-failure-
  # excerpt` outputs (and the "CI: Lint Failure" / "CI: Formatting" PR labels
  # below) still distinguish which check actually failed. `set-nx-shas: true`
  # (previously `false` on the standalone format job — that job never used
  # nx affected, so the SHA range went unused) keeps both steps' SHA-range
  # detection consistent now that they share a job.
  lint:
    name: "lint & format"
    needs: [detect-changes]
    if: always() && !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    runs-on: ${{ inputs.runner-label || vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    outputs:
      lint-failure-excerpt: ${{ steps.capture-lint.outputs.excerpt }}
      format-failure-excerpt: ${{ steps.capture-format.outputs.excerpt }}
    env:
      NX_VERBOSE_LOGGING: ${{ inputs.debug_mode || contains(github.event.pull_request.labels.*.name, 'ci-debug') }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: true
          include-optional-deps: false

      - name: "Lint"
        id: lint
        run: |
          set -o pipefail
          pnpm exec nx affected -t lint 2>&1 | tee "$RUNNER_TEMP/ci-lint.log"

      # Always run, even if Lint failed above, so a format issue is never
      # masked by an unrelated lint failure (matches the two-separate-jobs
      # behaviour this replaces). Skipped only on cancellation.
      - name: "Format Check"
        id: format
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          run_format() {
            # LS-9148: prefer the orchestrator-resolved PR SHAs (populated for
            # workflow_dispatch runs dispatched with pr_number) before falling
            # back to the native pull_request event payload.
            BASE_SHA="${{ inputs.base-sha || github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ inputs.head-sha || github.event.pull_request.head.sha || github.sha }}"

            if [ -z "$BASE_SHA" ]; then
              NO_BASE_REASON="not a pull_request-triggered run, and no pr_number was resolved for this workflow_dispatch"
              echo "::warning::No PR base SHA available (${NO_BASE_REASON}) — running Prettier check on the whole repo instead of the PR diff."
              pnpm exec prettier --check --ignore-unknown .
              return
            fi

            # Filter to files that actually exist on disk: partial-clone checkouts
            # (filter: tree:0) may not materialise every blob from the diff range.
            # The trailing `; true` forces the filter subshell to exit 0 regardless
            # of the final `[ -f "$f" ]` test: under `set -o pipefail`, a missing
            # last-sorted path would otherwise make the subshell exit 1 and fail the
            # whole pipeline even though prettier (the rightmost stage) succeeded
            # (LS-8207). Real prettier formatting errors still surface — they come
            # from the `xargs ... prettier` stage, which is unaffected by this guard.
            #
            # Three-dot (merge-base) diff, not two-dot: BASE_SHA can be stale
            # relative to the base branch's current tip — either because the
            # orchestrator-resolved `inputs.base-sha` was captured at dispatch
            # time and main has since moved, or because a stacked PR's own
            # branch predates a later unrelated main commit. A two-dot diff
            # between BASE_SHA and HEAD_SHA surfaces every difference between
            # those two commits, including main-only changes the PR never
            # touched, and falsely flags them as part of this PR's diff. A
            # three-dot diff is anchored to the merge-base of the two refs, so
            # it only shows what HEAD_SHA actually changed since it diverged.
            git diff --name-only --diff-filter=ACMR -z "$BASE_SHA...$HEAD_SHA" \
              | (while IFS= read -r -d '' f; do [ -f "$f" ] && printf '%s\0' "$f"; done; true) \
              | xargs -0 -r pnpm exec prettier --check --ignore-unknown
          }
          run_format 2>&1 | tee "$RUNNER_TEMP/ci-format.log"

      - name: "Capture lint failure"
        id: capture-lint
        if: steps.lint.outcome == 'failure'
        uses: ./.github/actions/capture-ci-failure
        with:
          tool: lint
          log: ${{ runner.temp }}/ci-lint.log

      - name: "Capture format failure"
        id: capture-format
        if: steps.format.outcome == 'failure'
        uses: ./.github/actions/capture-ci-failure
        with:
          tool: format
          log: ${{ runner.temp }}/ci-format.log

  test:
    name: "test"
    needs: [detect-changes]
    if: always() && !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    runs-on: ${{ inputs.runner-label || vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    outputs:
      failure-excerpt: ${{ steps.capture.outputs.excerpt }}
    env:
      # Cap per-process heap lower than the global 4096 so that NX_PARALLEL=2 + Jest
      # workers don't collectively OOM the runner when all projects are affected
      # (e.g. after a pnpm-lock.yaml change).
      NODE_OPTIONS: "--max_old_space_size=2048"
      NX_VERBOSE_LOGGING: ${{ inputs.debug_mode || contains(github.event.pull_request.labels.*.name, 'ci-debug') }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: true
          include-optional-deps: false

      - name: "Typecheck & Test"
        run: |
          set -o pipefail
          pnpm exec nx affected -t typecheck test 2>&1 | tee "$RUNNER_TEMP/ci-test.log"

      - name: "Capture test failure"
        id: capture
        if: failure()
        uses: ./.github/actions/capture-ci-failure
        with:
          tool: test
          log: ${{ runner.temp }}/ci-test.log

  build:
    name: "build"
    needs: [detect-changes]
    if: always() && !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    runs-on: ${{ inputs.runner-label || vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      NX_VERBOSE_LOGGING: ${{ inputs.debug_mode || contains(github.event.pull_request.labels.*.name, 'ci-debug') }}
    outputs:
      artifacts-ready: ${{ steps.build-validation.outputs.artifacts-ready }}
      failure-excerpt: ${{ steps.capture.outputs.excerpt }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: true
          include-optional-deps: false

      - name: "Build"
        id: build-validation
        uses: ./.github/actions/build-validation
        with:
          should-build-web: >-
            ${{
              needs.detect-changes.outputs.requires-full-build == 'true'
              || needs.detect-changes.outputs.web == 'true'
              || needs.detect-changes.outputs.e2e == 'true'
              || needs.detect-changes.outputs.api-surface == 'true'
            }}
          should-build-mobile: >-
            ${{
              needs.detect-changes.outputs.requires-full-build == 'true'
              || needs.detect-changes.outputs.mobile == 'true'
            }}
          should-build-lambdas: >-
            ${{
              needs.detect-changes.outputs.requires-full-build == 'true'
              || needs.detect-changes.outputs.lambdas == 'true'
            }}
          should-validate-terraform: ${{ needs.detect-changes.outputs.requires-full-build == 'true' || needs.detect-changes.outputs.terraform == 'true' }}
          execution-mode: "local"
          optimal-agents: "4"

      - name: "Upload Web Build to S3"
        if: steps.build-validation.outputs.web-result == 'success'
        uses: ./.github/actions/s3-artifact
        with:
          mode: upload
          name: web-build
          path: dist/apps/web
          if-no-files-found: error

      # build-validation tees each build to build-*.log and terraform to
      # terraform-*-{init,validate}.log; distil whichever failed.
      - name: "Capture build failure"
        id: capture
        if: failure()
        uses: ./.github/actions/capture-ci-failure
        with:
          tool: build
          log: build-*.log,terraform-*-init.log,terraform-*-validate.log

  custom-checks:
    name: "custom-checks"
    needs: [detect-changes]
    if: always() && !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    runs-on: ${{ inputs.runner-label || vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    outputs:
      failure-excerpt: ${{ steps.capture.outputs.excerpt }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: true
          include-optional-deps: false

      - name: "Setup uv"
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      # Each custom-checks step tees into one shared log so that, on failure,
      # the capture step can distil whichever check broke.
      - name: "Lint Agent Skills"
        run: |
          set -o pipefail
          node scripts/lint-skills.js 2>&1 | tee -a "$RUNNER_TEMP/ci-custom-checks.log"

      - name: "Migration Immutability Check"
        run: |
          set -o pipefail
          node scripts/check-migration-immutability.js --branch 2>&1 | tee -a "$RUNNER_TEMP/ci-custom-checks.log"

      - name: "Workflow working-directory existence (LS-4910)"
        run: |
          set -o pipefail
          node scripts/validate-workflows.js 2>&1 | tee -a "$RUNNER_TEMP/ci-custom-checks.log"

      - name: "Touch-Map Documentation Freshness"
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          node scripts/lint-touch-map.js 2>&1 | tee -a "$RUNNER_TEMP/ci-custom-checks.log"

      - name: "Run Custom Check Scripts"
        run: |
          set -o pipefail
          # Each .github/checks/*.sh script is an independent required check.
          # Per design §9.4: adding a check = adding a script here.
          run_custom_checks() {
            CHECKS_DIR=".github/checks"
            if compgen -G "$CHECKS_DIR/*.sh" > /dev/null 2>&1; then
              for script in "$CHECKS_DIR"/*.sh; do
                echo "Running $script..."
                bash "$script"
              done
            fi
            echo "All custom checks passed"
          }
          run_custom_checks 2>&1 | tee -a "$RUNNER_TEMP/ci-custom-checks.log"

      # PowerShell is required for the .ps1 script tests below. The self-hosted
      # runner AMI bakes pwsh in (terraform/runners/packer/runner-ami.pkr.hcl),
      # but this install-if-missing fallback keeps the job green on older AMIs
      # that predate the bake-in and on the ubuntu-latest fallback runner (which
      # already ships pwsh, so the install branch is skipped). LS-7770.
      #
      # This is environment setup, not a check. When the fallback does run it
      # apt-installs on a shared runner and can hit transient dpkg/apt lock
      # contention ("removing the lock file is always wrong" + exit 2), which
      # previously failed the whole required check on an otherwise-green PR
      # (LS-8015). Hardened so a setup flake retries instead of failing the gate:
      #   - every apt-get call waits up to 5 min for the dpkg lock
      #     (-o DPkg::Lock::Timeout=300) instead of erroring out immediately;
      #   - the install is wrapped in a bounded retry loop;
      #   - the step is continue-on-error so a setup flake never fails the gate —
      #     if pwsh genuinely cannot be installed, the real signal surfaces as a
      #     failure of the "Script Unit Tests (PowerShell)" check below, not here.
      - name: "Ensure PowerShell"
        continue-on-error: true
        run: |
          set -o pipefail
          ensure_pwsh() {
            if command -v pwsh >/dev/null 2>&1; then
              echo "pwsh already present: $(pwsh --version)"
              return 0
            fi
            echo "pwsh not found — installing from the Microsoft APT repo"
            export DEBIAN_FRONTEND=noninteractive
            local attempt
            for attempt in 1 2 3; do
              # apt-get installs the local repo-config .deb (and respects the lock
              # timeout, unlike `dpkg -i`), refreshes the index, then installs pwsh.
              if curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb -o /tmp/packages-microsoft-prod.deb \
                && sudo apt-get -o DPkg::Lock::Timeout=300 install -y -qq /tmp/packages-microsoft-prod.deb \
                && sudo apt-get -o DPkg::Lock::Timeout=300 update -qq \
                && sudo apt-get -o DPkg::Lock::Timeout=300 install -y -qq powershell; then
                rm -f /tmp/packages-microsoft-prod.deb
                pwsh --version
                return 0
              fi
              rm -f /tmp/packages-microsoft-prod.deb || true
              echo "::warning::pwsh install attempt ${attempt} failed (likely dpkg/apt lock contention) — retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
            done
            echo "::warning::pwsh install failed after 3 attempts; the PowerShell script tests below will surface this if pwsh is required"
            return 1
          }
          ensure_pwsh 2>&1 | tee -a "$RUNNER_TEMP/ci-custom-checks.log"

      - name: "Script Unit Tests (node)"
        run: |
          set -o pipefail
          pnpm run test:scripts 2>&1 | tee -a "$RUNNER_TEMP/ci-custom-checks.log"

      - name: "Script Unit Tests (PowerShell)"
        run: |
          set -o pipefail
          pnpm run test:scripts:ps 2>&1 | tee -a "$RUNNER_TEMP/ci-custom-checks.log"

      - name: "Capture custom-checks failure"
        id: capture
        if: failure()
        uses: ./.github/actions/capture-ci-failure
        with:
          tool: custom-checks
          log: ${{ runner.temp }}/ci-custom-checks.log

  # ============================================================================
  # Lockfile drift check — validates pnpm-lock.yaml against every workspace
  # package.json without doing a full install. Runs in seconds because
  # --lockfile-only skips downloading packages and writing node_modules, and
  # --frozen-lockfile makes pnpm exit non-zero on drift rather than regenerate
  # the lockfile. Independent of detect-changes so it starts immediately. LS-5060.
  # ============================================================================
  lockfile-check:
    name: "lockfile-check"
    if: always() && !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    # ubuntu-latest: --lockfile-only never writes node_modules — no self-hosted AMI benefit; runs on every push (LS-9450)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: false
          set-nx-shas: false
          include-optional-deps: false

      - name: "Validate pnpm-lock.yaml matches workspace package.json files"
        env:
          CI: "true"
        run: |
          set -o pipefail
          # --frozen-lockfile: exit non-zero if pnpm-lock.yaml would change (drift)
          # --lockfile-only:   parse manifests + resolve; do NOT write node_modules
          # --ignore-scripts:  skip lifecycle scripts (never reached with the above)
          # On drift, pnpm prints ERR_PNPM_OUTDATED_LOCKFILE naming the package
          # whose specifier no longer matches the lockfile.
          if ! pnpm install --frozen-lockfile --lockfile-only --ignore-scripts; then
            echo ""
            echo "::error::pnpm-lock.yaml is out of sync with one or more workspace package.json files."
            echo "::error::Fix: run 'pnpm install' locally, then commit the updated pnpm-lock.yaml."
            exit 1
          fi
          echo "pnpm-lock.yaml matches all workspace package.json files"

  # ============================================================================
  # STAGE 3 — E2E tests (runs after lint (incl. format), test, AND build all pass)
  # ============================================================================
  e2e:
    name: "E2E Tests (Shard ${{ matrix.shard }})"
    needs: [detect-changes, lint, test, build]
    if: >-
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.detect-changes.outputs.web == 'true' ||
      needs.detect-changes.outputs.e2e == 'true' ||
      needs.detect-changes.outputs.api-surface == 'true' ||
      needs.detect-changes.outputs.requires-full-build == 'true')
    runs-on: ${{ inputs.runner-label || vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    # LS-9467: PR #6909's gating run completed in 30m06s — 6 seconds past the
    # old 30-minute ceiling — which raced GitHub's own timeout-cancellation
    # against a step that had already recorded a real failure, rolling the
    # job's conclusion up to `cancelled` instead of `failure` and letting a
    # deterministically-broken spec merge to main (see ci-gate.js's
    # cancelledJobHadRealFailure for the belt-and-suspenders fix on the gate
    # side). More headroom makes hitting that exact race far less likely.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Shard count is computed by detect-changes (LS-7846): 1 shard for a
        # narrow change (@critical + affected specs), 3 shards when a broad
        # surface changed and the full suite runs.
        shard: ${{ fromJSON(needs.detect-changes.outputs.e2e-shard-matrix) }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: false
          include-optional-deps: false

      # Download the pre-built web artifact from S3; skipped when
      # web wasn't built (artifacts-ready=false) to avoid noisy warnings.
      - name: "Download Web Build from S3"
        if: needs.build.outputs.artifacts-ready == 'true'
        id: download-web
        uses: ./.github/actions/s3-artifact
        with:
          mode: download
          name: web-build
          path: dist/apps/web
          if-no-files-found: error

      - name: "E2E Testing"
        id: e2e
        uses: ./.github/actions/e2e-testing
        with:
          should-run-e2e: ${{ needs.build.outputs.artifacts-ready }}
          shard: ${{ matrix.shard }}
          # LS-7846: grep is computed by detect-changes — "@critical" for a
          # narrow change (the affected specs run in the step below) or "" (the
          # full suite) when a broad surface changed.
          test-patterns: ${{ needs.detect-changes.outputs.e2e-grep }}
          test-patterns-invert: ${{ needs.detect-changes.outputs.e2e-grep-invert }}
          e2e-commissioner-email: ${{ secrets.E2E_COMMISSIONER_EMAIL }}
          e2e-commissioner-password: ${{ secrets.E2E_COMMISSIONER_PASSWORD }}
          e2e-manager-1-email: ${{ secrets.E2E_MANAGER_1_EMAIL }}
          e2e-manager-1-password: ${{ secrets.E2E_MANAGER_1_PASSWORD }}
          e2e-manager-2-email: ${{ secrets.E2E_MANAGER_2_EMAIL }}
          e2e-manager-2-password: ${{ secrets.E2E_MANAGER_2_PASSWORD }}
          e2e-manager-3-email: ${{ secrets.E2E_MANAGER_3_EMAIL }}
          e2e-manager-3-password: ${{ secrets.E2E_MANAGER_3_PASSWORD }}

      # LS-7846: run the specs the PR's changed files map to, IN ADDITION to
      # the @critical run above. This is the gate that catches regressions in
      # the affected (non-@critical) area before merge instead of at the
      # nightly. Skipped when a broad surface changed (run-all → the step above
      # already ran the full suite) or when nothing mapped. @critical and @slow
      # are excluded here: @critical already ran above, @slow stays nightly-only.
      # Uses the line reporter so it does not clobber the shard blob report.
      - name: "E2E Tests (affected specs)"
        if: >-
          needs.build.outputs.artifacts-ready == 'true' &&
          needs.detect-changes.outputs.e2e-affected-run-all != 'true' &&
          needs.detect-changes.outputs.e2e-affected-specs != ''
        shell: bash
        env:
          CI: "true"
          AFFECTED_SPECS: ${{ needs.detect-changes.outputs.e2e-affected-specs }}
        run: |
          set -euo pipefail
          printf '%s\n' "$AFFECTED_SPECS" | grep -v '^[[:space:]]*$' > /tmp/affected-specs.txt
          mapfile -t SPECS < /tmp/affected-specs.txt
          # Defensive: never run Playwright with zero file args (that would run
          # the WHOLE suite on a single shard). The job `if` already guards this,
          # but a list that filters to empty must skip, not fall through.
          if [ "${#SPECS[@]}" -eq 0 ]; then
            echo "No affected specs after filtering — nothing to run."
            exit 0
          fi
          echo "🎯 Running affected hermetic e2e specs (excluding @critical/@slow):"
          cat /tmp/affected-specs.txt
          # PLAYWRIGHT_BROWSERS_PATH was exported to "" via GITHUB_ENV by the
          # E2E Testing step, so browsers resolve from the user cache here too.
          # --pass-with-no-tests: an affected spec whose tests are ALL @critical
          # (already run above) or @slow leaves an empty selection after
          # --grep-invert. Playwright treats zero matched tests as a hard error
          # (exit 1) by default; this flag makes that case a no-op pass instead.
          pnpm exec playwright test \
            --config=apps/web-e2e/playwright.config.ts \
            --project=chromium \
            --grep-invert="@critical|@slow" \
            --reporter=line \
            --pass-with-no-tests \
            --output=apps/web-e2e/test-results-affected \
            "${SPECS[@]}"

      - name: "Upload Blob Report to S3"
        if: ${{ !cancelled() }}
        uses: ./.github/actions/s3-artifact
        with:
          mode: upload
          name: playwright-blobs/${{ strategy.job-index }}
          path: blob-report/
          if-no-files-found: warn

  # ============================================================================
  # STAGE 3-mobile — Narrow mobile-viewport E2E coverage (LS-9411)
  # ============================================================================
  # LS-9326 and LS-9408 both shipped viewport-gated regressions (useMedia()/
  # isNarrowViewport branches) that PR CI could not have caught: the e2e job
  # above only ever runs --project=chromium at a 1280px viewport. Both bugs
  # were only visible on the post-deploy nightly's mobile matrix
  # (run-playwright-tests.yml), hours after merge and non-blocking.
  #
  # This job re-runs the EXACT SAME LS-7846 selection the chromium pass
  # already computed — same e2e-grep, same e2e-affected-specs, same shard
  # matrix — a second time on one mobile project. No second selection is
  # computed here.
  #
  # Scope decisions:
  #   - Mobile Chrome only. It shares the chromium engine (and therefore the
  #     already-AMI-baked/user-cached browser binary — see the "Verify
  #     AMI-baked Playwright browsers" step and playwright.config.ts's
  #     resolvePwBrowserExecutable comment, LS-8739) with the desktop chromium
  #     pass above, so it adds no new browser-install cost.
  #   - Mobile Safari is deliberately EXCLUDED from PR CI. It has its own
  #     recent flake history independent of viewport (LS-9328, LS-9409) and
  #     stabilizing a flaky project on a merge-blocking gate would trade a
  #     missed-regression problem for a stuck-PR problem. It keeps running
  #     nightly-only in run-playwright-tests.yml until that flake history
  #     clears; revisit adding it here once it does.
  #   - LS-9658 (supersedes LS-9411's original gating decision): runs at FULL
  #     PARITY with the chromium e2e job — same job-level condition, same
  #     detect-changes outputs, same shard matrix. The original gate skipped
  #     this job whenever the selection escalated to run-all, which inverted
  #     the intent: the broadest changes (app shell, shared-components — the
  #     exact surfaces behind LS-9572/LS-9496, LS-9408 and LS-9326) got ZERO
  #     mobile-viewport coverage at PR time. Maintainer accepted the runner
  #     cost of the sharded mobile full suite on run-all PRs (2026-08-23).
  #     A PR with no e2e-relevant changes still skips this job entirely, same
  #     as it skips the e2e job.
  e2e-mobile:
    name: "E2E Tests (Mobile Chrome — Shard ${{ matrix.shard }})"
    needs: [detect-changes, lint, test, build]
    if: >-
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.detect-changes.outputs.web == 'true' ||
      needs.detect-changes.outputs.e2e == 'true' ||
      needs.detect-changes.outputs.api-surface == 'true' ||
      needs.detect-changes.outputs.requires-full-build == 'true')
    runs-on: ${{ inputs.runner-label || vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    # 45 (not the previous 20): the run-all path now runs full-suite shards
    # here — same budget rationale as the chromium e2e job above (LS-9467).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Identical shard matrix to the chromium e2e job (LS-9658): 1 shard
        # for a narrow change (@critical + affected specs), 3 shards when a
        # broad surface changed and the full suite runs.
        shard: ${{ fromJSON(needs.detect-changes.outputs.e2e-shard-matrix) }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: false
          include-optional-deps: false

      - name: "Download Web Build from S3"
        if: needs.build.outputs.artifacts-ready == 'true'
        id: download-web
        uses: ./.github/actions/s3-artifact
        with:
          mode: download
          name: web-build
          path: dist/apps/web
          if-no-files-found: error

      # Same @critical safety net as the chromium "E2E Testing" step above,
      # reusing the identical e2e-grep/e2e-grep-invert outputs — no second
      # selection — just re-run at Mobile Chrome's 375x667 viewport instead of
      # chromium's 1280x720.
      - name: "E2E Testing (Mobile Chrome)"
        id: e2e-mobile
        uses: ./.github/actions/e2e-testing
        with:
          should-run-e2e: ${{ needs.build.outputs.artifacts-ready }}
          shard: ${{ matrix.shard }}
          # browser stays "chromium" — Mobile Chrome runs on the chromium
          # engine (LS-8739), so this shares the desktop chromium job's
          # browser-binary cache key instead of triggering a redundant
          # install. `project` selects the actual Playwright project.
          browser: "chromium"
          project: "Mobile Chrome"
          test-patterns: ${{ needs.detect-changes.outputs.e2e-grep }}
          test-patterns-invert: ${{ needs.detect-changes.outputs.e2e-grep-invert }}
          e2e-commissioner-email: ${{ secrets.E2E_COMMISSIONER_EMAIL }}
          e2e-commissioner-password: ${{ secrets.E2E_COMMISSIONER_PASSWORD }}
          e2e-manager-1-email: ${{ secrets.E2E_MANAGER_1_EMAIL }}
          e2e-manager-1-password: ${{ secrets.E2E_MANAGER_1_PASSWORD }}
          e2e-manager-2-email: ${{ secrets.E2E_MANAGER_2_EMAIL }}
          e2e-manager-2-password: ${{ secrets.E2E_MANAGER_2_PASSWORD }}
          e2e-manager-3-email: ${{ secrets.E2E_MANAGER_3_EMAIL }}
          e2e-manager-3-password: ${{ secrets.E2E_MANAGER_3_PASSWORD }}

      # LS-7846/LS-9411: the same affected-spec list the chromium job's
      # equivalent step runs, re-run at Mobile Chrome's viewport. Reuses
      # needs.detect-changes.outputs.e2e-affected-specs verbatim. Skipped in
      # the run-all case (the sharded step above already ran the full suite)
      # and when nothing mapped — the same step-level guard the chromium
      # "E2E Tests (affected specs)" step uses (LS-9658: the job-level `if`
      # no longer excludes run-all, so the guard lives here now).
      - name: "E2E Tests (Mobile Chrome — affected specs)"
        if: >-
          needs.build.outputs.artifacts-ready == 'true' &&
          needs.detect-changes.outputs.e2e-affected-run-all != 'true' &&
          needs.detect-changes.outputs.e2e-affected-specs != ''
        shell: bash
        env:
          CI: "true"
          AFFECTED_SPECS: ${{ needs.detect-changes.outputs.e2e-affected-specs }}
        run: |
          set -euo pipefail
          printf '%s\n' "$AFFECTED_SPECS" | grep -v '^[[:space:]]*$' > /tmp/affected-specs-mobile.txt
          mapfile -t SPECS < /tmp/affected-specs-mobile.txt
          if [ "${#SPECS[@]}" -eq 0 ]; then
            echo "No affected specs after filtering — nothing to run."
            exit 0
          fi
          echo "🎯 Running affected hermetic e2e specs on Mobile Chrome (excluding @critical/@slow):"
          cat /tmp/affected-specs-mobile.txt
          pnpm exec playwright test \
            --config=apps/web-e2e/playwright.config.ts \
            --project="Mobile Chrome" \
            --grep-invert="@critical|@slow" \
            --reporter=line \
            --pass-with-no-tests \
            --output=apps/web-e2e/test-results-affected-mobile \
            "${SPECS[@]}"

      - name: "Upload Blob Report to S3"
        if: ${{ !cancelled() }}
        uses: ./.github/actions/s3-artifact
        with:
          mode: upload
          # mobile-<shard index> so the (now sharded, LS-9658) mobile
          # instances never clobber each other or the chromium shards'
          # playwright-blobs/<index> prefixes.
          name: playwright-blobs/mobile-${{ strategy.job-index }}
          path: blob-report/
          if-no-files-found: warn

  # ============================================================================
  # STAGE 3a — E2E affected-selection merge gate (LS-7846)
  # ============================================================================
  # Stable-named aggregation check over the (matrix, dynamically-sharded) e2e
  # job so the merge gate has ONE fixed required-check context regardless of how
  # many shards ran. This is the check listed in .github/ruleset.json — it makes
  # hermetic e2e regressions (in @critical OR the affected area) block merge
  # instead of leaking to the nightly. LS-9411: also folds in e2e-mobile so a
  # mobile-viewport-only regression (LS-9326/LS-9408 shape) blocks merge the
  # same way a desktop-viewport one does, instead of only surfacing here as an
  # informational job result.
  #
  # Always runs (if: always()) so it never sits "Expected" and never blocks a
  # PR that legitimately skipped e2e. Passes when e2e/e2e-mobile succeeded OR
  # were skipped (no web/e2e/api change — since LS-9658 both jobs share the
  # same gate); fails when any e2e OR e2e-mobile shard failed.
  e2e-affected:
    name: "e2e-affected"
    needs: [detect-changes, e2e, e2e-mobile]
    if: always() && !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    runs-on: ${{ inputs.runner-label || vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: "Evaluate e2e result"
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
          E2E_MOBILE_RESULT: ${{ needs.e2e-mobile.result }}
          RUN_ALL: ${{ needs.detect-changes.outputs.e2e-affected-run-all }}
          SPEC_LIST: ${{ needs.detect-changes.outputs.e2e-affected-specs }}
        run: |
          set -euo pipefail
          echo "e2e job result: $E2E_RESULT"
          echo "e2e-mobile job result: $E2E_MOBILE_RESULT"
          echo "run-all: ${RUN_ALL:-false}"
          echo "affected specs:"
          printf '%s\n' "${SPEC_LIST:-}" | grep -v '^[[:space:]]*$' || echo "  (none — @critical only)"
          FAILED=false
          case "$E2E_RESULT" in
            success|skipped) ;;
            *)
              echo "::error::e2e-affected gate failed — the e2e job result was '$E2E_RESULT'."
              echo "::error::A hermetic e2e regression in @critical or the PR's affected area must be fixed before merge."
              FAILED=true
              ;;
          esac
          case "$E2E_MOBILE_RESULT" in
            success|skipped) ;;
            *)
              echo "::error::e2e-affected gate failed — the e2e-mobile job result was '$E2E_MOBILE_RESULT'."
              echo "::error::A hermetic e2e regression visible only at the Mobile Chrome viewport must be fixed before merge."
              FAILED=true
              ;;
          esac
          if [ "$FAILED" = "true" ]; then
            exit 1
          fi
          echo "✅ e2e-affected gate passed (e2e=$E2E_RESULT, e2e-mobile=$E2E_MOBILE_RESULT)"

  # ============================================================================
  # STAGE 3b — Merge E2E shard reports and deploy to GitHub Pages
  # ============================================================================
  deploy-playwright-report:
    name: "Deploy Playwright Report"
    needs: [detect-changes, e2e, e2e-mobile]
    # Each deploy workflow pushes to a unique subdirectory of the gh-pages branch
    # on bkrupa/legacy-sports-deploys. Push conflicts are handled by the retry-
    # with-rebase loop in the deploy step below. A shared concurrency group is
    # NOT used because GitHub only queues one pending job per group — a third
    # job cancels the pending one, which was causing Playwright deploys to be
    # cancelled during bursts of PR preview deploys.
    #
    # Dependabot-triggered runs do not have access to repository secrets, so the
    # GitHub App token mint required to push to bkrupa/legacy-sports-deploys
    # always fails ("appId option is required"). The Playwright HTML report is
    # cosmetic for dep bumps anyway — skip the job entirely so dependabot PRs
    # do not show a stuck failed required check.
    if: >-
      !cancelled() &&
      needs.e2e.result != 'skipped' &&
      ((github.event_name != 'pull_request' && github.event_name != 'pull_request_review') ||
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: false
          set-nx-shas: false
          include-optional-deps: false

      - name: "Download All Blob Reports from S3"
        id: download-blobs
        uses: ./.github/actions/s3-artifact
        with:
          mode: download
          name: playwright-blobs
          path: all-blob-reports

      - name: "Check for Blob Reports"
        id: check-reports
        run: |
          # S3 downloads may preserve shard subdirectories (0/, 1/, etc.) — flatten them
          if [ -d "all-blob-reports" ]; then
            find all-blob-reports -mindepth 2 -type f -exec mv {} all-blob-reports/ \; 2>/dev/null || true
            find all-blob-reports -mindepth 1 -type d -empty -delete 2>/dev/null || true
          fi
          COUNT=$(find all-blob-reports -name '*.zip' -type f 2>/dev/null | wc -l)
          if [ "$COUNT" -gt 0 ]; then
            echo "has-reports=true" >> $GITHUB_OUTPUT
            echo "Found $COUNT blob report(s) — proceeding with merge"
          else
            echo "has-reports=false" >> $GITHUB_OUTPUT
            echo "No blob reports found — E2E tests were skipped or produced no output"
          fi

      - name: "Merge Playwright Reports"
        if: steps.check-reports.outputs.has-reports == 'true'
        run: |
          # Emit HTML (for browsing) plus a compact agent-targeted Markdown
          # summary (LS-7838), copied next to index.html so agents can fetch one
          # small file instead of inflating the embedded report.json. A merge
          # config (rather than --reporter) is required to register the custom
          # reporter; testDir points at the common parent of the e2e/integration
          # specs so mixed-testDir blobs merge cleanly. ledgerJsonFile (LS-9757)
          # additionally captures every executed test (passed/failed/flaky) as
          # machine-readable input for the E2E ledger write step below.
          {
            printf '%s' 'module.exports = { testDir: "apps/web-e2e/src", reporter: ['
            printf '%s\n' '["html"], ["./apps/web-e2e/src/reporters/agent-md-reporter.ts", { outputFile: "summary.md", ledgerJsonFile: "e2e-ledger.json" }]] };'
          } > playwright.merge.config.js
          pnpm dlx playwright@1.58.2 merge-reports -c playwright.merge.config.js ./all-blob-reports

      # E2E ledger (LS-9757): persist one record per executed test to S3 so a
      # future regression can be bisected by direct lookup instead of manual
      # archaeology through PR comments and pruned nightly reports. Reuses the
      # per-test entries the reporter above already collected while parsing
      # the merged Playwright JSON results (same parsing step that feeds
      # flaky-tickets filing on the nightly side) and enriches them with this
      # PR's sha/PR-number/relatedToDiff. relatedToDiff comes from the SAME
      # e2e-select output (detect-changes job) that decided which specs to
      # run for this PR. Deliberately fail-open (same posture as e2e-select
      # itself) — a ledger-write error must never fail the required e2e-
      # affected check.
      - name: "Build E2E Ledger Records"
        id: build-ledger
        if: ${{ !cancelled() && steps.check-reports.outputs.has-reports == 'true' }}
        continue-on-error: true
        env:
          E2E_RUN_ALL: ${{ needs.detect-changes.outputs.e2e-affected-run-all }}
          E2E_AFFECTED_SPECS: ${{ needs.detect-changes.outputs.e2e-affected-specs }}
        run: |
          set -uo pipefail
          printf '%s\n' "$E2E_AFFECTED_SPECS" > /tmp/e2e-affected-specs.txt
          RUN_ALL_FLAG=""
          [ "$E2E_RUN_ALL" = "true" ] && RUN_ALL_FLAG="--run-all"
          node .github/scripts/e2e-ledger/build-ledger-records.mjs \
            --ledger-json e2e-ledger.json \
            --sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --out-dir /tmp/e2e-ledger-staging \
            --pr-number "${{ github.event.pull_request.number }}" \
            --affected-specs-file /tmp/e2e-affected-specs.txt \
            $RUN_ALL_FLAG \
            || echo "::warning::E2E ledger record build failed — no ledger data this run (fail-open, does not block the PR)"

      # Deliberately not the `s3-artifact` composite action: that action
      # keys uploads as ci-artifacts/${GITHUB_SHA}/<name> with `--delete`
      # sync semantics, which fits a one-shot-per-run artifact but not an
      # accumulating, spec-first ledger. This step reuses the same OIDC
      # role/bucket/`aws s3 sync` mechanics against the spec-first prefix
      # build-ledger-records.mjs already staged locally.
      - name: "Configure AWS Credentials (E2E ledger)"
        if: ${{ !cancelled() && steps.build-ledger.outcome == 'success' }}
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6
        with:
          role-to-assume: "arn:aws:iam::176661590736:role/legacy-sports-dev-ci-artifacts"
          aws-region: us-east-1

      - name: "Sync E2E Ledger to S3 (spec-first layout)"
        if: ${{ !cancelled() && steps.build-ledger.outcome == 'success' }}
        continue-on-error: true
        run: |
          if [ -d /tmp/e2e-ledger-staging/spec ]; then
            aws s3 sync /tmp/e2e-ledger-staging/spec \
              s3://legacy-sports-dev-ci-artifacts/e2e-ledger/v1/spec \
              --quiet \
              || echo "::warning::E2E ledger S3 sync failed — no ledger data this run (fail-open, does not block the PR)"
          else
            echo "No E2E ledger records staged — skipping S3 sync"
          fi

      - name: "Generate App Token"
        id: app-token
        if: steps.check-reports.outputs.has-reports == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.PREVIEW_APP_ID }}
          private-key: ${{ secrets.PREVIEW_APP_PRIVATE_KEY }}
          repositories: legacy-sports-deploys

      - name: "Deploy Playwright Report"
        if: steps.check-reports.outputs.has-reports == 'true'
        env:
          DEPLOY_TOKEN: ${{ steps.app-token.outputs.token }}
          DEST_DIR: playwright-report/${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${DEPLOY_TOKEN}@github.com/bkrupa/legacy-sports-deploys.git"
          WORKSPACE="$(pwd)"
          REPORT_SRC="${WORKSPACE}/playwright-report"

          MAX_RETRIES=7
          for attempt in $(seq 1 $MAX_RETRIES); do
            rm -rf "${WORKSPACE}/_deploy"
            # Retry clone to handle transient GitHub App token propagation delays
            # (~once per PR the token hasn't propagated by the time git clone fires).
            CLONE_OK=false
            for clone_attempt in $(seq 1 3); do
              if git clone --depth 1 --single-branch --branch gh-pages "$REPO_URL" "${WORKSPACE}/_deploy" 2>/dev/null; then
                CLONE_OK=true; break
              fi
              echo "Clone attempt ${clone_attempt} failed — retrying in ${clone_attempt}s..."
              sleep "$clone_attempt"
            done
            if [ "$CLONE_OK" != "true" ]; then
              cd "${WORKSPACE}"
              JITTER=$((RANDOM % 5))
              echo "Clone failed on attempt ${attempt} — retrying in $((attempt * 2 + JITTER))s..."
              sleep $((attempt * 2 + JITTER))
              continue
            fi

            rm -rf "${WORKSPACE}/_deploy/${DEST_DIR}"
            mkdir -p "${WORKSPACE}/_deploy/${DEST_DIR}"
            cp -r "${REPORT_SRC}/." "${WORKSPACE}/_deploy/${DEST_DIR}/"
            [ -f "${WORKSPACE}/summary.md" ] && cp "${WORKSPACE}/summary.md" "${WORKSPACE}/_deploy/${DEST_DIR}/summary.md"

            cd "${WORKSPACE}/_deploy"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .

            if git diff --cached --quiet; then
              echo "No changes to deploy"
              exit 0
            fi

            # Squash all history: orphan commit keeps the deploy repo at constant size.
            git checkout --orphan squashed
            git add -A
            git commit -m "deploy ${DEST_DIR}"

            if git push --force origin squashed:gh-pages; then
              echo "Push succeeded (attempt ${attempt})"
              exit 0
            fi

            cd "${WORKSPACE}"
            JITTER=$((RANDOM % 5))
            echo "Push failed (attempt ${attempt}) — retrying in $((attempt * 2 + JITTER))s..."
            sleep $((attempt * 2 + JITTER))
          done

          echo "Push failed after ${MAX_RETRIES} attempts"
          exit 1

      - name: "Comment Playwright Report URL"
        if: steps.check-reports.outputs.has-reports == 'true' && github.event.pull_request.number
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: playwright-report
          number: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          message: |
            ## 🎭 Playwright Report

            | | |
            |---|---|
            | **Report** | [View Full Report](https://bkrupa.github.io/legacy-sports-deploys/playwright-report/pr-${{ github.event.pull_request.number }}/) |
            | **Run** | [Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
            | **Commit** | `${{ github.event.pull_request.head.sha }}` |

  # ============================================================================
  # STAGE 4 — Summarize results (runs on failure/skip, but not cancellation — posts PR comment, updates badges)
  # ============================================================================
  summarize:
    name: "Summarize & Report"
    needs: [detect-changes, e2e, e2e-mobile, lint, test, build, custom-checks, lockfile-check]
    if: "always() && !cancelled() && !contains(github.event.pull_request.labels.*.name, 'skip-ci')"
    runs-on: ${{ inputs.runner-label || vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      overall-status: ${{ steps.collect-results.outputs.overall-status }}
      workflow-duration: ${{ steps.collect-results.outputs.workflow-duration }}
      deployment-ready: ${{ steps.deployment-gate.outputs.deployment-ready }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Minimal setup — only needs node to run composite actions, not nx tasks
      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: false
          set-nx-shas: false
          include-optional-deps: false

      - name: "Debug: Job Results"
        shell: bash
        run: |
          echo "::group::Raw needs.*.result values (for phantom-failure debugging)"
          echo "detect-changes.result     = ${{ needs.detect-changes.result }}"
          echo "lint.result               = ${{ needs.lint.result }}"  # LS-8901: folds the former standalone format job
          echo "test.result               = ${{ needs.test.result }}"
          echo "build.result              = ${{ needs.build.result }}"
          echo "custom-checks.result      = ${{ needs.custom-checks.result }}"
          echo "lockfile-check.result     = ${{ needs.lockfile-check.result }}"
          echo "e2e.result                = ${{ needs.e2e.result }}"
          echo "e2e-mobile.result         = ${{ needs.e2e-mobile.result }}"
          echo "::endgroup::"

      - name: "Collect Results"
        id: collect-results
        uses: ./.github/actions/collect-results
        with:
          step-results: |
            {
              "detect-changes":  "${{ needs.detect-changes.result }}",
              "lint":            "${{ needs.lint.result }}",
              "test":            "${{ needs.test.result }}",
              "build":           "${{ needs.build.result }}",
              "custom-checks":   "${{ needs.custom-checks.result }}",
              "lockfile-check":  "${{ needs.lockfile-check.result }}",
              "e2e-testing":     "${{ needs.e2e.result }}",
              "e2e-mobile-testing": "${{ needs.e2e-mobile.result }}"
            }
          workflow-start-time: ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
          failure-threshold: "lint,test,build,custom-checks,lockfile-check,e2e-testing,e2e-mobile-testing"

      # Aggregate "CI Gate" required status (LS-7991, Phase 2 of LS-7988).
      # Posts ONE commit status per head SHA folding the granular job results,
      # so the merge gate evaluates a single unambiguous context instead of the
      # 5 granular CI check-RUN names (which accumulate cancelled duplicates
      # under concurrency cancellation and 405 genuinely-green PRs). A commit
      # status — not a check run — is used deliberately: GitHub evaluates the
      # latest status per context and has no "cancelled" status state, so it
      # cannot latch onto a stale duplicate. Computation + the SHA-currency and
      # run-recency guards live in .github/scripts/ci-gate.js (unit-tested).
      # LS-9378: latest-status-wins also means a re-run of an OLDER run would
      # replay its stale verdict over a newer one, so a `success` verdict is
      # withheld unless this run proves it is the newest run for the SHA; a
      # `failure` verdict is always posted. This runs only on
      # PR-scoped events and only when summarize itself runs (always() &&
      # !cancelled() on this job), so a cancelled CI run never posts a verdict.
      #
      # STAGED ROLLOUT: `CI Gate` is added to .github/ruleset.json AHEAD OF LIVE
      # (additive, alongside the granular names) and only becomes enforced when
      # the owner runs scripts/apply-ruleset.sh. Until then it is informational.
      # See docs/ci-cd/ci-gate-aggregator.md.
      # LS-9148: workflow_dispatch runs (manual re-runs, and the ci:run label
      # handler) have no `pull_request` in the event payload, so this step
      # used to skip outright even when the orchestrator had resolved a
      # pr-number for the run — leaving the PR with no CI Gate status at all.
      # Fall back to the orchestrator-resolved pr-number/head-sha inputs so a
      # PR-scoped dispatch still posts.
      - name: "Post CI Gate aggregate status"
        if: always() && (github.event.pull_request.number || inputs.pr-number)
        # Never let a transient status-post failure (or a fork PR's read-only
        # GITHUB_TOKEN) fail the summarize job — CI Gate is informational during
        # bake, and once required a missing status blocks merge on its own.
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          GATE_RESULTS: |
            {
              "lint":           "${{ needs.lint.result }}",
              "test":           "${{ needs.test.result }}",
              "build":          "${{ needs.build.result }}",
              "custom-checks":  "${{ needs.custom-checks.result }}",
              "lockfile-check": "${{ needs.lockfile-check.result }}",
              "e2e":            "${{ needs.e2e.result }}",
              "e2e-mobile":     "${{ needs.e2e-mobile.result }}"
            }
          DISPATCH_PR_NUMBER: ${{ inputs.pr-number }}
          DISPATCH_HEAD_SHA: ${{ inputs.head-sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { postCiGate } = require('./.github/scripts/ci-gate.js');
            const results = JSON.parse(process.env.GATE_RESULTS);
            const dispatchPrNumber = process.env.DISPATCH_PR_NUMBER;
            const dispatchHeadSha = process.env.DISPATCH_HEAD_SHA;
            await postCiGate({
              github,
              context,
              core,
              results,
              prNumber: dispatchPrNumber ? Number(dispatchPrNumber) : undefined,
              headSha: dispatchHeadSha || undefined,
            });

      - name: "Deployment Gate"
        id: deployment-gate
        if: >-
          steps.collect-results.outputs.overall-status == 'success' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: ./.github/actions/deployment-gate
        with:
          artifacts-ready: ${{ needs.build.outputs.artifacts-ready }}
          quality-passed: ${{ needs.lint.result == 'success' && needs.test.result == 'success' }}
          execution-plan: "{}"
          environment: "production"

      # Collect each failed job's distilled excerpt (exposed as a job output by
      # the capture-ci-failure action) into a single JSON map for the reporter.
      - name: "Assemble Failure Excerpts"
        id: excerpts
        if: steps.collect-results.outputs.overall-status == 'failure'
        shell: bash
        env:
          EX_LINT: ${{ needs.lint.outputs.lint-failure-excerpt }}
          EX_FORMAT: ${{ needs.lint.outputs.format-failure-excerpt }}
          EX_TEST: ${{ needs.test.outputs.failure-excerpt }}
          EX_BUILD: ${{ needs.build.outputs.failure-excerpt }}
          EX_CUSTOM: ${{ needs.custom-checks.outputs.failure-excerpt }}
        run: |
          JSON=$(jq -n \
            --arg lint "$EX_LINT" \
            --arg format "$EX_FORMAT" \
            --arg test "$EX_TEST" \
            --arg build "$EX_BUILD" \
            --arg customChecks "$EX_CUSTOM" \
            '{lint: $lint, format: $format, test: $test, build: $build, "custom-checks": $customChecks}
             | with_entries(select(
                 .value != null and .value != ""
                 and (.value | test("No log file was captured|Failed to distil") | not)
               ))')
          DELIM="EXJSON_$(date +%s%N)"
          {
            echo "json<<$DELIM"
            echo "$JSON"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: "CI Pipeline Reporting"
        id: ci-reporting
        uses: ./.github/actions/ci-reporting
        with:
          status: ${{ steps.collect-results.outputs.overall-status }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          event-name: ${{ github.event_name }}
          pr-number: ${{ github.event.pull_request.number }}
          execution-mode: "local"
          optimal-agents: "4"
          step-results: ${{ steps.collect-results.outputs.step-results }}
          failure-excerpts: ${{ steps.excerpts.outputs.json }}
          workflow-duration: ${{ steps.collect-results.outputs.workflow-duration }}
          run-id: ${{ github.run_id }}
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          quality-gates-subsections: |
            {
              "migration-immutability": "${{ needs.custom-checks.result }}",
              "lint":        "${{ needs.lint.result }}",
              "test":        "${{ needs.test.result }}"
            }
          project-failures: "{}"

      - name: "Label PR on Failure"
        if: always() && github.event.pull_request.number
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue.number;
            if (!prNumber) return;

            // Map CI stage results to label names
            const labelMap = {
              'CI: Migration Immutability': '${{ needs.custom-checks.result }}',
              'CI: Test Failure':           '${{ needs.test.result }}',
              'CI: Build Failure':          '${{ needs.build.result }}',
              'CI: E2E Failure':            '${{ needs.e2e.result }}',
            };

            // Determine which labels to add (failed)
            const labelsToAdd = [];

            for (const [label, result] of Object.entries(labelMap)) {
              if (result === 'failure' || result === 'cancelled') {
                labelsToAdd.push(label);
              }
              // Empty/missing results are left alone (don't add or remove)
            }

            // LS-8901: lint and format now share one job (ci-pipeline.yml's
            // `lint` job) — its two failure-excerpt outputs are only populated
            // when that specific step actually failed, so use them to keep
            // 'CI: Lint Failure' / 'CI: Formatting' independently accurate
            // instead of both firing off the merged job's single result.
            const lintResult = '${{ needs.lint.result }}';
            const lintExcerpt = `${{ needs.lint.outputs.lint-failure-excerpt }}`;
            const formatExcerpt = `${{ needs.lint.outputs.format-failure-excerpt }}`;
            // The job can fail/cancel before either step's capture ran (e.g.
            // cancellation, a setup failure) — neither excerpt is populated
            // then. Fall back to flagging both rather than silently dropping
            // the failure from PR labels.
            const excerptsUnknown = !lintExcerpt && !formatExcerpt;
            const jobFailedOrCancelled = lintResult === 'failure' || lintResult === 'cancelled';
            if (lintExcerpt || (excerptsUnknown && jobFailedOrCancelled)) {
              labelsToAdd.push('CI: Lint Failure');
            }
            if (formatExcerpt || (excerptsUnknown && jobFailedOrCancelled)) {
              labelsToAdd.push('CI: Formatting');
            }

            // Get existing labels on the PR
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const existingLabels = pr.labels.map(l => l.name);

            // Compute final desired label set: preserve non-CI labels, replace CI
            // labels entirely with labelsToAdd. A single PUT avoids the N sequential
            // DELETEs that trigger GitHub's secondary rate limit.
            // Include legacy rollup label names so they are cleared from PRs that had them.
            const allCiLabels = new Set([...Object.keys(labelMap), 'CI: Lint & Format', 'CI: Quality Gates', 'CI: Type Error']);
            const nonCiLabels = existingLabels.filter(l => !allCiLabels.has(l));
            const finalLabels = [...nonCiLabels, ...labelsToAdd];

            async function withRetry(fn, retries = 3) {
              for (let i = 0; i < retries; i++) {
                try { return await fn(); }
                catch (e) {
                  const isPrimaryRateLimit = e.status === 429;
                  const isSecondaryRateLimit = e.status === 403 && /secondary rate limit/i.test(typeof e.message === 'string' ? e.message : '');
                  if ((isPrimaryRateLimit || isSecondaryRateLimit) && i < retries - 1) {
                    const delay = Math.pow(2, i) * 1000;
                    core.warning(`Rate limited (${e.status}), retrying in ${delay}ms…`);
                    await new Promise(r => setTimeout(r, delay));
                  } else throw e;
                }
              }
            }

            await withRetry(() => github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: finalLabels,
            }));
            core.info(`Labels set: [${finalLabels.join(', ')}]`);

      - name: "Discord CI Failure"
        if: >-
          always() &&
          steps.collect-results.outputs.overall-status == 'failure' &&
          github.ref == 'refs/heads/main'
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_PLAYWRIGHT_WEBHOOK_URL }}
          status: failure
          title: "CI Pipeline Failure"
          description: "Failed steps: ${{ steps.collect-results.outputs.failed-steps }}"

      - name: "Final Status"
        run: |
          STATUS="${{ steps.collect-results.outputs.overall-status }}"
          if [ "$STATUS" = "success" ]; then
            echo "CI Pipeline completed successfully!"
            echo "Duration: ${{ steps.collect-results.outputs.workflow-duration }}s"
          else
            echo "FAILED: CI Pipeline failed"
            echo "Failed Steps: ${{ steps.collect-results.outputs.failed-steps }}"
            echo "Duration: ${{ steps.collect-results.outputs.workflow-duration }}s"
            exit 1
          fi
