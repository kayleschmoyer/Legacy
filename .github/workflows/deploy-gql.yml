name: Deploy GraphQL Lambda

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lambdas/db/**"
      - ".github/workflows/deploy-gql.yml"

# Prevent concurrent deployments of the same Lambda
# Terraform state locking (DynamoDB) handles cross-Lambda conflicts
concurrency:
  group: lambda-deployment-graphql
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_SERVICE_NAME: legacy-sports-gql
  AWS_STAGE: dev
  AWS_VPC_SECURITY_GROUP_IDS: sg-0d21d72d3c1c004c2,sg-07083f37d7e8e24c5
  AWS_VPC_SUBNET_IDS: subnet-06f49eeff089ef92d
  DATABASE_SCHEMAS: public
  DB_HOST: legacy-sports.cep4b6aynyet.us-east-1.rds.amazonaws.com

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy GraphQL Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: true

      - name: "☁️ Detect DTE Availability"
        id: detect-dte
        uses: ./.github/actions/detect-dte
        with:
          nx-cloud-token: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

      - name: "☁️ Start Nx Cloud CI Run"
        id: start-dte
        if: steps.detect-dte.outputs.dte-available == 'true'
        continue-on-error: true
        run: |
          echo "🚀 Starting Nx Cloud DTE..."
          DTE_START_OUTPUT=$(mktemp)
          DTE_START_RESULT=0

          pnpm exec nx-cloud start-ci-run --distribute-on="${{ steps.detect-dte.outputs.optimal-agents }} linux-medium-js" 2>&1 | tee "$DTE_START_OUTPUT" || DTE_START_RESULT=$?

          if [ $DTE_START_RESULT -ne 0 ] || grep -qi "quota\|limit\|exceeded\|insufficient\|disabled\|unauthorized\|authorization\|401" "$DTE_START_OUTPUT"; then
            echo "::warning title=DTE Unavailable::Nx Cloud DTE unavailable. Build will proceed with local execution."
            cat "$DTE_START_OUTPUT"
            rm -f "$DTE_START_OUTPUT"
            exit 1
          fi

          rm -f "$DTE_START_OUTPUT"
          echo "✅ DTE session started"

      - name: Validate Deployment Readiness
        uses: ./.github/actions/deployment-gate
        with:
          artifacts-ready: "true"
          quality-passed: "true"
          required-components: ""
          environment: "production"

      - name: "☁️ Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::176661590736:role/legacy-sports-dev-github-actions
          role-session-name: GitHubActions-DeployGraphQL
          aws-region: ${{ env.AWS_REGION }}

      - name: Get RDS Secret
        id: rds-secret
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            DB_CREDS, legacy-sports-dev-db-creds-20250925194630368900000002
          parse-json-secrets: true

      - name: 🏗️ Build and Package GraphQL Lambda
        id: build
        uses: ./.github/actions/build-lambda
        with:
          lambda-name: graphql
          nx-project-name: db
          lambda-directory: lambdas/db
          aws-region: ${{ env.AWS_REGION }}
          aws-stage: ${{ env.AWS_STAGE }}

      - name: 🚀 Deploy GraphQL Infrastructure
        uses: ./.github/actions/deploy-lambda-infrastructure
        with:
          lambda-name: graphql
          terraform-target: aws_lambda_function.graphql
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Deployment Badge
        if: always()
        uses: ./.github/actions/update-deployment-badge
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          gist-id: ${{ secrets.CI_BADGES_GIST_ID }}
          deployment-name: "GraphQL Lambda"
          deployment-status: ${{ job.status }}
          workflow-run-id: ${{ github.run_id }}
          branch: ${{ github.ref_name }}
