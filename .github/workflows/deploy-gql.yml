name: Deploy GraphQL Lambda

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lambdas/db/**"
      - ".github/workflows/deploy-gql.yml"

# Serialize all Lambda deployments to prevent Terraform state locking conflicts
concurrency:
  group: lambda-deployment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_SERVICE_NAME: legacy-sports-gql
  AWS_STAGE: dev
  AWS_VPC_SECURITY_GROUP_IDS: sg-0d21d72d3c1c004c2,sg-07083f37d7e8e24c5
  AWS_VPC_SUBNET_IDS: subnet-06f49eeff089ef92d
  DATABASE_SCHEMAS: public
  DB_HOST: legacy-sports.cep4b6aynyet.us-east-1.rds.amazonaws.com

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy GraphQL Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true

      - name: Validate Deployment Readiness
        uses: ./.github/actions/deployment-gate
        with:
          artifacts-ready: 'true'
          quality-passed: 'true'
          required-components: ''
          environment: 'production'

      - name: "☁️ Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::176661590736:role/legacy-sports-dev-github-actions
          role-session-name: GitHubActions-DeployGraphQL
          aws-region: ${{ env.AWS_REGION }}

      - name: Get RDS Secret
        id: rds-secret
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            DB_CREDS, legacy-sports-dev-db-creds-20250925194630368900000002
          parse-json-secrets: true

      - name: Build GraphQL Lambda
        run: |
          echo "🚀 Building GraphQL Lambda specifically..."
          echo "::notice::Building only db (GraphQL) project for targeted deployment"
          
          # Build only the db (GraphQL) lambda and its dependencies
          if npx nx build db --verbose 2>&1 | tee build.log; then
            echo "✅ GraphQL Lambda built successfully"
            
            # Verify build artifacts exist
            if [ -f "lambdas/db/dist/index.js" ]; then
              echo "✅ Build artifacts verified: lambdas/db/dist/index.js"
              BUILD_SIZE=$(du -sh lambdas/db/dist/index.js | cut -f1)
              echo "📊 GraphQL Lambda bundle size: $BUILD_SIZE"
            else
              echo "❌ Build artifacts missing: lambdas/db/dist/index.js"
              exit 1
            fi
            
            echo "## 🚀 GraphQL Lambda Build Summary" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
            echo "- **Project**: db (GraphQL)" >> $GITHUB_STEP_SUMMARY
            echo "- **Bundle Size**: $BUILD_SIZE" >> $GITHUB_STEP_SUMMARY
            echo "- **Output**: lambdas/db/dist/" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ GraphQL Lambda build failed"
            echo "## ❌ Build Errors" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            tail -20 build.log >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Package and Deploy GraphQL Lambda
        env:
          DB_HOST: ${{env.DB_HOST}}
          DB_PASSWORD: ${{ steps.rds-secret.outputs.DB_CREDS_password }}
          DB_USER: ${{ steps.rds-secret.outputs.DB_CREDS_username }}
          DB_CERT_LOCATION: "/usr/local/share/ca-certificates/rds-ca-2019-root.crt"
        working-directory: lambdas/db
        run: |
          # Create version string
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          COMMIT_SHA=$(echo $GITHUB_SHA | cut -c1-8)
          VERSION="${TIMESTAMP}-${COMMIT_SHA}"

          # Create deployment package from built artifacts
          zip -r "graphql-${VERSION}.zip" dist/

          # Get S3 bucket name from SSM parameter store
          echo "🔍 Getting S3 bucket name from SSM..."
          if S3_BUCKET=$(aws ssm get-parameter --name "/legacy-sports/${AWS_STAGE}/s3/lambda-deployments-bucket" --query "Parameter.Value" --output text --region ${{ env.AWS_REGION }} 2>/dev/null); then
            echo "✅ Found S3 bucket from SSM: $S3_BUCKET"
          else
            echo "⚠️ SSM parameter not found, using default bucket name"
            S3_BUCKET="legacy-sports-dev-lambdas-cca20ad9"
          fi

          # Upload to S3
          aws s3 cp "graphql-${VERSION}.zip" "s3://${S3_BUCKET}/graphql/" --region ${{ env.AWS_REGION }}

          # Update SSM parameter
          aws ssm put-parameter \
            --name "/legacy-sports/${AWS_STAGE}/lambda/graphql/version" \
            --value "$VERSION" \
            --overwrite \
            --region ${{ env.AWS_REGION }}

          echo "✅ Lambda package uploaded: graphql-${VERSION}.zip"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "S3_BUCKET=${S3_BUCKET}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: "🏗️ Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13"

      - name: "🔧 Initialize Terraform"
        working-directory: terraform
        run: |
          echo "🔧 Initializing Terraform..."
          if terraform init; then
            echo "✅ Terraform initialization successful"
          else
            echo "❌ Terraform initialization failed"
            echo "## Terraform Initialization Errors" >> $GITHUB_STEP_SUMMARY
            echo "Check that:" >> $GITHUB_STEP_SUMMARY
            echo "- Terraform configuration files exist in terraform/" >> $GITHUB_STEP_SUMMARY
            echo "- Backend configuration is valid" >> $GITHUB_STEP_SUMMARY
            echo "- AWS credentials are properly configured" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: "🚀 Deploy Infrastructure"
        working-directory: terraform
        run: |
          echo "📋 Planning Terraform changes..."
          terraform plan -target=aws_lambda_function.graphql
          
          echo "🚀 Applying Terraform changes..."
          terraform apply -target=aws_lambda_function.graphql -auto-approve
          
          echo "✅ Infrastructure deployment completed"

      - name: Update Deployment Badge
        if: always()
        uses: ./.github/actions/update-deployment-badge
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          gist-id: ${{ secrets.CI_BADGES_GIST_ID }}
          deployment-name: "GraphQL Lambda"
          deployment-status: ${{ job.status }}
          workflow-run-id: ${{ github.run_id }}
          branch: ${{ github.ref_name }}
