name: Upload Draft Processor Lambda

# Phase 1: Build and upload Lambda code to S3
# This workflow runs independently and can execute in parallel with other Lambda uploads
# After uploading, it triggers the central Terraform workflow to apply infrastructure changes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lambdas/draft-processor/**"
      - ".github/workflows/upload-draft-processor.yml"

# No concurrency group needed - uploads can run in parallel
# The central Terraform workflow handles serialization

env:
  AWS_REGION: us-east-1
  AWS_SERVICE_NAME: legacy-sports-draft-processor
  AWS_STAGE: dev

permissions:
  actions: read
  id-token: write
  contents: read

jobs:
  upload:
    name: Build and Upload Draft Processor Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # AWS_ACCOUNT_ID is a required repository secret (configured in GitHub settings)
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Build Lambda
        working-directory: lambdas/draft-processor
        run: |
          echo "🔨 Building Draft Processor Lambda..."

          if pnpm run build 2>&1 | tee build.log; then
            echo "✅ Build successful"
          else
            echo "❌ Build failed"
            echo "## Build Errors" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            tail -20 build.log >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Package and Upload to S3
        working-directory: lambdas/draft-processor
        run: |
          echo "📦 Creating Lambda deployment package..."

          # Create version string
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          COMMIT_SHA=$(echo $GITHUB_SHA | cut -c1-8)
          VERSION="${TIMESTAMP}-${COMMIT_SHA}"

          echo "Version: $VERSION"

          # Create deployment package from built artifacts
          zip -r "draft-processor-${VERSION}.zip" dist/

          # Get S3 bucket name from SSM parameter store
          echo "🔍 Getting S3 bucket name from SSM..."
          if S3_BUCKET=$(aws ssm get-parameter \
            --name "/legacy-sports/${AWS_STAGE}/s3/lambda-deployments-bucket" \
            --query "Parameter.Value" \
            --output text \
            --region ${{ env.AWS_REGION }} 2>/dev/null); then
            echo "✅ Found S3 bucket: $S3_BUCKET"
          else
            echo "⚠️ SSM parameter not found, using default bucket name"
            S3_BUCKET="legacy-sports-dev-lambdas-cca20ad9"
          fi

          # Upload to S3
          echo "⬆️  Uploading to S3..."
          aws s3 cp "draft-processor-${VERSION}.zip" \
            "s3://${S3_BUCKET}/draft-processor/draft-processor-${VERSION}.zip" \
            --region ${{ env.AWS_REGION }}

          echo "✅ Upload complete: s3://${S3_BUCKET}/draft-processor/draft-processor-${VERSION}.zip"

          # Save for next step
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "S3_BUCKET=${S3_BUCKET}" >> $GITHUB_ENV
          echo "S3_KEY=draft-processor/draft-processor-${VERSION}.zip" >> $GITHUB_ENV

      - name: Update SSM Parameter
        env:
          VERSION: ${{ env.VERSION }}
          S3_KEY: ${{ env.S3_KEY }}
        run: |
          echo "📝 Updating SSM parameter with new version..."

          aws ssm put-parameter \
            --name "/legacy-sports/${AWS_STAGE}/lambda/draft-processor/version" \
            --value "${VERSION}" \
            --overwrite \
            --region ${{ env.AWS_REGION }}

          echo "✅ SSM parameter updated"

          echo "## 📦 Lambda Upload Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Lambda**: draft-processor" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: \`${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Location**: \`${S3_KEY}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Next Step**: Central Terraform workflow will apply infrastructure changes" >> $GITHUB_STEP_SUMMARY

      - name: Summary
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          echo "::notice::✅ Draft Processor Lambda uploaded successfully"
          echo "::notice::Version: ${VERSION}"
          echo "::notice::Waiting for Terraform workflow to apply infrastructure..."
