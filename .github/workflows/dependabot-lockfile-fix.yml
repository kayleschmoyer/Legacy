name: "Fix Dependabot Lockfile"

# LS-3083: Dependabot generates incomplete pnpm-lock.yaml for pnpm workspace
# monorepos. This workflow regenerates the lockfile after dependabot creates or
# updates a PR, then pushes the corrected lockfile back to the PR branch.
#
# Uses pull_request_target so we get access to Actions secrets (GitHub restricts
# secrets on pull_request events from dependabot). The actor check ensures this
# only runs for dependabot PRs.
#
# Uses the Agent Author GitHub App (ID: 3158619, legacy-sports-code-bot) to
# generate a short-lived installation token for checkout and push. This token
# re-triggers required checks on push, which GITHUB_TOKEN cannot do.

on:
  pull_request_target:
    types: [opened, synchronize]
    paths:
      - "package.json"
      - "apps/*/package.json"
      - "lib/*/package.json"
      - "lambdas/*/package.json"
      - "tools/*/package.json"

concurrency:
  group: dependabot-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix-lockfile:
    name: "Regenerate pnpm-lock.yaml"
    if: github.actor == 'dependabot[bot]'
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Generate bot token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: bot-token
        with:
          client-id: 3158619
          private-key: ${{ secrets.AGENT_AUTHOR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # head.ref is required (not head.sha) so we can push back to the branch.
          # The concurrency group with cancel-in-progress handles races.
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          # App token so the push re-triggers required checks (GITHUB_TOKEN cannot).
          token: ${{ steps.bot-token.outputs.token }}

      - name: Bootstrap pnpm
        run: |
          # Self-hosted runners bake pnpm as a standalone binary at
          # /usr/local/bin/pnpm (LS-4949) rather than via corepack, precisely
          # to avoid corepack version drift. That binary precedes /usr/bin on
          # PATH, so it's already the right version here — skip corepack
          # entirely when it's present. Running `corepack enable` anyway
          # fails on self-hosted runners: node is apt-installed as root, so
          # /usr/bin is root-owned and the non-root runner user gets EACCES
          # trying to symlink a corepack shim into it. This mirrors the same
          # guard in .github/actions/setup/action.yml's "Bootstrap pnpm for
          # setup-node cache" step.
          if command -v pnpm >/dev/null 2>&1; then
            echo "pnpm already available at $(command -v pnpm) ($(pnpm --version))"
            exit 0
          fi

          PNPM_VERSION=$(node -pe "(require('./package.json').packageManager || '').split('@')[1] || '9.12.1'")
          echo "Installing pnpm@${PNPM_VERSION}"
          corepack enable
          QUOTED_PNPM_VERSION=$(printf %q "${PNPM_VERSION}")
          corepack prepare "pnpm@${QUOTED_PNPM_VERSION}" --activate

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate lockfile
        # --lockfile-only: update pnpm-lock.yaml without writing to node_modules
        # --ignore-scripts: prevent lifecycle scripts from running (security:
        #   in pull_request_target, actions/checkout uses the app token for
        #   authenticated git access via persisted credentials/git config)
        run: pnpm install --no-frozen-lockfile --lockfile-only --ignore-scripts

      - name: Commit and push if changed
        run: |
          if git diff --quiet pnpm-lock.yaml; then
            echo "Lockfile is already correct, nothing to do"
            exit 0
          fi

          git config user.name  "legacy-sports-code-bot"
          git config user.email "legacy-sports-code-bot@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit \
            -m "chore(deps): regenerate pnpm-lock.yaml" \
            -m "Dependabot's native pnpm lockfile generation is incomplete for workspace monorepos. Regenerated with pnpm install."
          git push
          echo "Lockfile regenerated and pushed"
