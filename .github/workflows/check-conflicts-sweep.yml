name: "Check Merge Conflicts (Base Push Sweep)"

# Re-evaluates all open PRs for merge conflicts whenever main advances.
# Complements check-conflicts.yml (which handles PR-side events: opened,
# synchronize, etc.) by covering the case where new commits on main introduce
# conflicts into an existing PR — an event that check-conflicts.yml never sees.
#
# This also serves as a recovery path when GitHub fails to deliver the
# pull_request: opened event to check-conflicts.yml (observed on PRs where
# only push-triggered workflows ran on open, e.g. LS-7717).
#
# HOW THE STATUS GETS REFRESHED (LS-9604, superseding the LS-7992 / LS-8277
# check-run lineage): "No Merge Conflicts" is posted as a commit status by
# both this sweep and check-conflicts.yml — a status is POST-only and
# evaluated latest-created_at-per-context by both GitHub's merge gate and the
# MCP triage tooling, so there is no PATCH restriction to work around and no
# duplicate-required-name pile-up. (An earlier design POSTed a fresh
# API-owned check RUN instead, because GitHub forbids PATCHing an
# Actions-owned run; that workaround — and the DISPATCH-the-PR-branch design
# before it, reverted for stamping false-green results from a stale
# pr.base.sha — is obsolete now that the check is a status, not a run.)
#
# This sweep does the deterministic test-merge itself (against the
# just-pushed main = live base) and POSTs the result as a commit status on the
# PR head SHA. To avoid a redundant POST on every push, it's gated on the
# recorded status DISAGREEING with the fresh result (still the LS-7992
# duplicate-avoidance concern, now applied to statuses): once the correct
# result is recorded, later sweeps see a match and skip.
#
# The label + sticky-comment sync uses the same fresh result, so the label can
# never contradict the check, and label drift from other writers (e.g.
# ci-pipeline's read-modify-write labels PUT) heals on the next sweep.
#
# Update failures are COUNTED and fail this job — a sweep that cannot refresh
# the status must be red, not green with buried ::warning lines.

on:
  push:
    branches: [main]

concurrency:
  group: check-conflicts-sweep-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write
  pull-requests: write

jobs:
  sweep:
    name: "Sweep PRs for Merge Conflicts"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Read-heavy API calls go through the Agent Author app installation so the
      # sweep (4+ calls per open PR per main push) stops draining the single
      # shared GITHUB_TOKEN installation bucket (~1,000 req/hr) that every other
      # workflow in the repo uses — the same rate-limit failure mode LS-8277
      # fixed in check-conflicts.yml. Falls back to GITHUB_TOKEN when the secret
      # is unavailable.
      - name: Generate App Token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: 3158619
          private-key: ${{ secrets.AGENT_AUTHOR_APP_PRIVATE_KEY }}

      - name: Checkout base branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Check all open PRs for conflicts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          # Status POSTs use GITHUB_TOKEN specifically: it is covered by this
          # workflow's own `statuses: write` grant, the same token CI Gate
          # posts through (ci-pipeline.yml). (The Agent Author app token used
          # for the read-heavy calls above is not granted the statuses scope.)
          STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.ref_name }}
        run: |
          set -eo pipefail
          git config user.email "ci@noreply.github.com"
          git config user.name  "check-conflicts-sweep"

          # List all open PRs targeting the branch that was just pushed.
          # Do NOT suppress stderr or swallow exit codes — a failure here means the
          # sweep didn't run at all, which must be surfaced rather than silently
          # reporting "nothing to sweep."
          if ! PR_NUMBERS=$(gh api --paginate \
              "repos/${GH_REPO}/pulls?state=open&base=${BASE_REF}&per_page=100" \
              --jq '.[].number'); then
            echo "::error::Failed to list open PRs for ${BASE_REF} — check token permissions and API rate limits"
            exit 1
          fi

          if [ -z "$PR_NUMBERS" ]; then
            echo "No open PRs targeting ${BASE_REF}; nothing to sweep."
            exit 0
          fi

          echo "Open PRs targeting ${BASE_REF}: $(echo "$PR_NUMBERS" | tr '\n' ' ')"

          FAILED_UPDATES=0

          while IFS= read -r PR_NUM; do
            [ -z "$PR_NUM" ] && continue

            PR_JSON=$(gh pr view "$PR_NUM" --json headRefOid,labels 2>/dev/null || true)
            HEAD_SHA=$([ -n "$PR_JSON" ] && printf '%s' "$PR_JSON" | jq -r '.headRefOid // empty' || true)
            HAS_CONFLICT_LABEL=$([ -n "$PR_JSON" ] && printf '%s' "$PR_JSON" | jq -r 'any(.labels[]; .name == "CI: Conflicts")' || echo 'false')
            if [ -z "$HEAD_SHA" ]; then
              echo "::warning::Could not resolve head SHA for PR #${PR_NUM}; skipping"
              continue
            fi

            echo "--- PR #${PR_NUM} (head: ${HEAD_SHA:0:7}) ---"

            # Detach to the pushed base so each PR starts from the same base.
            git checkout --detach "${BASE_SHA}" --quiet
            git clean -fd --quiet 2>/dev/null || true

            # Fetch the PR head via refs/pull/N/head (works for forks too).
            if ! git fetch --no-tags origin \
                "+refs/pull/${PR_NUM}/head:refs/remotes/origin/pr/${PR_NUM}" 2>/dev/null; then
              echo "::warning::Could not fetch head for PR #${PR_NUM}; skipping"
              continue
            fi

            # Test merge — non-interactive, leaves workspace dirty on conflict.
            if git merge --no-commit --no-ff "refs/remotes/origin/pr/${PR_NUM}" 2>/dev/null; then
              CONCLUSION="success"
              OUT_TITLE="No merge conflicts detected"
            else
              CONCLUSION="failure"
              OUT_TITLE="Merge conflicts with the base branch"
            fi
            # Always abort/clean regardless of outcome.
            git merge --abort 2>/dev/null || git reset --hard HEAD
            git clean -fd --quiet 2>/dev/null || true

            echo "PR #${PR_NUM}: ${CONCLUSION}"

            # Compare against the recorded "No Merge Conflicts" commit-status
            # state on the head SHA: the newest status for the context, so no
            # id/timestamp comparison is needed (unlike the check-run world
            # this replaced).
            # An API failure or absent status yields an empty string, which
            # falls through to the refresh path — fail open toward
            # re-checking, never toward stale.
            #
            # LS-10561: a status posted by any app other than github-actions[bot]
            # (e.g. the Legacy Sports CI app, between LS-10559 and LS-10561) is
            # rejected at merge time by branch protection's app binding, so treat
            # it as absent and re-post it through STATUS_TOKEN (GITHUB_TOKEN).
            # The list endpoint (newest first) is used instead of the combined
            # /status endpoint because only it carries `creator`.
            RECORDED_STATE=$(gh api "repos/${GH_REPO}/commits/${HEAD_SHA}/statuses?per_page=100" \
              --jq '[.[] | select(.context == "No Merge Conflicts")][0] | select(. != null and .creator.login == "github-actions[bot]") | .state' \
              2>/dev/null || true)
            if [ -n "$RECORDED_STATE" ]; then
              RECORDED_STATUS="completed"
            else
              RECORDED_STATUS="absent"
            fi
            RECORDED_CONCLUSION="$RECORDED_STATE"

            # Decide whether to (re)post the status. Logic lives in a unit-tested
            # helper (.github/scripts/__tests__/conflict-sweep-decision.test.mjs)
            # so the false-green regression — stale success under a fresh
            # failure → must POST — is pinned by a test, not just review.
            ACTION=$(node .github/scripts/conflict-sweep-decision.mjs \
              "$CONCLUSION" "$RECORDED_STATUS" "$RECORDED_CONCLUSION")

            if [ "$ACTION" = "in-sync" ]; then
              echo "Status already in sync (${RECORDED_STATE:-<none>}); no refresh needed"
            else
              # ACTION=post (or the unreachable-for-statuses defer-to-live,
              # since decideSweepAction() is shared with the retired check-run
              # caller — see its docstring). Recorded status is stale, wrong,
              # or absent. POST this sweep's own live-main test result as a
              # commit status; latest-created_at-per-context wins at the merge
              # gate, so this supersedes any stale status. Gated on
              # disagreement above, so steady state posts nothing.
              if printf '{"state":"%s","context":"No Merge Conflicts","description":"%s","target_url":"https://github.com/%s/actions/runs/%s"}' \
                  "$CONCLUSION" "$OUT_TITLE" "$GH_REPO" "$GITHUB_RUN_ID" \
                  | GH_TOKEN="$STATUS_TOKEN" gh api "repos/${GH_REPO}/statuses/${HEAD_SHA}" -X POST --input - > /dev/null; then
                echo "Recorded state '${RECORDED_STATE:-<none>}' was stale; posted 'No Merge Conflicts' status (${CONCLUSION}) for PR #${PR_NUM} on ${HEAD_SHA:0:7}"
              else
                echo "::error::Failed to post 'No Merge Conflicts' status for PR #${PR_NUM}"
                FAILED_UPDATES=$((FAILED_UPDATES + 1))
              fi
            fi

            # Sync "CI: Conflicts" label to match the merge-test result.
            # Mirrors the label management in check-conflicts.yml so agents and
            # sweep-prs consumers see a consistent label state after main advances.
            #
            # Comment idempotency keys off a hidden marker, NOT the label. The
            # label is written by multiple actors (this sweep, check-conflicts.yml,
            # ci-pipeline's replace-all-labels PUT, and agents), so its
            # absent->present edge can't guarantee a single comment — it caused
            # PRs to be re-commented on every base push (LS-8229). Find the one
            # sticky comment by marker and create-or-update it in place instead.
            MARKER='<!-- conflict-notice -->'
            EXISTING_COMMENT_ID=$(gh api --paginate \
              "repos/${GH_REPO}/issues/${PR_NUM}/comments" \
              --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" 2>/dev/null \
              | head -1 || true)

            if [ "$CONCLUSION" = "failure" ]; then
              # Label add is idempotent; gate only to skip a redundant POST that
              # would otherwise count against the secondary rate limit.
              if [ "$HAS_CONFLICT_LABEL" != "true" ]; then
                printf '{"labels":["CI: Conflicts"]}' \
                  | gh api "repos/${GH_REPO}/issues/${PR_NUM}/labels" -X POST --input - > /dev/null \
                  || echo "::warning::Failed to add 'CI: Conflicts' label to PR #${PR_NUM}"
              fi
              # Sticky comment: create once, then update in place on later sweeps.
              BODY="${MARKER}"$'\n'"⚠️ This PR has merge conflicts with \`${BASE_REF}\` after ${BASE_SHA:0:7} landed."
              BODY="$BODY Rebase or merge \`${BASE_REF}\` into your branch to resolve them."
              BODY="$BODY The \`CI: Conflicts\` label will be removed automatically once the conflicts are resolved."
              # jq -R -s slurps the whole (multi-line) body into one JSON string.
              if [ -n "$EXISTING_COMMENT_ID" ]; then
                printf '%s' "$BODY" | jq -R -s '{"body": .}' \
                  | gh api "repos/${GH_REPO}/issues/comments/${EXISTING_COMMENT_ID}" -X PATCH --input - > /dev/null \
                  || echo "::warning::Failed to update conflict comment on PR #${PR_NUM}"
              else
                printf '%s' "$BODY" | jq -R -s '{"body": .}' \
                  | gh api "repos/${GH_REPO}/issues/${PR_NUM}/comments" -X POST --input - > /dev/null \
                  || echo "::warning::Failed to post conflict comment on PR #${PR_NUM}"
              fi
            else
              # Mergeable — remove stale label and delete the sticky comment.
              if [ "$HAS_CONFLICT_LABEL" = "true" ]; then
                gh api "repos/${GH_REPO}/issues/${PR_NUM}/labels/CI%3A%20Conflicts" \
                  -X DELETE > /dev/null 2>&1 \
                  || echo "::warning::Failed to remove 'CI: Conflicts' label from PR #${PR_NUM}"
              fi
              if [ -n "$EXISTING_COMMENT_ID" ]; then
                gh api "repos/${GH_REPO}/issues/comments/${EXISTING_COMMENT_ID}" \
                  -X DELETE > /dev/null 2>&1 \
                  || echo "::warning::Failed to delete stale conflict comment on PR #${PR_NUM}"
              fi
            fi
          done <<< "$PR_NUMBERS"

          if [ "$FAILED_UPDATES" -gt 0 ]; then
            echo "::error::${FAILED_UPDATES} PR(s) could not have their 'No Merge Conflicts' check refreshed"
            exit 1
          fi
