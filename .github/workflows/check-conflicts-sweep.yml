name: "Check Merge Conflicts (Base Push Sweep)"

# Re-evaluates all open PRs for merge conflicts whenever main advances.
# Complements check-conflicts.yml (which handles PR-side events: opened,
# synchronize, etc.) by covering the case where new commits on main introduce
# conflicts into an existing PR — an event that check-conflicts.yml never sees.
#
# This also serves as a recovery path when GitHub fails to deliver the
# pull_request: opened event to check-conflicts.yml (observed on PRs where
# only push-triggered workflows ran on open, e.g. LS-7717).
#
# HOW THE CHECK RUN GETS REFRESHED (LS-7992 → superseded): the "No Merge
# Conflicts" required check is normally the check-conflicts.yml JOB run, and
# GitHub forbids updating Actions-created check runs through the Checks API
# ("Check run status and conclusions can only be updated internally by GitHub
# Actions", changelog 2025-02-12). The previous design PATCHed that run and
# silently no-opped on every PR, leaving the required check stale whenever main
# introduced or resolved a conflict. So instead of writing the check run
# directly, this sweep test-merges each PR locally and, when the recorded
# check-run state disagrees with the fresh result, DISPATCHES
# check-conflicts.yml on the PR's head branch (`workflow_dispatch` with
# pr_number). The dispatched job re-runs the test merge and reports through its
# own job check run — the one writer GitHub still allows. Fork PRs (whose head
# branch we cannot dispatch on) fall back to POSTing a new API-owned completed
# check run, which the Checks API still permits; the newest-run-per-name dedup
# in the ruleset evaluator and the MCP triage tooling picks it up.
#
# The label + sticky-comment sync stays here (in addition to the dispatched
# workflow's own sync) so the fast signal lands even before the dispatched run
# finishes, and so label drift from other writers (e.g. ci-pipeline's
# read-modify-write labels PUT) heals on the next sweep.
#
# Update failures are COUNTED and fail this job — a sweep that cannot refresh
# check runs must be red, not green with buried ::warning lines (that is
# exactly how the PATCH regression went unnoticed).

on:
  push:
    branches: [main]

concurrency:
  group: check-conflicts-sweep-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write
  # Required to dispatch check-conflicts.yml for out-of-sync PRs. The dispatch
  # must use GITHUB_TOKEN: workflow_dispatch is one of the two event types a
  # GITHUB_TOKEN-triggered action still fires, and the Agent Author app lacks
  # actions:write (see cloud-agent-mode Quirk 4).
  actions: write

jobs:
  sweep:
    name: "Sweep PRs for Merge Conflicts"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Read-heavy API calls go through the Agent Author app installation so the
      # sweep (4+ calls per open PR per main push) stops draining the single
      # shared GITHUB_TOKEN installation bucket (~1,000 req/hr) that every other
      # workflow in the repo uses — the same rate-limit failure mode LS-8277
      # fixed in check-conflicts.yml. Falls back to GITHUB_TOKEN when the secret
      # is unavailable.
      - name: Generate App Token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: 3158619
          private-key: ${{ secrets.AGENT_AUTHOR_APP_PRIVATE_KEY }}

      - name: Checkout base branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Check all open PRs for conflicts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          # Dispatch and check-run writes need GITHUB_TOKEN specifically: the
          # app token lacks actions:write, and API-owned check runs created with
          # GITHUB_TOKEN must be completed by the same identity.
          DISPATCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.ref_name }}
        run: |
          set -eo pipefail
          git config user.email "ci@noreply.github.com"
          git config user.name  "check-conflicts-sweep"

          # List all open PRs targeting the branch that was just pushed.
          # Do NOT suppress stderr or swallow exit codes — a failure here means the
          # sweep didn't run at all, which must be surfaced rather than silently
          # reporting "nothing to sweep."
          if ! PR_NUMBERS=$(gh api --paginate \
              "repos/${GH_REPO}/pulls?state=open&base=${BASE_REF}&per_page=100" \
              --jq '.[].number'); then
            echo "::error::Failed to list open PRs for ${BASE_REF} — check token permissions and API rate limits"
            exit 1
          fi

          if [ -z "$PR_NUMBERS" ]; then
            echo "No open PRs targeting ${BASE_REF}; nothing to sweep."
            exit 0
          fi

          echo "Open PRs targeting ${BASE_REF}: $(echo "$PR_NUMBERS" | tr '\n' ' ')"

          FAILED_UPDATES=0

          while IFS= read -r PR_NUM; do
            [ -z "$PR_NUM" ] && continue

            PR_JSON=$(gh pr view "$PR_NUM" --json headRefOid,headRefName,isCrossRepository,labels 2>/dev/null || true)
            HEAD_SHA=$([ -n "$PR_JSON" ] && printf '%s' "$PR_JSON" | jq -r '.headRefOid // empty' || true)
            HEAD_REF=$([ -n "$PR_JSON" ] && printf '%s' "$PR_JSON" | jq -r '.headRefName // empty' || true)
            IS_FORK=$([ -n "$PR_JSON" ] && printf '%s' "$PR_JSON" | jq -r '.isCrossRepository // false' || echo 'false')
            HAS_CONFLICT_LABEL=$([ -n "$PR_JSON" ] && printf '%s' "$PR_JSON" | jq -r 'any(.labels[]; .name == "CI: Conflicts")' || echo 'false')
            if [ -z "$HEAD_SHA" ]; then
              echo "::warning::Could not resolve head SHA for PR #${PR_NUM}; skipping"
              continue
            fi

            echo "--- PR #${PR_NUM} (head: ${HEAD_SHA:0:7}) ---"
            STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            # Detach to the pushed base so each PR starts from the same base.
            git checkout --detach "${BASE_SHA}" --quiet
            git clean -fd --quiet 2>/dev/null || true

            # Fetch the PR head via refs/pull/N/head (works for forks too).
            if ! git fetch --no-tags origin \
                "+refs/pull/${PR_NUM}/head:refs/remotes/origin/pr/${PR_NUM}" 2>/dev/null; then
              echo "::warning::Could not fetch head for PR #${PR_NUM}; skipping"
              continue
            fi

            # Test merge — non-interactive, leaves workspace dirty on conflict.
            if git merge --no-commit --no-ff "refs/remotes/origin/pr/${PR_NUM}" 2>/dev/null; then
              CONCLUSION="success"
              OUT_TITLE="No merge conflicts"
              OUT_SUMMARY="No merge conflicts detected between PR #${PR_NUM} and ${BASE_REF} (base: ${BASE_SHA:0:7})."
            else
              CONCLUSION="failure"
              OUT_TITLE="Merge conflicts detected"
              OUT_SUMMARY="PR #${PR_NUM} has merge conflicts with ${BASE_REF} after ${BASE_SHA:0:7} landed. Rebase or merge ${BASE_REF} into your branch to resolve them."
            fi
            # Always abort/clean regardless of outcome.
            git merge --abort 2>/dev/null || git reset --hard HEAD
            git clean -fd --quiet 2>/dev/null || true

            echo "PR #${PR_NUM}: ${CONCLUSION}"

            # Compare against the recorded "No Merge Conflicts" check-run state
            # on the head SHA (newest run per name — the one the ruleset
            # evaluator and MCP triage tooling read). `status:conclusion`, e.g.
            # "completed:success"; "absent:" when no run exists yet. An API
            # failure here yields an empty string, which falls through to the
            # refresh path — fail open toward re-checking, never toward stale.
            RECORDED=$(gh api "repos/${GH_REPO}/commits/${HEAD_SHA}/check-runs" \
              -X GET -f check_name="No Merge Conflicts" -f per_page=100 \
              --jq '.check_runs | max_by(.id) | "\(.status // "absent"):\(.conclusion // "")"' \
              2>/dev/null || true)
            RECORDED_STATUS="${RECORDED%%:*}"
            RECORDED_CONCLUSION="${RECORDED#*:}"

            if [ "$RECORDED_STATUS" = "completed" ] && [ "$RECORDED_CONCLUSION" = "$CONCLUSION" ]; then
              echo "Check run already in sync (${RECORDED}); no refresh needed"
            elif [ "$RECORDED_STATUS" = "in_progress" ] || [ "$RECORDED_STATUS" = "queued" ]; then
              # A live check-conflicts run (PR push or earlier dispatch) is
              # already recomputing against the current base; don't cancel it
              # with a competing dispatch (shared concurrency group).
              echo "Check run currently ${RECORDED_STATUS}; letting the live run report"
            elif [ "$IS_FORK" != "true" ] && \
                GH_TOKEN="$DISPATCH_TOKEN" gh workflow run check-conflicts.yml \
                  --ref "$HEAD_REF" -f "pr_number=${PR_NUM}" 2>/dev/null; then
              echo "Recorded state '${RECORDED:-<none>}' is stale (want completed:${CONCLUSION}); dispatched check-conflicts.yml on ${HEAD_REF}"
            else
              # Fork PR, or dispatch failed (e.g. the branch predates the
              # workflow's dispatch input). POST a fresh API-owned completed
              # run — still permitted, unlike updating the job's run. This can
              # stack a duplicate run name on the SHA, but only on state
              # transitions; newest-run-per-name dedup handles it.
              COMPLETED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              if printf '{"name":"No Merge Conflicts","head_sha":"%s","status":"completed","conclusion":"%s","started_at":"%s","completed_at":"%s","output":{"title":"%s","summary":"%s"}}' \
                  "$HEAD_SHA" "$CONCLUSION" "$STARTED_AT" "$COMPLETED_AT" "$OUT_TITLE" "$OUT_SUMMARY" \
                  | GH_TOKEN="$DISPATCH_TOKEN" gh api "repos/${GH_REPO}/check-runs" -X POST --input - > /dev/null; then
                echo "Posted API-owned 'No Merge Conflicts' run (${CONCLUSION}) for PR #${PR_NUM}"
              else
                echo "::error::Failed to refresh 'No Merge Conflicts' for PR #${PR_NUM} — dispatch and direct POST both failed"
                FAILED_UPDATES=$((FAILED_UPDATES + 1))
              fi
            fi

            # Sync "CI: Conflicts" label to match the merge-test result.
            # Mirrors the label management in check-conflicts.yml so agents and
            # sweep-prs consumers see a consistent label state after main advances.
            #
            # Comment idempotency keys off a hidden marker, NOT the label. The
            # label is written by multiple actors (this sweep, check-conflicts.yml,
            # ci-pipeline's replace-all-labels PUT, and agents), so its
            # absent->present edge can't guarantee a single comment — it caused
            # PRs to be re-commented on every base push (LS-8229). Find the one
            # sticky comment by marker and create-or-update it in place instead.
            MARKER='<!-- conflict-notice -->'
            EXISTING_COMMENT_ID=$(gh api --paginate \
              "repos/${GH_REPO}/issues/${PR_NUM}/comments" \
              --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" 2>/dev/null \
              | head -1 || true)

            if [ "$CONCLUSION" = "failure" ]; then
              # Label add is idempotent; gate only to skip a redundant POST that
              # would otherwise count against the secondary rate limit.
              if [ "$HAS_CONFLICT_LABEL" != "true" ]; then
                printf '{"labels":["CI: Conflicts"]}' \
                  | gh api "repos/${GH_REPO}/issues/${PR_NUM}/labels" -X POST --input - > /dev/null \
                  || echo "::warning::Failed to add 'CI: Conflicts' label to PR #${PR_NUM}"
              fi
              # Sticky comment: create once, then update in place on later sweeps.
              BODY="${MARKER}"$'\n'"⚠️ This PR has merge conflicts with \`${BASE_REF}\` after ${BASE_SHA:0:7} landed."
              BODY="$BODY Rebase or merge \`${BASE_REF}\` into your branch to resolve them."
              BODY="$BODY The \`CI: Conflicts\` label will be removed automatically once the conflicts are resolved."
              # jq -R -s slurps the whole (multi-line) body into one JSON string.
              if [ -n "$EXISTING_COMMENT_ID" ]; then
                printf '%s' "$BODY" | jq -R -s '{"body": .}' \
                  | gh api "repos/${GH_REPO}/issues/comments/${EXISTING_COMMENT_ID}" -X PATCH --input - > /dev/null \
                  || echo "::warning::Failed to update conflict comment on PR #${PR_NUM}"
              else
                printf '%s' "$BODY" | jq -R -s '{"body": .}' \
                  | gh api "repos/${GH_REPO}/issues/${PR_NUM}/comments" -X POST --input - > /dev/null \
                  || echo "::warning::Failed to post conflict comment on PR #${PR_NUM}"
              fi
            else
              # Mergeable — remove stale label and delete the sticky comment.
              if [ "$HAS_CONFLICT_LABEL" = "true" ]; then
                gh api "repos/${GH_REPO}/issues/${PR_NUM}/labels/CI%3A%20Conflicts" \
                  -X DELETE > /dev/null 2>&1 \
                  || echo "::warning::Failed to remove 'CI: Conflicts' label from PR #${PR_NUM}"
              fi
              if [ -n "$EXISTING_COMMENT_ID" ]; then
                gh api "repos/${GH_REPO}/issues/comments/${EXISTING_COMMENT_ID}" \
                  -X DELETE > /dev/null 2>&1 \
                  || echo "::warning::Failed to delete stale conflict comment on PR #${PR_NUM}"
              fi
            fi
          done <<< "$PR_NUMBERS"

          if [ "$FAILED_UPDATES" -gt 0 ]; then
            echo "::error::${FAILED_UPDATES} PR(s) could not have their 'No Merge Conflicts' check refreshed"
            exit 1
          fi
