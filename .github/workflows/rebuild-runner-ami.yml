# rebuild-runner-ami.yml — Build a new runner AMI via Packer in CI and commit
# the version updates back to the triggering PR branch. LS-2429, LS-4946.
#
# Purpose:
#   Removes the "AWS SSO access" bottleneck for Playwright bumps. Dependabot (or
#   any contributor) can open a PR that bumps @playwright/test + playwright, and
#   a maintainer can trigger this workflow on the PR. The workflow:
#
#     1. Reads the resolved playwright-core version from pnpm-lock.yaml on the
#        PR branch.
#     2. Runs `make ami-build` inside CI using OIDC creds for the
#        `runner-ami-builder` IAM role, producing a new AMI named
#        `legacy-sports-runner-pw<version>-<timestamp>`.
#     3. Updates the `playwright_version` default in the Packer HCL and the
#        `runner_ami_playwright_version` value in runner-ami.auto.tfvars.
#     4. Commits those updates back to the PR branch using a bot token so the
#        runner-ami-drift-check workflow re-runs and passes.
#     5. Prunes old AMIs as a final step in the build job, via the shared
#        ./.github/actions/prune-runner-amis composite action. Standalone
#        pruning (no build) lives in prune-runner-amis.yml. LS-4946 split
#        the former `prune-only: true` flag into its own workflow so each
#        entry point's input schema is GitHub-enforced documentation of what
#        it needs.
#
#   After the PR merges, `runner-terraform-apply.yml` rolls the launch template
#   to the new AMI automatically.
#
# Triggers:
#   - pull_request with the label `rebuild-runner-ami` (added manually or by a
#     future dependabot auto-labeller).
#   - workflow_dispatch with a required PR number input (for manual kick).
#
# Why label-triggered and not automatic:
#   Packer builds take ~10 min and cost ~$0.50 each. We deliberately require an
#   explicit signal to avoid spending time/money on drafts or experimental PRs.
#   For dependabot, a future follow-up can auto-label Playwright bump PRs.

name: Rebuild Runner AMI

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr-number:
        description: "PR number to build AMI against"
        required: true
        type: string

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency:
  # One AMI build per PR at a time.
  group: rebuild-runner-ami-${{ github.event.pull_request.number || github.event.inputs.pr-number }}
  cancel-in-progress: false

jobs:
  build:
    name: Build runner AMI
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'rebuild-runner-ami' }}
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 25
    env:
      AWS_REGION: us-east-1
    steps:
      # Mint a short-lived GitHub App installation token for the Agent Author app
      # (App ID 3158619, legacy-sports-code-bot). This is the same pattern used by
      # dependabot-lockfile-fix.yml and pr-workflow-guide.yml — it gives us a token
      # that can push back to the PR branch AND retrigger required checks, which
      # the default GITHUB_TOKEN cannot. Avoids the operational burden of rotating
      # a hand-managed PAT (LS-4905; previously this workflow required a separate
      # BOT_GITHUB_TOKEN secret that drifted out of existence).
      - name: Generate bot token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        id: bot-token
        with:
          client-id: 3158619
          private-key: ${{ secrets.AGENT_AUTHOR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Resolve PR ref
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PR_NUMBER='${{ github.event.inputs.pr-number }}'
          else
            PR_NUMBER='${{ github.event.pull_request.number }}'
          fi

          # Look up the head repo + ref via the GitHub API so we can check out
          # the PR branch even when the trigger is workflow_dispatch.
          PR_JSON=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER")
          HEAD_REF=$(echo "$PR_JSON" | jq -r .head.ref)
          HEAD_SHA=$(echo "$PR_JSON" | jq -r .head.sha)
          HEAD_REPO=$(echo "$PR_JSON" | jq -r .head.repo.full_name)

          if [[ "$HEAD_REPO" != "${{ github.repository }}" ]]; then
            echo "::error::Refusing to build AMI for a fork PR ($HEAD_REPO). Rebase into the main repo first."
            exit 1
          fi

          echo "pr_number=$PR_NUMBER"   >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF"     >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA"     >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0
          # Use the App installation token so the push back to the PR branch
          # triggers downstream CI. The default GITHUB_TOKEN cannot push back to a
          # branch in a way that re-runs required checks.
          token: ${{ steps.bot-token.outputs.token }}

      - name: Extract target Playwright version from lockfile
        id: lockfile
        run: |
          set -euo pipefail
          VERSION=$(grep -E "^  playwright-core@" pnpm-lock.yaml \
            | head -n 1 \
            | sed -E 's/^  playwright-core@([0-9.]+):.*/\1/')
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not extract playwright-core version from pnpm-lock.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Target Playwright version: $VERSION"

      - name: Configure AWS credentials (Packer builder role)
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6
        with:
          role-to-assume: arn:aws:iam::176661590736:role/legacy-sports-dev-runner-ami-builder
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve VPC + subnet for Packer build
        id: network
        run: |
          set -euo pipefail
          # Build instance runs in the legacy-sports VPC's first truly-public
          # subnet — defined as one whose associated route table has a 0.0.0.0/0
          # route pointing at an Internet Gateway. The earlier heuristic only
          # required map-public-ip-on-launch=true, which does not guarantee a
          # working IGW route — silently re-broken builds on the next infra change
          # (LS-4920).
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=legacy-sports-dev-vpc" \
            --query "Vpcs[0].VpcId" --output text)
          if [[ "$VPC_ID" == "None" || -z "$VPC_ID" ]]; then
            echo "::error::Could not find legacy-sports-dev-vpc"
            exit 1
          fi

          VPC_CIDR=$(aws ec2 describe-vpcs \
            --vpc-ids "$VPC_ID" \
            --query "Vpcs[0].CidrBlock" --output text)
          if [[ "$VPC_CIDR" == "None" || -z "$VPC_CIDR" ]]; then
            echo "::error::Could not resolve CIDR block for $VPC_ID"
            exit 1
          fi

          # Find every subnet whose explicitly-associated route table has a
          # 0.0.0.0/0 route to an Internet Gateway. We rely on explicit subnet
          # associations rather than the VPC's main route table: the legacy-sports
          # public subnets are explicitly associated with the IGW route table
          # (terraform/main provisions them that way), and using only explicit
          # associations avoids surprising matches against the main RT in case it
          # ever has an IGW route added.
          PUBLIC_SUBNETS=$(aws ec2 describe-route-tables \
            --filters "Name=vpc-id,Values=$VPC_ID" \
                      "Name=route.gateway-id,Values=igw-*" \
                      "Name=route.destination-cidr-block,Values=0.0.0.0/0" \
            --query "RouteTables[].Associations[?SubnetId!=\`null\`].SubnetId" \
            --output text | tr '\t' '\n' | sort -u | grep -v '^$' || true)

          if [[ -z "$PUBLIC_SUBNETS" ]]; then
            echo "::error::No subnet in $VPC_ID has a 0.0.0.0/0 route to an Internet Gateway"
            exit 1
          fi

          # Pick the first subnet that also has map-public-ip-on-launch=true so the
          # instance actually gets a public IP for outbound package pulls.
          SUBNET_ID=""
          while read -r CANDIDATE; do
            [[ -z "$CANDIDATE" ]] && continue
            MAP_PUBLIC=$(aws ec2 describe-subnets \
              --subnet-ids "$CANDIDATE" \
              --query "Subnets[0].MapPublicIpOnLaunch" --output text)
            if [[ "$MAP_PUBLIC" == "True" ]]; then
              SUBNET_ID="$CANDIDATE"
              break
            fi
          done <<< "$PUBLIC_SUBNETS"

          if [[ -z "$SUBNET_ID" ]]; then
            echo "::error::No IGW-routed subnet in $VPC_ID has map-public-ip-on-launch=true"
            exit 1
          fi

          echo "Resolved public subnet $SUBNET_ID with verified IGW route in $VPC_ID"
          echo "vpc_id=$VPC_ID"       >> "$GITHUB_OUTPUT"
          echo "vpc_cidr=$VPC_CIDR"   >> "$GITHUB_OUTPUT"
          echo "subnet_id=$SUBNET_ID" >> "$GITHUB_OUTPUT"

      - name: Setup Packer
        uses: hashicorp/setup-packer@c3d53c525d422944e50ee27b840746d6522b08de # v3.2.0
        with:
          version: "latest"

      - name: Build AMI via Packer
        id: build
        working-directory: terraform/runners/packer
        env:
          VERSION: ${{ steps.lockfile.outputs.version }}
          VPC_ID: ${{ steps.network.outputs.vpc_id }}
          VPC_CIDR: ${{ steps.network.outputs.vpc_cidr }}
          SUBNET_ID: ${{ steps.network.outputs.subnet_id }}
        run: |
          set -euo pipefail
          packer init runner-ami.pkr.hcl
          packer build \
            -var "playwright_version=$VERSION" \
            -var "vpc_id=$VPC_ID" \
            -var "subnet_id=$SUBNET_ID" \
            -var "ssh_source_cidr=$VPC_CIDR" \
            runner-ami.pkr.hcl 2>&1 | tee packer-build.log

          # Extract the new AMI ID from the build log. Packer's amazon-ebs builder
          # prints a line of the form "us-east-1: ami-0123456789abcdef0" at the end.
          AMI_ID=$(grep -oE "us-east-1: ami-[0-9a-f]+" packer-build.log | tail -n 1 | awk '{print $2}')
          if [[ -z "$AMI_ID" ]]; then
            echo "::error::Could not extract AMI ID from Packer build log"
            exit 1
          fi
          echo "ami_id=$AMI_ID" >> "$GITHUB_OUTPUT"
          echo "✅ Built AMI $AMI_ID for Playwright $VERSION"

      - name: Update Packer default + tfvars on PR branch
        env:
          VERSION: ${{ steps.lockfile.outputs.version }}
        run: |
          set -euo pipefail

          # Packer HCL default: update the playwright_version variable default.
          # We only want to touch the default line that immediately follows the
          # `variable "playwright_version"` block — the file contains other
          # `default = "..."` lines that must not be modified.
          python3 - <<'PYEOF'
          import re
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          path = Path("terraform/runners/packer/runner-ami.pkr.hcl")
          text = path.read_text()

          pattern = r'(variable "playwright_version"\s*\{[^}]*?default\s*=\s*)"([^"]+)"'
          m = re.search(pattern, text, flags=re.DOTALL)
          if not m:
              raise SystemExit("Failed to find playwright_version default in Packer HCL")

          if m.group(2) == version:
              print(f"Packer default already at {version}, skipping update")
          else:
              new_text = text[:m.start()] + m.group(1) + f'"{version}"' + text[m.end():]
              path.write_text(new_text)
              print(f"Updated Packer default to {version}")
          PYEOF

          # Terraform tfvars: update runner_ami_playwright_version.
          python3 - <<'PYEOF'
          import re
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          path = Path("terraform/runners/runner-ami.auto.tfvars")
          text = path.read_text()

          pattern = r'(runner_ami_playwright_version\s*=\s*)"([^"]+)"'
          m = re.search(pattern, text)
          if not m:
              raise SystemExit("Failed to find runner_ami_playwright_version in tfvars")

          if m.group(2) == version:
              print(f"tfvars already at {version}, skipping update")
          else:
              new_text = text[:m.start()] + m.group(1) + f'"{version}"' + text[m.end():]
              path.write_text(new_text)
              print(f"Updated tfvars to {version}")
          PYEOF

      - name: Commit and push updates
        env:
          VERSION: ${{ steps.lockfile.outputs.version }}
          AMI_ID: ${{ steps.build.outputs.ami_id }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          git config user.name  "legacy-sports-code-bot"
          git config user.email "legacy-sports-code-bot@users.noreply.github.com"

          if git diff --quiet terraform/runners/packer/runner-ami.pkr.hcl terraform/runners/runner-ami.auto.tfvars; then
            echo "ℹ️ No changes to commit — Packer HCL and tfvars already match lockfile version $VERSION."
            exit 0
          fi

          git add terraform/runners/packer/runner-ami.pkr.hcl terraform/runners/runner-ami.auto.tfvars
          git commit -m "chore(infra): bump runner AMI to Playwright $VERSION ($AMI_ID)

          Built by rebuild-runner-ami.yml on PR #$PR_NUMBER.
          New AMI: $AMI_ID

          Co-Authored-By: legacy-sports-code-bot <legacy-sports-code-bot@users.noreply.github.com>"
          git push

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.lockfile.outputs.version }}
          AMI_ID: ${{ steps.build.outputs.ami_id }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          gh pr comment "$PR_NUMBER" --body "🧱 **Runner AMI rebuilt**

          Built a new AMI for Playwright \`$VERSION\`: \`$AMI_ID\`

          Packer HCL \`playwright_version\` default and \`runner-ami.auto.tfvars\` have
          been updated on this branch. The runner-ami-drift-check workflow will re-run
          and should now pass. On merge, \`runner-terraform-apply.yml\` will roll the
          launch template to the new AMI."

      # Prune old runner AMIs as a post-build step. Retains the 5 most recent
      # AMIs by creation date plus any version still referenced by main or an
      # open PR branch. Keeps the AMI count bounded without a cron job —
      # prune at build time, not on a timer (LS-3885, LS-4000). Shared logic
      # lives in the composite action; standalone pruning (no build) is in
      # prune-runner-amis.yml.
      - name: Prune old runner AMIs
        uses: ./.github/actions/prune-runner-amis
