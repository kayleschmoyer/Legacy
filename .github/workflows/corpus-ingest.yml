# =============================================================================
# Corpus Ingest
# =============================================================================
# Runs the S3 corpus ingests from Actions (LS-10562) so they no longer need a
# maintainer with local AWS SSO credentials:
#
#   nflverse   -> ingest-nflverse-football -> legacy-sports-dev-football-corpus
#   retrosheet -> ingest-retrosheet        -> legacy-sports-dev-retrosheet-corpus
#   pfa        -> ingest-pfa-football      -> legacy-sports-dev-football-corpus
#
# The pfa source (LS-10587) crawls profootballarchives.com, which the CCR egress
# proxy blocks, so it can only run from Actions. It differs from the other two:
#   - Its name crosswalk SELECTs football rows from public.players, so it needs
#     the dev RDS. RDS is private (publicly_accessible=false), so the job runs
#     on the self-hosted runner pool (vars.CI_RUNNER_LABEL). It connects as
#     corpus_ingest_readonly (SELECT on players only, LS-10605), whose secret
#     name it reads from SSM; the corpus-ingest role can read both.
#   - The crawl is rate-limited (>= 3s per request, ~7,000 box scores for
#     1960-1998), so it gets a 12h timeout. Split it into season ranges with
#     from/to; a re-run of a range skips objects already written.
#
# Runbook: .agents/skills/dev-environment/references/cli-commands.md
# (in-season nflverse refresh, annual Retrosheet refresh).
#
# On-demand tool, not a CI job: workflow_dispatch only, no automatic trigger of
# any kind (schedule-free CI policy, LS-8487). The in-season nflverse refresh is
# a manual dispatch with force=true for the current season.
#
# Safety:
#   - The job runs in the `corpus-ingest` environment, which requires the
#     owner's approval before it starts. The OIDC role
#     (terraform/main/github-actions-corpus-ingest.tf) trusts ONLY that
#     environment and can only read/write (never delete) the corpus buckets.
#   - dry_run defaults to true. A dry run still assumes the role and probes the
#     target bucket (list + head one object) before the CLI parses everything
#     without writing, so it proves access end to end.
#   - The CLI exits non-zero when any season fails (LS-10224), so a partial
#     ingest fails the run.
# =============================================================================

name: "Corpus Ingest"

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Which corpus to ingest"
        required: true
        type: choice
        options:
          - nflverse
          - retrosheet
          - pfa
      from:
        description: "First season (blank = CLI default: 1999 nflverse, 1897 retrosheet, 1960 pfa)"
        required: false
        type: string
        default: ""
      to:
        description: "Last season (blank = CLI default: current NFL season / last year / 1998 pfa)"
        required: false
        type: string
        default: ""
      force:
        description: "Re-upload objects that already exist (use for an in-progress NFL season)"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Parse and report without writing to S3"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

# One ingest per corpus at a time; never cancel a run that is mid-write.
concurrency:
  group: corpus-ingest-${{ inputs.source }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  CORPUS_ROLE_ARN: arn:aws:iam::176661590736:role/legacy-sports-dev-corpus-ingest
  # pfa only: SSM parameter naming the corpus_ingest_readonly DB secret
  # (terraform/main/github-actions-corpus-ingest.tf).
  CROSSWALK_DB_SECRET_PARAM: /legacy-sports/dev/corpus-ingest/db-creds-secret-name

jobs:
  ingest:
    name: "Ingest ${{ inputs.source }}${{ inputs.dry_run && ' (dry run)' || '' }}"
    # pfa reads the private dev RDS for its crosswalk, which only the
    # self-hosted pool (in the VPC) can reach.
    runs-on: ${{ inputs.source == 'pfa' && vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    environment: corpus-ingest
    # The PFA crawl is rate-limited to one request per 3s or slower.
    timeout-minutes: ${{ inputs.source == 'pfa' && 720 || 180 }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Resolve arguments
        id: args
        env:
          SOURCE: ${{ inputs.source }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          case "$SOURCE" in
            nflverse)   command=ingest-nflverse-football; bucket=legacy-sports-dev-football-corpus ;;
            retrosheet) command=ingest-retrosheet;        bucket=legacy-sports-dev-retrosheet-corpus ;;
            pfa)        command=ingest-pfa-football;      bucket=legacy-sports-dev-football-corpus ;;
            *) echo "::error::Unknown source: $SOURCE"; exit 1 ;;
          esac

          args="--bucket $bucket"
          for pair in "from:$FROM" "to:$TO"; do
            name="${pair%%:*}"; value="${pair#*:}"
            [ -z "$value" ] && continue
            if ! [[ "$value" =~ ^[0-9]{4}$ ]]; then
              echo "::error::Input '$name' must be a 4-digit year, got: $value"
              exit 1
            fi
            args="$args --$name $value"
          done
          [ "$FORCE" = "true" ] && args="$args --force"
          [ "$DRY_RUN" = "true" ] && args="$args --dry-run"

          {
            echo "command=$command"
            echo "bucket=$bucket"
            echo "args=$args"
          } >> "$GITHUB_OUTPUT"
          echo "Will run: ls-cli.sh $command $args"

      # Fail before any setup when the pfa runner is wrong, so the run says
      # what to fix instead of timing out on a DB connection.
      - name: Check PFA runner
        if: inputs.source == 'pfa'
        env:
          RUNNER_ENV: ${{ runner.environment }}
        run: |
          if [ "$RUNNER_ENV" != "self-hosted" ]; then
            runbook=".agents/skills/dev-environment/references/cli-commands.md#pfa-corpus-ingest"
            echo "::error::source=pfa needs a self-hosted runner (vars.CI_RUNNER_LABEL) to reach the private dev RDS; got a $RUNNER_ENV runner. See $runbook"
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: 22
          set-nx-shas: false
          include-optional-deps: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ env.CORPUS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The CLI's --dry-run never touches S3, so probe the bucket explicitly:
      # a dry run then proves the role can list and read the target corpus too.
      - name: Probe corpus bucket access
        env:
          BUCKET: ${{ steps.args.outputs.bucket }}
        run: |
          # JSON + jq rather than --output text: with --max-items the CLI also
          # emits a NextToken, which text output can splice into the key.
          listing=$(aws s3api list-objects-v2 --bucket "$BUCKET" --max-items 1 --output json)
          echo "ListBucket on s3://$BUCKET: OK"
          key=$(jq -r '.Contents[0].Key // empty' <<< "$listing")
          if [ -n "$key" ]; then
            aws s3api head-object --bucket "$BUCKET" --key "$key" > /dev/null
            echo "GetObject (head) on s3://$BUCKET/$key: OK"
          else
            echo "Bucket is empty; skipped the object read probe"
          fi

      # pfa only: the CLI resolves its DB credentials from Secrets Manager via
      # DB_SECRET_NAME. Only the secret's name passes through the workflow.
      - name: Resolve crosswalk DB secret name
        id: db-secret
        if: inputs.source == 'pfa'
        run: |
          name=$(aws ssm get-parameter --name "$CROSSWALK_DB_SECRET_PARAM" \
            --query Parameter.Value --output text)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Crosswalk DB secret: $name"

      # pfa only: the CLI validates the RDS certificate (rejectUnauthorized),
      # and the RDS CA chain is not in Node's built-in store.
      - name: Install AWS RDS CA bundle
        id: rds-ca
        if: inputs.source == 'pfa'
        run: |
          curl -sSf https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem \
            -o "$RUNNER_TEMP/rds-global-bundle.pem"
          echo "ca_bundle=$RUNNER_TEMP/rds-global-bundle.pem" >> "$GITHUB_OUTPUT"

      - name: Run ingest
        env:
          COMMAND: ${{ steps.args.outputs.command }}
          ARGS: ${{ steps.args.outputs.args }}
          # Empty for nflverse/retrosheet, which never touch the DB.
          DB_SECRET_NAME: ${{ steps.db-secret.outputs.name }}
          NODE_EXTRA_CA_CERTS: ${{ steps.rds-ca.outputs.ca_bundle }}
        run: |
          set -o pipefail
          read -r -a argv <<< "$ARGS"
          bash ./ls-cli.sh "$COMMAND" "${argv[@]}" 2>&1 | tee "$RUNNER_TEMP/ingest.log"
          # Defense in depth: lib/logging's global handlers now exit non-zero on
          # an uncaught crash (LS-10565), but still require the command's own
          # completion line so a run that ends early without throwing fails too.
          if ! grep -q 'Ingest complete:' "$RUNNER_TEMP/ingest.log"; then
            echo "::error::The CLI exited without logging 'Ingest complete:'; treating the run as failed"
            exit 1
          fi

      - name: Write job summary
        if: always()
        env:
          SOURCE: ${{ inputs.source }}
          COMMAND: ${{ steps.args.outputs.command }}
          ARGS: ${{ steps.args.outputs.args }}
        run: |
          log="$RUNNER_TEMP/ingest.log"
          {
            echo "## Corpus ingest: $SOURCE"
            echo
            echo "\`ls-cli.sh $COMMAND $ARGS\`"
            echo
            if [ -f "$log" ]; then
              echo '```'
              grep -oE '(PFA ingest: crosswalk resolved.*|Season [0-9]{4}:.*|Ingest complete:.*)' "$log" || echo "(no per-season lines; see the Run ingest step log)"
              echo '```'
            else
              echo "Ingest did not run; see the earlier step logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
