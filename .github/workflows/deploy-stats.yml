name: Deploy Stats Lambda

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lambdas/stats-lambda/**"
      - ".github/workflows/deploy-stats.yml"

# Cancel in-progress deployments for the same workflow
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  AWS_SERVICE_NAME: legacy-sports-stats
  AWS_STAGE: dev

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy Stats Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true

      - name: Validate Deployment Readiness
        uses: ./.github/actions/deployment-gate
        with:
          artifacts-ready: 'true'
          quality-passed: 'true'
          required-components: ''
          environment: 'production'

      - name: "☁️ Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::176661590736:role/legacy-sports-dev-github-actions
          role-session-name: GitHubActions-DeployStats
          aws-region: ${{ env.AWS_REGION }}

      - name: Build Stats Lambda
        run: |
          echo "🚀 Building Stats Lambda specifically..."
          echo "::notice::Building only stats-lambda project for targeted deployment"
          
          # Build only the stats-lambda and its dependencies
          if npx nx build stats-lambda --verbose 2>&1 | tee build.log; then
            echo "✅ Stats Lambda built successfully"
            
            # Verify build artifacts exist
            if [ -f "lambdas/stats-lambda/dist/index.js" ]; then
              echo "✅ Build artifacts verified: lambdas/stats-lambda/dist/index.js"
              BUILD_SIZE=$(du -sh lambdas/stats-lambda/dist/index.js | cut -f1)
              echo "📊 Stats Lambda bundle size: $BUILD_SIZE"
            else
              echo "❌ Build artifacts missing: lambdas/stats-lambda/dist/index.js"
              exit 1
            fi
            
            echo "## 🚀 Stats Lambda Build Summary" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
            echo "- **Project**: stats-lambda" >> $GITHUB_STEP_SUMMARY
            echo "- **Bundle Size**: $BUILD_SIZE" >> $GITHUB_STEP_SUMMARY
            echo "- **Output**: lambdas/stats-lambda/dist/" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Stats Lambda build failed"
            echo "## ❌ Build Errors" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            tail -20 build.log >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Package and Deploy Stats Lambda
        working-directory: lambdas/stats-lambda
        run: |
          # Create version string
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          COMMIT_SHA=$(echo $GITHUB_SHA | cut -c1-8)
          VERSION="${TIMESTAMP}-${COMMIT_SHA}"

          # Create deployment package from built artifacts
          zip -r "stats-${VERSION}.zip" dist/

          # Get S3 bucket name from SSM parameter store
          echo "🔍 Getting S3 bucket name from SSM..."
          if S3_BUCKET=$(aws ssm get-parameter --name "/legacy-sports/${AWS_STAGE}/s3/lambda-deployments-bucket" --query "Parameter.Value" --output text --region ${{ env.AWS_REGION }} 2>/dev/null); then
            echo "✅ Found S3 bucket from SSM: $S3_BUCKET"
          else
            echo "⚠️ SSM parameter not found, using default bucket name"
            S3_BUCKET="legacy-sports-dev-lambdas-cca20ad9"
          fi

          # Upload to S3
          aws s3 cp "stats-${VERSION}.zip" "s3://${S3_BUCKET}/stats/" --region ${{ env.AWS_REGION }}

          # Update SSM parameter
          aws ssm put-parameter \
            --name "/legacy-sports/${AWS_STAGE}/lambda/stats/version" \
            --value "$VERSION" \
            --overwrite \
            --region ${{ env.AWS_REGION }}

          echo "✅ Lambda package uploaded: stats-${VERSION}.zip"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "S3_BUCKET=${S3_BUCKET}" >> $GITHUB_ENV

      - name: "🚀 Update Lambda Function"
        working-directory: lambdas/stats-lambda
        run: |
          echo "🚀 Updating Stats Lambda function code..."
          
          # Get the Lambda function name (legacy-sports-dev-stats)
          LAMBDA_FUNCTION_NAME="legacy-sports-${AWS_STAGE}-stats"
          echo "🎯 Target Lambda function: $LAMBDA_FUNCTION_NAME"
          
          # Update Lambda function code using the uploaded S3 package
          echo "📦 Updating Lambda function code from S3..."
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --s3-bucket "$S3_BUCKET" \
            --s3-key "stats/stats-${VERSION}.zip" \
            --region ${{ env.AWS_REGION }}
          
          # Wait for the update to complete
          echo "⏳ Waiting for function update to complete..."
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --region ${{ env.AWS_REGION }}
          
          # Get the updated function info
          FUNCTION_INFO=$(aws lambda get-function --function-name "$LAMBDA_FUNCTION_NAME" --region ${{ env.AWS_REGION }})
          FUNCTION_VERSION=$(echo "$FUNCTION_INFO" | jq -r '.Configuration.Version')
          FUNCTION_SIZE=$(echo "$FUNCTION_INFO" | jq -r '.Configuration.CodeSize')
          
          echo "✅ Stats Lambda updated successfully!"
          echo "   Function: $LAMBDA_FUNCTION_NAME"
          echo "   Version: $FUNCTION_VERSION"
          echo "   Code Size: $FUNCTION_SIZE bytes"
          
          echo "## 🚀 Lambda Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Function**: $LAMBDA_FUNCTION_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $FUNCTION_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Package**: stats-${VERSION}.zip" >> $GITHUB_STEP_SUMMARY
          echo "- **Code Size**: $FUNCTION_SIZE bytes" >> $GITHUB_STEP_SUMMARY

      - name: Update Deployment Badge
        if: always()
        uses: ./.github/actions/update-deployment-badge
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          gist-id: ${{ secrets.CI_BADGES_GIST_ID }}
          deployment-name: "Stats Lambda"
          deployment-status: ${{ job.status }}
          workflow-run-id: ${{ github.run_id }}
          branch: ${{ github.ref_name }}
