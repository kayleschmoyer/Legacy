name: Integration Build

# This workflow runs integration builds on main branch to ensure the full repository is always passing
# It runs ALL projects (not just affected) to catch integration issues after merges
# For pull request validation, see pr-validation.yml
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps/**
      - lambdas/**
      - lib/**
      - package-lock.json
      - poetry.lock

# Cancel in-progress runs for the same workflow on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  # Nx Cloud access token for enhanced CI features (set as GitHub secret)
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  # Base Nx configuration (cloud-specific settings will be set conditionally based on availability test)
  NX_DAEMON: false
  NX_CLOUD_TIMEOUT: 300000
  # Default settings for local execution (will be overridden if cloud is available)
  NX_PARALLEL: 2
  NX_CLOUD_DISTRIBUTED_EXECUTION: false

jobs:
  integration-build:
    name: Integration Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: true

      - name: Configure Nx Cloud
        id: nx-cloud
        uses: ./.github/actions/configure-nx-cloud
        with:
          agent-count: "6"
          local-parallel: "3"
          workflow-type: "integration-build"
          nx-cloud-access-token-candidate: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

      - name: Validate Workspace
        uses: ./.github/actions/validate-workspace

      - name: Show Build Plan
        run: |
          echo "🏗️ Integration build validates the ENTIRE repository (not just affected projects)"
          echo ""
          echo "📋 Final Execution Mode:"
          if [ "${NX_LOCAL_FALLBACK}" = "true" ]; then
            echo "  🔧 LOCAL FALLBACK MODE"
            echo "  💡 Nx Cloud unavailable (quota exceeded or connection failed)"
            echo "  💡 Build will run locally with higher parallelism for integration"
          elif [ "${NX_CLOUD_DISTRIBUTED_EXECUTION}" = "true" ]; then
            echo "  🚀 NX CLOUD DISTRIBUTED MODE"
            echo "  💡 Build will use Nx Cloud distributed execution with ${NX_CLOUD_DISTRIBUTED_EXECUTION_AGENT_COUNT:-6} agents"
          else
            echo "  🔧 LOCAL MODE"
            echo "  💡 Standard local execution"
          fi
          echo "  Parallel: ${NX_PARALLEL:-4}"
          echo "  Cloud ID: ${NX_CLOUD_ID:-not set}"
          echo ""
          echo "All projects in workspace:"
          npx nx show projects
          echo ""
          echo "Build dependency graph for all projects:"
          npx nx run-many -t build --dry-run
          echo ""

      - name: Lint, Test & Build All
        uses: ./.github/actions/nx-tasks
        with:
          tasks: "lint test build"
          scope: "all"
          parallel: "4"
          verbose: "false"

      # Enable Nx Cloud Self-Healing CI (only when Nx Cloud is available)
      - name: Auto-Fix CI Issues
        run: |
          echo "🔧 Running Nx Cloud self-healing..."
          if [ "${NX_LOCAL_FALLBACK}" != "true" ] && [ -n "${NX_CLOUD_ACCESS_TOKEN}" ]; then
            npx nx-cloud fix-ci || echo "⚠️  Nx Cloud fix-ci failed but continuing"
          else
            echo "ℹ️  Nx Cloud not available, skipping fix-ci"
          fi
        if: always()

      - name: Integration Build Summary
        if: always()
        run: |
          echo "📊 Integration Build Summary"
          echo "=========================="
          if [ "${NX_LOCAL_FALLBACK}" = "true" ]; then
            echo "✅ Build completed in LOCAL FALLBACK mode (Nx Cloud unavailable)"
            echo "💡 This is expected when Nx Cloud quota is exceeded or service is unavailable"
          elif [ "${NX_CLOUD_DISTRIBUTED_EXECUTION}" = "true" ]; then
            echo "✅ Build completed in NX CLOUD DISTRIBUTED mode"
          else
            echo "✅ Build completed in LOCAL mode"
          fi
