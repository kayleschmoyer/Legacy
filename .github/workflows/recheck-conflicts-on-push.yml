name: "Recheck Conflicts on Main Push"

# When a commit lands on main, re-run the conflict check for every open PR so
# that Claude sessions watching those PRs receive a failure signal and can
# rebase automatically. Without this, a PR's conflict check only re-runs when
# the PR itself is updated — conflicts introduced by upstream changes go
# undetected until the next PR push.

on:
  push:
    branches: [main]

permissions:
  actions: write
  pull-requests: read

jobs:
  fan-out:
    name: "Dispatch conflict checks for open PRs"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch check-conflicts for each open PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            // Paginate through all open PRs — repos with >100 open PRs would otherwise
            // silently skip PRs beyond the first page.
            let allPrs = [];
            let page = 1;
            while (true) {
              const { data: prs } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                per_page: 100,
                page,
              });
              allPrs = allPrs.concat(prs);
              if (prs.length < 100) break;
              page++;
            }

            core.info(`Found ${allPrs.length} open PR(s); dispatching conflict checks.`);

            for (const pr of allPrs) {
              core.info(`Dispatching check-conflicts for PR #${pr.number} (${pr.title})`);
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'check-conflicts.yml',
                // Dispatch from the PR's head branch so the resulting check run is
                // associated with the PR's head SHA — not main's HEAD. Without this,
                // the failing check run is invisible to the PR's check suite and CI
                // monitoring tools never see the conflict failure.
                ref: pr.head.ref,
                inputs: { pr_number: String(pr.number) },
              });
            }
