name: "Jira Link Check"

# =============================================================================
# Validates the declared jira-link marker on every PR (LS-7896, phase 3 of
# RFC docs/rfcs/draft-declared-ticket-linkage.md).
#
# The marker (emitted by github_open_pr and the PR-creation skills since
# LS-7895) is the single source of truth for "which ticket is this PR for?":
#
#   <!-- jira-link
#   primary: LS-1234
#   -->
#
# Assertions (see .github/scripts/jira-link-check.mjs):
#   - exactly one marker with exactly one `primary:` (LS-#### or `none`),
#   - `primary: none` requires the `no-jira` label (visible opt-out),
#   - the primary key appears in the PR title,
#   - the primary ticket exists in Jira (single GET — kills the
#     404-after-merge failure class in jira-branch-sync).
#
# SELF-REPAIR (LS-9463 class): the marker is an HTML comment, and every GitHub
# MCP read path strips HTML comments out of a PR body — so an agent can neither
# see the marker nor preserve it through a read-modify-write body edit. When
# validation fails on structure alone and the PR title carries exactly one
# ticket key, the check rewrites the body with a well-formed marker (the same
# title fallback github_open_pr uses) and passes, rather than failing a PR whose
# linkage was never in doubt. A declaration that disagrees with the title, and a
# deliberate `primary: none`, are left for the author. The rewrite uses
# GITHUB_TOKEN, whose events do not re-trigger workflows, so it cannot loop.
#
# Failure output includes a copy-pasteable marker block; fix by editing the
# PR body — no push needed.
#
# STAGED DEPLOYMENT (per the ticket): runs non-required for ~3 days of agent
# PR volume, then the repo owner adds the "Jira Link Check" context to
# .github/ruleset.json and runs scripts/apply-ruleset.sh (adding it to
# ruleset.json before applying intentionally shows Check Ruleset Drift red).
#
# Triggers include `synchronize` and `ready_for_review` in addition to the
# body/title-relevant events: required status checks are recorded per head
# SHA, so a check that does not re-run on push would leave every new commit
# stuck at "Expected" once this becomes required (the same failure class
# required-checks-lint guards against). `labeled`/`unlabeled` are included so
# adding the `no-jira` label re-runs the check for `primary: none` PRs —
# otherwise a failed opt-out PR has no way to go green without a body edit.
#
# Authentication: JIRA_CREDENTIALS secret (same JSON object as
# jira-branch-sync.yml). Absent on fork PRs — the script then skips the
# Jira existence GET with a warning; structural validation still applies.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review, labeled, unlabeled]

concurrency:
  group: jira-link-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # LS-1652: Restrict self-hosted runners to PR authors with write permission
  check-runner-access:
    name: "Resolve Runner Label"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner-label: ${{ steps.resolve.outputs.runner-label }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          sparse-checkout: .github/actions/resolve-runner-label
      - name: Generate App Token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: 3158619
          private-key: ${{ secrets.AGENT_AUTHOR_APP_PRIVATE_KEY }}
      - name: Resolve Runner Label
        id: resolve
        uses: ./.github/actions/resolve-runner-label
        with:
          runner-label: ${{ vars.CI_RUNNER_LABEL }}
          github-token: ${{ steps.app-token.outputs.token || github.token }}

  jira-link-check:
    name: "Jira Link Check"
    needs: [check-runner-access]
    # Dependabot PRs have no Jira ticket and cannot carry the marker; skip the
    # job. A skipped job reports as passing for required status checks.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ${{ needs.check-runner-access.outputs.runner-label }}
    timeout-minutes: 5
    # Job-level block replaces the workflow-level `contents: read` wholesale —
    # both scopes have to be listed. `pull-requests: write` is what lets the
    # self-repair step PATCH the body; fork PRs get a read-only token from the
    # `pull_request` trigger regardless, and simply fail as before.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Validate jira-link marker
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JIRA_CREDENTIALS: ${{ secrets.JIRA_CREDENTIALS }}
        run: node .github/scripts/jira-link-check.mjs
