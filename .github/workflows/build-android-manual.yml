name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: false
        type: boolean
      build_type:
        description: 'Build Type'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug

# Cancel in-progress builds for the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.build_type }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NPM and Dependencies
        uses: ./.github/workflows/setup-npm

      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradlew Executable
        run: chmod +x apps/app/android/gradlew

      - name: Build Android APK
        run: |
          cd apps/app/android
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi
        env:
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=512m

      - name: Extract Version Info
        id: version
        run: |
          VERSION=$(node -p "require('./apps/app/package.json').version")
          COMMIT_SHA=${GITHUB_SHA:0:7}
          BUILD_NUMBER=$(date +%Y%m%d_%H%M%S)
          BUILD_TYPE="${{ inputs.build_type }}"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          echo "artifact_name=legacy-sports-${BUILD_TYPE}-v${VERSION}-${BUILD_NUMBER}-${COMMIT_SHA}" >> $GITHUB_OUTPUT

      - name: Rename APK with Version
        run: |
          cd apps/app/android/app/build/outputs/apk/${{ inputs.build_type }}
          mv app-${{ inputs.build_type }}.apk ${{ steps.version.outputs.artifact_name }}.apk

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: apps/app/android/app/build/outputs/apk/${{ inputs.build_type }}/${{ steps.version.outputs.artifact_name }}.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create Release (Optional)
        if: inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-manual-${{ steps.version.outputs.build_type }}-v${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_number }}
          name: Android APK (${{ steps.version.outputs.build_type }}) v${{ steps.version.outputs.version }}
          body: |
            ## Manual Android APK Build

            **Version:** ${{ steps.version.outputs.version }}  
            **Build Type:** ${{ steps.version.outputs.build_type }}  
            **Build Number:** ${{ steps.version.outputs.build_number }}  
            **Commit:** ${{ steps.version.outputs.commit_sha }}  

            This APK was built manually via GitHub Actions workflow dispatch.
          files: apps/app/android/app/build/outputs/apk/${{ inputs.build_type }}/${{ steps.version.outputs.artifact_name }}.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        run: |
          echo "## 🔧 Manual Android APK Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build Type:** ${{ steps.version.outputs.build_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build Number:** ${{ steps.version.outputs.build_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ steps.version.outputs.commit_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Create Release:** ${{ inputs.create_release }}" >> $GITHUB_STEP_SUMMARY
