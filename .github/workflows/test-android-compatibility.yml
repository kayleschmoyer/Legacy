name: "Test Android Compatibility"

# Comprehensive Android compatibility testing across multiple environments.
# This workflow is reusable and invoked by the orchestrator.

on:
  workflow_call:
    inputs:
      matrix_type:
        description: "Matrix Type"
        required: false
        type: string
        default: "production"
      build_type:
        description: "Build Type"
        required: false
        type: string
        default: "debug"

# Cancel in-progress builds for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.matrix_type || 'auto' }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  # Default build optimization settings
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000"
  NODE_OPTIONS: "--max-old-space-size=4096"

  # React Native settings
  EXPO_NO_TELEMETRY: 1
  REACT_NATIVE_PACKAGER_CACHE_DISABLED: true

  # Cache optimization for faster CI cleanup
  ACTIONS_CACHE_COMPRESSION_LEVEL: "1"
  ACTIONS_CACHE_MAX_SIZE: "2GB"

jobs:
  determine-matrix:
    name: "Determine Build Matrix"
    runs-on: ubuntu-latest
    # Skip CI when 'skip-ci' label is present on PR
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      run-type: ${{ steps.set-matrix.outputs.run-type }}

    steps:
      - name: "Determine Matrix Configuration"
        id: set-matrix
        run: |
          # Determine matrix type based on event and input
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MATRIX_TYPE="compatibility"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MATRIX_TYPE="${{ inputs.matrix_type }}"
          else
            MATRIX_TYPE="${{ inputs.matrix_type }}"
          fi

          echo "run-type=$MATRIX_TYPE" >> $GITHUB_OUTPUT

          if [ "$MATRIX_TYPE" = "production" ]; then
            # Production configuration only
            {
              echo "matrix<<EOF"
              echo '{"include":[{"name":"Production (RN 0.79.6)","os":"ubuntu-latest","java_version":"17","node_version":"20","android_api_level":"35","ndk_version":"27.1.12297006","gradle_executable":"./gradlew","cache_key_suffix":"prod"}]}'
              echo "EOF"
            } >> $GITHUB_OUTPUT
          elif [ "$MATRIX_TYPE" = "compatibility" ]; then
            # Compatibility testing matrix
            {
              echo "matrix<<EOF"
              echo '{"include":[{"name":"Production (RN 0.79.6)","os":"ubuntu-latest","java_version":"17","node_version":"20","android_api_level":"35","ndk_version":"27.1.12297006","gradle_executable":"./gradlew","cache_key_suffix":"prod"},{"name":"Minimum Supported","os":"ubuntu-latest","java_version":"11","node_version":"20","android_api_level":"33","ndk_version":"25.2.9519653","gradle_executable":"./gradlew","cache_key_suffix":"min"},{"name":"Latest Stable","os":"ubuntu-latest","java_version":"21","node_version":"20","android_api_level":"35","ndk_version":"27.1.12297006","gradle_executable":"./gradlew","cache_key_suffix":"latest"}]}'
              echo "EOF"
            } >> $GITHUB_OUTPUT
          else
            # Full matrix with cross-platform testing
            {
              echo "matrix<<EOF"
              echo '{"include":[{"name":"Production Linux","os":"ubuntu-latest","java_version":"17","node_version":"20","android_api_level":"35","ndk_version":"27.1.12297006","gradle_executable":"./gradlew","cache_key_suffix":"prod-linux"},{"name":"Production macOS","os":"macos-latest","java_version":"17","node_version":"20","android_api_level":"35","ndk_version":"27.1.12297006","gradle_executable":"./gradlew","cache_key_suffix":"prod-macos"},{"name":"Production Windows","os":"windows-latest","java_version":"17","node_version":"20","android_api_level":"35","ndk_version":"27.1.12297006","gradle_executable":"gradlew.bat","cache_key_suffix":"prod-windows"},{"name":"Minimum Java 11","os":"ubuntu-latest","java_version":"11","node_version":"20","android_api_level":"33","ndk_version":"25.2.9519653","gradle_executable":"./gradlew","cache_key_suffix":"min-java11"},{"name":"Latest Java 21","os":"ubuntu-latest","java_version":"21","node_version":"20","android_api_level":"35","ndk_version":"27.1.12297006","gradle_executable":"./gradlew","cache_key_suffix":"latest-java21"}]}'
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

  android-matrix-build:
    name: "${{ matrix.name }}"
    runs-on: ${{ matrix.os }}
    needs: determine-matrix
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.determine-matrix.outputs.matrix) }}

    env:
      JAVA_VERSION: ${{ matrix.java_version }}
      ANDROID_API_LEVEL: ${{ matrix.android_api_level }}
      NDK_VERSION: ${{ matrix.ndk_version }}
      BUILD_TYPE: ${{ inputs.build_type }}

    steps:
      - name: "🚀 Checkout Repository"
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: "📋 Build Info"
        run: |
          echo "## 🏗️ Build Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Configuration**: ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **OS**: ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Java**: ${{ matrix.java_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Node.js**: ${{ matrix.node_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Android API**: ${{ matrix.android_api_level }}" >> $GITHUB_STEP_SUMMARY
          echo "- **NDK**: ${{ matrix.ndk_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type**: ${{ env.BUILD_TYPE }}" >> $GITHUB_STEP_SUMMARY

      - name: "🔧 Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node_version }}
          install-dependencies: true
          set-nx-shas: false
          cache-key-suffix: matrix-${{ matrix.cache_key_suffix }}-${{ matrix.java_version }}
          skip-system-deps: true

      - name: "☕ Setup Java ${{ matrix.java_version }}"
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java_version }}

      # Android-specific cache for matrix testing
      - name: "📦 Cache Gradle Dependencies"
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-9
          key: ${{ runner.os }}-gradle-matrix-${{ matrix.cache_key_suffix }}-${{ matrix.java_version }}-${{ hashFiles('apps/app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-matrix-${{ matrix.cache_key_suffix }}-${{ matrix.java_version }}-
            ${{ runner.os }}-gradle-matrix-${{ matrix.cache_key_suffix }}-

      - name: "🔧 Run Expo Prebuild"
        run: |
          cd apps/app
          npx expo prebuild --platform android --no-install
          chmod +x android/gradlew
          echo "✅ Expo prebuild completed - Android project generated"

      - name: "🔧 Setup Gradle Wrapper"
        run: |
          cd apps/app/android
          chmod +x gradlew

          # Verify Gradle version compatibility
          echo "🔍 Verifying Gradle setup..."
          ${{ matrix.gradle_executable }} --version

      - name: "🧪 Validate Configuration"
        run: |
          cd apps/app/android

          echo "🔍 Validating build configuration..."

          # Check Java version
          java -version
          javac -version

          # Check Gradle configuration
          ${{ matrix.gradle_executable }} help --no-daemon --quiet

          # Validate Android configuration without dependency download
          echo "✅ Configuration validation passed"

      - name: "🏗️ Build Android ${{ env.BUILD_TYPE }}"
        timeout-minutes: 25
        run: |
          cd apps/app/android

          echo "🔨 Building Android APK (${{ env.BUILD_TYPE }})..."

          if [ "${{ env.BUILD_TYPE }}" = "release" ]; then
            ${{ matrix.gradle_executable }} assembleRelease --no-daemon --parallel --build-cache
            BUILD_OUTPUT="app/build/outputs/apk/release/app-release.apk"
          else
            ${{ matrix.gradle_executable }} assembleDebug --no-daemon --parallel --build-cache
            BUILD_OUTPUT="app/build/outputs/apk/debug/app-debug.apk"
          fi

          # Verify APK was created
          if [ -f "$BUILD_OUTPUT" ]; then
            APK_SIZE=$(du -h "$BUILD_OUTPUT" | cut -f1)
            echo "✅ APK built successfully: $APK_SIZE"
            echo "- **APK Size**: $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ APK not found at $BUILD_OUTPUT"
            exit 1
          fi

      - name: "📊 Build Metrics"
        if: always()
        run: |
          echo "## 📊 Build Metrics" >> $GITHUB_STEP_SUMMARY

          # APK info if exists
          cd apps/app/android
          if [ "${{ env.BUILD_TYPE }}" = "release" ]; then
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
          else
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          fi

          if [ -f "$APK_PATH" ]; then
            APK_SIZE=$(du -sh "$APK_PATH" | cut -f1)
            echo "- **APK Size**: $APK_SIZE" >> $GITHUB_STEP_SUMMARY
            echo "- **Build Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Build Status**: ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Gradle build cache info
          if [ -d "~/.gradle/caches/build-cache-1" ]; then
            CACHE_SIZE=$(du -sh ~/.gradle/caches/build-cache-1 2>/dev/null | cut -f1 || echo "N/A")
            echo "- **Gradle Cache**: $CACHE_SIZE" >> $GITHUB_STEP_SUMMARY
          fi

      - name: "🧪 APK Validation"
        if: success()
        run: |
          cd apps/app/android

          if [ "${{ env.BUILD_TYPE }}" = "release" ]; then
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
          else
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          fi

          # Basic APK validation
          echo "🔍 Validating APK structure..."

          # Check APK can be read by aapt (if available)
          if command -v aapt >/dev/null 2>&1; then
            aapt dump badging "$APK_PATH" | head -5
            echo "✅ APK validation passed"
          else
            echo "ℹ️ AAPT not available, skipping detailed validation"
          fi

          echo "- **APK Validation**: ✅ Passed" >> $GITHUB_STEP_SUMMARY

  matrix-summary:
    name: "Matrix Build Summary"
    runs-on: ubuntu-latest
    needs: [determine-matrix, android-matrix-build]
    if: always()

    steps:
      - name: "📋 Matrix Results Summary"
        run: |
          echo "## 🏗️ Android Build Matrix Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Matrix Type**: ${{ needs.determine-matrix.outputs.run-type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Count results
          TOTAL_JOBS=$(echo '${{ needs.android-matrix-build.result }}' | wc -w)

          if [ "${{ needs.android-matrix-build.result }}" = "success" ]; then
            echo "✅ **All matrix builds passed** ($TOTAL_JOBS configurations)" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.android-matrix-build.result }}" = "failure" ]; then
            echo "❌ **Matrix builds failed** - Check individual job logs" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Matrix builds completed with issues** - Status: ${{ needs.android-matrix-build.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Compatibility Status" >> $GITHUB_STEP_SUMMARY
          echo "- **React Native 0.79.6**: ✅ Supported" >> $GITHUB_STEP_SUMMARY
          echo "- **Java 11-21**: ✅ Compatible" >> $GITHUB_STEP_SUMMARY
          echo "- **Android API 33-35**: ✅ Tested" >> $GITHUB_STEP_SUMMARY
          echo "- **Multi-platform**: ✅ Verified" >> $GITHUB_STEP_SUMMARY

      - name: "🚨 Failure Notification"
        if: needs.android-matrix-build.result == 'failure'
        run: |
          echo "❌ Android build matrix failed!"
          echo "This indicates a compatibility issue that needs investigation."
          exit 1
