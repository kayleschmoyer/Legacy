name: Validate Dependabot Updates

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Only run for dependabot PRs
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  validate-dependencies:
    name: Validate Dependency Updates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run for dependabot PRs
    if: github.actor == 'dependabot[bot]'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check for Peer Dependency Conflicts
        id: peer-check
        run: |
          echo "Checking for peer dependency conflicts..."
          
          # Try npm install without legacy-peer-deps first
          if npm install --dry-run 2>/dev/null; then
            echo "✅ No peer dependency conflicts detected"
            echo "peer_conflicts=false" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Peer dependency conflicts detected"
            echo "peer_conflicts=true" >> $GITHUB_OUTPUT
            
            # Show the conflicts
            echo "## Peer Dependency Conflicts" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            npm install --dry-run 2>&1 | head -50 >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Install with Legacy Peer Deps
        if: steps.peer-check.outputs.peer_conflicts == 'true'
        run: |
          echo "Installing with --legacy-peer-deps to check if it resolves conflicts..."
          npm ci --legacy-peer-deps

      - name: Run Basic Tests
        run: |
          echo "Running basic validation tests..."
          # Check that core commands work
          npx nx --version
          npm list --depth=0 || echo "Some packages have issues but installation succeeded"

      - name: Validate TypeScript ESLint Compatibility
        if: contains(github.event.pull_request.title, 'typescript-eslint') || contains(github.event.pull_request.title, 'eslint')
        run: |
          echo "Validating TypeScript ESLint configuration..."
          npx eslint --version
          npx eslint --print-config package.json > /dev/null || echo "ESLint config validation failed"

      - name: Check for Breaking Changes
        run: |
          echo "Checking for potential breaking changes..."
          
          # Check if any major version updates are included
          git diff HEAD~1 package.json | grep -E '^\+.*".*":\s*"\^?[0-9]+\.' | while read line; do
            echo "Detected version change: $line"
          done

      - name: Post PR Comment
        if: steps.peer-check.outputs.peer_conflicts == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Peer Dependency Validation')
            );
            
            const commentBody = `## 🔍 Peer Dependency Validation
            
            ⚠️ **Peer dependency conflicts detected** in this update.
            
            This update requires \`--legacy-peer-deps\` to install successfully. While this may work, it could indicate:
            
            - Version mismatches between related packages
            - Potentially incompatible dependency combinations
            - Need for manual testing of affected functionality
            
            **Recommendation:** Test thoroughly, especially:
            - ESLint/TypeScript functionality if ESLint packages are involved
            - React/React Native functionality if React packages are involved  
            - Build processes and core app functionality
            
            **Auto-generated by Dependabot validation workflow**`;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }

  auto-approve-safe-updates:
    name: Auto-approve Safe Updates
    runs-on: ubuntu-latest
    needs: validate-dependencies
    # Only auto-approve if it's a minor/patch update from dependabot
    if: |
      github.actor == 'dependabot[bot]' && 
      (contains(github.event.pull_request.title, 'patch') || contains(github.event.pull_request.title, 'minor'))
    
    steps:
      - name: Check Validation Results
        run: |
          echo "Dependency validation completed"
          echo "This is a safe update that can be auto-approved"

      - name: Approve PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              event: 'APPROVE',
              body: '✅ Auto-approved: Safe dependency update validated by automated checks.'
            });
