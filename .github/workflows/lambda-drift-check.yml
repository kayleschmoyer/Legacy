name: "Lambda Drift Check"

# =============================================================================
# Event-driven auditor for silent Lambda deploy staleness (LS-8434, follow-up
# from LS-8426).
#
# LS-8426: the mcp-rollbar-server Lambda ran pre-fix code for 12 days because
# the Deploy run for its merge commit failed at `Upload Lambdas / Verify CI
# Status` ~7s in, which skip-chained the entire Detect/Build/Upload matrix.
# Nothing retried it, and since `nx affected` only rebuilds projects changed
# since NX_BASE, a lambda whose only recent change collided with that race
# stayed silently stale with no signal until someone hit the bug in prod.
#
# The existing Post-Apply Version Verification step in
# lambda-terraform-apply.yml only runs when `terraform apply` actually made a
# change — so it never fires when the apply is a no-op. This workflow instead
# audits ALL registered lambdas after every Apply Lambda Infrastructure run
# completes (success or failure — a failed deploy chain is exactly when a
# skip-chain leaves a lambda stale), so persistent drift is re-detected on
# every merge to main.
#
# Trigger note (schedule-free CI policy): the former daily cron was removed.
# The workflow_run trigger gives equal-or-better detection latency on active
# days (multiple merges/day); on a fully idle repo nothing deploys, nothing
# changes, and there is nothing new to drift — out-of-band console edits on an
# idle week are caught by the next Deploy or an on-demand workflow_dispatch.
#
# Two independent signals:
#   1. Version drift — for every registered lambda, compare the SSM
#      `/legacy-sports/<stage>/lambda/<name>/version` parameter against the
#      `Description` field Terraform now stamps on the live function
#      (terraform/main/lambda-*.tf + websocket.tf all set
#      `description = <ssm version data source>.value` as of LS-8434).
#   2. Skip-chain detection — scans recent "Deploy" workflow runs for a
#      `Verify CI Status` job failure, which is the specific gate whose
#      failure caused the LS-8426 incident.
#
# Both alert to Discord. Signal 1 (version drift) is no longer purely
# read-only as of LS-8490 below; Signal 2 (skip-chain detection) remains
# read-only.
# LS-7933: version-drift below now also tracks how long each SSM `/version`
# parameter has been mismatched against its deployed Description
# (Parameter.LastModifiedDate) and only alerts + fails the job once that
# exceeds vars.LAMBDA_FRESHNESS_THRESHOLD_HOURS (repo var, default 2 —
# ships hardcoded per LS-7933's Out of Scope: adding the repo var itself is
# an admin action, not required for this to work). This absorbs LS-7933's
# "stuck (uploaded-but-unapplied) Lambda artifact" alert requirement rather
# than adding a second, near-duplicate workflow: this job already performs
# the identical SSM-vs-deployed-Description comparison, on the same
# workflow_run trigger, with the same read-only plan role and the same
# Discord channel that ticket's technical approach called for. The
# threshold also doubles as a false-positive guard for the expected
# Upload-Lambdas-vs-Apply race already documented in
# lambda-terraform-apply.yml's Post-Apply Version Verification step: a
# mismatch caused by a concurrent SSM bump seconds ago will self-heal on the
# next Apply run before it clears the threshold.
#
# LS-8490: closes the loop on Signal 1. The version-drift job's Discord alert
# used to end at "Fix: redeploy via workflow_dispatch on upload-lambdas.yml"
# — a human had to go do that by hand. The auto-redeploy job below now does
# it automatically: for each lambda past the freshness threshold, it maps
# the drifted ssmName to its upload-lambdas.yml `project` and dispatches
# upload-lambdas.yml for it directly (bypassing `nx affected`, since the
# whole point is the artifact is already built and stuck, not that the
# source needs rebuilding). Guarded against redeploy loops with an SSM
# parameter (`.../lambda-drift-check/<ssmName>/auto-redeploy-attempted-version`)
# recording the drifted version already auto-redeployed once: if the next
# check still sees that same target version drifted, auto-redeploy is
# skipped and a distinct "drift persists after auto-redeploy" Discord alert
# fires instead, so a stuck Terraform apply doesn't get silently re-dispatched
# forever. A genuinely new drifted version (new upload) always gets its own
# attempt, since the guard key includes the target version.
#
# Since this job's first live exercise is necessarily whenever real drift
# next occurs, the workflow_dispatch trigger takes a `dry-run` input: run it
# manually against real (or force-all-induced) drift data and the
# auto-redeploy job computes and logs its full plan — which lambda(s), which
# upload-lambdas.yml project, guard-skip vs fresh-attempt — without writing
# any SSM guard state or dispatching upload-lambdas.yml, so the logic can be
# validated before the automatic (workflow_run-triggered) path relies on it.
# =============================================================================

on:
  # Two paths, both covering a completed apply (LS-9374/LS-9369 restructure):
  #   - "Deploy": the umbrella workflow now runs Apply Lambda Infrastructure
  #     SYNCHRONOUSLY (via workflow_call) before Deploy Web, so by the time
  #     "Deploy" completes the apply has already finished — this is the
  #     common case for every normal push to main.
  #   - "Apply Lambda Infrastructure": still fires as its own top-level
  #     workflow run for the standalone path — a manual one-off
  #     workflow_dispatch of upload-lambdas.yml, which triggers this
  #     workflow via workflow_run rather than the embedded workflow_call.
  # (Previously this only listened on "Apply Lambda Infrastructure" because
  # the apply used to start only AFTER "Deploy" completed, so auditing on
  # Deploy completion would have raced the apply and reported transient
  # SSM-vs-Description drift. That race no longer exists for the synchronous
  # path, and "Deploy" is now the trigger that actually reflects it.)
  workflow_run:
    workflows: ["Deploy", "Apply Lambda Infrastructure"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: >-
          Auto-redeploy: compute the plan against real drift data and log it,
          without writing guard SSM state or dispatching upload-lambdas.yml.
          Use to validate the auto-redeploy job's logic safely before
          trusting the automatic (workflow_run-triggered) path.
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read
  actions: read

env:
  AWS_REGION: us-east-1
  AWS_STAGE: dev
  LAMBDA_PREFIX: legacy-sports-dev
  PLAN_ROLE_ARN: arn:aws:iam::176661590736:role/legacy-sports-dev-github-actions-plan
  # Write role — same one upload-lambdas.yml's upload job uses to put the
  # `/legacy-sports/<stage>/lambda/<name>/version` SSM parameter. Its policy
  # grants ssm:PutParameter on `/legacy-sports/<environment>/*`, which also
  # covers the auto-redeploy guard parameters below.
  WRITE_ROLE_ARN: arn:aws:iam::176661590736:role/legacy-sports-dev-github-actions

jobs:
  # ---------------------------------------------------------------------------
  # LS-10964 — skip when the triggering Deploy was superseded. When the merge
  # queue lands a batch, each intermediate Deploy run skips itself and
  # deploys nothing; the newer Deploy run triggers this workflow again once
  # it has actually deployed. Auditing in between would race that deploy.
  # Fail open: any error, a dispatch, or an "Apply Lambda Infrastructure"
  # trigger reads as not superseded and the checks run as before.
  # ---------------------------------------------------------------------------
  superseded-check:
    name: "Superseded Deploy Check"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      superseded: ${{ steps.check.outputs.superseded }}
    steps:
      - name: "Checkout (script only)"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          sparse-checkout: |
            .github/scripts/deploy-superseded.mjs
          sparse-checkout-cone-mode: false
      - name: "Was the triggering Deploy superseded?"
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/deploy-superseded.mjs

  # ---------------------------------------------------------------------------
  # Signal 1 — deployed version vs SSM version, per lambda
  # ---------------------------------------------------------------------------
  version-drift:
    name: "Check Lambda Version Drift"
    needs: superseded-check
    if: >-
      !cancelled() &&
      needs.superseded-check.outputs.superseded != 'true'
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      drift_found: ${{ steps.check.outputs.drift_found }}
      drift_report: ${{ steps.check.outputs.drift_report }}
      drift_json: ${{ steps.check.outputs.drift_json }}

    steps:
      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: "Configure AWS credentials (read-only plan role)"
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ env.PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "Compare deployed description vs SSM version"
        id: check
        shell: bash
        env:
          FRESHNESS_THRESHOLD_HOURS: ${{ vars.LAMBDA_FRESHNESS_THRESHOLD_HOURS || '2' }}
        run: |
          # Lambda function-name suffixes (== ssmName for every registered
          # lambda) to monitor for version drift. Derived from the single
          # source of truth shared with upload-lambdas.yml (LS-8716) — only
          # entries with driftMonitored:true are included; see
          # .github/lambda-registry.json.
          REGISTRY=$(jq -c '[.[] | select(.driftMonitored) | {function: .ssmName, ssmName: .ssmName}]' .github/lambda-registry.json)

          NOW_EPOCH=$(date +%s)
          DRIFTED="[]"
          echo "## 🔍 Lambda Version Drift Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Freshness threshold: ${FRESHNESS_THRESHOLD_HOURS}h (\`vars.LAMBDA_FRESHNESS_THRESHOLD_HOURS\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lambda | SSM Version | Deployed Description | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------------|----------------------|--------|" >> "$GITHUB_STEP_SUMMARY"

          while IFS=$'\t' read -r FUNC SSM_NAME; do
            PARAM_JSON=$(aws ssm get-parameter \
              --name "/legacy-sports/${AWS_STAGE}/lambda/${SSM_NAME}/version" \
              --region "${AWS_REGION}" \
              --query "Parameter.{Value:Value,LastModifiedDate:LastModifiedDate}" \
              --output json 2>/dev/null || echo '{}')
            EXPECTED=$(echo "$PARAM_JSON" | jq -r '.Value // "MISSING"')
            LAST_MODIFIED=$(echo "$PARAM_JSON" | jq -r '.LastModifiedDate // empty')

            DEPLOYED=$(aws lambda get-function-configuration \
              --function-name "${LAMBDA_PREFIX}-${FUNC}" \
              --region "${AWS_REGION}" \
              --query "Description" --output text 2>/dev/null || echo "MISSING")

            if [ "$EXPECTED" = "MISSING" ] || [ "$DEPLOYED" = "MISSING" ] || [ "$DEPLOYED" = "None" ]; then
              STATUS="⚠️ unreadable"
              echo "  ⚠️ ${FUNC}: could not read SSM version or deployed description (SSM=$EXPECTED, Deployed=$DEPLOYED)"
            elif [ "$EXPECTED" != "$DEPLOYED" ]; then
              # LastModifiedDate is an epoch (with fractional seconds) —
              # truncate to whole seconds for the elapsed-hours calculation.
              LAST_MODIFIED_EPOCH="${LAST_MODIFIED%%.*}"
              if [ -n "$LAST_MODIFIED_EPOCH" ]; then
                HOURS_PENDING=$(( (NOW_EPOCH - LAST_MODIFIED_EPOCH) / 3600 ))
              else
                HOURS_PENDING=0
              fi

              if [ "$HOURS_PENDING" -ge "$FRESHNESS_THRESHOLD_HOURS" ]; then
                STATUS="❌ DRIFT (${HOURS_PENDING}h pending)"
                echo "  ❌ ${FUNC}: SSM=$EXPECTED, Deployed=$DEPLOYED (pending ${HOURS_PENDING}h, threshold ${FRESHNESS_THRESHOLD_HOURS}h)"
                DRIFTED=$(echo "$DRIFTED" | jq -c --arg f "$FUNC" --arg e "$EXPECTED" --arg d "$DEPLOYED" --arg h "$HOURS_PENDING" \
                  '. + [{function: $f, expected: $e, deployed: $d, hoursPending: $h}]')
              else
                STATUS="⏳ pending (${HOURS_PENDING}h, below ${FRESHNESS_THRESHOLD_HOURS}h threshold)"
                echo "  ⏳ ${FUNC}: SSM=$EXPECTED, Deployed=$DEPLOYED (pending ${HOURS_PENDING}h, below ${FRESHNESS_THRESHOLD_HOURS}h threshold — likely mid-race with a concurrent upload)"
              fi
            else
              STATUS="✅ in sync"
              echo "  ✅ ${FUNC}: $EXPECTED"
            fi

            echo "| ${FUNC} | \`${EXPECTED}\` | \`${DEPLOYED}\` | ${STATUS} |" >> "$GITHUB_STEP_SUMMARY"
          done < <(echo "$REGISTRY" | jq -r '.[] | [.function, .ssmName] | @tsv')

          DRIFT_COUNT=$(echo "$DRIFTED" | jq 'length')
          if [ "$DRIFT_COUNT" -gt 0 ]; then
            echo "drift_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "drift_found=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "drift_report<<DRIFT_EOF"
            echo "$DRIFTED" | jq -r '.[] | "- **\(.function)**: SSM=`\(.expected)`, deployed=`\(.deployed)` — pending \(.hoursPending)h"'
            echo "DRIFT_EOF"
          } >> "$GITHUB_OUTPUT"

          # Machine-readable form for the auto-redeploy job below — same
          # entries as drift_report, consumed instead of re-parsing markdown.
          echo "drift_json=$(echo "$DRIFTED" | jq -c '.')" >> "$GITHUB_OUTPUT"

      - name: "Discord alert — version drift"
        if: always() && steps.check.outputs.drift_found == 'true'
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: failure
          title: "Lambda Drift Check — version mismatch"
          description: |
            One or more deployed Lambda functions are running code that does
            not match their SSM version parameter. This is the exact
            silent-staleness gap from [LS-8426](https://bkrupa.atlassian.net/browse/LS-8426)
            — the lambda was never rebuilt/uploaded after its last code
            change, or Terraform never applied the SSM version bump.

            **Drifted lambdas:**
            ${{ steps.check.outputs.drift_report }}

            **Fix**: redeploy via `workflow_dispatch` on `upload-lambdas.yml`
            for the affected lambda(s) (add `skip-ci-check: true` if CI
            verification is the blocker), then confirm
            `lambda-terraform-apply.yml` applies cleanly.

            [View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: "Fail if stale artifacts found"
        # LS-7933 AC: fail the job (non-zero exit) so the run shows red for
        # on-call visibility, mirroring terraform-drift-check.yml's pattern.
        if: always() && steps.check.outputs.drift_found == 'true'
        shell: bash
        env:
          FRESHNESS_THRESHOLD_HOURS: ${{ vars.LAMBDA_FRESHNESS_THRESHOLD_HOURS || '2' }}
        run: |
          echo "::error::Lambda version drift persisted beyond the ${FRESHNESS_THRESHOLD_HOURS}h freshness threshold. See job summary."
          exit 1

  # ---------------------------------------------------------------------------
  # Signal 3 — merged but never deployed (LS-10369)
  # ---------------------------------------------------------------------------
  # Signal 1 compares the SSM `/version` parameter with the live function, so
  # it sees "uploaded but not applied" and is blind to code that was merged and
  # never uploaded at all. This job compares each deploy target's
  # last-deployed marker (/legacy-sports/<stage>/deploy/last-deployed/<target>,
  # written by deploy.yml's Rollup Status) with main: a target is behind when
  # commits touching its paths have sat past the marker for longer than
  # vars.DEPLOY_MARKER_STALE_MINUTES (default 60) with no Deploy queued or
  # running. The next Deploy of any kind heals it, so this fires when that
  # healing is not happening. Posts only when the set of behind targets
  # changes (state in SSM), including one recovery post. Decision logic:
  # .github/scripts/deploy-markers.mjs; runbook: docs/ci-cd/deploy-markers.md.
  marker-drift:
    name: "Check Deploy Marker Drift"
    needs: superseded-check
    if: >-
      !cancelled() &&
      needs.superseded-check.outputs.superseded != 'true'
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          fetch-depth: 0

      - name: "Configure AWS credentials (write role — alert state)"
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ env.WRITE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "Is a Deploy queued or running?"
        id: deploys
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Deploy run that triggered this check is already `completed`.
          # A failed lookup reports `unknown`, which the script treats as
          # "do not alert" — the next Deploy completion re-checks.
          if ACTIVE=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&per_page=30" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length'); then
            if [ "$ACTIVE" = "0" ]; then
              echo "active=false" >> "$GITHUB_OUTPUT"
            else
              echo "active=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "active=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: "Compare last-deployed markers with main"
        id: drift
        env:
          DEPLOY_ACTIVE: ${{ steps.deploys.outputs.active }}
          STALE_MINUTES: ${{ vars.DEPLOY_MARKER_STALE_MINUTES || '60' }}
          DRY_RUN: ${{ inputs['dry-run'] == true }}
        run: node .github/scripts/deploy-markers.mjs drift

      - name: "Discord alert — merged but not deployed"
        if: steps.drift.outputs.post == 'true' && steps.drift.outputs.kind == 'drift'
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: failure
          title: "Deploy Markers — main is ahead of what is deployed"
          description: |
            Commits on main that touch a deploy target have not been deployed,
            and no Deploy is queued or running to pick them up
            ([LS-10369](https://bkrupa.atlassian.net/browse/LS-10369)).

            **Behind:**
            ${{ steps.drift.outputs.report }}

            **Fix**: run the `Deploy` workflow on main (no inputs needed — it
            deploys everything since each marker). If that run fails, its
            failure is the thing to fix. Runbook: `docs/ci-cd/deploy-markers.md`.

            [View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: "Discord — deploy markers caught up"
        if: steps.drift.outputs.post == 'true' && steps.drift.outputs.kind == 'recovered'
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: success
          title: "Deploy Markers — caught up"
          description: |
            Every deploy target that was behind main has now been deployed.

            [View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

  # ---------------------------------------------------------------------------
  # Signal 2 — recent Deploy runs that hit the Verify CI Status skip-chain
  # ---------------------------------------------------------------------------
  skip-chain-check:
    name: "Check Recent Deploy Skip-Chains"
    needs: superseded-check
    if: >-
      !cancelled() &&
      needs.superseded-check.outputs.superseded != 'true'
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      skip_chain_found: ${{ steps.check.outputs.skip_chain_found }}
      skip_chain_report: ${{ steps.check.outputs.skip_chain_report }}

    steps:
      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: "Scan recent Deploy runs for a Verify CI Status failure"
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Look at the last 10 completed Deploy runs on main — the window
            // is self-cleaning: a stuck run ages out once 10 more pushes to
            // main have deployed, at which point it's no longer "recent" risk.
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'deploy.yml',
              branch: 'main',
              status: 'completed',
              per_page: 10,
            });

            const hits = [];

            for (const run of data.workflow_runs) {
              const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({
                owner,
                repo,
                run_id: run.id,
                per_page: 100,
              });

              // Reusable-workflow jobs are listed under the parent run with
              // names like "Upload Lambdas / Verify CI Status".
              const verifyJob = jobsData.jobs.find(j => j.name.includes('Verify CI Status'));
              if (verifyJob && verifyJob.conclusion === 'failure') {
                hits.push({
                  runId: run.id,
                  runUrl: run.html_url,
                  sha: run.head_sha.slice(0, 8),
                  createdAt: run.created_at,
                });
              }
            }

            core.setOutput('skip_chain_found', hits.length > 0 ? 'true' : 'false');
            const report = hits
              .map(h => `- [\`${h.sha}\`](${h.runUrl}) at ${h.createdAt} — Verify CI Status failed, entire Upload Lambdas matrix skipped`)
              .join('\n');
            core.setOutput('skip_chain_report', report);

            if (hits.length > 0) {
              core.summary
                .addHeading('⚠️ Deploy runs with a Verify CI Status skip-chain', 2)
                .addRaw(report, true)
                .write();
            } else {
              core.summary.addHeading('✅ No recent Verify CI Status skip-chains', 2).write();
            }

      - name: "Discord alert — skip-chain detected"
        if: always() && steps.check.outputs.skip_chain_found == 'true'
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: failure
          title: "Lambda Drift Check — Deploy skip-chain detected"
          description: |
            A recent `Deploy` run failed at `Upload Lambdas / Verify CI
            Status`, which skip-chains the entire Detect/Build/Upload
            matrix — no lambda gets rebuilt or uploaded for that commit,
            and nothing retries automatically. If the commit's only change
            was to a single lambda project, `nx affected` will never pick
            it back up on a later green deploy, and it can stay silently
            stale (this is exactly what caused
            [LS-8426](https://bkrupa.atlassian.net/browse/LS-8426)).

            **Affected runs:**
            ${{ steps.check.outputs.skip_chain_report }}

            **Fix**: identify which lambda project(s) changed in the affected commit(s) and manually redeploy via `workflow_dispatch` on `upload-lambdas.yml`.

            [View this check run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

  # ---------------------------------------------------------------------------
  # Auto-remediation for Signal 1 — dispatch Upload Lambdas for drifted
  # lambda(s), guarded against redeploy loops (LS-8490)
  # ---------------------------------------------------------------------------
  auto-redeploy:
    name: "Auto-Redeploy Drifted Lambdas"
    needs: [version-drift]
    if: always() && needs.version-drift.outputs.drift_found == 'true'
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
      actions: write

    steps:
      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: "Configure AWS credentials (write role — guard state)"
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ env.WRITE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "Compute redeploy plan (one auto-attempt per drifted version)"
        id: plan
        shell: bash
        env:
          DRIFT_JSON: ${{ needs.version-drift.outputs.drift_json }}
          DRY_RUN: ${{ inputs['dry-run'] == true }}
        run: |
          # Maps drift-check's ssmName to upload-lambdas.yml's `project`
          # (the workflow_dispatch `lambda` choice). Derived from the single
          # source of truth shared with upload-lambdas.yml (LS-8716) — only
          # driftMonitored entries are included; see
          # .github/lambda-registry.json.
          declare -A SSM_TO_PROJECT=()
          while IFS=$'\t' read -r SSM_NAME PROJECT; do
            SSM_TO_PROJECT[$SSM_NAME]="$PROJECT"
          done < <(jq -r '.[] | select(.driftMonitored) | [.ssmName, .project] | @tsv' .github/lambda-registry.json)

          TO_REDEPLOY="[]"
          STILL_STALE="[]"

          while IFS=$'\t' read -r FUNC EXPECTED; do
            [ -z "$FUNC" ] && continue
            PROJECT="${SSM_TO_PROJECT[$FUNC]:-}"
            if [ -z "$PROJECT" ]; then
              echo "::warning::No upload-lambdas.yml project mapping for drifted lambda '${FUNC}' — skipping auto-redeploy, manual dispatch required"
              continue
            fi

            # Guard key includes the target version, so a lambda that drifts
            # again after a later successful upload always gets a fresh
            # auto-attempt — only a *repeat* of the same still-unresolved
            # drift is skipped.
            GUARD_PARAM="/legacy-sports/${AWS_STAGE}/lambda-drift-check/${FUNC}/auto-redeploy-attempted-version"
            ATTEMPTED=$(aws ssm get-parameter --name "$GUARD_PARAM" --region "${AWS_REGION}" \
              --query "Parameter.Value" --output text 2>/dev/null || echo "")

            if [ "$ATTEMPTED" = "$EXPECTED" ]; then
              echo "⏭️  ${FUNC}: already auto-redeployed for version ${EXPECTED}, still drifted — escalating instead of retrying"
              STILL_STALE=$(echo "$STILL_STALE" | jq -c --arg f "$FUNC" --arg e "$EXPECTED" '. + [{function: $f, expected: $e}]')
            else
              if [ "$DRY_RUN" = "true" ]; then
                echo "🧪 ${FUNC}: DRY RUN — would write guard ${GUARD_PARAM}=${EXPECTED} and dispatch upload-lambdas.yml for project '${PROJECT}' (skipping actual mutation)"
              else
                echo "🚀 ${FUNC}: dispatching upload-lambdas.yml for project '${PROJECT}' (target version ${EXPECTED})"
                # Record the guard BEFORE dispatching so a concurrent/re-run of
                # this check can't double-dispatch for the same drift.
                aws ssm put-parameter --name "$GUARD_PARAM" --value "$EXPECTED" --type String --overwrite --region "${AWS_REGION}"
              fi
              TO_REDEPLOY=$(echo "$TO_REDEPLOY" | jq -c --arg f "$FUNC" --arg p "$PROJECT" --arg e "$EXPECTED" '. + [{function: $f, project: $p, expected: $e}]')
            fi
          done < <(echo "$DRIFT_JSON" | jq -r '.[] | [.function, .expected] | @tsv')

          echo "to_redeploy=$(echo "$TO_REDEPLOY" | jq -c '.')" >> "$GITHUB_OUTPUT"
          echo "still_stale=$(echo "$STILL_STALE" | jq -c '.')" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

      - name: "Dispatch Upload Lambdas for newly drifted lambda(s)"
        if: fromJson(steps.plan.outputs.to_redeploy)[0] != null && steps.plan.outputs.dry_run != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          TO_REDEPLOY: ${{ steps.plan.outputs.to_redeploy }}
        with:
          script: |
            const toRedeploy = JSON.parse(process.env.TO_REDEPLOY);
            for (const { project, function: func } of toRedeploy) {
              core.info(`Dispatching upload-lambdas.yml for ${func} (project: ${project})`);
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'upload-lambdas.yml',
                ref: 'main',
                inputs: { lambda: project },
              });
            }

      - name: "Dry-run summary (no mutation, no dispatch)"
        if: fromJson(steps.plan.outputs.to_redeploy)[0] != null && steps.plan.outputs.dry_run == 'true'
        shell: bash
        env:
          TO_REDEPLOY: ${{ steps.plan.outputs.to_redeploy }}
        run: |
          echo "## 🧪 Auto-Redeploy Dry Run" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No SSM writes or upload-lambdas.yml dispatches were made. Would have dispatched:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$TO_REDEPLOY" | jq -r '.[] | "- **\(.function)** → project `\(.project)` (target version `\(.expected)`)"' >> "$GITHUB_STEP_SUMMARY"

      - name: "Discord alert — auto-redeploy dispatched"
        if: fromJson(steps.plan.outputs.to_redeploy)[0] != null && steps.plan.outputs.dry_run != 'true'
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: success
          title: "Lambda Drift Check — auto-redeploy dispatched"
          description: |
            Detected version drift and automatically dispatched
            `upload-lambdas.yml` for the affected lambda(s) below (one
            auto-attempt per drifted version —
            [LS-8490](https://bkrupa.atlassian.net/browse/LS-8490)).

            **Redeployed:**
            ${{ join(fromJson(steps.plan.outputs.to_redeploy).*.function, ', ') }}

            [View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: "Discord alert — drift persists after auto-redeploy"
        if: fromJson(steps.plan.outputs.still_stale)[0] != null && steps.plan.outputs.dry_run != 'true'
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: failure
          title: "Lambda Drift Check — drift persists after auto-redeploy"
          description: |
            An automatic `upload-lambdas.yml` redeploy already ran for the
            drifted version below and the lambda is **still** out of sync.
            Auto-redeploy is guarded to one attempt per drifted version, so
            this needs manual investigation — check the `upload-lambdas.yml`
            and `lambda-terraform-apply.yml` run history for the affected
            lambda(s).

            **Still stale:**
            ${{ join(fromJson(steps.plan.outputs.still_stale).*.function, ', ') }}

            [View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
