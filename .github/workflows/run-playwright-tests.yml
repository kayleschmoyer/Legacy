# =============================================================================
# Run Playwright Tests
# =============================================================================
# Nightly schedule (03:00 UTC): integration suite (real server, 3 shards) and
# full E2E suite including @slow tests (3 shards) — no grep filters.
#
# Manual dispatch: run any suite/browser/grep combination on demand.
# Trigger: Actions → "Run Playwright Tests" → Run workflow → fill parameters
# =============================================================================

name: "Run Playwright Tests"

on:
  schedule:
    - cron: "0 3 * * *" # Nightly: integration (real server) + full E2E with @slow
  workflow_dispatch:
    inputs:
      test-suite:
        description: "Which test suite to run"
        required: true
        default: "e2e"
        type: choice
        options:
          - e2e
          - integration
          - shared-live
          - all
      test-grep:
        description: "Filter tests by tag (Playwright --grep)"
        required: false
        default: "(all)"
        type: choice
        options:
          - "(all)"
          - "@critical"
          - "@smoke"
          - "@regression"
          - "@visual"
          - "@slow"
      test-grep-invert:
        description: "Exclude tests by tag (Playwright --grep-invert)"
        required: false
        default: "(none)"
        type: choice
        options:
          - "(none)"
          - "@critical"
          - "@smoke"
          - "@regression"
          - "@visual"
          - "@slow"
      test-file:
        description: "Test file(s) relative to test dir. Space-separate multiple (e.g. 'file1.spec.ts file2.spec.ts'). Empty = all files."
        required: false
        default: ""
        type: string
      browser:
        description: "Playwright project/browser to use"
        required: false
        default: "chromium"
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - Mobile Chrome
          - Mobile Safari
      shard-total:
        description: "Number of parallel shards (1 = no sharding)"
        required: false
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
      retries:
        description: "Number of retries for failed tests"
        required: false
        default: "2"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"
      workers:
        description: "Number of parallel workers per shard"
        required: false
        default: "4"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
      headed:
        description: "Run in headed mode (useful for debugging via trace)"
        required: false
        default: false
        type: boolean
      ref:
        description: "Branch or commit SHA to test (default: branch selected above)"
        required: false
        default: ""
        type: string
      collect-coverage:
        description: "Repopulate the coverage map on demand (LS-7849): instrument the build and collect per-test coverage. Pair with test-suite=all after a large refactor."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write # required for OIDC auth to AWS (S3 CI artifacts)

jobs:
  # ---------------------------------------------------------------------------
  # Compute the test matrix.
  # Nightly: integration (INTEGRATION_SHARD_CEILING shards) + e2e (3 shards),
  #          all tests, no filters.
  # Manual:  single suite, N shards (integration clamped to the ceiling),
  #          using workflow_dispatch inputs.
  # ---------------------------------------------------------------------------
  prepare:
    name: "Prepare Matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        shell: bash
        run: |
          # ---------------------------------------------------------------
          # Integration concurrency ceiling (LS-7866 → LS-7867).
          #
          # The integration suite runs against the SHARED live backend
          # (api.legacy-fantasy.com). Every concurrent shard runs its own
          # league-creation / draft / season flow against that one backend,
          # so N concurrent shards = N× the API-Gateway/Lambda load — the
          # original 3-shard fan-out produced a 39× HTTP 429 cascade in run
          # 27186006949. Workers are already pinned to 1 per shard (see the
          # "Run Playwright Tests" step), so SHARD COUNT is the live-backend
          # concurrency knob.
          #
          # LS-7866 first collapsed this to a single serial shard, but at 1/1
          # the suite no longer finishes inside the 120-min job timeout (run
          # 27216379406 reached only 69/186 in ~46 min → ~2 h extrapolated).
          # LS-7867 restores BOUNDED sharding: the universal Retry-After
          # backoff (LS-7866 axis 2, apps/web-e2e/src/utils/retry-with-backoff.ts)
          # absorbs the transient 429s that moderate concurrency produces, and
          # the per-shard staggered start (see the "Run Playwright Tests" step)
          # spreads the initial auth/token-mint burst so the shards don't
          # stampede the oauth-proxy login route (5/60s per IP) at second 0.
          #
          # INTEGRATION_SHARD_CEILING is the empirically-validated maximum
          # shard count that BOTH finishes within the timeout AND yields 0
          # 429-driven failures across ≥2 consecutive runs (LS-7867). The
          # single heaviest spec (live-draft-ui ≈ 1400 s) bounds the makespan,
          # so gains past ~3 shards are marginal while 429 risk keeps climbing.
          # Do NOT raise this without re-validating via workflow_dispatch
          # (test-suite=integration) at the higher count and confirming 0
          # 429-driven failures across ≥2 runs. E2E is hermetic (no shared
          # backend) and stays at 3 shards for speed.
          # ---------------------------------------------------------------
          INTEGRATION_SHARD_CEILING=3

          # Emit one {"suite","shard":"i/n"} JSON object per line for a suite.
          emit_shards() {
            local suite="$1" total="$2" i
            for ((i = 1; i <= total; i++)); do
              jq -cn --arg suite "$suite" --arg shard "$i/$total" \
                '{suite: $suite, shard: $shard}'
            done
          }

          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.test-suite }}" = "all" ]; then
            # Nightly or manual "all": integration (ceiling shards) + e2e
            # (3 shards) + shared-live (1 shard), all tests, no filters.
            #
            # shared-live (LS-8296) runs the ADR-0016 dual-mode specs
            # (src/tests/shared/) LIVE against the shared backend as its own
            # 1-shard / 1-worker job — the run-tests step already wires the
            # project, config, identity pool and serial workers for it (the
            # LS-8291 dispatch path). It is small and read-mostly, so a single
            # serial shard is the safe shape (ticket guidance). It adds one more
            # concurrent live-backend consumer alongside the integration shards;
            # the integration shards' staggered start means only integration
            # shard 1 + shared-live auth at second 0 (2 logins, under the
            # oauth-proxy 5/60s-per-IP limit), and the suite issues only a few
            # read GraphQL queries, so steady-state 429 risk is low. Per the
            # suite-config change protocol this must still be observed over 2
            # consecutive clean nights after merge (and can be pre-validated via
            # `workflow_dispatch` test-suite=shared-live by an owner with live
            # credentials); it does NOT change the integration shard count, so
            # the INTEGRATION_SHARD_CEILING validation is untouched.
            MATRIX=$(
              {
                emit_shards integration "$INTEGRATION_SHARD_CEILING"
                emit_shards e2e 3
                emit_shards shared-live 1
              } | jq -sc '.'
            )
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          else
            SUITE="${{ inputs.test-suite }}"
            TOTAL="${{ inputs.shard-total }}"
            if [ "$SUITE" = "integration" ] && [ "$TOTAL" -gt "$INTEGRATION_SHARD_CEILING" ]; then
              # Honor the shard-total input but clamp to the live-backend
              # ceiling — concurrency past the ceiling re-opens the 429 cascade.
              echo "Requested $TOTAL integration shards exceeds the live-backend ceiling ($INTEGRATION_SHARD_CEILING) — clamping to $INTEGRATION_SHARD_CEILING."
              TOTAL="$INTEGRATION_SHARD_CEILING"
            fi
            if [ "$SUITE" = "shared-live" ]; then
              # Dual-mode specs (ADR-0016, src/tests/shared/) run LIVE against
              # the shared backend using the integration identity pool — a
              # handful of quick specs, so always one shard / one worker.
              TOTAL=1
            fi
            MATRIX=$(emit_shards "$SUITE" "$TOTAL" | jq -sc '.')
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Discord notification — fires before tests start (schedule + manual dispatch)
  # ---------------------------------------------------------------------------
  notify-nightly-start:
    name: "Nightly Start"
    needs: [prepare]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      thread-id: ${{ steps.notify.outputs.thread-id }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: "Compute notification params"
        id: params
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "title=Nightly Playwright Suite" >> "$GITHUB_OUTPUT"
            {
              echo 'description<<EOF_PLAYWRIGHT_NOTIFY'
              echo '**Suite:** Integration (real server, sharded) + E2E (3 shards) + Shared-live (1 shard)'
              echo '**Browser:** chromium · **Workers:** e2e 4 / integration 1 / shared-live 1 · **Retries:** e2e 2 / integration 0 / shared-live 0'
              echo '**Filters:** none — all tests including @slow'
              echo 'EOF_PLAYWRIGHT_NOTIFY'
            } >> "$GITHUB_OUTPUT"
            echo "thread_name=Nightly Playwright — ${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs['test-suite'] }}" = "all" ]; then
            echo "title=Manual Playwright Suite (All)" >> "$GITHUB_OUTPUT"
            {
              echo 'description<<EOF_PLAYWRIGHT_NOTIFY'
              echo '**Suite:** Integration (real server, sharded) + E2E (3 shards) + Shared-live (1 shard)'
              echo '**Browser:** chromium · **Workers:** e2e 4 / integration 1 / shared-live 1 · **Retries:** e2e 2 / integration 0 / shared-live 0'
              echo '**Filters:** none — all tests including @slow'
              echo 'EOF_PLAYWRIGHT_NOTIFY'
            } >> "$GITHUB_OUTPUT"
            echo "thread_name=Manual Playwright (All) — ${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          else
            SUITE="${{ inputs['test-suite'] || 'e2e' }}"
            BROWSER="${{ inputs.browser || 'chromium' }}"
            SHARDS="${{ inputs['shard-total'] || '2' }}"
            WORKERS="${{ inputs.workers || '4' }}"
            RETRIES="${{ inputs.retries || '2' }}"
            GREP="${{ inputs['test-grep'] || '(all)' }}"
            GREP_INV="${{ inputs['test-grep-invert'] || '(none)' }}"
            FILE="${{ inputs['test-file'] }}"
            echo "title=Manual Playwright Suite" >> "$GITHUB_OUTPUT"
            {
              echo 'description<<EOF_PLAYWRIGHT_NOTIFY'
              echo "**Suite:** ${SUITE} · **Browser:** ${BROWSER}"
              echo "**Shards:** ${SHARDS} · **Workers:** ${WORKERS} · **Retries:** ${RETRIES}"
              echo "**Grep:** ${GREP} · **Exclude:** ${GREP_INV} · **File:** ${FILE:-all files}"
              echo 'EOF_PLAYWRIGHT_NOTIFY'
            } >> "$GITHUB_OUTPUT"
            echo "thread_name=Manual Playwright — ${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: "Discord Playwright Starting"
        id: notify
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_PLAYWRIGHT_WEBHOOK_URL }}
          status: running
          title: ${{ steps.params.outputs.title }}
          description: ${{ steps.params.outputs.description }}
          thread-name: ${{ steps.params.outputs.thread_name }}

  run-tests:
    name: "Playwright ${{ matrix.suite }} (${{ matrix.shard }})"
    needs: [prepare]
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    # Integration runs at a bounded shard count (LS-7867 concurrency ceiling)
    # with workers=1 per shard, so a single shard still runs the heaviest
    # specs (live-draft-ui ≈ 1400 s) plus Retry-After backoff waits — it keeps
    # the 120-min cap as headroom above the observed per-shard wall-clock.
    # E2E is hermetic and stays at 60.
    timeout-minutes: ${{ matrix.suite == 'integration' && 120 || 60 }}
    env:
      # Per-test source-coverage collection (LS-7849): nightly schedule, plus the
      # on-demand "repopulate coverage map" lever (manual dispatch with
      # collect-coverage=true). Set at job scope so it reaches both the e2e
      # "Build Web Application" step (instruments the served build via
      # vite-plugin-istanbul) and the "Run Playwright Tests" step (enables the
      # _coverage fixture). Left empty (and therefore falsy) on ordinary manual
      # dispatch and on PR CI so those builds are never instrumented — coverage
      # collection is intentionally OFF the per-PR path (keeps PRs fast).
      COLLECT_COVERAGE: ${{ (github.event_name == 'schedule' || inputs['collect-coverage']) && '1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: false
          include-optional-deps: false

      - name: "Resolve Playwright config"
        id: playwright-config
        shell: bash
        run: |
          # Nightly-like runs always use chromium; manual dispatch respects the browser input.
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs['test-suite'] }}" = "all" ]; then
            BROWSER_ENGINE="chromium"
          else
            BROWSER="${{ inputs.browser }}"
            case "$BROWSER" in
              "Mobile Chrome") BROWSER_ENGINE="chromium" ;;
              "Mobile Safari") BROWSER_ENGINE="webkit" ;;
              *) BROWSER_ENGINE="$BROWSER" ;;
            esac
          fi
          echo "browser-engine=$BROWSER_ENGINE" >> "$GITHUB_OUTPUT"
          echo "Browser engine: $BROWSER_ENGINE"

      - name: "Verify AMI-baked Playwright browsers"
        shell: bash
        env:
          BROWSER_ENGINE: ${{ steps.playwright-config.outputs.browser-engine }}
        run: |
          # The self-hosted runner AMI bakes Playwright browsers at
          # /opt/playwright-browsers (see LS-2429). We explicitly set
          # PLAYWRIGHT_BROWSERS_PATH for the rest of the job — the AMI does
          # NOT set it globally, contrary to what LS-4451's first cut assumed,
          # and without it Playwright falls back to ~/.cache/ms-playwright
          # (empty on the runner) and fails to launch (LS-4465).
          #
          # Dropping the runtime `playwright install --with-deps` (LS-4451)
          # eliminates the dpkg-lock race against unattended-upgrades that was
          # the steady-state cause of CI flake.
          #
          # Expected revisions come from playwright-core/browsers.json so this
          # step is a tripwire: when the project's Playwright pin is bumped to
          # a version that wants newer browser revisions, this step fails with
          # an actionable message before tests run. The fix is to rebake the
          # AMI via the Packer pipeline (LS-2429), not to re-introduce a
          # runtime install.
          echo "PLAYWRIGHT_BROWSERS_PATH=/opt/playwright-browsers" >> "$GITHUB_ENV"
          # We need to verify both the full chromium build and the headless
          # shell, because Playwright tests run headless by default and launch
          # `chrome-headless-shell` (a separate browsers.json entry +
          # /opt/playwright-browsers/chromium_headless_shell-<rev> directory).
          # Hyphens in browsers.json names map to underscores in directory
          # names (`chromium-headless-shell` -> `chromium_headless_shell`).
          # `playwright-core`'s package exports do not expose ./browsers.json,
          # so resolve it via the package.json path instead of a direct require.
          if [ "$BROWSER_ENGINE" = "chromium" ]; then
            NAMES="chromium chromium-headless-shell"
          else
            NAMES="$BROWSER_ENGINE"
          fi
          MISSING=""
          for NAME in $NAMES; do
            REVISION=$(node -e "
              const path = require('path');
              const fs = require('fs');
              const pkg = require.resolve('playwright-core/package.json');
              const file = path.join(path.dirname(pkg), 'browsers.json');
              const data = JSON.parse(fs.readFileSync(file, 'utf8'));
              const name = process.argv[1];
              const b = data.browsers.find((x) => x.name === name);
              if (!b) {
                console.error('No browsers.json entry for ' + name);
                process.exit(1);
              }
              process.stdout.write(String(b.revision));
            " "$NAME")
            DIR_NAME="${NAME//-/_}"
            EXPECTED="/opt/playwright-browsers/${DIR_NAME}-${REVISION}"
            echo "    Expected AMI-baked browser: $EXPECTED"
            if [ ! -d "$EXPECTED" ]; then
              echo "::error::AMI-baked Playwright browser missing: $EXPECTED"
              MISSING="$MISSING $EXPECTED"
            else
              echo "    OK: $EXPECTED is present."
            fi
          done
          if [ -n "$MISSING" ]; then
            echo ""
            echo "The runner AMI is missing one or more required browsers:$MISSING"
            echo "This usually means the project's Playwright pin was bumped to a"
            echo "version that wants newer browser revisions than the AMI provides."
            echo ""
            echo "Fix: rebake the AMI via the Packer pipeline (see LS-2429 for the"
            echo "bake procedure). Do NOT re-add a runtime 'playwright install' here"
            echo "— that races unattended-upgrades for the dpkg lock and was the"
            echo "steady-state cause of CI flake the tripwire is here to prevent."
            echo ""
            echo "AMI cache contents at /opt/playwright-browsers:"
            if [ -d /opt/playwright-browsers ]; then
              ls -la /opt/playwright-browsers 2>&1
            else
              echo "    (directory does not exist — AMI may be misconfigured)"
            fi
            exit 1
          fi
          echo "    All required AMI-baked browsers present."

      # =======================================================================
      # E2E suite: build web app and start a local server
      # =======================================================================
      - name: "Build Web Application"
        if: matrix.suite == 'e2e'
        shell: bash
        env:
          # The nightly schedule instruments this build for coverage
          # (COLLECT_COVERAGE=1 → vite-plugin-istanbul), which pushes build-time
          # heap past V8's default ~2 GB cap and OOMs (LS: nightly e2e build).
          # Match the 4 GB heap every other web build in the repo already uses
          # (ci-pipeline.yml, deploy-web.yml, deploy-pr-preview.yml).
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_JIRA_PROXY_URL: "https://e2e-placeholder.test/jira"
          VITE_GIPHY_API_KEY: "e2e-placeholder-key"
          # Placeholder so the conditional "Continue with Discord" CTA on
          # PublicLandingPage renders in hermetic E2E builds (LS-3537, LS-3541).
          # The real secret is never read during E2E — this only needs to be
          # truthy so the button mounts and can be located via getByRole.
          VITE_DISCORD_CLIENT_ID: "e2e-placeholder-discord-id"
          # Required at build time so the TeamDetailPage upload handler
          # doesn't throw "Image uploads are not configured" before ever
          # calling fetch — the actual upload endpoint is always mocked by
          # Playwright (LS-8349).
          VITE_IMAGE_UPLOAD_URL: "https://e2e-placeholder.test/images"
        run: |
          export NX_NO_CLOUD=true
          pnpm exec nx build web

      - name: "Start Dev Server"
        if: matrix.suite == 'e2e'
        shell: bash
        run: |
          export NX_NO_CLOUD=true

          if [ -d "dist/apps/web" ]; then
            echo "Serving pre-built web artifact..."
            # Prefer globally-installed serve (baked into AMI), fall back to pnpm dlx
            if command -v serve >/dev/null 2>&1; then
              serve -s dist/apps/web -l 4200 --no-clipboard &
            else
              pnpm dlx serve@14.2.4 -s dist/apps/web -l 4200 --no-clipboard &
            fi
          else
            echo "Falling back to nx serve..."
            pnpm exec nx serve web --port=4200 --host=localhost &
          fi
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

          echo "Waiting for dev server on http://localhost:4200 ..."
          for i in {1..90}; do
            if curl -sf http://localhost:4200 >/dev/null 2>&1; then
              echo "Dev server ready"
              break
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Dev server crashed"
              exit 1
            fi
            sleep 1
          done

          if ! curl -sf http://localhost:4200 >/dev/null 2>&1; then
            echo "Dev server did not start within 90 seconds"
            exit 1
          fi

      # =======================================================================
      # Run Playwright tests
      # =======================================================================
      - name: "Run Playwright Tests"
        id: tests
        shell: bash
        env:
          CI: "true"
          # Hermetic e2e tests mock every network call with route.fulfill()
          # (there is no backend in CI), so the JWT signature is never
          # validated. The tests use a hardcoded dev secret baked into the
          # source — we do NOT pass the production JWT_SECRET_KEY into the
          # test runner env. Integration tests use real OAuth login via
          # getTestUserJwt, so they don't need a signing key either.
          INTEGRATION_BASE_URL: ${{ secrets.INTEGRATION_BASE_URL }}
          # E2E_* credentials are only needed by the integration suite (real
          # OAuth login). Hermetic e2e tests mock the network and don't need
          # them.
          E2E_COMMISSIONER_EMAIL: ${{ (matrix.suite == 'integration' || matrix.suite == 'shared-live') && secrets.E2E_COMMISSIONER_EMAIL || '' }}
          E2E_COMMISSIONER_PASSWORD: ${{ (matrix.suite == 'integration' || matrix.suite == 'shared-live') && secrets.E2E_COMMISSIONER_PASSWORD || '' }}
          E2E_MANAGER_1_EMAIL: ${{ (matrix.suite == 'integration' || matrix.suite == 'shared-live') && secrets.E2E_MANAGER_1_EMAIL || '' }}
          E2E_MANAGER_1_PASSWORD: ${{ (matrix.suite == 'integration' || matrix.suite == 'shared-live') && secrets.E2E_MANAGER_1_PASSWORD || '' }}
          E2E_MANAGER_2_EMAIL: ${{ (matrix.suite == 'integration' || matrix.suite == 'shared-live') && secrets.E2E_MANAGER_2_EMAIL || '' }}
          E2E_MANAGER_2_PASSWORD: ${{ (matrix.suite == 'integration' || matrix.suite == 'shared-live') && secrets.E2E_MANAGER_2_PASSWORD || '' }}
          E2E_MANAGER_3_EMAIL: ${{ (matrix.suite == 'integration' || matrix.suite == 'shared-live') && secrets.E2E_MANAGER_3_EMAIL || '' }}
          E2E_MANAGER_3_PASSWORD: ${{ (matrix.suite == 'integration' || matrix.suite == 'shared-live') && secrets.E2E_MANAGER_3_PASSWORD || '' }}
          # Shared password for the 10 new tiered pool identities — premium
          # seats 3-6, free seats 3-6, admin-1/2 (LS-8055). Their @test.legacysports.dev
          # emails are deterministic (hardcoded in test-user-auth.ts); only the
          # password is a secret. premium seats 1-2 (E2E_COMMISSIONER_*,
          # E2E_MANAGER_2_*) and free seats 1-2 (E2E_MANAGER_1_*, E2E_MANAGER_3_*)
          # reuse the persona secrets already wired above.
          E2E_POOL_PASSWORD: ${{ (matrix.suite == 'integration' || matrix.suite == 'shared-live') && secrets.E2E_POOL_PASSWORD || '' }}
          # Google test credentials for google-oauth.integration.spec.ts
          # The API smoke tests always run; the UI popup test is skipped when absent.
          GOOGLE_TEST_EMAIL: ${{ matrix.suite == 'integration' && secrets.GOOGLE_TEST_EMAIL || '' }}
          GOOGLE_TEST_PASSWORD: ${{ matrix.suite == 'integration' && secrets.GOOGLE_TEST_PASSWORD || '' }}
        run: |
          SUITE="${{ matrix.suite }}"
          IS_SCHEDULE="${{ github.event_name == 'schedule' }}"
          IS_NIGHTLY_LIKE="false"
          if [ "$IS_SCHEDULE" = "true" ] || [ "${{ inputs['test-suite'] }}" = "all" ]; then
            IS_NIGHTLY_LIKE="true"
          fi

          if [ "$SUITE" = "integration" ] || [ "$SUITE" = "shared-live" ]; then
            CONFIG="apps/web-e2e/playwright.integration.config.ts"
          else
            CONFIG="apps/web-e2e/playwright.config.ts"
          fi

          # Build Playwright arguments as an array to avoid command injection
          PLAYWRIGHT_ARGS=( "--config=$CONFIG" )

          # Browser / project. Integration runs pass no --project: the
          # explicit shard file lists below only ever name files under the
          # `integration` project's testDir, so the config's `shared-live`
          # project (dual-mode specs, ADR-0016) never matches there. The
          # shared-live suite selects that project explicitly instead.
          if [ "$SUITE" = "shared-live" ]; then
            PLAYWRIGHT_ARGS+=( "--project=shared-live" )
          elif [ "$SUITE" != "integration" ]; then
            if [ "$IS_NIGHTLY_LIKE" = "true" ]; then
              PLAYWRIGHT_ARGS+=( "--project=chromium" )
            else
              PLAYWRIGHT_ARGS+=( "--project=${{ inputs.browser }}" )
            fi
          fi

          # Grep patterns — nightly-like runs all tests (no filters, @slow included)
          if [ "$IS_NIGHTLY_LIKE" != "true" ]; then
            if [ "${{ inputs.test-grep }}" != "(all)" ]; then
              PLAYWRIGHT_ARGS+=( "--grep=${{ inputs.test-grep }}" )
            fi
            if [ "${{ inputs.test-grep-invert }}" != "(none)" ]; then
              PLAYWRIGHT_ARGS+=( "--grep-invert=${{ inputs.test-grep-invert }}" )
            fi
          fi

          # Specific test file (manual dispatch only)
          TEST_FILE=""
          if [ "$IS_NIGHTLY_LIKE" != "true" ] && [ -n "${{ inputs.test-file }}" ]; then
            TEST_FILE="${{ inputs.test-file }}"
          fi

          # Sharding.
          # E2E: native Playwright --shard. Count-based contiguous splitting is
          # fine for the hermetic suite (no shared live backend to contend on).
          # Integration: weighted-balance partition (LS-7845). Playwright's
          # count-based --shard splits the alphabetically-sorted spec files into
          # contiguous thirds, which dumped every heavy draft/season spec into
          # the middle third (shard 2) and saturated the live backend there while
          # shards 1 & 3 stayed green. shard-partition.ts distributes specs across
          # shards by weight (LPT bin-packing) and we pass each shard its own
          # explicit file list; shard identity for the cleanup guards in
          # global-setup/teardown travels via INTEGRATION_SHARD_CURRENT/TOTAL
          # instead of --shard.
          INTEGRATION_SPEC_ARGS=()
          if [ "$SUITE" = "integration" ]; then
            SHARD_SPEC="${{ matrix.shard }}"
            SHARD_INDEX="${SHARD_SPEC%%/*}"
            SHARD_TOTAL="${SHARD_SPEC##*/}"
            export INTEGRATION_SHARD_CURRENT="$SHARD_INDEX"
            export INTEGRATION_SHARD_TOTAL="$SHARD_TOTAL"
            if ! pnpm exec tsx apps/web-e2e/src/integration/shard-partition.ts \
              --dir apps/web-e2e/src/integration/tests \
              --weights apps/web-e2e/src/integration/integration-shard-weights.json \
              --shards "$SHARD_TOTAL" --index "$SHARD_INDEX" \
              > /tmp/integration-shard-specs.txt; then
              echo "::error::Failed to compute weighted integration shard $SHARD_INDEX/$SHARD_TOTAL"
              exit 1
            fi
            mapfile -t INTEGRATION_SPEC_ARGS < /tmp/integration-shard-specs.txt
            echo "Balanced integration shard $SHARD_INDEX/$SHARD_TOTAL → ${#INTEGRATION_SPEC_ARGS[@]} spec(s):"
            printf '  - %s\n' "${INTEGRATION_SPEC_ARGS[@]}"

            # Per-shard staggered start (LS-7867). The integration shards may
            # share a NAT egress IP on the self-hosted runners; without a stagger
            # all N shards hit the oauth-proxy login route (5/60s per IP) and the
            # shared backend at second 0, producing an initial 429 burst the
            # universal backoff (LS-7866) then has to absorb all at once. A
            # deterministic per-shard offset spreads that first wave so concurrency
            # can be raised safely. shard 1 starts immediately; each later shard
            # waits STAGGER_SECONDS × (index − 1) — negligible against the
            # multi-minute spec runtimes, and skipped entirely for a single shard.
            INTEGRATION_SHARD_STAGGER_SECONDS=30
            if [ "$SHARD_TOTAL" -gt 1 ] && [ "$SHARD_INDEX" -gt 1 ]; then
              STAGGER=$(( INTEGRATION_SHARD_STAGGER_SECONDS * (SHARD_INDEX - 1) ))
              echo "Staggering integration shard $SHARD_INDEX/$SHARD_TOTAL start by ${STAGGER}s to spread the initial auth burst."
              sleep "$STAGGER"
            fi
          else
            # 1/1 is valid and runs all tests in one shard.
            PLAYWRIGHT_ARGS+=( "--shard=${{ matrix.shard }}" )
          fi

          # Workers and retries
          # Integration suite must always run with 1 worker — concurrent
          # league-creation flows against the live backend cause Lambda
          # throttling and flaky "Failed to fetch" / null teamId responses.
          # playwright.integration.config.ts sets workers: 1 for the same
          # reason, but CLI --workers overrides the config value, so we must
          # be explicit here too. See LS-2824. The matching SHARD ceiling
          # (1 integration shard) is enforced in the `prepare` job — together
          # they bound live-backend concurrency to a single in-flight flow
          # (LS-7866).
          if [ "$SUITE" = "integration" ] || [ "$SUITE" = "shared-live" ]; then
            PLAYWRIGHT_ARGS+=( "--workers=1" )
          elif [ "$IS_NIGHTLY_LIKE" = "true" ]; then
            PLAYWRIGHT_ARGS+=( "--workers=4" "--retries=2" )
          else
            PLAYWRIGHT_ARGS+=( "--workers=${{ inputs.workers }}" "--retries=${{ inputs.retries }}" )
          fi

          # Headed mode (manual dispatch only)
          if [ "$IS_NIGHTLY_LIKE" != "true" ] && [ "${{ inputs.headed }}" = "true" ]; then
            PLAYWRIGHT_ARGS+=( "--headed" )
          fi

          # Reporters: line for console, blob for merge+deploy
          PLAYWRIGHT_ARGS+=( "--reporter=line,blob" )

          # Diagnosability (LS-8350): a runner-level death (OOM/process kill)
          # can fail this step while GitHub uploads no log blob for the job,
          # leaving nothing to root-cause after the fact. Tee stdout+stderr to
          # a file so "Upload Test Output" below can still capture it via
          # if: always(), even when the run below is killed mid-test.
          mkdir -p playwright-output
          LOG_FILE="playwright-output/${{ matrix.suite }}-${{ strategy.job-index }}.log"

          # Run with test file as a safe positional arg after --
          # Word-split TEST_FILE so multiple space-separated filenames become
          # separate arguments to Playwright. Without read -ra, passing
          # "file1.spec.ts file2.spec.ts" as a single quoted string causes
          # Playwright to treat the entire value as one literal filename,
          # find no match, and run 0 tests while still exiting 0 (ok: true).
          if [ "$SUITE" = "integration" ]; then
            if [ "${#INTEGRATION_SPEC_ARGS[@]}" -eq 0 ]; then
              echo "No specs assigned to integration shard ${INTEGRATION_SHARD_CURRENT}/${INTEGRATION_SHARD_TOTAL} — nothing to run."
              exit 0
            fi
            echo "Running: pnpm exec playwright test ${PLAYWRIGHT_ARGS[*]} -- ${INTEGRATION_SPEC_ARGS[*]}"
            pnpm exec playwright test "${PLAYWRIGHT_ARGS[@]}" -- "${INTEGRATION_SPEC_ARGS[@]}" 2>&1 | tee "$LOG_FILE"
            exit "${PIPESTATUS[0]}"
          elif [ -n "$TEST_FILE" ]; then
            read -ra TEST_FILE_ARGS <<< "$TEST_FILE"
            echo "Running: pnpm exec playwright test ${PLAYWRIGHT_ARGS[*]} -- ${TEST_FILE_ARGS[*]}"
            pnpm exec playwright test "${PLAYWRIGHT_ARGS[@]}" -- "${TEST_FILE_ARGS[@]}" 2>&1 | tee "$LOG_FILE"
            exit "${PIPESTATUS[0]}"
          else
            echo "Running: pnpm exec playwright test ${PLAYWRIGHT_ARGS[*]}"
            pnpm exec playwright test "${PLAYWRIGHT_ARGS[@]}" 2>&1 | tee "$LOG_FILE"
            exit "${PIPESTATUS[0]}"
          fi

      # Diagnosability (LS-8350): surface any OOM-killer signature from the
      # runner's kernel log before the job's workspace is torn down. dmesg
      # requires kernel log read access, which self-hosted runners may or may
      # not grant — failures here are non-fatal (`|| true`) since an empty
      # signature just means "inconclusive", not "no OOM occurred".
      - name: "Capture OOM Signature"
        if: always()
        shell: bash
        run: |
          mkdir -p playwright-output
          SIG_FILE="playwright-output/${{ matrix.suite }}-${{ strategy.job-index }}-dmesg.log"
          if command -v dmesg >/dev/null 2>&1; then
            OOM_LINES=$(dmesg 2>/dev/null | grep -i -E "out of memory|oom-kill|oom_kill|killed process" || true)
            if [ -n "$OOM_LINES" ]; then
              echo "::warning::Possible OOM kill detected on this runner (see ${SIG_FILE})"
              echo "$OOM_LINES" | tee "$SIG_FILE"
            else
              echo "No OOM-killer signature found in dmesg."
            fi
          else
            echo "dmesg unavailable on this runner — cannot check for an OOM-killer signature." | tee "$SIG_FILE"
          fi

      # Diagnosability (LS-8350): upload the tee'd Playwright output + any OOM
      # signature even when the job/step above was killed, so a future
      # "conclusion=failure, no log blob" run has something to root-cause
      # from instead of a BlobNotFound black hole.
      - name: "Upload Playwright Test Output"
        if: always()
        uses: ./.github/actions/s3-artifact
        with:
          mode: upload
          name: playwright-output/${{ strategy.job-index }}
          path: playwright-output/
          if-no-files-found: ignore

      - name: "Stop Dev Server"
        if: always() && matrix.suite == 'e2e'
        shell: bash
        run: kill $SERVER_PID 2>/dev/null || true

      # =======================================================================
      # Artifacts — blob reports uploaded to S3 for merge+deploy
      # =======================================================================
      - name: "Upload Blob Report to S3"
        if: ${{ !cancelled() }}
        uses: ./.github/actions/s3-artifact
        with:
          mode: upload
          name: playwright-blobs/${{ strategy.job-index }}
          path: blob-report/
          if-no-files-found: ignore

      # Per-shard spec→source-file coverage fragment (LS-7849). Mirrors the blob
      # upload above: one artifact per shard (e2e + integration), namespaced by
      # job index. Runs on the nightly schedule and on the on-demand repopulate
      # lever (manual dispatch with collect-coverage=true) — the same conditions
      # that set COLLECT_COVERAGE. On other runs no fragment is produced and the
      # upload is skipped anyway (if-no-files-found: ignore).
      - name: "Upload Coverage Fragment to S3"
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs['collect-coverage']) }}
        uses: ./.github/actions/s3-artifact
        with:
          mode: upload
          name: playwright-coverage/${{ strategy.job-index }}
          path: apps/web-e2e/coverage-fragments/
          if-no-files-found: ignore

  # ===========================================================================
  # Merge shard reports and deploy directly to GitHub Pages
  # ===========================================================================
  deploy-report:
    name: "Deploy Playwright Report"
    needs: [run-tests]
    if: ${{ !cancelled() && needs.run-tests.result != 'skipped' }}
    # Push conflicts with other workflows deploying to the same gh-pages branch
    # are handled by the retry-with-rebase loop in the deploy step. No shared
    # concurrency group — GitHub only queues one pending job per group, so a
    # burst of deploys cancels intermediate pending jobs instead of queuing them.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has-report: ${{ steps.merge.outputs.has-report }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # The merge config written in the "Merge Reports" step registers
          # apps/web-e2e/src/reporters/agent-md-reporter.ts (LS-7838), so the
          # reporter source must be present in this sparse checkout or
          # merge-reports fails with "Cannot find module" (LS-7928).
          sparse-checkout: |
            .github/actions/s3-artifact
            scripts/rewrite-pw-attachment-paths.py
            apps/web-e2e/src/reporters/agent-md-reporter.ts
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: "Setup Node.js"
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: "Download All Blob Reports from S3"
        uses: ./.github/actions/s3-artifact
        with:
          mode: download
          name: playwright-blobs
          path: all-blob-reports

      - name: "Enable corepack"
        run: corepack enable && corepack prepare pnpm@9.12.1 --activate

      - name: "Merge Reports"
        id: merge
        run: |
          # Flatten shard subdirectories (0/, 1/, etc.) into all-blob-reports/
          if [ -d "all-blob-reports" ]; then
            find all-blob-reports -mindepth 2 -type f -exec mv {} all-blob-reports/ \; 2>/dev/null || true
            find all-blob-reports -mindepth 1 -type d -empty -delete 2>/dev/null || true
          fi
          COUNT=$(find all-blob-reports -name '*.zip' -type f 2>/dev/null | wc -l)
          if [ "$COUNT" -gt 0 ]; then
            echo "has-report=true" >> $GITHUB_OUTPUT
            # When merging e2e + integration blobs, playwright rejects blobs recorded
            # with different testDirs (src/tests vs src/integration/tests). Provide a
            # merge config pointing to the common parent directory. Use printf with
            # a single-quoted format string so the JS payload is written verbatim —
            # no backslash escaping, no shell interpolation.
            # Emit HTML (for browsing), JSON (machine-readable), and a compact
            # agent-targeted Markdown summary (LS-7838) that is copied next to
            # index.html so agents can fetch one small file instead of inflating
            # the embedded report.json.
            {
              printf '%s' 'module.exports = { testDir: "apps/web-e2e/src", reporter: ['
              printf '%s' '["html"], ["json", { outputFile: "test-results.json" }], '
              printf '%s\n' '["./apps/web-e2e/src/reporters/agent-md-reporter.ts", { outputFile: "summary.md" }]] };'
            } > playwright.merge.config.js
            pnpm dlx playwright@1.58.2 merge-reports -c playwright.merge.config.js ./all-blob-reports
          else
            echo "has-report=false" >> $GITHUB_OUTPUT
            echo "No blob reports found — skipping deploy"
          fi

      - name: "Rewrite Attachment Paths in test-results.json"
        if: steps.merge.outputs.has-report == 'true'
        run: python3 scripts/rewrite-pw-attachment-paths.py

      - name: "Generate App Token"
        id: app-token
        if: steps.merge.outputs.has-report == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.PREVIEW_APP_ID }}
          private-key: ${{ secrets.PREVIEW_APP_PRIVATE_KEY }}
          repositories: legacy-sports-deploys

      - name: "Deploy Playwright Report"
        if: steps.merge.outputs.has-report == 'true'
        env:
          DEPLOY_TOKEN: ${{ steps.app-token.outputs.token }}
          DEST_DIR: playwright-report/${{ github.event_name == 'schedule' && format('nightly-{0}', github.run_id) || format('manual-{0}', github.run_number) }}
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${DEPLOY_TOKEN}@github.com/bkrupa/legacy-sports-deploys.git"
          WORKSPACE="$(pwd)"
          REPORT_SRC="${WORKSPACE}/playwright-report"

          MAX_RETRIES=7
          for attempt in $(seq 1 $MAX_RETRIES); do
            rm -rf "${WORKSPACE}/_deploy"
            CLONE_OK=false
            for clone_attempt in $(seq 1 3); do
              if git clone --depth 1 --single-branch --branch gh-pages "$REPO_URL" "${WORKSPACE}/_deploy" 2>/dev/null; then
                CLONE_OK=true; break
              fi
              echo "Clone attempt ${clone_attempt} failed — retrying in ${clone_attempt}s..."
              sleep "$clone_attempt"
            done
            if [ "$CLONE_OK" != "true" ]; then
              cd "${WORKSPACE}"
              JITTER=$((RANDOM % 5))
              echo "Clone failed on attempt ${attempt} — retrying in $((attempt * 2 + JITTER))s..."
              sleep $((attempt * 2 + JITTER))
              continue
            fi

            rm -rf "${WORKSPACE}/_deploy/${DEST_DIR}"
            mkdir -p "${WORKSPACE}/_deploy/${DEST_DIR}"
            cp -r "${REPORT_SRC}/." "${WORKSPACE}/_deploy/${DEST_DIR}/"
            [ -f "${WORKSPACE}/test-results.json" ] && cp "${WORKSPACE}/test-results.json" "${WORKSPACE}/_deploy/${DEST_DIR}/test-results.json"
            [ -f "${WORKSPACE}/summary.md" ] && cp "${WORKSPACE}/summary.md" "${WORKSPACE}/_deploy/${DEST_DIR}/summary.md"

            # Prune old nightly/manual reports — keep the 10 most recent of each type
            # so the deploy repo doesn't grow unbounded with scheduled runs.
            # Use find -print0 / sort -z / xargs -0 for safe null-delimited handling.
            if [ -d "${WORKSPACE}/_deploy/playwright-report" ]; then
              cd "${WORKSPACE}/_deploy/playwright-report"
              for prefix in nightly manual; do
                COUNT=$(find . -maxdepth 1 -type d -name "${prefix}-*" 2>/dev/null | wc -l)
                if [ "$COUNT" -gt 10 ]; then
                  echo "Pruning old ${prefix} reports ($COUNT found, keeping 10)..."
                  find . -maxdepth 1 -type d -name "${prefix}-*" -print0 \
                    | sort -zV | head -zn -$((COUNT - 10)) | xargs -0 rm -rf
                fi
              done
              cd "${WORKSPACE}/_deploy"
            fi

            cd "${WORKSPACE}/_deploy"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .

            if git diff --cached --quiet; then
              echo "No changes to deploy"
              exit 0
            fi

            # Squash all history: orphan commit keeps the deploy repo at constant size.
            git checkout --orphan squashed
            git add -A
            git commit -m "deploy ${DEST_DIR}"

            if git push --force origin squashed:gh-pages; then
              echo "Push succeeded (attempt ${attempt})"
              exit 0
            fi

            cd "${WORKSPACE}"
            JITTER=$((RANDOM % 5))
            echo "Push failed (attempt ${attempt}) — retrying in $((attempt * 2 + JITTER))s..."
            sleep $((attempt * 2 + JITTER))
          done

          echo "Push failed after ${MAX_RETRIES} attempts"
          exit 1

      - name: "Print Report URL"
        if: steps.merge.outputs.has-report == 'true'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DEST="nightly-${{ github.run_id }}"
          else
            DEST="manual-${{ github.run_number }}"
          fi
          echo "## Playwright Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Report:** https://bkrupa.github.io/legacy-sports-deploys/playwright-report/$DEST/" >> $GITHUB_STEP_SUMMARY
          echo "**JSON:** https://bkrupa.github.io/legacy-sports-deploys/playwright-report/$DEST/test-results.json" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Surface-map drift audit (LS-7850, detection child of LS-7848)
  # ===========================================================================
  # Consumes the per-shard spec→source-file coverage fragments (LS-7849), unions
  # them across the matrix, and diffs observed coverage against BOTH surface maps
  # (integration-surface-map.json + e2e-surface-map.json from LS-7846):
  #   - UNDER-SELECTION (HIGH): a spec executed a file no glob accounts for —
  #     flagged immediately (the new-source-file onboarding trigger).
  #   - DEAD GLOB (LOW): a glob matched nothing for K consecutive nightlies —
  #     a per-glob miss counter persisted in S3 across runs.
  # Report-only: never mutates a map, never fails a PR (auto-remediation is the
  # downstream LS-7851). Runs on the same conditions that produce fragments:
  # nightly schedule, or manual dispatch with collect-coverage=true.
  audit-coverage:
    name: "Audit Surface-Map Coverage"
    needs: [run-tests, notify-nightly-start]
    if: ${{ !cancelled() && needs.run-tests.result != 'skipped' && (github.event_name == 'schedule' || inputs['collect-coverage']) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # Consumed by the downstream remediate-surface-map job (LS-7851) to decide
      # whether to open/update the auto-remediation PR.
      has-under-selection: ${{ steps.audit.outputs.has-under-selection }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: "Setup Node.js"
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: "Download Coverage Fragments from S3"
        uses: ./.github/actions/s3-artifact
        with:
          mode: download
          name: playwright-coverage
          path: all-coverage-fragments

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6
        with:
          role-to-assume: arn:aws:iam::176661590736:role/legacy-sports-dev-ci-artifacts
          aws-region: us-east-1

      - name: "Run Surface-Map Drift Audit"
        id: audit
        shell: bash
        env:
          # Cross-run dead-glob counters live under the ci-artifacts/ prefix the
          # narrow OIDC role is scoped to (terraform/main/ci-artifacts.tf). The
          # bucket expires every object after 3 days, but the nightly overwrites
          # this key each run, refreshing its last-modified date — so the state
          # survives as long as the nightly runs at least every 3 days. A longer
          # gap simply resets the counters (conservative: it only delays
          # dead-glob flags, never produces a false one).
          STATE_KEY: "s3://legacy-sports-dev-ci-artifacts/ci-artifacts/coverage-audit-state/dead-glob-state.json"
        run: |
          mkdir -p coverage-audit-state
          STATE_IN_ARGS=()
          if aws s3 cp "$STATE_KEY" coverage-audit-state/state.json --quiet 2>/dev/null; then
            echo "Loaded previous dead-glob state."
            STATE_IN_ARGS=(--state-in coverage-audit-state/state.json)
          else
            echo "No previous dead-glob state — counters start fresh."
          fi

          node .github/scripts/coverage-audit/audit-coverage.mjs \
            --fragments-dir all-coverage-fragments \
            --e2e-map apps/web-e2e/src/e2e-surface-map.json \
            --integration-map apps/web-e2e/src/integration/integration-surface-map.json \
            "${STATE_IN_ARGS[@]}" \
            --state-out coverage-audit-state/state.json \
            --k 3 \
            --report-md coverage-audit-report.md \
            --discord-md coverage-audit-discord.md \
            --json coverage-audit.json \
            --github-output >> "$GITHUB_OUTPUT"

          # Persist the updated counters for the next nightly (best-effort — a
          # failed upload must not fail the audit; counters just reset next run).
          if aws s3 cp coverage-audit-state/state.json "$STATE_KEY" --quiet; then
            echo "Persisted dead-glob state."
          else
            echo "::warning::Failed to persist dead-glob state (counters reset next run)."
          fi

          # Full report to the job summary.
          cat coverage-audit-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: "Build Discord Description"
        id: discord
        if: always()
        shell: bash
        run: |
          {
            echo 'description<<EOF_COVERAGE_AUDIT'
            if [ -f coverage-audit-discord.md ]; then
              cat coverage-audit-discord.md
            else
              echo 'Surface-map coverage audit produced no report (no coverage fragments found).'
            fi
            echo 'EOF_COVERAGE_AUDIT'
          } >> "$GITHUB_OUTPUT"

      # Appends to the nightly Discord thread created by notify-nightly-start.
      # Under-selection (HIGH) flips the embed to the failure colour so it stands
      # out; dead globs (LOW) stay informational. This NEVER fails the job.
      - name: "Discord Coverage Audit Results"
        if: always()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_PLAYWRIGHT_WEBHOOK_URL }}
          status: ${{ steps.audit.outputs.has-under-selection == 'true' && 'failure' || 'success' }}
          title: "Surface-Map Coverage Audit"
          description: ${{ steps.discord.outputs.description }}
          thread-id: ${{ needs.notify-nightly-start.outputs.thread-id }}

      # Hand the structured findings to the downstream remediation job — only
      # when there is under-selection to act on, so the bot can read the exact
      # finding list that drove has-under-selection.
      - name: "Upload Coverage Audit Findings"
        if: ${{ steps.audit.outputs.has-under-selection == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-audit-findings
          path: coverage-audit.json
          retention-days: 3
          if-no-files-found: error

  # ===========================================================================
  # Surface-map auto-remediation bot (LS-7851, remediation child of LS-7848)
  # ===========================================================================
  # Closes the loop: turns the auditor's under-selection findings into a
  # reviewable map update. When the audit flags persistent under-selection (a
  # spec exercising source files no glob accounts for — including brand-new,
  # never-mapped files), this job ADDITIVELY adds the missing directory-level
  # globs to the owning surface map(s) and opens — or idempotently UPDATES — a
  # single standing bot PR.
  #
  # Safety, by construction:
  #   - Additive-only: never removes or narrows a glob (dead-glob pruning stays a
  #     manual human decision; removal risks silently reintroducing under-selection).
  #   - NEVER auto-merges and applies no merge label — reviewed/merged by a human.
  #   - Idempotent: the branch is force-derived from main + the current findings
  #     each run, refreshing the one open PR rather than spawning duplicates.
  remediate-surface-map:
    name: "Remediate Surface-Map Drift (PR)"
    needs: [audit-coverage]
    if: ${{ !cancelled() && needs.audit-coverage.result == 'success' && needs.audit-coverage.outputs.has-under-selection == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      REMEDIATION_BRANCH: bot/surface-map-remediation
      E2E_MAP: apps/web-e2e/src/e2e-surface-map.json
      INTEGRATION_MAP: apps/web-e2e/src/integration/integration-surface-map.json
    steps:
      - name: "Checkout main"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          fetch-depth: 1

      - name: "Setup Node.js"
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: "Download Coverage Audit Findings"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-audit-findings
          path: audit-findings

      # Bot App token so the branch push triggers PR CI (the default GITHUB_TOKEN
      # would suppress downstream workflow runs). Same app identity as the other
      # bot workflows.
      - name: "Generate bot app token"
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.REVIEWER_BOT_APP_ID || '3142924' }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: "Apply additive remediation to surface maps"
        id: remediate
        shell: bash
        run: |
          node .github/scripts/coverage-audit/remediate-surface-map.mjs \
            --audit-json audit-findings/coverage-audit.json \
            --e2e-map "$E2E_MAP" \
            --integration-map "$INTEGRATION_MAP" \
            --write \
            --pr-body-out remediation-pr-body.md \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --github-output >> "$GITHUB_OUTPUT"

      - name: "Open or update the remediation PR"
        if: ${{ steps.remediate.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        shell: bash
        run: |
          git config user.name "legacy-sports-code-bot[bot]"
          git config user.email "270182682+legacy-sports-code-bot[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"

          # Re-derive the branch from main + the night's full finding set, so the
          # single standing PR is refreshed in place (idempotent) rather than
          # accumulating stale diffs or spawning duplicates.
          git checkout -B "$REMEDIATION_BRANCH"
          git add "$E2E_MAP" "$INTEGRATION_MAP"

          if git diff --cached --quiet; then
            echo "Maps already cover the flagged files on main — nothing to propose."
            exit 0
          fi

          # No Jira key in the title/commit/branch on purpose: this is a recurring
          # operational PR, and a key would make Jira Branch Sync re-transition
          # the implementing ticket (LS-7851) every night.
          COMMIT_MSG="chore(web-e2e): auto-sync surface-map globs for under-selected specs"
          git commit -m "$COMMIT_MSG"
          git push --force origin "$REMEDIATION_BRANCH"

          EXISTING=$(gh pr list --head "$REMEDIATION_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            # Keep the description in sync with the night's findings — the body
            # file is capped under GitHub's 64 KB body limit by the generator.
            gh pr edit "$EXISTING" --body-file remediation-pr-body.md
            echo "Refreshed existing remediation PR #$EXISTING (force-pushed branch + body)."
          else
            gh pr create \
              --title "$COMMIT_MSG" \
              --body-file remediation-pr-body.md \
              --head "$REMEDIATION_BRANCH" \
              --base main
            echo "Opened new remediation PR."
          fi

  # ---------------------------------------------------------------------------
  # Discord notification — fires after tests finish (schedule + manual dispatch)
  # ---------------------------------------------------------------------------
  notify-nightly-finish:
    name: "Nightly Results"
    needs: [run-tests, deploy-report, notify-nightly-start]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: "Resolve Status"
        id: status
        shell: bash
        run: |
          TESTS_RESULT="${{ needs.run-tests.result }}"

          # Treat skipped/cancelled as failure — the nightly suite should always run
          case "$TESTS_RESULT" in
            success) STATUS="success" ;;
            failure) STATUS="failure" ;;
            *) STATUS="failure" ;;
          esac

          if [ "$STATUS" != "success" ]; then
            echo "content=<@205483185893670912>" >> "$GITHUB_OUTPUT"
          else
            echo "content=" >> "$GITHUB_OUTPUT"
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          # Build test run summary
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs['test-suite'] }}" = "all" ]; then
            SUMMARY_LINE1="**Suite:** Integration (real server, sharded) + E2E (3 shards) + Shared-live (1 shard)"
            SUMMARY_LINE2="**Browser:** chromium · **Workers:** e2e 4 / integration 1 / shared-live 1 · **Retries:** e2e 2 / integration 0 / shared-live 0"
            SUMMARY_LINE3="**Filters:** none — all tests including @slow"
          else
            SUITE="${{ inputs['test-suite'] || 'e2e' }}"
            BROWSER="${{ inputs.browser || 'chromium' }}"
            SHARDS="${{ inputs['shard-total'] || '2' }}"
            WORKERS="${{ inputs.workers || '4' }}"
            RETRIES="${{ inputs.retries || '2' }}"
            GREP="${{ inputs['test-grep'] || '(all)' }}"
            GREP_INV="${{ inputs['test-grep-invert'] || '(none)' }}"
            FILE="${{ inputs['test-file'] }}"
            SUMMARY_LINE1="**Suite:** ${SUITE} · **Browser:** ${BROWSER}"
            SUMMARY_LINE2="**Shards:** ${SHARDS} · **Workers:** ${WORKERS} · **Retries:** ${RETRIES}"
            SUMMARY_LINE3="**Grep:** ${GREP} · **Exclude:** ${GREP_INV} · **File:** ${FILE:-all files}"
          fi

          HAS_REPORT="${{ needs.deploy-report.outputs.has-report }}"
          REPORT_BASE="https://bkrupa.github.io/legacy-sports-deploys"
          if [ "$HAS_REPORT" = "true" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              DEST="nightly-${{ github.run_id }}"
            else
              DEST="manual-${{ github.run_number }}"
            fi
            REPORT_URL="${REPORT_BASE}/playwright-report/${DEST}/"
            {
              echo 'description<<EOF_PLAYWRIGHT_NOTIFY'
              echo "**[📊 Playwright Report](${REPORT_URL})**"
              echo ""
              echo "$SUMMARY_LINE1"
              echo "$SUMMARY_LINE2"
              echo "$SUMMARY_LINE3"
              if [ "$STATUS" != "success" ]; then
                echo ""
                echo "**Debug:** \`/read-playwright-report ${DEST}\` in Claude Code"
              fi
              echo 'EOF_PLAYWRIGHT_NOTIFY'
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'description<<EOF_PLAYWRIGHT_NOTIFY'
              echo "No test report available (no blob reports were uploaded)."
              echo ""
              echo "$SUMMARY_LINE1"
              echo "$SUMMARY_LINE2"
              echo "$SUMMARY_LINE3"
              echo 'EOF_PLAYWRIGHT_NOTIFY'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: "Discord Playwright Results"
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_PLAYWRIGHT_WEBHOOK_URL }}
          status: ${{ steps.status.outputs.status }}
          title: "${{ github.event_name == 'schedule' && 'Nightly Playwright Suite — Results' || 'Manual Playwright Suite — Results' }}"
          description: ${{ steps.status.outputs.description }}
          content: ${{ steps.status.outputs.content }}
          thread-id: ${{ needs.notify-nightly-start.outputs.thread-id }}
