name: Upload Lambdas

# Consolidated Lambda upload workflow — replaces 8 individual upload-*.yml files.
# Uses nx affected to only build lambdas that actually changed, then uploads each
# to S3 in parallel via matrix strategy. The central Terraform workflow applies
# infrastructure changes after this completes.

on:
  workflow_dispatch:
    inputs:
      lambda:
        description: "Specific lambda to build (blank = all)"
        required: false
        type: choice
        options:
          - ""
          - db
          - stats-lambda
          - draft-processor
          - game-selection
          - jira-proxy
          - oauth-proxy
          - rollbar-discord
          - stripe-webhook
          - websocket
      skip-ci-check:
        description: "Skip CI status verification (emergency deploys only)"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "lambdas/**"
      - "lib/**"
      - ".github/workflows/upload-lambdas.yml"

env:
  AWS_REGION: us-east-1
  AWS_STAGE: dev

permissions:
  actions: read
  id-token: write
  contents: read

# ---------------------------------------------------------------------------
# Job 0 — Verify CI pipeline passed for this commit
# ---------------------------------------------------------------------------
jobs:
  verify-ci:
    name: Verify CI Status
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    if: >-
      !(github.event_name == 'workflow_dispatch' &&
        github.event.inputs.skip-ci-check == 'true')
    timeout-minutes: 5
    steps:
      - name: Check CI Pipeline Status
        uses: actions/github-script@v8
        with:
          script: |
            const sha = context.sha;
            core.info(`Checking CI status for commit ${sha}`);

            const { data: workflowRuns } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: sha,
              status: 'completed',
            });

            const ciRun = workflowRuns.workflow_runs.find(run =>
              run.name === '🧠 Legacy Sports CI Orchestrator' ||
              run.name === 'Legacy Sports CI Pipeline'
            );

            if (!ciRun) {
              const { data: allRuns } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: sha,
              });

              const pendingCi = allRuns.workflow_runs.find(run =>
                (run.name === '🧠 Legacy Sports CI Orchestrator' ||
                 run.name === 'Legacy Sports CI Pipeline') &&
                run.status !== 'completed'
              );

              if (pendingCi) {
                core.setFailed(
                  `CI pipeline is still running for ${sha} (status: ${pendingCi.status}). ` +
                  `Wait for CI to complete before uploading. Run: ${pendingCi.html_url}`
                );
              } else {
                core.setFailed(
                  `No CI pipeline run found for commit ${sha}. ` +
                  `CI must pass before uploading lambdas. ` +
                  `Use workflow_dispatch with skip-ci-check=true to bypass.`
                );
              }
              return;
            }

            core.info(`Found CI run: ${ciRun.name} (#${ciRun.run_number})`);
            core.info(`Conclusion: ${ciRun.conclusion}`);

            if (ciRun.conclusion !== 'success') {
              core.setFailed(
                `CI pipeline did not succeed for ${sha} (conclusion: ${ciRun.conclusion}). ` +
                `Fix CI failures before uploading lambdas. Run: ${ciRun.html_url}`
              );
            } else {
              core.info(`CI pipeline passed for ${sha} — proceeding with upload`);
            }

  # ---------------------------------------------------------------------------
  # Job 1 — Detect which lambdas need building
  # ---------------------------------------------------------------------------
  detect:
    name: Detect Affected Lambdas
    needs: [verify-ci]
    if: always() && (needs.verify-ci.result == 'success' || needs.verify-ci.result == 'skipped')
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-lambdas: ${{ steps.set-matrix.outputs.has-lambdas }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true

      - name: Detect affected lambdas
        id: set-matrix
        run: |
          # Full registry of deployable lambdas.
          # Fields: project  (Nx name)
          #         dir      (directory under lambdas/)
          #         s3Prefix (S3 key prefix)
          #         ssmName  (SSM parameter path segment)
          #         badgeName(display name for badge / summary)
          #         distPath (build artifact directory, relative to repo root)
          #         rollbar  (pass ROLLBAR_ACCESS_TOKEN to build)
          REGISTRY='[
            {
              "project":"db", "dir":"db",
              "s3Prefix":"graphql", "ssmName":"graphql",
              "badgeName":"Upload GraphQL Lambda",
              "distPath":"lambdas/db/dist", "rollbar":true
            },
            {
              "project":"stats-lambda", "dir":"stats-lambda",
              "s3Prefix":"stats", "ssmName":"stats",
              "badgeName":"Upload Stats Lambda",
              "distPath":"lambdas/stats-lambda/dist", "rollbar":true
            },
            {
              "project":"draft-processor", "dir":"draft-processor",
              "s3Prefix":"draft-processor", "ssmName":"draft-processor",
              "badgeName":"Upload Draft Processor Lambda",
              "distPath":"lambdas/draft-processor/dist", "rollbar":true
            },
            {
              "project":"game-selection", "dir":"game-selection",
              "s3Prefix":"game-selection", "ssmName":"game-selection",
              "badgeName":"Upload Game Selection Lambda",
              "distPath":"lambdas/game-selection/dist", "rollbar":true
            },
            {
              "project":"jira-proxy", "dir":"jira-proxy",
              "s3Prefix":"jira-proxy", "ssmName":"jira-proxy",
              "badgeName":"Upload Jira Proxy Lambda",
              "distPath":"lambdas/jira-proxy/dist", "rollbar":false
            },
            {
              "project":"oauth-proxy", "dir":"oauth-proxy",
              "s3Prefix":"oauth-proxy", "ssmName":"oauth-proxy",
              "badgeName":"Upload OAuth Proxy Lambda",
              "distPath":"lambdas/oauth-proxy/dist", "rollbar":true
            },
            {
              "project":"rollbar-discord", "dir":"rollbar-discord",
              "s3Prefix":"rollbar-discord", "ssmName":"rollbar-discord",
              "badgeName":"Upload Rollbar Discord Lambda",
              "distPath":"lambdas/rollbar-discord/dist", "rollbar":true
            },
            {
              "project":"stripe-webhook", "dir":"stripe-webhook",
              "s3Prefix":"stripe-webhook", "ssmName":"stripe-webhook",
              "badgeName":"Upload Stripe Webhook Lambda",
              "distPath":"lambdas/stripe-webhook/dist", "rollbar":true
            },
            {
              "project":"websocket", "dir":"websocket",
              "s3Prefix":"websocket", "ssmName":"websocket",
              "badgeName":"Upload WebSocket Lambda",
              "distPath":"dist/lambdas/websocket", "rollbar":true
            }
          ]'

          if [ -n "${{ inputs.lambda }}" ]; then
            echo "🔧 Manual dispatch: building ${{ inputs.lambda }}"
            MATRIX=$(echo "$REGISTRY" | jq -c "[.[] | select(.project == \"${{ inputs.lambda }}\")]")
          else
            echo "🔍 Detecting affected lambda projects..."
            AFFECTED_RAW=$(pnpm exec nx show projects --affected --type app 2>/dev/null || echo "")
            echo "Affected projects: $AFFECTED_RAW"

            # Filter registry to only affected lambda projects
            MATRIX=$(echo "$REGISTRY" | jq -c --arg affected "$AFFECTED_RAW" '
              ($affected | split("\n") | map(select(. != ""))) as $list |
              [.[] | select(.project as $p | $list | index($p))]
            ')
          fi

          HAS=$(echo "$MATRIX" | jq 'length > 0')
          echo "matrix={\"lambda\":$MATRIX}" >> "$GITHUB_OUTPUT"
          echo "has-lambdas=$HAS" >> "$GITHUB_OUTPUT"
          echo "📋 Lambdas to build: $(echo "$MATRIX" | jq -r '[ .[].project ] | join(", ")')"

  # ---------------------------------------------------------------------------
  # Job 2 — Build, package, and upload each affected lambda
  # ---------------------------------------------------------------------------
  upload:
    name: ${{ matrix.lambda.badgeName }}
    needs: detect
    if: needs.detect.outputs.has-lambdas == 'true'
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::176661590736:role/legacy-sports-dev-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Build Lambda
        env:
          NODE_ENV: production
          ROLLBAR_ACCESS_TOKEN: ${{ matrix.lambda.rollbar && secrets.ROLLBAR_ACCESS_TOKEN || '' }}
        run: |
          set -o pipefail
          echo "🔨 Building ${{ matrix.lambda.badgeName }}..."

          if pnpm exec nx run ${{ matrix.lambda.project }}:build 2>&1 | tee build.log; then
            echo "✅ Build successful"
          else
            echo "❌ Build failed"
            echo "## Build Errors" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -20 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Package and Upload to S3
        run: |
          echo "📦 Creating Lambda deployment package..."

          # Create version string
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          COMMIT_SHA=$(echo "$GITHUB_SHA" | cut -c1-8)
          VERSION="${TIMESTAMP}-${COMMIT_SHA}"
          echo "Version: $VERSION"

          DIST_PATH="${{ matrix.lambda.distPath }}"
          S3_PREFIX="${{ matrix.lambda.s3Prefix }}"
          ZIP_NAME="${S3_PREFIX}-${VERSION}.zip"

          # Create deployment package from built artifacts
          (cd "$DIST_PATH" && zip -r "${GITHUB_WORKSPACE}/${ZIP_NAME}" .)

          # Get S3 bucket name from SSM parameter store
          echo "🔍 Getting S3 bucket name from SSM..."
          if S3_BUCKET=$(aws ssm get-parameter \
            --name "/legacy-sports/${AWS_STAGE}/s3/lambda-deployments-bucket" \
            --query "Parameter.Value" \
            --output text \
            --region ${{ env.AWS_REGION }} 2>/dev/null); then
            echo "✅ Found S3 bucket: $S3_BUCKET"
          else
            echo "⚠️ SSM parameter not found, using default bucket name"
            S3_BUCKET="legacy-sports-dev-lambdas-cca20ad9"
          fi

          # Upload to S3
          echo "⬆️  Uploading to S3..."
          aws s3 cp "${ZIP_NAME}" \
            "s3://${S3_BUCKET}/${S3_PREFIX}/${ZIP_NAME}" \
            --region ${{ env.AWS_REGION }}

          echo "✅ Upload complete: s3://${S3_BUCKET}/${S3_PREFIX}/${ZIP_NAME}"

          # Save for next step
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "S3_BUCKET=${S3_BUCKET}" >> "$GITHUB_ENV"
          echo "S3_KEY=${S3_PREFIX}/${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Update SSM Parameter
        env:
          VERSION: ${{ env.VERSION }}
          S3_KEY: ${{ env.S3_KEY }}
        run: |
          echo "📝 Updating SSM parameter with new version..."

          aws ssm put-parameter \
            --name "/legacy-sports/${AWS_STAGE}/lambda/${{ matrix.lambda.ssmName }}/version" \
            --value "${VERSION}" \
            --overwrite \
            --region ${{ env.AWS_REGION }}

          echo "✅ SSM parameter updated"

          echo "## 📦 Lambda Upload Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Lambda**: ${{ matrix.lambda.ssmName }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: \`${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Location**: \`${S3_KEY}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Next Step**: Central Terraform workflow will apply infrastructure changes" >> $GITHUB_STEP_SUMMARY

      - name: Summary
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          echo "::notice::✅ ${{ matrix.lambda.badgeName }} uploaded successfully"
          echo "::notice::Version: ${VERSION}"
          echo "::notice::Waiting for Terraform workflow to apply infrastructure..."

      - name: Update Deployment Badge
        if: always()
        uses: ./.github/actions/update-deployment-badge
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          gist-id: ${{ secrets.CI_BADGES_GIST_ID }}
          deployment-name: ${{ matrix.lambda.badgeName }}
          deployment-status: ${{ job.status }}
          workflow-run-id: ${{ github.run_id }}
          branch: ${{ github.ref_name }}
