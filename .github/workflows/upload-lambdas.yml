name: Upload Lambdas

# Consolidated Lambda upload workflow — replaces 8 individual upload-*.yml files.
# Uses nx affected to only build lambdas that actually changed, then builds and
# uploads all of them to S3 from ONE job (single checkout + install; LS-10335
# collapsed the former one-job-per-lambda matrix — see the `upload` job for
# the per-lambda status contract). The central Terraform workflow applies
# infrastructure changes after this completes.
#
# Triggering:
#   - Primary: called from the umbrella Deploy workflow via workflow_call
#     (push to main is handled there so all deploys report under a single run)
#   - Manual: workflow_dispatch for targeted one-off deploys

on:
  workflow_call:
    inputs:
      lambda:
        description: "Specific lambda to build (blank = all affected)"
        required: false
        type: string
        default: ""
      force-all:
        description: "Force build and deploy all lambdas, bypassing nx affected detection"
        required: false
        default: false
        type: boolean
      skip-ci-check:
        description: "Skip CI status verification (emergency deploys only)"
        required: false
        default: false
        type: boolean
    outputs:
      results:
        description: "Per-lambda upload status as a JSON map { project: success | build-failed | upload-failed | built | not-run } (LS-10335)"
        value: ${{ jobs.upload.outputs.results }}
      uploaded:
        description: "Comma-separated nx project names whose upload succeeded"
        value: ${{ jobs.upload.outputs.uploaded }}
      failed:
        description: "Comma-separated nx project names that did not reach a successful upload"
        value: ${{ jobs.upload.outputs.failed }}
  workflow_dispatch:
    inputs:
      lambda:
        description: "Specific lambda to build (blank = all affected)"
        required: false
        type: choice
        options:
          - ""
          - db
          - stats-lambda
          - draft-processor
          - game-selection
          - image-upload
          - jira-proxy
          - oauth-proxy
          - rollbar-discord
          - stripe-webhook
          - websocket
          - github-webhook
          - notifications
          - mcp-jira-server
          - mcp-github-server
          - mcp-ci-server
          - mcp-db-admin-server
          - mcp-rollbar-server
          - mcp-discord-server
      force-all:
        description: "Force build and deploy all lambdas, bypassing nx affected detection"
        required: false
        default: false
        type: boolean
      run-ci-first:
        description: "Trigger CI pipeline and wait for it to pass before deploying (use when no CI run exists for HEAD)"
        required: false
        default: false
        type: boolean
      skip-ci-check:
        description: "Skip CI status verification (emergency deploys only)"
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: us-east-1
  AWS_STAGE: dev

permissions:
  actions: read
  id-token: write
  contents: read
  pull-requests: read # Required for listPullRequestsAssociatedWithCommit in verify-ci
  statuses: read # Required to read the `CI Gate` commit status in verify-ci (LS-9378)

# ---------------------------------------------------------------------------
# Job 0a — Optionally trigger CI and wait for it to pass
# ---------------------------------------------------------------------------
jobs:
  trigger-ci:
    name: Trigger CI Pipeline
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    if: github.event_name == 'workflow_dispatch' && inputs['run-ci-first'] == true && inputs['skip-ci-check'] != true
    timeout-minutes: 60
    permissions:
      actions: write # dispatch ci-orchestrator on demand
    steps:
      - name: Dispatch CI and wait
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const ref = context.ref;

            core.info(`Dispatching CI Orchestrator on ref ${ref} (SHA ${sha})`);

            const dispatchedAt = new Date();

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'ci-orchestrator.yml',
              ref,
            });

            core.info('Dispatch sent. Polling for run to appear and complete (timeout: 60 min)...');

            const deadline = Date.now() + 60 * 60 * 1000;
            let ciRun = null;

            while (Date.now() < deadline) {
              await new Promise(r => setTimeout(r, 30000));

              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'ci-orchestrator.yml',
                head_sha: sha,
                created: `>=${dispatchedAt.toISOString()}`,
              });

              const matchingRuns = data.workflow_runs
                .filter(r => r.event === 'workflow_dispatch' && new Date(r.created_at) >= dispatchedAt)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              const run = matchingRuns[0];
              if (!run) {
                core.info('No matching workflow_dispatch CI run visible yet, waiting...');
                continue;
              }

              if (run.status !== 'completed') {
                core.info(`CI run in progress (status: ${run.status}). Run: ${run.html_url}`);
                continue;
              }

              ciRun = run;
              break;
            }

            if (!ciRun) {
              core.setFailed('Timed out waiting for CI pipeline to complete after 60 minutes.');
              return;
            }

            core.info(`CI run completed with conclusion: ${ciRun.conclusion}. Run: ${ciRun.html_url}`);

            if (ciRun.conclusion !== 'success') {
              core.setFailed(
                `CI pipeline failed (conclusion: ${ciRun.conclusion}). Fix CI before deploying. Run: ${ciRun.html_url}`
              );
            }

  # ---------------------------------------------------------------------------
  # Job 0b — Verify CI pipeline passed for this commit
  # ---------------------------------------------------------------------------
  verify-ci:
    name: Verify CI Status
    needs: [trigger-ci]
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    # LS-9600: this job's own result (not merely whether it runs) is the single
    # signal `detect` gates on, so it must run whenever a check is required —
    # including when trigger-ci failed — rather than being skipped in that case.
    # A skipped verify-ci must mean exactly one thing: no check was requested.
    if: always() && inputs['skip-ci-check'] != true
    timeout-minutes: 5
    steps:
      - name: Check Trigger CI Pipeline Result
        if: needs.trigger-ci.result == 'failure'
        run: |
          echo "::error::Trigger CI Pipeline failed — CI was not verified for this commit. Fix CI before deploying, or use skip-ci-check=true to bypass (not recommended)."
          exit 1

      - name: Check CI Pipeline Status
        if: needs.trigger-ci.result != 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            let sha = context.sha;
            core.info(`Checking CI status for commit ${sha}`);

            // For push events (squash merges), CI ran on the PR head SHA, not
            // the post-merge commit. Resolve the associated PR to find the
            // correct SHA to check.
            if (context.eventName === 'push') {
              const { data: associatedPRs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: sha,
              });
              const mergedPR = associatedPRs.find(pr => pr.merged_at);
              if (mergedPR) {
                sha = mergedPR.head.sha;
                core.info(`Push event: resolved merged PR #${mergedPR.number}, using PR head SHA ${sha}`);
              } else {
                core.info(`Push event: no merged PR found, using commit SHA ${sha}`);
              }
            }

            // LS-9378: the MERGE gate evaluates the `CI Gate` commit status
            // (.github/ruleset.json, posted by .github/scripts/ci-gate.js), so
            // the DEPLOY gate must evaluate the same signal — otherwise the two
            // readers disagree by construction, in both directions:
            //   - A run whose only cancelled job is non-gating (e.g. "Deploy
            //     Playwright Report" under concurrency-cancel) concludes
            //     `cancelled`, so a perfectly healthy SHA has no `success` run
            //     and the `?? find(isCI)` fallback below picks an arbitrary red
            //     one, blocking a deploy CI actually passed.
            //   - Conversely a red run for a SHA whose gate is green blocked the
            //     upload after branch protection had already allowed the merge
            //     (observed on PR #7006 / Deploy run 31620270238).
            const CI_GATE_CONTEXT = 'CI Gate';

            const { data: commitStatuses } = await github.rest.repos.listCommitStatusesForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              per_page: 100,
            });

            // listCommitStatusesForRef returns newest-first, so the first entry
            // for a context is the effective latest-wins verdict — the very one
            // GitHub's ruleset evaluator gates the merge on.
            const gate = commitStatuses.find(s => s.context === CI_GATE_CONTEXT);

            if (gate) {
              core.info(`Found ${CI_GATE_CONTEXT}: ${gate.state} — ${gate.description || '(no description)'}`);
              if (gate.state === 'success') {
                core.info(`${CI_GATE_CONTEXT} passed for ${sha} — proceeding with upload`);
              } else {
                core.setFailed(
                  `${CI_GATE_CONTEXT} did not pass for ${sha} (state: ${gate.state}). ` +
                  `${gate.description || ''} Run: ${gate.target_url || 'n/a'}`
                );
              }
              return;
            }

            // The gate is PR-scoped, so its absence is expected only for commits
            // with no associated PR. Fall back to the historical run-conclusion
            // check rather than hard-failing those.
            core.warning(
              `No ${CI_GATE_CONTEXT} status found for ${sha} — falling back to ` +
              `workflow-run conclusions.`
            );

            const { data: workflowRuns } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: sha,
              status: 'completed',
            });

            const isCI = run =>
              run.name === 'Legacy Sports CI Orchestrator' ||
              run.name === 'Legacy Sports CI Pipeline';

            // Prefer the run that actually succeeded — the orchestrator emits two
            // runs per PR SHA (pull_request → skipped, pull_request_review → real).
            // A plain .find() returns whichever the API lists first, which may be
            // the skipped run even when CI passed.
            const ciRun =
              workflowRuns.workflow_runs.find(run => isCI(run) && run.conclusion === 'success') ??
              workflowRuns.workflow_runs.find(run => isCI(run));

            if (!ciRun) {
              const { data: allRuns } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: sha,
              });

              const pendingCi = allRuns.workflow_runs.find(run =>
                (run.name === 'Legacy Sports CI Orchestrator' ||
                 run.name === 'Legacy Sports CI Pipeline') &&
                run.status !== 'completed'
              );

              if (pendingCi) {
                core.setFailed(
                  `CI pipeline is still running for ${sha} (status: ${pendingCi.status}). ` +
                  `Wait for CI to complete before uploading. Run: ${pendingCi.html_url}`
                );
              } else {
                core.setFailed(
                  `No CI pipeline run found for commit ${sha}. ` +
                  `CI must pass before uploading lambdas. ` +
                  `Dispatch the "Deploy" workflow (deploy.yml) with skip-ci-check=true to bypass ` +
                  `(the documented umbrella entry point — it forwards this input here), or dispatch ` +
                  `this workflow (upload-lambdas.yml) directly with skip-ci-check=true.`
                );
              }
              return;
            }

            core.info(`Found CI run: ${ciRun.name} (#${ciRun.run_number})`);
            core.info(`Conclusion: ${ciRun.conclusion}`);

            if (ciRun.conclusion !== 'success') {
              core.setFailed(
                `CI pipeline did not succeed for ${sha} (conclusion: ${ciRun.conclusion}). ` +
                `Fix CI failures before uploading lambdas. Run: ${ciRun.html_url}`
              );
            } else {
              core.info(`CI pipeline passed for ${sha} — proceeding with upload`);
            }

  # ---------------------------------------------------------------------------
  # Job 1 — Detect which lambdas need building
  # ---------------------------------------------------------------------------
  detect:
    name: Detect Affected Lambdas
    needs: [verify-ci]
    if: always() && (needs.verify-ci.result == 'success' || needs.verify-ci.result == 'skipped')
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    # 15, not 5 (LS-10366): this job runs 2 min on a warm runner and 5m25s on
    # a cold one, so a 5-minute limit sat inside its normal range. A timeout
    # here cancels the whole Deploy — no retry, no lambda upload, and a
    # "cancelled" run that nothing alerts on.
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-lambdas: ${{ steps.set-matrix.outputs.has-lambdas }}

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true

      # Read access to the lambdas last-deployed marker (LS-10369), which only
      # the nx-affected path below consults. Fail-open: without credentials the
      # marker read comes back unreadable and detection falls back to NX_BASE.
      - name: Configure AWS credentials
        if: inputs.lambda == '' && inputs['force-all'] != true
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::176661590736:role/legacy-sports-dev-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Detect affected lambdas
        id: set-matrix
        run: |
          # Full registry of deployable lambdas — single source of truth
          # shared with lambda-drift-check.yml (LS-8716). See
          # .github/lambda-registry.json for field docs.
          REGISTRY=$(jq -c '[.[] | del(.driftMonitored)]' "$GITHUB_WORKSPACE/.github/lambda-registry.json")

          if [ -n "${{ inputs.lambda }}" ]; then
            echo "🔧 Manual dispatch: building ${{ inputs.lambda }}"
            MATRIX=$(echo "$REGISTRY" | jq -c "[.[] | select(.project == \"${{ inputs.lambda }}\")]")
          elif [ "${{ inputs['force-all'] }}" = "true" ]; then
            echo "🚀 Force-all: building every registered lambda"
            MATRIX=$(echo "$REGISTRY" | jq -c '.')
          else
            echo "🔍 Detecting affected lambda projects..."

            # Base on the SHA lambdas were last DEPLOYED from (LS-10369) —
            # the `last-deployed/lambdas` marker deploy.yml advances only
            # after upload AND apply both succeed — rather than NX_BASE, the
            # last successful workflow run. The two diverge whenever a Deploy
            # is cancelled or fails: NX_BASE can sit past commits that never
            # shipped, so `nx affected` no longer sees them and their lambda
            # code is stranded with every run green.
            #
            # NX_BASE is the fallback when no marker is usable, with its
            # guards intact: in a workflow_call context nrwl/nx-set-shas
            # resolves against the *calling* workflow and may leave NX_BASE
            # unset or equal to HEAD (`nx affected` then finds nothing), and
            # two quick merges can hand back a SHA that is not an ancestor of
            # HEAD (`nx affected` dies on "bad object"). Each of those falls
            # back to HEAD~1 — every push is one squash merge. The resolution
            # is resolveLambdaBase() in .github/scripts/deploy-markers.mjs.
            EFFECTIVE_BASE=$(node "$GITHUB_WORKSPACE/.github/scripts/deploy-markers.mjs" lambda-base || echo "")
            if [ -z "$EFFECTIVE_BASE" ]; then
              echo "⚠️ Could not resolve a base — falling back to HEAD~1"
              EFFECTIVE_BASE="HEAD~1"
            fi
            # Export so the nx CLI reads the resolved value rather than the
            # original NX_BASE env var set by nrwl/nx-set-shas.
            export NX_BASE="$EFFECTIVE_BASE"
            echo "Using NX_BASE=$EFFECTIVE_BASE for affected detection"

            if ! AFFECTED_RAW=$(pnpm exec nx show projects --affected --base="$EFFECTIVE_BASE" --head=HEAD --type app 2>&1); then
              echo "::error::nx affected detection failed — aborting to prevent silent no-op deploy"
              echo "$AFFECTED_RAW"
              exit 1
            fi
            echo "Affected projects: $AFFECTED_RAW"

            # `nx affected` can't flag a project that didn't exist at NX_BASE,
            # so a PR that introduces a brand-new lambda gets a free pass on
            # the very commit that introduces it. Terraform then tries to
            # create the new function against the placeholder SSM version
            # ("initial") and fails with S3 NoSuchKey. Union AFFECTED_RAW with
            # any registry project whose project.json was *added* between
            # EFFECTIVE_BASE and HEAD.
            ADDED_PROJECT_JSONS=$(git diff --name-status --diff-filter=A "$EFFECTIVE_BASE" HEAD -- '*/project.json' 2>/dev/null | awk '{print $2}')
            NEW_PROJECTS=$(echo "$REGISTRY" | jq -r --arg added "$ADDED_PROJECT_JSONS" '
              ($added | split("\n") | map(select(. != ""))) as $paths |
              [
                .[] | . as $entry |
                (if ($entry.dir | contains("/")) then $entry.dir else "lambdas/" + $entry.dir end) as $projDir |
                select($paths | index($projDir + "/project.json")) | $entry.project
              ] | unique | .[]
            ')
            if [ -n "$NEW_PROJECTS" ]; then
              echo "➕ New projects (since NX_BASE): $(echo "$NEW_PROJECTS" | paste -sd, -)"
              AFFECTED_RAW=$(printf '%s\n%s\n' "$AFFECTED_RAW" "$NEW_PROJECTS" | awk 'NF && !seen[$0]++')
            fi

            # Filter registry to only affected lambda projects
            MATRIX=$(echo "$REGISTRY" | jq -c --arg affected "$AFFECTED_RAW" '
              ($affected | split("\n") | map(select(. != ""))) as $list |
              [.[] | select(.project as $p | $list | index($p))]
            ')
          fi

          HAS=$(echo "$MATRIX" | jq 'length > 0')
          echo "matrix={\"lambda\":$MATRIX}" >> "$GITHUB_OUTPUT"
          echo "has-lambdas=$HAS" >> "$GITHUB_OUTPUT"
          echo "📋 Lambdas to build: $(echo "$MATRIX" | jq -r '[ .[].project ] | join(", ")')"

  # ---------------------------------------------------------------------------
  # Job 2 — Build, package, and upload every affected lambda in ONE job
  # ---------------------------------------------------------------------------
  # LS-10335: this was a per-lambda matrix — one self-hosted job per affected
  # lambda (~15–18 on a lambda-touching merge), each paying its own checkout +
  # pnpm install (~3 min) for a ~30 s build + upload. A lambda-touching Deploy
  # cost 60–75 runner-minutes (Sept 9: ~10 such deploys = 773 min). Now one
  # checkout + one install serves every lambda: all affected projects build
  # via a single `nx run-many` (3-wide, nx-cached), then package/upload runs
  # per lambda in a loop.
  #
  # Per-lambda status is preserved, surfaced differently:
  #   - each lambda's build and upload outcome is recorded independently, so a
  #     failed lambda never blocks the others (the old `fail-fast: false`)
  #   - the `results` output is a JSON map { project: status } with status one
  #     of success | build-failed | upload-failed | built | not-run, plus
  #     `uploaded` / `failed` comma-separated project lists — exposed as
  #     workflow_call outputs and rendered per lambda by deploy.yml's Rollup
  #     Status
  #   - one ::notice:: / ::error:: annotation per lambda and a per-lambda table
  #     in the step summary
  #   - the job fails iff at least one lambda failed, so deploy.yml's
  #     `needs.upload-lambdas.result` gates (Apply Lambda Infrastructure,
  #     Deploy Web, Build Android, Rollup Status) are unchanged.
  upload:
    name: Upload Lambdas
    needs: detect
    # always() is required to break the skip-chain poison: when verify-ci is
    # skipped (skip-ci-check=true), GitHub Actions auto-skips all transitive
    # dependents unless they use always(). The detect.result check ensures we
    # only run when detect actually succeeded.
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.has-lambdas == 'true'
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    # Was 15 min per lambda job; one job now covers up to all 18 (force-all).
    timeout-minutes: 40
    outputs:
      results: ${{ steps.report.outputs.results }}
      uploaded: ${{ steps.report.outputs.uploaded }}
      failed: ${{ steps.report.outputs.failed }}

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::176661590736:role/legacy-sports-dev-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Build affected lambdas
        env:
          NODE_ENV: production
          LAMBDAS_MATRIX: ${{ needs.detect.outputs.matrix }}
          # Deliberately NOT exported as ROLLBAR_ACCESS_TOKEN: the matrix job
          # only exposed the token to lambdas flagged `rollbar: true` in the
          # registry, so the two build groups below set it per invocation.
          ROLLBAR_TOKEN_SECRET: ${{ secrets.ROLLBAR_ACCESS_TOKEN }}
        run: |
          set -o pipefail

          # Working files shared by the build / upload / report steps.
          echo "$LAMBDAS_MATRIX" | jq -c '.lambda' > lambdas.json
          echo '{}' > lambda-results.json
          record() { # record <project> <status>
            jq -c --arg p "$1" --arg s "$2" '.[$p] = $s' lambda-results.json > lambda-results.tmp \
              && mv lambda-results.tmp lambda-results.json
          }
          for PROJECT in $(jq -r '.[].project' lambdas.json); do
            record "$PROJECT" "not-run"
          done
          echo "📋 Lambdas to build: $(jq -r '[ .[].project ] | join(", ")' lambdas.json)"

          # One nx invocation per token group. nx runs every task even after
          # one fails (no --nx-bail), so a single red project doesn't stop the
          # others from building.
          build_group() { # build_group <label> <comma-separated projects>
            local LABEL="$1" PROJECTS="$2"
            [ -z "$PROJECTS" ] && return 0
            echo "🔨 Building ($LABEL): $PROJECTS"
            pnpm exec nx run-many -t build --projects="$PROJECTS" --parallel=3 --output-style=stream 2>&1 \
              | tee -a "build-${LABEL}.log"
          }

          ROLLBAR_PROJECTS=$(jq -r '[ .[] | select(.rollbar) | .project ] | join(",")' lambdas.json)
          PLAIN_PROJECTS=$(jq -r '[ .[] | select(.rollbar | not) | .project ] | join(",")' lambdas.json)

          ROLLBAR_GROUP_OK=true
          PLAIN_GROUP_OK=true
          ROLLBAR_ACCESS_TOKEN="$ROLLBAR_TOKEN_SECRET" build_group rollbar "$ROLLBAR_PROJECTS" || ROLLBAR_GROUP_OK=false
          ROLLBAR_ACCESS_TOKEN="" build_group plain "$PLAIN_PROJECTS" || PLAIN_GROUP_OK=false

          # Attribute results per lambda. When a group went green every member
          # built; when it went red, re-run each member on its own — the ones
          # that succeeded are instant nx cache hits, and only the real
          # failure(s) re-execute, so we can name them precisely.
          for PROJECT in $(jq -r '.[].project' lambdas.json); do
            ROLLBAR=$(jq -r --arg p "$PROJECT" '.[] | select(.project == $p) | .rollbar' lambdas.json)
            BADGE=$(jq -r --arg p "$PROJECT" '.[] | select(.project == $p) | .badgeName' lambdas.json)
            if [ "$ROLLBAR" = "true" ]; then
              GROUP_OK=$ROLLBAR_GROUP_OK; TOKEN="$ROLLBAR_TOKEN_SECRET"
            else
              GROUP_OK=$PLAIN_GROUP_OK; TOKEN=""
            fi

            if [ "$GROUP_OK" = "true" ]; then
              echo "✅ $BADGE: build successful"
              record "$PROJECT" "built"
              continue
            fi

            if ROLLBAR_ACCESS_TOKEN="$TOKEN" pnpm exec nx run "${PROJECT}:build" 2>&1 | tee "build-${PROJECT}.log"; then
              echo "✅ $BADGE: build successful"
              record "$PROJECT" "built"
            else
              echo "::error::$BADGE: build failed"
              record "$PROJECT" "build-failed"
              {
                echo "## ❌ Build Errors — $BADGE"
                echo '```'
                tail -20 "build-${PROJECT}.log"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Package and Upload to S3
        run: |
          # Create version string (shared across this run's lambdas — same
          # timestamp+sha scheme the per-lambda jobs used)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          COMMIT_SHA=$(echo "$GITHUB_SHA" | cut -c1-8)
          VERSION="${TIMESTAMP}-${COMMIT_SHA}"
          echo "Version: $VERSION"

          # Get S3 bucket name from SSM parameter store (once)
          echo "🔍 Getting S3 bucket name from SSM..."
          if S3_BUCKET=$(aws ssm get-parameter \
            --name "/legacy-sports/${AWS_STAGE}/s3/lambda-deployments-bucket" \
            --query "Parameter.Value" \
            --output text \
            --region "${AWS_REGION}" 2>/dev/null); then
            echo "✅ Found S3 bucket: $S3_BUCKET"
          else
            echo "⚠️ SSM parameter not found, using default bucket name"
            S3_BUCKET="legacy-sports-dev-lambdas-cca20ad9"
          fi

          record() { # record <project> <status>
            jq -c --arg p "$1" --arg s "$2" '.[$p] = $s' lambda-results.json > lambda-results.tmp \
              && mv lambda-results.tmp lambda-results.json
          }

          # upload_one <project> — zip the dist, push to S3, bump the SSM
          # version pointer. Returns non-zero on any failure; the caller
          # records it and moves on to the next lambda.
          upload_one() {
            local PROJECT="$1"
            local ENTRY DIST_PATH S3_PREFIX SSM_NAME BADGE ZIP_NAME
            ENTRY=$(jq -c --arg p "$PROJECT" '.[] | select(.project == $p)' lambdas.json)
            DIST_PATH=$(echo "$ENTRY" | jq -r '.distPath')
            S3_PREFIX=$(echo "$ENTRY" | jq -r '.s3Prefix')
            SSM_NAME=$(echo "$ENTRY" | jq -r '.ssmName')
            BADGE=$(echo "$ENTRY" | jq -r '.badgeName')
            ZIP_NAME="${S3_PREFIX}-${VERSION}.zip"

            echo "📦 $BADGE: creating deployment package from $DIST_PATH..."
            (cd "$DIST_PATH" && zip -qr "${GITHUB_WORKSPACE}/${ZIP_NAME}" .) || return 1

            echo "⬆️  $BADGE: uploading to s3://${S3_BUCKET}/${S3_PREFIX}/${ZIP_NAME}..."
            aws s3 cp "${ZIP_NAME}" \
              "s3://${S3_BUCKET}/${S3_PREFIX}/${ZIP_NAME}" \
              --region "${AWS_REGION}" || return 1

            echo "📝 $BADGE: updating SSM version parameter..."
            aws ssm put-parameter \
              --name "/legacy-sports/${AWS_STAGE}/lambda/${SSM_NAME}/version" \
              --value "${VERSION}" \
              --overwrite \
              --region "${AWS_REGION}" || return 1

            {
              echo "## 📦 Lambda Upload Complete — $BADGE"
              echo "- **Lambda**: ${SSM_NAME}"
              echo "- **Version**: \`${VERSION}\`"
              echo "- **S3 Location**: \`${S3_PREFIX}/${ZIP_NAME}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::✅ $BADGE uploaded successfully (version ${VERSION})"
          }

          for PROJECT in $(jq -r 'to_entries[] | select(.value == "built") | .key' lambda-results.json); do
            if upload_one "$PROJECT"; then
              record "$PROJECT" "success"
            else
              echo "::error::$(jq -r --arg p "$PROJECT" '.[] | select(.project == $p) | .badgeName' lambdas.json): upload failed"
              record "$PROJECT" "upload-failed"
            fi
          done

          echo "::notice::Waiting for Terraform workflow to apply infrastructure..."

      - name: Report per-lambda results
        id: report
        # Runs even when a previous step died unexpectedly, so a lambda that
        # never reached "success" is reported (as not-run / built) and fails
        # the job rather than vanishing silently.
        if: always()
        run: |
          if [ ! -f lambda-results.json ]; then
            echo "::error::lambda-results.json missing — the build step never started"
            echo "results={}" >> "$GITHUB_OUTPUT"
            echo "uploaded=" >> "$GITHUB_OUTPUT"
            echo "failed=" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          RESULTS=$(jq -c '.' lambda-results.json)
          UPLOADED=$(jq -r '[ to_entries[] | select(.value == "success") | .key ] | join(",")' lambda-results.json)
          FAILED=$(jq -r '[ to_entries[] | select(.value != "success") | .key ] | join(",")' lambda-results.json)
          echo "results=$RESULTS" >> "$GITHUB_OUTPUT"
          echo "uploaded=$UPLOADED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

          {
            echo "## 📊 Lambda Upload Results"
            echo ""
            echo "| Lambda | Status |"
            echo "| --- | --- |"
            jq -r '
              to_entries[] |
              (if .value == "success" then "✅" else "❌" end) as $emoji |
              "| \(.key) | \($emoji) \(.value) |"
            ' lambda-results.json
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$FAILED" ]; then
            echo "::error::Lambda upload failed for: $FAILED"
            exit 1
          fi
          echo "✅ All lambdas uploaded: $UPLOADED"
