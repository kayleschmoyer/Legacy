name: Apply Lambda Infrastructure

# Central Terraform workflow - applies ALL pending Lambda changes
# Triggered by individual Lambda upload workflows completing
# Uses cancel-in-progress to batch multiple Lambda updates into one apply

on:
  workflow_run:
    workflows:
      - "Upload Lambdas"
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      skip-debounce:
        description: "Skip debounce delay (for manual runs)"
        required: false
        default: false
        type: boolean

# CRITICAL: cancel-in-progress allows batching multiple Lambda updates
# If Lambda A and B both upload, the first Terraform run gets cancelled
# and the second run deploys BOTH changes (Terraform detects via SSM)
concurrency:
  group: terraform-lambda-infrastructure
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  AWS_STAGE: dev
  LAMBDA_PREFIX: legacy-sports-dev

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  apply-infrastructure:
    name: Apply Lambda Infrastructure
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    # Only run if trigger workflow succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Validate Required Secrets
        run: |
          MISSING=()
          if [ -z "${{ secrets.ROLLBAR_ACCESS_TOKEN }}" ]; then
            MISSING+=("ROLLBAR_ACCESS_TOKEN")
          fi
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${MISSING[*]}"
            exit 1
          fi
          echo "✅ All required secrets are configured"

          # Runner secrets are only required when runners are enabled in tfvars
          if grep -q 'enable_github_runners\s*=\s*true' terraform/infra.auto.tfvars 2>/dev/null; then
            RUNNER_MISSING=()
            if [ -z "${{ secrets.RUNNER_GITHUB_APP_ID }}" ]; then
              RUNNER_MISSING+=("RUNNER_GITHUB_APP_ID")
            fi
            if [ -z "${{ secrets.RUNNER_GITHUB_APP_KEY_BASE64 }}" ]; then
              RUNNER_MISSING+=("RUNNER_GITHUB_APP_KEY_BASE64")
            fi
            if [ -z "${{ secrets.RUNNER_GITHUB_APP_WEBHOOK_SECRET }}" ]; then
              RUNNER_MISSING+=("RUNNER_GITHUB_APP_WEBHOOK_SECRET")
            fi
            if [ ${#RUNNER_MISSING[@]} -gt 0 ]; then
              echo "::error::Runner secrets required (enable_github_runners=true): ${RUNNER_MISSING[*]}"
              exit 1
            fi
            echo "✅ All runner secrets are configured"
          else
            echo "ℹ️ Runners disabled — skipping runner secret validation"
          fi

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::176661590736:role/legacy-sports-dev-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Block unlicensed MLB data provider in production
        # Defense-in-depth gate alongside the Terraform validation and runtime guard.
        # The free MLB Stats API (mlb-statsapi) is for development only — its terms
        # restrict commercial use of the API. Player statistics are public domain per
        # CBC Distribution v. MLBAM (8th Cir. 2007, cert denied 2008), but any
        # commercial deployment requires a licensed data redistribution provider
        # since we operate commercially with premium subscriptions.
        # Skip this check for dev environments — mlb-statsapi is permitted for development.
        if: env.AWS_STAGE != 'dev'
        env:
          TF_VAR_mlb_data_provider: ${{ secrets.MLB_DATA_PROVIDER || vars.MLB_DATA_PROVIDER }}
        run: |
          if [ "$TF_VAR_mlb_data_provider" = "mlb-statsapi" ] || [ -z "$TF_VAR_mlb_data_provider" ]; then
            echo "::error::Cannot deploy with MLB Stats API — not licensed for commercial use."
            echo "::error::Set MLB_DATA_PROVIDER to a licensed provider. See repository secrets documentation."
            exit 1
          fi
          echo "MLB data provider configured"

      - name: Debounce Multiple Triggers
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip-debounce }}
        run: |
          echo "::notice::⏳ Debouncing for 30 seconds to batch multiple Lambda updates..."
          echo "This allows multiple concurrent uploads to complete before applying infrastructure."
          sleep 30

      - name: Check Pending Lambda Updates
        id: check-updates
        run: |
          echo "🔍 Checking SSM parameters for pending Lambda updates..."

          # Get all Lambda version SSM parameters
          PARAMS=$(aws ssm get-parameters-by-path \
            --path "/legacy-sports/${AWS_STAGE}/lambda/" \
            --recursive \
            --region ${{ env.AWS_REGION }} \
            --query 'Parameters[?contains(Name, `/version`)].{Name:Name,Value:Value}' \
            --output json)

          echo "📋 Current Lambda Versions:"
          echo "$PARAMS" | jq -r '.[] | "  \(.Name | split("/") | .[-2]): \(.Value)"'

          # Count how many lambdas will be updated
          UPDATE_COUNT=$(echo "$PARAMS" | jq 'length')
          echo "total_lambdas=$UPDATE_COUNT" >> $GITHUB_OUTPUT

          # Capture a deterministic hash of the initial parameter values
          # for race condition detection during the plan phase.
          # Normalize: sort array by Name and reduce to a stable {Name: Value} map
          # so the hash is independent of AWS CLI parameter ordering.
          PARAMS_HASH=$(echo "$PARAMS" \
            | jq -S 'sort_by(.Name) | map({key: .Name, value: .Value}) | from_entries' \
            | md5sum | cut -d' ' -f1)
          echo "params_hash=$PARAMS_HASH" >> $GITHUB_OUTPUT

          echo "## 📦 Pending Lambda Updates" >> $GITHUB_STEP_SUMMARY
          echo "$PARAMS" | jq -r '.[] | "- **\(.Name | split("/") | .[-2])**: `\(.Value)`"' >> $GITHUB_STEP_SUMMARY

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.14"

      - name: Initialize Terraform
        working-directory: terraform
        run: |
          echo "🔧 Initializing Terraform..."
          terraform init -input=false

      - name: Clear Stale Locks
        working-directory: terraform
        run: |
          echo "🔍 Checking for stale Terraform locks..."

          STATE_KEY="legacy-sports-terraform-state/legacy-sports/terraform.tfstate"

          # Use get-item with the exact known key (more reliable than scan)
          LOCK_ITEM=$(aws dynamodb get-item \
            --table-name terraform-state-locks \
            --key "{\"LockID\":{\"S\":\"$STATE_KEY\"}}" \
            --region us-east-1 \
            --output json 2>&1) || true

          if echo "$LOCK_ITEM" | jq -e '.Item' > /dev/null 2>&1; then
            echo "⚠️  Found existing lock:"
            echo "$LOCK_ITEM" | jq -r '.Item.Info.S // "(no info)"' | jq '.' 2>/dev/null || true
            echo "🔓 Removing stale lock from DynamoDB..."

            aws dynamodb delete-item \
              --table-name terraform-state-locks \
              --key "{\"LockID\":{\"S\":\"$STATE_KEY\"}}" \
              --region us-east-1

            echo "✅ Stale lock cleared"
          else
            echo "✅ No stale locks detected"
          fi

      - name: Plan Infrastructure Changes
        id: plan
        working-directory: terraform
        env:
          TF_VAR_rollbar_access_token: ${{ secrets.ROLLBAR_ACCESS_TOKEN }}
          TF_VAR_discord_user_signup_webhook_url: ${{ secrets.DISCORD_USER_SIGNUP_WEBHOOK_URL }}
          TF_VAR_discord_stripe_webhook_url: ${{ secrets.DISCORD_STRIPE_WEBHOOK_URL }}
          TF_VAR_ga_measurement_id: ${{ secrets.GA_MEASUREMENT_ID }}
          TF_VAR_ga_api_secret: ${{ secrets.GA_API_SECRET }}
          TF_VAR_github_app_id: ${{ secrets.RUNNER_GITHUB_APP_ID }}
          TF_VAR_github_app_key_base64: ${{ secrets.RUNNER_GITHUB_APP_KEY_BASE64 }}
          TF_VAR_github_app_webhook_secret: ${{ secrets.RUNNER_GITHUB_APP_WEBHOOK_SECRET }}
          TF_VAR_mlb_data_api_key: ${{ secrets.MLB_DATA_API_KEY }}
        run: |
          set -o pipefail
          echo "📋 Planning Terraform changes..."
          echo "⏳ Acquiring state lock (wait up to 5 minutes)..."

          # Plan changes with lock timeout
          if terraform plan -input=false -out=tfplan -lock-timeout=5m 2>&1 | tee plan.log; then
            echo "✅ Terraform plan successful"
            
            # Check if there are any changes
            if grep -q "No changes" plan.log; then
              echo "has_changes=false" >> $GITHUB_OUTPUT
              echo "::notice::No infrastructure changes needed"
            else
              echo "has_changes=true" >> $GITHUB_OUTPUT
              
              # Extract what's changing
              echo "## 📝 Planned Changes" >> $GITHUB_STEP_SUMMARY
              grep -A 50 "Terraform will perform" plan.log >> $GITHUB_STEP_SUMMARY || true
            fi
          else
            echo "❌ Terraform plan failed"
            cat plan.log
            exit 1
          fi

      - name: Release Lock on Plan Failure
        if: always() && steps.plan.outcome == 'failure'
        working-directory: terraform
        run: |
          echo "🔓 Releasing terraform lock after plan failure..."
          aws dynamodb delete-item \
            --table-name terraform-state-locks \
            --key '{"LockID":{"S":"legacy-sports-terraform-state/legacy-sports/terraform.tfstate"}}' \
            --region us-east-1 2>&1 || true
          echo "✅ Lock released"

      - name: Re-check SSM Versions After Plan
        id: recheck
        if: steps.plan.outputs.has_changes == 'true'
        run: |
          # Race condition fix: if a concurrent lambda upload completed during
          # the plan phase, SSM params now have newer versions than what the plan
          # captured. Re-read SSM and compare against the snapshot taken earlier.
          echo "🔍 Re-checking SSM parameters for concurrent updates..."

          CURRENT_PARAMS=$(aws ssm get-parameters-by-path \
            --path "/legacy-sports/${AWS_STAGE}/lambda/" \
            --recursive \
            --region ${{ env.AWS_REGION }} \
            --query 'Parameters[?contains(Name, `/version`)].{Name:Name,Value:Value}' \
            --output json)

          # Compare with the deterministic hash captured before planning
          PREVIOUS_HASH='${{ steps.check-updates.outputs.params_hash }}'
          CURRENT_HASH=$(echo "$CURRENT_PARAMS" \
            | jq -S 'sort_by(.Name) | map({key: .Name, value: .Value}) | from_entries' \
            | md5sum | cut -d' ' -f1)

          echo "Current SSM versions after plan:"
          echo "$CURRENT_PARAMS" | jq -r '.[] | "  \(.Name | split("/") | .[-2]): \(.Value)"'

          # Check if any versions were updated during the plan phase
          if [ "$PREVIOUS_HASH" != "$CURRENT_HASH" ]; then
            echo "⚠️ SSM parameter versions changed during plan."
            echo "versions_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️ SSM parameter versions unchanged during plan."
            echo "versions_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-plan if Versions Changed
        id: replan
        if: steps.recheck.outputs.versions_changed == 'true'
        working-directory: terraform
        env:
          TF_VAR_rollbar_access_token: ${{ secrets.ROLLBAR_ACCESS_TOKEN }}
          TF_VAR_discord_user_signup_webhook_url: ${{ secrets.DISCORD_USER_SIGNUP_WEBHOOK_URL }}
          TF_VAR_discord_stripe_webhook_url: ${{ secrets.DISCORD_STRIPE_WEBHOOK_URL }}
          TF_VAR_ga_measurement_id: ${{ secrets.GA_MEASUREMENT_ID }}
          TF_VAR_ga_api_secret: ${{ secrets.GA_API_SECRET }}
          TF_VAR_github_app_id: ${{ secrets.RUNNER_GITHUB_APP_ID }}
          TF_VAR_github_app_key_base64: ${{ secrets.RUNNER_GITHUB_APP_KEY_BASE64 }}
          TF_VAR_github_app_webhook_secret: ${{ secrets.RUNNER_GITHUB_APP_WEBHOOK_SECRET }}
          TF_VAR_mlb_data_api_key: ${{ secrets.MLB_DATA_API_KEY }}
        run: |
          echo "⚠️ SSM versions changed during plan — re-planning with updated values..."
          EXIT_CODE=0
          terraform plan -input=false -out=tfplan -lock-timeout=5m -detailed-exitcode || EXIT_CODE=$?
          case "$EXIT_CODE" in
            0)
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              echo "ℹ️ Re-plan found no changes"
              ;;
            2)
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              echo "✅ Re-plan complete with latest Lambda versions"
              ;;
            *)
              echo "::error::Terraform re-plan failed (exit code $EXIT_CODE)"
              exit 1
              ;;
          esac

      - name: "📡 Rollbar Deploy Started"
        if: steps.plan.outputs.has_changes == 'true' && steps.replan.outputs.has_changes != 'false'
        uses: ./.github/actions/rollbar-deploy
        with:
          rollbar-access-token: ${{ secrets.ROLLBAR_ACCESS_TOKEN }}
          environment: ${{ env.AWS_STAGE }}
          status: started
          comment: "Lambda infrastructure apply (run ${{ github.run_id }})"

      - name: Apply Infrastructure Changes
        id: apply
        if: steps.plan.outputs.has_changes == 'true' && steps.replan.outputs.has_changes != 'false'
        working-directory: terraform
        env:
          TF_VAR_rollbar_access_token: ${{ secrets.ROLLBAR_ACCESS_TOKEN }}
          TF_VAR_discord_user_signup_webhook_url: ${{ secrets.DISCORD_USER_SIGNUP_WEBHOOK_URL }}
          TF_VAR_discord_stripe_webhook_url: ${{ secrets.DISCORD_STRIPE_WEBHOOK_URL }}
          TF_VAR_ga_measurement_id: ${{ secrets.GA_MEASUREMENT_ID }}
          TF_VAR_ga_api_secret: ${{ secrets.GA_API_SECRET }}
          TF_VAR_github_app_id: ${{ secrets.RUNNER_GITHUB_APP_ID }}
          TF_VAR_github_app_key_base64: ${{ secrets.RUNNER_GITHUB_APP_KEY_BASE64 }}
          TF_VAR_github_app_webhook_secret: ${{ secrets.RUNNER_GITHUB_APP_WEBHOOK_SECRET }}
          TF_VAR_mlb_data_api_key: ${{ secrets.MLB_DATA_API_KEY }}
        run: |
          echo "🚀 Applying Terraform changes..."

          terraform apply -input=false -auto-approve -lock-timeout=5m tfplan

          echo "## ✅ Infrastructure Updated" >> $GITHUB_STEP_SUMMARY
          echo "Applied changes for ${{ steps.check-updates.outputs.total_lambdas }} Lambda function(s)" >> $GITHUB_STEP_SUMMARY

      - name: Post-Apply Version Verification
        id: verify-versions
        if: always() && steps.apply.outcome == 'success'
        run: |
          echo "🔍 Verifying deployed Lambda versions match SSM expectations..."

          # Read expected versions from SSM
          EXPECTED=$(aws ssm get-parameters-by-path \
            --path "/legacy-sports/${AWS_STAGE}/lambda/" \
            --recursive \
            --region ${{ env.AWS_REGION }} \
            --query 'Parameters[?contains(Name, `/version`)].{Name:Name,Value:Value}' \
            --output json)

          MISMATCH=false
          while IFS=$'\t' read -r NAME VALUE; do
            LAMBDA_NAME=$(echo "$NAME" | awk -F'/' '{print $(NF-1)}')
            FUNC_NAME="${LAMBDA_PREFIX}-${LAMBDA_NAME}"

            # Get the actual deployed version tag (if available)
            DEPLOYED_DESC=$(aws lambda get-function-configuration \
              --function-name "$FUNC_NAME" \
              --region ${{ env.AWS_REGION }} \
              --query "Description" --output text 2>/dev/null || echo "unknown")

            if [ "$VALUE" != "$DEPLOYED_DESC" ]; then
              echo "  ❌ $LAMBDA_NAME: SSM=$VALUE, Deployed=$DEPLOYED_DESC"
              MISMATCH=true
            else
              echo "  ✅ $LAMBDA_NAME: SSM=$VALUE, Deployed=$DEPLOYED_DESC"
            fi
          done < <(echo "$EXPECTED" | jq -r '.[] | [.Name, .Value] | @tsv')

          if [ "$MISMATCH" = "true" ]; then
            echo "::warning::Version mismatch detected — a concurrent upload may need another apply"
          else
            echo "✅ All deployed versions consistent with SSM"
          fi

      - name: Release Lock on Apply Failure
        if: always() && steps.apply.outcome == 'failure'
        working-directory: terraform
        run: |
          echo "🔓 Releasing terraform lock after apply failure..."
          aws dynamodb delete-item \
            --table-name terraform-state-locks \
            --key '{"LockID":{"S":"legacy-sports-terraform-state/legacy-sports/terraform.tfstate"}}' \
            --region us-east-1 2>&1 || true
          echo "✅ Lock released"

      - name: "📡 Rollbar Deploy Succeeded"
        if: steps.apply.outcome == 'success'
        uses: ./.github/actions/rollbar-deploy
        with:
          rollbar-access-token: ${{ secrets.ROLLBAR_ACCESS_TOKEN }}
          environment: ${{ env.AWS_STAGE }}
          status: succeeded
          comment: "Lambda infrastructure apply (run ${{ github.run_id }})"

      - name: "📡 Rollbar Deploy Failed"
        if: always() && steps.apply.outcome == 'failure'
        uses: ./.github/actions/rollbar-deploy
        with:
          rollbar-access-token: ${{ secrets.ROLLBAR_ACCESS_TOKEN }}
          environment: ${{ env.AWS_STAGE }}
          status: failed
          comment: "Lambda infrastructure apply (run ${{ github.run_id }})"

      - name: Build deploy changelog
        id: deploy-changelog
        if: always()
        shell: bash
        run: |
          # Get recent commits touching lambdas/ or terraform/ (last 15 non-merge commits)
          COMMITS=$(git log --pretty=format:'[`%h`](https://github.com/${{ github.repository }}/commit/%H) %s' \
            --no-merges -15 -- lambdas/ terraform/)

          if [ -z "$COMMITS" ]; then
            # Fallback: last 10 commits on main
            COMMITS=$(git log --pretty=format:'[`%h`](https://github.com/${{ github.repository }}/commit/%H) %s' \
              --no-merges -10)
          fi

          {
            echo "commits<<CHANGELOG_EOF"
            echo "$COMMITS"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: "Discord Deploy Succeeded"
        if: steps.apply.outcome == 'success'
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: success
          title: "Lambda Infrastructure Deploy"
          environment: ${{ env.AWS_STAGE }}
          description: "Applied Terraform changes for ${{ steps.check-updates.outputs.total_lambdas }} Lambda function(s)"
          commits: ${{ steps.deploy-changelog.outputs.commits }}

      - name: "Discord Deploy Failed"
        if: always() && steps.apply.outcome == 'failure'
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: failure
          title: "Lambda Infrastructure Deploy"
          environment: ${{ env.AWS_STAGE }}
          description: "Terraform apply failed"
          commits: ${{ steps.deploy-changelog.outputs.commits }}

      - name: Verify Deployment
        if: steps.plan.outputs.has_changes == 'true' && steps.replan.outputs.has_changes != 'false'
        run: |
          echo "🔍 Verifying Lambda deployments..."

          # Get list of Lambda functions
          FUNCTIONS=$(aws lambda list-functions \
            --region ${{ env.AWS_REGION }} \
            --query 'Functions[?starts_with(FunctionName, `legacy-sports-`)].{Name:FunctionName,Updated:LastModified}' \
            --output json)

          echo "## 🎉 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "### Updated Functions:" >> $GITHUB_STEP_SUMMARY
          echo "$FUNCTIONS" | jq -r '.[] | "- **\(.Name)**: \(.Updated)"' >> $GITHUB_STEP_SUMMARY

      - name: Cleanup on Failure
        if: always() && (failure() || cancelled())
        working-directory: terraform
        run: |
          echo "🔓 Ensuring terraform lock is released..."
          aws dynamodb delete-item \
            --table-name terraform-state-locks \
            --key '{"LockID":{"S":"legacy-sports-terraform-state/legacy-sports/terraform.tfstate"}}' \
            --region us-east-1 2>&1 || true
          echo "✅ Lock released"

      # -------------------------------------------------------------------
      # Post-deploy health checks for non-HTTP Lambdas
      # Updates shields.io badges so they reflect actual deploy-time state
      # instead of polling every 15 minutes.
      # -------------------------------------------------------------------
      - name: Check Stats Lambda Health
        id: stats-health
        if: always()
        run: |
          STATE=$(aws lambda get-function-configuration \
            --function-name "${{ env.LAMBDA_PREFIX }}-stats" \
            --region "${{ env.AWS_REGION }}" \
            --query "State" --output text 2>/dev/null || echo "unknown")
          echo "State: $STATE"
          case "$STATE" in
            Active)   echo "result=healthy"  >> "$GITHUB_OUTPUT" ;;
            Inactive) echo "result=degraded" >> "$GITHUB_OUTPUT" ;;
            *)        echo "result=offline"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Check Draft Processor Lambda Health
        id: draft-health
        if: always()
        run: |
          STATE=$(aws lambda get-function-configuration \
            --function-name "${{ env.LAMBDA_PREFIX }}-draft-processor" \
            --region "${{ env.AWS_REGION }}" \
            --query "State" --output text 2>/dev/null || echo "unknown")
          echo "State: $STATE"
          case "$STATE" in
            Active)   echo "result=healthy"  >> "$GITHUB_OUTPUT" ;;
            Inactive) echo "result=degraded" >> "$GITHUB_OUTPUT" ;;
            *)        echo "result=offline"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Check WebSocket Lambda Health
        id: websocket-health
        if: always()
        run: |
          STATE=$(aws lambda get-function-configuration \
            --function-name "${{ env.LAMBDA_PREFIX }}-websocket" \
            --region "${{ env.AWS_REGION }}" \
            --query "State" --output text 2>/dev/null || echo "unknown")
          echo "State: $STATE"
          case "$STATE" in
            Active)   echo "result=healthy"  >> "$GITHUB_OUTPUT" ;;
            Inactive) echo "result=degraded" >> "$GITHUB_OUTPUT" ;;
            *)        echo "result=offline"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Badge — Stats Lambda
        if: always()
        uses: ./.github/actions/update-health-badge
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          gist-id: ${{ secrets.CI_BADGES_GIST_ID }}
          lambda-name: "Stats Lambda"
          health-status: ${{ steps.stats-health.outputs.result || 'offline' }}

      - name: Badge — Draft Processor Lambda
        if: always()
        uses: ./.github/actions/update-health-badge
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          gist-id: ${{ secrets.CI_BADGES_GIST_ID }}
          lambda-name: "Draft Processor Lambda"
          health-status: ${{ steps.draft-health.outputs.result || 'offline' }}

      - name: Badge — WebSocket Lambda
        if: always()
        uses: ./.github/actions/update-health-badge
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          gist-id: ${{ secrets.CI_BADGES_GIST_ID }}
          lambda-name: "WebSocket Lambda"
          health-status: ${{ steps.websocket-health.outputs.result || 'offline' }}

      - name: Update Deployment Badge
        if: always()
        uses: ./.github/actions/update-deployment-badge
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          gist-id: ${{ secrets.CI_BADGES_GIST_ID }}
          deployment-name: "Apply Lambda Infrastructure"
          deployment-status: ${{ job.status }}
          workflow-run-id: ${{ github.run_id }}
          branch: ${{ github.ref_name }}
