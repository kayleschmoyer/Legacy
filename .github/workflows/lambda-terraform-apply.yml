name: Apply Lambda Infrastructure

# Central Terraform workflow - applies ALL pending Lambda changes.
#
# Triggering (LS-9374/LS-9369 restructure):
#   - Primary: called SYNCHRONOUSLY from the umbrella Deploy workflow via
#     workflow_call, before Deploy Web runs — see deploy.yml's
#     apply-lambda-infrastructure job. This closes a deploy-ordering race:
#     previously this workflow only started once the ENTIRE Deploy run
#     (including Deploy Web) had already completed, so a commit shipping a
#     client change alongside a required server schema change could put the
#     new client live for minutes-to-hours before the matching Lambda code
#     actually went live, producing transient GraphQL "Unknown argument" /
#     "Cannot query field" errors (Rollbar #232/#233). Deploy Web now
#     `needs` this job and only proceeds once it succeeds or is skipped
#     (lambdas not targeted).
#   - Standalone: workflow_run off "Upload Lambdas" completing directly —
#     covers a manual one-off workflow_dispatch of upload-lambdas.yml, which
#     runs as its own top-level workflow run (unlike the workflow_call
#     embedding above, which never emits a separate "Upload Lambdas" run).
#   - Manual: workflow_dispatch for targeted one-off applies.
#
# Apply gate intentionally runs on BOTH success and failure conclusions of the
# triggering "Upload Lambdas" run: if a sibling child of that run's own caller
# failed, the lambda SSM versions may still have already been bumped and infra
# still needs to be reconciled. The existing SSM no-op check (Plan
# Infrastructure Changes) makes this safe: if no lambda versions changed,
# terraform plan returns "No changes" and the apply step is skipped.
# Cancelled runs are excluded.
#
# Uses cancel-in-progress to batch multiple Lambda updates into one apply.

on:
  # Explicit `{}` (not bare `workflow_call:`) — SchemaStore's github-workflow.json
  # now requires workflow_call to be an object, not null. LS-9368.
  workflow_call: {}
  workflow_run:
    workflows:
      - "Upload Lambdas"
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      skip-debounce:
        description: "Skip debounce delay (for manual runs)"
        required: false
        default: false
        type: boolean
      is-retry:
        # Set only by the Report Runner Shutdown job's re-dispatch. Caps automatic
        # retries at one per failure: a retry that dies again is reported, not re-dispatched.
        description: "Internal — marks this run as an automatic retry of a spot-killed apply"
        required: false
        default: false
        type: boolean

# cancel-in-progress is intentionally FALSE: cancelling a running apply
# mid-destroy+create cycle can leave Terraform state inconsistent (resource
# destroyed in state but not yet re-created in AWS). With false, a queued
# trigger waits for the running apply to finish; since Terraform detects all
# pending SSM version changes at plan time, the queued run is usually a no-op.
# The 30s debounce below still batches most same-window Lambda uploads.
concurrency:
  group: terraform-lambda-infrastructure
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_STAGE: dev
  LAMBDA_PREFIX: legacy-sports-dev

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  apply-infrastructure:
    name: Apply Lambda Infrastructure
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    # Run for every invocation EXCEPT a "Upload Lambdas" workflow_run that was
    # cancelled or skipped.
    #
    # Do NOT reintroduce a `github.event_name == 'workflow_call'` clause here
    # (LS-9871). GitHub never sets `github.event_name` to 'workflow_call': a
    # reusable workflow invoked with `uses:` inherits the CALLER's event, which
    # for the umbrella Deploy workflow on push-to-main is 'push'. That clause
    # could therefore never match, so every automatic push-to-main deploy
    # silently skipped this job — and because a skipped job is not a failure,
    # Deploy still reported success while no terraform change ever applied.
    # Only manual dispatches worked, because those DO inherit
    # event_name = 'workflow_dispatch'. Inverting the test to "not a
    # workflow_run" covers the workflow_call path under any inherited event as
    # well as a direct workflow_dispatch, without enumerating caller events.
    #
    # The workflow_call path needs no additional condition: deploy.yml's own
    # apply-lambda-infrastructure gate already decided infrastructure was
    # targeted before invoking this workflow.
    #
    # The workflow_run exclusions are deliberate and preserved. Apply still
    # runs when the triggering "Upload Lambdas" run concluded with a
    # non-success terminal state such as failure, timed_out, action_required,
    # neutral, or stale — all of those can leave SSM parameters bumped and in
    # a state that still needs reconciling. Only cancelled/skipped Upload
    # Lambdas runs are excluded, since those can terminate mid-upload and leave
    # partial state the plan step should not attempt to act on. The SSM no-op
    # check in the plan step ensures we exit cleanly if no lambda versions
    # actually changed.
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion != 'cancelled' &&
          github.event.workflow_run.conclusion != 'skipped'
        )
      }}

    steps:
      - name: Validate Required Secrets
        run: |
          MISSING=()
          if [ -z "${{ secrets.ROLLBAR_ACCESS_TOKEN }}" ]; then
            MISSING+=("ROLLBAR_ACCESS_TOKEN")
          fi
          if [ -z "${{ secrets.BOT_APP_PRIVATE_KEY }}" ]; then
            MISSING+=("BOT_APP_PRIVATE_KEY")
          fi
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${MISSING[*]}"
            exit 1
          fi
          echo "✅ All required secrets are configured"
          # Note: runner secret validation moved to runner-terraform-apply.yml as part
          # of LS-2425 (state separation). The regular Apply Lambda Infrastructure
          # workflow no longer touches the github-aws-runners module.

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::176661590736:role/legacy-sports-dev-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Block unlicensed MLB data provider in production
        # Defense-in-depth gate alongside the Terraform validation and runtime guard.
        # The free MLB Stats API (mlb-statsapi) is for development only — its terms
        # restrict commercial use of the API. Player statistics are public domain per
        # CBC Distribution v. MLBAM (8th Cir. 2007, cert denied 2008), but any
        # commercial deployment requires a licensed data redistribution provider
        # since we operate commercially with premium subscriptions.
        # Skip this check for dev environments — mlb-statsapi is permitted for development.
        if: env.AWS_STAGE != 'dev'
        env:
          TF_VAR_mlb_data_provider: ${{ secrets.MLB_DATA_PROVIDER || vars.MLB_DATA_PROVIDER }}
        run: |
          if [ "$TF_VAR_mlb_data_provider" = "mlb-statsapi" ] || [ -z "$TF_VAR_mlb_data_provider" ]; then
            echo "::error::Cannot deploy with MLB Stats API — not licensed for commercial use."
            echo "::error::Set MLB_DATA_PROVIDER to a licensed provider. See repository secrets documentation."
            exit 1
          fi
          echo "MLB data provider configured"

      - name: Debounce Multiple Triggers
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs['skip-debounce'] }}
        run: |
          echo "::notice::⏳ Debouncing for 30 seconds to batch multiple Lambda updates..."
          echo "This allows multiple concurrent uploads to complete before applying infrastructure."
          sleep 30

      - name: Check Pending Lambda Updates
        id: check-updates
        run: |
          echo "🔍 Checking SSM parameters for pending Lambda updates..."

          # Get all Lambda version SSM parameters
          PARAMS=$(aws ssm get-parameters-by-path \
            --path "/legacy-sports/${AWS_STAGE}/lambda/" \
            --recursive \
            --region ${{ env.AWS_REGION }} \
            --query 'Parameters[?contains(Name, `/version`)].{Name:Name,Value:Value}' \
            --output json)

          echo "📋 Current Lambda Versions:"
          echo "$PARAMS" | jq -r '.[] | "  \(.Name | split("/") | .[-2]): \(.Value)"'

          # Count how many lambdas will be updated
          UPDATE_COUNT=$(echo "$PARAMS" | jq 'length')
          echo "total_lambdas=$UPDATE_COUNT" >> $GITHUB_OUTPUT

          # Capture a deterministic hash of the initial parameter values
          # for race condition detection during the plan phase.
          # Normalize: sort array by Name and reduce to a stable {Name: Value} map
          # so the hash is independent of AWS CLI parameter ordering.
          PARAMS_HASH=$(echo "$PARAMS" \
            | jq -S 'sort_by(.Name) | map({key: .Name, value: .Value}) | from_entries' \
            | md5sum | cut -d' ' -f1)
          echo "params_hash=$PARAMS_HASH" >> $GITHUB_OUTPUT

          echo "## 📦 Pending Lambda Updates" >> $GITHUB_STEP_SUMMARY
          echo "$PARAMS" | jq -r '.[] | "- **\(.Name | split("/") | .[-2])**: `\(.Value)`"' >> $GITHUB_STEP_SUMMARY

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "~> 1.14"
          terraform_wrapper: false

      - name: Initialize Terraform
        working-directory: terraform/main
        run: |
          echo "🔧 Initializing Terraform..."
          terraform init -input=false

      - name: Clear Stale Locks
        working-directory: terraform/main
        run: |
          echo "🔍 Checking for stale Terraform locks..."

          LOCK_FILE="s3://legacy-sports-terraform-state/legacy-sports/terraform.tfstate.tflock"

          if aws s3 ls "$LOCK_FILE" > /dev/null 2>&1; then
            echo "⚠️  Found existing S3 lock file:"
            aws s3 cp "$LOCK_FILE" - 2>/dev/null | python3 -m json.tool 2>/dev/null || true
            echo "🔓 Removing stale S3 lock file..."
            aws s3 rm "$LOCK_FILE"
            echo "✅ Stale lock cleared"
          else
            echo "✅ No stale locks detected"
          fi

      - name: Bootstrap IAM Permissions
        # Apply IAM policy changes first with -refresh=false to break the circular
        # dependency where terraform plan needs logs:DescribeLogGroups to refresh
        # aws_cloudwatch_log_group resources, but that permission lives in the inline
        # policy that can only be applied after a successful plan. Targeting IAM-only
        # resources with -refresh=false avoids all CloudWatch API calls entirely.
        # This step is idempotent — it is a no-op when IAM is already current.
        # LS-3708
        working-directory: terraform/main
        env:
          TF_VAR_rollbar_access_token: ${{ secrets.ROLLBAR_ACCESS_TOKEN }}
          # Read-scope Rollbar token consumed by the hosted mcp-rollbar Lambda
          # (LS-8142). The Legacy Sports CLI access token currently has both
          # read and write scopes, so we reuse the same secret for both slots
          # until a separate read-only token is minted (LS-8200).
          TF_VAR_rollbar_read_access_token: ${{ secrets.ROLLBAR_ACCESS_TOKEN }}
          # Client-side (post_client_item) Rollbar token. Optional (defaults to "" in
          # secrets.tf); when set it materializes the github-secrets SSM param that
          # sync-github-secrets.mjs reconciles into the ROLLBAR_CLIENT_ACCESS_TOKEN
          # repo secret consumed by build-android-app.yml / deploy-web.yml (LS-7957).
          TF_VAR_rollbar_client_access_token: ${{ secrets.ROLLBAR_CLIENT_ACCESS_TOKEN }}
          TF_VAR_discord_user_signup_webhook_url: ${{ secrets.DISCORD_USER_SIGNUP_WEBHOOK_URL }}
          TF_VAR_discord_stripe_webhook_url: ${{ secrets.DISCORD_STRIPE_WEBHOOK_URL }}
          TF_VAR_discord_client_secret: ${{ secrets.DISCORD_CLIENT_SECRET }}
          TF_VAR_ga_measurement_id: ${{ secrets.GA_MEASUREMENT_ID }}
          TF_VAR_apple_bundle_id: ${{ secrets.APPLE_BUNDLE_ID || vars.APPLE_BUNDLE_ID }}
          TF_VAR_ga_api_secret: ${{ secrets.GA_API_SECRET }}
          TF_VAR_mlb_data_api_key: ${{ secrets.MLB_DATA_API_KEY }}
          TF_VAR_youtube_api_key: ${{ secrets.YOUTUBE_API_KEY }}
          # VAPID keypair for Web Push (browser) notifications (lambdas/notifications).
          # Optional (defaults to "" in secrets.tf) — deliver.ts treats missing keys
          # as "web push disabled" (non-fatal). LS-6838.
          TF_VAR_vapid_public_key: ${{ secrets.VAPID_PUBLIC_KEY }}
          TF_VAR_vapid_private_key: ${{ secrets.VAPID_PRIVATE_KEY }}
          TF_VAR_vapid_subject: ${{ secrets.VAPID_SUBJECT }}
        run: |
          echo "🔒 Bootstrapping IAM policy changes (refresh=false targeted pass)..."
          terraform apply \
            -input=false \
            -auto-approve \
            -refresh=false \
            -lock-timeout=5m \
            -target=aws_iam_role_policy.github_actions_additional \
            -target=aws_iam_role_policy.github_actions_plan_policy \
            -target=aws_iam_policy.github_actions_supplemental \
            -target=aws_iam_role_policy_attachment.github_actions_supplemental \
            -target=aws_iam_policy.github_actions_supplemental_2 \
            -target=aws_iam_role_policy_attachment.github_actions_supplemental_2
          echo "✅ IAM bootstrap complete"

      - name: Wait for IAM Propagation
        # IAM inline policy changes propagate eventually — not instantly. The bootstrap
        # step above may complete and hand off to plan within milliseconds, before the
        # new policy has replicated across all AWS IAM servers globally. A short sleep
        # gives IAM enough time to converge so the plan step runs with current permissions.
        # LS-3708
        run: |
          echo "⏳ Waiting 15s for IAM policy changes to propagate..."
          sleep 15
          echo "✅ IAM propagation wait complete"

      - name: Plan Infrastructure Changes
        id: plan
        working-directory: terraform/main
        env:
          TF_VAR_rollbar_access_token: ${{ secrets.ROLLBAR_ACCESS_TOKEN }}
          # Read-scope Rollbar token consumed by the hosted mcp-rollbar Lambda
          # (LS-8142). The Legacy Sports CLI access token currently has both
          # read and write scopes, so we reuse the same secret for both slots
          # until a separate read-only token is minted (LS-8200).
          TF_VAR_rollbar_read_access_token: ${{ secrets.ROLLBAR_ACCESS_TOKEN }}
          # Client-side (post_client_item) Rollbar token. Optional (defaults to "" in
          # secrets.tf); when set it materializes the github-secrets SSM param that
          # sync-github-secrets.mjs reconciles into the ROLLBAR_CLIENT_ACCESS_TOKEN
          # repo secret consumed by build-android-app.yml / deploy-web.yml (LS-7957).
          TF_VAR_rollbar_client_access_token: ${{ secrets.ROLLBAR_CLIENT_ACCESS_TOKEN }}
          TF_VAR_discord_user_signup_webhook_url: ${{ secrets.DISCORD_USER_SIGNUP_WEBHOOK_URL }}
          TF_VAR_discord_stripe_webhook_url: ${{ secrets.DISCORD_STRIPE_WEBHOOK_URL }}
          TF_VAR_discord_client_secret: ${{ secrets.DISCORD_CLIENT_SECRET }}
          TF_VAR_ga_measurement_id: ${{ secrets.GA_MEASUREMENT_ID }}
          TF_VAR_apple_bundle_id: ${{ secrets.APPLE_BUNDLE_ID || vars.APPLE_BUNDLE_ID }}
          TF_VAR_ga_api_secret: ${{ secrets.GA_API_SECRET }}
          TF_VAR_mlb_data_api_key: ${{ secrets.MLB_DATA_API_KEY }}
          TF_VAR_youtube_api_key: ${{ secrets.YOUTUBE_API_KEY }}
          # VAPID keypair for Web Push (browser) notifications (lambdas/notifications).
          # Optional (defaults to "" in secrets.tf) — deliver.ts treats missing keys
          # as "web push disabled" (non-fatal). LS-6838.
          TF_VAR_vapid_public_key: ${{ secrets.VAPID_PUBLIC_KEY }}
          TF_VAR_vapid_private_key: ${{ secrets.VAPID_PRIVATE_KEY }}
          TF_VAR_vapid_subject: ${{ secrets.VAPID_SUBJECT }}
          # Note: TF_VAR_github_app_* removed in LS-2425 — those variables now
          # live in terraform/runners/ and are passed by runner-terraform-apply.yml.
        run: |
          set -o pipefail
          echo "📋 Planning Terraform changes..."
          echo "⏳ Acquiring state lock (wait up to 5 minutes)..."

          # Plan changes with lock timeout
          if terraform plan -input=false -out=tfplan -lock-timeout=5m 2>&1 | tee plan.log; then
            echo "✅ Terraform plan successful"

            # Check if there are any changes
            if grep -q "No changes" plan.log; then
              echo "has_changes=false" >> $GITHUB_OUTPUT
              echo "::notice::No infrastructure changes needed"
            else
              echo "has_changes=true" >> $GITHUB_OUTPUT

              # Extract what's changing
              echo "## 📝 Planned Changes" >> $GITHUB_STEP_SUMMARY
              grep -A 50 "Terraform will perform" plan.log >> $GITHUB_STEP_SUMMARY || true
            fi
          else
            echo "❌ Terraform plan failed"
            cat plan.log
            exit 1
          fi

          # Record the state serial + lineage this plan was computed against
          # (LS-9966). tfplan is only valid for the exact state it was read
          # from — capture that identity now so a later step can assert
          # nothing else wrote to the backend before we apply it. See
          # "Verify State Serial Before Apply" below and
          # .agents/skills/infrastructure/references/terraform-state-and-operations.md#state-serial-assertion-ls-9966
          # for why this doesn't lean on S3 read-after-write consistency.
          STATE_JSON=$(terraform state pull)
          echo "state_serial=$(echo "$STATE_JSON" | jq -r '.serial')" >> "$GITHUB_OUTPUT"
          echo "state_lineage=$(echo "$STATE_JSON" | jq -r '.lineage')" >> "$GITHUB_OUTPUT"

      - name: Release Lock on Plan Failure
        if: always() && steps.plan.outcome == 'failure'
        working-directory: terraform/main
        run: |
          echo "🔓 Releasing terraform lock after plan failure..."
          aws s3 rm s3://legacy-sports-terraform-state/legacy-sports/terraform.tfstate.tflock 2>&1 || true
          echo "✅ Lock released"

      - name: Re-check SSM Versions After Plan
        id: recheck
        if: steps.plan.outputs.has_changes == 'true'
        run: |
          # Race condition fix: if a concurrent lambda upload completed during
          # the plan phase, SSM params now have newer versions than what the plan
          # captured. Re-read SSM and compare against the snapshot taken earlier.
          echo "🔍 Re-checking SSM parameters for concurrent updates..."

          CURRENT_PARAMS=$(aws ssm get-parameters-by-path \
            --path "/legacy-sports/${AWS_STAGE}/lambda/" \
            --recursive \
            --region ${{ env.AWS_REGION }} \
            --query 'Parameters[?contains(Name, `/version`)].{Name:Name,Value:Value}' \
            --output json)

          # Compare with the deterministic hash captured before planning
          PREVIOUS_HASH='${{ steps.check-updates.outputs.params_hash }}'
          CURRENT_HASH=$(echo "$CURRENT_PARAMS" \
            | jq -S 'sort_by(.Name) | map({key: .Name, value: .Value}) | from_entries' \
            | md5sum | cut -d' ' -f1)

          echo "Current SSM versions after plan:"
          echo "$CURRENT_PARAMS" | jq -r '.[] | "  \(.Name | split("/") | .[-2]): \(.Value)"'

          # Check if any versions were updated during the plan phase
          if [ "$PREVIOUS_HASH" != "$CURRENT_HASH" ]; then
            echo "⚠️ SSM parameter versions changed during plan."
            echo "versions_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️ SSM parameter versions unchanged during plan."
            echo "versions_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-plan if Versions Changed
        id: replan
        if: steps.recheck.outputs.versions_changed == 'true'
        working-directory: terraform/main
        env:
          TF_VAR_rollbar_access_token: ${{ secrets.ROLLBAR_ACCESS_TOKEN }}
          # Read-scope Rollbar token consumed by the hosted mcp-rollbar Lambda
          # (LS-8142). The Legacy Sports CLI access token currently has both
          # read and write scopes, so we reuse the same secret for both slots
          # until a separate read-only token is minted (LS-8200).
          TF_VAR_rollbar_read_access_token: ${{ secrets.ROLLBAR_ACCESS_TOKEN }}
          # Client-side (post_client_item) Rollbar token. Optional (defaults to "" in
          # secrets.tf); when set it materializes the github-secrets SSM param that
          # sync-github-secrets.mjs reconciles into the ROLLBAR_CLIENT_ACCESS_TOKEN
          # repo secret consumed by build-android-app.yml / deploy-web.yml (LS-7957).
          TF_VAR_rollbar_client_access_token: ${{ secrets.ROLLBAR_CLIENT_ACCESS_TOKEN }}
          TF_VAR_discord_user_signup_webhook_url: ${{ secrets.DISCORD_USER_SIGNUP_WEBHOOK_URL }}
          TF_VAR_discord_stripe_webhook_url: ${{ secrets.DISCORD_STRIPE_WEBHOOK_URL }}
          TF_VAR_discord_client_secret: ${{ secrets.DISCORD_CLIENT_SECRET }}
          TF_VAR_ga_measurement_id: ${{ secrets.GA_MEASUREMENT_ID }}
          TF_VAR_apple_bundle_id: ${{ secrets.APPLE_BUNDLE_ID || vars.APPLE_BUNDLE_ID }}
          TF_VAR_ga_api_secret: ${{ secrets.GA_API_SECRET }}
          TF_VAR_mlb_data_api_key: ${{ secrets.MLB_DATA_API_KEY }}
          TF_VAR_youtube_api_key: ${{ secrets.YOUTUBE_API_KEY }}
          # VAPID keypair for Web Push (browser) notifications (lambdas/notifications).
          # Optional (defaults to "" in secrets.tf) — deliver.ts treats missing keys
          # as "web push disabled" (non-fatal). LS-6838.
          TF_VAR_vapid_public_key: ${{ secrets.VAPID_PUBLIC_KEY }}
          TF_VAR_vapid_private_key: ${{ secrets.VAPID_PRIVATE_KEY }}
          TF_VAR_vapid_subject: ${{ secrets.VAPID_SUBJECT }}
          # Note: TF_VAR_github_app_* removed in LS-2425 — those variables now
          # live in terraform/runners/ and are passed by runner-terraform-apply.yml.
        run: |
          set -o pipefail
          echo "⚠️ SSM versions changed during plan — re-planning with updated values..."
          EXIT_CODE=0
          terraform plan -input=false -out=tfplan -lock-timeout=5m -detailed-exitcode 2>&1 | tee replan.log || EXIT_CODE=${PIPESTATUS[0]}
          case "$EXIT_CODE" in
            0)
              if grep -q "Terraform will perform the following actions" replan.log; then
                echo "::error::Re-plan exit code was 0 (no changes) but plan output shows pending changes -- possible exit-code masking, failing loudly"
                exit 1
              fi
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              echo "ℹ️ Re-plan found no changes"
              ;;
            2)
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              echo "✅ Re-plan complete with latest Lambda versions"
              ;;
            *)
              echo "::error::Terraform re-plan failed (exit code $EXIT_CODE)"
              exit 1
              ;;
          esac

          # Re-plan reads the backend again, so it supersedes the serial/lineage
          # captured by the original plan step (LS-9966) — the tfplan file on
          # disk was just overwritten and is now only valid for whatever state
          # this pull observes.
          STATE_JSON=$(terraform state pull)
          echo "state_serial=$(echo "$STATE_JSON" | jq -r '.serial')" >> "$GITHUB_OUTPUT"
          echo "state_lineage=$(echo "$STATE_JSON" | jq -r '.lineage')" >> "$GITHUB_OUTPUT"

      - name: Verify State Serial Before Apply
        # LS-9966: during the LS-9877 slice-4 apply, this workflow re-replaced
        # 23 IAM policies/attachments that a slice-3 apply had *already*
        # applied moments earlier, with no wall-clock overlap between the two
        # applies' Apply Infrastructure Changes steps. The suspected cause —
        # S3 backend eventual consistency on the state read — does not hold
        # up: this backend has used_lockfile-based S3 native locking (a real
        # mutex via conditional PUT) since before this incident, and S3 has
        # offered strict read-after-write consistency for all operations,
        # globally, since December 2020, so a GetObject immediately following
        # a completed PutObject cannot observe stale data. The state view a
        # plan reads is only ever wrong if something *else* legitimately wrote
        # to the backend in the window this workflow doesn't otherwise guard:
        # between when a plan/re-plan step reads state and when the Apply
        # step consumes the tfplan file built from it. (This workflow already
        # closes the equivalent gap for Lambda SSM versions via the
        # "Re-check SSM Versions After Plan" / "Re-plan if Versions Changed"
        # pair — this is the same pattern applied to the state file itself,
        # which had no such guard.) Fail loudly here instead of letting a
        # stale tfplan re-apply — see the "state-serial assertion" section of
        # .agents/skills/infrastructure/references/terraform-state-and-operations.md
        # for the full incident writeup.
        id: verify-serial
        if: steps.plan.outputs.has_changes == 'true' && steps.replan.outputs.has_changes != 'false'
        working-directory: terraform/main
        run: |
          set -o pipefail

          # Prefer the re-plan's snapshot when a re-plan ran (it re-read the
          # backend most recently); otherwise fall back to the original plan's.
          if [ "${{ steps.replan.outcome }}" = "success" ]; then
            EXPECTED_SERIAL='${{ steps.replan.outputs.state_serial }}'
            EXPECTED_LINEAGE='${{ steps.replan.outputs.state_lineage }}'
          else
            EXPECTED_SERIAL='${{ steps.plan.outputs.state_serial }}'
            EXPECTED_LINEAGE='${{ steps.plan.outputs.state_lineage }}'
          fi

          echo "🔍 Verifying backend state is unchanged since the tfplan we're about to apply was computed..."
          CURRENT_JSON=$(terraform state pull)
          CURRENT_SERIAL=$(echo "$CURRENT_JSON" | jq -r '.serial')
          CURRENT_LINEAGE=$(echo "$CURRENT_JSON" | jq -r '.lineage')

          echo "  Expected: lineage=$EXPECTED_LINEAGE serial=$EXPECTED_SERIAL"
          echo "  Current:  lineage=$CURRENT_LINEAGE serial=$CURRENT_SERIAL"

          if [ -z "$EXPECTED_SERIAL" ] || [ -z "$EXPECTED_LINEAGE" ]; then
            echo "::error::Could not determine the expected state serial/lineage from the plan step — refusing to apply blind." \
              "This is a workflow bug, not a state race; check the plan/replan step outputs."
            exit 1
          fi

          if [ "$CURRENT_SERIAL" != "$EXPECTED_SERIAL" ] || [ "$CURRENT_LINEAGE" != "$EXPECTED_LINEAGE" ]; then
            echo "::error::State changed underneath this run between plan and apply (lineage/serial mismatch) -- another apply wrote to the backend in that window." \
              "Refusing to apply a stale plan. Re-run this workflow to pick up a fresh plan against the current state."
            exit 1
          fi

          echo "✅ State unchanged since plan — safe to apply"

      - name: "📡 Rollbar Deploy Started"
        if: steps.plan.outputs.has_changes == 'true' && steps.replan.outputs.has_changes != 'false' && steps.verify-serial.outcome == 'success'
        uses: ./.github/actions/rollbar-deploy
        with:
          rollbar-access-token: ${{ secrets.ROLLBAR_ACCESS_TOKEN }}
          environment: ${{ env.AWS_STAGE }}
          status: started
          comment: "Lambda infrastructure apply (run ${{ github.run_id }})"

      - name: Apply Infrastructure Changes
        id: apply
        if: steps.plan.outputs.has_changes == 'true' && steps.replan.outputs.has_changes != 'false' && steps.verify-serial.outcome == 'success'
        working-directory: terraform/main
        env:
          TF_VAR_rollbar_access_token: ${{ secrets.ROLLBAR_ACCESS_TOKEN }}
          # Read-scope Rollbar token consumed by the hosted mcp-rollbar Lambda
          # (LS-8142). The Legacy Sports CLI access token currently has both
          # read and write scopes, so we reuse the same secret for both slots
          # until a separate read-only token is minted (LS-8200).
          TF_VAR_rollbar_read_access_token: ${{ secrets.ROLLBAR_ACCESS_TOKEN }}
          # Client-side (post_client_item) Rollbar token. Optional (defaults to "" in
          # secrets.tf); when set it materializes the github-secrets SSM param that
          # sync-github-secrets.mjs reconciles into the ROLLBAR_CLIENT_ACCESS_TOKEN
          # repo secret consumed by build-android-app.yml / deploy-web.yml (LS-7957).
          TF_VAR_rollbar_client_access_token: ${{ secrets.ROLLBAR_CLIENT_ACCESS_TOKEN }}
          TF_VAR_discord_user_signup_webhook_url: ${{ secrets.DISCORD_USER_SIGNUP_WEBHOOK_URL }}
          TF_VAR_discord_stripe_webhook_url: ${{ secrets.DISCORD_STRIPE_WEBHOOK_URL }}
          TF_VAR_discord_client_secret: ${{ secrets.DISCORD_CLIENT_SECRET }}
          TF_VAR_ga_measurement_id: ${{ secrets.GA_MEASUREMENT_ID }}
          TF_VAR_apple_bundle_id: ${{ secrets.APPLE_BUNDLE_ID || vars.APPLE_BUNDLE_ID }}
          TF_VAR_ga_api_secret: ${{ secrets.GA_API_SECRET }}
          TF_VAR_mlb_data_api_key: ${{ secrets.MLB_DATA_API_KEY }}
          TF_VAR_youtube_api_key: ${{ secrets.YOUTUBE_API_KEY }}
          # VAPID keypair for Web Push (browser) notifications (lambdas/notifications).
          # Optional (defaults to "" in secrets.tf) — deliver.ts treats missing keys
          # as "web push disabled" (non-fatal). LS-6838.
          TF_VAR_vapid_public_key: ${{ secrets.VAPID_PUBLIC_KEY }}
          TF_VAR_vapid_private_key: ${{ secrets.VAPID_PRIVATE_KEY }}
          TF_VAR_vapid_subject: ${{ secrets.VAPID_SUBJECT }}
          # Note: TF_VAR_github_app_* removed in LS-2425 — those variables now
          # live in terraform/runners/ and are passed by runner-terraform-apply.yml.
        run: |
          set -o pipefail
          echo "🚀 Applying Terraform changes..."

          if terraform apply -input=false -auto-approve -lock-timeout=5m tfplan 2>&1 | tee apply.log; then
            echo "## ✅ Infrastructure Updated" >> $GITHUB_STEP_SUMMARY
            echo "Applied changes for ${{ steps.check-updates.outputs.total_lambdas }} Lambda function(s)" >> $GITHUB_STEP_SUMMARY
          else
            # Extract the Terraform error block for the Discord notification.
            # Strip ANSI codes, box-drawing characters, and any values that
            # look like secrets (tokens, keys, URLs with credentials) to avoid
            # leaking TF_VAR_* values that terraform may echo on certain errors.
            ERROR_MSG=$(grep -A 5 '│.*Error:' apply.log \
              | head -20 \
              | sed 's/\x1b\[[0-9;]*m//g' \
              | sed 's/[│╷╵]//g' \
              | sed 's/^[[:space:]]*//' \
              | sed -E 's/(token|key|secret|password|credential)[=: ]*[^ "]+/\1=***REDACTED***/gi' \
              | grep -v '^$' \
              || echo "Unknown error — check workflow logs")
            # Truncate to 900 chars for the Discord embed description
            if [ ${#ERROR_MSG} -gt 900 ]; then
              ERROR_MSG="${ERROR_MSG:0:900}…"
            fi
            echo "apply_error<<TF_ERROR_EOF" >> "$GITHUB_OUTPUT"
            echo "$ERROR_MSG" >> "$GITHUB_OUTPUT"
            echo "TF_ERROR_EOF" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Post-Apply Version Verification
        id: verify-versions
        if: always() && steps.apply.outcome == 'success'
        run: |
          echo "🔍 Verifying deployed Lambda versions match SSM expectations..."

          # Read expected versions from SSM
          EXPECTED=$(aws ssm get-parameters-by-path \
            --path "/legacy-sports/${AWS_STAGE}/lambda/" \
            --recursive \
            --region ${{ env.AWS_REGION }} \
            --query 'Parameters[?contains(Name, `/version`)].{Name:Name,Value:Value}' \
            --output json)

          MISMATCH=false
          while IFS=$'\t' read -r NAME VALUE; do
            LAMBDA_NAME=$(echo "$NAME" | awk -F'/' '{print $(NF-1)}')
            FUNC_NAME="${LAMBDA_PREFIX}-${LAMBDA_NAME}"

            # Get the actual deployed version tag (if available)
            DEPLOYED_DESC=$(aws lambda get-function-configuration \
              --function-name "$FUNC_NAME" \
              --region ${{ env.AWS_REGION }} \
              --query "Description" --output text 2>/dev/null || echo "unknown")

            if [ "$VALUE" != "$DEPLOYED_DESC" ]; then
              echo "  ❌ $LAMBDA_NAME: SSM=$VALUE, Deployed=$DEPLOYED_DESC"
              MISMATCH=true
            else
              echo "  ✅ $LAMBDA_NAME: SSM=$VALUE, Deployed=$DEPLOYED_DESC"
            fi
          done < <(echo "$EXPECTED" | jq -r '.[] | [.Name, .Value] | @tsv')

          if [ "$MISMATCH" = "true" ]; then
            echo "::warning::Version mismatch detected — a concurrent upload may need another apply"
          else
            echo "✅ All deployed versions consistent with SSM"
          fi

      - name: Sync Review Bot App Key to Secrets Manager
        # Runs after every successful apply (or when apply was a no-op) to keep
        # the agent_author_app_private_key Secrets Manager entry in sync with
        # the BOT_APP_PRIVATE_KEY GitHub Actions secret (same key used by
        # review.yml for review-bot token generation). This is
        # idempotent — put-secret-value is safe to call on every workflow run.
        # The step is skipped if apply itself failed (secret resource may not exist).
        #
        # Secret name lookup uses SSM Parameter Store (ssm:GetParameter) rather than
        # secretsmanager:ListSecrets — ListSecrets is a *-resource action that is not
        # in the GitHub Actions IAM policy and would fail with AccessDenied (exit 254).
        # The exact secret name is stored in SSM by Terraform as part of apply.
        if: "!cancelled() && steps.apply.outcome != 'failure'"
        env:
          REVIEW_BOT_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
        run: |
          echo "🔑 Syncing Review Bot app private key to Secrets Manager..."

          # Read the exact secret name from SSM (written by Terraform on apply).
          # Capture stderr alongside stdout so we can distinguish ParameterNotFound
          # (expected on the first run before terraform creates the param) from real
          # errors like AccessDenied or wrong region.
          SSM_EXIT=0
          SSM_OUTPUT=$(aws ssm get-parameter \
            --region "$AWS_REGION" \
            --name "/legacy-sports/${AWS_STAGE}/lambda/github-webhook/agent-author-app-private-key-secret-name" \
            --query "Parameter.Value" \
            --output text 2>&1) || SSM_EXIT=$?

          if [[ $SSM_EXIT -ne 0 ]]; then
            if echo "$SSM_OUTPUT" | grep -q "ParameterNotFound"; then
              echo "::warning::SSM param not yet created — skipping sync. \
          Will succeed automatically on next run after terraform apply."
              exit 0
            fi
            echo "::error::SSM lookup failed (exit $SSM_EXIT): $SSM_OUTPUT"
            exit 1
          fi
          SECRET_NAME="$SSM_OUTPUT"

          aws secretsmanager put-secret-value \
            --region "$AWS_REGION" \
            --secret-id "$SECRET_NAME" \
            --secret-string "$REVIEW_BOT_KEY"

          echo "✅ Review Bot app private key synced: $SECRET_NAME"

      - name: Release Lock on Apply Failure
        if: always() && steps.apply.outcome == 'failure'
        working-directory: terraform/main
        run: |
          echo "🔓 Releasing terraform lock after apply failure..."
          aws s3 rm s3://legacy-sports-terraform-state/legacy-sports/terraform.tfstate.tflock 2>&1 || true
          echo "✅ Lock released"

      - name: "📡 Rollbar Deploy Succeeded"
        if: steps.apply.outcome == 'success'
        uses: ./.github/actions/rollbar-deploy
        with:
          rollbar-access-token: ${{ secrets.ROLLBAR_ACCESS_TOKEN }}
          environment: ${{ env.AWS_STAGE }}
          status: succeeded
          comment: "Lambda infrastructure apply (run ${{ github.run_id }})"

      - name: "📡 Rollbar Deploy Failed"
        if: always() && steps.apply.outcome == 'failure'
        uses: ./.github/actions/rollbar-deploy
        with:
          rollbar-access-token: ${{ secrets.ROLLBAR_ACCESS_TOKEN }}
          environment: ${{ env.AWS_STAGE }}
          status: failed
          comment: "Lambda infrastructure apply (run ${{ github.run_id }})"

      - name: Build deploy changelog
        id: deploy-changelog
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE_SHA=""
          # Use the triggering workflow's SHA as the range endpoint — checkout
          # may land on a newer main commit if pushes arrive between trigger
          # and this job starting.
          RANGE_END="${{ github.event.workflow_run.head_sha || github.sha }}"

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # Find the previous successful Deploy workflow run's head SHA.
            # Filter by run id (not head_sha) so re-runs on the same commit
            # don't accidentally skip all runs for that SHA.
            TRIGGER_RUN_ID="${{ github.event.workflow_run.id }}"
            PREV_SHA=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?status=success&branch=main&per_page=5" \
              --jq "[.workflow_runs[] | select(.id != ${TRIGGER_RUN_ID})][0].head_sha // empty")

            if [ -n "$PREV_SHA" ] && git merge-base --is-ancestor "$PREV_SHA" "$RANGE_END" 2>/dev/null; then
              BASE_SHA="$PREV_SHA"
            fi
          fi

          if [ -n "$BASE_SHA" ]; then
            # Show commits since the previous deploy, filtered to lambda/terraform paths
            COMMITS=$(git log "${BASE_SHA}..${RANGE_END}" \
              --pretty=format:'[`%h`](https://github.com/${{ github.repository }}/commit/%H) %s' \
              --first-parent -- lambdas/ terraform/)

            if [ -z "$COMMITS" ]; then
              # No lambda/terraform changes — show all commits in the range
              COMMITS=$(git log "${BASE_SHA}..${RANGE_END}" \
                --pretty=format:'[`%h`](https://github.com/${{ github.repository }}/commit/%H) %s' \
                --first-parent)
            fi
          else
            # Fallback: last 10 commits touching lambdas/ or terraform/
            COMMITS=$(git log --pretty=format:'[`%h`](https://github.com/${{ github.repository }}/commit/%H) %s' \
              --first-parent -10 -- lambdas/ terraform/)

            if [ -z "$COMMITS" ]; then
              COMMITS=$(git log --pretty=format:'[`%h`](https://github.com/${{ github.repository }}/commit/%H) %s' \
                --first-parent -10)
            fi
          fi

          {
            echo "commits<<CHANGELOG_EOF"
            echo "$COMMITS"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: "Discord Deploy Succeeded"
        if: steps.apply.outcome == 'success'
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: success
          title: "Lambda Infrastructure Deploy"
          environment: ${{ env.AWS_STAGE }}
          description: "Applied Terraform changes for ${{ steps.check-updates.outputs.total_lambdas }} Lambda function(s)"
          commits: ${{ steps.deploy-changelog.outputs.commits }}

      - name: "Discord Deploy Failed"
        if: always() && steps.apply.outcome == 'failure'
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: failure
          title: "Lambda Infrastructure Deploy"
          environment: ${{ env.AWS_STAGE }}
          description: |
            Terraform apply failed:
            ```
            ${{ steps.apply.outputs.apply_error || 'Unknown error — check workflow logs' }}
            ```
          commits: ${{ steps.deploy-changelog.outputs.commits }}

      # -------------------------------------------------------------------
      # Repeated-failure escalation (LS-7933): the step above posts an
      # identical embed on every failed apply, so an on-call engineer can
      # habituate to it (this is exactly how the LS-7931 4-day apply freeze
      # went unnoticed). This counts the trailing streak of failed runs of
      # THIS workflow on main (same gh api .../runs primitive as the "Build
      # deploy changelog" step above) and posts a second, distinctly-titled,
      # @here-mentioning alert once the streak reaches
      # vars.LAMBDA_APPLY_FAILURE_ESCALATION_THRESHOLD (repo var, default 3
      # — ships hardcoded per this ticket's Out of Scope: adding the repo var
      # itself is an admin action, not required for this to work).
      # -------------------------------------------------------------------
      - name: Count Consecutive Apply Failures
        id: count-failures
        if: always() && steps.apply.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          THRESHOLD: ${{ vars.LAMBDA_APPLY_FAILURE_ESCALATION_THRESHOLD || '3' }}
        run: |
          echo "threshold=${THRESHOLD}" >> "$GITHUB_OUTPUT"

          # Most recent completed runs of this workflow on main, newest
          # first, excluding this still-in-progress run.
          CONCLUSIONS=$(gh api "repos/${{ github.repository }}/actions/workflows/lambda-terraform-apply.yml/runs?branch=main&status=completed&per_page=20" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})] | .[].conclusion")

          # Trailing streak of prior failures, plus 1 for this run's failure.
          STREAK=1
          while IFS= read -r CONCLUSION; do
            [ -z "$CONCLUSION" ] && continue
            if [ "$CONCLUSION" = "failure" ]; then
              STREAK=$((STREAK + 1))
            else
              break
            fi
          done <<< "$CONCLUSIONS"

          echo "consecutive_failures=${STREAK}" >> "$GITHUB_OUTPUT"
          echo "::notice::Consecutive Apply Lambda Infrastructure failures (including this run): ${STREAK} (escalation threshold: ${THRESHOLD})"

          if [ "$STREAK" -ge "$THRESHOLD" ]; then
            echo "should_escalate=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_escalate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Discord Deploy Repeated Failure"
        # should_escalate is true for every run once the streak reaches the
        # threshold (not just the run where it first crosses it) — the
        # embed title always includes the current streak count, so each
        # post is distinguishable from the last rather than a repeat of the
        # same message.
        if: always() && steps.apply.outcome == 'failure' && steps.count-failures.outputs.should_escalate == 'true'
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: failure
          title: "Apply Lambda Infrastructure — REPEATED FAILURE (${{ steps.count-failures.outputs.consecutive_failures }}x in a row)"
          environment: ${{ env.AWS_STAGE }}
          content: >-
            @here Apply Lambda Infrastructure has now failed
            ${{ steps.count-failures.outputs.consecutive_failures }} consecutive times on main
            (escalation threshold: ${{ steps.count-failures.outputs.threshold }}).
          description: |
            This is a distinct escalation from the routine failure post above — uploaded Lambda artifacts may be stuck pending apply for an extended period. Investigate immediately.

            Latest error:
            ```
            ${{ steps.apply.outputs.apply_error || 'Unknown error — check workflow logs' }}
            ```
          commits: ${{ steps.deploy-changelog.outputs.commits }}

      - name: Verify Deployment
        if: steps.plan.outputs.has_changes == 'true' && steps.replan.outputs.has_changes != 'false'
        run: |
          echo "🔍 Verifying Lambda deployments..."

          # Get list of Lambda functions
          FUNCTIONS=$(aws lambda list-functions \
            --region ${{ env.AWS_REGION }} \
            --query 'Functions[?starts_with(FunctionName, `legacy-sports-`)].{Name:FunctionName,Updated:LastModified}' \
            --output json)

          echo "## 🎉 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "### Updated Functions:" >> $GITHUB_STEP_SUMMARY
          echo "$FUNCTIONS" | jq -r '.[] | "- **\(.Name)**: \(.Updated)"' >> $GITHUB_STEP_SUMMARY

      - name: Cleanup on Failure
        if: always() && (failure() || cancelled())
        working-directory: terraform/main
        run: |
          echo "🔓 Ensuring terraform lock is released..."
          aws s3 rm s3://legacy-sports-terraform-state/legacy-sports/terraform.tfstate.tflock 2>&1 || true
          echo "✅ Lock released"

      # -------------------------------------------------------------------
      # Post-deploy health checks for non-HTTP Lambdas
      # Updates shields.io badges so they reflect actual deploy-time state
      # instead of polling every 15 minutes.
      # -------------------------------------------------------------------
      - name: Check Stats Lambda Health
        id: stats-health
        if: always()
        run: |
          STATE=$(aws lambda get-function-configuration \
            --function-name "${{ env.LAMBDA_PREFIX }}-stats" \
            --region "${{ env.AWS_REGION }}" \
            --query "State" --output text 2>/dev/null || echo "unknown")
          echo "State: $STATE"
          case "$STATE" in
            Active)   echo "result=healthy"  >> "$GITHUB_OUTPUT" ;;
            Inactive) echo "result=degraded" >> "$GITHUB_OUTPUT" ;;
            *)        echo "result=offline"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Check Draft Processor Lambda Health
        id: draft-health
        if: always()
        run: |
          STATE=$(aws lambda get-function-configuration \
            --function-name "${{ env.LAMBDA_PREFIX }}-draft-processor" \
            --region "${{ env.AWS_REGION }}" \
            --query "State" --output text 2>/dev/null || echo "unknown")
          echo "State: $STATE"
          case "$STATE" in
            Active)   echo "result=healthy"  >> "$GITHUB_OUTPUT" ;;
            Inactive) echo "result=degraded" >> "$GITHUB_OUTPUT" ;;
            *)        echo "result=offline"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Check WebSocket Lambda Health
        id: websocket-health
        if: always()
        run: |
          STATE=$(aws lambda get-function-configuration \
            --function-name "${{ env.LAMBDA_PREFIX }}-websocket" \
            --region "${{ env.AWS_REGION }}" \
            --query "State" --output text 2>/dev/null || echo "unknown")
          echo "State: $STATE"
          case "$STATE" in
            Active)   echo "result=healthy"  >> "$GITHUB_OUTPUT" ;;
            Inactive) echo "result=degraded" >> "$GITHUB_OUTPUT" ;;
            *)        echo "result=offline"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Badge — Stats Lambda
        if: always()
        uses: ./.github/actions/update-health-badge
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          gist-id: ${{ secrets.CI_BADGES_GIST_ID }}
          lambda-name: "Stats Lambda"
          health-status: ${{ steps.stats-health.outputs.result || 'offline' }}

      - name: Badge — Draft Processor Lambda
        if: always()
        uses: ./.github/actions/update-health-badge
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          gist-id: ${{ secrets.CI_BADGES_GIST_ID }}
          lambda-name: "Draft Processor Lambda"
          health-status: ${{ steps.draft-health.outputs.result || 'offline' }}

      - name: Badge — WebSocket Lambda
        if: always()
        uses: ./.github/actions/update-health-badge
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          gist-id: ${{ secrets.CI_BADGES_GIST_ID }}
          lambda-name: "WebSocket Lambda"
          health-status: ${{ steps.websocket-health.outputs.result || 'offline' }}

      - name: Update Deployment Badge
        if: always()
        uses: ./.github/actions/update-deployment-badge
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          gist-id: ${{ secrets.CI_BADGES_GIST_ID }}
          deployment-name: "Apply Lambda Infrastructure"
          deployment-status: ${{ job.status }}
          workflow-run-id: ${{ github.run_id }}
          branch: ${{ github.ref_name }}

  # ==========================================================================
  # Classify a red apply as runner churn, and retry it
  # ==========================================================================
  # Every runner in the pool is instanceLifecycle=spot (LS-1660), so an apply
  # can go red without terraform ever failing — EC2 simply reclaims the
  # instance mid-job. Two of the last eight applies died that way (runs
  # 31684987464 and 31721455767); one of them had already applied
  # successfully and still reported red. Without this job the run carries a
  # single job and no signal, so a spot death is indistinguishable from a
  # genuine IAM/terraform failure to anyone — or anything — triaging it.
  #
  # This job does NOT try to prevent spot interruption. That is the accepted
  # cost of the spot pool and was closed Won't Do under LS-8261. It only makes
  # the resulting failure legible and self-healing.
  #
  # Unlike ci-orchestrator.yml's equivalent, there is no PR here to label or
  # comment on: this workflow runs on main via workflow_run/workflow_dispatch.
  # The signal is therefore the presence and conclusion of this job itself
  # (visible to ci_view_run_jobs), plus a step-summary verdict and an
  # annotation on the run.
  #
  # Retrying is safe: terraform apply is idempotent, and the retried run's
  # "Clear Stale Locks" step removes any .tflock the killed run left behind
  # before init. (The workflow's own lock-release steps cannot be relied on
  # here — when the runner dies mid-step, no later step executes at all.)
  # ==========================================================================
  report-runner-shutdown:
    name: "⚡ Report Runner Shutdown"
    needs: [apply-infrastructure]
    if: >-
      always() &&
      (needs.apply-infrastructure.result == 'failure' ||
      needs.apply-infrastructure.result == 'cancelled')
    # LS-10312: pinned to ubuntu-latest for the same reason as
    # ci-orchestrator.yml's report-runner-shutdown (LS-9710) — this job reports
    # that the self-hosted pool died, so it must not queue on that pool.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Required to re-dispatch this workflow after a confirmed runner death.
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Detect runner shutdown
        id: detect
        uses: ./.github/actions/detect-runner-shutdown
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.run_id }}

      - name: Report genuine failure
        if: steps.detect.outputs.shutdown-detected != 'true'
        run: |
          echo "::notice::No runner-shutdown signal found — treat this as a real terraform/IAM failure."
          {
            echo "## ❌ Apply failed — genuine failure"
            echo ""
            echo "No \`runner has received a shutdown signal\` marker was found in the failed job's log."
            echo "This run failed on its own merits — read the apply log before retrying."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report runner shutdown
        if: steps.detect.outputs.shutdown-detected == 'true'
        env:
          SHUTDOWN_JOBS: ${{ steps.detect.outputs.job-names }}
        run: |
          echo "::warning::CI: Runner Flake — the apply runner was reclaimed mid-job (spot interruption), not a terraform failure."
          {
            echo "## ⚡ Apply interrupted by a runner shutdown"
            echo ""
            echo "The following job(s) logged \`runner has received a shutdown signal\`: **${SHUTDOWN_JOBS}**"
            echo ""
            echo "This is spot-instance churn on the self-hosted runner pool (LS-1660), **not** a terraform"
            echo "or IAM failure. Infrastructure may be fully applied, partially applied, or untouched —"
            echo "the retry below reconciles whichever it is."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retry apply after runner shutdown
        # inputs['is-retry'] is null for workflow_run triggers, so the first death
        # always retries; the retry carries the flag and stops here. Tested as a
        # truthiness check rather than `== true` because createWorkflowDispatch
        # sends inputs as strings — same idiom as skip-debounce above.
        if: steps.detect.outputs.shutdown-detected == 'true' && !inputs['is-retry']
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'lambda-terraform-apply.yml',
              ref: 'main',
              inputs: { 'skip-debounce': 'true', 'is-retry': 'true' },
            });
            core.info('Re-dispatched lambda-terraform-apply.yml to reconcile infrastructure.');
            core.summary.addRaw('\n🔁 Automatic retry dispatched.\n');
            await core.summary.write();

      - name: Note retry cap reached
        if: steps.detect.outputs.shutdown-detected == 'true' && inputs['is-retry']
        run: |
          echo "::warning::This run was already an automatic retry — not re-dispatching again."
          {
            echo ""
            echo "🛑 This run was itself the automatic retry, so no further retry was dispatched."
            echo "Repeated spot deaths in a row need a human look at the runner pool."
          } >> "$GITHUB_STEP_SUMMARY"
