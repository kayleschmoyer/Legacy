name: "Terraform Drift Check"

# =============================================================================
# Scheduled drift detection for terraform/main infrastructure.
#
# Runs a speculative plan weekly (and on-demand) against the live AWS state and
# fails if it detects any changes to NON-Lambda resources.  Lambda function
# version updates are expected and skipped; anything else — a missing EC2
# instance, a security-group diff, an IAM policy change — indicates state drift
# that will cause the next post-merge Apply Lambda Infrastructure run to fail.
#
# When drift is detected the job posts a Discord alert with the affected
# resource addresses so the on-call engineer can manually reconcile before the
# next deploy.
#
# LS-4871
# =============================================================================

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 09:00 UTC
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  PLAN_ROLE_ARN: arn:aws:iam::176661590736:role/legacy-sports-dev-github-actions-plan

jobs:
  drift-check:
    name: "Terraform Drift Check (terraform/main)"
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: "Configure AWS credentials (read-only plan role)"
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6
        with:
          role-to-assume: ${{ env.PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4
        with:
          terraform_version: "~> 1.14"
          terraform_wrapper: false

      - name: "terraform init"
        working-directory: terraform/main
        run: terraform init -input=false

      - name: "terraform plan"
        id: plan
        working-directory: terraform/main
        env:
          TF_VAR_rollbar_access_token: ${{ secrets.ROLLBAR_ACCESS_TOKEN }}
          TF_VAR_discord_user_signup_webhook_url: ${{ secrets.DISCORD_USER_SIGNUP_WEBHOOK_URL }}
          TF_VAR_discord_stripe_webhook_url: ${{ secrets.DISCORD_STRIPE_WEBHOOK_URL }}
          TF_VAR_discord_client_secret: ${{ secrets.DISCORD_CLIENT_SECRET }}
          TF_VAR_ga_measurement_id: ${{ secrets.GA_MEASUREMENT_ID }}
          TF_VAR_ga_api_secret: ${{ secrets.GA_API_SECRET }}
          TF_VAR_mlb_data_api_key: ${{ secrets.MLB_DATA_API_KEY }}
        run: |
          # -lock=false: read-only speculative plan; never contend with the
          # post-merge apply for the state lock.
          set +e
          terraform plan -no-color -input=false -lock=false -detailed-exitcode 2>&1 | tee plan.log
          PLAN_EXIT=${PIPESTATUS[0]}
          echo "exit=${PLAN_EXIT}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: "Detect non-Lambda drift"
        id: drift
        if: steps.plan.outputs.exit != '0'
        shell: bash
        run: |
          PLAN_EXIT="${{ steps.plan.outputs.exit }}"

          if [ "$PLAN_EXIT" = "1" ]; then
            echo "plan_error=true" >> "$GITHUB_OUTPUT"
            echo "drift_found=false" >> "$GITHUB_OUTPUT"
            echo "drift_resources=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # exit=2 means changes detected. Extract the list of resource
          # addresses that will change, then filter out expected Lambda-only
          # updates (aws_lambda_function and aws_lambda_function_event_invoke_config).
          # Changes to data sources are always expected (they refresh on every plan).
          CHANGING=$(grep -E '^\s+#\s+(aws_|module\.)' plan.log \
            | grep -v '^\s+#.*will be read' \
            | sed 's/.*#[[:space:]]*//' \
            | awk '{print $1}' \
            | sort -u || true)

          NON_LAMBDA=$(echo "$CHANGING" \
            | grep -v '^aws_lambda_function\.' \
            | grep -v '^aws_lambda_function_event_invoke_config\.' \
            | grep -v '^aws_ssm_parameter\.' \
            | grep -v '^data\.' \
            || true)

          if [ -n "$NON_LAMBDA" ]; then
            echo "drift_found=true" >> "$GITHUB_OUTPUT"
            # Newlines in GITHUB_OUTPUT require the heredoc delimiter pattern
            {
              echo "drift_resources<<DRIFT_EOF"
              echo "$NON_LAMBDA"
              echo "DRIFT_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "plan_error=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift_found=false" >> "$GITHUB_OUTPUT"
            echo "drift_resources=" >> "$GITHUB_OUTPUT"
            echo "plan_error=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Write job summary"
        if: always() && steps.plan.outputs.exit != ''
        working-directory: terraform/main
        shell: bash
        env:
          PLAN_EXIT: ${{ steps.plan.outputs.exit }}
          DRIFT_FOUND: ${{ steps.drift.outputs.drift_found }}
          DRIFT_RESOURCES: ${{ steps.drift.outputs.drift_resources }}
          PLAN_ERROR: ${{ steps.drift.outputs.plan_error }}
        run: |
          if [ "$PLAN_ERROR" = "true" ]; then
            echo "## ❌ Terraform plan error" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E 'Error:|AccessDenied|not authorized' plan.log | head -20 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PLAN_EXIT" = "0" ]; then
            echo "## ✅ No infrastructure drift detected" >> "$GITHUB_STEP_SUMMARY"
            echo "All Terraform state matches live AWS." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$DRIFT_FOUND" = "true" ]; then
            echo "## ⚠️ Infrastructure drift detected" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The following non-Lambda resources have pending changes." >> "$GITHUB_STEP_SUMMARY"
            echo "The next deploy will attempt to apply them; destroy+create cycles may cause downtime." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$DRIFT_RESOURCES" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Action required**: investigate and reconcile before the next deploy (e.g. \`terraform import\`, fix state, or open a PR)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ✅ No infrastructure drift detected" >> "$GITHUB_STEP_SUMMARY"
            echo "Only Lambda function version changes pending (expected)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "Discord alert — plan error"
        if: always() && steps.drift.outputs.plan_error == 'true'
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: failure
          title: "Terraform Drift Check — plan error"
          description: |
            `terraform plan` failed for `terraform/main`. Check the workflow logs — this is likely a missing IAM permission on the plan role.

            [View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: "Discord alert — drift detected"
        if: always() && steps.drift.outputs.drift_found == 'true'
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: failure
          title: "Terraform Drift Check — infrastructure drift"
          description: |
            Non-Lambda resources have pending changes in `terraform/main`. The next deploy will apply them — if any require a destroy+create this may cause downtime.

            **Affected resources:**
            ```
            ${{ steps.drift.outputs.drift_resources }}
            ```

            Investigate and reconcile before the next deploy. See the [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for the full plan.

      - name: "Fail if drift or plan error"
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.plan.outputs.exit }}" = "1" ]; then
            echo "::error::terraform plan failed — check job logs."
            exit 1
          fi
          if [ "${{ steps.drift.outputs.drift_found }}" = "true" ]; then
            echo "::error::Infrastructure drift detected in non-Lambda resources. See job summary."
            exit 1
          fi
          echo "✅ No infrastructure drift."
