name: "Legacy Sports CI Orchestrator"

# Central orchestrator for pull requests and integration branches. Determines
# which pipelines need to run, then dispatches reusable workflows for CI and
# security scanning. Nightly Playwright runs live in run-playwright-tests.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [develop]
  merge_group:
  schedule:
    - cron: "0 2 * * 1" # Weekly security scan (Mondays 02:00 UTC)
  workflow_dispatch:
    inputs:
      debug_mode:
        description: "Enable debug mode for detailed logging"
        required: false
        default: false
        type: boolean
      scan_type:
        description: "Security scan type"
        required: false
        default: "comprehensive"
        type: choice
        options:
          - comprehensive
          - dependencies-only
          - sast-only
          - secrets-only
      run_security:
        description: "Force security scanning"
        required: false
        default: true
        type: boolean

concurrency:
  group: orchestrator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# IMPORTANT: Orchestrator permissions must include ALL permissions required by called workflows
# When using workflow_call, the calling workflow's permissions apply to ALL called workflows,
# even if called workflows declare their own permissions. This is a GitHub Actions limitation.
# See: https://docs.github.com/en/actions/using-workflows/reusing-workflows#supported-keywords-for-jobs-that-call-a-reusable-workflow
#
# Required permissions breakdown:
# - contents: read        → Required for checkout and code access
# - actions: read         → Required for workflow run queries (ci-pipeline needs this)
# - pull-requests: write  → Required for PR comments (ci-reporting action in ci-pipeline)
# - checks: read          → Required for status check queries (ci-pipeline validation)
# - issues: write         → Required for issue creation on failures (ci-reporting action)
# - security-events: write → Required for SARIF uploads (security-scanning workflow)
# - statuses: write       → Required for commit status updates (security-gate job)
# - id-token: write       → Required for OIDC auth to AWS (S3 CI artifacts in ci-pipeline)
#
# Reducing these permissions causes startup_failure in called workflows (LS-106)
permissions:
  actions: read
  contents: read
  pull-requests: write
  checks: read
  issues: write
  security-events: write
  statuses: write
  id-token: write

jobs:
  determine-scope:
    name: "🔍 Determine Workflow Scope"
    runs-on: ubuntu-latest
    outputs:
      run-security: ${{ steps.scope.outputs.run-security }}
      security-scan-type: ${{ steps.scope.outputs.security-scan-type }}
      runner-label: ${{ steps.runner-access.outputs.runner-label }}

    steps:
      - name: "🚀 Checkout Repository"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "🧮 Set Scope Outputs"
        id: scope
        run: |
          set -eo pipefail

          event='${{ github.event_name }}'
          schedule='${{ github.event.schedule || '' }}'
          manual_security='${{ github.event_name == 'workflow_dispatch' && (inputs.run_security && 'true' || 'false') }}'

          run_security=false
          scan_type=comprehensive

          if [ "$event" = "schedule" ]; then
            case "$schedule" in
              "0 2 * * 1")
                run_security=true
                ;;
              *)
                run_security=true
                ;;
            esac
          elif [ "$event" = "workflow_dispatch" ]; then
            run_security="$manual_security"
          elif [ "$event" = "merge_group" ]; then
            run_security=true
          else
            base_ref=""
            if [ "$event" = "pull_request" ]; then
              base_ref='${{ github.event.pull_request.base.sha }}'
            elif [ "$event" = "push" ]; then
              base_ref='${{ github.event.before }}'
            fi

            if [ "$base_ref" = "0000000000000000000000000000000000000000" ]; then
              base_ref=""
            fi

            if [ -z "$base_ref" ]; then
              base_ref=$(git rev-parse HEAD^ 2>/dev/null || echo "")
            fi

            if [ -n "$base_ref" ]; then
              changed_files=$(git diff --name-only "$base_ref" "${{ github.sha }}" || true)
            else
              changed_files=""
            fi

            if [ -n "$changed_files" ]; then
              # Dependency paths — heavyweight scanning (pnpm audit, Snyk, Trivy)
              DEPENDENCY_PATHS='(^|/)package\.json$|(^|/)pnpm-lock\.yaml$|(^|/)\.npmrc$'

              # Code paths — lightweight scanning (SAST, secret detection)
              CODE_PATHS='^apps\/.*\.(ts|tsx|js|jsx)$'
              CODE_PATHS="$CODE_PATHS|^lib\/.*\.(ts|tsx|js|jsx)$"
              CODE_PATHS="$CODE_PATHS|^lambdas\/.*\.(ts|js)$"
              CODE_PATHS="$CODE_PATHS|^tools\/.*\.(ts|js)$"
              CODE_PATHS="$CODE_PATHS|^\.github\/workflows\/security-scanning\.yml$"
              CODE_PATHS="$CODE_PATHS|^tsconfig.*\.json$"

              deps_changed=false
              code_changed=false

              if echo "$changed_files" | grep -Eq "$DEPENDENCY_PATHS"; then
                deps_changed=true
              fi
              if echo "$changed_files" | grep -Eq "$CODE_PATHS"; then
                code_changed=true
              fi

              # SAST is expensive (10-20 min). Run it on merge_group & schedule only.
              # PRs get secret scanning (fast) + dependency scanning when deps change.
              if [ "$deps_changed" = true ]; then
                run_security=true
                scan_type=dependencies-only
              elif [ "$code_changed" = true ]; then
                run_security=true
                scan_type=secrets-only
              fi
            fi

            # Allow 'security-scan' label to force comprehensive scanning on any PR
            if [ "$event" = "pull_request" ]; then
              labels='${{ join(github.event.pull_request.labels.*.name, ',') }}'
              if echo ",$labels," | grep -q ",security-scan,"; then
                run_security=true
                scan_type=comprehensive
              fi
            fi
          fi

          if [ "$run_security" != "true" ]; then
            run_security=false
          fi

          echo "run-security=$run_security" >> "$GITHUB_OUTPUT"
          echo "security-scan-type=$scan_type" >> "$GITHUB_OUTPUT"

      # LS-1652: Only allow self-hosted runners for PR authors with write permission.
      # External contributors (read-only) are routed to GitHub-hosted runners to prevent
      # untrusted code from executing on our infrastructure.
      - name: "🔒 Resolve Runner Label"
        id: runner-access
        uses: ./.github/actions/resolve-runner-label
        with:
          runner-label: ${{ vars.CI_RUNNER_LABEL }}

  ci-pipeline:
    name: "🚀 CI Pipeline"
    needs: [determine-scope]
    # Skip on push-to-main: code was already validated by the PR CI run.
    # Deployment workflows (deploy-web, upload-*) run independently.
    # Weekly scheduled run + manual dispatch still provide full validation.
    if: ${{ github.event_name != 'push' }}
    uses: ./.github/workflows/ci-pipeline.yml
    with:
      debug_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_mode || false }}
      e2e-test-patterns: "@critical"
      e2e-exclude-patterns: "@slow"
      e2e-shard-total: 1
      runner-label: ${{ needs.determine-scope.outputs.runner-label }}
    secrets: inherit

  security-scanning:
    name: "🔐 Security Scanning"
    needs: [determine-scope]
    # Skip on push-to-main (PR CI already scanned); weekly schedule provides ongoing coverage.
    if: ${{ github.event_name != 'push' && needs.determine-scope.outputs.run-security == 'true' }}
    uses: ./.github/workflows/security-scanning.yml
    with:
      # Scan type is determined by what changed: deps → dependency scan, code → SAST/secrets, both → comprehensive
      scan_type: ${{ github.event_name == 'workflow_dispatch' && inputs.scan_type || needs.determine-scope.outputs.security-scan-type }}
      runner-label: ${{ needs.determine-scope.outputs.runner-label }}
    secrets: inherit

  # ============================================================================
  # Label PR with failure reasons from security scanning
  # CI pipeline labels are handled by the summarize job inside ci-pipeline.yml.
  # ============================================================================
  label-pr:
    name: "🏷️ Label PR"
    needs: [determine-scope, security-scanning]
    if: "!cancelled() && github.event.pull_request.number"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: "Label PR on Security Failure"
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue.number;
            if (!prNumber) return;

            const securityResult = '${{ needs.security-scanning.result }}';
            const label = 'CI: Security';

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const existingLabels = pr.labels.map(l => l.name);

            async function withRetry(fn, retries = 3) {
              for (let i = 0; i < retries; i++) {
                try { return await fn(); }
                catch (e) {
                  const isPrimaryRateLimit = e.status === 429;
                  const isSecondaryRateLimit = e.status === 403 && /secondary rate limit/i.test(typeof e.message === 'string' ? e.message : '');
                  if ((isPrimaryRateLimit || isSecondaryRateLimit) && i < retries - 1) {
                    const delay = Math.pow(2, i) * 1000;
                    core.warning(`Rate limited (${e.status}), retrying in ${delay}ms…`);
                    await new Promise(r => setTimeout(r, delay));
                  } else throw e;
                }
              }
            }

            const shouldHaveLabel = securityResult === 'failure';
            const hasLabel = existingLabels.includes(label);
            if (shouldHaveLabel && !hasLabel) {
              await withRetry(() => github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: [label],
              }));
              core.info(`Label added: ${label}`);
            } else if (!shouldHaveLabel && hasLabel) {
              await withRetry(() => github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name: label,
              }));
              core.info(`Label removed: ${label}`);
            }

  # ============================================================================
  # Remove "merge-when-ready" label on CI failure
  # ============================================================================
  # Prevents a failing PR from sitting in the merge queue indefinitely.
  # The label is removed so the author must consciously re-add it after fixing.
  # Only fires on real pipeline failures, not cancellations (new push) or skips.
  #
  # NOTE: needs.ci-pipeline.result was unreliable when ci-pipeline.yml used
  # if: always() on internal jobs (GitHub Actions limitation — workflow_call
  # result was always 'failure'). Fixed in LS-1115 by replacing always() with
  # !cancelled() inside ci-pipeline.yml. This job still uses the explicit
  # overall-status output as a safety net.
  # ============================================================================
  remove-merge-label-on-failure:
    name: "🏷️ Remove Merge Label on Failure"
    needs: [determine-scope, ci-pipeline]
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.ci-pipeline.outputs.overall-status == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Remove merge-when-ready label
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            // Fetch current PR to get fresh label state (payload labels may be stale)
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });

            const hasMergeLabel = pr.labels.some(l => l.name === 'merge-when-ready');
            if (!hasMergeLabel) {
              console.log(`PR #${prNumber} does not have merge-when-ready label, skipping`);
              return;
            }

            await github.rest.issues.removeLabel({
              owner,
              repo,
              issue_number: prNumber,
              name: 'merge-when-ready'
            });
            console.log(`Removed merge-when-ready label from PR #${prNumber}`);

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: '⚠️ **`merge-when-ready` label removed** — CI pipeline failed.\n\n' +
                    'The label was automatically removed to prevent merging a failing PR. ' +
                    'Fix the CI failures and re-add the label when ready.\n\n' +
                    '---\n*Automated message from CI pipeline*'
            });
            console.log(`Posted failure comment on PR #${prNumber}`);
