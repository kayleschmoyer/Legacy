name: "Legacy Sports CI Orchestrator"

# Central orchestrator for pull requests and integration branches. Determines
# which pipelines need to run, then dispatches reusable workflows for CI and
# security scanning. Nightly Playwright runs live in run-playwright-tests.yml.
#
# Trigger design: CI runs on every push (opened/synchronize/reopened) so check
# runs land in a push-event check suite that GitHub's branch protection evaluator
# recognises. The bot review (pull_request_review: approved) also triggers the
# orchestrator — the check-prior-success idempotency guard skips re-running CI
# when the current SHA already has passing checks from the synchronize run, so
# CI never executes twice for the same commit. Review and CI run in parallel;
# branch protection requires both before the merge queue can proceed.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  # No merge_group trigger: merging is handled by the custom queue in
  # merge-queue.yml, which merges the already-validated head SHA. Do not re-add
  # merge_group without a prior-success short-circuit — merge-group commits get
  # fresh SHAs, so check-prior-success would re-run full CI + comprehensive
  # security scans for every queued PR.
  workflow_dispatch:
    inputs:
      pr_number:
        description: >-
          PR number this run should be scoped to (LS-9148). When set, the
          determine-scope job resolves the PR's base/head SHAs via the API and
          threads them into CI Pipeline so lint/format diff against the PR's
          merge-base (like the native pull_request trigger) instead of the
          whole repo, and so CI Gate can post to the PR. Leave empty for a
          repo-wide run with no PR context (e.g. debugging main).
        required: false
        default: ""
        type: string
      base_sha:
        description: >-
          LS-10571: base commit for a PR-less run, used by the merge queue's
          batch test refs (mq/test/*). Scopes lint/format/affected to the diff
          base_sha..HEAD (the union of the batched PRs) instead of the whole
          repo. Ignored when pr_number is set.
        required: false
        default: ""
        type: string
      debug_mode:
        description: "Enable debug mode for detailed logging"
        required: false
        default: false
        type: boolean
      scan_type:
        description: "Security scan type"
        required: false
        default: "comprehensive"
        type: choice
        options:
          - comprehensive
          - dependencies-only
          - sast-only
          - secrets-only
      run_security:
        description: "Force security scanning"
        required: false
        default: true
        type: boolean

# cancel-in-progress must stay false — review events must not cancel an
# in-progress CI run. But false does not protect the QUEUED run: GitHub keeps at
# most one pending run per group, and a newer event cancels the queued run and
# takes its place. A non-approved review (bot comment, JUSTIFY reply review)
# arriving while the synchronize-triggered run was still queued behind the
# previous SHA's pipeline cancelled the only run that would post CI Gate for the
# new SHA, then skipped all jobs itself — leaving the merge queue waiting on
# "CI Gate (not yet registered)" forever (LS-9053, PR #6711).
#
# LS-9810: approved reviews used to keep the shared group on the theory that
# "if one displaces a queued run it executes the same CI" — but on a PR
# receiving rapid push+approval churn (11 orchestrator triggers in 90 minutes
# observed on PR #7473), a queued run can get displaced by the *next* event
# before it ever starts a single job, repeatedly, so the shared slot never
# clears and no run ever posts CI Gate (runs observed sitting `pending` with 0
# jobs for 13-16+ minutes). Fixed at the time by giving every
# pull_request_review event its own per-run group, so it could never displace
# (or be displaced out of) the synchronize-triggered run's slot for a
# *different* SHA.
#
# LS-9754: that per-run-id group traded cross-SHA displacement for a worse
# problem — pull_request_review events (and, transitively, anything that
# re-triggers the orchestrator for a head that is already mid-run, e.g. the
# "🏷️ Label PR" job's own label churn) got a group that could never dedupe
# against anything, so a review/relabel event landing while the
# synchronize-triggered run was still executing spawned a full second parallel
# pipeline on the IDENTICAL head SHA — observed 5+ times across 3 commits on
# PR #7374, wasting a full build/lint/test/6-shard-E2E/security run every time.
#
# The group key is now the resolved head SHA itself, for every trigger type,
# not the PR number or a per-run id. This gets both properties LS-9053/LS-9810
# and LS-9754 each wanted individually:
#   - A new push always gets a brand-new group (new SHA => new group string),
#     so it can never be displaced by — or displace — an event for a different,
#     older SHA. This is what LS-9053/LS-9810 actually needed; keying on PR
#     number was only ever a proxy for "the commit currently under test."
#   - A second trigger on the SAME head SHA (an approval landing mid-run, the
#     Label PR job's own relabel, a redundant ci:run dispatch) now shares that
#     SHA's group. With cancel-in-progress: false the in-progress run is never
#     killed, but the redundant trigger is queued behind it instead of running
#     a parallel duplicate pipeline; if further same-SHA triggers pile up while
#     the first is still running, only the last one queued survives to run
#     after it (GitHub retains at most one pending run per group) — and by
#     then check-prior-success's guard below finds CI already green and skips
#     it, rather than the fresh parallel run this used to spawn.
# workflow_dispatch carries no `pull_request` payload (LS-9148), so it falls
# back to `github.sha` — the checked-out ref's current head at dispatch time —
# which still dedupes a redundant dispatch against an in-flight run for the
# same commit.
concurrency:
  group: "orchestrator-${{ github.event.pull_request.head.sha || github.sha }}"
  cancel-in-progress: false

# IMPORTANT: Orchestrator permissions must include ALL permissions required by called workflows
# When using workflow_call, the calling workflow's permissions apply to ALL called workflows,
# even if called workflows declare their own permissions. This is a GitHub Actions limitation.
# See: https://docs.github.com/en/actions/using-workflows/reusing-workflows#supported-keywords-for-jobs-that-call-a-reusable-workflow
#
# Required permissions breakdown:
# - contents: read        → Required for checkout and code access
# - actions: read         → Required for workflow run queries (ci-pipeline needs this)
# - pull-requests: write  → Required for PR comments (ci-reporting action in ci-pipeline)
# - checks: read          → Required for status check queries (ci-pipeline validation)
# - issues: write         → Required for issue creation on failures (ci-reporting action)
# - security-events: write → Required for SARIF uploads (security-scanning workflow)
# - statuses: write       → Required for commit status updates (security-gate job)
# - id-token: write       → Required for OIDC auth to AWS (S3 CI artifacts in ci-pipeline)
#
# Reducing these permissions causes startup_failure in called workflows (LS-106)
permissions:
  actions: read
  contents: read
  pull-requests: write
  checks: read
  issues: write
  security-events: write
  statuses: write
  id-token: write

jobs:
  # LS-9543: seed a `pending` CI Gate on the head SHA the instant a PR opens,
  # synchronizes, or reopens — before determine-scope's runner-access
  # resolution and before the self-hosted CI Pipeline runner even starts
  # queuing. PR #7202 squash-merged with zero CI signal on its head SHA
  # because the self-hosted runner queue (~14 min to first job) was slower
  # than the open→merge window (6m21s): the required `CI Gate` context simply
  # did not exist yet, and the owner's `bypass_actors` status-check bypass
  # (.github/ruleset.json) then merged it with no visible warning, since
  # there was no outstanding requirement to bypass in the first place. This
  # job deliberately runs on a GitHub-hosted runner (ubuntu-latest, not
  # `needs.determine-scope.outputs.runner-label`) so it is immune to the very
  # self-hosted queue latency that created the race — it only has to win
  # against the PR open→merge window, which is milliseconds of GitHub-hosted
  # cold start versus minutes of self-hosted backlog. See
  # .github/scripts/ci-gate.js (seedPendingCiGate) and
  # docs/ci-cd/ci-gate-aggregator.md.
  seed-ci-gate:
    name: "🌱 Seed Pending CI Gate"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' ||
       github.event.action == 'synchronize' ||
       github.event.action == 'reopened')
    timeout-minutes: 2
    steps:
      # Single-file sparse checkout so this job beats the open->merge window
      # (LS-9543) instead of paying for a full clone. That means ci-gate.js's
      # require graph has to be listed here too: a top-level relative require
      # of a file this list omits loads fine under the unit tests (full
      # checkout) and throws MODULE_NOT_FOUND here. A unit test asserts this
      # list covers every `require('./x.js')` in ci-gate.js -- see
      # .github/scripts/__tests__/ci-orchestrator-workflow.test.mjs (LS-10140).
      - name: "🚀 Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          sparse-checkout: |
            .github/scripts/ci-gate.js
            .github/scripts/runner-cancellation.js
          sparse-checkout-cone-mode: false

      - name: "Seed pending CI Gate"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { seedPendingCiGate } = require('./.github/scripts/ci-gate.js');
            await seedPendingCiGate({ github, context, core });

  # The "🔐 SHA Sanity Check" check-run is owned by .github/workflows/check-conflicts.yml
  # to avoid a duplicate row on PR check rollups (LS-4199). The diagnostic SHA
  # verification still runs here as a step inside determine-scope so coverage on
  # workflow_dispatch events (which check-conflicts does not see)
  # is preserved — but as a step it does not surface as a separate check-run.

  determine-scope:
    name: "🔍 Determine Workflow Scope"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved') ||
      (github.event_name == 'pull_request' &&
       (github.event.action == 'opened' ||
        github.event.action == 'synchronize' ||
        github.event.action == 'reopened'))
    outputs:
      run-security: ${{ steps.scope.outputs.run-security }}
      security-scan-type: ${{ steps.scope.outputs.security-scan-type }}
      runner-label: ${{ steps.runner-access.outputs.runner-label }}
      ci-already-passed: ${{ steps.check-prior-success.outputs.ci-already-passed }}
      pr-number: ${{ steps.resolve-pr-context.outputs.pr-number }}
      base-sha: ${{ steps.resolve-pr-context.outputs.base-sha }}
      head-sha: ${{ steps.resolve-pr-context.outputs.head-sha }}

    steps:
      - name: "🔐 Verify head SHA still matches event SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eo pipefail
          # EVENT_SHA: for pull_request events use head.sha.
          EVENT_SHA="${{ github.event.pull_request.head.sha }}"
          if [ -z "$EVENT_SHA" ] || [ "$EVENT_SHA" = "$GITHUB_SHA" ]; then
            echo "SHA matches; proceeding"
            exit 0
          fi
          # Re-fetch the PR's current head SHA to detect a new push that landed
          # after this event fired but before concurrency cancellation kicked in.
          PR_NUM="${{ github.event.pull_request.number }}"
          if [ -n "$PR_NUM" ]; then
            if CURRENT_SHA=$(gh pr view "$PR_NUM" --json headRefOid -q .headRefOid 2>/dev/null); then
              if [ "$CURRENT_SHA" != "$EVENT_SHA" ]; then
                echo "SHA changed since event fired (event=$EVENT_SHA, current=$CURRENT_SHA). Exiting cleanly; new run will pick up."
                exit 0
              fi
            else
              echo "::warning::Could not fetch current SHA for PR #$PR_NUM; proceeding with run"
            fi
          fi
          echo "SHA still current; proceeding"

      - name: "🚀 Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      # LS-9148: workflow_dispatch (manual re-runs, and the ci:run label
      # handler which routes through workflow_dispatch to avoid displacing the
      # orchestrator's concurrency group — see ci-run-label.yml) carries no
      # `pull_request` event context, so `github.event.pull_request.base.sha`
      # is empty downstream. That made the lint/format job fall back to a
      # whole-repo Prettier check (failing on pre-existing unrelated
      # formatting elsewhere) and made "Post CI Gate aggregate status" skip
      # entirely (its `github.event.pull_request.number` guard). When the
      # dispatch carries `pr_number`, resolve that PR's base/head SHAs here —
      # mirroring what the native pull_request trigger gets for free — and
      # thread them through ci-pipeline.yml as inputs. Without pr_number,
      # surface a clear warning instead of silently producing a false failure.
      - name: "🔗 Resolve PR Context (workflow_dispatch)"
        id: resolve-pr-context
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_SHA_INPUT: ${{ inputs.base_sha }}
        run: |
          set -eo pipefail

          # LS-10571: merge-queue batch refs dispatch with base_sha and no
          # pr_number — scope the run to base_sha..HEAD (no PR to post to).
          if [ -z "$PR_NUMBER" ] && [ -n "$BASE_SHA_INPUT" ]; then
            if ! [[ "$BASE_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::base_sha '$BASE_SHA_INPUT' is not a full commit SHA"
              exit 1
            fi
            echo "Batch run — base=$BASE_SHA_INPUT head=$GITHUB_SHA"
            echo "base-sha=$BASE_SHA_INPUT" >> "$GITHUB_OUTPUT"
            echo "head-sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$PR_NUMBER" ]; then
            WARN_MSG="workflow_dispatch was triggered without pr_number"
            WARN_MSG="$WARN_MSG — lint/format will run a whole-repo check"
            WARN_MSG="$WARN_MSG (not scoped to any PR diff) and CI Gate will not post to a PR."
            WARN_MSG="$WARN_MSG Pass pr_number to scope this run to a PR, mirroring the native pull_request trigger."
            echo "::warning::$WARN_MSG"
            exit 0
          fi

          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::warning::pr_number '$PR_NUMBER' is not a valid PR number — ignoring it. Lint/format will run a whole-repo check and CI Gate will not post."
            exit 0
          fi

          if ! PR_JSON=$(gh pr view "$PR_NUMBER" --json number,baseRefOid,headRefOid 2>&1); then
            echo "::warning::Could not resolve PR #$PR_NUMBER via the API ($PR_JSON) — lint/format will run a whole-repo check and CI Gate will not post."
            exit 0
          fi

          BASE_SHA=$(echo "$PR_JSON" | jq -r '.baseRefOid')
          HEAD_SHA=$(echo "$PR_JSON" | jq -r '.headRefOid')

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "null" ] || [ -z "$HEAD_SHA" ] || [ "$HEAD_SHA" = "null" ]; then
            echo "::warning::PR #$PR_NUMBER resolved but base/head SHA was empty — lint/format will run a whole-repo check and CI Gate will not post."
            exit 0
          fi

          echo "Resolved PR #$PR_NUMBER — base=$BASE_SHA head=$HEAD_SHA"
          echo "pr-number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "base-sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head-sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: "🧹 Clear CI: Runner Flake label"
        if: github.event.pull_request.number
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'CI: Runner Flake',
              });
              core.info('Cleared "CI: Runner Flake" label');
            } catch (e) {
              if (e.status === 404) {
                core.info('"CI: Runner Flake" label not present — nothing to clear');
              } else {
                throw e;
              }
            }

      - name: "🧮 Set Scope Outputs"
        id: scope
        run: |
          set -eo pipefail

          event='${{ github.event_name }}'
          manual_security='${{ github.event_name == 'workflow_dispatch' && (inputs.run_security && 'true' || 'false') }}'

          run_security=false
          scan_type=comprehensive

          if [ "$event" = "workflow_dispatch" ]; then
            run_security="$manual_security"
          else
            base_ref=""
            if [ "$event" = "pull_request_review" ] || [ "$event" = "pull_request" ]; then
              base_ref='${{ github.event.pull_request.base.sha }}'
            fi

            if [ "$base_ref" = "0000000000000000000000000000000000000000" ]; then
              base_ref=""
            fi

            if [ -z "$base_ref" ]; then
              base_ref=$(git rev-parse HEAD^ 2>/dev/null || echo "")
            fi

            if [ -n "$base_ref" ]; then
              changed_files=$(git diff --name-only "$base_ref" "${{ github.sha }}" || true)
            else
              changed_files=""
            fi

            if [ -n "$changed_files" ]; then
              # Dependency paths — heavyweight scanning (pnpm audit, Snyk, Trivy)
              DEPENDENCY_PATHS='(^|/)package\.json$|(^|/)pnpm-lock\.yaml$|(^|/)\.npmrc$'

              # Code paths — lightweight scanning (SAST, secret detection)
              CODE_PATHS='^apps\/.*\.(ts|tsx|js|jsx)$'
              CODE_PATHS="$CODE_PATHS|^lib\/.*\.(ts|tsx|js|jsx)$"
              CODE_PATHS="$CODE_PATHS|^lambdas\/.*\.(ts|js)$"
              CODE_PATHS="$CODE_PATHS|^tools\/.*\.(ts|js)$"
              CODE_PATHS="$CODE_PATHS|^\.github\/workflows\/security-scanning\.yml$"
              CODE_PATHS="$CODE_PATHS|^tsconfig.*\.json$"

              deps_changed=false
              code_changed=false

              if echo "$changed_files" | grep -Eq "$DEPENDENCY_PATHS"; then
                deps_changed=true
              fi
              if echo "$changed_files" | grep -Eq "$CODE_PATHS"; then
                code_changed=true
              fi

              # SAST is expensive (10-20 min). It only runs via workflow_dispatch
              # (comprehensive) or the 'security-scan' label.
              # PRs get secret scanning (fast) + dependency scanning when deps change.
              if [ "$deps_changed" = true ]; then
                run_security=true
                scan_type=dependencies-only
              elif [ "$code_changed" = true ]; then
                run_security=true
                scan_type=secrets-only
              fi
            fi

            # Allow 'security-scan' label to force comprehensive scanning on any PR
            if [ "$event" = "pull_request_review" ] || [ "$event" = "pull_request" ]; then
              labels='${{ join(github.event.pull_request.labels.*.name, ',') }}'
              if echo ",$labels," | grep -q ",security-scan,"; then
                run_security=true
                scan_type=comprehensive
              fi
            fi
          fi

          if [ "$run_security" != "true" ]; then
            run_security=false
          fi

          echo "run-security=$run_security" >> "$GITHUB_OUTPUT"
          echo "security-scan-type=$scan_type" >> "$GITHUB_OUTPUT"

      # LS-1652: Only allow self-hosted runners for PR authors with write permission.
      # External contributors (read-only) are routed to GitHub-hosted runners to prevent
      # untrusted code from executing on our infrastructure.
      - name: "Generate App Token"
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: 3158619
          private-key: ${{ secrets.AGENT_AUTHOR_APP_PRIVATE_KEY }}
      - name: "🔒 Resolve Runner Label"
        id: runner-access
        uses: ./.github/actions/resolve-runner-label
        with:
          runner-label: ${{ vars.CI_RUNNER_LABEL }}
          github-token: ${{ steps.app-token.outputs.token || github.token }}

      # LS-4182: Idempotency guard — if every required context is already green
      # for this exact SHA, skip the CI Pipeline re-run. A second approved-review
      # submission for an unchanged SHA (a human approval after the bot's, or a
      # bot re-approval) must not spawn a duplicate pipeline or let a flaky
      # re-run flip a green CI Gate status. The required set mixes a check-RUN
      # context (Verify All Migrations Applied) and commit-STATUS contexts
      # (bot-review, No Merge Conflicts since LS-9604, CI Gate — marked
      # _commitStatus in ruleset.json), so the guard evaluates each kind against
      # its own API. Fail-safe direction: on any read error or doubt, re-run CI.
      #
      # LS-9580: this guard used to run only on `pull_request_review`, so the
      # `ci:run` label handler's `workflow_dispatch` (ci-run-label.yml) had no
      # idempotency check at all — dispatching it on a PR that a synchronize
      # push had already queued/started CI for spawned a fully parallel second
      # pipeline (observed alongside a third from the approval event: three
      # complete orchestrator runs on one SHA, PR #7235). Running this guard on
      # `workflow_dispatch` too means `ci-already-passed` (and therefore the
      # ci-pipeline job's `if`, which already gates on this output regardless
      # of event) skips the redundant dispatch instead of racing it.
      # workflow_dispatch carries no `pull_request` payload, so PR number and
      # head SHA come from the "🔗 Resolve PR Context" step above; a
      # repo-wide dispatch (no pr_number given) has nothing to de-duplicate
      # against and always re-runs CI (fail-safe).
      #
      # LS-8682: the `pull_request_review` event payload's `pull_request.head.sha`
      # can be stale relative to the PR's true current head when a push and an
      # approval race each other — the payload is a snapshot taken when the event
      # was generated, not a live read. Evaluating anyActive/allPassed against a
      # stale SHA can find an *older* run's still-in-flight check runs and report
      # ci-already-passed=true for a head that no run is actually executing for,
      # deadlocking the merge queue (no run ever posts CI Gate for the current
      # head). Mirror ci-gate.js's SHA-currency guard: re-fetch the PR's live
      # head via the API and evaluate against that, not the payload snapshot.
      - name: "🔍 Check for prior CI success"
        id: check-prior-success
        if: github.event_name == 'pull_request_review' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RESOLVED_PR_NUMBER: ${{ steps.resolve-pr-context.outputs.pr-number }}
          RESOLVED_HEAD_SHA: ${{ steps.resolve-pr-context.outputs.head-sha }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;

            // On pull_request / pull_request_review events, context.sha (GITHUB_SHA)
            // is the ephemeral test-merge commit (refs/pull/N/merge), NOT the PR head.
            // CI check runs are attached to the PR head, so we must look them up by the
            // head SHA or this guard never finds the prior-success checks and CI re-runs
            // on every approval (LS-7736).
            //
            // workflow_dispatch (the ci:run label handler) carries no
            // `pull_request` payload at all — resolve PR number and head SHA
            // from the "🔗 Resolve PR Context" step's outputs instead. If that
            // step didn't resolve a PR (repo-wide dispatch with no pr_number),
            // there is no SHA to de-duplicate against, so fall through to
            // running CI (fail-safe).
            let prNumber = context.payload.pull_request?.number;
            let sha = context.payload.pull_request?.head?.sha;

            if (context.eventName === 'workflow_dispatch') {
              prNumber = process.env.RESOLVED_PR_NUMBER ? Number(process.env.RESOLVED_PR_NUMBER) : undefined;
              sha = process.env.RESOLVED_HEAD_SHA || undefined;
              if (!prNumber || !sha) {
                core.info('check-prior-success: workflow_dispatch has no resolved PR context — nothing to de-duplicate against, running CI.');
                core.setOutput('ci-already-passed', 'false');
                return;
              }
            }

            sha = sha ?? context.sha;

            // LS-8682: the payload/resolved SHA above can be stale — re-fetch the
            // PR's live head and prefer it. This guarantees the checks/statuses
            // looked up below (and therefore ci-already-passed) always reflect
            // the PR's actual current head, never a superseded one from a race
            // between a push and this event.
            if (prNumber) {
              try {
                const { data: livePr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
                if (livePr.head.sha !== sha) {
                  core.info(
                    `check-prior-success: event payload SHA (${sha}) is stale — PR #${prNumber}'s ` +
                      `live head is ${livePr.head.sha}. Evaluating against the live head.`
                  );
                  sha = livePr.head.sha;
                }
              } catch (err) {
                core.warning(`check-prior-success: could not verify live PR head (${err.message}) — proceeding with event SHA ${sha}.`);
              }
            }

            // Load required contexts dynamically from .github/ruleset.json so this
            // guard stays automatically in sync with branch protection config.
            // The required set mixes check-RUN contexts and commit-STATUS
            // contexts (marked _commitStatus); each kind is evaluated against
            // its own API below. An empty set is tolerated
            // without throwing (fail-safe: run CI). If the file cannot be read
            // or parsed, CI always runs (fail-safe).
            let checkRunContexts = [];
            let statusContexts = [];
            try {
              const rulesetPath = path.join(process.env.GITHUB_WORKSPACE, '.github', 'ruleset.json');
              const ruleset = JSON.parse(fs.readFileSync(rulesetPath, 'utf8'));
              const statusRule = (ruleset.rules ?? []).find(
                r => r.type === 'required_status_checks' && !r._staged
              );
              const entries = (statusRule?.parameters?.required_status_checks ?? [])
                .filter(c => c.context && !c._staged);
              checkRunContexts = entries.filter(c => !c._commitStatus).map(c => c.context);
              statusContexts = entries.filter(c => c._commitStatus).map(c => c.context);
              if (entries.length === 0) {
                core.warning('check-prior-success: ruleset.json lists no required contexts — running CI (fail-safe).');
                core.setOutput('ci-already-passed', 'false');
                return;
              }
              core.info(
                `Required contexts from ruleset.json — check runs: [${checkRunContexts.join(', ')}]; ` +
                `commit statuses: [${statusContexts.join(', ')}]`
              );
            } catch (rulesetErr) {
              core.error(`check-prior-success: Cannot read required checks from ruleset.json (${rulesetErr.message}) — running CI.`);
              core.setOutput('ci-already-passed', 'false');
              return;
            }

            try {
              // --- Check runs on the head SHA (required check-run contexts +
              // in-flight CI detection).
              let allCheckRuns = [];
              let page = 1;
              while (true) {
                const { data } = await github.rest.checks.listForRef({
                  owner,
                  repo,
                  ref: sha,
                  per_page: 100,
                  page,
                });
                allCheckRuns = allCheckRuns.concat(data.check_runs);
                if (data.check_runs.length < 100) break;
                page++;
              }

              const passedNames = new Set(
                allCheckRuns
                  .filter(cr => cr.status === 'completed' && cr.conclusion === 'success')
                  .map(cr => cr.name)
              );

              // Also treat in_progress/queued checks as "already running" — if the
              // synchronize-triggered CI run is still executing when the bot approval
              // event fires, starting a second run wastes a full pipeline (the
              // orchestrator concurrency group queues it and replays it after the
              // first run completes). Skip instead.
              const activeNames = new Set(
                allCheckRuns
                  .filter(cr => cr.status === 'in_progress' || cr.status === 'queued')
                  .map(cr => cr.name)
              );

              // --- Commit statuses on the head SHA (bot-review, CI Gate).
              // GitHub returns statuses newest-first; keep the latest state per
              // context — the same rule GitHub's ruleset evaluator and the
              // merge-queue processor apply.
              const latestStatusByContext = new Map();
              let statusPage = 1;
              while (true) {
                const { data } = await github.rest.repos.listCommitStatusesForRef({
                  owner,
                  repo,
                  ref: sha,
                  per_page: 100,
                  page: statusPage,
                });
                for (const s of data) {
                  if (!latestStatusByContext.has(s.context)) latestStatusByContext.set(s.context, s.state);
                }
                if (data.length < 100) break;
                statusPage++;
              }

              const allPassed =
                checkRunContexts.every(name => passedNames.has(name)) &&
                statusContexts.every(ctx => latestStatusByContext.get(ctx) === 'success');

              // In-flight CI detection: post-LS-8014 the granular CI jobs
              // ("🚀 CI Pipeline / lint" etc.) are informational check runs and
              // `CI Gate` is only posted when the run finishes, so a
              // still-executing CI run is visible ONLY through the granular
              // check runs — never through a required context. The prefix must
              // match the orchestrator's ci-pipeline job name ("🚀 CI Pipeline").
              //
              // LS-8402: anyActive must be scoped to CI_PIPELINE_PREFIX only.
              // It previously also treated any in-flight *required* check-run
              // context (checkRunContexts.some(name => activeNames.has(name)))
              // as evidence the pipeline was running. But checkRunContexts also
              // includes checks unrelated to the CI Pipeline job — e.g. "Verify
              // All Migrations Applied" — so an unrelated required check still
              // being in_progress on the same SHA was misread as "CI Pipeline is
              // running", setting ci-already-passed=true and silently skipping
              // the actual CI Pipeline job even though it never ran for this SHA
              // (confirmed repeatedly: LS-6112/PR#6002, LS-6029/PR#6252,
              // LS-8390/PR#6324). Only the CI-pipeline-prefixed check runs are
              // valid evidence that the pipeline itself is in flight.
              const CI_PIPELINE_PREFIX = '🚀 CI Pipeline /';
              const anyActive = [...activeNames].some(name => name.startsWith(CI_PIPELINE_PREFIX));

              // LS-9887: check runs are only evidence once the pipeline's
              // jobs EXIST. A sibling orchestrator run that is still queued has
              // published no check runs at all, so anyActive is blind to it.
              // The comment on the concurrency group above assumed that blind
              // window was "a few seconds" between dispatch and its first
              // check run appearing — on self-hosted runners it is not. On PR
              // #7585 (LS-9860) the push-triggered run 33897265747 was created
              // at 16:49:27 and its very first job did not start until 17:05:57:
              // a 16.5-minute window in which the SHA had zero CI Pipeline
              // check runs. The approval event at 16:52:35 evaluated this
              // guard, saw nothing active, and dispatched a full duplicate
              // pipeline — six extra E2E shards. The same shape repeated on
              // head 0ef4397ab (runs 33900887705 / 33901245857).
              //
              // Close the window at the RUN level: a sibling orchestrator run
              // on this exact head SHA that is queued or in progress will
              // dispatch (or is dispatching) CI itself. Only push-shaped
              // events count — a sibling pull_request_review run may itself
              // have short-circuited via this very guard, so treating it as
              // evidence could leave the SHA with no pipeline at all.
              // Fail-safe direction is preserved: any error here falls
              // through to the check-run logic rather than skipping CI.
              let siblingDispatching = null;
              if (!allPassed && !anyActive) {
                try {
                  const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                    owner,
                    repo,
                    workflow_id: 'ci-orchestrator.yml',
                    head_sha: sha,
                    per_page: 100,
                  });
                  const ACTIVE_RUN_STATUSES = new Set(['queued', 'in_progress', 'waiting', 'requested', 'pending']);
                  const DISPATCHING_EVENTS = new Set(['pull_request', 'workflow_dispatch']);
                  siblingDispatching = runs.find(
                    r =>
                      String(r.id) !== String(context.runId) &&
                      ACTIVE_RUN_STATUSES.has(r.status) &&
                      DISPATCHING_EVENTS.has(r.event)
                  ) ?? null;
                } catch (siblingErr) {
                  core.warning(
                    `check-prior-success: could not list sibling orchestrator runs for ${sha} ` +
                      `(${siblingErr.message}) — falling back to check-run evidence only.`
                  );
                }
              }

              if (allPassed) {
                core.info(`All required contexts already green for SHA ${sha} — skipping CI re-run.`);
                core.setOutput('ci-already-passed', 'true');
              } else if (anyActive) {
                const active = [...activeNames].filter(name => name.startsWith(CI_PIPELINE_PREFIX));
                core.info(`CI already running for SHA ${sha} (${active.join(', ')}) — skipping re-run to avoid a duplicate pipeline.`);
                core.setOutput('ci-already-passed', 'true');
              } else if (siblingDispatching) {
                core.info(
                  `Orchestrator run ${siblingDispatching.id} (${siblingDispatching.event}, ` +
                    `${siblingDispatching.status}) is already handling SHA ${sha} but has not ` +
                    'published its CI Pipeline check runs yet — skipping re-run to avoid a ' +
                    'duplicate pipeline.'
                );
                core.setOutput('ci-already-passed', 'true');
              } else {
                const pendingRuns = checkRunContexts.filter(name => !passedNames.has(name) && !activeNames.has(name));
                const pendingStatuses = statusContexts.filter(ctx => latestStatusByContext.get(ctx) !== 'success');
                core.info(`CI not yet started for SHA ${sha}. Missing: ${[...pendingRuns, ...pendingStatuses].join(', ')}`);
                core.setOutput('ci-already-passed', 'false');
              }
            } catch (err) {
              core.error(`check-prior-success: Checks/Statuses API error — ${err.message}. Falling back to running CI.`);
              core.setOutput('ci-already-passed', 'false');
            }

  ci-pipeline:
    name: "🚀 CI Pipeline"
    needs: [determine-scope]
    if: ${{ !cancelled() && needs.determine-scope.result != 'skipped' && needs.determine-scope.outputs.ci-already-passed != 'true' }}
    uses: ./.github/workflows/ci-pipeline.yml
    with:
      debug_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_mode || false }}
      e2e-test-patterns: "@critical"
      e2e-exclude-patterns: "@slow"
      e2e-shard-total: 1
      runner-label: ${{ needs.determine-scope.outputs.runner-label }}
      pr-number: ${{ needs.determine-scope.outputs.pr-number }}
      base-sha: ${{ needs.determine-scope.outputs.base-sha }}
      head-sha: ${{ needs.determine-scope.outputs.head-sha }}
    secrets: inherit

  security-scanning:
    name: "🔐 Security Scanning"
    needs: [determine-scope]
    if: ${{ !cancelled() && needs.determine-scope.result != 'skipped' && needs.determine-scope.outputs.run-security == 'true' }}
    uses: ./.github/workflows/security-scanning.yml
    with:
      # Scan type is determined by what changed: deps → dependency scan, code → SAST/secrets, both → comprehensive
      scan_type: ${{ github.event_name == 'workflow_dispatch' && inputs.scan_type || needs.determine-scope.outputs.security-scan-type }}
      runner-label: ${{ needs.determine-scope.outputs.runner-label }}
    secrets: inherit

  # ============================================================================
  # Label PR with failure reasons from security scanning
  # CI pipeline labels are handled by the summarize job inside ci-pipeline.yml.
  # ============================================================================
  label-pr:
    name: "🏷️ Label PR"
    needs: [determine-scope, security-scanning]
    if: "!cancelled() && needs.determine-scope.result != 'skipped' && github.event.pull_request.number"
    runs-on: ${{ needs.determine-scope.outputs.runner-label || 'ubuntu-latest' }}
    timeout-minutes: 3
    steps:
      - name: "Label PR on Security Failure"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue.number;
            if (!prNumber) return;

            const securityResult = '${{ needs.security-scanning.result }}';
            const label = 'CI: Security';

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const existingLabels = pr.labels.map(l => l.name);

            async function withRetry(fn, retries = 3) {
              for (let i = 0; i < retries; i++) {
                try { return await fn(); }
                catch (e) {
                  const isPrimaryRateLimit = e.status === 429;
                  const isSecondaryRateLimit = e.status === 403 && /secondary rate limit/i.test(typeof e.message === 'string' ? e.message : '');
                  if ((isPrimaryRateLimit || isSecondaryRateLimit) && i < retries - 1) {
                    const delay = Math.pow(2, i) * 1000;
                    core.warning(`Rate limited (${e.status}), retrying in ${delay}ms…`);
                    await new Promise(r => setTimeout(r, delay));
                  } else throw e;
                }
              }
            }

            const shouldHaveLabel = securityResult === 'failure';
            const hasLabel = existingLabels.includes(label);
            if (shouldHaveLabel && !hasLabel) {
              await withRetry(() => github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: [label],
              }));
              core.info(`Label added: ${label}`);
            } else if (!shouldHaveLabel && hasLabel) {
              // An overlapping run on the same PR can remove the label between
              // pulls.get and this call; GitHub then answers 404 "Label does not
              // exist" (meaning: not on this PR). That is the outcome we wanted.
              try {
                await withRetry(() => github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: label,
                }));
                core.info(`Label removed: ${label}`);
              } catch (e) {
                if (e.status !== 404) throw e;
                core.info(`Label already removed: ${label}`);
              }
            }

  # ============================================================================
  # Restore "merge-when-ready" label on CI success
  # ============================================================================
  # If a previous run removed the label due to a CI failure, but CI now passes
  # (e.g. after a fix push or a manual re-run of a flaky failure), re-add the
  # label automatically — provided the bot approval is still active (not
  # dismissed by a subsequent push). This avoids requiring the author to
  # manually re-add the label after every transient failure. (LS-4136)
  # ============================================================================
  restore-merge-label-on-success:
    name: "🏷️ Restore Merge Label on Success"
    needs: [determine-scope, ci-pipeline]
    if: >-
      !cancelled() &&
      needs.determine-scope.result != 'skipped' &&
      needs.ci-pipeline.outputs.overall-status == 'success' &&
      github.event.pull_request.number
    runs-on: ${{ needs.determine-scope.outputs.runner-label || 'ubuntu-latest' }}
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.MERGE_QUEUE_APP_ID }}
          private-key: ${{ secrets.MERGE_QUEUE_APP_PRIVATE_KEY }}

      - name: Restore merge-when-ready label if bot approval is active
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            if (pr.labels.some(l => l.name === 'merge-when-ready')) {
              // Label already present — no labeled event will fire, so the EMQ won't
              // get its normal post-CI trigger. The workflow_run trigger on CI Orchestrator
              // completion is supposed to handle this, but it can be filtered out when
              // the triggering workflow's head_branch resolves to the base branch (main).
              // Dispatch the merge queue explicitly to guarantee it evaluates this PR.
              core.info(`PR #${prNumber} already has merge-when-ready — dispatching EMQ directly`);
              try {
                await github.request(
                  'POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches',
                  {
                    owner,
                    repo,
                    workflow_id: 'merge-queue.yml',
                    ref: 'main',
                    inputs: { dry_run: 'false', force_check: 'false', is_retry: 'false' },
                  }
                );
                core.info('Dispatched merge-queue.yml to re-evaluate merge-ready PRs');
              } catch (error) {
                core.error(`Failed to dispatch merge-queue.yml: ${error.message}`);
                throw error;
              }
              return;
            }

            // Only restore if the bot approval is still active (not dismissed).
            // The branch ruleset's dismiss_stale_reviews_on_push policy dismisses
            // the approval on every push, so absence of an active approval means
            // the author needs a new review cycle.
            const BOT_LOGIN = 'legacy-sports-review-bot[bot]';
            let allReviews = [];
            let page = 1;
            let hasMore = true;
            while (hasMore) {
              const { data: reviewsPage } = await github.rest.pulls.listReviews({
                owner,
                repo,
                pull_number: prNumber,
                per_page: 100,
                page,
              });
              allReviews = allReviews.concat(reviewsPage);
              hasMore = reviewsPage.length === 100;
              page++;
            }

            // Determine the latest review state for the bot (reviews are oldest-first).
            let botState = null;
            for (const review of allReviews) {
              if (review.user.login === BOT_LOGIN) {
                botState = review.state;
              }
            }

            if (botState !== 'APPROVED') {
              core.info(`PR #${prNumber} bot approval is not active (state: ${botState}), skipping`);
              return;
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: prNumber,
              labels: ['merge-when-ready'],
            });
            core.info(`Restored merge-when-ready label on PR #${prNumber}`);

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: '✅ **`merge-when-ready` label restored** — CI pipeline passed.\n\n' +
                    'The label was automatically restored because CI is now green and the bot approval is still active.\n\n' +
                    '---\n*Automated message from CI pipeline*'
            });

  # ============================================================================
  # Remove "merge-when-ready" label on CI failure
  # ============================================================================
  # Prevents a failing PR from sitting in the merge queue indefinitely.
  # The label is removed so the author must consciously re-add it after fixing.
  # Only fires on real pipeline failures, not cancellations (new push) or skips.
  #
  # NOTE: needs.ci-pipeline.result was unreliable when ci-pipeline.yml used
  # if: always() on internal jobs (GitHub Actions limitation — workflow_call
  # result was always 'failure'). Fixed in LS-1115 by replacing always() with
  # !cancelled() inside ci-pipeline.yml. This job still uses the explicit
  # overall-status output as a safety net.
  # ============================================================================
  remove-merge-label-on-failure:
    name: "🏷️ Remove Merge Label on Failure"
    needs: [determine-scope, ci-pipeline]
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request_review' &&
      needs.ci-pipeline.outputs.overall-status == 'failure'
    # LS-9710 rationale, applied here too (LS-10140): this job now consults the
    # runner-shutdown detector, so it has to be schedulable in exactly the
    # circumstance that detector reports — a self-hosted pool with no capacity.
    # Pinning to GitHub-hosted infrastructure also keeps it from holding this
    # run's `cancel-in-progress: false` concurrency slot while queued for a
    # runner that will never arrive. It only makes API calls; it never needs
    # the workspace image.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "🚀 Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # LS-10140: `overall-status` folds `cancelled` into `failure`
      # (.github/actions/collect-results), which is correct fail-safe behaviour
      # for a cancel nobody can attribute — a run that proved nothing must not
      # keep a merge label. But when the cancellation is the RUNNER POOL dying
      # under a job, stripping the label punishes the author for infrastructure
      # churn: on PR #7976 a `test` job that waited 18 minutes for a ci-runner
      # it never got, recorded zero steps, and produced no log took the label
      # off a diff that was green throughout.
      #
      # The repo already detected that case and posted "this is not caused by
      # your code" as a PR comment — from the `report-runner-shutdown` job,
      # which runs after and independently of this one, so the human-facing
      # signal and the machine-facing action disagreed. Running the same
      # composite action HERE is what makes them agree.
      #
      # This does NOT weaken LS-10091's invariant that an unverified SHA must
      # not merge. That is enforced by the CI Gate, not by this label: since
      # LS-10140 a cancelled gate input posts a PENDING `CI Gate`
      # (.github/scripts/ci-gate.js), and a pending required context blocks
      # both GitHub's own merge evaluator and merge-queue-processor.js's
      # validateStatusChecks. The label stays; the merge still waits for a
      # genuine verdict, which rerun-cancelled-ci.yml goes and gets.
      #
      # Scoped deliberately to runner-attributable cancellations only: a
      # deliberate cancel, an unattributable one, and every genuine failure
      # keep the pre-existing strip.
      - name: "Detect runner shutdown"
        id: detect
        uses: ./.github/actions/detect-runner-shutdown
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove merge-when-ready label
        if: steps.detect.outputs.shutdown-detected != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            // Fetch current PR to get fresh label state (payload labels may be stale)
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });

            const hasMergeLabel = pr.labels.some(l => l.name === 'merge-when-ready');
            if (!hasMergeLabel) {
              console.log(`PR #${prNumber} does not have merge-when-ready label, skipping`);
              return;
            }

            // An overlapping run can strip the label between pulls.get and this
            // call (404 "Label does not exist"). That run also posts the failure
            // comment, so stop here rather than posting a duplicate.
            try {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: prNumber,
                name: 'merge-when-ready'
              });
            } catch (e) {
              if (e.status !== 404) throw e;
              console.log(`merge-when-ready already removed from PR #${prNumber}, skipping`);
              return;
            }
            console.log(`Removed merge-when-ready label from PR #${prNumber}`);

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: '⚠️ **`merge-when-ready` label removed** — CI pipeline failed.\n\n' +
                    'The label was automatically removed to prevent merging a failing PR. ' +
                    'Fix the CI failures and re-add the label when ready.\n\n' +
                    '---\n*Automated message from CI pipeline*'
            });
            console.log(`Posted failure comment on PR #${prNumber}`);

      - name: "Keep merge-when-ready (runner shutdown)"
        if: steps.detect.outputs.shutdown-detected == 'true'
        shell: bash
        env:
          SHUTDOWN_JOBS: ${{ steps.detect.outputs.job-names }}
        run: |
          echo "::notice::Keeping 'merge-when-ready' — the CI failure is a runner shutdown in: ${SHUTDOWN_JOBS}."
          echo "CI Gate stays pending for this SHA, so the merge queue still waits for a genuine verdict (LS-10140)."

  # ============================================================================
  # Report runner shutdown as a PR comment
  # ============================================================================
  # When ci-pipeline is cancelled due to a self-hosted runner restart (rather
  # than a deliberate user cancellation), this job posts a comment on the PR
  # and applies the "CI: Runner Flake" label so the author knows this is
  # infrastructure noise, not a code problem.
  #
  # Detection (LS-9451): delegated to the shared ./.github/actions/detect-
  # runner-shutdown composite action — the same one lambda-terraform-apply.yml
  # uses — instead of an inline copy, so the two paths can't drift. Label-apply
  # and PR-comment stay here: ci_retry_runner_flake (tools/mcp/ci-server/src/
  # tools/retry-runner-flake.ts) parses both the "CI: Runner Flake" label and
  # the comment body signature "CI cancelled due to a runner restart" plus a
  # /actions/runs/(\d+) match, so the label constant and comment wording must
  # not change without updating that tool in lockstep.
  #
  # Known behavioural delta from the migration: the old inline copy only
  # scanned jobs with conclusion == 'cancelled' AND a runner_name set. The
  # shared action scans conclusion in {failure, cancelled} and does not
  # require runner_name — this widening is intentional (lambda-terraform-
  # apply's spot deaths conclude as `failure`, not `cancelled`) and accepted
  # for this job too, per LS-9451.
  #
  # LS-9334: this job's own gate has to accept the same {failure, cancelled}
  # set the detect-runner-shutdown action scans, not just 'cancelled'. A mid-
  # job runner death cancels the killed job itself, but ci-pipeline.yml's
  # downstream jobs (e.g. e2e-affected, Summarize & Report) that `needs` it
  # conclude 'failure' when a dependency didn't succeed — and a reusable
  # workflow's own conclusion is 'failure', not 'cancelled', whenever any of
  # its jobs concludes 'failure' (GitHub prioritises failure over cancelled
  # when aggregating). That made this job skip entirely on the exact failure
  # it exists to report: no label, no comment, forcing a manual log-grep
  # (confirmed against PR #6935 / run 31421732904).
  #
  # The "CI: Runner Flake" label is cleared by a step in determine-scope at
  # the start of every subsequent CI run.
  # ============================================================================
  report-runner-shutdown:
    name: "⚡ Report Runner Shutdown"
    needs: [determine-scope, ci-pipeline]
    if: >-
      always() &&
      needs.determine-scope.result != 'skipped' &&
      (needs.ci-pipeline.result == 'cancelled' || needs.ci-pipeline.result == 'failure') &&
      github.event.pull_request.number
    # LS-9710: deliberately pinned to ubuntu-latest, NOT
    # `needs.determine-scope.outputs.runner-label || 'ubuntu-latest'` like the
    # other post-pipeline jobs. This job's entire purpose is reporting that the
    # self-hosted runner pool shut down — the exact circumstance under which
    # that pool has no capacity to schedule it. On PR #7328 this job queued
    # forever waiting for a self-hosted runner (`timeout-minutes` below only
    # bounds execution time *after* a runner picks the job up — GitHub does
    # not start that clock while a job is still queued for one), which kept
    # this workflow run's jobs from ever all concluding. Because the
    # concurrency group above is `orchestrator-<pr number>` with
    # `cancel-in-progress: false` (see LS-9053/LS-9810 above), that undying
    # run held the slot indefinitely and every subsequent push's orchestrator
    # run queued behind it — so CI Gate never registered for the PR's actual
    # current head, blocking the merge queue for 40 minutes until a manual
    # `workflow_dispatch` worked around it. This is a different failure mode
    # from LS-9053/LS-9810 above: those are about a *queued* run being
    # displaced before it starts; this is about an *active* run's concurrency
    # slot never being released because one of its own jobs can't be
    # scheduled. Running this job on GitHub-hosted infrastructure — which
    # always has capacity — closes that gap without touching the concurrency
    # grouping those tickets established.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "🚀 Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: "Detect runner shutdown"
        id: detect
        uses: ./.github/actions/detect-runner-shutdown
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Report runner shutdown"
        if: steps.detect.outputs.shutdown-detected == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DETECT_JOB_NAMES: ${{ steps.detect.outputs.job-names }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.issue.number;
            const runId = context.runId;

            const jobList = process.env.DETECT_JOB_NAMES
              .split(',')
              .map((name) => name.trim())
              .filter(Boolean)
              .map((name) => `\`${name}\``)
              .join(', ');
            const LABEL = 'CI: Runner Flake';

            try {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: prNumber, labels: [LABEL],
              });
              core.info(`Applied "${LABEL}" label to PR #${prNumber}`);
            } catch (e) {
              core.warning(`Could not apply label: ${e.message}`);
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: [
                '⚡ **CI cancelled due to a runner restart** — this is not caused by your code.',
                '',
                `The following CI job(s) were interrupted when the self-hosted runner shut down: ${jobList}`,
                '',
                `[Re-run the failed jobs →](https://github.com/${owner}/${repo}/actions/runs/${runId})`,
                '',
                '---',
                '*Automated message from CI pipeline*',
              ].join('\n'),
            });
            core.info(`Posted runner shutdown comment on PR #${prNumber}`);
