# runner-terraform-apply.yml — Apply runner infrastructure changes post-merge.
# LS-2429.
#
# Runs on push-to-main when any runner-relevant file changes. Executes the
# equivalent of `make runner-apply NO_CONFIRM=1`: a targeted terraform apply
# against `module.github_runners` with `-var="enable_github_runners=true"`.
# This is deliberately separate from lambda-terraform-apply.yml because the
# runner module is excluded from the normal apply loop (the flag is false in
# infra.auto.tfvars by design — see AGENTS.md and the Makefile runner-apply
# target).
#
# Triggering:
#   - push to main with path changes to runner-relevant files.
#   - workflow_dispatch for manual re-rolls (e.g. after a hand-built AMI).
#
# After this workflow applies, the launch template is updated to point at the
# AMI name filter scoped to `var.runner_ami_playwright_version`. Running
# runners drain naturally; new scale-ups pick up the new AMI.

name: Apply Runner Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "terraform/runners/**"
      - ".github/workflows/runner-terraform-apply.yml"
  workflow_dispatch:

concurrency:
  group: runner-terraform-apply
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  apply:
    name: Apply runner infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate runner secrets
        run: |
          set -euo pipefail
          MISSING=()
          if [ -z "${{ secrets.RUNNER_GITHUB_APP_ID }}" ]; then
            MISSING+=("RUNNER_GITHUB_APP_ID")
          fi
          if [ -z "${{ secrets.RUNNER_GITHUB_APP_KEY_BASE64 }}" ]; then
            MISSING+=("RUNNER_GITHUB_APP_KEY_BASE64")
          fi
          if [ -z "${{ secrets.RUNNER_GITHUB_APP_WEBHOOK_SECRET }}" ]; then
            MISSING+=("RUNNER_GITHUB_APP_WEBHOOK_SECRET")
          fi
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing required runner secrets: ${MISSING[*]}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6
        with:
          role-to-assume: arn:aws:iam::176661590736:role/legacy-sports-dev-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify target AMI exists
        run: |
          set -euo pipefail
          # Read the target version from the committed tfvars file.
          VERSION=$(awk '
            /^runner_ami_playwright_version[[:space:]]*=/ {
              match($0, /"[0-9.]+"/)
              print substr($0, RSTART + 1, RLENGTH - 2)
              exit
            }
          ' terraform/runners/runner-ami.auto.tfvars)
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not read runner_ami_playwright_version from tfvars"
            exit 1
          fi

          echo "Target Playwright version: $VERSION"
          echo "Expected AMI name prefix: legacy-sports-runner-pw$VERSION-"

          AMI_COUNT=$(aws ec2 describe-images \
            --owners self \
            --filters "Name=name,Values=legacy-sports-runner-pw$VERSION-*" "Name=state,Values=available" \
            --query "length(Images)" \
            --output text)

          if [[ "$AMI_COUNT" == "0" ]]; then
            echo "::error::No available AMI found matching 'legacy-sports-runner-pw$VERSION-*'."
            echo "::error::A matching AMI must be built via 'Rebuild Runner AMI' workflow or 'make ami-build' before this apply can proceed."
            exit 1
          fi

          echo "✅ Found $AMI_COUNT AMI(s) matching the target version."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4
        with:
          terraform_version: "~> 1.14"

      - name: Terraform init
        working-directory: terraform/runners
        run: terraform init -input=false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Download runner Lambda zips
        run: node scripts/download-runner-lambdas.js

      - name: Bootstrap IAM permissions
        # Targeted apply for the github_actions_runners IAM policy and its role
        # attachment. This step is a bootstrap guard: the permissions granted by
        # this policy are required by data sources evaluated during the full plan
        # (data.aws_iam_openid_connect_provider, data.aws_sns_topic, etc.), so if
        # the policy has never been applied or needs new permissions added, the
        # full plan would fail with AccessDenied before it can apply the fix.
        # Targeting just the IAM resources breaks the circular dependency because
        # aws_iam_policy.github_actions_runners has no dependency on the failing
        # data sources. Idempotent: a no-op when permissions are already current.
        # -refresh=false prevents Terraform from refreshing unrelated state entries
        # (which would fail with AccessDenied on the same permissions we're granting).
        working-directory: terraform/runners
        env:
          TF_VAR_github_app_id: ${{ secrets.RUNNER_GITHUB_APP_ID }}
          TF_VAR_github_app_key_base64: ${{ secrets.RUNNER_GITHUB_APP_KEY_BASE64 }}
          TF_VAR_github_app_webhook_secret: ${{ secrets.RUNNER_GITHUB_APP_WEBHOOK_SECRET }}
        run: |
          terraform apply \
            -target=aws_iam_policy.github_actions_runners \
            -target=aws_iam_role_policy_attachment.github_actions_runners \
            -auto-approve \
            -input=false \
            -refresh=false \
            -lock-timeout=5m

      - name: Wait for IAM propagation
        run: sleep 15

      - name: Terraform plan
        id: plan
        working-directory: terraform/runners
        env:
          TF_VAR_github_app_id: ${{ secrets.RUNNER_GITHUB_APP_ID }}
          TF_VAR_github_app_key_base64: ${{ secrets.RUNNER_GITHUB_APP_KEY_BASE64 }}
          TF_VAR_github_app_webhook_secret: ${{ secrets.RUNNER_GITHUB_APP_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          # As of LS-2425, terraform/runners/ is its own state file. The plan
          # operates against the entire runners state — no -target or
          # -var=enable_github_runners workarounds needed.
          terraform plan \
            -input=false \
            -out=runner.tfplan \
            -lock-timeout=5m

      - name: Terraform apply
        working-directory: terraform/runners
        env:
          TF_VAR_github_app_id: ${{ secrets.RUNNER_GITHUB_APP_ID }}
          TF_VAR_github_app_key_base64: ${{ secrets.RUNNER_GITHUB_APP_KEY_BASE64 }}
          TF_VAR_github_app_webhook_secret: ${{ secrets.RUNNER_GITHUB_APP_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          terraform apply -input=false -auto-approve -lock-timeout=5m runner.tfplan
          echo "## ✅ Runner infrastructure applied" >> "$GITHUB_STEP_SUMMARY"
          echo "Launch template now selects the AMI scoped to the target Playwright version." >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect state lock on failure
        if: always() && failure()
        run: |
          set -euo pipefail
          # Per Copilot review on PR #2281: do NOT unconditionally delete the
          # S3 state lock file. A concurrent run may legitimately hold it, and
          # force-deleting breaks mutual exclusion. Instead, fetch and log the
          # lock contents so an operator can decide whether it's stale and
          # manually clear it if needed (aws s3 rm <lock-file> or terraform force-unlock).
          echo "🔎 Inspecting terraform state lock after failure..."
          LOCK_FILE="s3://legacy-sports-terraform-state/legacy-sports/runners.tfstate.tflock"

          if aws s3 ls "$LOCK_FILE" > /dev/null 2>&1; then
            echo "⚠️ Terraform S3 lock file exists:"
            aws s3 cp "$LOCK_FILE" - 2>/dev/null | python3 -m json.tool 2>/dev/null || true
            echo "⚠️ Terraform S3 lock file exists at $LOCK_FILE — review the lock holder above before any manual cleanup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ No terraform lock file found — nothing to clear."
            echo "ℹ️ No terraform lock file found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Discord error notification
        if: always() && failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_ERRORS_WEBHOOK_URL }}
          status: failure
          title: "Runner Infrastructure Apply Failed"
          description: "Runner Terraform apply failed — self-hosted CI runners may not launch until this is resolved."
