name: Discord Release Summary

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify-discord:
    name: Post Release Summary to Discord
    runs-on: ubuntu-latest

    steps:
      - name: Post Release Summary
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_AUTHOR: ${{ github.event.release.author.login }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          # Skip if webhook URL is not configured
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_RELEASE_WEBHOOK_URL not set — skipping notification"
            exit 0
          fi

          # Ensure required CLI tools are available
          for cmd in jq curl; do
            if ! command -v "$cmd" &>/dev/null; then
              echo "::warning::Discord notification skipped: '$cmd' is not installed"
              exit 0
            fi
          done

          # Determine app type and emoji from tag prefix
          case "$RELEASE_TAG" in
            web-v*)
              APP="Web"
              APP_EMOJI="🌐"
              COLOR=5793266   # Blurple (0x5865F2)
              ;;
            android-v*)
              APP="Android"
              APP_EMOJI="🤖"
              COLOR=3066993   # Green (0x2ECC71)
              ;;
            ios-v*)
              APP="iOS"
              APP_EMOJI="🍎"
              COLOR=10181046  # Purple (0x9B59B6)
              ;;
            *)
              APP="Release"
              APP_EMOJI="📦"
              COLOR=5763719   # Green (0x57F287)
              ;;
          esac

          # Extract version from tag (strip app prefix: "web-v1.2.3-20260323" -> "1.2.3-20260323")
          VERSION=$(echo "$RELEASE_TAG" | sed -E 's/^(web|android|ios)-v//' | sed -E 's/^v//')

          # Build the changelog summary from the release body.
          # GitHub's auto-generated release notes list PRs as "* PR title by @author in URL".
          # Extract up to 15 PR titles for the summary.
          CHANGELOG=$(echo "$RELEASE_BODY" | grep -E '^\* ' | head -15 | sed 's/^\* /• /' || true)

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No PR details available — see the [full release notes](${RELEASE_URL})."
          fi

          # Truncate changelog to fit Discord embed limits (1024 chars for field value)
          MAX_FIELD_LENGTH=1024
          SUFFIX="…\n\n[View full release notes](${RELEASE_URL})"
          MAX_CHANGELOG_LENGTH=$((MAX_FIELD_LENGTH - ${#SUFFIX}))
          if [ ${#CHANGELOG} -gt "$MAX_CHANGELOG_LENGTH" ]; then
            CHANGELOG="${CHANGELOG:0:MAX_CHANGELOG_LENGTH}${SUFFIX}"
          fi

          # Count PRs merged (lines starting with "* ")
          PR_COUNT=$(echo "$RELEASE_BODY" | grep -cE '^\* ' || true)
          if [ -z "$PR_COUNT" ]; then
            PR_COUNT=0
          fi

          # Extract unique contributors (@mentions in "by @author" patterns)
          CONTRIBUTORS=$(echo "$RELEASE_BODY" | grep -oE 'by @[^[:space:]]+' | sed 's/by //' | sort -u | tr '\n' ' ' || true)
          if [ -z "$CONTRIBUTORS" ]; then
            CONTRIBUTORS="—"
          fi

          # Prerelease badge
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            PRERELEASE_TEXT=" (Pre-release)"
          else
            PRERELEASE_TEXT=""
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Build fields array
          FIELDS="[]"
          FIELDS=$(echo "$FIELDS" | jq \
            --arg version "$VERSION" \
            '. + [{"name": "Version", "value": $version, "inline": true}]')

          FIELDS=$(echo "$FIELDS" | jq \
            --arg app "$APP" \
            '. + [{"name": "Platform", "value": $app, "inline": true}]')

          FIELDS=$(echo "$FIELDS" | jq \
            --arg count "$PR_COUNT" \
            '. + [{"name": "PRs Merged", "value": $count, "inline": true}]')

          FIELDS=$(echo "$FIELDS" | jq \
            --arg contributors "$CONTRIBUTORS" \
            '. + [{"name": "Contributors", "value": $contributors, "inline": false}]')

          FIELDS=$(echo "$FIELDS" | jq \
            --arg changelog "$CHANGELOG" \
            '. + [{"name": "Changes", "value": $changelog, "inline": false}]')

          # Build the embed payload
          TITLE="${APP_EMOJI} ${APP} Release v${VERSION}${PRERELEASE_TEXT}"
          DESC="A new ${APP} release has been published. [View on GitHub](${RELEASE_URL})"

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg desc "$DESC" \
            --argjson color "$COLOR" \
            --argjson fields "$FIELDS" \
            --arg timestamp "$TIMESTAMP" \
            --arg author "$RELEASE_AUTHOR" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: $color,
                fields: $fields,
                timestamp: $timestamp,
                footer: { text: ("Released by " + $author + " • Legacy Sports") }
              }]
            }')

          # Send to Discord with retry
          HTTP_CODE=$(curl --connect-timeout 5 --max-time 15 --retry 3 --retry-all-errors \
            -s -o /tmp/discord-response.txt -w "%{http_code}" \
            -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Discord release summary sent for ${RELEASE_TAG} (http=$HTTP_CODE)"
          else
            RESPONSE=$(cat /tmp/discord-response.txt 2>/dev/null || echo "(empty)")
            echo "::warning::Discord release summary failed (http=$HTTP_CODE): $RESPONSE"
          fi

          rm -f /tmp/discord-response.txt
