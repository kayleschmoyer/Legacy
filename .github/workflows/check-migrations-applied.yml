name: "Check Migrations Applied"

# =============================================================================
# Verifies that every migration file in lib/db-client/migrations/ has been
# applied to the production database.
#
# Runs on PRs targeting main (blocking check). Also declares workflow_dispatch
# with a pr_number input for MANUAL RECHECK: dispatch this (from main, with a
# pr_number) to force a fresh check on one PR when the required check gets
# stuck "not yet registered" (e.g. its orchestrator run was cancelled or never
# registered — same failure class as LS-9774). Label-cycling does nothing here
# (this workflow doesn't listen for `labeled`) and the old recovery — manually
# closing and reopening the PR (done on PR #3396) — was the only fix. LS-9776
# ports the exact fix `check-conflicts.yml` already applied for its "No Merge
# Conflicts" check (LS-9604): the "Verify All Migrations Applied" required
# status is posted as a commit status scoped to the resolved head SHA (via
# "Resolve PR info" below), not left as this job's own implicit check-run —
# see that job's `name:` comment for why. This also keeps workflow_dispatch
# usable under the AWS OIDC role's trust policy, which authorizes the
# pull_request-event subject shape and workflow_dispatch on ref:refs/heads/main,
# but NOT workflow_dispatch on arbitrary PR branches: dispatch this workflow
# from main (not from the PR branch) with the target PR's number — "Resolve PR
# info" resolves the head SHA via the API and an explicit checkout step pins
# the workspace to it, so the check still runs against the PR's actual code.
#
# How it works:
#   1. Resolves ci_readonly DB credentials from AWS Secrets Manager.
#   2. Connects as ci_readonly (SELECT-only on drizzle.__drizzle_migrations).
#      Self-hosted runners reach RDS directly via static SG rule (rds_from_ci_runners).
#   3. Compares applied hashes against migration files on disk.
#
# The ci_readonly PostgreSQL role is created by migration:
#   lib/db-client/migrations/20260303_150000_add_ci_readonly_role.ts
# =============================================================================

on:
  pull_request:
    branches: [main]
  # paths filter intentionally omitted: this is a required status check and must
  # fire on every PR targeting main. A path-filtered required check never triggers
  # on non-migration PRs, leaving them stuck at "Expected" and unable to merge.
  # push-to-main trigger removed: migration status is verified on PRs before
  # merge.  Use workflow_dispatch for ad-hoc checks post-merge.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to force a fresh migration check on (manual recheck)"
        required: true
        type: number

env:
  AWS_REGION: us-east-1
  AWS_STAGE: dev
  # SSM parameter paths (values written by Terraform)
  SSM_CI_CREDS_SECRET_PARAM: /legacy-sports/dev/ci/readonly-db-creds-secret-name

# One check per branch/PR at a time; the latest run wins. Manual retriggers
# (workflow_dispatch, no head_ref since they run from main) key off the
# pr_number input so they don't collide with an unrelated main-ref run.
concurrency:
  group: check-migrations-applied-${{ github.event.pull_request.number || inputs.pr_number || github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write # Required for OIDC authentication
  contents: read
  pull-requests: write # Required for adding failure labels
  statuses: write # Required to post the "Verify All Migrations Applied" commit status (LS-9776)

jobs:
  # LS-1652: Restrict self-hosted runners to PR authors with write permission
  check-runner-access:
    name: "Resolve Runner Label"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner-label: ${{ steps.resolve.outputs.runner-label }}
      is-self-hosted: ${{ steps.resolve.outputs.is-self-hosted }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          sparse-checkout: .github/actions/resolve-runner-label
      - name: "Generate App Token"
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: 3158619
          private-key: ${{ secrets.AGENT_AUTHOR_APP_PRIVATE_KEY }}
      - name: "Resolve Runner Label"
        id: resolve
        uses: ./.github/actions/resolve-runner-label
        with:
          runner-label: ${{ vars.CI_RUNNER_LABEL }}
          github-token: ${{ steps.app-token.outputs.token || github.token }}

  check:
    # Informational check-run name — deliberately NOT "Verify All Migrations
    # Applied". That name is the required status check (.github/ruleset.json),
    # posted as a commit status by the "Post required status" step below
    # (LS-9776, mirrors check-conflicts.yml's LS-9604) — giving this job's own
    # check-run the same name would recreate the duplicate-required-name
    # ambiguity that fix avoids.
    name: "🗄️ Migration Check (job)"
    needs: [check-runner-access]
    runs-on: ${{ needs.check-runner-access.outputs.runner-label }}
    timeout-minutes: 10

    steps:
      - name: "Require self-hosted runner"
        if: needs.check-runner-access.outputs.is-self-hosted != 'true'
        run: |
          echo "::error::This workflow requires a self-hosted runner with direct VPC access to RDS."
          echo "::error::RDS is not publicly accessible (publicly_accessible=false)."
          echo "::error::Ensure CI_RUNNER_LABEL is configured and the PR author has write permission."
          exit 1

      # Authenticate the PR-info lookup with the Agent Author app rather than
      # the default GITHUB_TOKEN — same rationale as check-conflicts.yml
      # (LS-8277): GITHUB_TOKEN shares a single ~1,000 req/hr installation
      # rate-limit bucket across every workflow in the repo.
      - name: "Generate App Token"
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: 3158619
          private-key: ${{ secrets.AGENT_AUTHOR_APP_PRIVATE_KEY }}

      # Resolves prNumber/headSha from either the normal pull_request trigger
      # or, on a manual workflow_dispatch retrigger, via the API using the
      # pr_number input — mirrors check-conflicts.yml's "Resolve PR info".
      - name: "Resolve PR info"
        id: pr-info
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            let prNumber, headSha;
            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
              headSha  = context.payload.pull_request.head.sha;
            } else {
              prNumber = Number('${{ inputs.pr_number }}');
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              headSha = pr.head.sha;
            }
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('head_sha', headSha);

      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Explicit checkout of the resolved head SHA rather than relying on
          # default checkout behavior — required so a workflow_dispatch
          # retrigger (which runs from main) actually checks out the PR's code.
          ref: ${{ steps.pr-info.outputs.head_sha }}

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          set-nx-shas: false
          include-optional-deps: false

      - name: "Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          # Read-only plan role — this workflow runs on pull_request and does not apply
          # any Terraform changes. Needs SSM reads, Secrets Manager DB credentials, and
          # the temporary RDS SG ingress rule for GitHub-hosted runners.
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME || 'arn:aws:iam::176661590736:role/legacy-sports-dev-github-actions-plan' }}
          aws-region: ${{ env.AWS_REGION }}

      # -----------------------------------------------------------------------
      # Resolve ci_readonly credentials from AWS Secrets Manager via SSM
      # -----------------------------------------------------------------------
      - name: "Resolve ci_readonly DB credentials"
        id: db-creds
        run: |
          echo "::group::Resolve credentials"

          # 1. Get the Secrets Manager secret name from SSM
          SECRET_NAME=$(aws ssm get-parameter \
            --name "${{ env.SSM_CI_CREDS_SECRET_PARAM }}" \
            --query "Parameter.Value" \
            --output text)
          echo "  Secret name: $SECRET_NAME"

          # 2. Fetch the secret JSON
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_NAME" \
            --query "SecretString" \
            --output text)

          # 3. Export individual fields as masked outputs
          DB_HOST=$(echo "$SECRET_JSON" | jq -r '.host')
          DB_PORT=$(echo "$SECRET_JSON" | jq -r '.port // 5432')
          DB_USER=$(echo "$SECRET_JSON" | jq -r '.username')
          DB_PASS=$(echo "$SECRET_JSON" | jq -r '.password')
          DB_NAME=$(echo "$SECRET_JSON" | jq -r '.database // "postgres"')

          echo "  Host: $DB_HOST"
          echo "  User: $DB_USER"
          echo "  Database: $DB_NAME"

          # Mask the password in logs
          echo "::add-mask::$DB_PASS"

          # Export for subsequent steps
          echo "db_host=$DB_HOST"    >> "$GITHUB_OUTPUT"
          echo "db_port=$DB_PORT"    >> "$GITHUB_OUTPUT"
          echo "db_user=$DB_USER"    >> "$GITHUB_OUTPUT"
          echo "db_name=$DB_NAME"    >> "$GITHUB_OUTPUT"
          {
            echo "db_pass<<HEREDOC_SENTINEL"
            echo "$DB_PASS"
            echo "HEREDOC_SENTINEL"
          } >> "$GITHUB_OUTPUT"

          echo "::endgroup::"

      # -----------------------------------------------------------------------
      # Trust the AWS RDS certificate chain so Node.js can validate SSL certs
      # -----------------------------------------------------------------------
      - name: "Install AWS RDS CA bundle"
        id: rds-ca
        run: |
          curl -sSf https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem \
            -o "$RUNNER_TEMP/rds-global-bundle.pem"
          echo "ca_bundle=$RUNNER_TEMP/rds-global-bundle.pem" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Run the check
      # -----------------------------------------------------------------------
      - name: "Check all migrations are applied"
        id: migration-check
        env:
          CI_READONLY_DB_HOST: ${{ steps.db-creds.outputs.db_host }}
          CI_READONLY_DB_PORT: ${{ steps.db-creds.outputs.db_port }}
          CI_READONLY_DB_USER: ${{ steps.db-creds.outputs.db_user }}
          CI_READONLY_DB_PASSWORD: ${{ steps.db-creds.outputs.db_pass }}
          CI_READONLY_DB_NAME: ${{ steps.db-creds.outputs.db_name }}
          CI_READONLY_DB_SSL: "true"
          NODE_EXTRA_CA_CERTS: ${{ steps.rds-ca.outputs.ca_bundle }}
        run: |
          set -o pipefail
          node scripts/check-migrations-applied.js 2>&1 | tee "$RUNNER_TEMP/migrations.log"

      - name: 'Post "Verify All Migrations Applied" required status'
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CHECK_OUTCOME: ${{ steps.migration-check.outcome }}
        with:
          # LS-10561: post with GITHUB_TOKEN (github-actions[bot]), NOT the
          # Legacy Sports CI app. Branch protection on main binds this required
          # context to the github-actions app; a status from any other app is
          # rejected at merge time with 405 "Required status check ... was not
          # set by the expected GitHub app" — which froze the merge queue for
          # every PR after LS-10559 made the CI app token mint succeed.
          # Re-run via workflow_dispatch (pr_number) to replace a CI-app status.
          # Runbook: docs/ci-cd/ci-troubleshooting-guide.md -> "not set by the
          # expected GitHub app".
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const passed = process.env.CHECK_OUTCOME === 'success';
            // The required status check (LS-9776, mirrors LS-9604). Posted as
            // a commit status scoped to the resolved head SHA, not this job's
            // own check-run — see the job-name comment above for why.
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: '${{ steps.pr-info.outputs.head_sha }}',
              state: passed ? 'success' : 'failure',
              context: 'Verify All Migrations Applied',
              description: passed
                ? 'All migrations applied'
                : 'Migration check failed — see workflow run',
              target_url: `https://github.com/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });

      - name: "Label PR on Migration Failure"
        if: always() && steps.pr-info.outputs.pr_number
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = Number('${{ steps.pr-info.outputs.pr_number }}');
            if (!prNumber) return;

            const checkResult = '${{ steps.migration-check.outcome }}';
            const label = 'CI: Migration';

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const existingLabels = pr.labels.map(l => l.name);

            async function withRetry(fn, retries = 3) {
              for (let i = 0; i < retries; i++) {
                try { return await fn(); }
                catch (e) {
                  const isPrimaryRateLimit = e.status === 429;
                  const isSecondaryRateLimit = e.status === 403 && /secondary rate limit/i.test(typeof e.message === 'string' ? e.message : '');
                  if ((isPrimaryRateLimit || isSecondaryRateLimit) && i < retries - 1) {
                    const delay = Math.pow(2, i) * 1000;
                    core.warning(`Rate limited (${e.status}), retrying in ${delay}ms…`);
                    await new Promise(r => setTimeout(r, delay));
                  } else throw e;
                }
              }
            }

            const shouldHaveLabel = checkResult === 'failure';
            const hasLabel = existingLabels.includes(label);
            if (shouldHaveLabel && !hasLabel) {
              await withRetry(() => github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: [label],
              }));
              core.info(`Label added: ${label}`);
            } else if (!shouldHaveLabel && hasLabel) {
              await withRetry(() => github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name: label,
              }));
              core.info(`Label removed: ${label}`);
            }

      - name: "Update CI status comment (migrations section)"
        if: always() && steps.pr-info.outputs.pr_number
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          MIGRATION_OUTCOME: ${{ steps.migration-check.outcome }}
          MIGRATION_STATUS: ${{ steps.migration-check.outputs.migration_status }}
          MIGRATION_PENDING: ${{ steps.migration-check.outputs.pending_migrations }}
          MIGRATION_ERROR: ${{ steps.migration-check.outputs.migration_error }}
          MIGRATION_LOG: ${{ runner.temp }}/migrations.log
          PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr-info.outputs.head_sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { applySection } = require('./.github/scripts/ci-failure-capture/sticky-comment.js');
            const { statusHeading, detailsBlock, fixLine } = require('./.github/scripts/ci-failure-capture/render.js');
            const { distill } = require('./.github/scripts/ci-failure-capture/extract.js');

            const prNumber = Number(process.env.PR_NUMBER);
            if (!prNumber) return;

            const failed = process.env.MIGRATION_OUTCOME === 'failure';
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;

            const headSha = process.env.HEAD_SHA || context.sha;

            if (!failed) {
              await applySection({ github, context, prNumber, key: 'migrations', content: null, producer: 'check-migrations', headSha });
              return;
            }

            let log = '';
            try { log = fs.readFileSync(process.env.MIGRATION_LOG, 'utf8'); } catch {}
            const { excerpt } = distill({ tool: 'generic', text: log, runUrl });

            // LS-9599: only claim "unapplied migrations" when the script actually
            // connected, compared applied-vs-disk state, and found a gap
            // (migration_status === 'pending'). Any other outcome — a connect,
            // auth, or timeout failure classified as 'infra', an unexpected
            // 'error', or a missing status from an older/crashed run — means the
            // script never established that basis, so it must not point an agent
            // at "apply the pending migrations" for what may be a pure infra flake.
            const status = process.env.MIGRATION_STATUS || '';
            let content;

            if (status === 'pending') {
              const pendingList = (process.env.MIGRATION_PENDING || '')
                .split(',')
                .map((s) => s.trim())
                .filter(Boolean);
              const summary = `${pendingList.length} migration${pendingList.length === 1 ? '' : 's'} not applied`;
              content = [
                statusHeading('Migrations', 'fail', summary, headSha),
                '',
                detailsBlock({
                  check: 'migrations',
                  label: 'migrations not applied',
                  sublabel: pendingList.length ? pendingList.join(', ') : summary,
                  excerpt,
                }),
                '',
                fixLine('apply the pending migrations to the database', runUrl),
              ].join('\n').trim();
            } else {
              const summary = 'could not determine migration state (infra)';
              content = [
                statusHeading('Migrations', 'fail', summary, headSha),
                '',
                detailsBlock({
                  check: 'migrations',
                  label: 'could not determine migration state',
                  sublabel: process.env.MIGRATION_ERROR || '',
                  excerpt,
                }),
                '',
                fixLine('re-run; check RDS reachability from the runner', runUrl),
              ].join('\n').trim();
            }

            await applySection({
              github, context, prNumber,
              key: 'migrations',
              content,
              producer: 'check-migrations',
              headSha,
            });
