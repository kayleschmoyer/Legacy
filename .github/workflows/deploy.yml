name: Deploy

# =============================================================================
# Umbrella Deploy Workflow
# =============================================================================
# Single entry point for all main-branch deploys. Detects which deployable
# targets were affected by the push and calls per-target reusable child
# workflows conditionally. A single rollup-status job aggregates results so
# humans (and Discord) see one unified "this is what shipped for commit X"
# message instead of multiple independent workflow runs racing for attention.
#
# Children:
#   - Upload Lambdas               (.github/workflows/upload-lambdas.yml)
#   - Apply Lambda Infrastructure  (.github/workflows/lambda-terraform-apply.yml)
#   - Deploy Web                   (.github/workflows/deploy-web.yml)
#   - Build Android App            (.github/workflows/build-android-app.yml)
#   - Deploy Storybook             (.github/workflows/deploy-storybook.yml)
#
# Apply Lambda Infrastructure runs synchronously, right after Upload Lambdas
# and before Deploy Web (LS-9374/LS-9369 restructure). Previously it ran as a
# fully independent workflow triggered by THIS workflow's completion — so
# Deploy Web (GitHub Pages, fast) could go live with a client change well
# before the matching required server schema change actually reached the
# live Lambda, producing transient GraphQL "Unknown argument" / "Cannot query
# field" errors for real users during the gap (Rollbar #232/#233, up to ~19h
# in one incident). Deploy Web now `needs` Apply Lambda Infrastructure and
# only proceeds once it succeeds or is skipped (lambdas not targeted this
# push), so a schema-dependent client build can never ship ahead of the
# server code it depends on. Apply Lambda Infrastructure keeps its own
# cancel-in-progress-false concurrency group so back-to-back deploys still
# batch into a single terraform apply; it is also still independently
# triggerable via workflow_run off "Upload Lambdas" completing, for manual
# one-off upload-lambdas.yml dispatches. See lambda-terraform-apply.yml's own
# header for the full trigger inventory.
#
# Build Android App joined this ordering under the same `needs` gate
# (LS-8765): it used to trigger off its own independent `push: branches:
# [main]`, so an Android build carrying a client change that depended on a
# new/changed server field could ship (APK release + "current" S3 pointer)
# before the `graphql` Lambda serving that field actually went live —
# exactly the race already closed for Deploy Web above, just left open on
# the mobile side. Production surfaced it as `Cannot query field "nflTeam"
# on type "Player"` CombinedGraphQLErrors on GetTeamMembers/GetTeamTradeOffers
# for the ~9 days until the lagging Lambda deploy caught up (Rollbar #212).
#
# detect-changes emits a separate `terraform` boolean alongside `lambdas`
# (LS-9871). Apply Lambda Infrastructure runs on `lambdas || terraform`, while
# Upload Lambdas stays on `lambdas` alone — so a terraform-only push applies
# infrastructure without rebuilding and re-uploading all 18 lambda bundles for
# zero new SSM versions.
# =============================================================================

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force-lambdas:
        description: "Force the lambda deploy child (bypass paths filter)"
        required: false
        default: false
        type: boolean
      force-web:
        description: "Force the web deploy child (bypass paths filter)"
        required: false
        default: false
        type: boolean
      force-android:
        description: "Force the Android build child (bypass paths filter)"
        required: false
        default: false
        type: boolean
      force-storybook:
        description: "Force the storybook deploy child (bypass paths filter)"
        required: false
        default: false
        type: boolean
      skip-ci-check:
        description: "Skip CI status verification on the lambda upload (emergency deploys only — e.g. a merge-queue-produced main HEAD with no CI run of its own)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write # create-release in web child needs this
  id-token: write # AWS OIDC + GitHub Pages
  pages: write
  pull-requests: write # deploy-storybook child posts a sticky PR comment

# A burst of merges to main would otherwise fan out N fully concurrent umbrella
# runs (deploy-web / upload-lambdas / deploy-storybook each racing N-wide), and
# every completion re-arms the downstream workflow_run gates (lambda-terraform-apply,
# run-playwright-tests, cross-browser-e2e, run-maestro-sweep) redundantly.
# cancel-in-progress is intentionally FALSE — a cancelled mid-deploy is worse
# than a queued one — so back-to-back merges deploy sequentially instead of
# in parallel. Each queued run still targets HEAD at run time, so this trades
# "N wasteful concurrent deploys" for "N deploys, later ones start later" —
# it does not make any individual commit ship faster, since the old
# concurrent behavior didn't guarantee every commit got its own deploy either.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Detect which deploy targets are affected by this push.
  # Uses dorny/paths-filter rather than the repo's heavier detect-changes
  # composite action — this workflow only needs a coarse per-target boolean.
  # ---------------------------------------------------------------------------
  detect-changes:
    name: Detect Deploy Targets
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      lambdas: ${{ steps.result.outputs.lambdas }}
      terraform: ${{ steps.result.outputs.terraform }}
      web: ${{ steps.result.outputs.web }}
      android: ${{ steps.result.outputs.android }}
      storybook: ${{ steps.result.outputs.storybook }}

    steps:
      - name: Guard — main branch only
        # Deploy mutates production-adjacent state (SSM lambda versions, S3,
        # GitHub Pages) and posts Discord notifications / updates the Deploy
        # badge. Those side-effects must never run from a non-main branch,
        # even via workflow_dispatch. The downstream lambda-terraform-apply
        # workflow_run is already restricted to branches: [main], so a
        # non-main dispatch that bumped SSM versions would leave infra
        # unreconciled. Fail fast at the top of detect-changes — since every
        # other job needs detect-changes, this halts the entire umbrella run
        # before any child can be invoked.
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploy workflow can only run on main branch. Got ref=${{ github.ref }}"
          exit 1

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            lambdas:
              - 'lambdas/**'
              - 'lib/**'
              - 'tools/mcp/**'
              - 'tools/vite-configs/**'
              - '.github/workflows/upload-lambdas.yml'
              - '.github/workflows/lambda-terraform-apply.yml'
              - '.github/workflows/deploy.yml'
            # Infrastructure-only signal (LS-9871). Kept SEPARATE from
            # `lambdas` on purpose: a terraform-only change ships no new
            # lambda code, so forcing it through `lambdas` would rebuild and
            # re-upload all 18 lambda bundles (~the slowest part of a deploy)
            # to produce zero new SSM versions. Gating Apply Lambda
            # Infrastructure on `lambdas || terraform` instead lets a
            # terraform-only push apply directly, while a lambda push keeps
            # the existing upload-then-apply ordering. Scoped to
            # terraform/main/** because that is the only state
            # lambda-terraform-apply.yml touches; terraform/runners/** has its
            # own workflow (runner-terraform-apply.yml).
            terraform:
              - 'terraform/main/**'
              - '.github/workflows/lambda-terraform-apply.yml'
              - '.github/workflows/deploy.yml'
            web:
              - 'apps/web/**'
              - 'lib/shared-components/**'
              - '.github/workflows/deploy-web.yml'
              - '.github/workflows/deploy.yml'
            android:
              - 'apps/app/**'
              - 'lib/shared-components/**'
              - 'lib/ui-abstractions/**'
              - 'lib/utils/**'
              - 'lib/api/**'
              - 'lib/analytics/**'
              - 'lib/websocket-client/**'
              - 'lib/tamagui-config/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/build-android-app.yml'
              - '.github/workflows/deploy.yml'
            storybook:
              - 'lib/shared-components/**'
              - '.github/workflows/deploy-storybook.yml'
              - '.github/workflows/deploy.yml'

      - name: Combine with manual overrides
        id: result
        run: |
          # Union paths-filter results with workflow_dispatch force-* inputs.
          # force-* inputs are only defined on workflow_dispatch events; on push
          # they resolve to the empty string and are a no-op.
          LAMBDAS="${{ steps.filter.outputs.lambdas }}"
          TERRAFORM="${{ steps.filter.outputs.terraform }}"
          WEB="${{ steps.filter.outputs.web }}"
          ANDROID="${{ steps.filter.outputs.android }}"
          STORYBOOK="${{ steps.filter.outputs.storybook }}"

          # force-lambdas forces the terraform apply too, so the manual
          # `gh workflow run deploy.yml -f force-lambdas=true` escape hatch
          # keeps applying infrastructure exactly as it did before LS-9871.
          if [ "${{ inputs['force-lambdas'] }}" = "true" ]; then
            LAMBDAS="true"
            TERRAFORM="true"
          fi
          if [ "${{ inputs['force-web'] }}" = "true" ]; then
            WEB="true"
          fi
          if [ "${{ inputs['force-android'] }}" = "true" ]; then
            ANDROID="true"
          fi
          if [ "${{ inputs['force-storybook'] }}" = "true" ]; then
            STORYBOOK="true"
          fi

          echo "lambdas=$LAMBDAS" >> "$GITHUB_OUTPUT"
          echo "terraform=$TERRAFORM" >> "$GITHUB_OUTPUT"
          echo "web=$WEB" >> "$GITHUB_OUTPUT"
          echo "android=$ANDROID" >> "$GITHUB_OUTPUT"
          echo "storybook=$STORYBOOK" >> "$GITHUB_OUTPUT"

          {
            echo "## 🎯 Deploy Targets"
            echo ""
            echo "| Target | Affected |"
            echo "| --- | --- |"
            echo "| Lambdas | $LAMBDAS |"
            echo "| Terraform | $TERRAFORM |"
            echo "| Web | $WEB |"
            echo "| Android | $ANDROID |"
            echo "| Storybook | $STORYBOOK |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Child: Upload Lambdas
  # ---------------------------------------------------------------------------
  upload-lambdas:
    name: Upload Lambdas
    needs: detect-changes
    if: needs.detect-changes.outputs.lambdas == 'true'
    permissions:
      actions: write # needed by trigger-ci job (workflow_call permission inheritance)
      id-token: write # required for AWS OIDC in the reusable workflow
      contents: read # required by the reusable workflow and cannot be elevated by the callee
      pull-requests: read # required by the reusable workflow and cannot be elevated by the callee
      # verify-ci reads the `CI Gate` commit status (LS-9378). A callee cannot
      # request a scope the caller withholds: declaring it only in
      # upload-lambdas.yml failed the WHOLE Deploy run at startup with "workflow
      # file issue" and zero jobs (LS-9380). deploy.yml runs only on push to main,
      # so PR CI never starts it and cannot catch this class of break.
      statuses: read
    uses: ./.github/workflows/upload-lambdas.yml
    secrets: inherit
    with:
      # Forwarded so the escape hatch upload-lambdas.yml's own error message
      # points to is actually reachable from the documented umbrella dispatch
      # (LS-9875) — a merge-queue squash-merge produces a main HEAD SHA with
      # no CI run of its own, so "Verify CI Status" reliably fails there even
      # though main is healthy, and this was previously unforwardable through
      # deploy.yml.
      skip-ci-check: ${{ inputs['skip-ci-check'] == true }}

  # ---------------------------------------------------------------------------
  # Child: Apply Lambda Infrastructure
  # ---------------------------------------------------------------------------
  # Runs synchronously between Upload Lambdas and Deploy Web (LS-9374/LS-9369):
  # Deploy Web depends on this completing so a client build that requires a
  # new/changed server schema can never go live before that schema does.
  apply-lambda-infrastructure:
    name: Apply Lambda Infrastructure
    needs: [detect-changes, upload-lambdas]
    # `!cancelled()` is load-bearing (LS-9871): without a status-check function
    # the job carries an implicit `success()` over every `needs`, so a SKIPPED
    # upload-lambdas would skip this job too — which is exactly what a
    # terraform-only push produces. With it, the dependency states are checked
    # explicitly instead: apply runs when infrastructure was targeted and the
    # upload either succeeded or was legitimately skipped, and is held back
    # when the upload failed or was cancelled (partial SSM state the plan step
    # must not act on).
    if: >-
      !cancelled() &&
      (needs.detect-changes.outputs.lambdas == 'true' ||
      needs.detect-changes.outputs.terraform == 'true') &&
      (needs.upload-lambdas.result == 'success' ||
      needs.upload-lambdas.result == 'skipped')
    permissions:
      id-token: write # AWS OIDC
      contents: read
      # Covers workflow_run/workflow_dispatch context reads inside the callee,
      # and MUST be `write`, not `read` (LS-9585): the callee's
      # `report-runner-shutdown` job declares `actions: write` to re-dispatch
      # the workflow after a confirmed runner death. A callee may only DOWNGRADE
      # the caller's permissions, never upgrade them, and GitHub rejects the
      # violation at workflow-parse time -- so `read` here killed the WHOLE
      # Deploy run at startup with zero jobs and no logs (same failure mode as
      # LS-9380, above). Neither gate catches this: `make lint-workflows` passes,
      # because the escalation rule is a GitHub runtime constraint the JSON
      # schema does not model, and deploy.yml runs only on push to main, so PR
      # CI never starts it.
      actions: write
    uses: ./.github/workflows/lambda-terraform-apply.yml
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Child: Deploy Web
  # ---------------------------------------------------------------------------
  deploy-web:
    name: Deploy Web
    needs: [detect-changes, upload-lambdas, apply-lambda-infrastructure]
    # Gate on the lambda children's results, not just detect-changes: 'success'
    # (targeted and shipped) or 'skipped' (not targeted this push) both mean
    # it's safe to proceed. 'failure'/'cancelled' block Deploy Web entirely —
    # see the umbrella header comment for why this ordering exists.
    #
    # `!cancelled()` is required for that 'skipped' allowance to be reachable
    # at all (LS-9871). A job whose `if` contains no status-check function
    # carries an implicit `success()` over its `needs`, and `success()` is
    # false when a needed job was skipped — so the old condition skipped
    # Deploy Web on EVERY push where Apply Lambda Infrastructure did not run,
    # including every push where it skipped because of the dead
    # `workflow_call` clause.
    #
    # upload-lambdas is in `needs` so a FAILED lambda upload can be told apart
    # from a legitimately skipped one. Without it, "apply was skipped" would
    # read as safe even when it was skipped precisely because the lambda
    # upload failed — re-opening the client-ahead-of-server race this
    # ordering exists to close.
    if: >-
      !cancelled() &&
      needs.detect-changes.outputs.web == 'true' &&
      (needs.upload-lambdas.result == 'success' ||
      needs.upload-lambdas.result == 'skipped') &&
      (needs.apply-lambda-infrastructure.result == 'success' ||
      needs.apply-lambda-infrastructure.result == 'skipped')
    permissions:
      actions: read # nx-set-shas base SHA resolution
      contents: write # create-release
      pages: write # GitHub Pages deploy
      id-token: write # AWS OIDC + GitHub Pages
    uses: ./.github/workflows/deploy-web.yml
    secrets: inherit
    with:
      suppress-notifications: true
    # workflow_call outputs (version, build_number, release_tag) are declared in deploy-web.yml
    # and accessible here via needs.deploy-web.outputs.* in rollup-status

  # ---------------------------------------------------------------------------
  # Child: Build Android App
  # ---------------------------------------------------------------------------
  # Same ordering rationale and gate as Deploy Web above (LS-8765): an Android
  # build that depends on a new/changed server schema must never ship (release
  # + "current" S3 pointer) before that schema is live on the graphql Lambda.
  build-android:
    name: Build Android App
    needs: [detect-changes, upload-lambdas, apply-lambda-infrastructure]
    if: >-
      !cancelled() &&
      needs.detect-changes.outputs.android == 'true' &&
      (needs.upload-lambdas.result == 'success' ||
      needs.upload-lambdas.result == 'skipped') &&
      (needs.apply-lambda-infrastructure.result == 'success' ||
      needs.apply-lambda-infrastructure.result == 'skipped')
    permissions:
      actions: read # nx-set-shas base SHA resolution
      contents: write # create-release
      id-token: write # OIDC auth to AWS when publishing the APK to S3
    uses: ./.github/workflows/build-android-app.yml
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Child: Deploy Storybook
  # ---------------------------------------------------------------------------
  deploy-storybook:
    name: Deploy Storybook
    needs: detect-changes
    if: needs.detect-changes.outputs.storybook == 'true'
    permissions:
      contents: read # checkout; pushes to deploy repo use PAT from secrets
      pull-requests: write # deploy-storybook posts a sticky PR comment
    uses: ./.github/workflows/deploy-storybook.yml
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Rollup: aggregate child results, post one Discord summary, update badge.
  # Runs even if individual children were skipped or failed.
  # ---------------------------------------------------------------------------
  rollup-status:
    name: Rollup Status
    needs: [detect-changes, upload-lambdas, apply-lambda-infrastructure, deploy-web, build-android, deploy-storybook]
    if: always()
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Compute rollup
        id: rollup
        shell: bash
        env:
          DETECT_CHANGES_RESULT: ${{ needs.detect-changes.result }}
          LAMBDAS_TARGETED: ${{ needs.detect-changes.outputs.lambdas }}
          TERRAFORM_TARGETED: ${{ needs.detect-changes.outputs.terraform }}
          WEB_TARGETED: ${{ needs.detect-changes.outputs.web }}
          ANDROID_TARGETED: ${{ needs.detect-changes.outputs.android }}
          STORYBOOK_TARGETED: ${{ needs.detect-changes.outputs.storybook }}
          LAMBDAS_UPLOAD_RESULT: ${{ needs.upload-lambdas.result }}
          LAMBDAS_APPLY_RESULT: ${{ needs.apply-lambda-infrastructure.result }}
          WEB_RESULT: ${{ needs.deploy-web.result }}
          ANDROID_RESULT: ${{ needs.build-android.result }}
          STORYBOOK_RESULT: ${{ needs.deploy-storybook.result }}
        run: |
          set -euo pipefail

          # Translate child job results into a single rollup state.
          # Each target is one of: success | failure | skipped | cancelled | not-targeted.
          translate() {
            local targeted="$1"
            local result="$2"
            if [ "$targeted" != "true" ]; then
              echo "not-targeted"
              return
            fi
            case "$result" in
              success)   echo "success" ;;
              failure)   echo "failure" ;;
              cancelled) echo "cancelled" ;;
              skipped)   echo "skipped" ;;
              *)         echo "$result" ;;
            esac
          }

          # Lambdas covers two sequential jobs (Upload Lambdas, then Apply
          # Lambda Infrastructure) — the rollup reports the worse of the two,
          # since either one failing/cancelling means the Lambda side of this
          # deploy did not fully complete.
          worse_of() {
            local a="$1" b="$2"
            for state in failure cancelled skipped; do
              if [ "$a" = "$state" ] || [ "$b" = "$state" ]; then
                echo "$state"
                return
              fi
            done
            echo "success"
          }

          # Apply Lambda Infrastructure is targeted by lambdas OR terraform
          # (LS-9871) — a terraform-only push applies without uploading, so
          # reporting the apply against LAMBDAS_TARGETED alone would mislabel a
          # real apply as "not-targeted".
          if [ "$LAMBDAS_TARGETED" = "true" ] || [ "$TERRAFORM_TARGETED" = "true" ]; then
            INFRA_TARGETED="true"
          else
            INFRA_TARGETED="false"
          fi

          LAMBDAS_UPLOAD_STATE=$(translate "$LAMBDAS_TARGETED" "$LAMBDAS_UPLOAD_RESULT")
          LAMBDAS_APPLY_STATE=$(translate "$INFRA_TARGETED" "$LAMBDAS_APPLY_RESULT")
          LAMBDAS_STATE=$(worse_of "$LAMBDAS_UPLOAD_STATE" "$LAMBDAS_APPLY_STATE")
          WEB_STATE=$(translate "$WEB_TARGETED" "$WEB_RESULT")
          ANDROID_STATE=$(translate "$ANDROID_TARGETED" "$ANDROID_RESULT")
          STORYBOOK_STATE=$(translate "$STORYBOOK_TARGETED" "$STORYBOOK_RESULT")

          # If detect-changes itself failed/cancelled, no per-target booleans are
          # available — surface that as the overall state immediately so we don't
          # silently report a "skipped" deploy when the workflow actually broke.
          if [ "$DETECT_CHANGES_RESULT" != "success" ]; then
            case "$DETECT_CHANGES_RESULT" in
              failure)   OVERALL="failure" ;;
              cancelled) OVERALL="cancelled" ;;
              *)         OVERALL="failure" ;;
            esac
          else
            # Overall status: failure if any targeted child failed, cancelled if
            # one or more targeted children were cancelled and none failed,
            # success if at least one child succeeded and none failed/cancelled,
            # skipped if nothing was targeted at all. Distinguishing cancelled
            # from failure avoids false-failure Discord alerts when a deploy is
            # superseded by a newer run via cancel-in-progress concurrency.
            OVERALL="skipped"
            ANY_FAILURE=false
            ANY_CANCELLED=false
            ANY_SUCCESS=false
            for STATE in "$LAMBDAS_STATE" "$WEB_STATE" "$ANDROID_STATE" "$STORYBOOK_STATE"; do
              case "$STATE" in
                failure)   ANY_FAILURE=true ;;
                cancelled) ANY_CANCELLED=true ;;
                success)   ANY_SUCCESS=true ;;
              esac
            done
            if [ "$ANY_FAILURE" = "true" ]; then
              OVERALL="failure"
            elif [ "$ANY_CANCELLED" = "true" ]; then
              OVERALL="cancelled"
            elif [ "$ANY_SUCCESS" = "true" ]; then
              OVERALL="success"
            fi
          fi

          echo "lambdas_state=$LAMBDAS_STATE" >> "$GITHUB_OUTPUT"
          echo "web_state=$WEB_STATE" >> "$GITHUB_OUTPUT"
          echo "android_state=$ANDROID_STATE" >> "$GITHUB_OUTPUT"
          echo "storybook_state=$STORYBOOK_STATE" >> "$GITHUB_OUTPUT"
          echo "overall=$OVERALL" >> "$GITHUB_OUTPUT"

          # Derive a coarse environment label for the Discord rollup. The
          # umbrella can include the web deploy (which targets production) or
          # be lambdas/storybook only (dev). Use "production" when web is
          # actually targeted, otherwise "dev". Avoid hard-coding so the
          # rollup notification matches what was actually shipped.
          if [ "$WEB_TARGETED" = "true" ]; then
            ROLLUP_ENVIRONMENT="production"
          else
            ROLLUP_ENVIRONMENT="dev"
          fi
          echo "environment=$ROLLUP_ENVIRONMENT" >> "$GITHUB_OUTPUT"

          # Build a human-readable description for Discord / step summary.
          emoji_for() {
            case "$1" in
              success)      echo "✅" ;;
              failure)      echo "❌" ;;
              cancelled)    echo "⚠️" ;;
              skipped)      echo "⏭️" ;;
              not-targeted) echo "—" ;;
              *)            echo "❔" ;;
            esac
          }

          LAMBDAS_EMOJI=$(emoji_for "$LAMBDAS_STATE")
          WEB_EMOJI=$(emoji_for "$WEB_STATE")
          ANDROID_EMOJI=$(emoji_for "$ANDROID_STATE")
          STORYBOOK_EMOJI=$(emoji_for "$STORYBOOK_STATE")

          DESCRIPTION=$(printf "%s Lambdas: %s\\n%s Web: %s\\n%s Android: %s\\n%s Storybook: %s" \
            "$LAMBDAS_EMOJI" "$LAMBDAS_STATE" \
            "$WEB_EMOJI" "$WEB_STATE" \
            "$ANDROID_EMOJI" "$ANDROID_STATE" \
            "$STORYBOOK_EMOJI" "$STORYBOOK_STATE")

          {
            echo "description<<DESC_EOF"
            printf "%s\n" "$DESCRIPTION"
            echo "DESC_EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## 📊 Deploy Rollup"
            echo ""
            echo "| Target | State |"
            echo "| --- | --- |"
            echo "| Lambdas | $LAMBDAS_EMOJI $LAMBDAS_STATE |"
            echo "| Web | $WEB_EMOJI $WEB_STATE |"
            echo "| Android | $ANDROID_EMOJI $ANDROID_STATE |"
            echo "| Storybook | $STORYBOOK_EMOJI $STORYBOOK_STATE |"
            echo ""
            echo "**Overall:** $OVERALL"
            echo ""
            if [ "$LAMBDAS_STATE" = "success" ]; then
              echo "> ℹ️ Terraform apply already ran synchronously as part of this Deploy run"
              echo "> (**Apply Lambda Infrastructure** job, before Deploy Web started)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build deploy changelog
        id: changelog
        shell: bash
        run: |
          BEFORE="${{ github.event.before }}"

          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            # Push event: show only commits in this specific push
            COMMITS=$(git log "${BEFORE}..HEAD" \
              --pretty=format:'[`%h`](https://github.com/${{ github.repository }}/commit/%H) %s' \
              --first-parent)
          else
            # workflow_dispatch or first push: fall back to last 10 commits
            COMMITS=$(git log --pretty=format:'[`%h`](https://github.com/${{ github.repository }}/commit/%H) %s' \
              --first-parent -10)
          fi

          {
            echo "commits<<CHANGELOG_EOF"
            echo "$COMMITS"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Discord Deploy Summary (success)
        if: steps.rollup.outputs.overall == 'success'
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: success
          title: "Deploy Summary"
          environment: ${{ steps.rollup.outputs.environment }}
          description: ${{ steps.rollup.outputs.description }}
          commits: ${{ steps.changelog.outputs.commits }}

      - name: Discord Deploy Summary (failure)
        if: steps.rollup.outputs.overall == 'failure'
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: failure
          title: "Deploy Summary"
          environment: ${{ steps.rollup.outputs.environment }}
          description: ${{ steps.rollup.outputs.description }}
          commits: ${{ steps.changelog.outputs.commits }}

      - name: Build release description
        id: release-desc
        if: steps.rollup.outputs.overall == 'success'
        shell: bash
        env:
          WEB_TARGETED: ${{ needs.detect-changes.outputs.web }}
          ANDROID_TARGETED: ${{ needs.detect-changes.outputs.android }}
          LAMBDAS_TARGETED: ${{ needs.detect-changes.outputs.lambdas }}
          TERRAFORM_TARGETED: ${{ needs.detect-changes.outputs.terraform }}
          STORYBOOK_TARGETED: ${{ needs.detect-changes.outputs.storybook }}
          WEB_VERSION: ${{ needs.deploy-web.outputs.version }}
          WEB_BUILD: ${{ needs.deploy-web.outputs.build_number }}
          # release_url is only set when the GitHub Release was actually created
          # successfully — empty when create-release was skipped or failed.
          WEB_RELEASE_URL: ${{ needs.deploy-web.outputs.release_url }}
        run: |
          LINES=()
          if [ "$WEB_TARGETED" = "true" ] && [ -n "$WEB_RELEASE_URL" ]; then
            LINES+=("**Web** v${WEB_VERSION}-${WEB_BUILD} — [Release notes](${WEB_RELEASE_URL})")
          elif [ "$WEB_TARGETED" = "true" ] && [ -n "$WEB_VERSION" ]; then
            LINES+=("**Web** v${WEB_VERSION}-${WEB_BUILD} deployed")
          elif [ "$WEB_TARGETED" = "true" ]; then
            LINES+=("**Web** deployed")
          fi
          if [ "$ANDROID_TARGETED" = "true" ]; then
            LINES+=("**Android** built")
          fi
          if [ "$LAMBDAS_TARGETED" = "true" ]; then
            LINES+=("**Lambdas** uploaded — Terraform applied")
          elif [ "$TERRAFORM_TARGETED" = "true" ]; then
            LINES+=("**Terraform** applied")
          fi
          if [ "$STORYBOOK_TARGETED" = "true" ]; then
            LINES+=("**Storybook** deployed")
          fi

          DESC=$(printf "%s\n" "${LINES[@]}")
          {
            echo "desc<<DESC_EOF"
            printf "%s\n" "$DESC"
            echo "DESC_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Discord Release Rollup
        if: steps.rollup.outputs.overall == 'success'
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          status: success
          title: "Deploy — ${{ steps.rollup.outputs.environment }}"
          environment: ${{ steps.rollup.outputs.environment }}
          description: ${{ steps.release-desc.outputs.desc }}
          commits: ${{ steps.changelog.outputs.commits }}
          thread-name: "Deploy #${{ github.run_number }}"

      - name: Update Deploy Badge
        if: always() && steps.rollup.outputs.overall != 'skipped'
        uses: ./.github/actions/update-deployment-badge
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          gist-id: ${{ secrets.CI_BADGES_GIST_ID }}
          deployment-name: "Deploy"
          deployment-status: ${{ steps.rollup.outputs.overall }}
          workflow-run-id: ${{ github.run_id }}
          branch: ${{ github.ref_name }}

      - name: Fail job if any child failed
        if: steps.rollup.outputs.overall == 'failure'
        run: |
          echo "::error::One or more deploy children failed — see rollup summary above."
          exit 1
