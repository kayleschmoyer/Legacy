# =============================================================================
# CI Health Report
# =============================================================================
# Automated failure-rate monitoring for the CI orchestrator (LS-1121, child of
# LS-1114). The 50% failure rate investigated in LS-1100 was only discovered
# via a one-off manual audit of 35 runs — there was no ongoing tracking, so a
# reliability regression would go unnoticed until it became painful again.
#
# This workflow queries the last N `ci-orchestrator.yml` runs, computes the
# failure rate (`.github/scripts/analyze-ci-runs.js`), and files a
# `CI Health Report - YYYY-MM-DD` issue with the stats — labelled
# `ci-health-alert` when the rate exceeds the 20% threshold from the ticket's
# acceptance criteria.
#
# Schedule-free CI policy (ADR 0010 amendment, LS-8487): no `schedule:` cron.
# Anchored instead on ci-orchestrator.yml completions (the natural signal that
# there is new run history worth analyzing) and debounced to at most once per
# CI_HEALTH_REPORT_MIN_INTERVAL_HOURS (repo var, default 168h == weekly) via
# a marker artifact the Analyze job uploads (O(1) API calls — LS-10558).
# Manual dispatch always runs, for on-demand reports.
# =============================================================================

name: "CI Health Report"

on:
  workflow_run:
    workflows: ["Legacy Sports CI Orchestrator"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run-limit:
        description: "Number of recent ci-orchestrator runs to analyze"
        required: false
        default: "50"
        type: string
      alert-threshold:
        description: "Failure rate (0-1) above which the report is flagged as an alert"
        required: false
        default: "0.2"
        type: string

permissions:
  contents: read
  issues: write
  actions: read # gate job lists this workflow's debounce marker artifact

# Serialize automated (workflow_run-triggered) reports; manual dispatches keep
# their own unique group so an on-demand report is never queued behind one.
concurrency:
  group: ci-health-report-${{ github.event_name == 'workflow_run' && 'auto' || github.run_id }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Debounce gate (schedule-free CI policy). This workflow fires on every
  # orchestrator completion, so the gate must be cheap: it makes exactly ONE
  # API call — the newest `ci-health-report-marker` artifact, which the
  # Analyze job of every automated run uploads as its first step — and skips
  # when that marker is newer than the cutoff (LS-10558; the old gate called
  # /actions/runs/{id}/jobs once per run in the window and exhausted the
  # repo's GITHUB_TOKEN budget). Any gh api error → skip, never red.
  # Decision + tests: .github/scripts/ci-health-report-gate.mjs.
  # ---------------------------------------------------------------------------
  gate:
    name: "CI Health Report Gate"
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 3
    outputs:
      should-run: ${{ steps.decide.outputs.should-run }}
    steps:
      - name: "Checkout (gate script only)"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          sparse-checkout: |
            .github/scripts/ci-health-report-gate.mjs
          sparse-checkout-cone-mode: false
      - name: "Decide whether to run"
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_INTERVAL_HOURS: ${{ vars.CI_HEALTH_REPORT_MIN_INTERVAL_HOURS || '168' }}
        run: node .github/scripts/ci-health-report-gate.mjs

  # ---------------------------------------------------------------------------
  # Analyze last N ci-orchestrator runs and file the report issue.
  # ---------------------------------------------------------------------------
  analyze:
    name: "Analyze"
    needs: [gate]
    if: needs.gate.outputs.should-run == 'true'
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      # Debounce marker read by the gate above. Uploaded FIRST so a failed
      # analysis still counts as an attempt; automated runs only, so manual
      # dispatches never debounce the automated report. retention-days must
      # exceed CI_HEALTH_REPORT_MIN_INTERVAL_HOURS (clamped to the repo max).
      - name: Write debounce marker
        if: github.event_name == 'workflow_run'
        shell: bash
        run: echo "${{ github.run_id }}" > "$RUNNER_TEMP/ci-health-report-marker.txt"

      - name: Upload debounce marker
        if: github.event_name == 'workflow_run'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-health-report-marker
          path: ${{ runner.temp }}/ci-health-report-marker.txt
          if-no-files-found: error
          retention-days: 90

      - name: Checkout (analysis script only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          sparse-checkout: |
            .github/scripts/analyze-ci-runs.js
          sparse-checkout-cone-mode: false

      - name: Analyze CI runs and file health report
        id: analyze
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RUN_LIMIT: ${{ github.event.inputs.run-limit || '50' }}
          ALERT_THRESHOLD: ${{ github.event.inputs.alert-threshold || '0.2' }}
        with:
          script: |
            const run = require('./.github/scripts/analyze-ci-runs.js');
            return run({ github, context, core });
