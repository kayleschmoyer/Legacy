name: Deploy Storybook

# =============================================================================
# Storybook Deploy
# =============================================================================
# Builds and deploys Storybook for lib/shared-components to GitHub Pages on
# the external deploy repo (bkrupa/legacy-sports-deploys) under /storybook/.
#
# Triggers:
#   - Called from the umbrella Deploy workflow via workflow_call on main push
#   - On every PR that touches shared-components (posts a sticky comment)
#   - Manual dispatch
# =============================================================================

on:
  # Push to main is handled by the umbrella Deploy workflow via workflow_call
  # so all deploys report under a single run.
  workflow_call:

  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "lib/shared-components/**"
      - ".github/workflows/deploy-storybook.yml"

  workflow_dispatch:

concurrency:
  group: storybook-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  DEPLOY_REPO: bkrupa/legacy-sports-deploys
  STORYBOOK_URL: https://bkrupa.github.io/legacy-sports-deploys/storybook/

jobs:
  # LS-1652: Restrict self-hosted runners to PR authors with write permission
  check-runner-access:
    name: "Resolve Runner Label"
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 2
    outputs:
      runner-label: ${{ steps.resolve.outputs.runner-label }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions/resolve-runner-label
      - name: "Resolve Runner Label"
        id: resolve
        uses: ./.github/actions/resolve-runner-label
        with:
          runner-label: ${{ vars.CI_RUNNER_LABEL }}

  # LS-1962: Merged build + deploy into a single job to eliminate GitHub
  # artifact upload/download, which was hitting storage quota limits.
  build-and-deploy:
    name: Build & Deploy Storybook
    needs: [check-runner-access]
    runs-on: ${{ needs.check-runner-access.outputs.runner-label }}
    timeout-minutes: 15
    # Push conflicts with other workflows deploying to the same gh-pages branch
    # are handled by the retry-with-rebase loop in the deploy step. No shared
    # concurrency group — GitHub only queues one pending job per group, so a
    # burst of deploys cancels intermediate pending jobs instead of queuing them.

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: false
          include-optional-deps: true

      - name: Build Storybook
        run: pnpm exec nx run shared-components:build-storybook --configuration=ci

      - name: Verify Build Output
        run: |
          if [ ! -f "dist/storybook/index.html" ]; then
            echo "::error::Storybook build failed — dist/storybook/index.html not found"
            exit 1
          fi
          echo "Storybook build output:"
          ls -la dist/storybook/

      # ── Deploy to GitHub Pages (non-PR only: workflow_call or dispatch) ──
      - name: Generate App Token
        id: app-token
        if: github.event_name != 'pull_request'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PREVIEW_APP_ID }}
          private-key: ${{ secrets.PREVIEW_APP_PRIVATE_KEY }}
          owner: bkrupa
          repositories: legacy-sports-deploys

      - name: Deploy Storybook
        if: github.event_name != 'pull_request'
        env:
          DEPLOY_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${DEPLOY_TOKEN}@github.com/${{ env.DEPLOY_REPO }}.git"

          git clone --depth 1 --single-branch --branch gh-pages "$REPO_URL" _deploy
          cd _deploy

          rm -rf storybook
          mkdir -p storybook
          cp -r ../dist/storybook/. storybook/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .

          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi

          git commit -m "deploy storybook"

          # Push with pull-rebase retry to handle races from other workflows
          # pushing to the same gh-pages branch between our clone and push.
          MAX_RETRIES=7
          for attempt in $(seq 1 $MAX_RETRIES); do
            if git push origin gh-pages; then
              echo "Push succeeded (attempt ${attempt})"
              exit 0
            fi
            JITTER=$((RANDOM % 5))
            echo "Push failed (attempt ${attempt}) — retrying in $((attempt * 2 + JITTER))s..."
            sleep $((attempt * 2 + JITTER))
            git pull --rebase origin gh-pages
          done

          echo "Push failed after ${MAX_RETRIES} attempts"
          exit 1

      # ── Sticky PR Comment (only on pull requests) ─────────────────────────
      - name: Comment Storybook URL
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: storybook-preview
          number: ${{ github.event.pull_request.number }}
          message: |
            ## 📖 Storybook

            | | |
            |---|---|
            | **URL** | [${{ env.STORYBOOK_URL }}](${{ env.STORYBOOK_URL }}) |
            | **Status** | ${{ job.status == 'success' && '✅ Storybook build succeeded' || '❌ Storybook build failed' }} |
            | **Branch** | `${{ github.head_ref }}` |
            | **Commit** | `${{ github.event.pull_request.head.sha }}` |

            > Storybook is deployed to GitHub Pages on merge to `main`. This comment confirms the build status for this PR.
