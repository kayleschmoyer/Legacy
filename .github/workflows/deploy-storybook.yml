name: Deploy Storybook

# =============================================================================
# Storybook Deploy
# =============================================================================
# Builds and deploys Storybook for lib/shared-components to GitHub Pages on
# the external deploy repo (bkrupa/legacy-sports-deploys) under /storybook/.
#
# Triggers:
#   - On every push to main that touches shared-components or storybook config
#   - On every PR that touches shared-components (posts a sticky comment)
#   - Manual dispatch
# =============================================================================

on:
  push:
    branches: [main]
    paths:
      - "lib/shared-components/**"
      - ".github/workflows/deploy-storybook.yml"

  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "lib/shared-components/**"
      - ".github/workflows/deploy-storybook.yml"

  workflow_dispatch:

concurrency:
  group: storybook-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  DEPLOY_REPO: bkrupa/legacy-sports-deploys
  STORYBOOK_URL: https://bkrupa.github.io/legacy-sports-deploys/storybook/

jobs:
  # LS-1652: Restrict self-hosted runners to PR authors with write permission
  check-runner-access:
    name: "Resolve Runner Label"
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 2
    outputs:
      runner-label: ${{ steps.resolve.outputs.runner-label }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions/resolve-runner-label
      - name: "Resolve Runner Label"
        id: resolve
        uses: ./.github/actions/resolve-runner-label
        with:
          runner-label: ${{ vars.CI_RUNNER_LABEL }}

  # LS-1962: Merged build + deploy into a single job to eliminate GitHub
  # artifact upload/download, which was hitting storage quota limits.
  build-and-deploy:
    name: Build & Deploy Storybook
    needs: [check-runner-access]
    runs-on: ${{ needs.check-runner-access.outputs.runner-label }}
    timeout-minutes: 15
    # Serialize pushes to the deploy repo to prevent race conditions when
    # multiple workflows (storybook, PR preview, cleanup) push to gh-pages.
    # PR runs never deploy, so they get a unique group to avoid blocking on
    # unrelated gh-pages pushes.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('deploy-repo-gh-pages-push-pr-{0}', github.run_id) || 'deploy-repo-gh-pages-push' }}
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: false
          include-optional-deps: true

      - name: Build Storybook
        run: pnpm exec nx run shared-components:build-storybook --configuration=ci

      - name: Verify Build Output
        run: |
          if [ ! -f "dist/storybook/index.html" ]; then
            echo "::error::Storybook build failed — dist/storybook/index.html not found"
            exit 1
          fi
          echo "Storybook build output:"
          ls -la dist/storybook/

      # ── Sticky PR Comment (only on pull requests) ─────────────────────────
      - name: Comment Storybook URL
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: storybook-preview
          number: ${{ github.event.pull_request.number }}
          message: |
            ## 📖 Storybook

            | | |
            |---|---|
            | **URL** | [${{ env.STORYBOOK_URL }}](${{ env.STORYBOOK_URL }}) |
            | **Status** | ${{ job.status == 'success' && '✅ Storybook build succeeded' || '❌ Storybook build failed' }} |
            | **Branch** | `${{ github.head_ref }}` |
            | **Commit** | `${{ github.event.pull_request.head.sha }}` |

            > Storybook is deployed to GitHub Pages on merge to `main`. This comment confirms the build status for this PR.
