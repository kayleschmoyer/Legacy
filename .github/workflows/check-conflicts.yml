name: "Check Merge Conflicts"

# Lightweight check that fails if the PR branch has merge conflicts with the
# base branch. Performs a local `git merge --no-commit --no-ff` against the
# base branch — deterministic and finishes in seconds, with no dependency on
# GitHub's lazy mergeability API (which used to leave PRs with a stuck
# "Mergeability could not be determined" failure — LS-4479).
#
# The "No Merge Conflicts" job name is registered as a required status check
# in .github/ruleset.json. Apply changes with scripts/apply-ruleset.sh.

on:
  pull_request:
    # Include 'edited' to re-run when the PR base branch is retargeted.
    # 'ready_for_review' omitted: synchronize already fires on every commit
    # (even while draft), so the result is always current when a PR goes live.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to check (dispatched by check-conflicts-sweep.yml when a PR's recorded check-run state goes stale after main advances)"
        required: true
        type: number

concurrency:
  group: check-conflicts-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # LS-1652: Restrict self-hosted runners to PR authors with write permission
  check-runner-access:
    name: "Resolve Runner Label"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner-label: ${{ steps.resolve.outputs.runner-label }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          sparse-checkout: .github/actions/resolve-runner-label
      - name: Generate App Token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: 3158619
          private-key: ${{ secrets.AGENT_AUTHOR_APP_PRIVATE_KEY }}
      - name: Resolve Runner Label
        id: resolve
        uses: ./.github/actions/resolve-runner-label
        with:
          runner-label: ${{ vars.CI_RUNNER_LABEL }}
          github-token: ${{ steps.app-token.outputs.token || github.token }}

  sha-sanity:
    name: "🔐 SHA Sanity Check"
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verify head SHA still matches event SHA
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eo pipefail
          EVENT_SHA="${{ github.event.pull_request.head.sha }}"
          if [ -z "$EVENT_SHA" ] || [ "$EVENT_SHA" = "$GITHUB_SHA" ]; then
            echo "SHA matches; proceeding"
            exit 0
          fi
          PR_NUM="${{ github.event.pull_request.number }}"
          if [ -n "$PR_NUM" ]; then
            if CURRENT_SHA=$(gh pr view "$PR_NUM" --json headRefOid -q .headRefOid 2>/dev/null); then
              if [ "$CURRENT_SHA" != "$EVENT_SHA" ]; then
                echo "SHA changed since event fired (event=$EVENT_SHA, current=$CURRENT_SHA). Exiting cleanly; new run will pick up."
                exit 0
              fi
            else
              echo "::warning::Could not fetch current SHA for PR #$PR_NUM; proceeding with run"
            fi
          fi
          echo "SHA still current; proceeding"

  check-conflicts:
    name: "No Merge Conflicts"
    needs: [sha-sanity, check-runner-access]
    runs-on: ${{ needs.check-runner-access.outputs.runner-label }}
    timeout-minutes: 5
    outputs:
      mergeable: ${{ steps.test-merge.outputs.mergeable }}
    steps:
      # Authenticate API calls with the Agent Author app rather than the default
      # GITHUB_TOKEN. GITHUB_TOKEN shares a single ~1,000 req/hr installation
      # rate-limit bucket across every workflow in the repo, so a busy repo can
      # leave this job 403ing on its first API call ("API rate limit exceeded
      # for installation" — LS-8277). The app installation has its own separate
      # bucket. Pull requests (rw) covers pulls.get + PR labels + PR comments.
      # continue-on-error + the github.token fallback below keep fork PRs working
      # (secrets are unavailable to workflows triggered by forks).
      - name: Generate App Token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: 3158619
          private-key: ${{ secrets.AGENT_AUTHOR_APP_PRIVATE_KEY }}
      - name: Resolve PR info
        id: pr-info
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            let prNumber, baseSha, headSha;
            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
              baseSha  = context.payload.pull_request.base.sha;
              headSha  = context.payload.pull_request.head.sha;
            } else {
              prNumber = Number('${{ inputs.pr_number }}');
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              // Do NOT use pr.base.sha here. The pulls API freezes base.sha at
              // the PR's last synchronize (head push), so on a long-open PR it
              // lags the live base-branch tip by many commits (observed 117
              // behind). check-conflicts-sweep.yml dispatches this workflow
              // precisely BECAUSE the base advanced and may now conflict —
              // test-merging against the stale pr.base.sha merges against an old
              // main, finds no conflict, and stamps a false-green on the
              // required check while also clearing the CI: Conflicts label. Pull
              // the current base-branch tip instead so the dispatched re-check
              // matches the sweep's own test-merge (which uses live main).
              const { data: baseBranch } = await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: pr.base.ref,
              });
              baseSha = baseBranch.commit.sha;
              headSha = pr.head.sha;
            }
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('base_sha', baseSha);
            core.setOutput('head_sha', headSha);

      - name: Checkout base branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ steps.pr-info.outputs.base_sha }}
          # Need history back to the merge base. fetch-depth: 0 is the safe
          # default; the runner's network/disk handle it fine for this repo.
          fetch-depth: 0
          # Keep credentials so the subsequent `git fetch refs/pull/N/head`
          # can authenticate (default is true; explicit for clarity).
          persist-credentials: true

      - name: Fetch PR head
        env:
          PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr-info.outputs.head_sha }}
        run: |
          set -eo pipefail
          # Use refs/pull/N/head so this works for both same-repo and fork PRs.
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr/${PR_NUMBER}"
          # Sanity check: the fetched tip should match the event head SHA.
          FETCHED_SHA=$(git rev-parse "refs/remotes/origin/pr/${PR_NUMBER}")
          if [ "$FETCHED_SHA" != "$HEAD_SHA" ]; then
            echo "::warning::Fetched head ($FETCHED_SHA) differs from event head ($HEAD_SHA); a newer push will trigger a fresh run."
          fi

      - name: Test merge
        id: test-merge
        env:
          PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
          BASE_SHA: ${{ steps.pr-info.outputs.base_sha }}
        run: |
          set -eo pipefail
          # Non-interactive identity required for `git merge --no-commit --no-ff`.
          git config user.email "ci@noreply.github.com"
          git config user.name  "check-conflicts"
          HEAD_REF="refs/remotes/origin/pr/${PR_NUMBER}"
          HEAD_SHA=$(git rev-parse "$HEAD_REF")
          echo "Attempting test-merge of $HEAD_SHA into $BASE_SHA"
          if git merge --no-commit --no-ff "$HEAD_REF"; then
            echo "mergeable=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No merge conflicts detected."
          else
            echo "mergeable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Merge conflicts detected."
          fi
          # Always abort to leave the workspace clean (no-op if merge succeeded
          # cleanly without --no-commit recording, but harmless).
          git merge --abort 2>/dev/null || git reset --hard HEAD

      - name: Sync conflict label and set status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          MERGEABLE: ${{ steps.test-merge.outputs.mergeable }}
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber = Number('${{ steps.pr-info.outputs.pr_number }}');
            const mergeable = process.env.MERGEABLE === 'true';

            const label = 'CI: Conflicts';
            // Hidden marker that uniquely identifies the sticky conflict comment.
            // Comment idempotency keys off THIS marker, never the label — the
            // label is a multi-writer flag (this workflow, the base-push sweep,
            // ci-pipeline's replace-all-labels PUT, and agents) so its
            // absent->present edge is unreliable as a "comment once" signal and
            // caused both duplicate comments and silently-dropped ones (LS-8229).
            const MARKER = '<!-- conflict-notice -->';
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const hasLabel = pr.labels.some(l => l.name === label);

            async function withRetry(fn, retries = 3) {
              for (let i = 0; i < retries; i++) {
                try { return await fn(); }
                catch (e) {
                  const rateLimited =
                    e.status === 429 ||
                    (e.status === 403 && /secondary rate limit/i.test(e.message ?? ''));
                  if (rateLimited && i < retries - 1) {
                    const delay = Math.pow(2, i) * 1000;
                    core.warning(`Rate limited (${e.status}), retrying in ${delay} ms…`);
                    await new Promise(r => setTimeout(r, delay));
                  } else throw e;
                }
              }
            }

            // Locate the existing sticky conflict comment (if any) by marker.
            async function findConflictComment() {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: prNumber, per_page: 100,
              });
              return comments.find(c => (c.body ?? '').includes(MARKER)) ?? null;
            }

            if (!mergeable) {
              // Label add is idempotent; gate only to skip a redundant API call.
              if (!hasLabel) {
                await withRetry(() => github.rest.issues.addLabels({
                  owner, repo, issue_number: prNumber, labels: [label],
                }));
                core.info(`Label added: ${label}`);
              }
              // Sticky comment: create once, then update in place. Keying on the
              // marker (not the label) guarantees exactly one conflict comment
              // regardless of how often the label is toggled. Non-fatal: the
              // step still reports the conflict via core.setFailed below.
              const body =
                `${MARKER}\n` +
                '⚠️ This PR has merge conflicts with the base branch. ' +
                'Rebase or merge the base branch into your branch to resolve them. ' +
                'The `CI: Conflicts` label will be removed automatically once the conflicts are resolved.';
              try {
                const existing = await findConflictComment();
                if (!existing) {
                  await withRetry(() => github.rest.issues.createComment({
                    owner, repo, issue_number: prNumber, body,
                  }));
                  core.info('Conflict comment posted.');
                } else if ((existing.body ?? '') !== body) {
                  await withRetry(() => github.rest.issues.updateComment({
                    owner, repo, comment_id: existing.id, body,
                  }));
                  core.info('Conflict comment updated in place.');
                } else {
                  core.info('Conflict comment already present; nothing to do.');
                }
              } catch (e) {
                core.warning(`Failed to upsert conflict comment on PR #${prNumber}: ${e.message}`);
              }
              core.setFailed(
                'This PR has merge conflicts with the base branch. ' +
                'Rebase or merge the base branch into your branch to resolve them.'
              );
              return;
            }

            // Mergeable — remove stale conflict label if present.
            // Guard against 404: another workflow or manual action may have
            // removed it between the pulls.get and now.
            if (hasLabel) {
              try {
                await withRetry(() => github.rest.issues.removeLabel({
                  owner, repo, issue_number: prNumber, name: label,
                }));
                core.info(`Label removed: ${label}`);
              } catch (e) {
                if (e.status === 404) {
                  core.warning(`Label already absent, skipping removal: ${label}`);
                } else {
                  throw e;
                }
              }
            }
            // Delete the sticky conflict comment now that the PR is mergeable.
            try {
              const existing = await findConflictComment();
              if (existing) {
                await withRetry(() => github.rest.issues.deleteComment({
                  owner, repo, comment_id: existing.id,
                }));
                core.info('Stale conflict comment removed.');
              }
            } catch (e) {
              core.warning(`Failed to remove conflict comment on PR #${prNumber}: ${e.message}`);
            }
            core.info('No merge conflicts detected.');
