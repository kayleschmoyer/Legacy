name: Reviewer (W1)

# Posts a real GitHub PR review as the Code Reviewer Bot installation.
# critical/high findings → REQUEST_CHANGES (blocks merge); clean → APPROVE.
# Fires on opened/ready_for_review; on labeled for specific labels (G10);
# on labeled for review-bot-override (auto-approve — skips LLM review);
# and on synchronize when bot:ready-for-review is present so agents don't
# need to re-apply the label after each push to trigger a new cycle.
#
# review-bot-override is sticky STATE, not a one-shot event (LS-9575): while
# the label is present on the PR, every synchronize and every
# labeled:bot:ready-for-review event also passes the gate in auto-approve
# mode, so a push after the override still gets a terminal bot-review status
# instead of stranding the head SHA with none. Before this fix, the gate's
# auto-approve branch matched only the exact label-add event, while every
# other trigger was independently skipped by a `!contains(review-bot-override)`
# guard — once the label was present, that guard made every subsequent
# trigger a no-op forever.
#
# Queued-PR coverage (LS-8289/LS-8297): merge-when-ready deliberately does
# NOT trigger this workflow. When a queued PR's head SHA is missing its
# bot-review status (the deadlock that froze 30+ PRs on 2026-07-01), the
# merge-queue processor's self-heal re-applies bot:ready-for-review, and
# that label — the only review trigger — fires this workflow through its
# normal path. Labels stay single-purpose: bot:ready-for-review = review,
# merge-when-ready = merge. Since LS-9209 the same self-heal also sweeps
# non-queued PRs carrying bot:ready-for-review, cycling (remove + re-add)
# the label when it is already present so a fresh labeled event fires.
#
# Stacked PRs (LS-8489): on APPROVE the reviewer applies only
# merge-when-ready, regardless of base branch. Stacked PRs merge base-first —
# the child waits for its parent to land, then the merge queue's
# retargetDependentPRs re-targets it to main and it proceeds through the
# normal queue path. merge-to-parent is a manual escape hatch (merge a child
# into its parent branch ahead of the parent landing) and is never applied by
# automation.
#
# Crash visibility (LS-8299): "Run reviewer" keeps continue-on-error so a
# crashed run doesn't itself fail the job — but the always() step that
# follows it enforces the invariant that every run leaves a terminal
# (success/failure) bot-review status. If the reviewer step failed AND left
# bot-review missing or pending, that step fails the job visibly. Known/handled
# failure modes (e.g. the rate-limit path, which already sets bot-review to a
# terminal failure) are unaffected and stay exactly as visible as before.
#
# Early pending footprint (LS-9209): the LS-8299 guard lives inside the review
# job, so it cannot fire when the run dies BEFORE that job executes — runner
# cancellation, a check-runner-access failure, or a review job queued forever
# on a starved self-hosted label all left the head SHA with NO bot-review
# status at all, permanently blocking the PR (four PRs stalled 2026-08-06..09).
# The check-runner-access job therefore posts `bot-review: pending` as its
# first act (ubuntu-latest, seconds after the run starts, before checkout or
# runner resolution) whenever the review job would run. Every death mode then
# leaves a detectable stale-pending footprint instead of nothing, and the
# merge-queue processor's review-stall sweep (merge-queue-processor.js,
# remediateStaleBotReview) heals it on its next wake. The gate condition is
# computed ONCE in the check-runner-access "Evaluate review gate" step and
# consumed by both the footprint steps and the review job's `if`, so the two
# can never drift.

on:
  pull_request:
    types: [opened, ready_for_review, labeled, synchronize]

permissions:
  contents: read
  id-token: write # required for OIDC auth to AWS (S3 reviewer telemetry)

concurrency:
  group: >-
    reviewer-${{ github.event.pull_request.number }}-${{
      (github.event.action == 'labeled' &&
       github.event.label.name != 'bot:ready-for-review' &&
       github.event.label.name != 'review-bot-degraded' &&
       github.event.label.name != 'bot:reset-cycle-counter' &&
       github.event.label.name != 'review-bot-override') && 'noop' || 'active' }}
  cancel-in-progress: true

jobs:
  # LS-1652: Restrict self-hosted runners to PR authors with write permission
  check-runner-access:
    name: "Resolve Runner Label"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner-label: ${{ steps.resolve.outputs.runner-label }}
      should-review: ${{ steps.gate.outputs.should-review }}
    steps:
      # Single source of truth for "would the review job run for this event?".
      # Skip drafts, fork PRs, labeled events for irrelevant labels, and
      # synchronize events when neither bot:ready-for-review nor
      # review-bot-override is present.
      # review-bot-override is treated as STICKY STATE (LS-9575): once it is
      # present on the PR (checked via the state array, not the triggering
      # event), every synchronize and every labeled:bot:ready-for-review event
      # also passes the gate — not just the original labeled:review-bot-override
      # event — so REVIEWER_AUTO_APPROVE below can run in auto-approve mode on
      # every subsequent trigger instead of leaving new head SHAs with no
      # bot-review status. Consumed by the review job's `if` AND the
      # pending-footprint steps below so the conditions can never drift (LS-9209).
      - name: Evaluate review gate
        id: gate
        env:
          SHOULD_REVIEW: >-
            ${{ github.event.pull_request.draft == false &&
                github.event.pull_request.head.repo.full_name == github.repository &&
                (github.event.action != 'labeled' && github.event.action != 'synchronize' ||
                 github.event.label.name == 'review-bot-override' ||
                 github.event.label.name == 'bot:ready-for-review' ||
                 github.event.label.name == 'review-bot-degraded' ||
                 github.event.label.name == 'bot:reset-cycle-counter' ||
                 github.event.action == 'synchronize' &&
                   (contains(github.event.pull_request.labels.*.name, 'bot:ready-for-review') ||
                    contains(github.event.pull_request.labels.*.name, 'review-bot-override'))) }}
        run: |
          echo "should-review=${SHOULD_REVIEW}" >> "$GITHUB_OUTPUT"
          echo "Review gate: should-review=${SHOULD_REVIEW}"
      # Post `bot-review: pending` before checkout/runner resolution so any
      # death of this run past this point leaves a stale-pending footprint the
      # merge-queue processor's review-stall sweep can detect and heal, instead
      # of no status at all (LS-9209). Best-effort: continue-on-error on both
      # steps — a footprint failure must never block the review path itself.
      - name: Generate reviewer app token for pending footprint
        id: pending-token
        if: steps.gate.outputs.should-review == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.REVIEWER_BOT_APP_ID || '3142924' }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - name: Post bot-review pending footprint
        if: steps.gate.outputs.should-review == 'true' && steps.pending-token.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.pending-token.outputs.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f context=bot-review \
            -f "description=Review cycle starting — awaiting Reviewer (W1)"
          echo "Posted bot-review=pending footprint for ${HEAD_SHA}"
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          sparse-checkout: .github/actions/resolve-runner-label
      - name: Generate App Token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: 3158619
          private-key: ${{ secrets.AGENT_AUTHOR_APP_PRIVATE_KEY }}
      - name: Resolve Runner Label
        id: resolve
        uses: ./.github/actions/resolve-runner-label
        with:
          runner-label: ${{ vars.CI_RUNNER_LABEL }}
          github-token: ${{ steps.app-token.outputs.token || github.token }}

  review:
    # Gate condition lives in check-runner-access's "Evaluate review gate"
    # step (single source of truth shared with the pending-footprint steps —
    # LS-9209); see the comment there for the skip semantics.
    needs: [check-runner-access]
    if: needs.check-runner-access.outputs.should-review == 'true'
    runs-on: ${{ needs.check-runner-access.outputs.runner-label }}
    # Rate-limit wait budget (LS-9983): the reviewer now waits out a per-minute
    # throttle in-job (bot-review stays `pending` — "Queued behind reviewer
    # rate limit") instead of failing and handing the retry to the PR author,
    # whose label re-apply spent quota the rest of a saturated queue was
    # already waiting on. REVIEWER_RETRY_BUDGET_MS below caps that waiting;
    # this timeout must stay comfortably above it so a run that spends the
    # whole budget still has time to post its review, labels and a terminal
    # bot-review status. A run killed by this timeout writes no terminal
    # status at all and strands the PR on a stale-pending footprint
    # (LS-8299 / LS-9209) — the failure mode the budget exists to avoid.
    timeout-minutes: 30
    steps:
      # Minted FIRST, before checkout, so the dead-letter step at the end of
      # this job still has working credentials when the job is cancelled
      # (LS-10122). It previously sat after checkout, which is exactly where
      # the observed cancellation landed — so the terminal-status guard ran
      # with an EMPTY GH_TOKEN and its status read silently returned nothing.
      # An installation token is valid for an hour, comfortably longer than
      # this job's 30m timeout.
      - name: Generate reviewer app token
        id: reviewer-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.REVIEWER_BOT_APP_ID || '3142924' }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - name: Configure AWS credentials
        continue-on-error: true # telemetry is best-effort; don't block review on auth failure
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_CI_ARTIFACTS_ROLE_ARN || 'arn:aws:iam::176661590736:role/legacy-sports-dev-ci-artifacts' }}
          aws-region: us-east-1
      - name: Run reviewer
        id: run-reviewer
        continue-on-error: true
        env:
          GEMINI_CODE_REVIEW_API_KEY: ${{ secrets.GEMINI_CODE_REVIEW_API_KEY }}
          GH_TOKEN: ${{ steps.reviewer-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LLM_PROVIDER: gemini
          REVIEWER_MODEL: gemini-2.5-flash
          REVIEWER_FALLBACK_MODEL: ${{ vars.REVIEWER_FALLBACK_MODEL || 'gemini-2.5-flash-lite' }}
          # Wall-clock budget for waiting out provider throttles, measured from
          # process start. Must stay well under the job's timeout-minutes above
          # (see the comment there). Default in index.mjs is the same 20m.
          REVIEWER_RETRY_BUDGET_MS: ${{ vars.REVIEWER_RETRY_BUDGET_MS || '1200000' }}
          REVIEWER_BOT_APP_ID: ${{ vars.REVIEWER_BOT_APP_ID || '3142924' }}
          REVIEWER_BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          REVIEWER_TELEMETRY_BUCKET: ${{ vars.REVIEWER_TELEMETRY_BUCKET || 'legacy-sports-dev-reviewer-telemetry' }}
          # State-based (LS-9575), not event-based: true whenever review-bot-override
          # is present on the PR, regardless of which trigger let this run through
          # the gate above — so a push after the override is applied still
          # auto-approves instead of running (or skipping) a normal LLM review.
          # The gate above is the only thing that can let a run reach this step
          # when the label is NOT present, so this never widens auto-approve to
          # PRs without the override.
          REVIEWER_AUTO_APPROVE: ${{ contains(github.event.pull_request.labels.*.name, 'review-bot-override') && 'true' || '' }}
          CYCLE_RESET_SENDER: ${{ github.event.action == 'labeled' && github.event.label.name == 'bot:reset-cycle-counter' && github.event.sender.login || '' }}
          TRIGGERED_BY_SYNCHRONIZE: ${{ github.event.action == 'synchronize' && 'true' || '' }}
          # LS-9756: lets the LS-4857 post-arbitration auto-reset also fire on
          # the bot:ready-for-review labeled event (the self-heal trick used
          # when a push's own synchronize-triggered review job was skipped).
          # See the LS-9756 comment on the auto-reset block in index.mjs.
          TRIGGERED_BY_READY_LABEL: ${{ github.event.action == 'labeled' && github.event.label.name == 'bot:ready-for-review' && 'true' || '' }}
        run: |
          if [ -f .github/scripts/reviewer/index.mjs ]; then
            node .github/scripts/reviewer/index.mjs
          else
            echo "Skipping reviewer: .github/scripts/reviewer/index.mjs not found."
          fi
      # Dead-letter for a review cycle that never adjudicated this SHA
      # (LS-10122). LS-8299 made a *crashed* reviewer fail visibly, but its
      # condition is `run-reviewer.outcome == 'failure'` — and a CANCELLED job
      # never runs that step at all, so its outcome is `skipped` and the guard
      # reported "invariant holds" while bot-review was left sitting on the
      # LS-9209 pending footprint. Observed on PR #7961: the review job was
      # cancelled 7s after it started on the runner, this step passed, and
      # bot-review stayed pending "Review cycle starting — awaiting Reviewer
      # (W1)" for 45 minutes as the PR's sole merge blocker. Nothing recovers
      # that on its own: merge-queue-processor.js's remediateStaleBotReview is
      # the designed healer, but merge-queue.yml has no schedule trigger by
      # design (LS-8289), so on a quiet repo nothing ever wakes it and the
      # stall is unbounded rather than the ~45min that was observed.
      #
      # So: whenever this run ends without a terminal bot-review status on the
      # SHA it was dispatched for, write one. A loud failure is recoverable by
      # every path that already exists (the author agent's label cycle, the
      # merge queue, human arbitration); a silent pending is recoverable by
      # none of them.
      #
      # Two stand-down conditions keep this from stealing a live cycle:
      #   1. Another Reviewer (W1) run is still in flight for this same SHA —
      #      i.e. this run was cancelled by a newer run in the same
      #      `reviewer-<pr>-active` concurrency group. The successor owns the
      #      status; posting a failure here would clobber a working cycle.
      #   2. The PR head has moved past this SHA — the status no longer gates
      #      anything, so failing it is pure noise.
      # Anything that prevents us from confirming those (no token, an API
      # error) also stands down: a missed dead-letter is the pre-existing
      # behaviour, but a wrong one breaks a healthy review.
      - name: Ensure a terminal bot-review status
        if: always()
        env:
          GH_TOKEN: ${{ steps.reviewer-token.outputs.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          REVIEWER_OUTCOME: ${{ steps.run-reviewer.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -uo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::No app token available - cannot verify or repair bot-review on ${SHA}"
            exit 0
          fi

          state=$(gh api "repos/${REPO}/commits/${SHA}/status" \
            --jq '[.statuses[]? | select(.context=="bot-review")] | sort_by(.created_at) | last | .state // empty' 2>/dev/null)
          echo "bot-review=${state:-<none>}, run-reviewer outcome=${REVIEWER_OUTCOME:-<none>}, job status=${JOB_STATUS}"

          case "${state}" in
            success | failure | error)
              echo "Terminal bot-review status already present - invariant holds."
              exit 0
              ;;
          esac

          # Stand-down 1: a successor run owns this SHA.
          in_flight=$(gh api \
            "repos/${REPO}/actions/workflows/review.yml/runs?head_sha=${SHA}&per_page=100" \
            --jq "[.workflow_runs[]? | select(.id != ${RUN_ID}) | select(.status != \"completed\")] | length" 2>/dev/null)
          if [ -z "${in_flight}" ]; then
            echo "::warning::Could not list Reviewer runs for ${SHA} - standing down (a successor may be in flight)"
            exit 0
          fi
          if [ "${in_flight}" -gt 0 ]; then
            echo "${in_flight} Reviewer (W1) run(s) still in flight for ${SHA} - they own the status; standing down."
            exit 0
          fi

          # Stand-down 2: the PR has moved on from this SHA.
          head_now=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.sha' 2>/dev/null)
          if [ -n "${head_now}" ] && [ "${head_now}" != "${SHA}" ]; then
            echo "PR head is now ${head_now} - ${SHA} is superseded; standing down."
            exit 0
          fi

          echo "::warning::Reviewer (W1) run ${RUN_ID} ended as '${JOB_STATUS}' leaving bot-review='${state:-<none>}' on ${SHA} - posting a terminal failure (LS-10122)"
          gh api -X POST "repos/${REPO}/statuses/${SHA}" \
            -f state=failure \
            -f context=bot-review \
            -f "description=Reviewer (W1) ended as ${JOB_STATUS} without reviewing - re-cycle bot:ready-for-review (LS-10122)" \
            -f "target_url=https://github.com/${REPO}/actions/runs/${RUN_ID}" > /dev/null

          # Preserve the LS-8299 signal: a reviewer that ran and crashed still
          # fails the job visibly, on top of the terminal status just posted.
          if [ "${REVIEWER_OUTCOME}" = "failure" ]; then
            echo "::error::Reviewer crashed on ${SHA} and left bot-review as '${state:-<none>}' instead of a terminal status (LS-8299 invariant broken)"
            exit 1
          fi
