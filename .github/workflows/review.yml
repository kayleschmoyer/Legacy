name: Reviewer (W1)

# Posts a real GitHub PR review as the Code Reviewer Bot installation.
# critical/high findings → REQUEST_CHANGES (blocks merge); clean → APPROVE.
# Triggers on all non-draft PR events; T24 will tighten this (drop
# synchronize, gate re-review on bot:ready-for-review label) per G10.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write # required for OIDC auth to AWS (S3 reviewer telemetry)

concurrency:
  group: reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts and fork PRs — forks must not mint the OIDC token or assume the CI role.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - name: Install Copilot CLI
        run: |
          npm install -g @github/copilot
          copilot --version
      - name: Configure AWS credentials
        continue-on-error: true # telemetry is best-effort; don't block review on auth failure
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6
        with:
          role-to-assume: ${{ vars.AWS_CI_ARTIFACTS_ROLE_ARN || 'arn:aws:iam::176661590736:role/legacy-sports-dev-ci-artifacts' }}
          aws-region: us-east-1
      - name: Run reviewer
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_SERVICE_ACCOUNT_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LLM_PROVIDER: copilot-cli
          REVIEWER_MODEL: codex
          REVIEWER_BOT_APP_ID: ${{ vars.REVIEWER_BOT_APP_ID }}
          REVIEWER_BOT_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_BOT_APP_PRIVATE_KEY }}
          REVIEWER_TELEMETRY_BUCKET: ${{ vars.REVIEWER_TELEMETRY_BUCKET || 'legacy-sports-dev-reviewer-telemetry' }}
        run: |
          if [ -f .github/scripts/reviewer/index.mjs ]; then
            node .github/scripts/reviewer/index.mjs
          else
            echo "Skipping reviewer: .github/scripts/reviewer/index.mjs not found."
          fi
