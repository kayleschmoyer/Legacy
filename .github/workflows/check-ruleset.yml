# check-ruleset.yml — Drift detection for branch protection rulesets.
# Compares the live ruleset on GitHub against the checked-in JSON config.
# Posts a warning annotation if they diverge.
#
# Runs weekly (Monday 09:00 UTC) as a backstop, on push when ruleset.json
# changes, and on demand via workflow_dispatch.
# Note: repository_ruleset is not a valid GitHub Actions trigger event.
# This workflow still checks checked-in config changes and eventual live drift,
# but live GitHub UI edits are only detected on the weekly schedule or manual runs.

name: Check Ruleset Drift

on:
  push:
    # Catch drift when the checked-in config changes (e.g. a PR updates
    # .github/ruleset.json) even if no live ruleset event was emitted.
    paths:
      - .github/ruleset.json
  schedule:
    # Weekly backstop to catch drift from live ruleset edits via GitHub UI.
    - cron: "0 9 * * 1"
  workflow_dispatch:

# UI edits can emit multiple `edited` events in quick succession; cancel
# any in-progress run so only the latest ruleset state is checked.
concurrency:
  group: check-ruleset-drift
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-drift:
    name: "Ruleset Drift Detection"
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Fetch live ruleset from GitHub
        id: fetch
        env:
          # RULESET_ADMIN_TOKEN has write access for apply-ruleset.sh; fall back to
          # the default token (read-only) for drift detection when it is not set.
          GH_TOKEN: ${{ secrets.RULESET_ADMIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          RULESET_NAME: main-branch-protection
        run: |
          echo "==> Fetching rulesets for $REPO..."
          live_json=$(gh api "repos/$REPO/rulesets" --jq ".[] | select(.name == \"$RULESET_NAME\")")

          if [[ -z "$live_json" ]]; then
            echo "::warning::Ruleset '$RULESET_NAME' not found on GitHub. Run scripts/apply-ruleset.sh to create it."
            echo "drift=missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Normalize: keep only the fields we track (drop id, node_id, created_at, etc.)
          echo "$live_json" | jq '{
            name, target, enforcement, conditions, rules,
            bypass_actors: [.bypass_actors[]? | {actor_id, actor_type, bypass_mode}]
          }' > /tmp/live-ruleset.json

          echo "drift=fetched" >> "$GITHUB_OUTPUT"

      - name: Compare with checked-in config
        if: steps.fetch.outputs.drift == 'fetched'
        env:
          RULESET_FILE: .github/ruleset.json
        run: |
          # Strip _comment keys and null integration_id from the local config for comparison
          jq 'walk(if type == "object" then del(._comment) else . end)
            | del(."$schema")
            | .rules |= map(
                if .type == "required_status_checks"
                then .parameters.required_status_checks |= map(del(.integration_id))
                else .
                end
              )' "$RULESET_FILE" > /tmp/local-ruleset.json

          # Normalize the live ruleset the same way
          jq '.rules |= map(
                if .type == "required_status_checks"
                then .parameters.required_status_checks |= map(del(.integration_id))
                else .
                end
              )' /tmp/live-ruleset.json > /tmp/live-ruleset-normalized.json

          if diff <(jq -S . /tmp/local-ruleset.json) <(jq -S . /tmp/live-ruleset-normalized.json) > /tmp/ruleset-diff.txt 2>&1; then
            echo "==> Ruleset is in sync."
          else
            echo "::warning::Ruleset drift detected! The live ruleset on GitHub differs from .github/ruleset.json."
            echo "==> Differences:"
            cat /tmp/ruleset-diff.txt
            echo ""
            echo "Run 'scripts/apply-ruleset.sh' to reconcile."
            exit 1
          fi
