# check-ruleset.yml — Drift detection for branch protection rulesets.
# Compares the live ruleset on GitHub against the checked-in JSON config.
# Posts a warning annotation if they diverge.
#
# Runs on pull_request when ruleset.json changes, and on demand via
# workflow_dispatch. Note: repository_ruleset is not a valid GitHub Actions
# trigger event; live GitHub UI edits are only detected via workflow_dispatch.

name: Check Ruleset Drift

on:
  pull_request:
    # Catch drift when the checked-in config changes in a PR.
    paths:
      - .github/ruleset.json
  workflow_dispatch:

# Multiple pushes to the same PR can fire in quick succession; cancel
# any in-progress run so only the latest state is checked.
concurrency:
  group: check-ruleset-drift
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-drift:
    name: "Ruleset Drift Detection"
    # LS-3884: gh API call + jq comparison — no monorepo tooling needed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Fetch live ruleset from GitHub
        id: fetch
        env:
          # RULESET_ADMIN_TOKEN has write access for apply-ruleset.sh; fall back to
          # the default token (read-only) for drift detection when it is not set.
          GH_TOKEN: ${{ secrets.RULESET_ADMIN_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          RULESET_NAME: Protect Main
        run: |
          echo "==> Fetching rulesets for $REPO..."
          # The list endpoint omits the rules array; extract the ID here and call the
          # individual endpoint below to get the full ruleset including rules.
          ruleset_id=$(gh api "repos/$REPO/rulesets" --jq ".[] | select(.name == \"$RULESET_NAME\") | .id")

          if [[ -z "$ruleset_id" ]]; then
            echo "::warning::Ruleset '$RULESET_NAME' not found on GitHub. Run scripts/apply-ruleset.sh to create it."
            echo "drift=missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "==> Found ruleset '$RULESET_NAME' (id: $ruleset_id), fetching full details..."
          # Normalize: keep only the fields we track (drop id, node_id, created_at, etc.).
          # bypass_actors is intentionally excluded: the API returns an empty array when the
          # caller lacks admin scope (github.token in PR context), producing false-positive
          # drift. bypass_actors require RULESET_ADMIN_TOKEN to read reliably; they are
          # managed by apply-ruleset.sh and not tracked here.
          gh api "repos/$REPO/rulesets/$ruleset_id" | jq '{
            name, target, enforcement, conditions, rules
          }' > /tmp/live-ruleset.json

          echo "drift=fetched" >> "$GITHUB_OUTPUT"

      - name: Compare with checked-in config
        if: steps.fetch.outputs.drift == 'fetched'
        env:
          RULESET_FILE: .github/ruleset.json
        run: |
          # Collect rule types that appear ONLY in staged rules (not in any active rule).
          # Types with both a staged and an active entry are managed by the config and
          # must not be stripped from the live side — stripping them would produce a
          # false-positive drift alert against the active rule that was applied.
          # Fall back to '[]' so the later --arg staged_str + fromjson path never sees an empty string.
          staged_types=$(jq -c '
            (.rules // []) as $rules |
            ([$rules[] | select(._staged == true) | .type] | unique) as $staged |
            ([$rules[] | select(._staged != true) | .type] | unique) as $active |
            ($staged - $active)
          ' "$RULESET_FILE" 2>/dev/null || echo '[]')

          # Normalise local config: strip staged rules, metadata keys, integration_id, and
          # do_not_enforce_on_create (GitHub auto-adds this with a false default when a
          # required_status_checks rule is created; we don't track it in the config).
          # Use a single .rules |= (...) to avoid chained-|= precedence ambiguity.
          jq '
            .rules |= map(select(._staged != true))
            | walk(if type == "object" then del(._comment) | del(._staged) | del(._commitStatus) | del(._calledWorkflow) else . end)
            | del(."$schema")
            | del(.bypass_actors)
            | .rules |= (
                map(
                  if .type == "required_status_checks"
                  then
                    .parameters |= del(.do_not_enforce_on_create) |
                    .parameters.required_status_checks |= (map(del(.integration_id)) | sort_by(.context))
                  else .
                  end
                )
                | sort_by(.type)
              )' "$RULESET_FILE" > /tmp/local-ruleset.json

          # Normalise live ruleset the same way: strip staged rule types, integration_id,
          # and do_not_enforce_on_create.
          # Use --arg (string) + fromjson // [] so a null-producing jq expression never
          # causes --argjson to inject JSON null — which would make ($staged | map(…)) fail
          # with "Cannot iterate over null".
          # Use a single .rules |= (...) to avoid chained-|= precedence ambiguity.
          # sort_by(.type) makes comparison order-independent (GitHub may return rules in
          # a different order than the config defines them).
          jq --arg staged_str "$staged_types" '
            (($staged_str | fromjson) // []) as $staged |
            .rules |= (
              map(select(.type as $t | ($staged | map(. == $t) | any) | not))
              | map(
                  if .type == "required_status_checks"
                  then
                    .parameters |= del(.do_not_enforce_on_create) |
                    .parameters.required_status_checks |= (map(del(.integration_id)) | sort_by(.context))
                  else .
                  end
                )
              | sort_by(.type)
            )' /tmp/live-ruleset.json > /tmp/live-ruleset-normalized.json

          if diff <(jq -S . /tmp/local-ruleset.json) <(jq -S . /tmp/live-ruleset-normalized.json) > /tmp/ruleset-diff.txt 2>&1; then
            echo "==> Ruleset is in sync."
          else
            echo "::warning::Ruleset drift detected! The live ruleset on GitHub differs from .github/ruleset.json."
            echo "==> Differences:"
            cat /tmp/ruleset-diff.txt
            echo ""
            echo "Run 'scripts/apply-ruleset.sh' to reconcile."
            exit 1
          fi
