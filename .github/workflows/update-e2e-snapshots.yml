# =============================================================================
# Update E2E Snapshots
# =============================================================================
# Runs Playwright with --update-snapshots on the current branch and commits the
# regenerated screenshot/HTML snapshot files back to the PR branch.
#
# Trigger options:
#   1. Manual:  Actions → "Update E2E Snapshots" → Run workflow → pick branch
#   2. Label:   Add the "update-snapshots" label to a PR
# =============================================================================

name: "Update E2E Snapshots"

on:
  workflow_dispatch:
    inputs:
      test-patterns:
        description: "Playwright grep pattern (leave empty for all snapshot tests)"
        required: false
        default: ""
      browser:
        description: "Browser to generate snapshots for"
        required: false
        default: "chromium"
        type: choice
        options:
          - chromium
          - firefox
          - webkit
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-snapshots:
    name: "Update Playwright Snapshots"
    # For label trigger, only run when the specific label is added
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'update-snapshots')
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v6
        with:
          # For PRs, check out the head branch so we can push back to it
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
          # Use the default GITHUB_TOKEN — it has contents:write from permissions above
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Setup Workspace"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: false
          include-optional-deps: false

      - name: "Install Playwright Browsers"
        shell: bash
        run: pnpm exec playwright install ${{ inputs.browser || 'chromium' }} --with-deps

      - name: "Start Dev Server"
        shell: bash
        run: |
          export NX_NO_CLOUD=true

          pnpm exec nx serve web --port=4200 --host=localhost &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

          echo "⏳ Waiting for dev server on http://localhost:4200 ..."
          for i in {1..90}; do
            if curl -sf http://localhost:4200 >/dev/null 2>&1; then
              echo "✅ Dev server ready"
              break
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "❌ Dev server crashed"
              exit 1
            fi
            sleep 1
          done

          if ! curl -sf http://localhost:4200 >/dev/null 2>&1; then
            echo "❌ Dev server did not start within 90 seconds"
            exit 1
          fi

      - name: "Update Snapshots"
        shell: bash
        run: |
          cd apps/web-e2e

          BROWSER="${{ inputs.browser || 'chromium' }}"
          PATTERN="${{ inputs.test-patterns }}"

          CMD="pnpm exec playwright test --project=$BROWSER --update-snapshots --retries=0 --reporter=line"
          if [ -n "$PATTERN" ]; then
            CMD="$CMD --grep=\"$PATTERN\""
          fi

          echo "🎭 Running: $CMD"
          # Snapshots are updated even when tests "fail" (mismatches are expected)
          eval "$CMD" || true

      - name: "Stop Dev Server"
        if: always()
        shell: bash
        run: kill $SERVER_PID 2>/dev/null || true

      - name: "Remove Label (if triggered by label)"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'update-snapshots',
            }).catch(() => {});

      - name: "Commit & Push Updated Snapshots"
        shell: bash
        run: |
          # Configure git identity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only snapshot files
          git add --all '**/app.spec.ts-snapshots/**'
          git add --all '**/player-stats.spec.ts-snapshots/**'
          git add --all '**/html-snapshots.spec.ts-snapshots/**'
          git add --all '**/sports-app-snapshots.spec.ts-snapshots/**'
          git add --all '**/visual-snapshots.spec.ts-snapshots/**'
          # Catch-all for any spec snapshot directories
          git add --all '**/*.spec.ts-snapshots/**'

          if git diff --cached --quiet; then
            echo "ℹ️ No snapshot changes to commit"
          else
            CHANGED=$(git diff --cached --stat | tail -1)
            echo "📸 Snapshot changes: $CHANGED"
            BROWSER="${{ inputs.browser || 'chromium' }}"
            git commit -m "test(e2e): update Playwright snapshots" \
              -m "Updated by Update E2E Snapshots workflow." \
              -m "Platform: ubuntu-latest | Browser: $BROWSER"
            git push
            echo "✅ Snapshots committed and pushed"
          fi

      - name: "Summary"
        if: always()
        shell: bash
        run: |
          echo "## 📸 E2E Snapshot Update" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.event.pull_request.head.ref || github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Browser**: ${{ inputs.browser || 'chromium' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: ubuntu-latest (linux)" >> $GITHUB_STEP_SUMMARY

          if git log -1 --pretty=format:"%s" | grep -q "update Playwright snapshots"; then
            echo "- **Result**: ✅ Snapshots updated and committed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Result**: ℹ️ No snapshot changes detected" >> $GITHUB_STEP_SUMMARY
          fi
