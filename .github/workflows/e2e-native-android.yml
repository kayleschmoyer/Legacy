name: E2E Native (Android)

# ADR-0016 §"Native rollout blueprint" step 4 / LS-8450: prove ONE flow
# (login → league list) on a watched Android-emulator job before generalizing
# native coverage. This is the emulator-provisioning piece that finally EXECUTES
# the native scaffold siblings landed — the `AppiumNativeDriver` (LS-8447), the
# `platform: 'native'` fixture seam (LS-8449), and playwright.native.config.ts —
# by wiring the fixture's real wdio session (see apps/web-e2e/src/fixtures/dual.ts)
# to a booted emulator.
#
# Schedule-free per the repo CI policy (LS-8487): no cron — manual dispatch plus
# an automated run after each "Deploy" completes on main, debounced to at most
# one attempt per ANDROID_E2E_MIN_INTERVAL_HOURS (repo var, default 156h ≈
# weekly) — see the `gate` job, which mirrors run-maestro-sweep.yml (LS-8897).
# Manual dispatch always runs. Tradeoff: native Android regressions are caught
# on the gate cadence rather than on every merge to main — the same tradeoff
# already accepted for the sibling Maestro sweep.
#
# Triggers off "Deploy" (not "Build Android App") since LS-8765: Build Android
# App now runs as a workflow_call child of the umbrella Deploy workflow — gated
# behind the graphql Lambda deploy completing, closing the same client-ahead-
# of-server race deploy-web.yml already closed for the web app — and a
# workflow invoked only via workflow_call never independently fires its own
# workflow_run completion event for a listener to key off. The gate below
# reads the "Build Android App" job's own conclusion out of the upstream
# Deploy run (via the API) rather than the run-level conclusion, so an
# unrelated failure in another Deploy child (e.g. Storybook) doesn't
# incorrectly skip this suite, and a Deploy push that didn't target Android at
# all is treated the same as "no build to test".
#
# A run that skips the real jobs does NOT mean the native suite passed. It grows
# a `skipped` job whose name says so outright, because GitHub rolls a run whose
# jobs were all skipped up to "success" and nothing else in the checks UI
# distinguishes "not attempted" from "verified" (LS-9652).
#
# ── Auth strategy (AC3) ───────────────────────────────────────────────
# Real OAuth is not automatable on native (OAuth-only app, LS-6656). The
# `build-bypass-apk` job builds a release APK with EXPO_PUBLIC_BYPASS_AUTH=true —
# test-only session injection (apps/app/src/common/auth/AuthHooks.ts): the app
# cold-launches already authenticated as LOCAL_USER, so THAT injection is the
# "login" step and the flow then proves the league-list surface renders. The
# shipped build-android-app.yml release APK leaves the flag unset; bypass throws
# under NODE_ENV=production so it can never reach a shipped build. Full detail:
# apps/web-e2e/src/driver/native-emulator-ci.md.
on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
    branches: [main]

permissions:
  actions: read # gate job inspects prior runs of this workflow for debouncing
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "22"
  ANDROID_API_LEVEL: "35"
  NDK_VERSION: "27.1.12297006"
  # Device-side port the bypass APK's baked EXPO_PUBLIC_GRAPHQL_HOST points at.
  # The per-worker hermetic mock server is mapped onto it with
  # `adb reverse tcp:<this> tcp:<dynamic host port>` — see
  # NATIVE_GRAPHQL_DEVICE_PORT in apps/web-e2e/src/fixtures/native-mock.ts.
  # Workflow-level env is exported into every step of every job, so this is the
  # ONE place the port is declared: the build job derives the baked host from it
  # and scripts/ci/native-e2e-run.sh reads it directly (ADR-0017, LS-9652).
  E2E_NATIVE_GRAPHQL_PORT: "8083"
  GRADLE_OPTS: >-
    -Dorg.gradle.internal.http.connectionTimeout=120000
    -Dorg.gradle.internal.http.socketTimeout=120000
  NODE_OPTIONS: "--max-old-space-size=2048"

jobs:
  # ---------------------------------------------------------------------------
  # Post-merge debounce gate (schedule-free CI policy). Mirrors the `gate` job
  # in run-maestro-sweep.yml.
  # workflow_dispatch: always runs.
  # workflow_run (Deploy completed on main): runs at most once per
  # ANDROID_E2E_MIN_INTERVAL_HOURS. A debounced run skips both real jobs, so its
  # run conclusion is still "success"; the debounce check therefore inspects the
  # "Build Bypass APK" job of prior automated runs (non-skipped = real attempt)
  # rather than run-level conclusions, which would re-arm the debounce forever on
  # a busy repo. The `skipped` job below makes any such skip — debounced, or no
  # successful upstream build — legible to a human reading the checks list
  # (LS-9652).
  # ---------------------------------------------------------------------------
  gate:
    name: "Native Android E2E Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      should-run: ${{ steps.decide.outputs.should-run }}
      skip-reason: ${{ steps.decide.outputs.skip-reason }}
    steps:
      - name: "Decide whether to run"
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_INTERVAL_HOURS: ${{ vars.ANDROID_E2E_MIN_INTERVAL_HOURS || '156' }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — always runs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Upstream-conclusion check lives HERE, not on build-bypass-apk's `if:`.
          # When it sat on the build job, a run whose upstream build failed left
          # should-run == 'true' while every real job skipped — so the skip marker
          # below did not fire and the run was, once again, a bare green tick with
          # nothing run. The gate is now the single decision point: should-run ==
          # 'true' and the skip marker are exactly complementary.
          #
          # Build Android App is a workflow_call child of Deploy (LS-8765), so it
          # never fires its own workflow_run event — this listens on Deploy
          # instead and reads the "Build Android App" job's own conclusion out of
          # that run via the API, rather than Deploy's run-level conclusion, so an
          # unrelated failure in another Deploy child (e.g. Storybook) doesn't
          # incorrectly skip this suite.
          ANDROID_JOB=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "Build Android App")] | .[0]')

          if [ -z "$ANDROID_JOB" ] || [ "$ANDROID_JOB" = "null" ]; then
            echo "should-run=false" >> "$GITHUB_OUTPUT"
            echo "skip-reason=Upstream Deploy run had no 'Build Android App' job (Android not targeted this push) — there is no build to test." >> "$GITHUB_OUTPUT"
            {
              echo "## Native Android E2E — SKIPPED (no upstream build)"
              echo
              echo "**No emulator test ran in this run.**"
              echo
              echo "Upstream Deploy run had no \"Build Android App\" job — Android was not targeted this push."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          UPSTREAM=$(printf '%s' "$ANDROID_JOB" | jq -r '.conclusion')
          if [ "$UPSTREAM" != "success" ]; then
            echo "should-run=false" >> "$GITHUB_OUTPUT"
            echo "skip-reason=Upstream 'Build Android App' job concluded '${UPSTREAM}' — there is no build to test." >> "$GITHUB_OUTPUT"
            {
              echo "## Native Android E2E — SKIPPED (no upstream build)"
              echo
              echo "**No emulator test ran in this run.**"
              echo
              echo "Upstream \"Build Android App\" job concluded \`${UPSTREAM}\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          CUTOFF=$(date -u -d "-${MIN_INTERVAL_HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)

          # Walk automated runs of this workflow (newest first) across EVERY page
          # of the created>CUTOFF window.
          #
          # LS-9652: this used to read a single per_page=30 page. On a busy main —
          # where "Build Android App" completes every 10-20 minutes and creates a
          # debounced run each time — the last real attempt scrolled off page 1
          # within ~7 hours, the loop found nothing, and the debounce re-armed. The
          # effective interval was "the most recent 30 runs", not
          # MIN_INTERVAL_HOURS, which is what the comment above claims.
          #
          # A debounced run is gate-only and finishes in well under a minute; a real
          # attempt builds an APK and boots an emulator (30+ min). Pre-filtering on
          # elapsed wall time keeps job introspection to a handful of API calls
          # rather than one per run in the window. Job introspection remains the
          # authoritative check. An attempt that died before
          # MIN_REAL_ATTEMPT_SECONDS is not counted as one, which fails OPEN: the
          # lane retries sooner rather than debouncing against a run that never got
          # off the ground.
          MIN_REAL_ATTEMPT_SECONDS=300
          PAGE=1
          MAX_PAGES=10

          while [ "$PAGE" -le "$MAX_PAGES" ]; do
            RESP=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/e2e-native-android.yml/runs?event=workflow_run&created=%3E${CUTOFF}&per_page=100&page=${PAGE}")
            COUNT=$(printf '%s' "$RESP" | jq '.workflow_runs | length')
            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            CANDIDATES=$(printf '%s' "$RESP" | jq -r \
              --argjson self "${{ github.run_id }}" \
              --argjson min "$MIN_REAL_ATTEMPT_SECONDS" '
                [ .workflow_runs[]
                  | select(.id != $self)
                  | select(.run_started_at != null and .updated_at != null)
                  | select(((.updated_at | fromdateiso8601)
                            - (.run_started_at | fromdateiso8601)) >= $min)
                ] | .[].id')

            for id in $CANDIDATES; do
              # Non-skipped, completed "Build Bypass APK" = a real attempt.
              PREPARED=$(gh api "repos/${{ github.repository }}/actions/runs/${id}/jobs?per_page=30" \
                --jq '[.jobs[] | select(.name == "Build Bypass APK" and .conclusion != null and .conclusion != "skipped")] | length')
              if [ "$PREPARED" -gt 0 ]; then
                echo "should-run=false" >> "$GITHUB_OUTPUT"
                echo "skip-reason=Debounced — run ${id} already made a real attempt within the last ${MIN_INTERVAL_HOURS}h." >> "$GITHUB_OUTPUT"
                {
                  echo "## Native Android E2E — SKIPPED (debounced)"
                  echo
                  echo "**No emulator test ran in this run.**"
                  echo
                  echo "Run [\`${id}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${id}) already made a real attempt within the last ${MIN_INTERVAL_HOURS}h."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            done

            if [ "$COUNT" -lt 100 ]; then
              break
            fi
            PAGE=$((PAGE + 1))
          done

          echo "should-run=true" >> "$GITHUB_OUTPUT"
          {
            echo "## Native Android E2E — RUNNING"
            echo
            echo "No automated run made a real attempt in the last ${MIN_INTERVAL_HOURS}h."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # AC1 (LS-9652): a debounced run used to be indistinguishable from a passing
  # one — the gate went green, both real jobs reported "skipped", and GitHub
  # rolled the run up to "success". Nothing in the checks UI said that no test had
  # run, so ~15 consecutive green ticks on main were read as "native E2E is
  # passing" when the suite had not executed since run #439 (which failed).
  #
  # A job has no way to end in a "neutral" conclusion, so the signal is the job
  # NAME instead: a debounced run grows an extra, unmistakably-named job, and the
  # checks list reads "Native E2E SKIPPED — no test ran (debounced)" beside the
  # green tick rather than nothing at all.
  # ---------------------------------------------------------------------------
  skipped:
    name: "Native E2E SKIPPED — no test ran"
    needs: [gate]
    if: needs.gate.outputs.should-run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SKIP_REASON: ${{ needs.gate.outputs.skip-reason }}
    steps:
      - name: "Announce the skip"
        shell: bash
        run: |
          {
            echo "## Native Android E2E — SKIPPED"
            echo
            echo "**No emulator test ran in this run. Nothing was verified.**"
            echo
            echo "Reason: ${SKIP_REASON:-see the gate job summary}"
            echo
            echo "A green tick on this run means \"not attempted\" — it does NOT mean"
            echo "native E2E passed."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Build an automatable (bypass) APK ───────────────────────────────
  build-bypass-apk:
    name: Build Bypass APK
    needs: [gate]
    # The gate owns the entire run/skip decision (including the upstream build's
    # conclusion), so this stays a plain complement of the `skipped` job above —
    # every run takes exactly one of the two branches (LS-9652).
    if: needs.gate.outputs.should-run == 'true'
    # LS-8910: needs the Android SDK/NDK/Gradle wrapper — see the matching
    # comment on build-android-app.yml's build-android job for why the
    # fallback is 'ubuntu-latest' directly and not vars.CI_RUNNER_LABEL.
    runs-on: ${{ vars.ANDROID_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      # AC3: test-only session injection — the automatable native auth strategy.
      EXPO_PUBLIC_BYPASS_AUTH: "true"
      # Integration config mirrors build-android-app.yml. The GraphQL host
      # deliberately does NOT: hermetic native runs (ADR-0017) point the app at
      # the per-worker mock server over `adb reverse`, so the baked host is
      # derived from E2E_NATIVE_GRAPHQL_PORT by the step below. Baking
      # secrets.GRAPHQL_HOST here contradicted both scripts/ci/native-e2e-run.sh
      # and ADR-0017 and would have aimed the emulator at the real backend while
      # the fixture forwarded a port the app never called (LS-9652).
      EXPO_PUBLIC_OAUTH_PROXY: ${{ secrets.OAUTH_PROXY_URL }}
      EXPO_PUBLIC_WEBSOCKET_URL: ${{ secrets.WEBSOCKET_URL }}
      EXPO_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      EXPO_PUBLIC_ROLLBAR_ACCESS_TOKEN: ${{ secrets.ROLLBAR_CLIENT_ACCESS_TOKEN }}
      EXPO_PUBLIC_STRIPE_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_MONTHLY_PRICE_ID }}
      EXPO_PUBLIC_STRIPE_ANNUAL_PRICE_ID: ${{ secrets.STRIPE_ANNUAL_PRICE_ID }}
      EXPO_PUBLIC_GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
      EXPO_PUBLIC_GROWTHBOOK_CLIENT_KEY: ${{ secrets.GROWTHBOOK_CLIENT_KEY }}
      EXPO_PUBLIC_APP_BASE_URL: https://legacy-fantasy.com
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # LS-8910: gate uses vars.ANDROID_RUNNER_LABEL, matching the runs-on
      # expression above — not vars.CI_RUNNER_LABEL, which now drives a
      # different (non-Android) pool. See build-android-app.yml's build-android
      # job for the full rationale (LS-4933 on why `runner.labels` can't be used).
      - name: Setup Java
        if: ${{ vars.ANDROID_RUNNER_LABEL == '' }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"
          cache-dependency-path: |
            apps/app/app.json
            pnpm-lock.yaml

      - name: Setup Android SDK
        if: ${{ vars.ANDROID_RUNNER_LABEL == '' }}
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: "platform-tools platforms;android-${{ env.ANDROID_API_LEVEL }} build-tools;${{ env.ANDROID_API_LEVEL }}.0.0 ndk;${{ env.NDK_VERSION }}"

      - name: Ensure ANDROID_HOME (self-hosted fallback)
        if: ${{ vars.ANDROID_RUNNER_LABEL != '' }}
        shell: bash
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            echo "✅ ANDROID_HOME already set: $ANDROID_HOME"
            exit 0
          fi
          SDK_DIR="/opt/android-sdk"
          if [ ! -d "$SDK_DIR" ]; then
            echo "❌ ANDROID_HOME unset and $SDK_DIR missing on this runner."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-dependencies: true
          set-nx-shas: false
          skip-system-deps: true
          # Appium not needed to build; skip optional deps for a faster build job.
          include-optional-deps: false

      - name: Point the bypass APK at the hermetic mock host (ADR-0017)
        shell: bash
        run: |
          set -euo pipefail
          # Written to $GITHUB_ENV rather than the job `env:` block because the
          # `env` context is not available to job-level env keys — this keeps
          # E2E_NATIVE_GRAPHQL_PORT the single declaration shared by the baked APK
          # and scripts/ci/native-e2e-run.sh.
          HOST="http://localhost:${E2E_NATIVE_GRAPHQL_PORT}/graphql"
          echo "EXPO_PUBLIC_GRAPHQL_HOST=${HOST}" >> "$GITHUB_ENV"
          echo "Bypass APK GraphQL host: ${HOST}"

      - name: Build Android APK (bypass release)
        id: build
        uses: ./.github/actions/build-android
        with:
          build-type: release
          extra-gradle-flags: "--configuration-cache --configuration-cache-problems=warn"
        timeout-minutes: 40

      - name: Upload APK Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-apk-native-e2e
          path: apps/app/android/${{ steps.build.outputs.apk-path }}
          retention-days: 3

  # ── Boot the emulator and run the one proof flow ────────────────────
  native-e2e:
    name: Native E2E (Emulator)
    needs: build-bypass-apk
    # GH-hosted ubuntu-latest exposes KVM (required by android-emulator-runner);
    # non-metal self-hosted EC2 does not. Same rationale as build-android-app's
    # smoke-android job.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # LS-9652 / run #439 root cause. The emulator never booted; it died at
      # launch, instantly, with:
      #   FATAL | Not enough space to create userdata partition.
      #           Available: 4843.36 MB at ~/.android/avd/test.avd,
      #           need 7372.80 MB.
      # android-emulator-runner does not surface that FATAL as a failure — it
      # polled `adb shell getprop sys.boot_completed` for its full 600s timeout
      # and then reported the misleading "Timeout waiting for emulator to boot",
      # which is why the failure read as an emulator-provisioning flake rather
      # than an out-of-disk error. The AVD lives on / next to node_modules and the
      # Android SDK, so reclaim the large preinstalled toolchains this job never
      # uses, BEFORE the SDK install and AVD creation inside the runner action.
      # Deliberately NOT removed: /opt/hostedtoolcache (holds the Node that
      # "Setup Workspace" resolves) and /usr/local/lib/android (the SDK itself).
      - name: Free disk space for the AVD
        shell: bash
        run: |
          set -uo pipefail
          echo "Free space before:"
          df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/.ghcup \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/local/share/boost || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "Free space after:"
          df -h / | tail -1

      - name: Download APK Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-apk-native-e2e
          path: ./artifacts

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-dependencies: true
          set-nx-shas: false
          # Appium (optional dep) IS needed here to drive the emulator.
          include-optional-deps: true

      - name: AVD Cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api35-x86_64-google_apis

      # LS-9865: this job runs on GitHub-hosted ubuntu-latest — a fresh VM per
      # run, unlike the self-hosted AMI (see run-playwright-tests.yml /
      # cross-browser-e2e.yml) that pre-bakes Playwright browsers at
      # /opt/playwright-browsers. That AMI bake is why those workflows
      # deliberately DON'T run a runtime `playwright install` (it would race
      # unattended-upgrades for the dpkg lock on a long-lived host). Neither
      # concern applies here: there is no AMI bake to verify against, and the
      # VM is ephemeral, so there's no persistent dpkg lock contention to
      # race. Without this step the proof spec's dual fixtures (LS-9864) fail
      # at browserType.launch with "Executable doesn't exist ...
      # chromium_headless_shell ... Please run pnpm exec playwright install".
      # `playwright install` is idempotent, so this is a no-op if a future
      # runner image ever ships the binaries pre-cached.
      - name: Install Playwright Browsers
        shell: bash
        run: pnpm exec playwright install --with-deps chromium

      - name: Run native E2E on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          # Match the build's ANDROID_API_LEVEL (35) so the emulator OS equals the
          # APK's target SDK — no build/device API skew.
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          # The emulator reserves disk-size x 1.2 up front, so 6G demanded
          # 7372.80 MB and killed run #439 (LS-9652). 4G is ample for the bypass
          # APK plus the UiAutomator2 server, and leaves headroom on top of the
          # reclaim step above rather than spending all of it.
          disk-size: 4G
          force-avd-creation: false
          emulator-options: -no-window -no-snapshot-save -no-boot-anim -gpu swiftshader_indirect -noaudio -accel on
          disable-animations: true
          # Single-command invocation — the action splits multi-line inline
          # scripts across separate `sh -c` calls (LS-4755).
          script: bash scripts/ci/native-e2e-run.sh

      - name: Upload E2E Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-e2e-artifacts
          path: |
            apps/web-e2e/test-results
            artifacts/appium.log
          retention-days: 7
          if-no-files-found: warn
