name: Deploy OAuth Proxy Lambda

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lambdas/oauth-proxy/**"
      - ".github/workflows/deploy-oauth-proxy.yml"

# Cancel in-progress deployments for the same workflow
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  AWS_SERVICE_NAME: legacy-sports-oauth-proxy
  AWS_STAGE: dev
  AWS_VPC_SECURITY_GROUP_IDS: sg-0d21d72d3c1c004c2,sg-07083f37d7e8e24c5,sg-05999e0f1cbd13139
  AWS_VPC_SUBNET_IDS: subnet-031d24899cb105d13

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy OAuth Proxy Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true

      - name: Validate Deployment Readiness
        uses: ./.github/actions/deployment-gate
        with:
          artifacts-ready: 'true'
          quality-passed: 'true'
          required-components: ''
          environment: 'production'

      - name: "☁️ Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::176661590736:role/legacy-sports-dev-github-actions
          role-session-name: GitHubActions-DeployOAuthProxy
          aws-region: ${{ env.AWS_REGION }}

      - name: Build OAuth Proxy Lambda
        run: |
          echo "🚀 Building OAuth Proxy Lambda specifically..."
          echo "::notice::Building only oauth-proxy project for targeted deployment"
          
          # Build only the oauth-proxy and its dependencies
          if npx nx build oauth-proxy --verbose 2>&1 | tee build.log; then
            echo "✅ OAuth Proxy Lambda built successfully"
            
            # Verify build artifacts exist
            if [ -f "lambdas/oauth-proxy/dist/index.js" ]; then
              echo "✅ Build artifacts verified: lambdas/oauth-proxy/dist/index.js"
              BUILD_SIZE=$(du -sh lambdas/oauth-proxy/dist/index.js | cut -f1)
              echo "📊 OAuth Proxy Lambda bundle size: $BUILD_SIZE"
            else
              echo "❌ Build artifacts missing: lambdas/oauth-proxy/dist/index.js"
              exit 1
            fi
            
            echo "## 🚀 OAuth Proxy Lambda Build Summary" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
            echo "- **Project**: oauth-proxy" >> $GITHUB_STEP_SUMMARY
            echo "- **Bundle Size**: $BUILD_SIZE" >> $GITHUB_STEP_SUMMARY
            echo "- **Output**: lambdas/oauth-proxy/dist/" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ OAuth Proxy Lambda build failed"
            echo "## ❌ Build Errors" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            tail -20 build.log >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Package and Deploy OAuth Proxy Lambda
        working-directory: lambdas/oauth-proxy
        run: |
          # Create version string
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          COMMIT_SHA=$(echo $GITHUB_SHA | cut -c1-8)
          VERSION="${TIMESTAMP}-${COMMIT_SHA}"

          # Create deployment package from built artifacts
          zip -r "oauth-proxy-${VERSION}.zip" dist/

          # Get S3 bucket name from SSM parameter store
          echo "🔍 Getting S3 bucket name from SSM..."
          if S3_BUCKET=$(aws ssm get-parameter --name "/legacy-sports/${AWS_STAGE}/s3/lambda-deployments-bucket" --query "Parameter.Value" --output text --region ${{ env.AWS_REGION }} 2>/dev/null); then
            echo "✅ Found S3 bucket from SSM: $S3_BUCKET"
          else
            echo "⚠️ SSM parameter not found, using default bucket name"
            S3_BUCKET="legacy-sports-dev-lambdas-cca20ad9"
          fi

          # Upload to S3
          aws s3 cp "oauth-proxy-${VERSION}.zip" "s3://${S3_BUCKET}/oauth-proxy/" --region ${{ env.AWS_REGION }}

          # Update SSM parameter
          aws ssm put-parameter \
            --name "/legacy-sports/${AWS_STAGE}/lambda/oauth-proxy/version" \
            --value "$VERSION" \
            --overwrite \
            --region ${{ env.AWS_REGION }}

          echo "✅ Lambda package uploaded: oauth-proxy-${VERSION}.zip"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "S3_BUCKET=${S3_BUCKET}" >> $GITHUB_ENV

      - name: "🏗️ Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13"

      - name: "🔧 Initialize Terraform"
        working-directory: terraform
        run: |
          echo "🔧 Initializing Terraform..."
          if terraform init; then
            echo "✅ Terraform initialization successful"
          else
            echo "❌ Terraform initialization failed"
            echo "## Terraform Initialization Errors" >> $GITHUB_STEP_SUMMARY
            echo "Check that:" >> $GITHUB_STEP_SUMMARY
            echo "- Terraform configuration files exist in terraform/" >> $GITHUB_STEP_SUMMARY
            echo "- Backend configuration is valid" >> $GITHUB_STEP_SUMMARY
            echo "- AWS credentials are properly configured" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: "🚀 Deploy Infrastructure"
        working-directory: terraform
        env:
          # OAuth Lambda requires these secrets for authentication functionality
          # Set these in GitHub repository secrets: Settings → Secrets and variables → Actions
          TF_VAR_google_oauth_client_secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          TF_VAR_jwt_secret_key: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          echo "🔐 Deploying OAuth Lambda with required authentication secrets..."
          
          echo "📋 Planning Terraform changes for OAuth proxy..."
          terraform plan -target=aws_lambda_function.oauth_proxy -input=false
          
          echo "🚀 Applying Terraform changes..."
          terraform apply -target=aws_lambda_function.oauth_proxy -auto-approve -input=false
          
          echo "✅ OAuth proxy infrastructure deployment completed"

      - name: Update Deployment Badge
        if: always()
        uses: ./.github/actions/update-deployment-badge
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          gist-id: ${{ secrets.CI_BADGES_GIST_ID }}
          deployment-name: "OAuth Proxy Lambda"
          deployment-status: ${{ job.status }}
          workflow-run-id: ${{ github.run_id }}
          branch: ${{ github.ref_name }}
