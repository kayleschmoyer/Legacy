name: Deploy OAuth Proxy Lambda

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lambdas/oauth-proxy/**"
      - ".github/workflows/deploy-oauth-proxy.yml"

# Prevent concurrent Lambda deployments to avoid Terraform state lock contention
# All Lambdas share the same Terraform state, so they must deploy sequentially
concurrency:
  group: terraform-lambda-deployment
  cancel-in-progress: false

# IMPORTANT: Infrastructure Configuration
# These values are currently hardcoded for the dev environment.
# FUTURE IMPROVEMENT: Move to AWS Systems Manager Parameter Store
# See deploy-gql.yml for detailed improvement recommendations.
env:
  AWS_REGION: us-east-1
  AWS_SERVICE_NAME: legacy-sports-oauth-proxy
  AWS_STAGE: dev # TODO: Parameterize for multi-environment support
  # VPC Configuration - TODO: Move to SSM Parameter Store
  AWS_VPC_SECURITY_GROUP_IDS: sg-0d21d72d3c1c004c2,sg-07083f37d7e8e24c5,sg-05999e0f1cbd13139
  AWS_VPC_SUBNET_IDS: subnet-031d24899cb105d13

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy OAuth Proxy Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: true

      - name: "☁️ Detect DTE Availability"
        id: detect-dte
        uses: ./.github/actions/detect-dte
        with:
          nx-cloud-token: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

      - name: "☁️ Start Nx Cloud CI Run"
        id: start-dte
        if: steps.detect-dte.outputs.dte-available == 'true'
        continue-on-error: true
        run: |
          echo "🚀 Starting Nx Cloud DTE..."
          DTE_START_OUTPUT=$(mktemp)
          DTE_START_RESULT=0

          pnpm exec nx-cloud start-ci-run --distribute-on="${{ steps.detect-dte.outputs.optimal-agents }} linux-medium-js" 2>&1 | tee "$DTE_START_OUTPUT" || DTE_START_RESULT=$?

          if [ $DTE_START_RESULT -ne 0 ] || grep -qi "quota\|limit\|exceeded\|insufficient\|disabled\|unauthorized\|authorization\|401" "$DTE_START_OUTPUT"; then
            echo "::warning title=DTE Unavailable::Nx Cloud DTE unavailable. Build will proceed with local execution."
            cat "$DTE_START_OUTPUT"
            rm -f "$DTE_START_OUTPUT"
            exit 1
          fi

          rm -f "$DTE_START_OUTPUT"
          echo "✅ DTE session started"

      - name: Validate Deployment Readiness
        uses: ./.github/actions/deployment-gate
        with:
          artifacts-ready: "true"
          quality-passed: "true"
          required-components: ""
          environment: "production"

      - name: "☁️ Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::176661590736:role/legacy-sports-dev-github-actions
          role-session-name: GitHubActions-DeployOAuthProxy
          aws-region: ${{ env.AWS_REGION }}

      - name: 🏗️ Build and Package OAuth Proxy Lambda
        id: build
        uses: ./.github/actions/build-lambda
        with:
          lambda-name: oauth-proxy
          aws-region: ${{ env.AWS_REGION }}
          aws-stage: ${{ env.AWS_STAGE }}
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          sentry-org: ${{ secrets.SENTRY_ORG }}
          sentry-project: lambda-oauth-proxy

      - name: 🚀 Deploy OAuth Proxy Infrastructure
        uses: ./.github/actions/deploy-lambda-infrastructure
        with:
          lambda-name: oauth-proxy
          terraform-target: aws_lambda_function.oauth_proxy
          aws-region: ${{ env.AWS_REGION }}
        env:
          # Required repository secrets (configured in GitHub settings):
          # - GOOGLE_OAUTH_CLIENT_SECRET: Google OAuth 2.0 client secret
          # - JWT_SECRET_KEY: Secret key for JWT token signing
          TF_VAR_google_oauth_client_secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          TF_VAR_jwt_secret_key: ${{ secrets.JWT_SECRET_KEY }}

      - name: Update Deployment Badge
        if: always()
        uses: ./.github/actions/update-deployment-badge
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          gist-id: ${{ secrets.CI_BADGES_GIST_ID }}
          deployment-name: "OAuth Proxy Lambda"
          deployment-status: ${{ job.status }}
          workflow-run-id: ${{ github.run_id }}
          branch: ${{ github.ref_name }}
