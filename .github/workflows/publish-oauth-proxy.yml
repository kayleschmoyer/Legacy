name: Publish OAuth Proxy

# Controls when the workflow will run
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lambdas/oauth-proxy/**"
      - ".github/workflows/publish-oauth-proxy.yml"

# Cancel in-progress deployments for the same workflow
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  AWS_SERVICE_NAME: legacy-sports-oauth-proxy
  AWS_STAGE: dev
  AWS_VPC_SECURITY_GROUP_IDS: sg-0d21d72d3c1c004c2,sg-07083f37d7e8e24c5,sg-05999e0f1cbd13139
  # The private subnet on us-east-1c
  AWS_VPC_SUBNET_IDS: subnet-031d24899cb105d13
  # Nx Cloud access token for enhanced CI features (set as GitHub secret)
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

# Permission can be added at job level or workflow level
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout

jobs:
  build:
    name: Deploy OAuth Proxy Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify Main Branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "❌ Deployment can only run from main branch"
            echo "Current branch: ${{ github.ref }}"
            exit 1
          fi
          echo "✅ Deploying from main branch"

      - name: Setup NPM
        uses: ./.github/workflows/setup-npm

      - name: Setup AWS
        uses: ./.github/workflows/setup-aws
        id: setup-aws

      - name: Build and Deploy OAuth Proxy Lambda
        working-directory: lambdas/oauth-proxy
        run: |
          # Build the Lambda using Nx
          npx nx run oauth-proxy:build

          # Create version string
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          COMMIT_SHA=$(echo $GITHUB_SHA | cut -c1-8)
          VERSION="${TIMESTAMP}-${COMMIT_SHA}"

          # Create deployment package
          zip -r "oauth-proxy-${VERSION}.zip" dist/

          # Get S3 bucket name from Terraform output or use default
          S3_BUCKET=$(aws ssm get-parameter --name "/legacy-sports/${AWS_STAGE}/s3/lambda-deployments-bucket" --query "Parameter.Value" --output text 2>/dev/null || echo "${{ env.AWS_SERVICE_NAME }}-lambdas")

          # Upload to S3
          aws s3 cp "oauth-proxy-${VERSION}.zip" "s3://${S3_BUCKET}/oauth-proxy/" --region ${{ env.AWS_REGION }}

          # Update SSM parameter
          aws ssm put-parameter \
            --name "/legacy-sports/${AWS_STAGE}/lambda/oauth-proxy/version" \
            --value "$VERSION" \
            --overwrite \
            --region ${{ env.AWS_REGION }}

          echo "✅ Lambda package uploaded: oauth-proxy-${VERSION}.zip"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Deploy Infrastructure
        working-directory: terraform
        run: |
          # Apply Terraform to deploy the new Lambda version
          terraform init
          terraform plan -target=aws_lambda_function.oauth_proxy
          terraform apply -target=aws_lambda_function.oauth_proxy -auto-approve

      # Enable Nx Cloud Self-Healing CI for any build issues
      - name: Fix CI Issues
        run: npx nx-cloud fix-ci
        if: always()
