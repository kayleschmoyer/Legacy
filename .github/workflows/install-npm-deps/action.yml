name: Install NPM Dependencies Only
description: Install NPM dependencies without Node.js setup (assumes Node.js is already configured)

inputs:
  working-directory:
    description: "Working directory for npm operations"
    required: false
    default: "."
  skip-cache:
    description: "Skip cache and force fresh install"
    required: false
    default: "false"
  legacy-peer-deps:
    description: "Use --legacy-peer-deps flag"
    required: false
    default: "true"

outputs:
  cache-hit:
    description: "Whether dependencies were restored from cache"
    value: ${{ steps.install-deps.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - name: Install Dependencies
      id: install-deps
      uses: ./.github/workflows/install-dependencies
      with:
        working-directory: ${{ inputs.working-directory }}
        skip-cache: ${{ inputs.skip-cache }}
        cache-prefix: "deps-only"
