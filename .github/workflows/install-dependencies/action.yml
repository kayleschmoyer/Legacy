name: Install Dependencies
description: Install NPM dependencies with caching and legacy peer deps support

inputs:
  cache-prefix:
    description: 'Cache key prefix for the dependencies'
    required: false
    default: 'node_modules'
  working-directory:
    description: 'Working directory for npm operations'
    required: false
    default: '.'
  skip-cache:
    description: 'Skip cache and force fresh install'
    required: false
    default: 'false'

outputs:
  cache-hit:
    description: 'Whether dependencies were restored from cache'
    value: ${{ steps.cached-dependencies.outputs.cache-hit }}
  node-version:
    description: 'The Node.js version being used'
    value: ${{ steps.node-version.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Get Node Version
      id: node-version
      shell: bash
      run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"

    - name: Cache Dependencies
      if: inputs.skip-cache != 'true'
      uses: actions/cache@v4
      id: cached-dependencies
      with:
        path: ${{ inputs.working-directory }}/node_modules
        key: ${{ inputs.cache-prefix }}-${{ runner.os }}-${{ steps.node-version.outputs.version }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
        restore-keys: |
          ${{ inputs.cache-prefix }}-${{ runner.os }}-${{ steps.node-version.outputs.version }}-
          ${{ inputs.cache-prefix }}-${{ runner.os }}-

    - name: Install Dependencies
      if: steps.cached-dependencies.outputs.cache-hit != 'true' || inputs.skip-cache == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "Installing NPM dependencies..."
        echo "Working directory: $(pwd)"
        echo "Node version: $(node --version)"
        echo "NPM version: $(npm --version)"

        # First try clean install without legacy peer deps
        if npm ci 2>/dev/null; then
          echo "✅ Clean install successful (no peer dependency conflicts)"
        else
          echo "⚠️ Peer dependency conflicts detected, using --legacy-peer-deps"
          echo "This may indicate version mismatches that should be reviewed"
          
          # Fall back to legacy peer deps for React Native compatibility
          npm ci --legacy-peer-deps
          
          echo "⚠️ Installation completed with --legacy-peer-deps"
          echo "Consider reviewing peer dependency conflicts in the future"
        fi

        echo "Dependencies installed successfully!"

    - name: Verify Installation
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "Verifying installation..."
        if [ ! -d "node_modules" ]; then
          echo "❌ node_modules directory not found"
          exit 1
        fi

        echo "✅ Dependencies verified successfully"
        echo "Installed packages: $(find node_modules -maxdepth 1 -type d | wc -l)"
