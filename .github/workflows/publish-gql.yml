name: Deploy GraphQL Lambda

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lambdas/db/**'
      - '.github/workflows/publish-gql.yml'

# Cancel in-progress deployments for the same workflow
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  AWS_SERVICE_NAME: legacy-sports-gql
  AWS_STAGE: dev
  AWS_VPC_SECURITY_GROUP_IDS: sg-0d21d72d3c1c004c2,sg-07083f37d7e8e24c5
  AWS_VPC_SUBNET_IDS: subnet-06f49eeff089ef92d
  DATABASE_SCHEMAS: public
  DB_HOST: legacy-sports.cep4b6aynyet.us-east-1.rds.amazonaws.com

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy GraphQL Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup NPM
        uses: ./.github/workflows/setup-npm

      - name: Setup AWS
        uses: ./.github/workflows/setup-aws
        id: setup-aws

      - name: Get RDS Secret
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            POSTGRES, rds!db-99c143a8-70a6-4da7-bcd6-cab7837608a1
          parse-json-secrets: true

      - name: Make Cache Directory
        working-directory: lambdas/db
        run: mkdir -p dist

      - name: Echo NX Version
        working-directory: lambdas/db
        run: echo $(npx nx --version)

      - name: Make the Cache
        env:
          DB_HOST: ${{env.DB_HOST}}
          DB_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          DB_USER: ${{ env.POSTGRES_USERNAME }}
          DB_CERT_LOCATION: ${{ steps.setup-aws.outputs.installed-cert-location }}
        working-directory: lambdas/db
        run: npm run make-cache

      - name: Deploy Lambda
        uses: ./.github/workflows/deploy-serverless-lambda
        with:
          lambda-directory: lambdas/db
