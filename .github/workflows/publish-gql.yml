name: Publish GQL

# Controls when the workflow will run
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'db/**'
      - .github/workflows/publish-gql.yml

env:
  AWS_REGION: us-east-1
  AWS_SERVICE_NAME: legacy-sports-gql
  AWS_STAGE: dev
  AWS_VPC_SECURITY_GROUP_IDS: sg-0d21d72d3c1c004c2
  AWS_VPC_SUBNET_IDS: subnet-0a46f9507bdc73d20,subnet-0534497c68d611afc,subnet-054ba96f45a38e3a2,subnet-031d24899cb105d13,subnet-01f58f22e9ffdfb04,subnet-09314bc89e0a85b16
  DATABASE_SCHEMAS: public
  POSTGRES_PASSWORD:
  POSTGRES_USERNAME:
  RDS_HOST: legacy-sports.cep4b6aynyet.us-east-1.rds.amazonaws.com
# Permission can be added at job level or workflow level
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout

jobs:
  build:
    name: Deploy GraphQL Lambda
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup NPM
        uses: ./.github/workflows/setup-npm

      - name: Setup AWS
        uses: ./.github/workflows/setup-aws
        id: setup-aws

      - name: Get RDS Secret
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            POSTGRES, rds!db-99c143a8-70a6-4da7-bcd6-cab7837608a1
          parse-json-secrets: true

      - name: Make Cache Directory
        working-directory: db
        run: mkdir -p dist

      - name: Make the Cache
        env:
          DATABASE_URL: postgres://${{ env.POSTGRES_USERNAME }}:${{ env.POSTGRES_PASSWORD }}@${{env.RDS_HOST}}:5432/postgres?ssl=true&sslrootcert=${{ steps.setup-aws.outputs.installed-cert-location }}
        working-directory: db
        run: npm run make-cache

      - name: Deploy Lambda
        uses: ./.github/workflows/deploy-serverless-lambda
        with:
          name: graphql
          lambda-directory: db
