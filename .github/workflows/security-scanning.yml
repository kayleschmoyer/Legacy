name: "Security & Vulnerability Scanning"

# Comprehensive security scanning pipeline for Legacy Sports. This workflow is
# reusable and invoked by the orchestrator for PR, push, or scheduled runs.

on:
  workflow_call:
    inputs:
      scan_type:
        description: "Type of security scan to run"
        required: false
        type: string
        default: "comprehensive"
      runner-label:
        description: "Optional runner label resolved by the orchestrator for LS-1652 runner restrictions; falls back to vars.CI_RUNNER_LABEL or 'ubuntu-latest' when not set"
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  security-events: write
  pull-requests: write
  issues: write
  statuses: write

env:
  # Security scan configuration
  SECURITY_SCAN_TIMEOUT: 15
  DEPENDENCY_SCAN_TIMEOUT: 10
  SAST_SCAN_TIMEOUT: 20
  NODE_OPTIONS: "--max_old_space_size=4096"

jobs:
  security-scan-plan:
    name: "Security Scan Planning"
    # ubuntu-latest: no pnpm/Node env needed — pure bash/shell only (LS-3572)
    runs-on: ubuntu-latest
    timeout-minutes: 3

    outputs:
      run-dependency-scan: ${{ steps.plan.outputs.run-dependency-scan }}
      run-sast-scan: ${{ steps.plan.outputs.run-sast-scan }}
      run-secret-scan: ${{ steps.plan.outputs.run-secret-scan }}
      run-infrastructure-scan: ${{ steps.plan.outputs.run-infrastructure-scan }}
      scan-scope: ${{ steps.plan.outputs.scan-scope }}

    steps:
      - name: "🚀 Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: "📋 Determine Security Scan Scope"
        id: plan
        run: |
          echo "::group::🔒 Security Scan Planning"

          SCAN_TYPE="${{ inputs.scan_type || 'comprehensive' }}"
          EVENT_NAME="${{ github.event_name }}"

          echo "🎯 Scan Type: $SCAN_TYPE"
          echo "🔄 Trigger: $EVENT_NAME"

          # Default to comprehensive scanning
          RUN_DEPS=true
          RUN_SAST=true  
          RUN_SECRETS=true
          RUN_INFRA=true
          SCAN_SCOPE="full"

          # Adjust based on scan type input
          case "$SCAN_TYPE" in
            "dependencies-only")
              RUN_DEPS=true
              RUN_SAST=false
              RUN_SECRETS=false
              RUN_INFRA=false
              SCAN_SCOPE="dependencies"
              ;;
            "sast-only")
              RUN_DEPS=false
              RUN_SAST=true
              RUN_SECRETS=false
              RUN_INFRA=false
              SCAN_SCOPE="static-analysis"
              ;;
            "secrets-only")
              RUN_DEPS=false
              RUN_SAST=false
              RUN_SECRETS=true
              RUN_INFRA=false
              SCAN_SCOPE="secrets"
              ;;
          esac

          # For PR events (including post-bot-review runs), focus on changed files for faster feedback
          if [ "$EVENT_NAME" == "pull_request" ] || [ "$EVENT_NAME" == "pull_request_review" ]; then
            echo "🔍 PR-focused security scan"
            # Always run secret scanning on PRs
            RUN_SECRETS=true
            SCAN_SCOPE="pr-targeted"
          fi

          # For scheduled runs, always do comprehensive scanning
          if [ "$EVENT_NAME" == "schedule" ]; then
            echo "📅 Scheduled comprehensive security audit"
            RUN_DEPS=true
            RUN_SAST=true
            RUN_SECRETS=true
            RUN_INFRA=true
            SCAN_SCOPE="scheduled-audit"
          fi

          # Set outputs
          echo "run-dependency-scan=$RUN_DEPS" >> $GITHUB_OUTPUT
          echo "run-sast-scan=$RUN_SAST" >> $GITHUB_OUTPUT
          echo "run-secret-scan=$RUN_SECRETS" >> $GITHUB_OUTPUT
          echo "run-infrastructure-scan=$RUN_INFRA" >> $GITHUB_OUTPUT
          echo "scan-scope=$SCAN_SCOPE" >> $GITHUB_OUTPUT

          # Create summary
          echo "## 🔒 Security Scan Plan" >> $GITHUB_STEP_SUMMARY
          echo "- **Scope**: $SCAN_SCOPE" >> $GITHUB_STEP_SUMMARY
          echo "- **Dependency Scan**: $RUN_DEPS" >> $GITHUB_STEP_SUMMARY
          echo "- **SAST Scan**: $RUN_SAST" >> $GITHUB_STEP_SUMMARY
          echo "- **Secret Detection**: $RUN_SECRETS" >> $GITHUB_STEP_SUMMARY
          echo "- **Infrastructure Scan**: $RUN_INFRA" >> $GITHUB_STEP_SUMMARY

          echo "::endgroup::"

  # ======================================================================
  # DEPENDENCY VULNERABILITY SCANNING
  # ======================================================================

  dependency-scan:
    name: "Dependency Vulnerability Scan"
    runs-on: ${{ inputs.runner-label || vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    needs: security-scan-plan
    if: needs.security-scan-plan.outputs.run-dependency-scan == 'true'

    steps:
      - name: "🚀 Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: "🔧 Setup Environment"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          # OSV scanner only needs the lockfile (no node_modules).
          # Snyk needs node_modules but only runs on non-PR events.
          # Skip install on PRs to save ~1-2 minutes.
          install-dependencies: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_review' }}

      - name: "🔍 OSV Dependency Scan"
        id: npm-audit
        uses: google/osv-scanner-action/osv-scanner-action@c51854704019a247608d928f370c98740469d4b5 # v2.3.5
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --format=json
            --output=osv-results.json

      - name: "📦 Parse OSV Results"
        id: parse-osv
        if: always()
        run: |
          echo "::group::📦 OSV Dependency Audit Results"

          if [ ! -f osv-results.json ]; then
            echo "✅ No vulnerabilities found (no output file)"
            echo "audit-status=clean" >> $GITHUB_OUTPUT
            echo "total-vulns=0" >> $GITHUB_OUTPUT
            echo "high-vulns=0" >> $GITHUB_OUTPUT
            echo "critical-vulns=0" >> $GITHUB_OUTPUT
            echo "::endgroup::"
            exit 0
          fi

          # Count vulnerabilities by severity from OSV JSON output
          TOTAL_VULNS=$(jq '[.results[]?.packages[]?.vulnerabilities // [] | length] | add // 0' osv-results.json 2>/dev/null || echo 0)
          CRITICAL_VULNS=$(jq '[.results[]?.packages[]?.vulnerabilities[]? | select(.database_specific?.severity == "CRITICAL")] | length // 0' osv-results.json 2>/dev/null || echo 0)
          HIGH_VULNS=$(jq '[.results[]?.packages[]?.vulnerabilities[]? | select(.database_specific?.severity == "HIGH")] | length // 0' osv-results.json 2>/dev/null || echo 0)

          echo "📊 Vulnerability Summary:"
          echo "- Total: $TOTAL_VULNS"
          echo "- High: $HIGH_VULNS"
          echo "- Critical: $CRITICAL_VULNS"

          if [ "$TOTAL_VULNS" -eq 0 ]; then
            AUDIT_STATUS="clean"
          else
            AUDIT_STATUS="vulnerabilities"
          fi

          echo "audit-status=$AUDIT_STATUS" >> $GITHUB_OUTPUT
          echo "total-vulns=$TOTAL_VULNS" >> $GITHUB_OUTPUT
          echo "high-vulns=$HIGH_VULNS" >> $GITHUB_OUTPUT
          echo "critical-vulns=$CRITICAL_VULNS" >> $GITHUB_OUTPUT

          echo "::endgroup::"

      - name: "💾 Cache Snyk CLI"
        if: github.event_name != 'pull_request' && github.event_name != 'pull_request_review'
        id: snyk-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: /usr/local/bin/snyk
          key: snyk-cli-v1.1293.1-linux

      - name: "⬇️ Install Snyk CLI"
        if: github.event_name != 'pull_request' && github.event_name != 'pull_request_review' && steps.snyk-cache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        run: |
          # Skip download if Snyk is already baked into the AMI at the expected version
          EXPECTED_SNYK_VERSION="1.1293.1"
          if command -v snyk >/dev/null 2>&1; then
            INSTALLED_VERSION=$(snyk --version 2>/dev/null || echo "unknown")
            if [ "$INSTALLED_VERSION" = "$EXPECTED_SNYK_VERSION" ]; then
              echo "✅ Snyk CLI already installed at expected version: $INSTALLED_VERSION"
              exit 0
            else
              echo "⚠️ Snyk version mismatch: installed=$INSTALLED_VERSION expected=$EXPECTED_SNYK_VERSION — reinstalling"
            fi
          fi
          DOWNLOADED=false
          for attempt in 1 2 3; do
            if curl -sfSL --connect-timeout 10 --max-time 60 \
              "https://static.snyk.io/cli/v1.1293.1/snyk-linux" -o /usr/local/bin/snyk; then
              echo "✅ Snyk CLI downloaded (attempt $attempt)"
              DOWNLOADED=true
              break
            fi
            echo "⚠️ Download attempt $attempt failed, retrying in 10s..."
            rm -f /usr/local/bin/snyk
            sleep 10
          done
          if [ "$DOWNLOADED" != "true" ]; then
            echo "❌ All 3 download attempts failed"
            exit 1
          fi
          chmod +x /usr/local/bin/snyk
          snyk --version

      - name: "🛡️ Snyk Vulnerability Scan"
        id: snyk-scan
        if: github.event_name != 'pull_request' && github.event_name != 'pull_request_review'
        continue-on-error: true
        timeout-minutes: 5
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          echo "::group::🛡️ Snyk Security Scan"

          snyk --version

          # Authenticate if token available
          if [ -n "${SNYK_TOKEN}" ]; then
            snyk auth "${SNYK_TOKEN}"
            echo "✅ Snyk authenticated"
          else
            echo "ℹ️ Running Snyk in anonymous mode (limited features)"
          fi

          # Run Snyk test
          SNYK_LOG="snyk-results-$(date +%s).json"

          if snyk test --json > "$SNYK_LOG" 2>&1; then
            echo "✅ Snyk scan completed - no critical vulnerabilities"
            SNYK_STATUS="clean"
          else
            echo "⚠️ Snyk detected vulnerabilities"
            SNYK_STATUS="vulnerabilities"
          fi

          # Parse Snyk results if file exists
          if [ -f "$SNYK_LOG" ]; then
            SNYK_ISSUES=$(jq '.vulnerabilities | length' "$SNYK_LOG" 2>/dev/null || echo 0)
            echo "📊 Snyk found $SNYK_ISSUES potential issues"
            
            # Show critical issues
            if [ "$SNYK_ISSUES" -gt 0 ]; then
              echo "🚨 Critical vulnerabilities:"
              jq -r '.vulnerabilities[] | select(.severity == "critical" or .severity == "high") | "- \(.title) (\(.severity))"' "$SNYK_LOG" 2>/dev/null | head -5
            fi
            
            echo "snyk-issues=$SNYK_ISSUES" >> $GITHUB_OUTPUT
            echo "snyk-status=$SNYK_STATUS" >> $GITHUB_OUTPUT
          fi

          echo "::endgroup::"

      - name: "📊 Dependency Scan Summary"
        if: always()
        run: |
          echo "## 📦 Dependency Vulnerability Summary" >> $GITHUB_STEP_SUMMARY

          # OSV Scanner Results
          AUDIT_STATUS="${{ steps.parse-osv.outputs.audit-status || 'unknown' }}"
          TOTAL_VULNS="${{ steps.parse-osv.outputs.total-vulns || 0 }}"
          HIGH_VULNS="${{ steps.parse-osv.outputs.high-vulns || 0 }}"
          CRITICAL_VULNS="${{ steps.parse-osv.outputs.critical-vulns || 0 }}"

          echo "### OSV Dependency Scan Results" >> $GITHUB_STEP_SUMMARY
          if [ "$AUDIT_STATUS" == "clean" ]; then
            echo "✅ **Status**: No vulnerabilities detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Status**: $TOTAL_VULNS vulnerabilities found" >> $GITHUB_STEP_SUMMARY
            echo "- **Critical**: $CRITICAL_VULNS" >> $GITHUB_STEP_SUMMARY
            echo "- **High**: $HIGH_VULNS" >> $GITHUB_STEP_SUMMARY
          fi

          # Snyk Results
          SNYK_STATUS="${{ steps.snyk-scan.outputs.snyk-status || 'skipped' }}"
          SNYK_ISSUES="${{ steps.snyk-scan.outputs.snyk-issues || 0 }}"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Snyk Security Scan" >> $GITHUB_STEP_SUMMARY
          if [ "$SNYK_STATUS" == "clean" ]; then
            echo "✅ **Status**: No critical vulnerabilities detected" >> $GITHUB_STEP_SUMMARY
          elif [ "$SNYK_STATUS" == "skipped" ]; then
            echo "⏭️ **Status**: Skipped (runs on push-to-main and scheduled scans only)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Status**: $SNYK_ISSUES potential issues found" >> $GITHUB_STEP_SUMMARY
          fi

          # Recommendations
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔧 Recommendations" >> $GITHUB_STEP_SUMMARY

          if [ "$CRITICAL_VULNS" -gt 0 ] || [ "$HIGH_VULNS" -gt 0 ]; then
            echo "- 🚨 **Immediate Action**: Update packages with critical/high vulnerabilities" >> $GITHUB_STEP_SUMMARY
            echo "- 🔧 **Command**: Update affected packages via \`pnpm update <package>\` or review OSV advisories" >> $GITHUB_STEP_SUMMARY
            echo "- 📊 **Monitor**: Set up automated dependency updates with Dependabot" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ✅ **Status**: Dependency security looks good" >> $GITHUB_STEP_SUMMARY
            echo "- 📅 **Next**: Continue regular weekly scans" >> $GITHUB_STEP_SUMMARY
          fi

  # ======================================================================
  # SECRET DETECTION SCANNING
  # ======================================================================

  secret-detection:
    name: "Secret Detection Scan"
    # ubuntu-latest: no pnpm/Node env needed — pure bash/shell only (LS-3572)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: security-scan-plan
    if: needs.security-scan-plan.outputs.run-secret-scan == 'true'

    steps:
      - name: "🚀 Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: "🔍 GitLeaks Secret Detection"
        id: gitleaks
        timeout-minutes: 5
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
        continue-on-error: true

      - name: "🔐 Manual Secret Pattern Detection"
        id: manual-scan
        timeout-minutes: 3
        run: |
          echo "::group::🔍 Additional Secret Pattern Scanning"

          SECRET_PATTERNS_FOUND=0

          echo "🔍 Scanning for common secret patterns..."

          # Check for common secret patterns
          SECRET_PATTERNS=(
            "AKIA[0-9A-Z]{16}"           # AWS Access Key
            "aws_secret_access_key"      # AWS Secret Key
            "sk_live_[0-9a-zA-Z]{24}"   # Stripe Live Key
            "sk_test_[0-9a-zA-Z]{24}"   # Stripe Test Key
            "rk_live_[0-9a-zA-Z]{24}"   # Stripe Live Key
            "AIza[0-9A-Za-z\\-_]{35}"   # Google API Key
            "ya29\\.[0-9A-Za-z\\-_]+"   # Google OAuth
            "ghp_[0-9a-zA-Z]{36}"       # GitHub Personal Access Token
            "ghs_[0-9a-zA-Z]{36}"       # GitHub App Token
            "postgres://.*:.*@.*:.*/"   # PostgreSQL connection string with credentials
          )

          # False-positive keywords — lines containing these are not real secrets
          # NOTE: these patterns match the full grep output (path:content), so
          # avoid broad tokens that could appear in file paths (see --exclude/
          # --exclude-dir for path-based filtering instead).
          FALSE_POSITIVE_FILTER="Placeholder|_fake|xxxxxxxx"

          # Scan for patterns (excluding common safe files and test/example artifacts)
          for pattern in "${SECRET_PATTERNS[@]}"; do
            MATCHES=$(grep -r -E "$pattern" . \
              --exclude-dir=".git" \
              --exclude-dir="node_modules" \
              --exclude-dir="dist" \
              --exclude-dir=".nx" \
              --exclude="*.md" \
              --exclude="*.yml" \
              --exclude="*.yaml" \
              --exclude="*.example" \
              --exclude="*.spec.ts" \
              --exclude="*.test.ts" \
              --exclude="setup-tests.*" \
              2>/dev/null | grep -v -E "$FALSE_POSITIVE_FILTER" || true)

            if [ -n "$MATCHES" ]; then
              echo "$MATCHES"
              echo "⚠️ Potential secret pattern found: $pattern"
              SECRET_PATTERNS_FOUND=$((SECRET_PATTERNS_FOUND + 1))
            fi
          done

          # Check for hardcoded credentials in source files (not tests)
          echo "🔍 Checking for hardcoded credentials..."

          PASSWORD_MATCHES=$(grep -r "password\s*[:=]\s*['\"][^'\"]*['\"]" . \
            --include="*.ts" --include="*.js" --include="*.json" \
            --exclude-dir="node_modules" --exclude-dir=".git" --exclude-dir="dist" \
            --exclude="*.spec.ts" --exclude="*.test.ts" --exclude="setup-tests.*" \
            --exclude-dir="*-e2e*" --exclude-dir="test-fixtures" \
            2>/dev/null | grep -v -E "\b(fake|mock|dummy)\b|HIDDEN|DB_PASSWORD|process\.env" || true)

          if [ -n "$PASSWORD_MATCHES" ]; then
            echo "$PASSWORD_MATCHES"
            echo "⚠️ Potential hardcoded passwords found"
            SECRET_PATTERNS_FOUND=$((SECRET_PATTERNS_FOUND + 1))
          fi

          echo "secret-patterns-found=$SECRET_PATTERNS_FOUND" >> $GITHUB_OUTPUT

          if [ $SECRET_PATTERNS_FOUND -eq 0 ]; then
            echo "✅ No obvious secret patterns detected"
          else
            echo "⚠️ Found $SECRET_PATTERNS_FOUND potential secret patterns"
          fi

          echo "::endgroup::"

      - name: "📊 Secret Detection Summary"
        run: |
          echo "## 🔐 Secret Detection Summary" >> $GITHUB_STEP_SUMMARY

          GITLEAKS_STATUS="${{ steps.gitleaks.outcome }}"
          MANUAL_PATTERNS="${{ steps.manual-scan.outputs.secret-patterns-found || 0 }}"

          echo "### GitLeaks Scan Results" >> $GITHUB_STEP_SUMMARY
          if [ "$GITLEAKS_STATUS" == "success" ]; then
            echo "✅ **GitLeaks**: No secrets detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **GitLeaks**: Potential secrets detected - check detailed logs" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Manual Pattern Detection" >> $GITHUB_STEP_SUMMARY
          if [ "$MANUAL_PATTERNS" -eq 0 ]; then
            echo "✅ **Pattern Scan**: No obvious secret patterns found" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Pattern Scan**: $MANUAL_PATTERNS potential patterns detected" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🛡️ Security Recommendations" >> $GITHUB_STEP_SUMMARY
          echo "- 🔒 Use GitHub Secrets for sensitive data" >> $GITHUB_STEP_SUMMARY
          echo "- 📝 Review .gitignore to exclude credential files" >> $GITHUB_STEP_SUMMARY  
          echo "- 🔄 Rotate any exposed credentials immediately" >> $GITHUB_STEP_SUMMARY
          echo "- 📋 Follow security guidelines in SECURITY_AND_SECRETS_GUIDE.md" >> $GITHUB_STEP_SUMMARY

  # ======================================================================
  # STATIC APPLICATION SECURITY TESTING (SAST)
  # ======================================================================

  sast-scan:
    name: "Static Application Security Testing"
    runs-on: ${{ inputs.runner-label || vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    needs: security-scan-plan
    if: needs.security-scan-plan.outputs.run-sast-scan == 'true'

    steps:
      - name: "🚀 Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: "🔧 Setup Environment"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: true

      - name: "🔬 Initialize CodeQL Analysis"
        # Skip CodeQL on PRs for faster feedback
        if: github.event_name != 'pull_request' && github.event_name != 'pull_request_review'
        uses: github/codeql-action/init@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4
        with:
          languages: javascript,typescript
          queries: security-extended,security-and-quality

      - name: "🏗️📦 Build for Analysis"
        # Skip build on PRs when CodeQL is skipped
        if: github.event_name != 'pull_request' && github.event_name != 'pull_request_review'
        timeout-minutes: 10
        env:
          NX_NO_CLOUD: "true"
        run: |
          echo "🏗️ Building applications for SAST analysis..."

          NX_CMD="${NX_COMMAND:-}"
          if [ -z "$NX_CMD" ]; then
            if command -v pnpm >/dev/null 2>&1; then
              NX_CMD="pnpm exec nx --"
            else
              NX_CMD="pnpm exec nx"
            fi
          fi

          # Build shared libraries first
          $NX_CMD build lib-tamagui-config || true

          # Build applications
          $NX_CMD build web || echo "Web build failed - continuing analysis"

          echo "✅ Build completed for SAST analysis"

      - name: "🔍 Perform CodeQL Analysis"
        # Skip CodeQL on PRs for faster feedback
        if: github.event_name != 'pull_request' && github.event_name != 'pull_request_review'
        uses: github/codeql-action/analyze@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4
        with:
          category: "/language:javascript"
          upload: false
          output: sarif-results

      - name: "📊 Process CodeQL Results"
        id: process-codeql-results
        # Skip CodeQL results processing on PRs
        if: always() && github.event_name != 'pull_request' && github.event_name != 'pull_request_review'
        run: |
          echo "::group::🔍 CodeQL Results Processing"

          # Check if SARIF results were generated
          if [ -d "sarif-results" ]; then
            echo "✅ CodeQL analysis completed successfully"
            
            # Count findings by severity
            SARIF_FILES=$(find sarif-results -name "*.sarif" 2>/dev/null || echo "")
            
            if [ -n "$SARIF_FILES" ]; then
              echo "📊 Processing SARIF results..."
              
              # Basic SARIF parsing for summary (requires jq if available)
              if command -v jq &> /dev/null; then
                for file in $SARIF_FILES; do
                  if [ -f "$file" ]; then
                    RULE_COUNT=$(jq '.runs[0].results | length' "$file" 2>/dev/null || echo "0")
                    echo "📄 Found $RULE_COUNT potential issues in $(basename "$file")"
                  fi
                done
              else
                echo "📄 SARIF files generated (jq not available for detailed parsing)"
                ls -la sarif-results/
              fi
              
              # Create summary for PR/commit
              echo "## 🛡️ CodeQL Security Analysis" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "✅ **Status**: Analysis completed successfully" >> $GITHUB_STEP_SUMMARY
              echo "📊 **Files Analyzed**: JavaScript/TypeScript codebase" >> $GITHUB_STEP_SUMMARY
              echo "🔍 **Query Suites**: security-extended, security-and-quality" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "📁 **Results**: SARIF files generated for offline review" >> $GITHUB_STEP_SUMMARY
              
              # Set output for downstream jobs
              echo "codeql-status=success" >> $GITHUB_OUTPUT
              echo "sarif-generated=true" >> $GITHUB_OUTPUT
            else
              echo "⚠️ No SARIF files found - analysis may have failed"
              echo "codeql-status=no-results" >> $GITHUB_OUTPUT  
              echo "sarif-generated=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "❌ CodeQL analysis failed - no results directory found"
            echo "codeql-status=failed" >> $GITHUB_OUTPUT
            echo "sarif-generated=false" >> $GITHUB_OUTPUT
          fi

          echo "::endgroup::"

      - name: "📤 Upload CodeQL Results"
        # Skip on PRs since CodeQL is not run
        if: github.event_name != 'pull_request' && github.event_name != 'pull_request_review' && steps.process-codeql-results.outputs.sarif-generated == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codeql-sarif-results
          path: sarif-results/
          retention-days: 3

      - name: "🔐 ESLint Security Rules"
        id: eslint-security
        timeout-minutes: 5
        run: |
          echo "::group::🔒 ESLint Security Rule Analysis"

          SECURITY_LOG="eslint-security-$(date +%s).json"
          SCAN_SCOPE="full"

          # Security rules applied inline via --rule flags (no external config file needed)
          SECURITY_RULES=(
            "security/detect-object-injection: error"
            "security/detect-non-literal-regexp: error"
            "security/detect-unsafe-regex: error"
            "security/detect-buffer-noassert: error"
            "security/detect-child-process: error"
            "security/detect-disable-mustache-escape: error"
            "security/detect-eval-with-expression: error"
            "security/detect-no-csrf-before-method-override: error"
            "security/detect-non-literal-fs-filename: error"
            "security/detect-non-literal-require: error"
            "security/detect-possible-timing-attacks: error"
            "security/detect-pseudoRandomBytes: error"
          )
          RULE_ARGS=()
          for rule in "${SECURITY_RULES[@]}"; do
            RULE_ARGS+=(--rule "$rule")
          done

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_EVENT_NAME}" = "pull_request_review" ]; then
            SCAN_SCOPE="changed-files"
            echo "🔍 Pull request detected – targeting changed JS/TS sources"
            mapfile -t CHANGED_FILES < <(git diff --name-only "${NX_BASE:-origin/main}" "${NX_HEAD:-HEAD}" -- '*.ts' '*.tsx' '*.js' '*.jsx' || true)

            if [ "${#CHANGED_FILES[@]}" -eq 0 ]; then
              echo "ℹ️  No JavaScript or TypeScript changes detected; skipping ESLint security scan"
              echo "[]" > "$SECURITY_LOG"
            else
              echo "🔎 Scanning ${#CHANGED_FILES[@]} changed file(s):"
              printf '   - %s\n' "${CHANGED_FILES[@]}"
              pnpm exec eslint \
                --no-eslintrc \
                --plugin security \
                "${RULE_ARGS[@]}" \
                --format json \
                --output-file "$SECURITY_LOG" \
                "${CHANGED_FILES[@]}" \
                2>/dev/null || true
            fi
          else
            echo "🔍 Running full-repository ESLint security scan"
            pnpm exec eslint \
              --no-eslintrc \
              --plugin security \
              "${RULE_ARGS[@]}" \
              --format json \
              --output-file "$SECURITY_LOG" \
              --ext .ts,.tsx,.js,.jsx \
              . \
              2>/dev/null || true
          fi

          echo "Scan scope: $SCAN_SCOPE"

          # Parse results — ESLint JSON format is an array of file objects,
          # each with an errorCount. Sum errorCount across all files for the true
          # number of security violations.
          if [ -f "$SECURITY_LOG" ]; then
            SECURITY_ISSUES=$(jq '[.[].errorCount] | add // 0' "$SECURITY_LOG" 2>/dev/null || echo 0)
            echo "📊 ESLint Security: $SECURITY_ISSUES issues found"

            if [ "$SECURITY_ISSUES" -gt 0 ]; then
              echo "🚨 Security issues detected:"
              jq -r '.[] | select(.messages | length > 0) | .filePath as $f | .messages[] | "- \($f): \(.ruleId): \(.message)"' "$SECURITY_LOG" | head -10
            fi

            echo "eslint-security-issues=$SECURITY_ISSUES" >> $GITHUB_OUTPUT
          else
            echo "eslint-security-issues=0" >> $GITHUB_OUTPUT
          fi

          echo "::endgroup::"

      - name: "📊 SAST Summary"
        run: |
          echo "## 🛡️ Static Application Security Testing Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # CodeQL Results
          CODEQL_STATUS="${{ steps.process-codeql-results.outputs.codeql-status || 'skipped' }}"
          echo "### CodeQL Analysis" >> $GITHUB_STEP_SUMMARY
          if [ "$CODEQL_STATUS" = "success" ]; then
            echo "✅ **CodeQL**: Analysis completed successfully (private repo mode)" >> $GITHUB_STEP_SUMMARY
            echo "- Language: JavaScript/TypeScript" >> $GITHUB_STEP_SUMMARY
            echo "- Query Suite: security-extended,security-and-quality" >> $GITHUB_STEP_SUMMARY
            echo "- Results: SARIF files generated for offline review" >> $GITHUB_STEP_SUMMARY
          elif [ "$CODEQL_STATUS" = "no-results" ]; then
            echo "⚠️ **CodeQL**: Analysis completed but no results generated" >> $GITHUB_STEP_SUMMARY
          elif [ "$CODEQL_STATUS" = "skipped" ]; then
            echo "⏭️ **CodeQL**: Skipped (runs on push-to-main and scheduled scans only)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **CodeQL**: Analysis failed or incomplete" >> $GITHUB_STEP_SUMMARY
          fi

          # ESLint Security Results
          ESLINT_ISSUES="${{ steps.eslint-security.outputs.eslint-security-issues || 0 }}"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ESLint Security Rules" >> $GITHUB_STEP_SUMMARY
          if [ "$ESLINT_ISSUES" -eq 0 ]; then
            echo "✅ **ESLint Security**: No security rule violations detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **ESLint Security**: $ESLINT_ISSUES potential security issues" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 Review SARIF results generated in workflow artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- 🔧 Address any high-severity security findings from CodeQL/ESLint" >> $GITHUB_STEP_SUMMARY
          echo "- 📚 Follow secure coding practices and SAST recommendations" >> $GITHUB_STEP_SUMMARY
          echo "- ℹ️ Note: CodeQL runs in private repo mode (no GitHub Security tab upload)" >> $GITHUB_STEP_SUMMARY

  # ======================================================================
  # SECURITY SCAN SUMMARY & REPORTING
  # ======================================================================

  security-summary:
    name: "Security Scan Summary"
    # ubuntu-latest: no pnpm/Node env needed — pure bash/shell only (LS-3572)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [security-scan-plan, dependency-scan, secret-detection, sast-scan]
    if: always()

    steps:
      - name: "📊 Generate Security Summary Report"
        run: |
          echo "## 🔒 Security Scan Summary Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Date**: $(date -u +%Y-%m-%d\ %H:%M:%S\ UTC)" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Scope**: ${{ needs.security-scan-plan.outputs.scan-scope }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Security Scan Results Table
          echo "### 🛡️ Scan Results Overview" >> $GITHUB_STEP_SUMMARY
          echo "| Security Check | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|----------------|---------|---------|" >> $GITHUB_STEP_SUMMARY

          # Dependency Scan
          DEP_STATUS="${{ needs.dependency-scan.result }}"
          if [ "$DEP_STATUS" == "success" ]; then
            echo "| Dependency Vulnerabilities | ✅ Passed | No critical vulnerabilities |" >> $GITHUB_STEP_SUMMARY
          elif [ "$DEP_STATUS" == "failure" ]; then
            echo "| Dependency Vulnerabilities | ❌ Issues | Vulnerabilities detected |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Dependency Vulnerabilities | ⏭️ Skipped | Not included in scan scope |" >> $GITHUB_STEP_SUMMARY
          fi

          # Secret Detection
          SECRET_STATUS="${{ needs.secret-detection.result }}"
          if [ "$SECRET_STATUS" == "success" ]; then
            echo "| Secret Detection | ✅ Passed | No secrets detected |" >> $GITHUB_STEP_SUMMARY
          elif [ "$SECRET_STATUS" == "failure" ]; then
            echo "| Secret Detection | ⚠️ Issues | Potential secrets found |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Secret Detection | ⏭️ Skipped | Not included in scan scope |" >> $GITHUB_STEP_SUMMARY
          fi

          # SAST Scan
          SAST_STATUS="${{ needs.sast-scan.result }}"
          if [ "$SAST_STATUS" == "success" ]; then
            echo "| Static Analysis (SAST) | ✅ Passed | No security issues |" >> $GITHUB_STEP_SUMMARY
          elif [ "$SAST_STATUS" == "failure" ]; then
            echo "| Static Analysis (SAST) | ⚠️ Issues | Security findings detected |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Static Analysis (SAST) | ⏭️ Skipped | Not included in scan scope |" >> $GITHUB_STEP_SUMMARY
          fi

          # Overall Security Posture
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Security Posture" >> $GITHUB_STEP_SUMMARY

          # Determine overall status
          CRITICAL_FAILURES=0
          if [ "$DEP_STATUS" == "failure" ]; then CRITICAL_FAILURES=$((CRITICAL_FAILURES + 1)); fi
          if [ "$SECRET_STATUS" == "failure" ]; then CRITICAL_FAILURES=$((CRITICAL_FAILURES + 1)); fi

          if [ $CRITICAL_FAILURES -eq 0 ]; then
            echo "✅ **Overall Status**: Security scans completed successfully" >> $GITHUB_STEP_SUMMARY
            echo "🛡️ **Assessment**: Application security posture is good" >> $GITHUB_STEP_SUMMARY
          elif [ $CRITICAL_FAILURES -eq 1 ]; then
            echo "⚠️ **Overall Status**: Minor security issues detected" >> $GITHUB_STEP_SUMMARY
            echo "🔧 **Assessment**: Address findings and re-scan" >> $GITHUB_STEP_SUMMARY
          else
            echo "🚨 **Overall Status**: Multiple security concerns detected" >> $GITHUB_STEP_SUMMARY
            echo "⚡ **Assessment**: Immediate security review required" >> $GITHUB_STEP_SUMMARY
          fi

          # Action Items
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Recommended Actions" >> $GITHUB_STEP_SUMMARY

          if [ $CRITICAL_FAILURES -gt 0 ]; then
            echo "1. 🚨 **Immediate**: Review and address security findings" >> $GITHUB_STEP_SUMMARY
            echo "2. 🔧 **Fix**: Update vulnerable dependencies" >> $GITHUB_STEP_SUMMARY
            echo "3. 🔒 **Secure**: Remove any exposed secrets" >> $GITHUB_STEP_SUMMARY
            echo "4. ✅ **Verify**: Re-run security scan after fixes" >> $GITHUB_STEP_SUMMARY
          else
            echo "1. ✅ **Monitor**: Continue regular security scanning" >> $GITHUB_STEP_SUMMARY
            echo "2. 📚 **Educate**: Keep team updated on security best practices" >> $GITHUB_STEP_SUMMARY
            echo "3. 🔄 **Automate**: Consider adding pre-commit security hooks" >> $GITHUB_STEP_SUMMARY
          fi

          # Next Scan Schedule
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📅 Next Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "- **Scheduled**: Every Monday at 2 AM UTC" >> $GITHUB_STEP_SUMMARY
          echo "- **Automatic**: On every PR and main branch push" >> $GITHUB_STEP_SUMMARY
          echo "- **Manual**: Available via workflow dispatch" >> $GITHUB_STEP_SUMMARY

  # ======================================================================
  # SECURITY GATE - sets commit status based on scan results
  # ======================================================================
  # This job evaluates all scan results and sets a 'security-scan' commit
  # status that can be used as a required status check for branch protection.
  #
  # Policy:
  #   - Secret scan (Gitleaks) failure -> always blocks merge (status: failure)
  #   - SAST/dependency HIGH/CRITICAL findings -> blocks merge unless PR has
  #     'security-override' label
  #   - All clean or only LOW/MEDIUM findings -> passes (status: success)
  # ======================================================================

  security-gate:
    name: "Security Gate"
    # ubuntu-latest: no pnpm/monorepo setup needed — runs github-script (Node) only (LS-3572)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [security-scan-plan, dependency-scan, secret-detection, sast-scan]
    if: always()

    steps:
      - name: "Evaluate Security Gate"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Prefer the PR head SHA over context.sha (which may be the
            // synthetic merge commit for PR runs).
            const sha = context.payload?.pull_request?.head?.sha || context.sha;
            if (!sha) {
              core.warning('No SHA available - skipping commit status');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Collect scan results from upstream jobs.
            // NOTE: Upstream scan jobs use continue-on-error and || true, which
            // means job results may be 'success' even when findings are detected.
            // TODO: Add explicit outputs to scan jobs (e.g., vuln counts, leak
            // status) and drive gate decisions off those outputs instead.
            const secretResult = '${{ needs.secret-detection.result }}';
            const depResult = '${{ needs.dependency-scan.result }}';
            const sastResult = '${{ needs.sast-scan.result }}';

            core.info(`Secret detection: ${secretResult}`);
            core.info(`Dependency scan: ${depResult}`);
            core.info(`SAST scan: ${sastResult}`);

            // Check for security-override label on the PR.
            // Collect PR numbers from different event shapes:
            // - pull_request events: context.payload.pull_request.number
            // - merge_group events: parse from merge_group.head_ref (format: refs/heads/gh-readonly-queue/<base>/pr-<num>-...)
            // - push/other events with pull_requests array: context.payload.pull_requests[*].number
            let hasOverrideLabel = false;
            const prNumbers = [];

            const directPrNumber = context.payload?.pull_request?.number;
            if (typeof directPrNumber === 'number') {
              prNumbers.push(directPrNumber);
            }

            // merge_group events don't include a pull_requests array; derive
            // the PR number from the head_ref instead.
            const mergeGroupHeadRef = context.payload?.merge_group?.head_ref;
            if (typeof mergeGroupHeadRef === 'string') {
              const prMatch = mergeGroupHeadRef.match(/\/pr-(\d+)-/);
              if (prMatch) {
                prNumbers.push(parseInt(prMatch[1], 10));
              }
            }

            const relatedPullRequests = context.payload?.pull_requests;
            if (Array.isArray(relatedPullRequests)) {
              for (const pr of relatedPullRequests) {
                if (pr && typeof pr.number === 'number') {
                  prNumbers.push(pr.number);
                }
              }
            }

            const uniquePrNumbers = [...new Set(prNumbers)];

            if (uniquePrNumbers.length === 0) {
              core.info('No associated pull requests found for security-override evaluation.');
            } else {
              for (const prNumber of uniquePrNumbers) {
                try {
                  const { data: pr } = await github.rest.pulls.get({
                    owner,
                    repo,
                    pull_number: prNumber,
                  });
                  const prHasOverride = Array.isArray(pr.labels) && pr.labels.some(l => l && l.name === 'security-override');
                  if (prHasOverride) {
                    hasOverrideLabel = true;
                    core.info(`PR #${prNumber} has security-override label`);
                    break;
                  }
                } catch (e) {
                  core.warning(`Failed to fetch PR #${prNumber} labels: ${e.message}`);
                }
              }
            }

            // Determine gate outcome
            let state = 'success';
            let description = 'All security scans passed';
            const failures = [];

            // Rule 1: Secret scan (Gitleaks) failure ALWAYS blocks - no override
            if (secretResult === 'failure') {
              state = 'failure';
              failures.push('secret detection');
            }

            // Rule 2: SAST/dependency HIGH/CRITICAL findings block unless overridden
            const hasSastOrDepFailure = depResult === 'failure' || sastResult === 'failure';
            if (hasSastOrDepFailure) {
              if (hasOverrideLabel) {
                // Override: allow merge but note it in description
                if (state !== 'failure') {
                  description = 'Security findings overridden via security-override label';
                }
                core.warning('SAST/dependency failures overridden by security-override label');
              } else {
                state = 'failure';
                if (depResult === 'failure') failures.push('dependency scan');
                if (sastResult === 'failure') failures.push('SAST scan');
              }
            }

            // Build final description
            if (state === 'failure') {
              description = `Blocked: ${failures.join(', ')} failed`;
            } else if (hasOverrideLabel && hasSastOrDepFailure) {
              description = 'Security findings overridden via security-override label';
            }

            // Cancelled scans are treated as failures — cancellation can bypass
            // the merge gate and should not be counted as "skipped".
            const anyCancelled = [secretResult, depResult, sastResult].some(
              r => r === 'cancelled'
            );
            if (anyCancelled && state !== 'failure') {
              state = 'failure';
              description = 'Blocked: one or more security scans were cancelled';
            }

            // Handle skipped scans - if all scans were skipped, still pass
            const allSkipped = [secretResult, depResult, sastResult].every(
              r => r === 'skipped'
            );
            if (allSkipped) {
              description = 'All security scans were skipped';
            }

            core.info(`Setting commit status: ${state} - ${description}`);

            // Set the commit status
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha,
              state,
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              description,
              context: 'security-scan',
            });

            core.info(`Commit status 'security-scan' set to '${state}' on ${sha}`);

            // Fail the job if gate failed (makes the workflow result reflect the gate)
            if (state === 'failure') {
              core.setFailed(`Security gate failed: ${description}`);
            }
