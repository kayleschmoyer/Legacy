name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - lib/shared-components/**
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

# Cancel in-progress deployments for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build and Deploy Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup NPM
        uses: ./.github/workflows/setup-npm

      - name: Configure Basic Nx Environment
        shell: bash
        run: |
          echo "🔧 Configuring basic Nx environment for web deployment..."
          # Set conservative local settings for deployment builds
          {
            echo "NX_CLOUD_DISTRIBUTED_EXECUTION=false"
            echo "NX_LOCAL_FALLBACK=true"
            echo "NX_PARALLEL=2"
            echo "NX_DAEMON=false"
            echo "NX_VERBOSE_LOGGING=false"
            echo "NX_CLOUD_ACCESS_TOKEN="
          } >> "$GITHUB_ENV"
          echo "✅ Basic Nx environment configured for web deployment"

      - name: Build Web App
        run: npx nx build web

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/apps/web

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
