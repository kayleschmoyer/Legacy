name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - lib/shared-components/**
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

# Cancel in-progress deployments for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # Required for creating releases
  pages: write
  id-token: write

env:
  NX_DAEMON: false
  NX_PARALLEL: 2
  NX_CACHE_DIRECTORY: .nx-cache
  NX_SKIP_NX_CACHE: false
  NODE_OPTIONS: "--max_old_space_size=4096"
  NX_NO_CLOUD: true

jobs:
  setup:
    name: Setup and Version
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      commit_sha: ${{ steps.version.outputs.commit_sha }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Extract Version Info
        id: version
        run: |
          VERSION=$(node -p "require('./apps/web/package.json').version")
          COMMIT_SHA=${GITHUB_SHA:0:7}
          BUILD_NUMBER=$(date +%Y%m%d_%H%M%S)

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

  build-and-deploy:
    name: Build and Deploy Web
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    needs: setup
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      deployment_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: true
          skip-system-deps: true

      - name: Build Web App
        env:
          VITE_OAUTH_PROXY_URL: ${{ secrets.VITE_OAUTH_PROXY_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GRAPHQL_HOST: ${{ secrets.VITE_GRAPHQL_HOST }}
          VITE_WEBSOCKET_URL: ${{ secrets.VITE_WEBSOCKET_URL }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}
          VITE_ROLLBAR_ACCESS_TOKEN: ${{ secrets.VITE_ROLLBAR_ACCESS_TOKEN }}
          VITE_VERSION: ${{ needs.setup.outputs.version }}
          VITE_APP_VERSION: ${{ needs.setup.outputs.version }}
          VITE_COMMIT_SHA: ${{ needs.setup.outputs.commit_sha }}
          VITE_BUILD_DATE: ${{ github.event.head_commit.timestamp }}
          VITE_BRANCH: ${{ github.ref_name }}
          # Rollbar sourcemap upload
          ROLLBAR_ACCESS_TOKEN: ${{ secrets.ROLLBAR_ACCESS_TOKEN }}
          NODE_ENV: production
        run: |
          # Derive jira proxy URL from the same API base as GraphQL
          # (same API Gateway custom domain, different path)
          export VITE_JIRA_PROXY_URL="${VITE_GRAPHQL_HOST%/graphql}/jira"

          # Display version information
          echo "📋 Version Information:"
          echo "  Version: ${{ needs.setup.outputs.version }}"
          echo "  Commit: ${{ needs.setup.outputs.commit_sha }}"
          echo "  Build Number: ${{ needs.setup.outputs.build_number }}"
          echo "  Jira Proxy URL: $VITE_JIRA_PROXY_URL"

          NX_CMD="${NX_COMMAND:-}"
          if [ -z "$NX_CMD" ]; then
            if command -v pnpm >/dev/null 2>&1; then
              NX_CMD="pnpm exec nx --"
            else
              NX_CMD="pnpm exec nx"
            fi
          fi

          $NX_CMD build web --configuration=deploy

      # Add CNAME file for custom domain
      # Required when using actions/deploy-pages (artifact-based deployment)
      # GitHub can't auto-create this since we're not using a branch
      - name: Add CNAME for Custom Domain
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p ./dist/apps/web
          echo "legacy-fantasy.com" > ./dist/apps/web/CNAME
          echo "✅ CNAME file created for legacy-fantasy.com"

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/apps/web

      - name: "📡 Rollbar Deploy Started"
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/rollbar-deploy
        with:
          rollbar-access-token: ${{ secrets.ROLLBAR_ACCESS_TOKEN }}
          environment: production
          status: started
          comment: "Web deploy via GitHub Pages (run ${{ github.run_id }})"

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v5

      - name: "📡 Rollbar Deploy Succeeded"
        if: github.ref == 'refs/heads/main' && success()
        uses: ./.github/actions/rollbar-deploy
        with:
          rollbar-access-token: ${{ secrets.ROLLBAR_ACCESS_TOKEN }}
          environment: production
          status: succeeded
          comment: "Web deploy via GitHub Pages (run ${{ github.run_id }})"

      - name: "📡 Rollbar Deploy Failed"
        if: github.ref == 'refs/heads/main' && failure()
        uses: ./.github/actions/rollbar-deploy
        with:
          rollbar-access-token: ${{ secrets.ROLLBAR_ACCESS_TOKEN }}
          environment: production
          status: failed
          comment: "Web deploy via GitHub Pages (run ${{ github.run_id }})"

      - name: "Discord Deploy Succeeded"
        if: github.ref == 'refs/heads/main' && success()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: success
          title: "Web Deploy"
          environment: production
          description: "Web app deployed to GitHub Pages"

      - name: "Discord Deploy Failed"
        if: always() && github.ref == 'refs/heads/main' && failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: failure
          title: "Web Deploy"
          environment: production
          description: "Web app deployment failed"

      - name: Update Deployment Badge
        if: always()
        uses: ./.github/actions/update-deployment-badge
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          gist-id: ${{ secrets.CI_BADGES_GIST_ID }}
          deployment-name: "Web"
          deployment-status: ${{ job.status }}
          workflow-run-id: ${{ github.run_id }}
          branch: ${{ github.ref_name }}

  create-release:
    name: Create GitHub Release
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    needs: [setup, build-and-deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Release creation is non-critical — don't fail the overall deploy
    continue-on-error: true

    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web-v${{ needs.setup.outputs.version }}-${{ needs.setup.outputs.build_number }}
          target_commitish: ${{ github.sha }}
          name: "Web Release v${{ needs.setup.outputs.version }} (${{ needs.setup.outputs.commit_sha }})"
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: "true"
          body: |
            ## 🌐 Web Application Release

            **Version:** ${{ needs.setup.outputs.version }}  
            **Build Number:** ${{ needs.setup.outputs.build_number }}  
            **Commit:** ${{ needs.setup.outputs.commit_sha }}

            ### 🚀 Deployment
            - **Live URL:** ${{ needs.build-and-deploy.outputs.deployment_url }}
            - **Custom Domain:** https://legacy-fantasy.com
            - **Platform:** GitHub Pages

            ### 📦 Build Information
            - **Framework:** React + Vite
            - **UI Library:** Tamagui
            - **State Management:** Apollo Client (GraphQL)
            - **Source Maps:** Uploaded to Rollbar

            ### 🔗 Access
            Visit the live application at:
            - Production: https://legacy-fantasy.com
            - GitHub Pages: ${{ needs.build-and-deploy.outputs.deployment_url }}

  notify-release:
    name: Discord Release Summary
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    needs: [setup, build-and-deploy, create-release]
    # Only notify when both deploy and release creation succeeded.
    # This avoids posting links to non-existent or failed releases.
    if: >-
      !cancelled() &&
      needs.build-and-deploy.result == 'success' &&
      needs.create-release.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Checkout (for commit history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build commit changelog
        id: changelog
        shell: bash
        env:
          RELEASE_TAG: web-v${{ needs.setup.outputs.version }}-${{ needs.setup.outputs.build_number }}
        run: |
          # Find the previous web release tag
          PREV_TAG=$(git tag --list 'web-v*' --sort=-version:refname | grep -v "^${RELEASE_TAG}$" | head -n 1)

          if [ -n "$PREV_TAG" ]; then
            echo "Commits since ${PREV_TAG}:"
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:'[`%h`](https://github.com/${{ github.repository }}/commit/%H) %s' --first-parent -20)
          else
            echo "No previous web release tag found — showing last 20 commits"
            COMMITS=$(git log --pretty=format:'[`%h`](https://github.com/${{ github.repository }}/commit/%H) %s' --first-parent -20)
          fi

          # Write to multiline output
          {
            echo "commits<<CHANGELOG_EOF"
            echo "$COMMITS"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post Release Summary
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          VERSION: ${{ needs.setup.outputs.version }}
          BUILD_NUMBER: ${{ needs.setup.outputs.build_number }}
          COMMIT_SHA: ${{ needs.setup.outputs.commit_sha }}
          RELEASE_TAG: web-v${{ needs.setup.outputs.version }}-${{ needs.setup.outputs.build_number }}
          COMMITS: ${{ steps.changelog.outputs.commits }}
        run: |
          # Skip if webhook URL is not configured
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_RELEASE_WEBHOOK_URL not set — skipping notification"
            exit 0
          fi

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${COMMIT_SHA}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Build fields array with jq
          FIELDS="[]"
          FIELDS=$(echo "$FIELDS" | jq \
            --arg version "${VERSION}-${BUILD_NUMBER}" \
            '. + [{"name": "Version", "value": $version, "inline": true}]')
          FIELDS=$(echo "$FIELDS" | jq \
            '. + [{"name": "Platform", "value": "Web", "inline": true}]')
          FIELDS=$(echo "$FIELDS" | jq \
            --arg sha "[\`${SHORT_SHA}\`](${COMMIT_URL})" \
            '. + [{"name": "Commit", "value": $sha, "inline": true}]')

          # Append commit changelog if available (truncate to 1000 chars for Discord field limit)
          if [ -n "$COMMITS" ]; then
            COMMIT_TEXT="$COMMITS"
            if [ ${#COMMIT_TEXT} -gt 1000 ]; then
              COMMIT_TEXT="${COMMIT_TEXT:0:1000}…"
            fi
            FIELDS=$(echo "$FIELDS" | jq \
              --arg commits "$COMMIT_TEXT" \
              '. + [{"name": "Changes", "value": $commits, "inline": false}]')
          fi

          PAYLOAD=$(jq -n \
            --arg title "Web Release v${VERSION}-${BUILD_NUMBER}" \
            --arg desc "A new Web release has been published. [View on GitHub](${RELEASE_URL})" \
            --argjson fields "$FIELDS" \
            --arg actor "${{ github.actor }}" \
            --arg timestamp "$TIMESTAMP" \
            '{
              thread_name: $title,
              embeds: [{
                title: $title,
                description: $desc,
                color: 5793266,
                fields: $fields,
                timestamp: $timestamp,
                footer: { text: ("Released by " + $actor + " • Legacy Sports") }
              }]
            }')

          HTTP_CODE=$(curl --connect-timeout 5 --max-time 15 --retry 3 --retry-all-errors \
            -s -o /tmp/discord-response.txt -w "%{http_code}" \
            -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Discord release summary sent for ${RELEASE_TAG} (http=$HTTP_CODE)"
          else
            RESPONSE=$(cat /tmp/discord-response.txt 2>/dev/null || echo "(empty)")
            echo "::warning::Discord release summary failed (http=$HTTP_CODE): $RESPONSE"
          fi

          rm -f /tmp/discord-response.txt
