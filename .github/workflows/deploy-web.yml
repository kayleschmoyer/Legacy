name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - lib/shared-components/**
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

# Cancel in-progress deployments for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

env:
  NX_DAEMON: false
  NX_PARALLEL: 2
  NX_CACHE_DIRECTORY: .nx-cache
  NX_SKIP_NX_CACHE: false
  NODE_OPTIONS: "--max_old_space_size=4096"
  # NX_CLOUD_ACCESS_TOKEN set conditionally in build step based on DTE availability

jobs:
  build-and-deploy:
    name: Build and Deploy Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          set-nx-shas: true

      - name: "☁️ Detect DTE Availability"
        id: detect-dte
        uses: ./.github/actions/detect-dte
        with:
          nx-cloud-token: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

      - name: "☁️ Start Nx Cloud CI Run"
        if: steps.detect-dte.outputs.dte-available == 'true'
        run: |
          echo "🚀 Starting Nx Cloud DTE with ${{ steps.detect-dte.outputs.optimal-agents }} agents..."
          if command -v pnpm >/dev/null 2>&1; then
            pnpm exec nx-cloud start-ci-run --distribute-on="${{ steps.detect-dte.outputs.optimal-agents }} linux-medium-js"
          else
            pnpm exec nx-cloud start-ci-run --distribute-on="${{ steps.detect-dte.outputs.optimal-agents }} linux-medium-js"
          fi
          echo "✅ DTE session started"

      - name: Build Web App
        env:
          VITE_OAUTH_PROXY_URL: ${{ secrets.VITE_OAUTH_PROXY_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GRAPHQL_HOST: ${{ secrets.VITE_GRAPHQL_HOST }}
          VITE_APP_VERSION: ${{ github.ref_name }}-${{ github.run_number }}
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_USE_CUSTOM_DOMAIN: "true"
          # Only set Nx Cloud token if DTE is available, otherwise unset to avoid quota errors
          NX_CLOUD_ACCESS_TOKEN: ${{ steps.detect-dte.outputs.dte-available == 'true' && secrets.NX_CLOUD_ACCESS_TOKEN || '' }}
        run: |
          NX_CMD="${NX_COMMAND:-}"
          if [ -z "$NX_CMD" ]; then
            if command -v pnpm >/dev/null 2>&1; then
              NX_CMD="pnpm exec nx --"
            else
              NX_CMD="pnpm exec nx"
            fi
          fi

          $NX_CMD build web --configuration=deploy

      # Add CNAME file for custom domain
      # Required when using actions/deploy-pages (artifact-based deployment)
      # GitHub can't auto-create this since we're not using a branch
      - name: Add CNAME for Custom Domain
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p ./dist/apps/web
          echo "legacy-fantasy.com" > ./dist/apps/web/CNAME
          echo "✅ CNAME file created for legacy-fantasy.com"

      - name: "🛑 Stop Nx Cloud Agents"
        if: always() && steps.detect-dte.outputs.dte-available == 'true'
        run: |
          echo "🛑 Stopping Nx Cloud DTE agents..."
          if command -v pnpm >/dev/null 2>&1; then
            pnpm exec nx-cloud stop-all-agents || echo "⚠️ Failed to stop agents (they may have already stopped)"
          else
            pnpm exec nx-cloud stop-all-agents || echo "⚠️ Failed to stop agents (they may have already stopped)"
          fi
          echo "✅ Agent cleanup complete"

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/apps/web

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Update Deployment Badge
        if: always()
        uses: ./.github/actions/update-deployment-badge
        with:
          github-token: ${{ secrets.GIST_TOKEN }}
          gist-id: ${{ secrets.CI_BADGES_GIST_ID }}
          deployment-name: "Web"
          deployment-status: ${{ job.status }}
          workflow-run-id: ${{ github.run_id }}
          branch: ${{ github.ref_name }}
