name: Copilot Auto-Approve

# Workflow jobs:
# 1. request-review: sets bot-review status when a PR is opened or updated.
#    Copilot review is triggered automatically by the repository ruleset
#    ("Copilot review for default branch" with review_on_push: true).
#    The requestReviewers REST API silently drops Copilot when called with
#    any installation token (App or GITHUB_TOKEN) — only user OAuth tokens
#    work, so we rely on the ruleset instead.
# 2. auto-approve: approves the PR when Copilot's review has no unresolved comments
# 3. delayed-recheck: on synchronize events, waits 3 min then dispatches a recheck
#    if bot-review is still PENDING (guards against Copilot not re-reviewing)
#
# The auto-approve job uses workflow_run to chain off the built-in "Copilot code review"
# workflow. This bypasses GitHub's anti-recursion rule which prevents events from
# GitHub Apps (like Copilot) from triggering workflows via pull_request_review.
#
# Uses a GitHub App (ID: 3142924) for bot identity.
# Requires BOT_APP_PRIVATE_KEY secret containing the app's PEM private key.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: ["Copilot code review"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to recheck bot-review status"
        required: true
        type: number

permissions:
  pull-requests: write
  contents: read
  statuses: write

jobs:
  request-review:
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Auto-pass bot-review for dependabot PRs
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: actions/github-script@v8
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'success',
              context: 'bot-review',
              description: 'Copilot review skipped for dependabot PRs',
            });
            core.info(`Auto-passed bot-review for dependabot PR #${context.payload.pull_request.number}`);

      - name: Generate bot token
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: 3142924
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      # Copilot review is requested automatically by the repository ruleset
      # ("Copilot review for default branch" with review_on_push: true).
      # No explicit requestReviewers call is needed.

      - name: Set bot-review status
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.bot-token.outputs.token }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;

            // On synchronize (rebase/force-push), check if Copilot already has
            // a clean review. The "Copilot code review" built-in workflow may not
            // re-trigger after a force-push, which would leave bot-review stuck
            // at PENDING forever. Carry forward success if the review is clean.
            if (context.payload.action === 'synchronize') {
              try {
                const reviews = await github.rest.pulls.listReviews({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                });
                const copilotReviewLogins = [
                  'copilot-pull-request-reviewer[bot]',
                  'Copilot',
                ];
                // Filter to Copilot reviews and sort by most recent first
                const copilotReviews = reviews.data
                  .filter(r => copilotReviewLogins.includes(r.user.login))
                  .sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at));

                if (copilotReviews.length > 0) {
                  const latest = copilotReviews[0];
                  let carryForward = false;

                  // If latest Copilot review explicitly approved, old threads
                  // are superseded — carry forward immediately.
                  if (latest.state === 'APPROVED') {
                    core.info('Latest Copilot review is APPROVED — carrying forward');
                    carryForward = true;
                  } else {
                    // Latest Copilot review is not APPROVED — check threads
                    // (threads may have been resolved or become outdated since the last review)
                    const copilotLogins = [
                      'copilot-pull-request-reviewer',
                      'copilot-pull-request-reviewer[bot]',
                      'Copilot',
                    ];
                    let allThreads = [];
                    let hasNextPage = true;
                    let cursor = null;
                    while (hasNextPage) {
                      const result = await github.graphql(`
                        query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                          repository(owner: $owner, name: $repo) {
                            pullRequest(number: $number) {
                              reviewThreads(first: 100, after: $cursor) {
                                pageInfo { hasNextPage endCursor }
                                nodes {
                                  isResolved
                                  isOutdated
                                  comments(first: 1) {
                                    nodes { author { login } }
                                  }
                                }
                              }
                            }
                          }
                        }
                      `, {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        number: prNumber,
                        cursor,
                      });
                      const threads = result.repository.pullRequest.reviewThreads;
                      allThreads.push(...threads.nodes);
                      hasNextPage = threads.pageInfo.hasNextPage;
                      cursor = threads.pageInfo.endCursor;
                    }

                    const unresolvedThreads = allThreads.filter(t =>
                      !t.isOutdated &&
                      !t.isResolved &&
                      t.comments.nodes.some(c => copilotLogins.includes(c.author.login))
                    );

                    if (unresolvedThreads.length === 0) {
                      carryForward = true;
                    } else {
                      core.info(`Copilot has ${unresolvedThreads.length} unresolved thread(s) — setting pending`);
                    }
                  }

                  if (carryForward) {
                    await github.rest.repos.createCommitStatus({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      sha,
                      state: 'success',
                      context: 'bot-review',
                      description: 'Copilot review passed — carried forward after rebase',
                    });
                    // Also ensure the PR is approved and labeled — the auto-approve
                    // job may not re-fire after a rebase if the Copilot workflow doesn't re-run.
                    const botReviews = reviews.data.filter(r =>
                      r.user.login === 'legacy-sports-review-bot[bot]' && r.state === 'APPROVED'
                    );
                    if (botReviews.length === 0) {
                      try {
                        await github.rest.pulls.createReview({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          pull_number: prNumber,
                          event: 'APPROVE',
                          body: 'Auto-approved: Copilot review clean after rebase.',
                        });
                      } catch (e) {
                        core.warning(`Carry-forward approval failed: ${e.message}`);
                      }
                    }
                    try {
                      await github.rest.issues.addLabels({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: prNumber,
                        labels: ['merge-when-ready'],
                      });
                    } catch (e) {
                      core.warning(`Carry-forward labeling failed: ${e.message}`);
                    }
                    core.info(`Carried forward success + approval for PR #${prNumber}`);
                    return;
                  }
                }
              } catch (error) {
                core.warning(`Carry-forward check failed: ${error.message} — falling back to pending`);
              }
            }

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'pending',
              context: 'bot-review',
              description: 'Waiting for Copilot review to complete',
            });

  review-check:
    # Runs when any review is submitted (including Copilot). Checks thread state
    # and approves if all Copilot threads are resolved. This closes the gap where
    # threads are fixed and resolved after the "Copilot code review" workflow
    # already completed — without this, auto-approve would never re-fire.
    if: >-
      github.event_name == 'pull_request_review' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: 3142924
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Check threads and approve if clean
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.bot-token.outputs.token }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;

            // Must have at least one Copilot review before we can approve
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const copilotReviewLogins = ['copilot-pull-request-reviewer[bot]', 'Copilot'];
            const copilotLogins = ['copilot-pull-request-reviewer', 'copilot-pull-request-reviewer[bot]', 'Copilot'];
            const copilotReviews = reviews.data
              .filter(r => copilotReviewLogins.includes(r.user.login));
            if (copilotReviews.length === 0) {
              core.info('No Copilot reviews yet — skipping');
              return;
            }

            // Sort by most recent first
            const sorted = copilotReviews.sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at));
            const latest = sorted[0];

            // If latest Copilot review explicitly approved, old threads are
            // superseded — skip thread check entirely.
            if (latest.state === 'APPROVED') {
              core.info('Latest Copilot review is APPROVED — old threads superseded');
              // Fall through to set success + approve + label below
            } else {
              // Latest Copilot review is not APPROVED — check threads
              // (threads may have been resolved or become outdated since the last review)
              let allThreads = [];
              let hasNextPage = true;
              let cursor = null;
              while (hasNextPage) {
                const result = await github.graphql(`
                  query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        reviewThreads(first: 100, after: $cursor) {
                          pageInfo { hasNextPage endCursor }
                          nodes {
                            isResolved
                            isOutdated
                            comments(first: 1) {
                              nodes { author { login } }
                            }
                          }
                        }
                      }
                    }
                  }
                `, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  number: prNumber,
                  cursor,
                });
                const threads = result.repository.pullRequest.reviewThreads;
                allThreads.push(...threads.nodes);
                hasNextPage = threads.pageInfo.hasNextPage;
                cursor = threads.pageInfo.endCursor;
              }

              const unresolvedThreads = allThreads.filter(t =>
                !t.isOutdated &&
                !t.isResolved &&
                t.comments.nodes.some(c => copilotLogins.includes(c.author.login))
              );

              if (unresolvedThreads.length > 0) {
                core.info(`${unresolvedThreads.length} unresolved Copilot thread(s) — not approving`);
                await github.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha,
                  state: 'failure',
                  context: 'bot-review',
                  description: `Copilot review has ${unresolvedThreads.length} unresolved comment(s)`,
                });
                return;
              }
            }

            // All threads resolved or superseded — set bot-review success
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'success',
              context: 'bot-review',
              description: 'Copilot review passed — all threads resolved',
            });

            // Check if already approved by the bot to avoid duplicate approvals
            const botReviews = reviews.data.filter(r =>
              r.user.login === 'legacy-sports-review-bot[bot]' && r.state === 'APPROVED'
            );
            if (botReviews.length > 0) {
              core.info('Already approved by bot — just ensuring label');
            } else {
              // Approve the PR
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                event: 'APPROVE',
                body: 'Auto-approved: all Copilot review threads resolved.',
              });
              core.info(`Approved PR #${prNumber}`);
            }

            // Ensure merge-when-ready label
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['merge-when-ready'],
              });
              core.info(`Labeled PR #${prNumber} merge-when-ready`);
            } catch (e) {
              core.warning(`Failed to add label: ${e.message}`);
            }

  auto-approve:
    # Runs when the built-in "Copilot code review" workflow completes for a PR
    if: github.event_name == 'workflow_run'
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Get PR number
        id: pr
        uses: actions/github-script@v8
        with:
          script: |
            // workflow_run.pull_requests may be empty for cross-repo PRs
            const prs = context.payload.workflow_run.pull_requests;
            if (prs && prs.length > 0) {
              core.setOutput('number', prs[0].number.toString());
              core.info(`Found PR #${prs[0].number} from workflow_run payload`);
              return;
            }
            // Fallback: Copilot's head_branch is "refs/pull/N/head" — extract PR number directly
            const headBranch = context.payload.workflow_run.head_branch || '';
            const prMatch = headBranch.match(/^refs\/pull\/(\d+)\/head$/);
            if (prMatch) {
              const prNum = prMatch[1];
              // Verify the PR is still open and the reviewed SHA matches
              try {
                const { data: pr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: parseInt(prNum, 10),
                });
                const reviewedSha = context.payload.workflow_run.head_sha;
                if (pr.state !== 'open') {
                  core.info(`PR #${prNum} is ${pr.state} — skipping`);
                } else if (reviewedSha && pr.head.sha !== reviewedSha) {
                  core.info(`PR #${prNum} head SHA changed since review (${reviewedSha} → ${pr.head.sha}) — skipping`);
                } else {
                  core.setOutput('number', prNum);
                  core.info(`Found PR #${prNum} from head_branch ref`);
                  return;
                }
              } catch (e) {
                core.warning(`PR #${prNum} lookup failed: ${e instanceof Error ? e.message : String(e)}`);
              }
            }
            core.setOutput('number', '');
            core.warning(`Could not resolve PR from head_branch: ${headBranch}`);

      - name: Set failure status for non-successful Copilot review
        if: >-
          steps.pr.outputs.number != '' &&
          github.event.workflow_run.conclusion != 'success'
        uses: actions/github-script@v8
        with:
          script: |
            const conclusion = '${{ github.event.workflow_run.conclusion }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.workflow_run.head_sha }}',
              state: 'failure',
              context: 'bot-review',
              description: `Copilot review ${conclusion} — re-push to retry`,
            });

      - name: Generate bot token
        if: >-
          steps.pr.outputs.number != '' &&
          github.event.workflow_run.conclusion == 'success'
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: 3142924
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Check for review comments and review state
        if: >-
          steps.pr.outputs.number != '' &&
          github.event.workflow_run.conclusion == 'success'
        id: check
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.bot-token.outputs.token }}
          script: |
            const prNumber = parseInt('${{ steps.pr.outputs.number }}', 10);
            const currentSha = '${{ github.event.workflow_run.head_sha }}';
            const copilotReviewLogins = ['copilot-pull-request-reviewer[bot]', 'Copilot'];
            const copilotLogins = ['copilot-pull-request-reviewer', 'copilot-pull-request-reviewer[bot]', 'Copilot'];

            // Check if the latest Copilot review already signals a clean pass.
            // When Copilot re-reviews after a fix-push, it may submit a new
            // APPROVED review — or it may not submit a new review at all (the
            // workflow just completes successfully). In either case, old
            // unresolved threads from a prior CHANGES_REQUESTED review are
            // superseded and should not block bot-review.
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const copilotReviews = reviews.data
              .filter(r => copilotReviewLogins.includes(r.user.login))
              .sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at));

            if (copilotReviews.length > 0) {
              const latest = copilotReviews[0];
              // Case 1: Copilot explicitly approved — threads are superseded.
              // Note: Copilot never uses "approve with comments" — it either
              // APPROVED (clean) or COMMENTED (with threads), so this is safe.
              if (latest.state === 'APPROVED') {
                core.setOutput('has_comments', 'false');
                core.info('Latest Copilot review is APPROVED — old threads superseded');
                return;
              }
              // Case 2: Copilot's latest review is on an older commit, but the
              // workflow just completed successfully for the current HEAD. This
              // means Copilot re-reviewed the new code and raised no new issues
              // (it didn't submit a new CHANGES_REQUESTED). Old threads from
              // the prior review cycle are superseded.
              if (latest.commit_id !== currentSha) {
                core.setOutput('has_comments', 'false');
                core.info(`Latest Copilot review is on ${latest.commit_id.slice(0, 7)}, current HEAD is ${currentSha.slice(0, 7)} — old review superseded by clean workflow run`);
                return;
              }
            }

            // Latest Copilot review is CHANGES_REQUESTED on the current commit —
            // fall through to thread check (threads may have been resolved since).

            // Check for unresolved Copilot review threads
            let allThreads = [];
            let hasNextPage = true;
            let cursor = null;

            while (hasNextPage) {
              const result = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100, after: $cursor) {
                        pageInfo {
                          hasNextPage
                          endCursor
                        }
                        nodes {
                          isResolved
                          isOutdated
                          comments(first: 1) {
                            nodes {
                              author { login }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number: prNumber,
                cursor,
              });

              const threads = result.repository.pullRequest.reviewThreads;
              allThreads.push(...threads.nodes);
              hasNextPage = threads.pageInfo.hasNextPage;
              cursor = threads.pageInfo.endCursor;
            }

            const copilotThreads = allThreads.filter(t =>
              !t.isOutdated &&
              !t.isResolved &&
              t.comments.nodes.some(c => copilotLogins.includes(c.author.login))
            );

            const hasComments = copilotThreads.length > 0;
            core.setOutput('has_comments', hasComments.toString());
            core.info(`Copilot unresolved threads: ${copilotThreads.length}`);

      - name: Set bot-review status
        if: >-
          steps.pr.outputs.number != '' &&
          github.event.workflow_run.conclusion == 'success'
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.bot-token.outputs.token }}
          script: |
            const hasComments = '${{ steps.check.outputs.has_comments }}' === 'true';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.workflow_run.head_sha }}',
              state: hasComments ? 'failure' : 'success',
              context: 'bot-review',
              description: hasComments
                ? 'Copilot review has unresolved comments'
                : 'Copilot review passed — approved',
            });

      - name: Approve PR and label for merge
        if: >-
          steps.pr.outputs.number != '' &&
          github.event.workflow_run.conclusion == 'success' &&
          steps.check.outputs.has_comments == 'false'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            --method POST \
            -f event="APPROVE" \
            -f body="Auto-approved: Copilot review completed with no comments."
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "merge-when-ready"

  recheck:
    # Triggered by workflow_dispatch (e.g., after an agent resolves review threads
    # without pushing code). Re-evaluates Copilot thread state and updates bot-review.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: 3142924
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Check threads and approve if clean
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.bot-token.outputs.token }}
          script: |
            const prNumber = parseInt('${{ inputs.pr_number }}', 10);
            if (isNaN(prNumber)) {
              core.setFailed('Invalid pr_number input');
              return;
            }

            // Get PR head SHA
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (pr.state !== 'open') {
              core.info(`PR #${prNumber} is ${pr.state} — skipping`);
              return;
            }
            const sha = pr.head.sha;

            // Must have at least one Copilot review
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const copilotReviewLogins = ['copilot-pull-request-reviewer[bot]', 'Copilot'];
            const copilotLogins = ['copilot-pull-request-reviewer', 'copilot-pull-request-reviewer[bot]', 'Copilot'];
            const copilotReviews = reviews.data
              .filter(r => copilotReviewLogins.includes(r.user.login))
              .sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at));
            if (copilotReviews.length === 0) {
              core.info('No Copilot reviews yet — skipping');
              return;
            }

            const latest = copilotReviews[0];

            // If latest Copilot review explicitly approved, old threads are
            // superseded — skip thread check entirely.
            if (latest.state === 'APPROVED') {
              core.info('Latest Copilot review is APPROVED — old threads superseded');
            } else {
              // Latest Copilot review is not APPROVED — check threads
              // (threads may have been resolved or become outdated since the last review)
              let allThreads = [];
              let hasNextPage = true;
              let cursor = null;
              while (hasNextPage) {
                const result = await github.graphql(`
                  query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        reviewThreads(first: 100, after: $cursor) {
                          pageInfo { hasNextPage endCursor }
                          nodes {
                            isResolved
                            isOutdated
                            comments(first: 1) {
                              nodes { author { login } }
                            }
                          }
                        }
                      }
                    }
                  }
                `, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  number: prNumber,
                  cursor,
                });
                const threads = result.repository.pullRequest.reviewThreads;
                allThreads.push(...threads.nodes);
                hasNextPage = threads.pageInfo.hasNextPage;
                cursor = threads.pageInfo.endCursor;
              }

              const unresolvedThreads = allThreads.filter(t =>
                !t.isOutdated &&
                !t.isResolved &&
                t.comments.nodes.some(c => copilotLogins.includes(c.author.login))
              );

              if (unresolvedThreads.length > 0) {
                core.info(`${unresolvedThreads.length} unresolved Copilot thread(s) — not approving`);
                await github.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha,
                  state: 'failure',
                  context: 'bot-review',
                  description: `Copilot review has ${unresolvedThreads.length} unresolved comment(s)`,
                });
                return;
              }
            }

            // All threads resolved or superseded — set bot-review success
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'success',
              context: 'bot-review',
              description: 'Copilot review passed — all threads resolved',
            });

            // Approve if not already approved
            const botReviews = reviews.data.filter(r =>
              r.user.login === 'legacy-sports-review-bot[bot]' && r.state === 'APPROVED'
            );
            if (botReviews.length === 0) {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                event: 'APPROVE',
                body: 'Auto-approved: all Copilot review threads resolved.',
              });
              core.info(`Approved PR #${prNumber}`);
            }

            // Ensure merge-when-ready label
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['merge-when-ready'],
              });
              core.info(`Labeled PR #${prNumber} merge-when-ready`);
            } catch (e) {
              core.warning(`Failed to add label: ${e.message}`);
            }

  delayed-recheck:
    # After a synchronize event (rebase/force-push), request-review sets
    # bot-review to PENDING. If the "Copilot code review" workflow doesn't
    # re-trigger for the new commit, bot-review stays stuck at PENDING forever.
    # This job waits 3 minutes (giving Copilot time to re-review), then checks
    # if bot-review is still PENDING and dispatches a recheck if so. If
    # auto-approve already fired via workflow_run, the status will no longer be
    # pending and this is a no-op. (See LS-1986)
    permissions:
      actions: write
      statuses: read
    concurrency:
      group: copilot-delayed-recheck-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    needs: request-review
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Wait for Copilot to potentially re-review
        run: sleep 180

      - name: Check if bot-review is still pending
        id: check
        uses: actions/github-script@v8
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
            });
            // GitHub returns statuses newest-first; find the latest bot-review
            const botReview = statuses.find(s => s.context === 'bot-review');
            const state = botReview ? botReview.state : 'unknown';
            core.setOutput('state', state);
            core.info(`Current bot-review state: ${state}`);

      - name: Dispatch recheck
        if: steps.check.outputs.state == 'pending'
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'copilot-auto-approve.yml',
              ref: context.payload.pull_request.base.ref,
              inputs: { pr_number: prNumber.toString() },
            });
            core.info(`Dispatched recheck for PR #${prNumber} (bot-review was still pending after 3m)`);
