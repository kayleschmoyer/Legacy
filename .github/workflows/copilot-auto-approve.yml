name: Copilot Auto-Approve

# Workflow jobs:
# 1. request-review: sets bot-review status when a PR is opened or updated.
#    Copilot review is triggered automatically by the repository ruleset
#    ("Copilot review for default branch" with review_on_push: true).
#    The ruleset's review_on_push only auto-triggers on force-pushes, not
#    incremental commits. To close this gap, the request-review job
#    explicitly re-requests Copilot as a reviewer on every synchronize event
#    via GITHUB_TOKEN (tested in LS-3073).
# 2. auto-approve: approves the PR when Copilot's review has no unresolved comments
# 3. delayed-recheck: on synchronize events, waits 3 min then dispatches a recheck
#    if bot-review is still PENDING or FAILED (guards against Copilot not re-reviewing,
#    and catches the case where threads became outdated after a failure was recorded)
#
# The auto-approve job uses workflow_run to chain off the built-in "Copilot code review"
# workflow. This bypasses GitHub's anti-recursion rule which prevents events from
# GitHub Apps (like Copilot) from triggering workflows via pull_request_review.
#
# Uses the Review Bot GitHub App (ID: 3142924, legacy-sports-review-bot).
# Required permissions: Pull requests (rw), Checks (rw), Issues (rw).
# Requires BOT_APP_PRIVATE_KEY secret containing the app's PEM private key.
# Note: BOT_APP_PRIVATE_KEY is unavailable for fork PRs (GitHub withholds secrets).
# Fork PRs skip bot-review check creation entirely and require maintainer action.

on:
  pull_request:
    # review_request_removed fires when Copilot finishes reviewing (either by
    # submitting a review or by being removed from reviewers without posting).
    # This gives us an event-driven "Copilot is done" signal instead of relying
    # on a timer to assume clean pass.
    types: [opened, synchronize, reopened, ready_for_review, review_request_removed]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: ["Copilot code review"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to recheck bot-review status"
        required: true
        type: number
  # Fires when the user clicks "Re-run" on the bot-review check run in the
  # GitHub UI. Without this trigger, rerequested events are silently ignored
  # and the check stays failed even after all threads are resolved.
  check_run:
    types: [rerequested]
  # NOTE: GitHub Actions does NOT support 'pull_request_review_thread' as a
  # workflow trigger. Supported pull-request-related triggers are
  # pull_request, pull_request_review, pull_request_review_comment, and
  # pull_request_target. Adding pull_request_review_thread caused this
  # workflow file to fail GitHub's expression validator entirely and
  # register with name = file path. Threads resolved without an
  # accompanying review submission must be retriggered via the
  # workflow_dispatch 'pr_number' input above.

permissions:
  pull-requests: write
  contents: read
  checks: write

jobs:
  request-review:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'review_request_removed' &&
      !github.event.pull_request.draft
    concurrency:
      group: copilot-request-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Generate bot token
        # Secrets are not available for fork PRs; skip for those.
        # Bot-authored PRs (dependabot, code-bot) always come from the same repo,
        # so the token is available for the auto-pass step below.
        if: github.event.pull_request.head.repo.full_name == github.repository
        id: bot-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        with:
          app-id: 3142924
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      # Auto-pass bot-review for PRs authored by bots that Copilot will not
      # review. Copilot silently declines to review PRs authored by GitHub
      # Apps (dependabot, legacy-sports-code-bot, etc.), so without this
      # exception the `bot-review` required check hangs forever.
      - name: Auto-pass bot-review for bot-authored PRs
        if: >-
          github.event.pull_request.user.login == 'dependabot[bot]' ||
          github.event.pull_request.user.login == 'legacy-sports-code-bot[bot]'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.bot-token.outputs.token }}
          script: |
            const sha = context.payload.pull_request.head.sha;
            const author = context.payload.pull_request.user.login;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'bot-review',
              head_sha: sha,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: 'Copilot review skipped',
                summary: `Copilot review skipped for ${author} PRs`,
              },
            });
            core.info(`Auto-passed bot-review for ${author} PR #${context.payload.pull_request.number}`);

      # Copilot review is also triggered by the repository ruleset
      # ("Copilot review for default branch" with review_on_push: true),
      # but the explicit requestReviewers call below is still needed as a backstop
      # (see comment on that step). Set COPILOT_AUTO_REVIEW_ENABLED=false to
      # disable both the explicit call and suppress the bot-review pending state.

      - name: Auto-pass bot-review when Copilot reviews disabled
        if: >-
          vars.COPILOT_AUTO_REVIEW_ENABLED == 'false' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'legacy-sports-code-bot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.bot-token.outputs.token }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'bot-review',
              head_sha: sha,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: 'Copilot review disabled',
                summary: 'Copilot review skipped — COPILOT_AUTO_REVIEW_ENABLED=false',
              },
            });
            core.info(`Auto-passed bot-review for PR #${prNumber} (Copilot disabled)`);
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['merge-when-ready'],
              });
              core.info(`Labeled PR #${prNumber} merge-when-ready`);
            } catch (e) {
              core.warning(`Failed to add merge-when-ready label: ${e.message}`);
            }

      - name: Comment on PR when Copilot reviews disabled
        if: >-
          vars.COPILOT_AUTO_REVIEW_ENABLED == 'false' &&
          (github.event.action == 'opened' || github.event.action == 'ready_for_review') &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'legacy-sports-code-bot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.bot-token.outputs.token }}
          script: |
            const prNumber = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: '> [!NOTE]\n> Copilot code review is currently disabled (`COPILOT_AUTO_REVIEW_ENABLED=false`). The `bot-review` check has been auto-passed. Human reviews are still required.',
            });
            core.info(`Posted Copilot-disabled notice on PR #${prNumber}`);

      - name: Set bot-review status
        if: >-
          vars.COPILOT_AUTO_REVIEW_ENABLED != 'false' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'legacy-sports-code-bot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          BOT_TOKEN: ${{ steps.bot-token.outputs.token }}
        with:
          github-token: ${{ steps.bot-token.outputs.token }}
          script: |
            const createCheck = async (p) => {
              const resp = await fetch(
                `https://api.github.com/repos/${p.owner}/${p.repo}/check-runs`,
                { method: 'POST', headers: { Authorization: `Bearer ${process.env.BOT_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: JSON.stringify(p) }
              );
              if (!resp.ok) throw new Error(`checks.create ${resp.status}: ${await resp.text()}`);
            };

            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;

            // On synchronize (rebase/force-push), check if Copilot already has
            // a clean review. The "Copilot code review" built-in workflow may not
            // re-trigger after a force-push, which would leave bot-review stuck
            // at PENDING forever. Carry forward success if the review is clean.
            if (context.payload.action === 'synchronize') {
              try {
                const reviews = await github.rest.pulls.listReviews({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                });
                const copilotReviewLogins = [
                  'copilot-pull-request-reviewer[bot]',
                  'Copilot',
                ];
                // Filter to Copilot reviews and sort by most recent first
                const copilotReviews = reviews.data
                  .filter(r => copilotReviewLogins.includes(r.user.login))
                  .sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at));

                if (copilotReviews.length > 0) {
                  const latest = copilotReviews[0];
                  const copilotLogins = [
                    'copilot-pull-request-reviewer',
                    'copilot-pull-request-reviewer[bot]',
                    'Copilot',
                  ];

                  // When Copilot explicitly approved or couldn't review any files, its own
                  // threads are superseded. Non-Copilot threads still block carry-forward.
                  const copilotCleared = latest.state === 'APPROVED' ||
                    (latest.body && latest.body.includes("wasn't able to review any files"));
                  if (copilotCleared) {
                    core.info(latest.state === 'APPROVED'
                      ? 'Latest Copilot review is APPROVED — Copilot threads superseded'
                      : 'Copilot had no reviewable files — Copilot threads skipped');
                  }

                  // Always fetch threads — even when Copilot approved, non-Copilot threads may block
                  let allThreads = [];
                  let hasNextPage = true;
                  let cursor = null;
                  while (hasNextPage) {
                    const result = await github.graphql(`
                      query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                        repository(owner: $owner, name: $repo) {
                          pullRequest(number: $number) {
                            reviewThreads(first: 100, after: $cursor) {
                              pageInfo { hasNextPage endCursor }
                              nodes {
                                isResolved
                                isOutdated
                                comments(first: 1) {
                                  nodes { author { login } }
                                }
                              }
                            }
                          }
                        }
                      }
                    `, {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      number: prNumber,
                      cursor,
                    });
                    const threads = result.repository.pullRequest.reviewThreads;
                    allThreads.push(...threads.nodes);
                    hasNextPage = threads.pageInfo.hasNextPage;
                    cursor = threads.pageInfo.endCursor;
                  }

                  const unresolvedThreads = allThreads.filter(t => {
                    if (t.isOutdated || t.isResolved) return false;
                    // When Copilot cleared, Copilot threads are superseded — only block on non-Copilot threads
                    if (copilotCleared) return !t.comments.nodes.some(c => copilotLogins.includes(c.author?.login));
                    return true;
                  });

                  if (unresolvedThreads.length === 0) {
                    await createCheck({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      name: 'bot-review',
                      head_sha: sha,
                      status: 'completed',
                      conclusion: 'success',
                      output: {
                        title: 'Copilot review passed',
                        summary: 'All review threads resolved — carried forward after rebase',
                      },
                    });
                    // Also ensure the PR is approved and labeled — the auto-approve
                    // job may not re-fire after a rebase if the Copilot workflow doesn't re-run.
                    const botReviews = reviews.data.filter(r =>
                      r.user.login === 'legacy-sports-review-bot[bot]' && r.state === 'APPROVED'
                    );
                    if (botReviews.length === 0) {
                      try {
                        await github.rest.pulls.createReview({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          pull_number: prNumber,
                          event: 'APPROVE',
                          body: 'Auto-approved: all review threads resolved after rebase.',
                        });
                      } catch (e) {
                        core.warning(`Carry-forward approval failed: ${e.message}`);
                      }
                    }
                    try {
                      await github.rest.issues.addLabels({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: prNumber,
                        labels: ['merge-when-ready'],
                      });
                    } catch (e) {
                      core.warning(`Carry-forward labeling failed: ${e.message}`);
                    }
                    core.info(`Carried forward success + approval for PR #${prNumber}`);
                    return;
                  } else {
                    core.info(`${unresolvedThreads.length} unresolved thread(s) — setting pending`);
                  }
                }
              } catch (error) {
                core.warning(`Carry-forward check failed: ${error.message} — falling back to pending`);
              }
            }

            await createCheck({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'bot-review',
              head_sha: sha,
              status: 'in_progress',
              output: {
                title: 'Waiting for Copilot review',
                summary: 'Waiting for Copilot review to complete',
              },
            });

      # Explicitly request Copilot as a reviewer. Two reasons it isn't enough to
      # rely on the copilot_code_review ruleset (review_on_push: true):
      #   1. On synchronize (incremental commits), the ruleset only fires on
      #      force-pushes, so without an explicit call the ruleset stays
      #      unsatisfied and the PR is permanently blocked (LS-3073).
      #   2. On opened/reopened/ready_for_review, the ruleset normally fires,
      #      but if it fails transiently (app outage, repo config drift),
      #      Copilot never enters requested_reviewers. Without this call as a
      #      backstop, bot-review would sit at in_progress forever (since the
      #      flow now requires an actual pull_request_review or
      #      review_request_removed event — no timer-based clean-pass fallback).
      #
      # requestReviewers is idempotent, so calling it when Copilot is already a
      # requested reviewer is a harmless no-op. Tested with GITHUB_TOKEN in LS-3073.
      - name: Request Copilot review (backstop for native ruleset)
        if: >-
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'legacy-sports-code-bot[bot]' &&
          vars.COPILOT_AUTO_REVIEW_ENABLED != 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                reviewers: ['copilot-pull-request-reviewer[bot]'],
              });
              core.info(`Requested Copilot review for PR #${prNumber}`);
            } catch (error) {
              core.warning(`Copilot request failed: ${error.message}`);
            }

  review-check:
    # Runs when any review is submitted (including Copilot). Checks thread state
    # and approves if all Copilot threads are resolved. This closes the gap where
    # threads are fixed and resolved after the "Copilot code review" workflow
    # already completed — without this, auto-approve would never re-fire.
    if: >-
      github.event_name == 'pull_request_review' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'legacy-sports-code-bot[bot]'
    concurrency:
      group: copilot-review-check-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        with:
          app-id: 3142924
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      # When Copilot submits a COMMENTED review, the pull_request_review event
      # fires before the review's threads have propagated to the GraphQL API.
      # Without this delay, the thread fetch below sees 0 unresolved threads and
      # incorrectly sets bot-review=success + approves the PR, even though Copilot
      # just left new comments. Non-Copilot review events (human approvals) don't
      # create new threads, so they don't need the delay.
      - name: Wait for thread propagation (Copilot-triggered reviews)
        # GitHub Actions expressions have no toLower/toLowerCase function — match
        # the two known Copilot bot logins explicitly. The unknown function name
        # poisons workflow validation and registers the file as path-named.
        # Observed propagation lag: ~12s (PR #2556). 30s provides a safe buffer.
        if: github.event.review.user.login == 'copilot-pull-request-reviewer[bot]' || github.event.review.user.login == 'Copilot'
        run: sleep 30

      - name: Check threads and approve if clean
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          BOT_TOKEN: ${{ steps.bot-token.outputs.token }}
        with:
          github-token: ${{ steps.bot-token.outputs.token }}
          script: |
            const createCheck = async (p) => {
              const resp = await fetch(
                `https://api.github.com/repos/${p.owner}/${p.repo}/check-runs`,
                { method: 'POST', headers: { Authorization: `Bearer ${process.env.BOT_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: JSON.stringify(p) }
              );
              if (!resp.ok) throw new Error(`checks.create ${resp.status}: ${await resp.text()}`);
            };

            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;

            // Must have at least one Copilot review before we can approve
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const copilotReviewLogins = ['copilot-pull-request-reviewer[bot]', 'Copilot'];
            const copilotLogins = ['copilot-pull-request-reviewer', 'copilot-pull-request-reviewer[bot]', 'Copilot'];
            const copilotReviews = reviews.data
              .filter(r => copilotReviewLogins.includes(r.user.login));
            if (copilotReviews.length === 0) {
              core.info('No Copilot reviews yet — skipping');
              return;
            }

            // Sort by most recent first
            const sorted = copilotReviews.sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at));
            const latest = sorted[0];

            // When Copilot explicitly approved or couldn't review any files, its own
            // threads are superseded. Non-Copilot threads still block approval.
            const copilotCleared = latest.state === 'APPROVED' ||
              (latest.body && latest.body.includes("wasn't able to review any files"));
            if (copilotCleared) {
              core.info(latest.state === 'APPROVED'
                ? 'Latest Copilot review is APPROVED — Copilot threads superseded'
                : 'Copilot had no reviewable files — Copilot threads skipped');
            }

            // Always fetch threads — even when Copilot approved, non-Copilot threads may still be open
            let allThreads = [];
            let hasNextPage = true;
            let cursor = null;
            while (hasNextPage) {
              const result = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100, after: $cursor) {
                        pageInfo { hasNextPage endCursor }
                        nodes {
                          isResolved
                          isOutdated
                          comments(first: 1) {
                            nodes { author { login } }
                          }
                        }
                      }
                    }
                  }
                }
              `, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number: prNumber,
                cursor,
              });
              const threads = result.repository.pullRequest.reviewThreads;
              allThreads.push(...threads.nodes);
              hasNextPage = threads.pageInfo.hasNextPage;
              cursor = threads.pageInfo.endCursor;
            }

            const unresolvedThreads = allThreads.filter(t => {
              if (t.isOutdated || t.isResolved) return false;
              // When Copilot cleared, Copilot threads are superseded — only block on non-Copilot threads
              if (copilotCleared) return !t.comments.nodes.some(c => copilotLogins.includes(c.author?.login));
              return true;
            });

            if (unresolvedThreads.length > 0) {
              core.info(`${unresolvedThreads.length} unresolved thread(s) — not approving`);
              await createCheck({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'bot-review',
                head_sha: sha,
                status: 'completed',
                conclusion: 'failure',
                output: {
                  title: 'Review blocked',
                  summary: `PR has ${unresolvedThreads.length} unresolved comment(s)`,
                },
              });
              return;
            }

            // All threads resolved or superseded — set bot-review success
            await createCheck({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'bot-review',
              head_sha: sha,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: 'Copilot review passed',
                summary: 'All review threads resolved',
              },
            });

            // Check if already approved by the bot to avoid duplicate approvals
            const botReviews = reviews.data.filter(r =>
              r.user.login === 'legacy-sports-review-bot[bot]' && r.state === 'APPROVED'
            );
            if (botReviews.length > 0) {
              core.info('Already approved by bot — just ensuring label');
            } else {
              // Approve the PR
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                event: 'APPROVE',
                body: 'Auto-approved: all review threads resolved.',
              });
              core.info(`Approved PR #${prNumber}`);
            }

            // Ensure merge-when-ready label
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['merge-when-ready'],
              });
              core.info(`Labeled PR #${prNumber} merge-when-ready`);
            } catch (e) {
              core.warning(`Failed to add label: ${e.message}`);
            }

  copilot-removed:
    # Event-driven "Copilot is done" signal. GitHub auto-removes a reviewer from
    # requested_reviewers when they submit a review, so review_request_removed
    # fires both after Copilot submits (review-check handles the submission via
    # pull_request_review) and when Copilot is removed without posting anything
    # (e.g. Copilot internally aborted, user manually removed, etc).
    #
    # This job only acts in the "removed without a review for current SHA" case
    # by approving as clean pass. When a review exists, it is a no-op and lets
    # review-check evaluate threads.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'review_request_removed' &&
      (github.event.requested_reviewer.login == 'copilot-pull-request-reviewer[bot]' ||
       github.event.requested_reviewer.login == 'Copilot') &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'legacy-sports-code-bot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: copilot-removed-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        with:
          app-id: 3142924
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Approve if no Copilot review for current SHA
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          BOT_TOKEN: ${{ steps.bot-token.outputs.token }}
        with:
          github-token: ${{ steps.bot-token.outputs.token }}
          script: |
            const createCheck = async (p) => {
              const resp = await fetch(
                `https://api.github.com/repos/${p.owner}/${p.repo}/check-runs`,
                { method: 'POST', headers: { Authorization: `Bearer ${process.env.BOT_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: JSON.stringify(p) }
              );
              if (!resp.ok) throw new Error(`checks.create ${resp.status}: ${await resp.text()}`);
            };

            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;
            const copilotReviewLogins = ['copilot-pull-request-reviewer[bot]', 'Copilot'];

            // Brief wait: review_request_removed can fire fractionally before the
            // submitted review appears in listReviews. 15s avoids double-handling
            // a submission that review-check is about to process.
            await new Promise(r => setTimeout(r, 15000));

            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const copilotReviewsForCurrentSha = reviews.data.filter(r =>
              copilotReviewLogins.includes(r.user.login) && r.commit_id === sha
            );

            if (copilotReviewsForCurrentSha.length > 0) {
              core.info(`Copilot posted ${copilotReviewsForCurrentSha.length} review(s) on current SHA — review-check will handle`);
              return;
            }

            core.info('Copilot removed without posting a review for current SHA — treating as clean pass');

            await createCheck({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'bot-review',
              head_sha: sha,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: 'Copilot review passed',
                summary: 'Copilot removed without posting a review — clean pass',
              },
            });

            const botReviews = reviews.data.filter(r =>
              r.user.login === 'legacy-sports-review-bot[bot]' && r.state === 'APPROVED'
            );
            if (botReviews.length === 0) {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                event: 'APPROVE',
                body: 'Auto-approved: Copilot completed without posting review comments.',
              });
              core.info(`Approved PR #${prNumber}`);
            }

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['merge-when-ready'],
              });
              core.info(`Labeled PR #${prNumber} merge-when-ready`);
            } catch (e) {
              core.warning(`Failed to add label: ${e.message}`);
            }

  auto-approve:
    # Runs when the built-in "Copilot code review" workflow completes for a PR
    if: github.event_name == 'workflow_run'
    concurrency:
      group: copilot-auto-approve-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
      cancel-in-progress: true
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Get PR number
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // workflow_run.pull_requests may be empty for cross-repo PRs
            const prs = context.payload.workflow_run.pull_requests;
            if (prs && prs.length > 0) {
              core.setOutput('number', prs[0].number.toString());
              core.info(`Found PR #${prs[0].number} from workflow_run payload`);
              return;
            }
            // Fallback: Copilot's head_branch is "refs/pull/N/head" — extract PR number directly
            const headBranch = context.payload.workflow_run.head_branch || '';
            const prMatch = headBranch.match(/^refs\/pull\/(\d+)\/head$/);
            if (prMatch) {
              const prNum = prMatch[1];
              // Verify the PR is still open and the reviewed SHA matches
              try {
                const { data: pr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: parseInt(prNum, 10),
                });
                const reviewedSha = context.payload.workflow_run.head_sha;
                if (pr.state !== 'open') {
                  core.info(`PR #${prNum} is ${pr.state} — skipping`);
                } else if (reviewedSha && pr.head.sha !== reviewedSha) {
                  core.info(`PR #${prNum} head SHA changed since review (${reviewedSha} → ${pr.head.sha}) — skipping`);
                } else {
                  core.setOutput('number', prNum);
                  core.info(`Found PR #${prNum} from head_branch ref`);
                  return;
                }
              } catch (e) {
                core.warning(`PR #${prNum} lookup failed: ${e instanceof Error ? e.message : String(e)}`);
              }
            }
            core.setOutput('number', '');
            core.warning(`Could not resolve PR from head_branch: ${headBranch}`);

      - name: Generate bot token
        if: steps.pr.outputs.number != ''
        id: bot-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        with:
          app-id: 3142924
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Set failure status for non-successful Copilot review
        if: >-
          steps.pr.outputs.number != '' &&
          github.event.workflow_run.conclusion != 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.bot-token.outputs.token }}
          script: |
            const conclusion = '${{ github.event.workflow_run.conclusion }}';
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'bot-review',
              head_sha: '${{ github.event.workflow_run.head_sha }}',
              status: 'completed',
              conclusion: 'failure',
              output: {
                title: 'Copilot review failed',
                summary: `Copilot review ${conclusion} — re-push to retry`,
              },
            });

      - name: Wait for Copilot review to propagate
        if: >-
          steps.pr.outputs.number != '' &&
          github.event.workflow_run.conclusion == 'success'
        run: |
          # The workflow_run event fires when the "Copilot code review" workflow
          # completes, but Copilot's PR review (pull_request_review) may not be
          # posted yet. Without this delay, the check step sees 0 reviews and 0
          # threads and incorrectly auto-approves. Observed propagation lag: ~12s
          # (see PR #2556). 30s provides a safe buffer.
          sleep 30

      - name: Check for review comments and review state
        if: >-
          steps.pr.outputs.number != '' &&
          github.event.workflow_run.conclusion == 'success'
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.bot-token.outputs.token }}
          script: |
            const prNumber = parseInt('${{ steps.pr.outputs.number }}', 10);
            const currentSha = '${{ github.event.workflow_run.head_sha }}';
            const copilotReviewLogins = ['copilot-pull-request-reviewer[bot]', 'Copilot'];
            const copilotLogins = ['copilot-pull-request-reviewer', 'copilot-pull-request-reviewer[bot]', 'Copilot'];

            // Poll for Copilot's PR review to appear. The workflow_run event
            // fires before the review is posted — retry up to 6 times with
            // 10s intervals between attempts (~50s of waiting, plus API time).
            const sleep = (ms) => new Promise(r => setTimeout(r, ms));
            let copilotReviews = [];
            for (let attempt = 0; attempt < 6; attempt++) {
              const reviews = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              copilotReviews = reviews.data
                .filter(r => copilotReviewLogins.includes(r.user.login))
                .sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at));

              if (copilotReviews.length > 0) {
                core.info(`Found ${copilotReviews.length} Copilot review(s) on attempt ${attempt + 1}`);
                break;
              }
              if (attempt < 5) {
                core.info(`No Copilot reviews yet (attempt ${attempt + 1}/6) — waiting 10s`);
                await sleep(10000);
              }
            }

            if (copilotReviews.length === 0) {
              // The "Copilot code review" workflow completed but no PR review has
              // been posted yet. The workflow completing and the review being posted
              // are separate async events — 80s is not long enough to assume a clean
              // pass. Leave bot-review in_progress so delayed-recheck fires after
              // 3 min; the recheck job will approve as clean pass if still no review.
              core.info('No Copilot reviews found after polling — leaving bot-review in_progress for delayed-recheck');
              core.setOutput('has_comments', 'pending');
              return;
            }

            const latest = copilotReviews[0];

            // If Copilot's latest review is on an older commit, it hasn't posted for
            // current HEAD yet — leave in_progress and let delayed-recheck/review-check handle it.
            if (latest.commit_id !== currentSha) {
              core.setOutput('has_comments', 'pending');
              core.info(`Latest Copilot review is on ${latest.commit_id.slice(0, 7)}, current HEAD is ${currentSha.slice(0, 7)} — review not posted yet, leaving in_progress`);
              return;
            }

            // When Copilot explicitly approved or couldn't review any files, its own
            // threads are superseded. Non-Copilot threads still block approval.
            const copilotCleared = latest.state === 'APPROVED' ||
              (latest.body && latest.body.includes("wasn't able to review any files"));
            if (copilotCleared) {
              core.info(latest.state === 'APPROVED'
                ? 'Latest Copilot review is APPROVED — Copilot threads superseded'
                : 'Copilot had no reviewable files — Copilot threads skipped');
            }

            // Always fetch threads — even when Copilot approved, non-Copilot threads may still be open
            let allThreads = [];
            let hasNextPage = true;
            let cursor = null;

            while (hasNextPage) {
              const result = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100, after: $cursor) {
                        pageInfo {
                          hasNextPage
                          endCursor
                        }
                        nodes {
                          isResolved
                          isOutdated
                          comments(first: 1) {
                            nodes {
                              author { login }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number: prNumber,
                cursor,
              });

              const threads = result.repository.pullRequest.reviewThreads;
              allThreads.push(...threads.nodes);
              hasNextPage = threads.pageInfo.hasNextPage;
              cursor = threads.pageInfo.endCursor;
            }

            const unresolvedThreads = allThreads.filter(t => {
              if (t.isOutdated || t.isResolved) return false;
              // When Copilot cleared, Copilot threads are superseded — only block on non-Copilot threads
              if (copilotCleared) return !t.comments.nodes.some(c => copilotLogins.includes(c.author?.login));
              return true;
            });

            const hasComments = unresolvedThreads.length > 0;
            core.setOutput('has_comments', hasComments.toString());
            core.info(`Unresolved review threads: ${unresolvedThreads.length}`);

      - name: Set bot-review status
        if: >-
          steps.pr.outputs.number != '' &&
          github.event.workflow_run.conclusion == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          BOT_TOKEN: ${{ steps.bot-token.outputs.token }}
        with:
          github-token: ${{ steps.bot-token.outputs.token }}
          script: |
            const createCheck = async (p) => {
              const resp = await fetch(
                `https://api.github.com/repos/${p.owner}/${p.repo}/check-runs`,
                { method: 'POST', headers: { Authorization: `Bearer ${process.env.BOT_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: JSON.stringify(p) }
              );
              if (!resp.ok) throw new Error(`checks.create ${resp.status}: ${await resp.text()}`);
            };

            const hasCommentsOutput = '${{ steps.check.outputs.has_comments }}';
            if (hasCommentsOutput === 'pending') {
              // Copilot's PR review hasn't been posted yet — leave bot-review
              // in_progress so delayed-recheck can handle it after 3 min.
              core.info('Copilot review pending — not updating bot-review status');
              return;
            }
            const hasComments = hasCommentsOutput === 'true';
            await createCheck({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'bot-review',
              head_sha: '${{ github.event.workflow_run.head_sha }}',
              status: 'completed',
              conclusion: hasComments ? 'failure' : 'success',
              output: {
                title: hasComments ? 'Review blocked' : 'Review passed',
                summary: hasComments
                  ? 'PR has unresolved comments'
                  : 'All review threads resolved',
              },
            });

      - name: Approve PR and label for merge
        if: >-
          steps.pr.outputs.number != '' &&
          github.event.workflow_run.conclusion == 'success' &&
          steps.check.outputs.has_comments == 'false'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            --method POST \
            -f event="APPROVE" \
            -f body="Auto-approved: all review threads resolved."
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "merge-when-ready"

  recheck:
    # Triggered by workflow_dispatch (e.g., after an agent resolves review threads
    # without pushing code) or by the "Re-run" button on the bot-review check run.
    # Re-evaluates Copilot thread state and updates bot-review.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'check_run' &&
       github.event.check_run.name == 'bot-review' &&
       github.event.check_run.pull_requests[0].number != '')
    concurrency:
      group: copilot-recheck-${{ inputs.pr_number || github.event.check_run.pull_requests[0].number }}
      cancel-in-progress: true
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        with:
          app-id: 3142924
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Check threads and approve if clean
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          BOT_TOKEN: ${{ steps.bot-token.outputs.token }}
        with:
          github-token: ${{ steps.bot-token.outputs.token }}
          script: |
            const createCheck = async (p) => {
              const resp = await fetch(
                `https://api.github.com/repos/${p.owner}/${p.repo}/check-runs`,
                { method: 'POST', headers: { Authorization: `Bearer ${process.env.BOT_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: JSON.stringify(p) }
              );
              if (!resp.ok) throw new Error(`checks.create ${resp.status}: ${await resp.text()}`);
            };

            let prNumber;
            if (context.eventName === 'check_run') {
              const prs = context.payload.check_run.pull_requests;
              if (!prs || prs.length === 0) {
                core.setFailed('No pull requests associated with this check_run rerun');
                return;
              }
              prNumber = prs[0].number;
            } else {
              prNumber = parseInt('${{ inputs.pr_number }}', 10);
              if (isNaN(prNumber)) {
                core.setFailed('Invalid pr_number input');
                return;
              }
            }

            // Get PR head SHA
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (pr.state !== 'open') {
              core.info(`PR #${prNumber} is ${pr.state} — skipping`);
              return;
            }
            const sha = pr.head.sha;

            // Must have at least one Copilot review
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const copilotReviewLogins = ['copilot-pull-request-reviewer[bot]', 'Copilot'];
            const copilotLogins = ['copilot-pull-request-reviewer', 'copilot-pull-request-reviewer[bot]', 'Copilot'];
            const copilotReviews = reviews.data
              .filter(r => copilotReviewLogins.includes(r.user.login))
              .sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at));
            if (copilotReviews.length === 0) {
              // No Copilot review posted yet. Do NOT assume clean pass — a
              // missing review could mean Copilot is still working. The
              // event-driven copilot-removed job (fires on review_request_removed)
              // handles the case where Copilot is done without posting.
              //
              // Before bailing, verify Copilot is actually in requested_reviewers.
              // If it was never requested (or got dropped for any reason),
              // the review_request_removed event can't fire and the PR would be
              // stuck forever. Re-request as a self-healing safety net.
              const copilotRequested = (pr.requested_reviewers || []).some(r =>
                copilotReviewLogins.includes(r.login)
              );
              if (!copilotRequested) {
                core.info('Copilot not in requested_reviewers and no review exists — re-requesting');
                try {
                  await github.rest.pulls.requestReviewers({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: prNumber,
                    reviewers: ['copilot-pull-request-reviewer[bot]'],
                  });
                  core.info(`Re-requested Copilot review for PR #${prNumber}`);
                } catch (e) {
                  core.warning(`Copilot re-request failed: ${e.message}`);
                }
              } else {
                core.info('Copilot is in requested_reviewers but has not posted a review yet');
              }
              core.info('Leaving bot-review in_progress — event-driven signal will resolve');
              return;
            }

            const latest = copilotReviews[0];

            // When Copilot explicitly approved or couldn't review any files, its own
            // threads are superseded. Non-Copilot threads still block approval.
            const copilotCleared = latest.state === 'APPROVED' ||
              (latest.body && latest.body.includes("wasn't able to review any files"));
            if (copilotCleared) {
              core.info(latest.state === 'APPROVED'
                ? 'Latest Copilot review is APPROVED — Copilot threads superseded'
                : 'Copilot had no reviewable files — Copilot threads skipped');
            }

            // Always fetch threads — even when Copilot approved, non-Copilot threads may still be open
            let allThreads = [];
            let hasNextPage = true;
            let cursor = null;
            while (hasNextPage) {
              const result = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100, after: $cursor) {
                        pageInfo { hasNextPage endCursor }
                        nodes {
                          isResolved
                          isOutdated
                          comments(first: 1) {
                            nodes { author { login } }
                          }
                        }
                      }
                    }
                  }
                }
              `, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number: prNumber,
                cursor,
              });
              const threads = result.repository.pullRequest.reviewThreads;
              allThreads.push(...threads.nodes);
              hasNextPage = threads.pageInfo.hasNextPage;
              cursor = threads.pageInfo.endCursor;
            }

            const unresolvedThreads = allThreads.filter(t => {
              if (t.isOutdated || t.isResolved) return false;
              // When Copilot cleared, Copilot threads are superseded — only block on non-Copilot threads
              if (copilotCleared) return !t.comments.nodes.some(c => copilotLogins.includes(c.author?.login));
              return true;
            });

            if (unresolvedThreads.length > 0) {
              core.info(`${unresolvedThreads.length} unresolved thread(s) — not approving`);
              await createCheck({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'bot-review',
                head_sha: sha,
                status: 'completed',
                conclusion: 'failure',
                output: {
                  title: 'Review blocked',
                  summary: `PR has ${unresolvedThreads.length} unresolved comment(s)`,
                },
              });
              return;
            }

            // All threads resolved or superseded — set bot-review success
            await createCheck({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'bot-review',
              head_sha: sha,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: 'Copilot review passed',
                summary: 'All review threads resolved',
              },
            });

            // Approve if not already approved
            const botReviews = reviews.data.filter(r =>
              r.user.login === 'legacy-sports-review-bot[bot]' && r.state === 'APPROVED'
            );
            if (botReviews.length === 0) {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                event: 'APPROVE',
                body: 'Auto-approved: all review threads resolved.',
              });
              core.info(`Approved PR #${prNumber}`);
            }

            // Ensure merge-when-ready label
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['merge-when-ready'],
              });
              core.info(`Labeled PR #${prNumber} merge-when-ready`);
            } catch (e) {
              core.warning(`Failed to add label: ${e.message}`);
            }

  delayed-recheck:
    # After a pull_request event, request-review sets bot-review to in_progress.
    # If the "Copilot code review" workflow doesn't trigger (e.g. Copilot can't
    # review any files) or doesn't fire a workflow_run completion, bot-review
    # stays stuck at in_progress forever. This job waits 3 minutes (giving
    # Copilot time to review), then checks if bot-review is still pending and
    # dispatches a recheck if so. If auto-approve already fired via
    # workflow_run, the status will no longer be pending and this is a no-op.
    # (See LS-1986, LS-3090)
    permissions:
      actions: write
      checks: read
    concurrency:
      group: copilot-delayed-recheck-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    needs: request-review
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'review_request_removed' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'legacy-sports-code-bot[bot]'
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Wait for Copilot to potentially re-review
        run: sleep 180

      - name: Check if bot-review is still pending or failed
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const { data } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              check_name: 'bot-review',
            });
            // GitHub returns check runs newest-first; pick the most recent one
            const botReview = data.check_runs[0];
            // Treat in_progress or queued the same as the old 'pending' state
            const isPending = botReview
              ? botReview.status === 'in_progress' || botReview.status === 'queued'
              : false;
            // Also recheck when bot-review failed — threads may have become outdated
            // since the failure was recorded (e.g. new commits were pushed after
            // Copilot left comments). The recheck job filters out isOutdated threads
            // and will flip bot-review to success if no active threads remain.
            const isFailed = botReview
              ? botReview.status === 'completed' && botReview.conclusion === 'failure'
              : false;
            const state = isPending ? 'pending' : (isFailed ? 'failure' : (botReview ? botReview.conclusion ?? botReview.status : 'unknown'));
            core.setOutput('state', state);
            core.info(`Current bot-review state: ${state}`);

      - name: Dispatch recheck
        if: steps.check.outputs.state == 'pending' || steps.check.outputs.state == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const state = '${{ steps.check.outputs.state }}';
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'copilot-auto-approve.yml',
