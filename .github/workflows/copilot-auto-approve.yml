name: Copilot Auto-Approve

# Workflow jobs:
# 1. request-review: requests a Copilot review when a PR is opened or updated
# 2. auto-approve: approves the PR when Copilot's review has no unresolved comments
#
# The auto-approve job uses workflow_run to chain off the built-in "Copilot code review"
# workflow. This bypasses GitHub's anti-recursion rule which prevents events from
# GitHub Apps (like Copilot) from triggering workflows via pull_request_review.
#
# Uses a GitHub App (ID: 3142924) for bot identity.
# Requires BOT_APP_PRIVATE_KEY secret containing the app's PEM private key.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["Copilot code review"]
    types: [completed]

permissions:
  pull-requests: write
  contents: read

jobs:
  request-review:
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Request Copilot review
        uses: actions/github-script@v8
        with:
          script: |
            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                reviewers: ['copilot-pull-request-reviewer[bot]'],
              });
              core.info(`Requested Copilot review on PR #${context.payload.pull_request.number}`);
            } catch (error) {
              // Don't fail the workflow if the request fails (e.g., bot not installed)
              core.warning(`Failed to request Copilot review: ${error.message}`);
            }

  auto-approve:
    # Runs when the built-in "Copilot code review" workflow completes for a PR
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Get PR number
        id: pr
        uses: actions/github-script@v8
        with:
          script: |
            // workflow_run.pull_requests may be empty for cross-repo PRs
            const prs = context.payload.workflow_run.pull_requests;
            if (prs && prs.length > 0) {
              core.setOutput('number', prs[0].number.toString());
              core.info(`Found PR #${prs[0].number} from workflow_run payload`);
              return;
            }
            // Fallback: search for PR by head SHA to avoid approving a stale revision
            const headSha = context.payload.workflow_run.head_sha;
            const headOwner = context.payload.workflow_run.head_repository?.owner?.login || context.repo.owner;
            const branch = context.payload.workflow_run.head_branch;
            const { data } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${headOwner}:${branch}`,
              state: 'open',
            });
            const matchingPr = data.find(pr => pr.head.sha === headSha);
            if (matchingPr) {
              core.setOutput('number', matchingPr.number.toString());
              core.info(`Found PR #${matchingPr.number} by SHA match`);
            } else {
              core.setOutput('number', '');
              core.warning(`No open PR found with head SHA ${headSha} on branch ${branch}`);
            }

      - name: Generate bot token
        if: steps.pr.outputs.number != ''
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: 3142924
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Check for review comments and review state
        if: steps.pr.outputs.number != ''
        id: check
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.bot-token.outputs.token }}
          script: |
            const prNumber = parseInt('${{ steps.pr.outputs.number }}', 10);

            // Check latest Copilot review state — skip if changes_requested
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const copilotReviewLogins = ['copilot-pull-request-reviewer[bot]', 'Copilot'];
            const copilotReviews = reviews.data
              .filter(r => copilotReviewLogins.includes(r.user.login))
              .sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at));
            if (copilotReviews.length > 0 && copilotReviews[0].state === 'CHANGES_REQUESTED') {
              core.setOutput('has_comments', 'true');
              core.info('Latest Copilot review requested changes — skipping approval');
              return;
            }

            // Check for unresolved Copilot review threads
            let allThreads = [];
            let hasNextPage = true;
            let cursor = null;

            while (hasNextPage) {
              const result = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100, after: $cursor) {
                        pageInfo {
                          hasNextPage
                          endCursor
                        }
                        nodes {
                          isResolved
                          isOutdated
                          comments(first: 1) {
                            nodes {
                              author { login }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number: prNumber,
                cursor,
              });

              const threads = result.repository.pullRequest.reviewThreads;
              allThreads.push(...threads.nodes);
              hasNextPage = threads.pageInfo.hasNextPage;
              cursor = threads.pageInfo.endCursor;
            }

            // GraphQL uses 'copilot-pull-request-reviewer' (no [bot] suffix)
            // REST API uses 'copilot-pull-request-reviewer[bot]'
            // Webhook event uses 'Copilot'
            const copilotLogins = ['copilot-pull-request-reviewer', 'copilot-pull-request-reviewer[bot]', 'Copilot'];
            const copilotThreads = allThreads.filter(t =>
              !t.isOutdated &&
              !t.isResolved &&
              t.comments.nodes.some(c => copilotLogins.includes(c.author.login))
            );

            const hasComments = copilotThreads.length > 0;
            core.setOutput('has_comments', hasComments.toString());
            core.info(`Copilot unresolved threads: ${copilotThreads.length}`);

      - name: Approve PR and label for merge
        if: steps.pr.outputs.number != '' && steps.check.outputs.has_comments == 'false'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            --method POST \
            -f event="APPROVE" \
            -f body="Auto-approved: Copilot review completed with no comments."
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "merge-when-ready"
