name: Publish Load Stats Lambda

# Controls when the workflow will run
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lambdas/stats-lambda/**"
      - ".github/workflows/publish-stats-lambda.yml"

# Cancel in-progress deployments for the same workflow
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  AWS_SERVICE_NAME: legacy-sports-stats-lambda
  AWS_STAGE: dev
  AWS_VPC_SECURITY_GROUP_IDS: sg-0d21d72d3c1c004c2,sg-07083f37d7e8e24c5,sg-05999e0f1cbd13139
  # The private subnet on us-east-1c
  AWS_VPC_SUBNET_IDS: subnet-031d24899cb105d13
  # Nx Cloud access token for enhanced CI features (set as GitHub secret)
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

# Permission can be added at job level or workflow level
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout

jobs:
  build:
    name: Deploy Load Stats Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify Main Branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "❌ Deployment can only run from main branch"
            echo "Current branch: ${{ github.ref }}"
            exit 1
          fi
          echo "✅ Deploying from main branch"

      - name: Setup NPM
        uses: ./.github/workflows/setup-npm

      - name: Configure Basic Nx Environment
        shell: bash
        run: |
          echo "🔧 Configuring basic Nx environment for deployment..."
          # Set conservative local settings for deployment builds
          echo "NX_CLOUD_DISTRIBUTED_EXECUTION=false" >> $GITHUB_ENV
          echo "NX_LOCAL_FALLBACK=true" >> $GITHUB_ENV
          echo "NX_PARALLEL=2" >> $GITHUB_ENV
          echo "NX_DAEMON=false" >> $GITHUB_ENV
          echo "NX_VERBOSE_LOGGING=false" >> $GITHUB_ENV
          # Clear cloud access token to prevent failed connection attempts
          echo "NX_CLOUD_ACCESS_TOKEN=" >> $GITHUB_ENV
          echo "✅ Basic Nx environment configured for deployment"

      - name: Setup AWS
        uses: ./.github/workflows/setup-aws
        id: setup-aws

      - name: Build and Deploy Stats Lambda
        working-directory: lambdas/stats-lambda
        run: |
          # Build the Lambda using Nx
          npx nx run stats-lambda:build

          # Create version string
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          COMMIT_SHA=$(echo $GITHUB_SHA | cut -c1-8)
          VERSION="${TIMESTAMP}-${COMMIT_SHA}"

          # Create deployment package
          zip -r "stats-${VERSION}.zip" dist/

          # Get S3 bucket name from Terraform output or use default
          S3_BUCKET=$(aws ssm get-parameter --name "/legacy-sports/${AWS_STAGE}/s3/lambda-deployments-bucket" --query "Parameter.Value" --output text 2>/dev/null || echo "${{ env.AWS_SERVICE_NAME }}-lambdas")

          # Upload to S3
          aws s3 cp "stats-${VERSION}.zip" "s3://${S3_BUCKET}/stats/" --region ${{ env.AWS_REGION }}

          # Update SSM parameter
          aws ssm put-parameter \
            --name "/legacy-sports/${AWS_STAGE}/lambda/stats/version" \
            --value "$VERSION" \
            --overwrite \
            --region ${{ env.AWS_REGION }}

          echo "✅ Lambda package uploaded: stats-${VERSION}.zip"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Deploy Infrastructure
        working-directory: terraform
        run: |
          # Apply Terraform to deploy the new Lambda version
          terraform init
          terraform plan -target=aws_lambda_function.stats
          terraform apply -target=aws_lambda_function.stats -auto-approve

      # Enable Nx Cloud Self-Healing CI (if available)
      - name: Fix CI Issues
        run: |
          echo "🔧 Running Nx Cloud self-healing (if available)..."
          if [ -n "${{ env.NX_CLOUD_ACCESS_TOKEN }}" ]; then
            npx nx-cloud fix-ci || echo "⚠️  Nx Cloud fix-ci failed (quota exceeded or unavailable)"
          else
            echo "ℹ️  Nx Cloud not configured, skipping fix-ci"
          fi
        if: always()
