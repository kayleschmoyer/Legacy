name: "Mobile Build Matrix (Optimized)"

# Optimized mobile build workflow with matrix builds for Android
# Supports multiple API levels and build configurations
# Includes incremental EAS builds when only JavaScript changes

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/app/**'
      - 'lib/shared-components/**'
      - 'lib/tamagui-config/**'
  pull_request:
    paths:
      - 'apps/app/**'
      - 'lib/shared-components/**'
      - 'lib/tamagui-config/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type to execute"
        required: false
        default: "development"
        type: choice
        options:
          - development
          - preview
          - production
      force_native_build:
        description: "Force native build even for JS-only changes"
        required: false
        default: false
        type: boolean

# Cancel in-progress builds for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write

env:
  # EAS Build Configuration  
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || '' }}
  EAS_BUILD_PROFILE: ${{ github.event.inputs.build_type || 'development' }}
  
  # Nx Configuration
  NX_CLOUD_DISTRIBUTED_EXECUTION: false
  NX_DAEMON: false
  NX_PARALLEL: 2

jobs:
  # ======================================================================
  # BUILD STRATEGY ANALYSIS
  # ======================================================================

  analyze-changes:
    name: "Analyze Build Requirements"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    outputs:
      native-changes: ${{ steps.analysis.outputs.native-changes }}
      js-only-changes: ${{ steps.analysis.outputs.js-only-changes }}
      should-build-android: ${{ steps.analysis.outputs.should-build-android }}
      should-build-ios: ${{ steps.analysis.outputs.should-build-ios }}
      build-strategy: ${{ steps.analysis.outputs.build-strategy }}
      matrix-configs: ${{ steps.analysis.outputs.matrix-configs }}

    steps:
      - name: "🚀 Checkout Repository"
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: "🔍 Analyze Changes for Build Strategy"
        id: analysis
        run: |
          echo "::group::📊 Mobile Build Strategy Analysis"
          
          # Get changed files
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1..HEAD 2>/dev/null || echo "")
          fi

          echo "🔍 Changed files:"
          echo "$CHANGED_FILES"

          # Analyze what type of changes we have
          NATIVE_CHANGES=false
          JS_ONLY_CHANGES=false
          
          if echo "$CHANGED_FILES" | grep -E '\.(java|kt|swift|m|mm|gradle|pbxproj|plist)$' >/dev/null; then
            NATIVE_CHANGES=true
            echo "🔧 Native code changes detected"
          fi

          if echo "$CHANGED_FILES" | grep -E '\.(ts|tsx|js|jsx|json)$' >/dev/null; then
            JS_ONLY_CHANGES=true
            echo "📱 JavaScript/TypeScript changes detected"
          fi

          # Check for package.json or dependency changes
          if echo "$CHANGED_FILES" | grep -E 'package\.json|package-lock\.json|yarn\.lock' >/dev/null; then
            NATIVE_CHANGES=true
            echo "📦 Dependency changes - requiring native build"
          fi

          # Check for Expo configuration changes
          if echo "$CHANGED_FILES" | grep -E 'app\.(json|config\.(js|ts))|eas\.json|metro\.config\.(js|ts)' >/dev/null; then
            NATIVE_CHANGES=true
            echo "⚙️ Expo/Metro configuration changes - requiring native build"
          fi

          # Force native build if requested
          if [ "${{ github.event.inputs.force_native_build }}" == "true" ]; then
            NATIVE_CHANGES=true
            echo "🚨 Native build forced via workflow input"
          fi

          # Determine build strategy
          BUILD_STRATEGY=""
          if [ "$NATIVE_CHANGES" == "true" ]; then
            BUILD_STRATEGY="full-native"
            echo "🏗️ Strategy: Full native builds required"
          elif [ "$JS_ONLY_CHANGES" == "true" ]; then
            BUILD_STRATEGY="js-update"
            echo "⚡ Strategy: JavaScript-only update possible"
          else
            BUILD_STRATEGY="validation"
            echo "✅ Strategy: Validation builds only"
          fi

          # Determine platform builds needed
          SHOULD_BUILD_ANDROID=true
          SHOULD_BUILD_IOS=false  # iOS builds disabled - see CI_PIPELINE_EVALUATION_2025.md

          # Create matrix configurations for Android builds
          if [ "$SHOULD_BUILD_ANDROID" == "true" ] && [ "$BUILD_STRATEGY" == "full-native" ]; then
            # Multiple API levels for comprehensive testing
            MATRIX_CONFIGS='[
              {"api-level": 30, "target": "google_apis", "arch": "x86_64", "profile": "development"},
              {"api-level": 31, "target": "google_apis", "arch": "x86_64", "profile": "development"},
              {"api-level": 33, "target": "google_apis", "arch": "x86_64", "profile": "preview"}
            ]'
          elif [ "$SHOULD_BUILD_ANDROID" == "true" ] && [ "$BUILD_STRATEGY" == "js-update" ]; then
            # Single configuration for JS-only updates
            MATRIX_CONFIGS='[
              {"api-level": 31, "target": "google_apis", "arch": "x86_64", "profile": "development"}
            ]'
          else
            # Minimal validation
            MATRIX_CONFIGS='[
              {"api-level": 31, "target": "google_apis", "arch": "x86_64", "profile": "development"}
            ]'
          fi

          # Set outputs
          echo "native-changes=$NATIVE_CHANGES" >> $GITHUB_OUTPUT
          echo "js-only-changes=$JS_ONLY_CHANGES" >> $GITHUB_OUTPUT
          echo "should-build-android=$SHOULD_BUILD_ANDROID" >> $GITHUB_OUTPUT
          echo "should-build-ios=$SHOULD_BUILD_IOS" >> $GITHUB_OUTPUT
          echo "build-strategy=$BUILD_STRATEGY" >> $GITHUB_OUTPUT
          echo "matrix-configs=$MATRIX_CONFIGS" >> $GITHUB_OUTPUT

          # Create summary
          echo "## 📱 Mobile Build Analysis" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Strategy**: $BUILD_STRATEGY" >> $GITHUB_STEP_SUMMARY
          echo "- **Native Changes**: $NATIVE_CHANGES" >> $GITHUB_STEP_SUMMARY
          echo "- **JS Only Changes**: $JS_ONLY_CHANGES" >> $GITHUB_STEP_SUMMARY
          echo "- **Android Builds**: $SHOULD_BUILD_ANDROID" >> $GITHUB_STEP_SUMMARY
          echo "- **iOS Builds**: $SHOULD_BUILD_IOS (disabled)" >> $GITHUB_STEP_SUMMARY

          echo "::endgroup::"

  # ======================================================================
  # ANDROID BUILD MATRIX
  # ======================================================================

  android-matrix-build:
    name: "Android Build (API ${{ matrix.api-level }})"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: analyze-changes
    if: needs.analyze-changes.outputs.should-build-android == 'true'
    
    strategy:
      fail-fast: false
      matrix: 
        include: ${{ fromJson(needs.analyze-changes.outputs.matrix-configs) }}

    steps:
      - name: "🚀 Checkout Repository"
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: "🔧 Setup Environment"
        uses: ./.github/actions/setup
        with:
          node-version: 22
          install-dependencies: true
          cache-key-suffix: android-${{ matrix.api-level }}
          skip-system-deps: true

      - name: "📱 Setup EAS CLI & Fix Metro Dependencies"
        run: |
          echo "🔧 Installing compatible EAS CLI and fixing Metro dependencies..."
          npm install -g @expo/eas-cli
          echo "✅ EAS CLI installed: $(eas --version)"
          
          # Clear Metro cache to prevent version conflicts
          echo "🧹 Clearing Metro cache..."
          npx react-native start --reset-cache || echo "Metro cache clear attempted"
          
          # Verify Metro version consistency
          echo "📋 Metro version check:"
          npm list metro || true

      - name: "🔧 Configure EAS Build & Verify Dependencies"
        working-directory: apps/app
        run: |
          echo "🎯 Configuring EAS build for API level ${{ matrix.api-level }}"
          
          # Verify EAS configuration exists
          if [ ! -f "eas.json" ]; then
            echo "❌ eas.json not found - EAS not configured"
            exit 1
          fi

          # Ensure Metro dependencies are properly resolved
          echo "🔍 Verifying Metro dependency versions..."
          cd ../..
          npm list metro @expo/metro-config @react-native/metro-config || true
          
          # Check for Metro TerminalReporter availability
          echo "🔍 Testing Metro TerminalReporter access..."
          node -e "
            try {
              require('metro/src/lib/TerminalReporter');
              console.log('✅ Metro TerminalReporter found at standard path');
            } catch (e) {
              try {
                require('metro/private/lib/TerminalReporter');
                console.log('✅ Metro TerminalReporter found at private path');
              } catch (e2) {
                console.log('❌ Metro TerminalReporter not found:', e.message);
                console.log('Available Metro exports:', Object.keys(require('metro')));
              }
            }
          " || echo "Metro TerminalReporter check completed"

          cd apps/app
          # Show current configuration
          echo "📋 EAS Configuration:"
          cat eas.json | jq .

      - name: "🏗️ Android Build (${{ matrix.profile }})"
        working-directory: apps/app
        env:
          BUILD_STRATEGY: ${{ needs.analyze-changes.outputs.build-strategy }}
          API_LEVEL: ${{ matrix.api-level }}
          BUILD_PROFILE: ${{ matrix.profile }}
        run: |
          echo "🚀 Starting Android build (API ${{ matrix.api-level }})"
          echo "📋 Build Strategy: $BUILD_STRATEGY"
          echo "🎯 Build Profile: $BUILD_PROFILE"

          if [ "$BUILD_STRATEGY" == "js-update" ]; then
            echo "⚡ JavaScript-only build - using update strategy"
            
            # For JS-only changes, we can use Expo Updates
            echo "📦 Publishing update to Expo Updates..."
            eas update --branch=development --message="JS update from ${{ github.sha }}"
            
            echo "✅ JavaScript update published successfully"
            echo "📱 Users will receive update on next app launch"
            
          elif [ "$BUILD_STRATEGY" == "full-native" ]; then
            echo "🏗️ Full native build required"
            
            # Build APK for development/testing
            echo "📦 Building Android APK..."
            if eas build --platform android --profile $BUILD_PROFILE --non-interactive --no-wait; then
              echo "✅ Android build submitted successfully"
              echo "🔗 Check build status: https://expo.dev/accounts/[account]/projects/legacy-sports/builds"
            else
              echo "❌ Android build failed"
              exit 1
            fi
            
          else
            echo "✅ Validation build - dependencies and configuration check only"
            
            # Just validate that the build would work
            echo "🔍 Validating build configuration..."
            eas build --platform android --profile $BUILD_PROFILE --dry-run
            
            echo "✅ Build validation completed successfully"
          fi

      - name: "📊 Build Artifacts & Results"
        if: always()
        working-directory: apps/app
        run: |
          echo "## 📱 Android Build Results (API ${{ matrix.api-level }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Profile**: ${{ matrix.profile }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Strategy**: ${{ needs.analyze-changes.outputs.build-strategy }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ job.status }}" == "success" ]; then
            echo "- **Result**: ✅ Build completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Result**: ❌ Build failed - check logs" >> $GITHUB_STEP_SUMMARY
          fi

          # Get recent build status if available
          if command -v eas >/dev/null 2>&1; then
            echo "🔍 Recent build status:"
            eas build:list --limit=3 --json 2>/dev/null | jq -r '.[] | "- \(.id): \(.status) (\(.platform))"' || echo "No recent builds found"
          fi

  # ======================================================================
  # iOS BUILD PLACEHOLDER
  # ======================================================================

  ios-build:
    name: "iOS Build (Placeholder)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: analyze-changes
    if: needs.analyze-changes.outputs.should-build-ios == 'true'

    steps:
      - name: "📱 iOS Build Status"
        run: |
          echo "## 📱 iOS Build Status" >> $GITHUB_STEP_SUMMARY
          echo "iOS builds are currently disabled in the CI pipeline." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Reason**: Not actively using iOS deployment - see CI_PIPELINE_EVALUATION_2025.md" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**To re-enable iOS builds**:" >> $GITHUB_STEP_SUMMARY
          echo "1. Set IOS_BUILDS_ENABLED=true in ci-pipeline.yml" >> $GITHUB_STEP_SUMMARY
          echo "2. Configure Apple Developer account credentials" >> $GITHUB_STEP_SUMMARY
          echo "3. Update EAS configuration for iOS builds" >> $GITHUB_STEP_SUMMARY
          echo "4. Test iOS build process locally" >> $GITHUB_STEP_SUMMARY

  # ======================================================================
  # BUILD SUMMARY & OPTIMIZATION REPORT
  # ======================================================================

  mobile-build-summary:
    name: "Mobile Build Summary"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [analyze-changes, android-matrix-build, ios-build]
    if: always()

    steps:
      - name: "📊 Generate Build Summary"
        run: |
          echo "## 📱 Mobile Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Strategy**: ${{ needs.analyze-changes.outputs.build-strategy }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Android build results
          ANDROID_STATUS="${{ needs.android-matrix-build.result }}"
          echo "### Android Builds" >> $GITHUB_STEP_SUMMARY
          
          if [ "$ANDROID_STATUS" == "success" ]; then
            echo "✅ **Android**: All matrix builds completed successfully" >> $GITHUB_STEP_SUMMARY
          elif [ "$ANDROID_STATUS" == "failure" ]; then
            echo "❌ **Android**: Some builds failed - check individual job logs" >> $GITHUB_STEP_SUMMARY
          elif [ "$ANDROID_STATUS" == "skipped" ]; then
            echo "⏭️ **Android**: Builds skipped - no mobile changes detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "🔄 **Android**: Builds in progress or cancelled" >> $GITHUB_STEP_SUMMARY
          fi

          # iOS build results
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### iOS Builds" >> $GITHUB_STEP_SUMMARY
          echo "⏭️ **iOS**: Currently disabled - see workflow configuration" >> $GITHUB_STEP_SUMMARY

          # Optimization insights
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Build Optimizations Applied" >> $GITHUB_STEP_SUMMARY
          
          BUILD_STRATEGY="${{ needs.analyze-changes.outputs.build-strategy }}"
          case "$BUILD_STRATEGY" in
            "js-update")
              echo "- ⚡ **JavaScript-only updates** used for faster deployment" >> $GITHUB_STEP_SUMMARY
              echo "- 📦 **Expo Updates** published instead of full native builds" >> $GITHUB_STEP_SUMMARY
              echo "- ⏱️ **Time Saved**: ~30 minutes vs full native build" >> $GITHUB_STEP_SUMMARY
              ;;
            "full-native")
              echo "- 🏗️ **Native builds** required due to native code changes" >> $GITHUB_STEP_SUMMARY
              echo "- 📱 **Matrix strategy** used for comprehensive testing" >> $GITHUB_STEP_SUMMARY
              echo "- 🔧 **Multiple API levels** tested for compatibility" >> $GITHUB_STEP_SUMMARY
              ;;
            "validation")
              echo "- ✅ **Validation only** - no deployment changes needed" >> $GITHUB_STEP_SUMMARY
              echo "- 🔍 **Configuration checked** for build readiness" >> $GITHUB_STEP_SUMMARY
              echo "- ⏱️ **Time Saved**: ~40 minutes vs full builds" >> $GITHUB_STEP_SUMMARY
              ;;
          esac

          # Next steps
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          
          if [ "$BUILD_STRATEGY" == "full-native" ] && [ "$ANDROID_STATUS" == "success" ]; then
            echo "- 📱 Test APK will be available in EAS Build dashboard" >> $GITHUB_STEP_SUMMARY
            echo "- 🧪 Run manual testing on target devices" >> $GITHUB_STEP_SUMMARY
            echo "- 📊 Monitor build performance and crash reports" >> $GITHUB_STEP_SUMMARY
          elif [ "$BUILD_STRATEGY" == "js-update" ]; then
            echo "- 📦 Update is live for development builds" >> $GITHUB_STEP_SUMMARY
            echo "- 🔄 Users will receive update on next app launch" >> $GITHUB_STEP_SUMMARY
            echo "- 📊 Monitor update adoption and performance" >> $GITHUB_STEP_SUMMARY
          fi
