name: "Detect Project Changes"
description: "Intelligent change detection for mono-repo projects with configurable file patterns and affected component analysis"

inputs:
  base-ref:
    description: "Base reference for change detection"
    required: false
    default: ""
  head-ref:
    description: "Head reference for change detection"
    required: false
    default: ""
  force-full-build:
    description: "Force full build regardless of detected changes (useful for integration builds)"
    required: false
    default: "false"

outputs:
  web:
    description: "Whether web project is affected (app-code OR lib-code OR config)"
    value: ${{ steps.analyze.outputs.web }}
  mobile:
    description: "Whether mobile project is affected (app-code OR lib-code OR config)"
    value: ${{ steps.analyze.outputs.mobile }}
  lambdas:
    description: "Whether lambda functions are affected (lambda-code OR lib-code OR config)"
    value: ${{ steps.analyze.outputs.lambdas }}
  terraform:
    description: "Whether infrastructure is affected"
    value: ${{ steps.detect-changes.outputs.terraform }}
  e2e:
    description: "Whether E2E test files are affected"
    value: ${{ steps.detect-changes.outputs.e2e }}
  dependencies:
    description: "Whether dependencies have changed"
    value: ${{ steps.detect-changes.outputs.package-json }}
  affected-components:
    description: "JSON array of affected components"
    value: ${{ steps.analyze.outputs.affected-components }}
  change-summary:
    description: "Human-readable change summary"
    value: ${{ steps.analyze.outputs.change-summary }}
  requires-full-build:
    description: "Whether changes require full mono-repo build"
    value: ${{ steps.analyze.outputs.requires-full-build }}
  base-ref-used:
    description: "The actual base reference used for change detection"
    value: ${{ steps.determine-base.outputs.base-ref }}
  head-ref-used:
    description: "The actual head reference used for change detection"
    value: ${{ steps.determine-base.outputs.head-ref }}

runs:
  using: "composite"
  steps:
    - name: "Determine Base Reference"
      id: determine-base
      shell: bash
      run: |
        # Determine the appropriate base reference based on GitHub event context
        echo "Event: ${{ github.event_name }}"
        echo "Available refs:"
        git branch -r || true
        git log --oneline -5 || true

        if [ "${{ github.event_name }}" = "pull_request" ]; then
          # For PRs, use the base branch (target branch)
          BASE_REF="${{ github.event.pull_request.base.sha }}"
          echo "Using PR base SHA: $BASE_REF"
        elif [ "${{ github.event_name }}" = "push" ]; then
          # For pushes, use the previous commit
          if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE_REF="${{ github.event.before }}"
            echo "Using previous commit: $BASE_REF"
          else
            # First commit or new branch, use main branch
            if git show-ref --verify --quiet refs/remotes/origin/main; then
              BASE_REF="origin/main"
              echo "Using origin/main for new branch"
            else
              BASE_REF="HEAD^"
              echo "Using HEAD^ as fallback"
            fi
          fi
        elif [ "${{ github.event_name }}" = "merge_group" ]; then
          # For merge group/queue events (integration builds)
          # Compare against the base branch to ensure we test all accumulated changes
          if [ -n "${{ github.event.merge_group.base_sha }}" ]; then
            BASE_REF="${{ github.event.merge_group.base_sha }}"
            echo "Using merge group base SHA: $BASE_REF"
          else
            # Fallback to main branch for integration builds
            if git show-ref --verify --quiet refs/remotes/origin/main; then
              BASE_REF="origin/main"
              echo "Using origin/main for merge group fallback"
            else
              BASE_REF="HEAD^"
              echo "Using HEAD^ as merge group fallback"
            fi
          fi
        elif [ "${{ github.event_name }}" = "schedule" ]; then
          # For scheduled builds, force full build by using empty tree
          # This ensures comprehensive testing on schedule
          BASE_REF="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          echo "Using empty tree for scheduled full build"
        else
          # For other events (workflow_dispatch, etc)
          if [ -n "${{ inputs.base-ref }}" ]; then
            BASE_REF="${{ inputs.base-ref }}"
            echo "Using provided base-ref: $BASE_REF"
          else
            # For manual/integration builds, default to comprehensive comparison
            # Check if this might be an integration build context
            if [ "${{ github.ref }}" = "refs/heads/main" ] || [[ "${{ github.ref }}" == *"integration"* ]] || [[ "${{ github.ref }}" == *"release"* ]]; then
              echo "Detected integration/release context - using comprehensive change detection"
              if git show-ref --verify --quiet refs/remotes/origin/main; then
                BASE_REF="origin/main"
                echo "Using origin/main for integration build"
              else
                BASE_REF="HEAD^"
                echo "Using HEAD^ for integration build"
              fi
            else
              # Regular fallback logic
              if git show-ref --verify --quiet refs/remotes/origin/main; then
                BASE_REF="origin/main"
                echo "Using origin/main as fallback"
              else
                BASE_REF="HEAD^"
                echo "Using HEAD^ as final fallback"
              fi
            fi
          fi
        fi

        # Final validation - ensure the base reference exists and resolve to SHA
        if ! git rev-parse --verify "$BASE_REF" >/dev/null 2>&1; then
          echo "Warning: BASE_REF '$BASE_REF' not found, using empty tree as fallback"
          BASE_REF="4b825dc642cb6eb9a060e54bf8d69288fbee4904"  # Empty tree SHA
        else
          # Resolve to full SHA for consistency
          if [[ ! "$BASE_REF" =~ ^[a-f0-9]{40}$ ]]; then
            RESOLVED_BASE=$(git rev-parse "$BASE_REF" 2>/dev/null || echo "")
            if [ -n "$RESOLVED_BASE" ]; then
              BASE_REF="$RESOLVED_BASE"
              echo "Resolved BASE_REF to SHA: $BASE_REF"
            fi
          fi
        fi

        echo "Final BASE_REF: $BASE_REF"
        echo "base-ref=$BASE_REF" >> $GITHUB_OUTPUT

        # Determine HEAD reference
        if [ -n "${{ inputs.head-ref }}" ]; then
          HEAD_REF="${{ inputs.head-ref }}"
          echo "Using provided head-ref: $HEAD_REF"
        else
          # For GitHub Actions, use the current SHA directly
          # This avoids issues with HEAD not being properly resolved
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_REF="${{ github.event.pull_request.head.sha }}"
            echo "Using PR head SHA: $HEAD_REF"
          else
            HEAD_REF="${{ github.sha }}"
            echo "Using GitHub event SHA: $HEAD_REF"
          fi
        fi

        # Final validation - ensure we have a valid SHA
        if [[ ! "$HEAD_REF" =~ ^[a-f0-9]{40}$ ]]; then
          echo "HEAD_REF '$HEAD_REF' doesn't look like a SHA, trying to resolve..."
          RESOLVED_HEAD=$(git rev-parse "$HEAD_REF" 2>/dev/null || echo "")
          if [ -n "$RESOLVED_HEAD" ]; then
            HEAD_REF="$RESOLVED_HEAD"
            echo "Resolved to: $HEAD_REF"
          else
            echo "Could not resolve HEAD_REF, using current commit"
            HEAD_REF=$(git rev-parse HEAD)
          fi
        fi

        echo "Final HEAD_REF: $HEAD_REF"
        echo "head-ref=$HEAD_REF" >> $GITHUB_OUTPUT

        # Additional debugging for dorny/paths-filter
        echo "Git status for debugging:"
        git status --porcelain || true
        echo "Current commit info:"
        git log --oneline -1 || true
        echo "References validation:"
        echo "BASE_REF exists: $(git rev-parse --verify "$BASE_REF" >/dev/null 2>&1 && echo "✅" || echo "❌")"
        echo "HEAD_REF exists: $(git rev-parse --verify "$HEAD_REF" >/dev/null 2>&1 && echo "✅" || echo "❌")"

    - name: "Detect Changed Files"
      id: detect-changes
      uses: dorny/paths-filter@v3
      with:
        base: ${{ steps.determine-base.outputs.base-ref }}
        ref: ${{ steps.determine-base.outputs.head-ref }}
        # Broad source-category filters only. Nx `affected` handles fine-grained
        # lib→consumer dependency detection inside quality-gates & build jobs,
        # so we do NOT manually map individual libs to consumers here.
        filters: |
          web-code:
            - apps/web/**
          mobile-code:
            - apps/app/**
          lib-code:
            - lib/**
          lambda-code:
            - lambdas/**
          config:
            - tools/**
            - nx.json
            - tsconfig*.json
          terraform:
            - terraform/**
          package-json:
            - package.json
            - package-lock.json
            - pnpm-lock.yaml
            - apps/*/package.json
            - lib/*/package.json
            - lambdas/*/package.json
          e2e:
            - apps/web-e2e/**
            - apps/app-e2e/**

    - name: "Analyze Change Impact"
      id: analyze
      shell: bash
      run: |
        echo "::group::📊 Change Impact Analysis"

        # Raw paths-filter outputs (broad categories)
        WEB_CODE="${{ steps.detect-changes.outputs.web-code }}"
        MOBILE_CODE="${{ steps.detect-changes.outputs.mobile-code }}"
        LIB_CODE="${{ steps.detect-changes.outputs.lib-code }}"
        LAMBDA_CODE="${{ steps.detect-changes.outputs.lambda-code }}"
        CONFIG="${{ steps.detect-changes.outputs.config }}"
        TERRAFORM_AFFECTED="${{ steps.detect-changes.outputs.terraform }}"
        DEPS_AFFECTED="${{ steps.detect-changes.outputs.package-json }}"

        # Derive per-consumer affected flags.
        # Any lib change is treated as potentially affecting all consumers;
        # Nx `affected` handles fine-grained project selection inside each job.
        WEB_AFFECTED="false"
        MOBILE_AFFECTED="false"
        LAMBDAS_AFFECTED="false"

        if [ "$WEB_CODE" = "true" ] || [ "$LIB_CODE" = "true" ] || [ "$CONFIG" = "true" ]; then
          WEB_AFFECTED="true"
        fi

        if [ "$MOBILE_CODE" = "true" ] || [ "$LIB_CODE" = "true" ] || [ "$CONFIG" = "true" ]; then
          MOBILE_AFFECTED="true"
        fi

        if [ "$LAMBDA_CODE" = "true" ] || [ "$LIB_CODE" = "true" ] || [ "$CONFIG" = "true" ]; then
          LAMBDAS_AFFECTED="true"
        fi

        # Check for integration build scenarios
        FORCE_FULL_BUILD="${{ inputs.force-full-build }}"
        IS_INTEGRATION_BUILD="false"

        # Detect integration build scenarios
        if [ "${{ github.event_name }}" = "merge_group" ]; then
          IS_INTEGRATION_BUILD="true"
          echo "🔄 Merge group detected - treating as integration build"
        elif [ "${{ github.event_name }}" = "schedule" ]; then
          IS_INTEGRATION_BUILD="true"
          echo "📅 Scheduled build detected - treating as integration build"
        elif [ "$FORCE_FULL_BUILD" = "true" ]; then
          IS_INTEGRATION_BUILD="true"
          echo "🔧 Force full build enabled - treating as integration build"
        elif [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
          # Check if this is a push to main with multiple commits (potential merge/integration)
          COMMIT_COUNT=$(git rev-list --count ${{ steps.determine-base.outputs.base-ref }}..HEAD || echo 1)
          if [ "$COMMIT_COUNT" -gt 1 ]; then
            IS_INTEGRATION_BUILD="true"
            echo "🔀 Multiple commits to main detected ($COMMIT_COUNT commits) - treating as integration build"
          fi
        fi

        # For integration builds, force all components as affected to ensure comprehensive testing
        if [ "$IS_INTEGRATION_BUILD" = "true" ]; then
          echo "🚀 Integration build mode: Enabling comprehensive testing"
          WEB_AFFECTED="true"
          MOBILE_AFFECTED="true"
          LAMBDAS_AFFECTED="true"
          TERRAFORM_AFFECTED="true"
          DEPS_AFFECTED="true"
        fi

        # Create affected components array
        AFFECTED_COMPONENTS='[]'

        if [ "$WEB_AFFECTED" == "true" ]; then
          AFFECTED_COMPONENTS=$(echo "$AFFECTED_COMPONENTS" | jq '. + ["web"]')
        fi

        if [ "$MOBILE_AFFECTED" == "true" ]; then
          AFFECTED_COMPONENTS=$(echo "$AFFECTED_COMPONENTS" | jq '. + ["mobile"]')
        fi

        if [ "$LAMBDAS_AFFECTED" == "true" ]; then
          AFFECTED_COMPONENTS=$(echo "$AFFECTED_COMPONENTS" | jq '. + ["lambdas"]')
        fi

        if [ "$TERRAFORM_AFFECTED" == "true" ]; then
          AFFECTED_COMPONENTS=$(echo "$AFFECTED_COMPONENTS" | jq '. + ["terraform"]')
        fi

        if [ "$DEPS_AFFECTED" == "true" ]; then
          AFFECTED_COMPONENTS=$(echo "$AFFECTED_COMPONENTS" | jq '. + ["dependencies"]')
        fi

        if [ "$CONFIG" == "true" ]; then
          AFFECTED_COMPONENTS=$(echo "$AFFECTED_COMPONENTS" | jq '. + ["config"]')
        fi

        # Determine if full build is required
        REQUIRES_FULL_BUILD="false"
        if [ "$IS_INTEGRATION_BUILD" = "true" ]; then
          REQUIRES_FULL_BUILD="true"
          echo "🚀 Integration build - full build required for comprehensive testing"
        elif [ "$DEPS_AFFECTED" == "true" ]; then
          REQUIRES_FULL_BUILD="true"
          echo "⚠️ Dependency changes detected - full build required"
        fi

        # Generate human-readable summary
        COMPONENT_COUNT=$(echo "$AFFECTED_COMPONENTS" | jq 'length')

        if [ "$IS_INTEGRATION_BUILD" = "true" ]; then
          CHANGE_SUMMARY="Integration build: Comprehensive testing of all components (Event: ${{ github.event_name }})"
        elif [ "$COMPONENT_COUNT" -eq 0 ]; then
          CHANGE_SUMMARY="No significant changes detected - minimal CI execution"
        elif [ "$COMPONENT_COUNT" -eq 1 ]; then
          SINGLE_COMPONENT=$(echo "$AFFECTED_COMPONENTS" | jq -r '.[0]')
          CHANGE_SUMMARY="Changes detected in: $SINGLE_COMPONENT"
        else
          COMPONENT_LIST=$(echo "$AFFECTED_COMPONENTS" | jq -r 'join(", ")')
          CHANGE_SUMMARY="Changes detected in multiple components: $COMPONENT_LIST"
        fi

        # Set outputs
        echo "web=$WEB_AFFECTED" >> $GITHUB_OUTPUT
        echo "mobile=$MOBILE_AFFECTED" >> $GITHUB_OUTPUT
        echo "lambdas=$LAMBDAS_AFFECTED" >> $GITHUB_OUTPUT
        echo "affected-components=$(echo "$AFFECTED_COMPONENTS" | jq -c .)" >> $GITHUB_OUTPUT
        echo "change-summary=$CHANGE_SUMMARY" >> $GITHUB_OUTPUT
        echo "requires-full-build=$REQUIRES_FULL_BUILD" >> $GITHUB_OUTPUT

        # Create detailed summary
        echo "## 🔍 Change Detection Summary" >> $GITHUB_STEP_SUMMARY
        if [ "$IS_INTEGRATION_BUILD" = "true" ]; then
          echo "🚀 **Integration Build Mode**: Comprehensive testing enabled" >> $GITHUB_STEP_SUMMARY
          echo "**Event**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
        fi
        echo "**Affected Components**: $COMPONENT_COUNT" >> $GITHUB_STEP_SUMMARY
        echo "- **Web**: $([ "$WEB_AFFECTED" = "true" ] && echo "✅ Affected" || echo "⚪ No changes")" >> $GITHUB_STEP_SUMMARY
        echo "- **Mobile**: $([ "$MOBILE_AFFECTED" = "true" ] && echo "✅ Affected" || echo "⚪ No changes")" >> $GITHUB_STEP_SUMMARY
        echo "- **Lambdas**: $([ "$LAMBDAS_AFFECTED" = "true" ] && echo "✅ Affected" || echo "⚪ No changes")" >> $GITHUB_STEP_SUMMARY
        echo "- **Terraform**: $([ "$TERRAFORM_AFFECTED" = "true" ] && echo "✅ Affected" || echo "⚪ No changes")" >> $GITHUB_STEP_SUMMARY
        echo "- **E2E Tests**: $([ "${{ steps.detect-changes.outputs.e2e }}" = "true" ] && echo "✅ Affected" || echo "⚪ No changes")" >> $GITHUB_STEP_SUMMARY
        echo "- **Dependencies**: $([ "$DEPS_AFFECTED" = "true" ] && echo "✅ Affected" || echo "⚪ No changes")" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Build Strategy
        echo "### 🎯 Build Strategy" >> $GITHUB_STEP_SUMMARY
        echo "| Component | Status | Action |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|---------|---------|" >> $GITHUB_STEP_SUMMARY
        web_s=$([ "$WEB_AFFECTED" = "true" ] && echo "Changed|Build & Test" || echo "Unchanged|Skip")
        mob_s=$([ "$MOBILE_AFFECTED" = "true" ] && echo "Changed|Build & Test" || echo "Unchanged|Skip")
        lam_s=$([ "$LAMBDAS_AFFECTED" = "true" ] && echo "Changed|Build & Deploy" || echo "Unchanged|Skip")
        tf_s=$([ "$TERRAFORM_AFFECTED" = "true" ] && echo "Changed|Validate & Plan" || echo "Unchanged|Skip")
        echo "| Web | ${web_s%%|*} | ${web_s#*|} |" >> $GITHUB_STEP_SUMMARY
        echo "| Mobile | ${mob_s%%|*} | ${mob_s#*|} |" >> $GITHUB_STEP_SUMMARY
        echo "| Lambdas | ${lam_s%%|*} | ${lam_s#*|} |" >> $GITHUB_STEP_SUMMARY
        echo "| Infrastructure | ${tf_s%%|*} | ${tf_s#*|} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Add notes for significant changes
        if [ "$REQUIRES_FULL_BUILD" = "true" ]; then
          echo "🔴 **Full Build Required**: Dependency or integration changes will be rebuilt"
        elif [ "$COMPONENT_COUNT" -gt 0 ]; then
          echo "🟡 **Targeted Build**: Only affected components will have optimized CI execution"
        else
          echo "🟢 **Minimal Execution**: No significant changes detected, fast-track execution"
        fi

        echo "::endgroup::"

    - name: "Generate Change Context"
      shell: bash
      run: |
        echo "::group::📋 Additional Change Context"

        # Show recent changes (limit output to prevent log overflow)
        echo "### 📄 Recent Files (Last 10)"
        echo ""

        if command -v git >/dev/null 2>&1; then
          echo "Recent file changes:"
          git diff --name-only ${{ steps.determine-base.outputs.base-ref }}..HEAD | head -10 || true
          echo ""
          
          # Count total changed files
          TOTAL_FILES=$(git diff --name-only ${{ steps.determine-base.outputs.base-ref }}..HEAD | wc -l || echo 0)
          echo "Total changed files: $TOTAL_FILES"
          echo ""
          
          if [ "$TOTAL_FILES" -gt 10 ]; then
            echo "... and $((TOTAL_FILES - 10)) more files"
          fi
        else
          echo "Git not available - skipping detailed file changes"
        fi

        echo "::endgroup::"
