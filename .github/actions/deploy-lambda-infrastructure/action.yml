name: Deploy Lambda Infrastructure
description: Deploy Lambda function infrastructure using Terraform with lock coordination

inputs:
  lambda-name:
    description: "Name of the Lambda function"
    required: true
  terraform-target:
    description: "Terraform target resource (e.g., aws_lambda_function.draft_processor)"
    required: true
  aws-region:
    description: "AWS region for deployment"
    required: false
    default: "us-east-1"

runs:
  using: composite
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "~1.13"

    - name: Initialize Terraform
      shell: bash
      working-directory: terraform
      run: |
        echo "🔧 Initializing Terraform..."
        if terraform init; then
          echo "✅ Terraform initialization successful"
        else
          echo "❌ Terraform initialization failed"
          echo "## Terraform Initialization Errors" >> $GITHUB_STEP_SUMMARY
          echo "Check that:" >> $GITHUB_STEP_SUMMARY
          echo "- Terraform configuration files exist in terraform/" >> $GITHUB_STEP_SUMMARY
          echo "- Backend configuration is valid" >> $GITHUB_STEP_SUMMARY
          echo "- AWS credentials are properly configured" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

    - name: Clear Stale Terraform Locks
      shell: bash
      working-directory: terraform
      run: |
        echo "🔍 Checking for stale Terraform locks..."

        # Try to detect existing lock without bypassing it
        if terraform plan -refresh=false -detailed-exitcode 2>&1 | tee lock-check.log | grep -q "Error acquiring the state lock"; then
          echo "⚠️  Detected existing Terraform state lock"
          
          # Extract lock information
          LOCK_ID=$(grep -A 10 "Lock Info:" lock-check.log | grep "ID:" | awk '{print $2}')
          LOCK_WHO=$(grep -A 10 "Lock Info:" lock-check.log | grep "Who:" | awk '{print $2}')
          LOCK_CREATED=$(grep -A 10 "Lock Info:" lock-check.log | grep "Created:" | awk '{print $2, $3}')
          
          if [ -n "$LOCK_ID" ]; then
            echo "📋 Lock Details:"
            echo "  ID: $LOCK_ID"
            echo "  Who: $LOCK_WHO"
            echo "  Created: $LOCK_CREATED"
            
            # Check if lock is stale (older than 30 minutes)
            LOCK_AGE_SECONDS=$(( $(date +%s) - $(date -d "$LOCK_CREATED" +%s 2>/dev/null || echo 0) ))
            LOCK_AGE_MINUTES=$(( LOCK_AGE_SECONDS / 60 ))
            
            if [ $LOCK_AGE_MINUTES -gt 30 ] || [ -z "$LOCK_CREATED" ]; then
              echo "🔓 Lock appears stale (${LOCK_AGE_MINUTES}m old), force-unlocking..."
              terraform force-unlock -force "$LOCK_ID"
              echo "✅ Stale lock cleared successfully"
              echo "## 🔓 Cleared Stale Lock" >> $GITHUB_STEP_SUMMARY
              echo "- **Lock ID**: \`$LOCK_ID\`" >> $GITHUB_STEP_SUMMARY
              echo "- **Age**: ${LOCK_AGE_MINUTES} minutes" >> $GITHUB_STEP_SUMMARY
            else
              echo "⏳ Lock is recent (${LOCK_AGE_MINUTES}m old), waiting for it to clear..."
              echo "## ⏳ Waiting for Active Lock" >> $GITHUB_STEP_SUMMARY
              echo "- **Lock ID**: \`$LOCK_ID\`" >> $GITHUB_STEP_SUMMARY
              echo "- **Age**: ${LOCK_AGE_MINUTES} minutes" >> $GITHUB_STEP_SUMMARY
              echo "Will retry with 10-minute timeout..." >> $GITHUB_STEP_SUMMARY
            fi
          fi
        else
          echo "✅ No stale locks detected"
        fi

        rm -f lock-check.log

    - name: Deploy Infrastructure with Terraform
      id: terraform-deploy
      shell: bash
      working-directory: terraform
      run: |
        LAMBDA_NAME="${{ inputs.lambda-name }}"
        TF_TARGET="${{ inputs.terraform-target }}"

        echo "📋 Planning Terraform changes for $TF_TARGET..."
        echo "⏳ Will wait up to 10 minutes if state is locked by another deployment..."

        # Retry logic for terraform plan with lock timeout
        MAX_RETRIES=20
        RETRY_DELAY=30
        RETRY_COUNT=0
        PLAN_SUCCESS=false

        while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
          if terraform plan -target="$TF_TARGET" -lock-timeout=10m 2>&1 | tee plan.log; then
            echo "✅ Terraform plan successful"
            PLAN_SUCCESS=true
            break
          else
            EXIT_CODE=$?
            RETRY_COUNT=$((RETRY_COUNT + 1))
            
            # Check if this was a lock error and capture lock ID
            if grep -q "Error acquiring the state lock" plan.log; then
              LOCK_ID=$(grep -A 10 "Lock Info:" plan.log | grep "ID:" | awk '{print $2}')
              if [ -n "$LOCK_ID" ]; then
                echo "lock_id=$LOCK_ID" >> $GITHUB_OUTPUT
                echo "🔒 Detected lock held by another process (ID: $LOCK_ID)"
              fi
            fi
            
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "⚠️  Terraform plan failed (attempt $RETRY_COUNT/$MAX_RETRIES). Retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            else
              echo "❌ Terraform plan failed after $MAX_RETRIES attempts"
              exit $EXIT_CODE
            fi
          fi
        done

        if [ "$PLAN_SUCCESS" = true ]; then
          echo "🚀 Applying Terraform changes..."
          terraform apply -target="$TF_TARGET" -auto-approve -lock-timeout=10m
          
          echo "✅ Infrastructure deployment completed for $LAMBDA_NAME"
          
          echo "## 🎉 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Lambda**: $LAMBDA_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- **Terraform Target**: $TF_TARGET" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Cleanup Terraform Lock on Failure or Cancellation
      if: (failure() || cancelled()) && steps.terraform-deploy.outputs.lock_id != ''
      shell: bash
      working-directory: terraform
      run: |
        LOCK_ID="${{ steps.terraform-deploy.outputs.lock_id }}"
        STATUS="${{ job.status }}"

        if [ "$STATUS" = "cancelled" ]; then
          echo "🔓 Workflow was cancelled - attempting to release Terraform lock: $LOCK_ID"
          echo "⚠️  Cancellation may have left the state locked"
        else
          echo "🔓 Attempting to release stuck Terraform lock: $LOCK_ID"
          echo "⚠️  This workflow failed and may have left the state locked"
        fi

        # Try to force unlock if we captured a lock ID
        if [ -n "$LOCK_ID" ]; then
          echo "Running: terraform force-unlock -force $LOCK_ID"
          if terraform force-unlock -force "$LOCK_ID" 2>&1; then
            echo "✅ Successfully released Terraform state lock"
            echo "## 🔓 Lock Cleanup" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: Successfully released stuck lock" >> $GITHUB_STEP_SUMMARY
            echo "- **Lock ID**: \`$LOCK_ID\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Reason**: Workflow $STATUS" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  Could not automatically release lock (may have already been released)"
            echo "## ⚠️  Manual Lock Cleanup May Be Required" >> $GITHUB_STEP_SUMMARY
            echo "- **Lock ID**: \`$LOCK_ID\`" >> $GITHUB_STEP_SUMMARY
            echo "- Run manually: \`terraform force-unlock $LOCK_ID\`" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "⚠️  No lock ID captured, cannot automatically unlock"
          echo "## ⚠️  Manual Lock Check Recommended" >> $GITHUB_STEP_SUMMARY
          echo "If state is locked, check DynamoDB table \`terraform-state-locks\`" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Capture Current Lock Info for Manual Cleanup
      if: always()
      shell: bash
      working-directory: terraform
      run: |
        # Save lock info that can be used for manual cleanup if needed
        echo "🔍 Checking for any remaining locks..."

        # Try to detect lock by attempting plan (will fail if locked)
        if terraform plan -refresh=false -detailed-exitcode > /dev/null 2>&1; then
          echo "✅ No locks detected - state is clean"
        elif terraform plan -refresh=false 2>&1 | grep -q "Error acquiring the state lock"; then
          echo "⚠️  State is still locked after deployment"
          echo "## ⚠️  Manual Lock Cleanup May Be Required" >> $GITHUB_STEP_SUMMARY
          
          # Extract and display lock info
          LOCK_INFO=$(terraform plan -refresh=false 2>&1 || true)
          LOCK_ID=$(echo "$LOCK_INFO" | grep -A 10 "Lock Info:" | grep "ID:" | awk '{print $2}')
          
          if [ -n "$LOCK_ID" ]; then
            echo "- **Lock ID**: \`$LOCK_ID\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Cleanup**: Run \`node scripts/terraform-unlock.js\` locally" >> $GITHUB_STEP_SUMMARY
            echo "To manually unlock: terraform force-unlock $LOCK_ID"
          else
            echo "Check DynamoDB table \`terraform-state-locks\` for lock details" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "✅ No locks detected"
        fi
