name: "Run Nx Tasks"
description: "Run Nx tasks following official Nx best practices"
inputs:
  tasks:
    description: 'Space-separated list of tasks to run (e.g., "lint test build")'
    required: true
  scope:
    description: 'Scope of execution: "affected" or "all"'
    required: false
    default: "affected"
  parallel:
    description: "Number of parallel processes"
    required: false
    default: "4"
  verbose:
    description: "Enable verbose output"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Run Nx Tasks
      shell: bash
      run: |
        tasks="${{ inputs.tasks }}"
        scope="${{ inputs.scope }}"
        parallel="${{ inputs.parallel }}"
        verbose_flag=""

        if [[ "${{ inputs.verbose }}" == "true" ]]; then
          verbose_flag="--verbose"
        fi

        echo "Running tasks: $tasks"
        echo "Scope: $scope"
        echo "Parallel: $parallel"

        # Set Nx Cloud environment variables following official recommendations
        export NX_CLOUD_NO_TIMEOUTS=true
        export NX_VERBOSE_LOGGING=true

        # Build the nx command following Nx best practices
        if [[ "$scope" == "affected" ]]; then
          nx_cmd="npx nx affected --parallel=$parallel -t $tasks $verbose_flag"
        else
          nx_cmd="npx nx run-many --parallel=$parallel -t $tasks $verbose_flag"
        fi

        echo "Executing: $nx_cmd"

        # Run the command and let Nx Cloud handle its own retry logic
        eval "$nx_cmd"
