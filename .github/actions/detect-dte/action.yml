name: "Detect Nx Cloud DTE Availability"
description: "Intelligently detects Nx Cloud DTE availability and configures optimal execution settings with quota monitoring and fallback handling"

inputs:
  nx-cloud-token:
    description: "Nx Cloud access token"
    required: false
    default: ""
  max-retries:
    description: "Maximum retry attempts for DTE detection"
    required: false
    default: "2"
  timeout-seconds:
    description: "Timeout for cloud connectivity tests"
    required: false
    default: "30"
  min-agents:
    description: "Minimum agents required for DTE to be considered viable"
    required: false
    default: "2"
  quota-threshold:
    description: "Minimum quota remaining percentage for DTE (0-100)"
    required: false
    default: "10"

outputs:
  cloud-available:
    description: "Whether Nx Cloud is accessible"
    value: ${{ steps.detect.outputs.cloud-available }}
  dte-available:
    description: "Whether DTE is available and viable"
    value: ${{ steps.detect.outputs.dte-available }}
  execution-mode:
    description: "Recommended execution mode (distributed/local)"
    value: ${{ steps.detect.outputs.execution-mode }}
  optimal-agents:
    description: "Optimal number of agents/parallel processes"
    value: ${{ steps.detect.outputs.optimal-agents }}
  agent-matrix:
    description: "JSON array of agent indices for the agents matrix job (e.g. [1,2,3])"
    value: ${{ steps.detect.outputs.agent-matrix }}
  fallback-reason:
    description: "Reason for fallback to local execution"
    value: ${{ steps.detect.outputs.fallback-reason }}
  memory-limit:
    description: "Recommended Node.js memory limit"
    value: ${{ steps.detect.outputs.memory-limit }}
  nx-parallel:
    description: "Recommended NX_PARALLEL value"
    value: ${{ steps.detect.outputs.nx-parallel }}
  quota-remaining:
    description: "DTE quota status (available/0/unknown)"
    value: ${{ steps.detect.outputs.quota-remaining }}

runs:
  using: "composite"
  steps:
    - name: "☁️ Intelligent DTE Detection & Quota Check"
      id: detect
      shell: bash
      run: |
        echo "::group::🧠 Smart Nx Cloud Detection with Usage Limits"

        # Initialize defaults
        CLOUD_AVAILABLE="false"
        DTE_AVAILABLE="false"  
        EXECUTION_MODE="local"
        OPTIMAL_AGENTS=4
        FALLBACK_REASON=""
        MEMORY_LIMIT="4096"
        QUOTA_REMAINING="unknown"

        # Get input values
        NX_CLOUD_TOKEN="${{ inputs.nx-cloud-token }}"
        MAX_RETRIES="${{ inputs.max-retries }}"
        TIMEOUT_SECONDS="${{ inputs.timeout-seconds }}"
        QUOTA_THRESHOLD="${{ inputs.quota-threshold }}"

        if [ -n "$NX_CLOUD_TOKEN" ]; then
          echo "✅ Nx Cloud token found"
          
          # Export token for nx-cloud CLI
          export NX_CLOUD_ACCESS_TOKEN="$NX_CLOUD_TOKEN"
          
          # Test basic cloud connectivity
          echo "🌐 Testing cloud connectivity and quota..."
          # First locate nx-cloud CLI via pnpm or npx
          NX_CLOUD_CMD=""
          if command -v pnpm >/dev/null 2>&1 && pnpm exec nx-cloud --version >/dev/null 2>&1; then
            NX_CLOUD_CMD="pnpm exec nx-cloud"
          elif command -v npx >/dev/null 2>&1; then
            # Fallback to npx when node_modules are not installed (detect-dte skips full pnpm install)
            NX_CLOUD_CMD="npx --yes nx-cloud"
          fi

          if [ -z "$NX_CLOUD_CMD" ]; then
            FALLBACK_REASON="Nx Cloud CLI not available (pnpm/pnpm exec missing)"
            echo "❌ $FALLBACK_REASON"
          else
            echo "✅ Nx Cloud CLI available"
            
            # CHECK DTE QUOTA - Try to start a minimal CI run to test availability
            echo "🔍 Checking DTE quota availability..."
            
            # Attempt to start DTE with minimal resources and capture output
            QUOTA_CHECK_OUTPUT=$(mktemp)
            QUOTA_CHECK_RESULT=0
            
            # Try to get workspace status which includes quota info
            if $NX_CLOUD_CMD report --help >/dev/null 2>&1; then
              $NX_CLOUD_CMD report 2>&1 | tee "$QUOTA_CHECK_OUTPUT" || QUOTA_CHECK_RESULT=$?
            else
              # Fallback: try to start a minimal DTE session
              echo "Testing DTE availability with minimal session..."
              timeout 10 $NX_CLOUD_CMD start-ci-run --distribute-on="1 linux-medium-js" 2>&1 | tee "$QUOTA_CHECK_OUTPUT" || QUOTA_CHECK_RESULT=$?
              # Stop the test run immediately
              $NX_CLOUD_CMD stop-all-agents >/dev/null 2>&1 || true
            fi
            
            # Check for quota-related errors OR authorization failures in output
            if grep -qi "quota\|limit\|exceeded\|insufficient\|disabled\|unauthorized\|authorization\|401" "$QUOTA_CHECK_OUTPUT"; then
              FALLBACK_REASON="DTE quota exceeded, insufficient, or authorization failed"
              echo "⚠️ $FALLBACK_REASON"
              echo "Quota check output:"
              cat "$QUOTA_CHECK_OUTPUT"
              QUOTA_REMAINING="0"
              
              # Even though quota may be exceeded, keep trying - sometimes it's just a warning
              CLOUD_AVAILABLE="true"
              DTE_AVAILABLE="false"
              EXECUTION_MODE="local"
            elif [ $QUOTA_CHECK_RESULT -eq 124 ]; then
              # Timeout occurred - this is actually OK, means DTE started
              echo "✅ DTE session started successfully (timeout is expected)"
              CLOUD_AVAILABLE="true"
              DTE_AVAILABLE="true"
              EXECUTION_MODE="distributed"
              OPTIMAL_AGENTS=8
              MEMORY_LIMIT="6144"
              QUOTA_REMAINING="available"
            elif [ $QUOTA_CHECK_RESULT -ne 0 ]; then
              # Non-zero exit but not quota related
              echo "⚠️ DTE check returned non-zero exit code: $QUOTA_CHECK_RESULT"
              echo "Check output:"
              cat "$QUOTA_CHECK_OUTPUT"
              
              # Still try to use DTE - errors might be transient
              CLOUD_AVAILABLE="true"
              DTE_AVAILABLE="true"
              EXECUTION_MODE="distributed"
              OPTIMAL_AGENTS=8
              MEMORY_LIMIT="6144"
              QUOTA_REMAINING="unknown"
            else
              # Success - DTE is available
              echo "✅ DTE quota check passed"
              CLOUD_AVAILABLE="true"
              DTE_AVAILABLE="true"
              EXECUTION_MODE="distributed"
              OPTIMAL_AGENTS=8
              MEMORY_LIMIT="6144"
              QUOTA_REMAINING="available"
            fi
            
            rm -f "$QUOTA_CHECK_OUTPUT"
            
            echo "🚀 DTE configuration complete"
            echo "   Execution mode: $EXECUTION_MODE"
            echo "   Quota status: $QUOTA_REMAINING"
          fi
        else
          FALLBACK_REASON="No Nx Cloud token provided"
          echo "ℹ️ $FALLBACK_REASON"
        fi

        # Generate agent matrix array (capped at 3 GitHub-hosted runners)
        AGENT_CAP=3
        AGENT_COUNT=$(( OPTIMAL_AGENTS < AGENT_CAP ? OPTIMAL_AGENTS : AGENT_CAP ))
        AGENT_ARRAY="["
        for i in $(seq 1 $AGENT_COUNT); do
          [ $i -gt 1 ] && AGENT_ARRAY="${AGENT_ARRAY},"
          AGENT_ARRAY="${AGENT_ARRAY}${i}"
        done
        AGENT_ARRAY="${AGENT_ARRAY}]"

        # Set outputs
        echo "cloud-available=$CLOUD_AVAILABLE" >> $GITHUB_OUTPUT
        echo "dte-available=$DTE_AVAILABLE" >> $GITHUB_OUTPUT
        echo "execution-mode=$EXECUTION_MODE" >> $GITHUB_OUTPUT
        echo "optimal-agents=$OPTIMAL_AGENTS" >> $GITHUB_OUTPUT
        echo "agent-matrix=$AGENT_ARRAY" >> $GITHUB_OUTPUT
        echo "fallback-reason=$FALLBACK_REASON" >> $GITHUB_OUTPUT
        echo "memory-limit=$MEMORY_LIMIT" >> $GITHUB_OUTPUT
        echo "nx-parallel=$OPTIMAL_AGENTS" >> $GITHUB_OUTPUT
        echo "quota-remaining=$QUOTA_REMAINING" >> $GITHUB_OUTPUT

        # Create summary report
        echo "## ☁️ Execution Mode Detection" >> $GITHUB_STEP_SUMMARY
        echo "- **Cloud Available**: $CLOUD_AVAILABLE" >> $GITHUB_STEP_SUMMARY
        echo "- **DTE Available**: $DTE_AVAILABLE" >> $GITHUB_STEP_SUMMARY  
        echo "- **Execution Mode**: $EXECUTION_MODE" >> $GITHUB_STEP_SUMMARY
        echo "- **Agents/Parallel**: $OPTIMAL_AGENTS" >> $GITHUB_STEP_SUMMARY
        echo "- **Memory Limit**: ${MEMORY_LIMIT}MB" >> $GITHUB_STEP_SUMMARY
        echo "- **Quota Status**: $QUOTA_REMAINING" >> $GITHUB_STEP_SUMMARY

        if [ "$EXECUTION_MODE" == "local" ] && [ -n "$FALLBACK_REASON" ]; then
          echo "- **Fallback Reason**: $FALLBACK_REASON" >> $GITHUB_STEP_SUMMARY
        fi

        # Set appropriate notices
        if [ "$DTE_AVAILABLE" == "true" ]; then
          echo "::notice title=Nx Cloud DTE::Using distributed execution with $OPTIMAL_AGENTS agents (quota: $QUOTA_REMAINING)"
        else
          if [ "$QUOTA_REMAINING" == "0" ]; then
            echo "::warning title=DTE Quota Exhausted::$FALLBACK_REASON - using GitHub Actions ($OPTIMAL_AGENTS processes)"
          else
            echo "::notice title=Local Execution::$FALLBACK_REASON - using GitHub Actions ($OPTIMAL_AGENTS processes)"
          fi
        fi

        echo "::endgroup::"

    - name: "🔧 Configure Environment Variables"
      shell: bash
      run: |
        echo "Setting environment variables based on DTE detection results..."

        # Set environment variables for subsequent workflow steps
        echo "NX_PARALLEL=${{ steps.detect.outputs.nx-parallel }}" >> $GITHUB_ENV
        # NOTE: NODE_OPTIONS cannot be set via $GITHUB_ENV (GitHub Actions restriction)
        # Use the memory-limit output directly in workflow steps if needed:
        # NODE_OPTIONS=--max_old_space_size=${{ steps.detect-dte.outputs.memory-limit }}
        echo "NX_CLOUD_DISTRIBUTED_EXECUTION=${{ steps.detect.outputs.dte-available }}" >> $GITHUB_ENV

        # Set cache configuration based on execution mode
        if [ "${{ steps.detect.outputs.dte-available }}" == "true" ]; then
          echo "NX_DAEMON=false" >> $GITHUB_ENV
          echo "NX_SKIP_NX_CACHE=false" >> $GITHUB_ENV
        else
          echo "NX_DAEMON=false" >> $GITHUB_ENV
          echo "NX_SKIP_NX_CACHE=false" >> $GITHUB_ENV
        fi

        # Note: NX_VERBOSE_LOGGING is controlled at the workflow level via ci-debug label or debug_mode input
        # This action does not override that setting to respect user preferences

        echo "✅ Environment configured for ${{ steps.detect.outputs.execution-mode }} execution"
