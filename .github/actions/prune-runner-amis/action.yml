# prune-runner-amis composite action — shared prune logic for runner AMIs.
#
# Retains the 5 most recent AMIs by creation date, plus any version still
# referenced by main or an open PR branch's runner-ami.auto.tfvars. Keeps the
# AMI count bounded without a cron job (LS-3885, LS-4946).
#
# Caller responsibilities (not done here):
#   - actions/checkout (this action reads terraform/runners/runner-ami.auto.tfvars
#     from the working tree)
#   - aws-actions/configure-aws-credentials with the
#     legacy-sports-dev-runner-ami-builder OIDC role
#
# Consumed by:
#   - .github/workflows/rebuild-runner-ami.yml (post-build inline step)
#   - .github/workflows/prune-runner-amis.yml (standalone workflow_dispatch)

name: "Prune Runner AMIs"
description: "Deregister old runner AMIs, keeping the 5 most recent plus versions referenced by main or open PRs"

runs:
  using: "composite"
  steps:
    - name: Prune old runner AMIs
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        KEEP_COUNT=5

        echo "=== Runner AMI prune (retain $KEEP_COUNT most recent) ==="

        # Protected versions = main's runner_ami_playwright_version + every
        # open PR branch's runner_ami_playwright_version. A PR that has not
        # yet rebuilt the AMI still references the old version, so we keep
        # it alive until the PR merges or closes. Main is queried via gh api
        # rather than the working tree because callers may have checked out
        # a PR branch (post-build prune in rebuild-runner-ami.yml).
        # Fetch main's protected version with hard error handling — silently
        # missing main's version could allow the active main AMI to be
        # deregistered. Failure here aborts the whole prune (set -e).
        MAIN_VERSION=$(gh api "repos/$REPO/contents/terraform/runners/runner-ami.auto.tfvars?ref=main" \
          --jq '.content' \
          | base64 -d \
          | awk '
              /^runner_ami_playwright_version[[:space:]]*=/ {
                match($0, /"[0-9.]+"/)
                print substr($0, RSTART + 1, RLENGTH - 2)
                exit
              }
            ')
        if [[ -z "$MAIN_VERSION" ]]; then
          echo "::error::Could not resolve runner_ami_playwright_version from main's tfvars — refusing to prune"
          exit 1
        fi

        {
          echo "$MAIN_VERSION"

          # Paginate through all open PRs (gh pr list --limit silently truncates;
          # gh api --paginate follows the GitHub Link header until exhausted).
          gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[].head.ref' \
            | while read -r BRANCH; do
                gh api "repos/$REPO/contents/terraform/runners/runner-ami.auto.tfvars?ref=$BRANCH" \
                  --jq '.content' 2>/dev/null \
                  | base64 -d 2>/dev/null \
                  | awk '
                      /^runner_ami_playwright_version[[:space:]]*=/ {
                        match($0, /"[0-9.]+"/)
                        print substr($0, RSTART + 1, RLENGTH - 2)
                        exit
                      }
                    ' || true
              done
        } | sort -u > protected-versions.txt

        echo "Protected versions (main + open PRs):"
        cat protected-versions.txt

        ALL_AMIS=$(aws ec2 describe-images \
          --owners self \
          --filters "Name=name,Values=legacy-sports-runner-*" \
          --query "sort_by(Images, &CreationDate) | reverse(@) | [*].{Id:ImageId,Name:Name,Created:CreationDate}" \
          --output json)

        echo "Total AMIs: $(echo "$ALL_AMIS" | jq 'length')"

        KEEP_IDS=$(echo "$ALL_AMIS" | jq -r --argjson n "$KEEP_COUNT" '.[0:$n] | .[].Id')

        while read -r VERSION; do
          [[ -z "$VERSION" ]] && continue
          MATCH_IDS=$(echo "$ALL_AMIS" \
            | jq -r --arg v "$VERSION" '.[] | select(.Name | contains("-pw" + $v + "-")) | .Id')
          KEEP_IDS=$(printf "%s\n%s" "$KEEP_IDS" "$MATCH_IDS")
        done < protected-versions.txt

        KEEP_IDS_UNIQUE=$(echo "$KEEP_IDS" | sort -u | grep -v '^$' || true)
        echo "Keeping AMIs:"
        printf "%s\n" "$KEEP_IDS_UNIQUE"

        DELETE_IDS=$(echo "$ALL_AMIS" | jq -r '.[].Id' \
          | grep -vFxf <(echo "$KEEP_IDS_UNIQUE") || true)

        if [[ -z "$DELETE_IDS" ]]; then
          echo "✅ Nothing to prune."
          exit 0
        fi

        echo "Pruning $(echo "$DELETE_IDS" | wc -l | tr -d ' ') AMI(s):"
        printf "%s\n" "$DELETE_IDS"

        for AMI_ID in $DELETE_IDS; do
          SNAPSHOTS=$(aws ec2 describe-images \
            --image-ids "$AMI_ID" \
            --query "Images[0].BlockDeviceMappings[?Ebs.SnapshotId].Ebs.SnapshotId" \
            --output text 2>/dev/null || echo "")

          echo "Deregistering $AMI_ID..."
          aws ec2 deregister-image --image-id "$AMI_ID"

          for SNAPSHOT_ID in $SNAPSHOTS; do
            echo "  Deleting snapshot $SNAPSHOT_ID..."
            aws ec2 delete-snapshot --snapshot-id "$SNAPSHOT_ID" || \
              echo "::warning::Failed to delete snapshot $SNAPSHOT_ID (may be in use)"
          done
        done

        echo "✅ Prune complete."
