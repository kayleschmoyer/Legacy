name: "CI Pipeline Reporting"
description: "Comprehensive CI reporting with PR comments, status updates, and intelligent failure analysis for enhanced developer feedback"

inputs:
  status:
    description: "Overall CI status (success/failure)"
    required: true
  github-token:
    description: "GitHub token for PR comments"
    required: true
  event-name:
    description: "GitHub event name"
    required: true
  pr-number:
    description: "Pull request number (if applicable)"
    required: false
  execution-mode:
    description: "Execution mode used (distributed/local)"
    required: false
    default: "local"
  optimal-agents:
    description: "Number of agents/processes used"
    required: false
    default: "4"
  fallback-reason:
    description: "Reason for DTE fallback"
    required: false
  execution-plan:
    description: "JSON execution plan"
    required: false
  step-results:
    description: "JSON object with step results"
    required: false
  workflow-duration:
    description: "Total workflow duration in seconds"
    required: false
  run-id:
    description: "GitHub Actions run ID"
    required: false
  job-id:
    description: "GitHub Actions job ID"
    required: false

outputs:
  comment-id:
    description: "ID of the created/updated PR comment"
    value: ${{ steps.pr-comment.outputs.comment_id }}
  report-generated:
    description: "Whether a report was generated"
    value: ${{ steps.generate-report.outputs.report-generated }}

runs:
  using: "composite"
  steps:
    - name: "📊 Generate CI Report"
      id: generate-report
      shell: bash
      run: |
        echo "::group::📊 CI Pipeline Report Generation"

        STATUS="${{ inputs.status }}"
        EVENT_NAME="${{ inputs.event-name }}"
        EXECUTION_MODE="${{ inputs.execution-mode }}"
        OPTIMAL_AGENTS="${{ inputs.optimal-agents }}"
        FALLBACK_REASON="${{ inputs.fallback-reason }}"
        WORKFLOW_DURATION="${{ inputs.workflow-duration || 'unknown' }}"

        echo "📋 Generating comprehensive CI report..."
        echo "  - Status: $STATUS"
        echo "  - Event: $EVENT_NAME"
        echo "  - Execution Mode: $EXECUTION_MODE"
        echo "  - Duration: ${WORKFLOW_DURATION}s"

        # Create comprehensive report JSON
        TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

        # Determine duration category first
        if [ "$WORKFLOW_DURATION" != "unknown" ] && [ "$WORKFLOW_DURATION" -gt 1200 ]; then
          DURATION_CATEGORY="slow"
        elif [ "$WORKFLOW_DURATION" != "unknown" ] && [ "$WORKFLOW_DURATION" -lt 600 ]; then
          DURATION_CATEGORY="fast"
        else
          DURATION_CATEGORY="normal"
        fi

        printf '%s\n' "{\"pipeline\":{\"status\":\"$STATUS\",\"timestamp\":\"$TIMESTAMP\",\"duration_seconds\":\"$WORKFLOW_DURATION\",\"trigger\":\"$EVENT_NAME\",\"execution_mode\":\"$EXECUTION_MODE\",\"agents_used\":\"$OPTIMAL_AGENTS\",\"fallback_reason\":\"$FALLBACK_REASON\"},\"performance\":{\"mode_used\":\"$EXECUTION_MODE\",\"agent_count\":\"$OPTIMAL_AGENTS\",\"duration_category\":\"$DURATION_CATEGORY\"}}" > ci-report.json

        echo "report-generated=true" >> $GITHUB_OUTPUT

        # Create performance insights
        echo "## 📊 CI Performance Analysis" >> $GITHUB_STEP_SUMMARY
        echo "- **Execution Mode**: $EXECUTION_MODE" >> $GITHUB_STEP_SUMMARY
        echo "- **Agents/Processes**: $OPTIMAL_AGENTS" >> $GITHUB_STEP_SUMMARY

        if [ "$WORKFLOW_DURATION" != "unknown" ]; then
          echo "- **Duration**: ${WORKFLOW_DURATION}s" >> $GITHUB_STEP_SUMMARY
          
          if [ "$WORKFLOW_DURATION" -gt 1200 ]; then
            echo "- **Performance**: ⚠️ Slow (consider optimization)" >> $GITHUB_STEP_SUMMARY
          elif [ "$WORKFLOW_DURATION" -lt 600 ]; then
            echo "- **Performance**: 🎉 Excellent" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Performance**: ✅ Good" >> $GITHUB_STEP_SUMMARY
          fi
        fi

        if [ "$EXECUTION_MODE" = "distributed" ]; then
          echo "- **Optimization**: 🚀 DTE enabled (60-80% faster)" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **Optimization**: ⚡ Local execution" >> $GITHUB_STEP_SUMMARY
          if [ -n "$FALLBACK_REASON" ]; then
            echo "- **DTE Fallback**: $FALLBACK_REASON" >> $GITHUB_STEP_SUMMARY
          fi
        fi

        echo "📊 CI report generated successfully"
        echo "::endgroup::"

    - name: "💬 PR Comment - Failure Report"
      id: pr-failure-comment
      if: inputs.status == 'failure' && inputs.event-name == 'pull_request' && inputs.pr-number != ''
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const commentMarker = "<!-- CI-PIPELINE-STATUS -->";

          // Parse step results if provided
          let stepResults = {};
          try {
            if ('${{ inputs.step-results }}') {
              stepResults = JSON.parse('${{ inputs.step-results }}');
            }
          } catch (e) {
            console.log('No step results provided or parsing failed');
          }

          // Find existing CI comment to update (using unified marker)
          const comments = await github.rest.issues.listComments({
            issue_number: ${{ inputs.pr-number }},
            owner: context.repo.owner,
            repo: context.repo.repo,
          });

          let existingComment = comments.data.find(comment => 
            comment.body && comment.body.includes(commentMarker)
          );

          // Determine specific failure context and provide targeted guidance
          let failureReason = "CI pipeline failure detected";
          let reproCommand = "pnpm exec nx affected -t lint,typecheck,test,build --parallel=4";
          let debugSection = "A CI step failed. Run the reproduction command to identify the specific issue.";

          // Analyze step results for specific guidance
          const stepAnalysis = {
            'format-check': {
              reason: 'Code formatting check failed',
              command: 'pnpm exec nx format:write',
              debug: 'Code formatting issues detected. Run the command above to auto-fix formatting, then commit the changes.'
            },
            'quality-gates': {
              reason: 'Code quality validation failed',
              command: 'pnpm exec nx affected -t lint,typecheck,test --parallel=4',
              debug: 'Quality gates failed. This typically means ESLint errors, TypeScript compilation issues, or failing tests.'
            },
            'build-validation': {
              reason: 'Build validation failed',
              command: 'pnpm exec nx affected -t build --parallel=4',
              debug: 'Build validation failed. Check for compilation errors, missing dependencies, or configuration issues.'
            },
            'e2e-testing': {
              reason: 'End-to-end tests failed',
              command: 'cd apps/web-e2e && pnpm exec playwright test --ui',
              debug: 'E2E tests are failing. Check for UI changes, API issues, or test environment problems.'
            }
          };

          // Check step results for first failure
          let failedSteps = [];
          Object.entries(stepResults).forEach(([step, result]) => {
            if (result === 'failure') {
              failedSteps.push(step);
              if (!reproCommand.includes('format') && stepAnalysis[step]) {
                failureReason = stepAnalysis[step].reason;
                reproCommand = stepAnalysis[step].command;
                debugSection = stepAnalysis[step].debug;
              }
            }
          });

          // Create step status table if we have step results
          let stepStatusTable = "";
          if (Object.keys(stepResults).length > 0) {
            stepStatusTable = "\n### 🔍 Step Status Details\n" +
                             "| Step | Status |\n" +
                             "|------|--------|\n";
            Object.entries(stepResults).forEach(([step, result]) => {
              const icon = result === 'success' ? '✅' : 
                          result === 'failure' ? '❌' : 
                          result === 'skipped' ? '⏭️' : '❓';
              const stepName = step.replace(/[-_]/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
              stepStatusTable += `| ${stepName} | ${icon} ${result || 'unknown'} |\n`;
            });
            stepStatusTable += "\n";
          }

          const executionMode = "${{ inputs.execution-mode }}";
          const agents = "${{ inputs.optimal-agents }}";
          const fallbackReason = "${{ inputs.fallback-reason }}";
          const runId = "${{ inputs.run-id }}";

          const comment = commentMarker + "\n" +
                         "## ❌ CI Pipeline Failed\n\n" +
                         "**Failure**: " + failureReason + "\n\n" +
                         "### 🔍 Quick Debug\n" +
                         debugSection + "\n\n" +
                         stepStatusTable +
                         "### 🛠️ How to Fix Locally\n" +
                         "```bash\n" +
                         "# Reproduce the failure:\n" +
                         reproCommand + "\n\n" +
                         "# Full local CI simulation:\n" +
                         "pnpm run ci:local  # Run full CI pipeline locally\n" +
                         "```\n\n" +
                         "### 📊 Execution Context\n" +
                         "- **Mode**: " + (executionMode === 'distributed' ? 'Distributed Task Execution (DTE)' : 'Local GitHub Actions') + "\n" +
                         (fallbackReason ? "- **Fallback Reason**: " + fallbackReason + "\n" : "") +
                         "- **Agents/Processes**: " + agents + "\n" +
                         (failedSteps.length > 0 ? "- **Failed Steps**: " + failedSteps.join(', ') + "\n" : "") +
                         "\n### 📋 Next Steps\n" +
                         "1. **Run the reproduction command** above to identify the specific issue\n" +
                         "2. **Fix the failing tests/lint/build** issues\n" +
                         "3. **Push your changes** - CI will automatically re-run\n" +
                         "4. **Check our [troubleshooting guide](./docs/troubleshooting.md)** for common issues\n\n" +
                         "### 🔗 Useful Links\n" +
                         (runId ? "- 📊 [Workflow Run Details](" + context.payload.repository.html_url + "/actions/runs/" + runId + ")\n" : "") +
                         "- 🔍 [CI Documentation](" + context.payload.repository.html_url + "/blob/main/README.md#ci-pipeline)\n" +
                         "- 🧠 [Troubleshooting Guide](" + context.payload.repository.html_url + "/blob/main/docs/troubleshooting.md)\n\n" +
                         "---\n" +
                         "*This comment is automatically updated by CI on each run.*\n";

          // Update existing comment or create new one
          if (existingComment) {
            await github.rest.issues.updateComment({
              comment_id: existingComment.id,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
            console.log("Updated existing CI failure comment #" + existingComment.id);
            core.setOutput('comment_id', existingComment.id);
            return { comment_id: existingComment.id };
          } else {
            const newComment = await github.rest.issues.createComment({
              issue_number: ${{ inputs.pr-number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
            console.log("Created new CI failure comment #" + newComment.data.id);
            core.setOutput('comment_id', newComment.data.id);
            return { comment_id: newComment.data.id };
          }

    - name: "✅ PR Comment - Success Report"
      id: pr-success-comment
      if: inputs.status == 'success' && inputs.event-name == 'pull_request' && inputs.pr-number != ''
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const commentMarker = "<!-- CI-PIPELINE-STATUS -->";

          const executionMode = "${{ inputs.execution-mode }}";
          const agents = "${{ inputs.optimal-agents }}";
          const fallbackReason = "${{ inputs.fallback-reason }}";
          const workflowDuration = "${{ inputs.workflow-duration }}";

          let performanceNote = "";
          if (executionMode === 'distributed') {
            performanceNote = "🚀 **Performance**: 60-80% faster with Distributed Task Execution";
          } else {
            performanceNote = "⚡ **Performance**: Standard GitHub Actions";
            if (!fallbackReason) {
              performanceNote += " (add NX_CLOUD_ACCESS_TOKEN for 60-80% speedup)";
            }
          }

          // Add duration context if available
          let durationNote = "";
          if (workflowDuration && workflowDuration !== 'unknown') {
            const duration = parseInt(workflowDuration);
            const minutes = Math.floor(duration / 60);
            const seconds = duration % 60;
            
            if (duration < 300) {
              durationNote = `⚡ **Duration**: ${minutes}m ${seconds}s (Excellent!)`;
            } else if (duration < 600) {
              durationNote = `✅ **Duration**: ${minutes}m ${seconds}s (Good)`;
            } else {
              durationNote = `⚠️ **Duration**: ${minutes}m ${seconds}s (Consider optimization)`;
            }
          }

          const comment = commentMarker + "\n" +
                         "## ✅ CI Pipeline Passed\n\n" +
                         "All checks completed successfully! This PR is ready for review and merge.\n\n" +
                         "### 📊 Execution Summary\n" +
                         "- **Mode**: " + (executionMode === 'distributed' ? 'Distributed Task Execution (DTE)' : 'Local GitHub Actions') + "\n" +
                         "- **Agents/Processes**: " + agents + "\n" +
                         "- " + performanceNote + "\n" +
                         (durationNote ? "- " + durationNote + "\n" : "") +
                         (fallbackReason ? "- **Note**: " + fallbackReason + "\n" : "") +
                         "\n### 🎯 What Was Validated\n" +
                         "- ✅ Code formatting and style\n" +
                         "- ✅ ESLint rules and best practices\n" +
                         "- ✅ TypeScript type checking\n" +
                         "- ✅ Unit tests and coverage\n" +
                         "- ✅ Build validation for all affected projects\n" +
                         "- ✅ End-to-end tests (if web changes detected)\n\n" +
                         "Ready for review! 🎉\n\n" +
                         "---\n" +
                         "*This comment is automatically updated by CI on each run.*\n";

          // Try to find existing CI comment (using unified marker)
          const { data: comments } = await github.rest.issues.listComments({
            issue_number: ${{ inputs.pr-number }},
            owner: context.repo.owner,
            repo: context.repo.repo
          });

          const existingComment = comments.find(comment => 
            comment.body && comment.body.includes(commentMarker)
          );

          if (existingComment) {
            // Update existing comment
            const updatedComment = await github.rest.issues.updateComment({
              comment_id: existingComment.id,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
            console.log("✅ Updated existing CI comment #" + existingComment.id);
            core.setOutput('comment_id', existingComment.id);
            return { comment_id: existingComment.id };
          } else {
            // Create new comment
            const newComment = await github.rest.issues.createComment({
              issue_number: ${{ inputs.pr-number }},
              owner: context.repo.owner,  
              repo: context.repo.repo,
              body: comment
            });
            console.log("✅ Created new CI comment #" + newComment.data.id);
            core.setOutput('comment_id', newComment.data.id);
            return { comment_id: newComment.data.id };
          }

    - name: "📋 Set Comment Output"
      id: pr-comment
      if: inputs.event-name == 'pull_request' && inputs.pr-number != ''
      shell: bash
      run: |
        # Set the comment ID from either success or failure comment
        SUCCESS_COMMENT_ID="${{ steps.pr-success-comment.outputs.comment_id }}"
        FAILURE_COMMENT_ID="${{ steps.pr-failure-comment.outputs.comment_id }}"

        if [ -n "$SUCCESS_COMMENT_ID" ]; then
          echo "comment_id=$SUCCESS_COMMENT_ID" >> $GITHUB_OUTPUT
        elif [ -n "$FAILURE_COMMENT_ID" ]; then
          echo "comment_id=$FAILURE_COMMENT_ID" >> $GITHUB_OUTPUT
        fi

    - name: "📊 Pipeline Summary"
      if: always()
      shell: bash
      run: |
        echo "::group::📊 Final Pipeline Summary"

        STATUS="${{ inputs.status }}"
        EVENT_NAME="${{ inputs.event-name }}"
        EXECUTION_MODE="${{ inputs.execution-mode }}"

        echo "## 🎯 CI Pipeline Summary"
        echo "- **Final Status**: $( [ "$STATUS" = "success" ] && echo "✅ Success" || echo "❌ Failed" )"
        echo "- **Event**: $EVENT_NAME"
        echo "- **Execution Mode**: $EXECUTION_MODE"

        if [ "$EVENT_NAME" = "pull_request" ] && [ -n "${{ inputs.pr-number }}" ]; then
          echo "- **PR Comment**: $( [ -n "${{ steps.pr-comment.outputs.comment_id }}" ] && echo "Updated (ID: ${{ steps.pr-comment.outputs.comment_id }})" || echo "Not created" )"
        fi

        if [ "$STATUS" = "success" ]; then
          echo ""
          echo "🎉 **All CI checks passed!** The pipeline completed successfully."
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "This PR is ready for review and merge."
          fi
        else
          echo ""
          echo "⚠️ **CI pipeline failed.** Check the failure details above and fix the issues."
          echo "The pipeline will automatically re-run when you push new changes."
        fi

        echo "::endgroup::"
