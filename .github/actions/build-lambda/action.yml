name: Build and Package Lambda Function
description: Build a Lambda function using Nx and upload to S3

inputs:
  lambda-name:
    description: "Name of the Lambda function (e.g., draft-processor, game-selection)"
    required: true
  nx-project-name:
    description: "Nx project name to build (defaults to lambda-name)"
    required: false
  lambda-directory:
    description: "Path to Lambda directory (defaults to lambdas/{lambda-name})"
    required: false
  build-output-file:
    description: "Expected build output file relative to dist/ (defaults to index.js)"
    required: false
    default: "index.js"
  aws-region:
    description: "AWS region for deployment"
    required: false
    default: "us-east-1"
  aws-stage:
    description: "Deployment stage (dev, staging, prod)"
    required: false
    default: "dev"

outputs:
  version:
    description: "Built Lambda version"
    value: ${{ steps.package.outputs.version }}
  s3-bucket:
    description: "S3 bucket used for upload"
    value: ${{ steps.package.outputs.s3-bucket }}
  s3-key:
    description: "S3 key for the uploaded package"
    value: ${{ steps.package.outputs.s3-key }}

runs:
  using: composite
  steps:
    - name: Set derived values
      shell: bash
      id: config
      run: |
        LAMBDA_NAME="${{ inputs.lambda-name }}"
        NX_PROJECT="${{ inputs.nx-project-name }}"
        LAMBDA_DIR="${{ inputs.lambda-directory }}"

        # Use lambda-name as defaults if not specified
        if [ -z "$NX_PROJECT" ]; then
          NX_PROJECT="$LAMBDA_NAME"
        fi

        if [ -z "$LAMBDA_DIR" ]; then
          LAMBDA_DIR="lambdas/$LAMBDA_NAME"
        fi

        echo "lambda-name=$LAMBDA_NAME" >> $GITHUB_OUTPUT
        echo "nx-project=$NX_PROJECT" >> $GITHUB_OUTPUT
        echo "lambda-dir=$LAMBDA_DIR" >> $GITHUB_OUTPUT

        echo "🔧 Configuration:"
        echo "  Lambda: $LAMBDA_NAME"
        echo "  Nx Project: $NX_PROJECT"
        echo "  Directory: $LAMBDA_DIR"

    - name: Build Lambda with Nx
      shell: bash
      working-directory: ${{ steps.config.outputs.lambda-dir }}
      run: |
        # Disable Nx Cloud for lambda builds to avoid quota issues
        # Lambda builds are typically fast and don't benefit much from DTE
        unset NX_CLOUD_ACCESS_TOKEN
        export NX_CLOUD_NO_TIMEOUTS=true

        LAMBDA_NAME="${{ steps.config.outputs.lambda-name }}"
        NX_PROJECT="${{ steps.config.outputs.nx-project }}"
        BUILD_OUTPUT="${{ inputs.build-output-file }}"

        echo "🏗️  Building $LAMBDA_NAME Lambda using Nx (local build)..."
        echo "📦 Project: $NX_PROJECT"
        echo "📄 Expected output: dist/$BUILD_OUTPUT"

        NX_CMD="${NX_COMMAND:-}"
        if [ -z "$NX_CMD" ]; then
          if command -v pnpm >/dev/null 2>&1; then
            NX_CMD="pnpm exec nx --"
          else
            NX_CMD="pnpm exec nx"
          fi
        fi

        if $NX_CMD build "$NX_PROJECT" 2>&1 | tee build.log; then
          echo "✅ $LAMBDA_NAME Lambda built successfully"
          
          # Verify build artifacts exist
          BUILD_PATH="dist/$BUILD_OUTPUT"
          if [ -f "$BUILD_PATH" ] || [ -d "dist" ]; then
            echo "✅ Build artifacts verified: $BUILD_PATH"
            BUILD_SIZE=$(du -sh "dist" | cut -f1)
            echo "📊 $LAMBDA_NAME Lambda bundle size: $BUILD_SIZE"
            
            echo "## 🚀 $LAMBDA_NAME Lambda Build Summary" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
            echo "- **Project**: $NX_PROJECT" >> $GITHUB_STEP_SUMMARY
            echo "- **Bundle Size**: $BUILD_SIZE" >> $GITHUB_STEP_SUMMARY
            echo "- **Output**: $LAMBDA_DIR/dist/" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build artifacts missing: $BUILD_PATH"
            exit 1
          fi
        else
          echo "❌ $LAMBDA_NAME Lambda build failed"
          echo "## ❌ Build Errors" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          tail -20 build.log >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

    - name: Package and Upload Lambda
      id: package
      shell: bash
      working-directory: ${{ steps.config.outputs.lambda-dir }}
      run: |
        LAMBDA_NAME="${{ steps.config.outputs.lambda-name }}"
        AWS_STAGE="${{ inputs.aws-stage }}"
        AWS_REGION="${{ inputs.aws-region }}"

        # Get version from SSM or generate new one
        CURRENT_VERSION=$(aws ssm get-parameter \
          --name "/legacy-sports/${AWS_STAGE}/lambda/${LAMBDA_NAME}/version" \
          --region "$AWS_REGION" \
          --query 'Parameter.Value' \
          --output text 2>/dev/null || echo "1.0.0")

        # Increment patch version
        VERSION=$(echo "$CURRENT_VERSION" | awk -F. '{$NF = $NF + 1;} 1' | sed 's/ /./g')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "📦 Packaging version: $VERSION (previous: $CURRENT_VERSION)"

        # Create deployment package
        PACKAGE_NAME="${LAMBDA_NAME}-${VERSION}.zip"
        echo "🗜️  Creating deployment package: $PACKAGE_NAME"

        cd dist
        zip -r "../$PACKAGE_NAME" . -q
        cd ..

        PACKAGE_SIZE=$(du -h "$PACKAGE_NAME" | cut -f1)
        echo "✅ Package created: $PACKAGE_SIZE"

        # Get S3 bucket from SSM
        S3_BUCKET=$(aws ssm get-parameter \
          --name "/legacy-sports/${AWS_STAGE}/s3/lambda-deployments-bucket" \
          --region "$AWS_REGION" \
          --query 'Parameter.Value' \
          --output text)

        echo "s3-bucket=$S3_BUCKET" >> $GITHUB_OUTPUT
        S3_KEY="${LAMBDA_NAME}/${PACKAGE_NAME}"
        echo "s3-key=$S3_KEY" >> $GITHUB_OUTPUT

        # Upload to S3
        echo "☁️  Uploading to s3://${S3_BUCKET}/${S3_KEY}"
        aws s3 cp "$PACKAGE_NAME" "s3://${S3_BUCKET}/${S3_KEY}" \
          --region "$AWS_REGION"

        echo "✅ Upload complete"

        # Update version in SSM
        echo "📝 Updating version in SSM Parameter Store"
        aws ssm put-parameter \
          --name "/legacy-sports/${AWS_STAGE}/lambda/${LAMBDA_NAME}/version" \
          --value "$VERSION" \
          --type String \
          --overwrite \
          --region "$AWS_REGION"

        echo "## 📦 Package Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
        echo "- **Package**: $PACKAGE_NAME" >> $GITHUB_STEP_SUMMARY
        echo "- **Size**: $PACKAGE_SIZE" >> $GITHUB_STEP_SUMMARY
        echo "- **S3 Location**: \`s3://${S3_BUCKET}/${S3_KEY}\`" >> $GITHUB_STEP_SUMMARY

        # Export for deployment step
        export VERSION
        export S3_BUCKET
