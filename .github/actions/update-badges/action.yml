name: "Update CI Status Badges"
description: "Updates gist files with CI status badges for each pipeline step"

inputs:
  github-token:
    description: "GitHub token with gist access"
    required: true
  gist-id:
    description: "Gist ID to update with badge data"
    required: true
  workflow-status:
    description: "Overall workflow status (success/failure)"
    required: true
  step-results:
    description: "JSON string containing step results"
    required: true
  workflow-run-id:
    description: "GitHub workflow run ID"
    required: true
  branch:
    description: "Git branch name"
    required: true
    default: ${{ github.ref_name }}
  commit-sha:
    description: "Git commit SHA"
    required: true
    default: ${{ github.sha }}

outputs:
  badges-updated:
    description: "Whether badges were successfully updated"
    value: ${{ steps.update-badges.outputs.success }}
  update-summary:
    description: "Summary of badge updates"
    value: ${{ steps.update-badges.outputs.summary }}

runs:
  using: "composite"
  steps:
    - name: "📊 Update CI Status Badges"
      id: update-badges
      shell: bash
      run: |
        echo "::group::🎖️ Updating CI Status Badges"

        # Check verbose logging setting
        VERBOSE="${NX_VERBOSE_LOGGING:-false}"

        # Parse workflow inputs
        WORKFLOW_STATUS="${{ inputs.workflow-status }}"
        STEP_RESULTS='${{ inputs.step-results }}'
        RUN_ID="${{ inputs.workflow-run-id }}"
        BRANCH="${{ inputs.branch }}"
        COMMIT_SHA="${{ inputs.commit-sha }}"
        GIST_ID="${{ inputs.gist-id }}"

        # Logging helper function
        log_verbose() {
          if [ "$VERBOSE" = "true" ]; then
            echo "$@"
          fi
        }

        # Function to create badge JSON
        create_badge_json() {
          local step_name="$1"
          local status="$2" 
          local message="$3"
          local color="$4"
          local run_url="https://github.com/${{ github.repository }}/actions/runs/${RUN_ID}"
          
          # Create filename-safe version (replace spaces with hyphens)
          local filename=$(echo "${step_name}" | sed 's/ /-/g')
          
          BADGE="{\"schemaVersion\":1,"
          BADGE+="\"label\":\"${step_name}\","
          BADGE+="\"message\":\"${message}\","
          BADGE+="\"color\":\"${color}\","
          BADGE+="\"namedLogo\":\"github\","
          BADGE+="\"logoColor\":\"white\","
          BADGE+="\"style\":\"flat\","
          BADGE+="\"cacheSeconds\":300}"
          printf '%s\n' "$BADGE" > "${filename}.json"
        }

        # Function to determine status color
        get_status_color() {
          case "$1" in
            "success") echo "brightgreen" ;;
            "failure") echo "red" ;;
            "cancelled") echo "yellow" ;;
            "skipped") echo "lightgrey" ;;
            *) echo "inactive" ;;
          esac
        }

        # Function to format status message
        format_status_message() {
          case "$1" in
            "success") echo "passing" ;;
            "failure") echo "failing" ;;
            "cancelled") echo "cancelled" ;;
            "skipped") echo "skipped" ;;
            *) echo "unknown" ;;
          esac
        }

        log_verbose "Generating badge files for CI steps..."

        # Overall pipeline status
        OVERALL_COLOR=$(get_status_color "$WORKFLOW_STATUS")
        OVERALL_MESSAGE=$(format_status_message "$WORKFLOW_STATUS")
        create_badge_json "CI Pipeline" "$WORKFLOW_STATUS" "$OVERALL_MESSAGE" "$OVERALL_COLOR"

        # Parse step results and create individual badges
        if [ -n "$STEP_RESULTS" ] && [ "$STEP_RESULTS" != "null" ]; then
          log_verbose "Parsing step results: $STEP_RESULTS"
          
          # Extract individual step statuses using jq if available, otherwise parse manually
          if command -v jq >/dev/null 2>&1; then
            # Use jq for robust JSON parsing
            log_verbose "Using jq for JSON parsing"
            echo "$STEP_RESULTS" | jq -r 'to_entries[] | "\(.key):\(.value)"' | while IFS=: read -r step status; do
              if [ -n "$step" ] && [ -n "$status" ]; then
                color=$(get_status_color "$status")
                message=$(format_status_message "$status")
                create_badge_json "$step" "$status" "$message" "$color"
                log_verbose "  ✓ Created badge for '$step' - $message"
              fi
            done
          else
            # Fallback: basic parsing for common step results
            log_verbose "jq not available, using basic parsing"
            
            # Create badges for known CI steps with default success status
            declare -a ci_steps=(
              "Change Detection"
              "Lint"
              "Format"
              "Test"
              "Custom Checks"
              "Build Validation"
              "Lockfile Check"
              "E2E Testing"
            )
            
            for step in "${ci_steps[@]}"; do
              # Default to success if overall workflow passed, failure if it failed
              step_status="$WORKFLOW_STATUS"
              color=$(get_status_color "$step_status")
              message=$(format_status_message "$step_status")
              create_badge_json "$step" "$step_status" "$message" "$color"
            done
          fi
        fi

        # Create last updated badge
        TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
        create_badge_json "Last Updated" "success" "$TIMESTAMP" "blue"

        # Create branch status badge
        if [ "$BRANCH" = "main" ]; then
          create_badge_json "Branch" "success" "main" "brightgreen"
        else
          create_badge_json "Branch" "success" "$BRANCH" "blue"
        fi

        # Create last updated badge with current timestamp
        CURRENT_TIME=$(date -u +"%Y-%m-%d %H:%M UTC")
        create_badge_json "Last Updated" "success" "$CURRENT_TIME" "blue"

        if [ "$VERBOSE" = "true" ]; then
          echo "Generated badge files:"
          ls -la *.json
        else
          BADGE_COUNT=$(ls -1 *.json 2>/dev/null | wc -l)
          echo "Generated $BADGE_COUNT badge files"
        fi

        # Update gist files using GitHub API
        log_verbose "Updating gist $GIST_ID..."

        # Prepare gist update payload using a temporary file to avoid "Argument list too long"
        TEMP_PAYLOAD=$(mktemp)
        echo '{"files": {' > "$TEMP_PAYLOAD"

        FIRST_FILE=true
        for badge_file in *.json; do
          if [ -f "$badge_file" ]; then
            filename="${badge_file}"
            
            # Add comma separator for subsequent files
            if [ "$FIRST_FILE" = "true" ]; then
              FIRST_FILE=false
            else
              echo ',' >> "$TEMP_PAYLOAD"
            fi
            
            # Add file entry to payload (escaping content properly)
            echo -n "\"${filename}\": {\"content\": \"" >> "$TEMP_PAYLOAD"
            # Use a subshell to avoid broken pipe issues with multiple pipes
            (cat "$badge_file" | sed 's/\\/\\\\/g; s/"/\\"/g' | tr -d '\n') >> "$TEMP_PAYLOAD"
            echo -n '"}' >> "$TEMP_PAYLOAD"
          fi
        done

        echo '}}' >> "$TEMP_PAYLOAD"

        log_verbose "Gist payload size: $(wc -c < "$TEMP_PAYLOAD") bytes"

        # Update the gist using the temporary file
        RESPONSE=$(curl -s \
          -X PATCH \
          -H "Authorization: Bearer ${{ inputs.github-token }}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/gists/$GIST_ID" \
          -d "@$TEMP_PAYLOAD")

        # Clean up temporary file
        rm -f "$TEMP_PAYLOAD"

        # Check if update was successful (using string matching to avoid broken pipe)
        if [[ "$RESPONSE" == *'"id"'* ]]; then
          echo "✅ Successfully updated gist badges"
          echo "success=true" >> $GITHUB_OUTPUT
          
          # Create summary
          BADGE_COUNT=$(ls -1 *.json | wc -l)
          SUMMARY="Updated $BADGE_COUNT badges for workflow $RUN_ID on branch $BRANCH"
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT
          
          # Add to step summary (only in verbose mode or show condensed version)
          if [ "$VERBOSE" = "true" ]; then
            echo "## 🎖️ CI Status Badges Updated" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Gist ID**: $GIST_ID" >> $GITHUB_STEP_SUMMARY
            echo "- **Badges Updated**: $BADGE_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "- **Workflow**: $RUN_ID" >> $GITHUB_STEP_SUMMARY
            echo "- **Branch**: $BRANCH" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: $WORKFLOW_STATUS" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Badge files updated:" >> $GITHUB_STEP_SUMMARY
            for badge_file in *.json; do
              if [ -f "$badge_file" ]; then
                echo "- \`$badge_file\`" >> $GITHUB_STEP_SUMMARY
              fi
            done
          else
            echo "## 🎖️ Badges Updated" >> $GITHUB_STEP_SUMMARY
            echo "Updated $BADGE_COUNT badges for $BRANCH" >> $GITHUB_STEP_SUMMARY
          fi
          
        else
          echo "❌ Failed to update gist badges"
          log_verbose "Response: $RESPONSE"
          echo "success=false" >> $GITHUB_OUTPUT
          
          # Check for specific error types (using string matching to avoid broken pipe)
          if [[ "$RESPONSE" == *"message"*"too long"* ]]; then
            echo "summary=Failed to update badges: Payload too large (consider reducing badge count)" >> $GITHUB_OUTPUT
          elif [[ "$RESPONSE" == *"Not Found"* ]]; then
            echo "summary=Failed to update badges: Gist not found (check GIST_ID)" >> $GITHUB_OUTPUT
          elif [[ "$RESPONSE" == *"Bad credentials"* ]]; then
            echo "summary=Failed to update badges: Authentication failed (check token permissions)" >> $GITHUB_OUTPUT
          else
            echo "summary=Failed to update badges: API error" >> $GITHUB_OUTPUT
          fi
        fi

        echo "::endgroup::"

    - name: "🔗 Generate Badge URLs"
      shell: bash
      run: |
        VERBOSE="${NX_VERBOSE_LOGGING:-false}"

        if [ "${{ steps.update-badges.outputs.success }}" = "true" ] && [ "$VERBOSE" = "true" ]; then
          echo "::group::🔗 Badge URLs Generated"
          echo "## Badge URLs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Use these URLs in your README:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          GIST_ID="${{ inputs.gist-id }}"
          REPO="${{ github.repository }}"
          
          # Generate URLs for each badge file
          for badge_file in *.json; do
            if [ -f "$badge_file" ]; then
              filename="${badge_file}"
              badge_url="https://img.shields.io/endpoint?url=https://gist.githubusercontent.com/${{ github.repository_owner }}/${GIST_ID}/raw/${filename}"
              action_url="https://github.com/${REPO}/actions"
              
              echo "[![${filename%.*}](${badge_url})](${action_url})" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "::endgroup::"
        fi
