name: "Setup Workspace"
description: "Common setup steps for Node.js, dependencies, and Nx - standardized across all workflows"
inputs:
  node-version:
    description: "Node.js version to use"
    required: false
    default: "22"
  install-dependencies:
    description: "Whether to install dependencies"
    required: false
    default: "true"
  set-nx-shas:
    description: "Whether to set NX SHAs for affected detection"
    required: false
    default: "true"
  cache-key-suffix:
    description: "Additional suffix for cache key (useful for matrix builds)"
    required: false
    default: ""
  skip-system-deps:
    description: "Skip installing system dependencies (for mobile/specialized builds)"
    required: false
    default: "false"
  include-optional-deps:
    description: "Include optional dependencies (Storybook, Appium) - set to 'false' to skip for faster CI"
    required: false
    default: "true"
  validate-lockfile:
    description: "Reserved for future use: dedicated pre-cache lockfile validation. Currently validation is performed by the always-on pnpm install --frozen-lockfile in the install step."
    required: false
    default: "true"

outputs:
  cache-hit:
    description: "Whether dependencies were restored from cache (node_modules or pnpm store)"
    value: ${{ steps.cache-node-modules.outputs.cache-hit == 'true' && 'true' || steps.cache-pnpm-store.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - name: Bootstrap pnpm for setup-node cache
      if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
      shell: bash
      run: |
        echo "🔧 Prepping pnpm before setup-node (required for package-manager cache)"
        if command -v pnpm >/dev/null 2>&1; then
          echo "pnpm already available at $(command -v pnpm)"
          exit 0
        fi

        DEFAULT_VERSION="9.12.1"
        PACKAGE_VERSION=$(node -pe "(require('./package.json').packageManager || '').startsWith('pnpm@') ? require('./package.json').packageManager.split('@')[1] : ''" 2>/dev/null || echo "")
        PNPM_VERSION="${PACKAGE_VERSION:-$DEFAULT_VERSION}"
        echo "Installing pnpm@${PNPM_VERSION} via corepack/npm fallback"

        if command -v corepack >/dev/null 2>&1; then
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
        else
          echo "corepack unavailable, using npm install -g"
          npm install -g "pnpm@${PNPM_VERSION}"
        fi

        PNPM_HOME_DIR="$HOME/.local/share/pnpm"
        if [ -d "$PNPM_HOME_DIR" ]; then
          echo "➕ Adding pnpm home (${PNPM_HOME_DIR}) to PATH"
          echo "$PNPM_HOME_DIR" >> "$GITHUB_PATH"
        fi

        echo "Preparing pnpm@${PNPM_VERSION} for immediate activation..."

    - name: Validate Package Manager (pnpm-only)
      id: detect-pm
      shell: bash
      run: |
        # This repository is pnpm-based (pnpm-lock.yaml + pnpm-workspace.yaml)
        # Fail fast if lockfile is missing - no npm fallback supported
        if [ ! -f "pnpm-lock.yaml" ]; then
          echo "❌ pnpm-lock.yaml not found"
          echo "This repository requires pnpm. Expected lockfile: pnpm-lock.yaml"
          exit 1
        fi
        echo "manager=pnpm" >> "$GITHUB_OUTPUT"
        echo "✅ Validated pnpm workspace (pnpm-lock.yaml found)"

    - name: Setup Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.install-dependencies == 'true' && 'pnpm' || '' }}

    # Cache restore/save are split so only pushes to main write to the cache.
    # PR runs restore (via the default-branch fallback) but never save, which
    # prevents PR-scoped duplicates of identical content from filling the
    # repo's 10 GB cache budget. See LS-4186.
    - name: Restore pnpm Store
      if: inputs.install-dependencies == 'true'
      id: cache-pnpm-store
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.local/share/pnpm/store
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}${{ inputs.cache-key-suffix != '' && format('-{0}', inputs.cache-key-suffix) || '' }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    # Note: npm support removed as this repository is pnpm-only
    # Legacy npm cache and install steps consolidated into pnpm-only workflow

    - name: Restore node_modules
      if: inputs.install-dependencies == 'true'
      id: cache-node-modules
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: node_modules
        # yamllint disable-line rule:line-length
        key: ${{ runner.os }}-node${{ inputs.node-version }}-${{ runner.arch }}-nm-${{ hashFiles('pnpm-lock.yaml') }}${{ inputs.cache-key-suffix != '' && format('-{0}', inputs.cache-key-suffix) || '' }}
        restore-keys: |
          ${{ runner.os }}-node${{ inputs.node-version }}-${{ runner.arch }}-nm-

    - name: Clear stale node_modules on partial cache restore
      if: inputs.install-dependencies == 'true' && steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: |
        # When node_modules is restored from a partial cache key (restore-key fallback),
        # the packages are from a different lockfile version. Letting pnpm reconcile a
        # stale node_modules triggers JS heap OOM for large package trees (~2GB on a
        # 2GB default heap). Starting from an empty directory is faster and safer.
        if [ -d "node_modules" ]; then
          echo "🧹 Clearing node_modules from partial cache restore (will reinstall from pnpm store)"
          rm -rf node_modules
        fi

    - name: Install Dependencies with pnpm
      if: inputs.install-dependencies == 'true'
      env:
        NODE_OPTIONS: "--max-old-space-size=4096"
      shell: bash
      run: |
        echo "Node version: $(node --version)"
        echo "pnpm version: $(pnpm --version)"

        INSTALL_FLAGS=("--frozen-lockfile" "--prefer-offline" "--reporter" "append-only")
        if [ "${{ inputs.include-optional-deps }}" == "false" ]; then
          echo "Info: optional dependency pruning disabled due to pnpm lockfile bugs; installing full dependency graph"
        fi

        if [ "${{ steps.cache-pnpm-store.outputs.cache-hit }}" == "true" ]; then
          echo "✅ pnpm store cache hit - hydrating workspace from cache"
        else
          echo "📦 pnpm store cache miss - packages will be downloaded"
        fi

        # Retry once on failure: pnpm can fail with ERR_PNPM_EEXIST when two packages
        # share a nested dep (e.g. drizzle-kit + @tamagui/static both nest esbuild@0.25.12)
        # and pnpm "Recreates" node_modules while both already exist as separate inodes.
        # Clearing node_modules before the retry lets pnpm hard-link cleanly from the store.
        if ! pnpm install "${INSTALL_FLAGS[@]}"; then
          echo "⚠️ pnpm install failed — clearing node_modules and retrying once from pnpm store cache"
          rm -rf node_modules
          pnpm install "${INSTALL_FLAGS[@]}" || exit 1
        fi

        echo "✅ pnpm installation complete"

    - name: Fix Tamagui Installation
      if: inputs.install-dependencies == 'true' && steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: |
        echo "🔧 Running Tamagui postinstall fix..."
        if [ -f "scripts/fix-tamagui-install.js" ]; then
          node scripts/fix-tamagui-install.js
          echo "✅ Tamagui postinstall fix applied"
        else
          echo "⚠️  Fix script not found, skipping..."
        fi

    # Note: Skip install step removed - pnpm install handles cache efficiently

    - name: Verify Dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: |
        CACHE_SOURCE="fresh install"
        if [[ "${{ steps.cache-node-modules.outputs.cache-hit }}" == "true" ]]; then
          CACHE_SOURCE="node_modules cache"
        elif [[ "${{ steps.cache-pnpm-store.outputs.cache-hit }}" == "true" ]]; then
          CACHE_SOURCE="pnpm store cache"
        fi

        echo "✅ Dependencies ready via $CACHE_SOURCE"

        PNPM_REINSTALL_FLAGS=("--frozen-lockfile" "--prefer-offline" "--reporter" "append-only")
        if [ "${{ inputs.include-optional-deps }}" == "false" ]; then
          echo "Info: optional dependency pruning disabled due to pnpm lockfile bugs; reinstall uses full dependency graph"
        fi

        if [ ! -d "node_modules" ]; then
          echo "❌ node_modules directory not found after installation"
          echo "🔍 Current directory: $(pwd)"
          echo "📁 Directory contents:"
          ls -la | head -10
          exit 1
        fi

        # Verify critical dependencies are actually installed
        echo "🔍 Verifying critical dependencies..."

        # Check for Nx specifically
        if [ ! -d "node_modules/nx" ] && [ ! -d "node_modules/@nx" ]; then
          echo "❌ Nx packages not found in node_modules"
          echo "📦 Available packages starting with 'n':"
          ls -la node_modules/ | grep "^d.*\sn" | head -5 || echo "No packages found"
          echo "📦 Available @-scoped packages:"
          ls -la node_modules/ | grep "^d.*@" | head -10 || echo "No @-scoped packages found"
          exit 1
        fi

        # Check if nx binary was installed
        if [ ! -f "node_modules/.bin/nx" ]; then
          echo "⚠️ nx binary not found in node_modules/.bin/"
          echo "📦 Available binaries:"
          ls -la node_modules/.bin/ | grep nx || echo "No nx-related binaries"
          echo "🔧 Attempting to check package manager linking..."
          pnpm ls nx 2>/dev/null || echo "pnpm ls nx failed"
          
          # Cache hit (node_modules or pnpm store) but nx binary missing — force reinstall
          if [[ "${{ steps.cache-node-modules.outputs.cache-hit }}" == "true" ]] || [[ "${{ steps.cache-pnpm-store.outputs.cache-hit }}" == "true" ]]; then
            echo "🔄 Cache hit but nx binary missing - forcing pnpm reinstall..."
            rm -rf node_modules
            pnpm install "${PNPM_REINSTALL_FLAGS[@]}"
            if [ -f "scripts/fix-tamagui-install.js" ]; then
              node scripts/fix-tamagui-install.js
            fi
          fi
        else
          # Test if the nx binary actually works
          echo "🧪 Testing nx binary functionality..."
          # Add timeout to prevent hanging on nx --version
          NX_TEST_PASSED=false
          if command -v timeout >/dev/null 2>&1; then
            if timeout 30s node_modules/.bin/nx --version >/dev/null 2>&1; then
              NX_TEST_PASSED=true
            fi
          elif command -v gtimeout >/dev/null 2>&1; then
            if gtimeout 30s node_modules/.bin/nx --version >/dev/null 2>&1; then
              NX_TEST_PASSED=true
            fi
          else
            if node_modules/.bin/nx --version >/dev/null 2>&1; then
              NX_TEST_PASSED=true
            fi
          fi
          
          if [ "$NX_TEST_PASSED" = "false" ]; then
            echo "⚠️ nx binary exists but not functional or timed out"
            
            # Cache hit but nx is broken — force reinstall
            if [[ "${{ steps.cache-node-modules.outputs.cache-hit }}" == "true" ]] || [[ "${{ steps.cache-pnpm-store.outputs.cache-hit }}" == "true" ]]; then
              echo "🔄 Cache hit but nx broken - forcing pnpm reinstall..."
              rm -rf node_modules
              pnpm install "${PNPM_REINSTALL_FLAGS[@]}"
              if [ -f "scripts/fix-tamagui-install.js" ]; then
                node scripts/fix-tamagui-install.js
              fi
            fi
          else
            echo "✅ nx binary is functional"
          fi
        fi

        echo "✅ Dependencies verified successfully!"

    # Save only on pushes to main. PR runs restore from main via the
    # default-branch fallback but never write their own copy. See LS-4186.
    - name: Save pnpm Store
      if: |
        inputs.install-dependencies == 'true'
        && github.event_name == 'push'
        && github.ref == 'refs/heads/main'
        && steps.cache-pnpm-store.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.local/share/pnpm/store
        key: ${{ steps.cache-pnpm-store.outputs.cache-primary-key }}

    - name: Save node_modules
      if: |
        inputs.install-dependencies == 'true'
        && github.event_name == 'push'
        && github.ref == 'refs/heads/main'
        && steps.cache-node-modules.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: node_modules
        key: ${{ steps.cache-node-modules.outputs.cache-primary-key }}

    - name: Set NX SHAs
      if: inputs.set-nx-shas == 'true'
      uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
      with:
        main-branch-name: "main"
        error-on-no-successful-workflow: false

    - name: "Setup Nx Remote Cache"
      uses: ./.github/actions/nx-cache
      with:
        restore-only: ${{ github.event_name == 'pull_request' }}
        base-branch: "main"

    - name: Configure Basic Nx Environment
      shell: bash
      run: |
        echo "🔧 Configuring basic Nx environment..."

        # Set conservative defaults for Nx execution
        echo "NX_DAEMON=false" >> $GITHUB_ENV
        echo "NX_PARALLEL=2" >> $GITHUB_ENV
        # Disable Nx Cloud — this repo uses local caching only; prevents
        # "Ambiguous Distribution Configuration" warnings when cloud env vars
        # are present but nx-cloud start-ci-run was not called.
        echo "NX_NO_CLOUD=true" >> $GITHUB_ENV
        export NX_NO_CLOUD=true

        # Ensure Nx cache directory exists and is properly configured
        if [ -n "${NX_CACHE_DIRECTORY:-}" ]; then
          mkdir -p "$NX_CACHE_DIRECTORY"
          echo "📁 Created Nx cache directory: $NX_CACHE_DIRECTORY"
        fi

        # Skip Nx validation when dependencies are not installed (e.g. detect-changes job)
        if [ "${{ inputs.install-dependencies }}" != "true" ]; then
          echo "⏭️  Skipping Nx validation (install-dependencies=false)"
          exit 0
        fi

        # Comprehensive Nx installation and workspace validation
        echo "🔍 Validating Nx installation..."

        # Check if node_modules has Nx
        if [ ! -d "node_modules" ]; then
          echo "❌ node_modules directory missing"
          exit 1
        fi

        # Validate Nx CLI — prefer pnpm exec (canonical for pnpm workspaces),
        # fall back to node_modules/.bin only if pnpm exec fails.
        NX_COMMAND=""
        if pnpm exec nx --version >/dev/null 2>&1; then
          NX_COMMAND="pnpm exec nx"
        elif [ -f "node_modules/.bin/nx" ] && node_modules/.bin/nx --version >/dev/null 2>&1; then
          NX_COMMAND="node_modules/.bin/nx"
        else
          echo "❌ Nx not accessible via pnpm exec or node_modules/.bin"
          pnpm exec nx --version 2>&1 || true
          exit 1
        fi

        NX_VERSION=$($NX_COMMAND --version 2>/dev/null || echo "unknown")

        # Quick workspace sanity check with one recovery attempt
        if ! $NX_COMMAND show projects --quiet >/dev/null 2>&1; then
          echo "⚠️ Nx workspace detection failed — attempting reset..."
          $NX_COMMAND reset 2>/dev/null || true
          rm -rf .nx node_modules/.cache/nx 2>/dev/null || true
          if ! $NX_COMMAND show projects --quiet >/dev/null 2>&1; then
            echo "❌ Nx workspace still not accessible after reset"
            exit 1
          fi
        fi

        echo "NX_COMMAND=$NX_COMMAND" >> $GITHUB_ENV
        echo "✅ Nx $NX_VERSION validated ($NX_COMMAND)"

    - name: Workspace Setup Complete
      shell: bash
      run: |
        echo "✅ Workspace setup complete"
        echo "   Node.js: $(node --version)"
        echo "   pnpm: $(pnpm --version)"
        NM_HIT="${{ steps.cache-node-modules.outputs.cache-hit }}"
        STORE_HIT="${{ steps.cache-pnpm-store.outputs.cache-hit }}"
        if [[ "$NM_HIT" == "true" ]]; then
          DEP_SOURCE="Restored from node_modules cache"
        elif [[ "$STORE_HIT" == "true" ]]; then
          DEP_SOURCE="Restored from pnpm store cache"
        else
          DEP_SOURCE="Installed fresh"
        fi
        echo "   Dependencies: $DEP_SOURCE"
        echo "   Cache Key Suffix: ${{ inputs.cache-key-suffix != '' && inputs.cache-key-suffix || 'none' }}"
        echo "   System Dependencies: ${{ inputs.skip-system-deps == 'true' && 'Skipped' || 'Installed' }}"
        echo ""
        echo "ℹ️  Ready for build and test operations"
