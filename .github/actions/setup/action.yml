name: "Setup Workspace"
description: "Common setup steps for Node.js, dependencies, and Nx - standardized across all workflows"
inputs:
  node-version:
    description: "Node.js version to use"
    required: false
    default: "22"
  install-dependencies:
    description: "Whether to install dependencies"
    required: false
    default: "true"
  set-nx-shas:
    description: "Whether to set NX SHAs for affected detection"
    required: false
    default: "true"
  cache-key-suffix:
    description: "Additional suffix for cache key (useful for matrix builds)"
    required: false
    default: ""
  skip-system-deps:
    description: "Skip installing system dependencies (for mobile/specialized builds)"
    required: false
    default: "false"

outputs:
  cache-hit:
    description: "Whether dependencies were restored from cache"
    value: ${{ steps.cached-dependencies.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: "npm"
        cache-dependency-path: "package-lock.json"

    - name: Install System Dependencies
      if: inputs.skip-system-deps == 'false'
      shell: bash
      run: |
        echo "Installing system dependencies for cross-platform builds..."

        # Install zip utility for lambda packaging (if not already present)
        if ! command -v zip &> /dev/null; then
          echo "Installing zip utility..."
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y zip
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            # zip is pre-installed on macOS
            echo "zip already available on macOS"
          fi
          echo "✅ zip utility ready"
        else
          echo "✅ zip utility already available"
        fi

    - name: Cache Node Modules (Aggressive)
      if: inputs.install-dependencies == 'true'
      uses: actions/cache@v4
      id: cached-dependencies
      with:
        path: |
          ~/.npm
          node_modules
          */*/node_modules
        key: ${{ runner.os }}-node${{ inputs.cache-key-suffix != '' && format('-{0}', inputs.cache-key-suffix) || '' }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node${{ inputs.cache-key-suffix != '' && format('-{0}', inputs.cache-key-suffix) || '' }}-
          ${{ runner.os }}-node-

    - name: Install Dependencies (Fast)
      if: inputs.install-dependencies == 'true' && steps.cached-dependencies.outputs.cache-hit != 'true'
      shell: bash
      run: |
        echo "Installing NPM dependencies..."
        echo "Node version: $(node --version)"
        echo "NPM version: $(npm --version)"

        # Check if node_modules already exists and is valid (from cache restore-key)
        if [ -d "node_modules" ] && [ -d "node_modules/nx" ]; then
          echo "✅ node_modules already present from cache (restored via restore-key)"
          echo "📦 Verifying critical packages..."
          
          # Quick validation that key packages exist
          if [ -d "node_modules/@nx" ] || [ -d "node_modules/nx" ]; then
            echo "✅ Nx packages found - skipping npm ci to save time"
            echo "⚡ Saved ~15 minutes by reusing cached dependencies"
            exit 0
          fi
        fi

        # Check package-lock.json integrity first
        if [ ! -f "package-lock.json" ]; then
          echo "❌ package-lock.json not found"
          exit 1
        fi

        # Use npm ci with standardized flags across all workflows
        # --prefer-offline: Use cache when possible
        # --no-audit: Skip vulnerability audit for speed
        # --no-fund: Skip funding messages
        echo "🔧 Installing dependencies (node_modules not found or incomplete)..."
        
        # Reduced timeout to 5 minutes for initial attempt
        # If it takes longer, something is wrong and we should fail fast
        if command -v timeout >/dev/null 2>&1; then
          TIMEOUT_CMD="timeout 300s"
        elif command -v gtimeout >/dev/null 2>&1; then
          TIMEOUT_CMD="gtimeout 300s"
        else
          echo "⚠️  No timeout command available, proceeding without timeout..."
          TIMEOUT_CMD=""
        fi
        
        if $TIMEOUT_CMD npm ci --prefer-offline --no-audit --no-fund; then
          echo "✅ Dependencies installed successfully!"
        else
          echo "⚠️  Primary npm ci failed, analyzing error..."
          
          # Check if this is a lock file sync issue (common with Sharp/platform-specific deps)
          if npm ci --dry-run 2>&1 | grep -q "package.json and package-lock.json.*are in sync"; then
            echo "🔧 Detected lock file sync issue - regenerating with npm install..."
            
            # Use npm install to fix lock file sync issues
            # Timeout: 5 minutes should be sufficient with cached packages
            if command -v timeout >/dev/null 2>&1; then
              INSTALL_TIMEOUT_CMD="timeout 300s"
            elif command -v gtimeout >/dev/null 2>&1; then
              INSTALL_TIMEOUT_CMD="gtimeout 300s"
            else
              INSTALL_TIMEOUT_CMD=""
            fi
            
            if $INSTALL_TIMEOUT_CMD npm install --no-audit --no-fund; then
              echo "✅ Dependencies synchronized successfully with npm install!"
            else
              echo "❌ npm install also failed - trying cache reset..."
              npm cache clean --force
              
              if $INSTALL_TIMEOUT_CMD npm install --no-audit --no-fund; then
                echo "✅ Dependencies installed after cache reset!"
              else
                echo "❌ All installation methods failed"
                echo "Debug info:"
                echo "  - npm version: $(npm --version)"
                echo "  - node version: $(node --version)"
                echo "  - package-lock.json exists: $([ -f package-lock.json ] && echo 'yes' || echo 'no')"
                echo "  - available disk space: $(df -h . | tail -1 | awk '{print $4}')"
                exit 1
              fi
            fi
          else
            echo "⚠️  Non-sync error detected, retrying npm ci with cache reset..."
            npm cache clean --force
            
            # Retry timeout: 5 minutes for npm ci after cache clean
            if command -v timeout >/dev/null 2>&1; then
              RETRY_TIMEOUT_CMD="timeout 300s"
            elif command -v gtimeout >/dev/null 2>&1; then
              RETRY_TIMEOUT_CMD="gtimeout 300s"
            else
              RETRY_TIMEOUT_CMD=""
            fi
            
            if $RETRY_TIMEOUT_CMD npm ci --no-audit --no-fund; then
              echo "✅ Dependencies installed on retry!"
            else
              echo "❌ NPM ci retry also failed"
              echo "Debug info:"
              echo "  - npm version: $(npm --version)"
              echo "  - node version: $(node --version)"
              echo "  - package-lock.json exists: $([ -f package-lock.json ] && echo 'yes' || echo 'no')"
              echo "  - available disk space: $(df -h . | tail -1 | awk '{print $4}')"
              exit 1
            fi
          fi
        fi

    - name: Verify Dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: |
        if [[ "${{ steps.cached-dependencies.outputs.cache-hit }}" == "true" ]]; then
          echo "✅ Dependencies restored from cache"
        else
          echo "✅ Dependencies installed fresh"
        fi

        if [ ! -d "node_modules" ]; then
          echo "❌ node_modules directory not found after installation"
          echo "🔍 Current directory: $(pwd)"
          echo "📁 Directory contents:"
          ls -la | head -10
          exit 1
        fi

        # Verify critical dependencies are actually installed
        echo "🔍 Verifying critical dependencies..."
        
        # Check for Nx specifically
        if [ ! -d "node_modules/nx" ] && [ ! -d "node_modules/@nx" ]; then
          echo "❌ Nx packages not found in node_modules"
          echo "📦 Available packages starting with 'n':"
          ls -la node_modules/ | grep "^d.*\sn" | head -5 || echo "No packages found"
          echo "📦 Available @-scoped packages:"
          ls -la node_modules/ | grep "^d.*@" | head -10 || echo "No @-scoped packages found"
          exit 1
        fi
        
        # Check if nx binary was installed
        if [ ! -f "node_modules/.bin/nx" ]; then
          echo "⚠️ nx binary not found in node_modules/.bin/"
          echo "📦 Available binaries:"
          ls -la node_modules/.bin/ | grep nx || echo "No nx-related binaries"
          echo "🔧 Attempting to check npm linking..."
          npm ls nx 2>/dev/null || echo "npm ls nx failed"
          
          # If we had a cache hit but nx binary is missing, force reinstall
          if [[ "${{ steps.cached-dependencies.outputs.cache-hit }}" == "true" ]]; then
            echo "🔄 Cache hit but nx binary missing - forcing fresh install..."
            rm -rf node_modules
            npm ci --prefer-offline --no-audit --no-fund
            
            # Re-verify after reinstall
            if [ ! -f "node_modules/.bin/nx" ]; then
              echo "❌ nx binary still missing after fresh install"
              exit 1
            fi
            echo "✅ Fresh install completed, nx binary now available"
          fi
        else
          # Test if the nx binary actually works
          echo "🧪 Testing nx binary functionality..."
          if ! node_modules/.bin/nx --version >/dev/null 2>&1; then
            echo "⚠️ nx binary exists but not functional"
            
            # If cache hit but nx is broken, force reinstall
            if [[ "${{ steps.cached-dependencies.outputs.cache-hit }}" == "true" ]]; then
              echo "🔄 Cache hit but nx broken - forcing fresh install..."
              rm -rf node_modules
              npm ci --prefer-offline --no-audit --no-fund
              
              # Re-verify after reinstall
              if ! node_modules/.bin/nx --version >/dev/null 2>&1; then
                echo "❌ nx still not functional after fresh install"
                exit 1
              fi
              echo "✅ Fresh install completed, nx now functional"
            fi
          else
            echo "✅ nx binary is functional"
          fi
        fi

        echo "✅ Dependencies verified successfully!"

    - name: Set NX SHAs
      if: inputs.set-nx-shas == 'true'
      uses: nrwl/nx-set-shas@v4
      with:
        main-branch-name: "main"
        error-on-no-successful-workflow: false

    - name: Configure Basic Nx Environment
      shell: bash
      run: |
        echo "🔧 Configuring basic Nx environment..."

        # Set conservative defaults for Nx execution
        echo "NX_DAEMON=false" >> $GITHUB_ENV
        echo "NX_PARALLEL=2" >> $GITHUB_ENV
        
        # Ensure Nx cache directory exists and is properly configured
        if [ -n "${NX_CACHE_DIRECTORY:-}" ]; then
          mkdir -p "$NX_CACHE_DIRECTORY"
          echo "📁 Created Nx cache directory: $NX_CACHE_DIRECTORY"
        fi

        # Comprehensive Nx installation and workspace validation
        echo "🔍 Validating Nx installation..."
        
        # Check if node_modules has Nx
        if [ ! -d "node_modules" ]; then
          echo "❌ node_modules directory missing"
          exit 1
        fi
        
        # Debug node_modules structure
        echo "📁 Checking Nx installation paths..."
        echo "node_modules/.bin/nx exists: $([ -f node_modules/.bin/nx ] && echo 'yes' || echo 'no')"
        echo "node_modules/nx exists: $([ -d node_modules/nx ] && echo 'yes' || echo 'no')"
        echo "@nx packages: $(ls node_modules/ | grep '^@nx' | wc -l)"
        
        # Try different methods to access Nx with enhanced debugging
        NX_COMMAND=""
        echo "🔍 Attempting Nx CLI detection..."
        
        # Method 1: npx nx
        echo "  Testing Method 1: npx nx"
        if npx nx --version >/dev/null 2>&1; then
          NX_COMMAND="npx nx"
          echo "  ✅ Nx accessible via: npx nx"
        else
          echo "  ❌ npx nx failed"
        fi
        
        # Method 2: Direct path to nx binary  
        if [ -z "$NX_COMMAND" ]; then
          echo "  Testing Method 2: node_modules/.bin/nx"
          if [ -f "node_modules/.bin/nx" ]; then
            if node_modules/.bin/nx --version >/dev/null 2>&1; then
              NX_COMMAND="node_modules/.bin/nx"
              echo "  ✅ Nx accessible via: node_modules/.bin/nx"
            else
              echo "  ❌ node_modules/.bin/nx exists but not executable"
            fi
          else
            echo "  ❌ node_modules/.bin/nx does not exist"
          fi
        fi
        
        # Method 3: npm exec
        if [ -z "$NX_COMMAND" ]; then
          echo "  Testing Method 3: npm exec nx"
          if npm exec nx -- --version >/dev/null 2>&1; then
            NX_COMMAND="npm exec nx --"
            echo "  ✅ Nx accessible via: npm exec nx --"
          else
            echo "  ❌ npm exec nx failed"
          fi
        fi
        
        # Method 4: Try to manually find and execute nx
        if [ -z "$NX_COMMAND" ]; then
          echo "  Testing Method 4: Manual nx resolution"
          
          # Look for nx in various locations
          for nx_path in "node_modules/.bin/nx" "node_modules/nx/bin/nx.js" "node_modules/@nx/cli/bin/nx.js"; do
            if [ -f "$nx_path" ]; then
              echo "  Found potential nx at: $nx_path"
              if node "$nx_path" --version >/dev/null 2>&1; then
                NX_COMMAND="node $nx_path"
                echo "  ✅ Nx accessible via: node $nx_path"
                break
              fi
            fi
          done
        fi
        
        # If all methods failed
        if [ -z "$NX_COMMAND" ]; then
          echo "❌ Nx not accessible through any method"
          echo ""
          echo "🔍 Diagnostic information:"
          echo "  Available binaries in node_modules/.bin:"
          ls -la node_modules/.bin/ | grep -E "(nx|@nx)" || echo "    No nx binaries found"
          echo "  Nx package directory:"
          ls -la node_modules/nx/ 2>/dev/null | head -5 || echo "    No nx directory found"
          echo "  @nx packages:"
          ls -la node_modules/@nx/ 2>/dev/null | head -5 || echo "    No @nx directory found"
          echo "  NPX debug:"
          npx nx --version 2>&1 || echo "    npx nx failed"
          echo ""
          exit 1
        fi
        
        # Test basic Nx functionality
        echo "🧪 Testing Nx workspace detection with: $NX_COMMAND"
        echo "Current directory: $(pwd)"
        echo "nx.json exists: $([ -f nx.json ] && echo 'yes' || echo 'no')"
        
        # Try to get version first
        NX_VERSION=$($NX_COMMAND --version 2>/dev/null || echo "unknown")
        echo "Nx version: $NX_VERSION"
        
        # Test workspace detection
        if ! $NX_COMMAND show projects --quiet >/dev/null 2>&1; then
          echo "⚠️ Nx workspace detection failed, attempting diagnostics..."
          
          # Enhanced diagnostics
          echo "🔧 Workspace diagnostic information:"
          echo "  - Working directory: $(pwd)"
          echo "  - nx.json exists: $([ -f nx.json ] && echo 'yes' || echo 'no')"
          echo "  - package.json exists: $([ -f package.json ] && echo 'yes' || echo 'no')"
          
          if [ -f nx.json ]; then
            echo "  - nx.json size: $(wc -c nx.json | awk '{print $1}') bytes"
            echo "  - nx.json first few lines:"
            head -5 nx.json 2>/dev/null || echo "    Cannot read nx.json"
          fi
          
          # Try reset with full path
          echo "🔄 Attempting Nx reset..."
          $NX_COMMAND reset 2>&1 || echo "Reset failed"
          
          # Try clearing any potential cache issues
          if [ -d ".nx" ]; then
            echo "🗑️ Removing .nx directory..."
            rm -rf .nx
          fi
          
          if [ -d "node_modules/.cache/nx" ]; then
            echo "🗑️ Removing nx cache..."
            rm -rf node_modules/.cache/nx
          fi
          
          # Try again after cleanup
          echo "🔄 Retrying workspace detection..."
          if ! $NX_COMMAND show projects --quiet >/dev/null 2>&1; then
            echo "❌ Nx workspace still not accessible after cleanup"
            echo "🔍 Final diagnostic - attempting to show projects with verbose output:"
            $NX_COMMAND show projects 2>&1 || echo "Command failed"
            exit 1
          fi
        fi

        # Store the working command for later use
        echo "NX_COMMAND=$NX_COMMAND" >> $GITHUB_ENV
        
        echo "✅ Basic Nx environment configured and validated"
        echo "   Nx version: $NX_VERSION"
        echo "   Command: $NX_COMMAND"
        
        # Try to count projects safely
        PROJECT_COUNT=$($NX_COMMAND show projects 2>/dev/null | wc -l || echo "unknown")
        echo "   Projects detected: $PROJECT_COUNT"

    - name: Workspace Setup Complete
      shell: bash
      run: |
        echo "✅ Workspace setup complete"
        echo "   Node.js: $(node --version)"
        echo "   NPM: $(npm --version)" 
        echo "   Dependencies: ${{ steps.cached-dependencies.outputs.cache-hit == 'true' && 'Restored from cache' || 'Installed fresh' }}"
        echo "   Cache Key Suffix: ${{ inputs.cache-key-suffix != '' && inputs.cache-key-suffix || 'none' }}"
        echo "   System Dependencies: ${{ inputs.skip-system-deps == 'true' && 'Skipped' || 'Installed' }}"
        echo ""
        echo "ℹ️  Ready for build and test operations"
