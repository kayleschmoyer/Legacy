name: "Code Quality Gates"
description: "Comprehensive code quality validation with formatting, linting, type checking, and intelligent parallel execution"

inputs:
  dte-active:
    description: "Whether a DTE session has already been started by the calling job"
    required: false
    default: "false"
  parallel:
    description: "Number of parallel processes (used for local execution and distributed max-parallel)"
    required: false
    default: "4"
  base-ref:
    description: "Base reference for affected detection"
    required: false
    default: "origin/main"
  head-ref:
    description: "Head reference for affected detection"
    required: false
    default: "HEAD"
  skip-formatting:
    description: "Skip code formatting check"
    required: false
    default: "false"
  timeout-minutes:
    description: "Timeout for quality gates"
    required: false
    default: "15"

outputs:
  result:
    description: "Overall quality gates result (success/failure)"
    value: ${{ steps.check-results.outputs.result }}
  dte-quota-exceeded:
    description: "Whether DTE quota was exceeded during execution"
    value: ${{ steps.run-tasks.outputs.dte-quota-exceeded || 'false' }}
  formatting-result:
    description: "Code formatting check result"
    value: ${{ steps.formatting.outputs.result }}
  formatting-failed-projects:
    description: "Projects that failed formatting (comma-separated)"
    value: ${{ steps.formatting.outputs.failed-projects }}
  lint-result:
    description: "ESLint validation result"
    value: ${{ steps.run-tasks.outputs.lint-result }}
  lint-failed-projects:
    description: "Projects that failed lint (comma-separated)"
    value: ${{ steps.run-tasks.outputs.lint-failed-projects }}
  typecheck-result:
    description: "TypeScript type checking result"
    value: ${{ steps.run-tasks.outputs.typecheck-result }}
  typecheck-failed-projects:
    description: "Projects that failed typecheck (comma-separated)"
    value: ${{ steps.run-tasks.outputs.typecheck-failed-projects }}
  test-result:
    description: "Unit tests result"
    value: ${{ steps.run-tasks.outputs.test-result }}
  test-failed-projects:
    description: "Projects that failed tests (comma-separated)"
    value: ${{ steps.run-tasks.outputs.test-failed-projects }}
  execution-strategy:
    description: "Strategy used (distributed/local)"
    value: ${{ steps.run-tasks.outputs.strategy }}

runs:
  using: "composite"
  steps:
    - name: "🔍 Validate Workspace Setup"
      shell: bash
      run: |
        echo "::group::🔍 Workspace Validation"

        echo "🔧 Verifying workspace dependencies..."

        # Check if node_modules exists
        if [ ! -d "node_modules" ]; then
          echo "❌ node_modules directory not found"
          echo "::error::Dependencies not installed. Setup action may have failed."
          exit 1
        fi

        # Determine Nx command to use (from setup action or fallback)
        if [ -n "${NX_COMMAND:-}" ]; then
          NX_CMD="$NX_COMMAND"
          echo "📋 Using Nx command from setup: $NX_CMD"
        else
          echo "⚠️ NX_COMMAND not set, attempting to detect Nx..."
          if [ -f pnpm-lock.yaml ] && command -v pnpm >/dev/null 2>&1 && pnpm exec nx -- --version >/dev/null 2>&1; then
            NX_CMD="pnpm exec nx --"
          elif pnpm exec nx --version >/dev/null 2>&1; then
            NX_CMD="pnpm exec nx"
          elif [ -f "node_modules/.bin/nx" ] && node_modules/.bin/nx --version >/dev/null 2>&1; then
            NX_CMD="node_modules/.bin/nx"
          elif npm exec nx -- --version >/dev/null 2>&1; then
            NX_CMD="npm exec nx --"
          else
            echo "❌ Nx CLI not available through any method"
            echo "::error::Nx not found. Check dependency installation."
            exit 1
          fi
        fi

        echo "🔧 Using Nx command: $NX_CMD"

        # Check if nx.json exists (workspace root indicator)
        if [ ! -f "nx.json" ]; then
          echo "❌ nx.json not found - not in Nx workspace root"
          echo "::error::Not in Nx workspace root directory"
          exit 1
        fi

        # Verify Nx can read workspace configuration
        if ! $NX_CMD show projects >/dev/null 2>&1; then
          echo "⚠️ Nx workspace validation failed, attempting recovery..."
          
          # Try reset
          $NX_CMD reset 2>/dev/null || echo "Reset command failed"
          
          # Clear caches
          rm -rf .nx node_modules/.cache/nx 2>/dev/null || true
          
          if ! $NX_CMD show projects >/dev/null 2>&1; then
            echo "❌ Nx workspace configuration invalid after recovery attempt"
            echo "::error::Nx cannot read workspace configuration"
            echo "Debug info:"
            $NX_CMD show projects 2>&1 | head -10 || echo "Show projects failed"
            exit 1
          fi
        fi

        # Store the working command for later steps
        echo "NX_CMD=$NX_CMD" >> $GITHUB_ENV

        echo "✅ Workspace validation passed"
        echo "   Nx command: $NX_CMD"
        echo "   Nx version: $($NX_CMD --version 2>/dev/null || echo 'unknown')"
        echo "   Working directory: $(pwd)"
        PROJECT_COUNT=$($NX_CMD show projects 2>/dev/null | wc -l || echo "unknown")
        echo "   Projects found: $PROJECT_COUNT"

        echo "::endgroup::"

    - name: "🔒 Migration Immutability Check"
      shell: bash
      run: |
        echo "::group::🔒 Migration Immutability Check"
        echo "Verifying no previously-landed migration files have been modified or deleted..."

        node scripts/check-migration-immutability.js --branch

        echo "::endgroup::"

    - name: "🎨 Code Formatting Check"
      id: formatting
      if: inputs.skip-formatting != 'true'
      shell: bash
      run: |
        echo "::group::🎨 Code Formatting Validation"

        # Use the validated Nx command
        if [ -z "${NX_CMD:-}" ]; then
          if [ -f pnpm-lock.yaml ] && command -v pnpm >/dev/null 2>&1; then
            NX_CMD="pnpm exec nx --"
          else
            NX_CMD="pnpm exec nx"
          fi
        fi
        echo "🔧 Using Nx command: $NX_CMD"
        echo "::notice::To reproduce locally: $NX_CMD format:check"

        # First try with affected detection using base/head refs
        echo "🔍 Checking formatting for affected files..."
        echo "Base ref: ${{ inputs.base-ref }}"
        echo "Head ref: ${{ inputs.head-ref }}"

        if $NX_CMD format:check --base="${{ inputs.base-ref }}" --head="${{ inputs.head-ref }}" 2>&1 | tee format-check.log; then
          echo "✅ All affected files are properly formatted"
          echo "result=success" >> $GITHUB_OUTPUT
          echo "failed-projects=" >> $GITHUB_OUTPUT
        else
          # Check if the error was due to affected detection issues
          if grep -q "Could not find Nx modules\|Unable to determine affected\|No base found" format-check.log; then
            echo "⚠️ Affected detection failed, falling back to full format check..."
            
            # Fallback to full workspace format check
            if $NX_CMD format:check 2>&1 | tee format-check-full.log; then
              echo "✅ All files are properly formatted (full check)"
              echo "result=success" >> $GITHUB_OUTPUT
              echo "failed-projects=" >> $GITHUB_OUTPUT
            else
              echo "❌ Code formatting issues detected (full workspace)"
              echo "::error::Code formatting check failed. Run '$NX_CMD format:write' to fix."
              
              # Show specific files that need formatting
              echo "Files requiring formatting:"
              grep -E "would be reformatted|needs formatting|✖" format-check-full.log || true
              
              # Extract failed projects from formatting output (files are in projects)
              FAILED_PROJECTS=$(grep -oE "apps/[^/]+|lib/[^/]+|lambdas/[^/]+" format-check-full.log 2>/dev/null | sort -u | xargs | tr ' ' ',' || echo "formatting")
              echo "failed-projects=$FAILED_PROJECTS" >> $GITHUB_OUTPUT
              
              echo "result=failure" >> $GITHUB_OUTPUT
              exit 1
            fi
          else
            echo "❌ Code formatting issues detected in affected files"
            echo "::error::Code formatting check failed. Run '$NX_CMD format:write' to fix."
            
            # Show specific files that need formatting
            echo "Files requiring formatting:"
            grep -E "would be reformatted|needs formatting|✖" format-check.log || true
            
            # Extract failed projects from formatting output (files are in projects)
            FAILED_PROJECTS=$(grep -oE "apps/[^/]+|lib/[^/]+|lambdas/[^/]+" format-check.log 2>/dev/null | sort -u | xargs | tr ' ' ',' || echo "formatting")
            echo "failed-projects=$FAILED_PROJECTS" >> $GITHUB_OUTPUT
            
            echo "result=failure" >> $GITHUB_OUTPUT
            exit 1
          fi
        fi

        echo "::endgroup::"

    - name: "⚡ Run Quality Gates"
      id: run-tasks
      shell: bash
      run: |
        echo "::group::⚡ Quality Gates (lint · typecheck · test)"

        PARALLEL="${{ inputs.parallel }}"

        # When dte-active is true, start-ci-run was already called by the job.
        # Nx will automatically route tasks to the pre-spawned agent runners.
        # When dte-active is false, disable cloud completely to preserve quota.
        if [ "${{ inputs.dte-active }}" = "true" ]; then
          echo "ℹ️ Nx Cloud DTE active — tasks will be distributed to agents"
          echo "strategy=distributed" >> $GITHUB_OUTPUT
        else
          echo "ℹ️ Running locally with --parallel=$PARALLEL"
          export NX_NO_CLOUD=true
          echo "strategy=local" >> $GITHUB_OUTPUT
        fi

        LINT_SUCCESS=true
        TYPECHECK_SUCCESS=true
        TEST_SUCCESS=true

        # ── Lint + Typecheck + Test (single Nx invocation) ────────────────────
        # Running all three target types in one `nx affected` call lets Nx's
        # task scheduler optimise parallelism across all targets simultaneously,
        # instead of waiting for lint+typecheck to finish before starting tests.
        if pnpm exec nx affected -t lint typecheck test --parallel="$PARALLEL" 2>&1 | tee quality.log; then
          echo "✅ Lint, typecheck, and tests passed"
          echo "lint-result=success" >> $GITHUB_OUTPUT
          echo "lint-failed-projects=" >> $GITHUB_OUTPUT
          echo "typecheck-result=success" >> $GITHUB_OUTPUT
          echo "typecheck-failed-projects=" >> $GITHUB_OUTPUT
          echo "test-result=success" >> $GITHUB_OUTPUT
          echo "test-failed-projects=" >> $GITHUB_OUTPUT
        else
          # Parse individual target failures from the combined log
          if grep -q "lint.*failed\|ESLint" quality.log; then
            LINT_FAILED=$(grep -oE "nx run [^:]+:lint" quality.log 2>/dev/null | sed 's/nx run //;s/:lint//' | sort -u | xargs | tr ' ' ',' || echo "")
            echo "lint-result=failure" >> $GITHUB_OUTPUT
            echo "lint-failed-projects=${LINT_FAILED:-lint}" >> $GITHUB_OUTPUT
            LINT_SUCCESS=false
          else
            echo "lint-result=success" >> $GITHUB_OUTPUT
            echo "lint-failed-projects=" >> $GITHUB_OUTPUT
          fi

          if grep -q "typecheck.*failed\|TypeScript\|TS[0-9]" quality.log; then
            TYPECHECK_FAILED=$(grep -oE "nx run [^:]+:typecheck" quality.log 2>/dev/null | sed 's/nx run //;s/:typecheck//' | sort -u | xargs | tr ' ' ',' || echo "")
            echo "typecheck-result=failure" >> $GITHUB_OUTPUT
            echo "typecheck-failed-projects=${TYPECHECK_FAILED:-typecheck}" >> $GITHUB_OUTPUT
            TYPECHECK_SUCCESS=false
          else
            echo "typecheck-result=success" >> $GITHUB_OUTPUT
            echo "typecheck-failed-projects=" >> $GITHUB_OUTPUT
          fi

          if grep -q "test.*failed\|FAIL " quality.log; then
            TEST_FAILED=$(grep -oE "nx run [^:]+:test" quality.log 2>/dev/null | sed 's/nx run //;s/:test//' | sort -u | xargs | tr ' ' ',' || echo "")
            echo "test-result=failure" >> $GITHUB_OUTPUT
            echo "test-failed-projects=${TEST_FAILED:-test}" >> $GITHUB_OUTPUT
            TEST_SUCCESS=false
          else
            echo "test-result=success" >> $GITHUB_OUTPUT
            echo "test-failed-projects=" >> $GITHUB_OUTPUT
          fi
        fi

        # ── DTE quota exceeded detection ───────────────────────────────────────
        # Surface cloud-specific failures separately from real code failures so
        # the PR comment can show an informative quota warning.
        if grep -qi "quota\|limit\|exceeded\|insufficient\|disabled\|401\|minimum.*agent\|unable to complete" quality.log 2>/dev/null; then
          echo "dte-quota-exceeded=true" >> $GITHUB_OUTPUT
        else
          echo "dte-quota-exceeded=false" >> $GITHUB_OUTPUT
        fi

        # ── Final result ───────────────────────────────────────────────────────
        if [ "$LINT_SUCCESS" = false ] || [ "$TYPECHECK_SUCCESS" = false ] || [ "$TEST_SUCCESS" = false ]; then
          echo "❌ One or more quality gates failed"
          echo "  Lint:      $([ "$LINT_SUCCESS"      = true ] && echo '✅' || echo '❌')"
          echo "  Typecheck: $([ "$TYPECHECK_SUCCESS" = true ] && echo '✅' || echo '❌')"
          echo "  Tests:     $([ "$TEST_SUCCESS"      = true ] && echo '✅' || echo '❌')"
          echo "To reproduce locally:"
          echo "  pnpm exec nx affected -t lint typecheck test --parallel=$PARALLEL"
          exit 1
        fi

        echo "✅ All quality gates passed"
        echo "::endgroup::"

    - name: " Check Overall Results"
      id: check-results
      if: always()
      shell: bash
      run: |
        echo "::group::📊 Quality Gates Summary"

        # Collect all results
        FORMATTING_RESULT="${{ steps.formatting.outputs.result || 'skipped' }}"
        LINT_RESULT="${{ steps.run-tasks.outputs.lint-result }}"
        TYPECHECK_RESULT="${{ steps.run-tasks.outputs.typecheck-result }}"
        TEST_RESULT="${{ steps.run-tasks.outputs.test-result }}"

        # Determine overall result
        OVERALL_RESULT="success"
        if [ "$FORMATTING_RESULT" = "failure" ] || [ "$LINT_RESULT" = "failure" ] || [ "$TYPECHECK_RESULT" = "failure" ] || [ "$TEST_RESULT" = "failure" ]; then
          OVERALL_RESULT="failure"
        fi

        echo "result=$OVERALL_RESULT" >> $GITHUB_OUTPUT

        # Create summary
        echo "## 🔍 Quality Gates Results" >> $GITHUB_STEP_SUMMARY
        echo "| Check | Result | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|---------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Code Formatting | $( [ "$FORMATTING_RESULT" = "success" ] && echo "✅ Passed" || [ "$FORMATTING_RESULT" = "failure" ] && echo "❌ Failed" || echo "⏭️ Skipped" ) | $( [ "$FORMATTING_RESULT" = "success" ] && echo "All files properly formatted" || [ "$FORMATTING_RESULT" = "failure" ] && echo "Formatting issues detected" || echo "Formatting check disabled" ) |" >> $GITHUB_STEP_SUMMARY
        echo "| ESLint Validation | $( [ "$LINT_RESULT" = "success" ] && echo "✅ Passed" || echo "❌ Failed" ) | $( [ "$LINT_RESULT" = "success" ] && echo "No linting issues" || echo "Linting issues detected" ) |" >> $GITHUB_STEP_SUMMARY
        echo "| TypeScript Check | $( [ "$TYPECHECK_RESULT" = "success" ] && echo "✅ Passed" || echo "❌ Failed" ) | $( [ "$TYPECHECK_RESULT" = "success" ] && echo "No type errors" || echo "Type errors detected" ) |" >> $GITHUB_STEP_SUMMARY
        echo "| Unit Tests | $( [ "$TEST_RESULT" = "success" ] && echo "✅ Passed" || echo "❌ Failed" ) | $( [ "$TEST_RESULT" = "success" ] && echo "All tests passing" || echo "Test failures detected" ) |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Overall Result**: $( [ "$OVERALL_RESULT" = "success" ] && echo "✅ **All Quality Gates Passed**" || echo "❌ **Quality Gates Failed**" )" >> $GITHUB_STEP_SUMMARY

        if [ "$OVERALL_RESULT" = "success" ]; then
          echo "🎉 All quality gates passed successfully!"
        else
          echo "❌ Quality gates failed - see individual check results above"
        fi

        echo "::endgroup::"
