name: "Workflow Metrics"
description: "Comprehensive workflow performance tracking and metrics collection with historical analysis and benchmarking"

inputs:
  workflow-start-time:
    description: "Workflow start timestamp (ISO 8601 or GitHub event timestamp)"
    required: false
  execution-mode:
    description: "Execution mode (distributed/local)"
    required: false
  optimal-agents:
    description: "Number of agents/processes used"
    required: false
  step-timings:
    description: "JSON object with individual step timing data"
    required: false
  execution-strategy:
    description: "Execution strategy used (full/selective/minimal)"
    required: false
  affected-components:
    description: "JSON array of affected components"
    required: false
  include-benchmarks:
    description: "Include performance benchmarking"
    required: false
    default: "true"

outputs:
  workflow-duration:
    description: "Total workflow duration in seconds"
    value: ${{ steps.metrics.outputs.workflow-duration }}
  performance-category:
    description: "Performance category (excellent/good/acceptable/slow)"
    value: ${{ steps.metrics.outputs.performance-category }}
  efficiency-score:
    description: "Efficiency score (0-100)"
    value: ${{ steps.metrics.outputs.efficiency-score }}
  metrics-summary:
    description: "Complete metrics summary as JSON"
    value: ${{ steps.metrics.outputs.metrics-summary }}
  recommendations:
    description: "Performance optimization recommendations"
    value: ${{ steps.metrics.outputs.recommendations }}
  benchmark-comparison:
    description: "Comparison against expected benchmarks"
    value: ${{ steps.metrics.outputs.benchmark-comparison }}

runs:
  using: "composite"
  steps:
    - name: "📊 Calculate Workflow Metrics"
      id: metrics
      shell: bash
      run: |
        echo "::group::📊 Workflow Performance Analysis"
        
        # Parse inputs
        WORKFLOW_START="${{ inputs.workflow-start-time }}"
        EXECUTION_MODE="${{ inputs.execution-mode }}"
        OPTIMAL_AGENTS="${{ inputs.optimal-agents }}"
        STEP_TIMINGS='${{ inputs.step-timings }}'
        EXECUTION_STRATEGY="${{ inputs.execution-strategy }}"
        AFFECTED_COMPONENTS='${{ inputs.affected-components }}'
        INCLUDE_BENCHMARKS="${{ inputs.include-benchmarks }}"
        
        echo "⏱️ Calculating performance metrics..."
        
        # Calculate workflow duration
        WORKFLOW_DURATION="unknown"
        if [ -n "$WORKFLOW_START" ]; then
          START_SECONDS=$(date -d "$WORKFLOW_START" +%s 2>/dev/null || date +%s)
          CURRENT_SECONDS=$(date +%s)
          WORKFLOW_DURATION=$((CURRENT_SECONDS - START_SECONDS))
          
          DURATION_MIN=$((WORKFLOW_DURATION / 60))
          DURATION_SEC=$((WORKFLOW_DURATION % 60))
          echo "Duration: ${WORKFLOW_DURATION}s (${DURATION_MIN}m ${DURATION_SEC}s)"
        else
          echo "⚠️ No start time provided - using current time as baseline"
          WORKFLOW_DURATION=0
        fi
        
        # Determine performance category and efficiency score
        PERFORMANCE_CATEGORY="unknown"
        EFFICIENCY_SCORE=0
        
        if [ "$WORKFLOW_DURATION" != "unknown" ] && [ "$WORKFLOW_DURATION" -gt 0 ]; then
          if [ "$WORKFLOW_DURATION" -lt 180 ]; then
            PERFORMANCE_CATEGORY="excellent"
            EFFICIENCY_SCORE=95
          elif [ "$WORKFLOW_DURATION" -lt 300 ]; then
            PERFORMANCE_CATEGORY="excellent"
            EFFICIENCY_SCORE=90
          elif [ "$WORKFLOW_DURATION" -lt 600 ]; then
            PERFORMANCE_CATEGORY="good"
            EFFICIENCY_SCORE=80
          elif [ "$WORKFLOW_DURATION" -lt 900 ]; then
            PERFORMANCE_CATEGORY="acceptable"
            EFFICIENCY_SCORE=65
          elif [ "$WORKFLOW_DURATION" -lt 1200 ]; then
            PERFORMANCE_CATEGORY="acceptable"
            EFFICIENCY_SCORE=50
          else
            PERFORMANCE_CATEGORY="slow"
            EFFICIENCY_SCORE=30
          fi
          
          # Adjust efficiency score based on execution mode
          if [ "$EXECUTION_MODE" = "distributed" ]; then
            EFFICIENCY_SCORE=$((EFFICIENCY_SCORE + 5)) # Bonus for using DTE
          fi
          
          # Adjust based on execution strategy
          case "$EXECUTION_STRATEGY" in
            "minimal")
              EFFICIENCY_SCORE=$((EFFICIENCY_SCORE + 10)) # Bonus for minimal execution
              ;;
            "selective")
              EFFICIENCY_SCORE=$((EFFICIENCY_SCORE + 5)) # Bonus for selective execution
              ;;
            "full")
              # No adjustment - expected for full builds
              ;;
          esac
          
          # Cap at 100
          if [ "$EFFICIENCY_SCORE" -gt 100 ]; then
            EFFICIENCY_SCORE=100
          fi
        fi
        
        # Generate performance recommendations
        RECOMMENDATIONS=()
        
        if [ "$WORKFLOW_DURATION" != "unknown" ] && [ "$WORKFLOW_DURATION" -gt 600 ]; then
          if [ "$EXECUTION_MODE" != "distributed" ]; then
            RECOMMENDATIONS+=("Enable Nx Cloud DTE for 60-80% faster execution")
          fi
          
          if [ "$EXECUTION_STRATEGY" = "full" ]; then
            RECOMMENDATIONS+=("Optimize change detection to enable selective builds")
          fi
          
          RECOMMENDATIONS+=("Consider parallel execution optimization")
          RECOMMENDATIONS+=("Review and optimize slow build targets")
        fi
        
        if [ "$EXECUTION_MODE" = "local" ] && [ -z "${{ inputs.optimal-agents }}" ]; then
          RECOMMENDATIONS+=("Configure optimal agent count for better parallelization")
        fi
        
        if [ ${#RECOMMENDATIONS[@]} -eq 0 ]; then
          RECOMMENDATIONS+=("Performance is optimal - no recommendations")
        fi
        
        # Create benchmark comparison if enabled
        BENCHMARK_COMPARISON="{}"
        if [ "$INCLUDE_BENCHMARKS" = "true" ] && [ "$WORKFLOW_DURATION" != "unknown" ]; then
          echo "📈 Generating benchmark comparison..."
          
          # Define expected benchmarks based on strategy and mode
          EXPECTED_DURATION=600 # Default 10 minutes
          
          case "$EXECUTION_STRATEGY" in
            "minimal")
              EXPECTED_DURATION=180 # 3 minutes for minimal
              ;;
            "selective")
              EXPECTED_DURATION=300 # 5 minutes for selective
              ;;
            "full")
              EXPECTED_DURATION=900 # 15 minutes for full build
              ;;
          esac
          
          # Adjust for execution mode
          if [ "$EXECUTION_MODE" = "distributed" ]; then
            EXPECTED_DURATION=$((EXPECTED_DURATION * 60 / 100)) # 40% faster with DTE
          fi
          
          PERFORMANCE_RATIO=$((WORKFLOW_DURATION * 100 / EXPECTED_DURATION))
          
          BENCHMARK_STATUS="on-target"
          if [ "$PERFORMANCE_RATIO" -lt 80 ]; then
            BENCHMARK_STATUS="faster-than-expected"
          elif [ "$PERFORMANCE_RATIO" -gt 150 ]; then
            BENCHMARK_STATUS="slower-than-expected"
          fi
          
          BENCHMARK_COMPARISON=$(cat << EOF
          {
            "expected_duration": $EXPECTED_DURATION,
            "actual_duration": $WORKFLOW_DURATION,
            "performance_ratio": $PERFORMANCE_RATIO,
            "status": "$BENCHMARK_STATUS",
            "variance_seconds": $((WORKFLOW_DURATION - EXPECTED_DURATION))
          }
          EOF
          )
        fi
        
        # Count affected components if provided
        COMPONENT_COUNT=0
        if [ -n "$AFFECTED_COMPONENTS" ] && echo "$AFFECTED_COMPONENTS" | jq . >/dev/null 2>&1; then
          COMPONENT_COUNT=$(echo "$AFFECTED_COMPONENTS" | jq 'length')
        fi
        
        # Create comprehensive metrics summary
        METRICS_SUMMARY=$(cat << EOF
        {
          "duration": {
            "total_seconds": $WORKFLOW_DURATION,
            "category": "$PERFORMANCE_CATEGORY",
            "efficiency_score": $EFFICIENCY_SCORE
          },
          "execution": {
            "mode": "$EXECUTION_MODE",
            "strategy": "$EXECUTION_STRATEGY",
            "agents": "$OPTIMAL_AGENTS",
            "affected_components": $COMPONENT_COUNT
          },
          "benchmarks": $BENCHMARK_COMPARISON,
          "recommendations": [$(printf '"%s",' "${RECOMMENDATIONS[@]}" | sed 's/,$//')]
        }
        EOF
        )
        
        # Set outputs
        echo "workflow-duration=$WORKFLOW_DURATION" >> $GITHUB_OUTPUT
        echo "performance-category=$PERFORMANCE_CATEGORY" >> $GITHUB_OUTPUT
        echo "efficiency-score=$EFFICIENCY_SCORE" >> $GITHUB_OUTPUT
        echo "metrics-summary=$(echo "$METRICS_SUMMARY" | jq -c .)" >> $GITHUB_OUTPUT
        echo "benchmark-comparison=$(echo "$BENCHMARK_COMPARISON" | jq -c .)" >> $GITHUB_OUTPUT
        
        # Set recommendations output
        echo "recommendations<<EOF" >> $GITHUB_OUTPUT
        printf '%s\n' "${RECOMMENDATIONS[@]}" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        # Create detailed step summary
        echo "## ⏱️ Workflow Performance Metrics" >> $GITHUB_STEP_SUMMARY
        echo "- **Duration**: ${WORKFLOW_DURATION}s ($PERFORMANCE_CATEGORY)" >> $GITHUB_STEP_SUMMARY
        echo "- **Efficiency Score**: $EFFICIENCY_SCORE/100" >> $GITHUB_STEP_SUMMARY
        echo "- **Execution Mode**: $EXECUTION_MODE" >> $GITHUB_STEP_SUMMARY
        echo "- **Strategy**: $EXECUTION_STRATEGY" >> $GITHUB_STEP_SUMMARY
        
        if [ "$OPTIMAL_AGENTS" != "" ]; then
          echo "- **Parallel Agents**: $OPTIMAL_AGENTS" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "$COMPONENT_COUNT" -gt 0 ]; then
          echo "- **Affected Components**: $COMPONENT_COUNT" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Add benchmark comparison if available
        if [ "$INCLUDE_BENCHMARKS" = "true" ] && [ "$BENCHMARK_COMPARISON" != "{}" ]; then
          BENCHMARK_STATUS=$(echo "$BENCHMARK_COMPARISON" | jq -r '.status')
          EXPECTED_DUR=$(echo "$BENCHMARK_COMPARISON" | jq -r '.expected_duration')
          VARIANCE=$(echo "$BENCHMARK_COMPARISON" | jq -r '.variance_seconds')
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 Benchmark Comparison" >> $GITHUB_STEP_SUMMARY
          echo "- **Expected Duration**: ${EXPECTED_DUR}s" >> $GITHUB_STEP_SUMMARY
          echo "- **Variance**: ${VARIANCE}s" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: $( [ "$BENCHMARK_STATUS" = "faster-than-expected" ] && echo "🚀 Faster than expected" || [ "$BENCHMARK_STATUS" = "slower-than-expected" ] && echo "🐌 Slower than expected" || echo "🎯 On target" )" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Add recommendations
        if [ ${#RECOMMENDATIONS[@]} -gt 0 ] && [ "${RECOMMENDATIONS[0]}" != "Performance is optimal - no recommendations" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💡 Performance Recommendations" >> $GITHUB_STEP_SUMMARY
          for rec in "${RECOMMENDATIONS[@]}"; do
            echo "- $rec" >> $GITHUB_STEP_SUMMARY
          done
        fi
        
        # Display summary
        echo ""
        echo "📊 Performance Summary:"
        echo "  - Duration: ${WORKFLOW_DURATION}s ($PERFORMANCE_CATEGORY)"
        echo "  - Efficiency: $EFFICIENCY_SCORE/100"
        echo "  - Mode: $EXECUTION_MODE"
        
        if [ ${#RECOMMENDATIONS[@]} -gt 0 ] && [ "${RECOMMENDATIONS[0]}" != "Performance is optimal - no recommendations" ]; then
          echo ""
          echo "💡 Top Recommendations:"
          printf '  - %s\n' "${RECOMMENDATIONS[@]}" | head -3
        fi
        
        echo "::endgroup::"
