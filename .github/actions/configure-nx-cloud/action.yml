name: "Configure Nx Cloud"
description: "Test Nx Cloud availability and configure execution mode with appropriate fallback"
inputs:
  agent-count:
    description: "Number of distributed agents to use when cloud is available"
    required: false
    default: "8"
  local-parallel:
    description: "Number of parallel processes for local execution fallback"
    required: false
    default: "2"
  workflow-type:
    description: "Type of workflow (pr-validation, integration-build, deployment)"
    required: false
    default: "pr-validation"
  nx-cloud-access-token-candidate:
    description: "Candidate Nx Cloud access token (only set as env var if cloud is available)"
    required: false
    default: ""

outputs:
  cloud-available:
    description: "Whether Nx Cloud is available and within quota limits"
    value: ${{ steps.nx-cloud-test.outputs.cloud-available }}
  execution-mode:
    description: "The execution mode being used (cloud or local)"
    value: ${{ steps.set-mode.outputs.execution-mode }}
  agent-count:
    description: "Number of agents configured for distributed execution"
    value: ${{ steps.set-mode.outputs.agent-count }}

runs:
  using: "composite"
  steps:
    - name: Test Nx Cloud Availability
      id: nx-cloud-test
      shell: bash
      run: |
        echo "🔍 Testing Nx Cloud availability for ${{ inputs.workflow-type }}..."

        # Only test if we have a candidate token
        if [ -z "${{ inputs.nx-cloud-access-token-candidate }}" ]; then
          echo "cloud-available=false" >> $GITHUB_OUTPUT
          echo "ℹ️  No cloud token provided, will use local execution"
          exit 0
        fi

        # Make the script executable (cross-platform)
        if [ -f ./.github/scripts/nx-cloud-fallback.sh ]; then
          chmod +x ./.github/scripts/nx-cloud-fallback.sh
          
          # Set token temporarily ONLY for testing (not as environment variable)
          export NX_CLOUD_ACCESS_TOKEN="${{ inputs.nx-cloud-access-token-candidate }}"
          
          # Run the test-only version to check availability
          if ./.github/scripts/nx-cloud-fallback.sh --test-only; then
            echo "cloud-available=true" >> $GITHUB_OUTPUT
            echo -e "✅ Nx Cloud is available - will use distributed execution"
          else
            echo "cloud-available=false" >> $GITHUB_OUTPUT
            echo -e "⚠️  Nx Cloud not available - will use local execution"
          fi
        else
          echo "⚠️  Nx Cloud fallback script not found, defaulting to local execution"
          echo "cloud-available=false" >> $GITHUB_OUTPUT
        fi

    - name: Configure Nx Execution Mode
      id: set-mode
      shell: bash
      run: |
        echo "🔧 Configuring Nx execution mode for ${{ inputs.workflow-type }}..."

        if [ "${{ steps.nx-cloud-test.outputs.cloud-available }}" = "true" ]; then
          echo "🚀 Configuring Nx Cloud distributed execution..."
          
          # Set cloud access token (only when cloud is confirmed available)
          if [ -n "${{ inputs.nx-cloud-access-token-candidate }}" ]; then
            echo "NX_CLOUD_ACCESS_TOKEN=${{ inputs.nx-cloud-access-token-candidate }}" >> $GITHUB_ENV
          fi
          
          # Set Nx Cloud environment variables for distributed execution
          echo "NX_CLOUD_DISTRIBUTED_EXECUTION=true" >> $GITHUB_ENV
          echo "NX_CLOUD_DISTRIBUTED_EXECUTION_AGENT_COUNT=${{ inputs.agent-count }}" >> $GITHUB_ENV
          echo "NX_CLOUD_ID=68ce3a86265b78d5c0375b68" >> $GITHUB_ENV
          echo "NX_PARALLEL=4" >> $GITHUB_ENV
          echo "NX_LOCAL_FALLBACK=false" >> $GITHUB_ENV
          echo "NX_CLOUD_NO_TIMEOUTS=true" >> $GITHUB_ENV
          echo "NX_VERBOSE_LOGGING=false" >> $GITHUB_ENV
          
          # Output for reference
          echo "execution-mode=cloud" >> $GITHUB_OUTPUT
          echo "agent-count=${{ inputs.agent-count }}" >> $GITHUB_OUTPUT
          
          echo "✅ Nx Cloud distributed execution configured with ${{ inputs.agent-count }} agents"
        else
          echo "🔧 Configuring local execution fallback..."
          
          # Set local execution environment variables
          echo "NX_CLOUD_DISTRIBUTED_EXECUTION=false" >> $GITHUB_ENV
          echo "NX_CLOUD_DISTRIBUTED_EXECUTION_AGENT_COUNT=0" >> $GITHUB_ENV
          echo "NX_CLOUD_ID=" >> $GITHUB_ENV
          echo "NX_PARALLEL=${{ inputs.local-parallel }}" >> $GITHUB_ENV
          echo "NX_LOCAL_FALLBACK=true" >> $GITHUB_ENV
          echo "NX_CLOUD_NO_TIMEOUTS=false" >> $GITHUB_ENV
          echo "NX_VERBOSE_LOGGING=true" >> $GITHUB_ENV
          echo "NX_SKIP_NX_CACHE=false" >> $GITHUB_ENV
          
          # Clear cloud access token to prevent connection attempts
          echo "NX_CLOUD_ACCESS_TOKEN=" >> $GITHUB_ENV
          
          # Output for reference
          echo "execution-mode=local" >> $GITHUB_OUTPUT
          echo "agent-count=0" >> $GITHUB_OUTPUT
          
          echo "✅ Local execution fallback configured with NX_PARALLEL=${{ inputs.local-parallel }}"
        fi

    - name: Start Nx Cloud Distributed CI (Conditional)
      if: steps.nx-cloud-test.outputs.cloud-available == 'true'
      shell: bash
      run: |
        echo "🚀 Starting Nx Cloud distributed CI run for ${{ inputs.workflow-type }}..."

        # Get agent count from environment
        AGENT_COUNT="${{ inputs.agent-count }}"

        echo "Starting distributed execution with $AGENT_COUNT agents..."
        if npx nx-cloud start-ci-run --distribute-on="$AGENT_COUNT linux-medium-js" --stop-agents-after="build,test,lint"; then
          echo "✅ Distributed CI run started with $AGENT_COUNT agents"
        else
          echo "❌ Failed to start Nx Cloud distributed execution"
          echo "🔧 This shouldn't happen after successful availability test - falling back to local..."
          
          # Emergency fallback if start-ci-run fails after successful test
          echo "NX_CLOUD_DISTRIBUTED_EXECUTION=false" >> $GITHUB_ENV
          echo "NX_LOCAL_FALLBACK=true" >> $GITHUB_ENV
          echo "NX_PARALLEL=${{ inputs.local-parallel }}" >> $GITHUB_ENV
          echo "NX_CLOUD_ACCESS_TOKEN=" >> $GITHUB_ENV
          
          echo "execution-mode=local-emergency" >> $GITHUB_OUTPUT
        fi

    - name: Display Final Configuration
      shell: bash
      run: |
        echo "📋 Final Nx Configuration for ${{ inputs.workflow-type }}:"
        echo "==============================================="

        if [ "${NX_LOCAL_FALLBACK}" = "true" ]; then
          echo "  🔧 LOCAL EXECUTION MODE"
          echo "  💡 Nx Cloud unavailable (quota exceeded or connection failed)"
          echo "  💡 Running with conservative local parallelism"
        elif [ "${NX_CLOUD_DISTRIBUTED_EXECUTION}" = "true" ]; then
          echo "  🚀 NX CLOUD DISTRIBUTED MODE"
          echo "  💡 Using Nx Cloud distributed execution with ${NX_CLOUD_DISTRIBUTED_EXECUTION_AGENT_COUNT:-unknown} agents"
        else
          echo "  🔧 LOCAL MODE"
          echo "  💡 Standard local execution"
        fi

        echo "  Parallel: ${NX_PARALLEL:-4}"
        echo "  Cloud ID: ${NX_CLOUD_ID:-not set}"
        echo "  Workflow: ${{ inputs.workflow-type }}"
        echo ""
