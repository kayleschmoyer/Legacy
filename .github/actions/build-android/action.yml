name: "Build Android APK"
description: "Shared Android build logic — Expo prebuild + Gradle assembleDebug/Release with ABI filtering, caching, and APK validation"

inputs:
  build-type:
    description: "Build type: debug or release"
    required: false
    default: "debug"
  gradle-executable:
    description: "Gradle executable path (./gradlew or gradlew.bat)"
    required: false
    default: "./gradlew"
  extra-gradle-flags:
    description: "Additional Gradle flags (e.g. --configuration-cache)"
    required: false
    default: ""
  timeout-minutes:
    description: "Timeout for the Gradle build step (minutes)"
    required: false
    default: "40"
  skip-prebuild:
    description: "Skip expo prebuild (if already run)"
    required: false
    default: "false"
  cache-native-builds:
    description: "Cache native C++ build outputs (.cxx, .so)"
    required: false
    default: "true"
  cache-key-suffix:
    description: "Suffix for cache keys (useful for matrix builds)"
    required: false
    default: ""

outputs:
  apk-path:
    description: "Relative path to the built APK (from apps/app/android/)"
    value: ${{ steps.build.outputs.apk_path }}
  apk-size:
    description: "Human-readable APK file size"
    value: ${{ steps.build.outputs.apk_size }}
  build-time:
    description: "Build duration in seconds"
    value: ${{ steps.build.outputs.build_time }}

runs:
  using: "composite"
  steps:
    - name: "🔧 Run Expo Prebuild"
      if: inputs.skip-prebuild != 'true'
      shell: bash
      run: |
        cd apps/app
        pnpm exec expo prebuild --platform android --no-install
        chmod +x android/gradlew
        echo "✅ Expo prebuild completed"

    - name: "📦 Cache Gradle (deps + build cache + wrapper)"
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        # The bulk of cold-cache time is dependency download and Kotlin compile
        # of the Gradle plugins. Persist:
        # - modules-2 / jars-* / transforms-*: resolved deps (AGP, Kotlin stdlib,
        #   RN Gradle plugin, Expo plugins, androidx/com.facebook.react JARs)
        # - build-cache-1: Gradle's task-output cache. With --build-cache enabled
        #   (see GRADLE_FLAGS below), unchanged native CMake tasks go FROM-CACHE.
        # - wrapper/dists: the gradle-<version>-bin.zip download (~150MB).
        # Note: GRADLE_USER_HOME defaults to $HOME/.gradle = /home/ubuntu/.gradle
        # on self-hosted runners, which the AMI pre-warms with the wrapper dist.
        path: |
          ~/.gradle/caches/modules-2
          ~/.gradle/caches/jars-9
          ~/.gradle/caches/transforms-3
          ~/.gradle/caches/transforms-4
          ~/.gradle/caches/build-cache-1
          ~/.gradle/wrapper/dists
          ~/.gradle/notifications
        key: >-
          ${{ runner.os }}-gradle-${{ inputs.build-type }}-${{ inputs.cache-key-suffix }}-${{
          hashFiles('pnpm-lock.yaml', 'apps/app/android/**/*.gradle*',
          'apps/app/android/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-${{ inputs.build-type }}-${{ inputs.cache-key-suffix }}-
          ${{ runner.os }}-gradle-${{ inputs.build-type }}-
          ${{ runner.os }}-gradle-

    - name: "📦 Cache Project .gradle (configuration cache + project state)"
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        # Holds the Gradle configuration cache (--configuration-cache),
        # daemon registry, and project-local Gradle metadata. Keyed off the
        # same inputs as the configuration cache itself would hash internally.
        path: |
          apps/app/android/.gradle
        key: >-
          ${{ runner.os }}-gradle-project-${{ inputs.build-type }}-${{ inputs.cache-key-suffix }}-${{
          hashFiles('pnpm-lock.yaml', 'apps/app/android/**/*.gradle*',
          'apps/app/android/app/build.gradle') }}
        restore-keys: |
          ${{ runner.os }}-gradle-project-${{ inputs.build-type }}-${{ inputs.cache-key-suffix }}-
          ${{ runner.os }}-gradle-project-${{ inputs.build-type }}-
          ${{ runner.os }}-gradle-project-

    - name: "📦 Cache Native C++ Build Outputs"
      if: inputs.cache-native-builds == 'true'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        # Belt-and-suspenders alongside Gradle's --build-cache: capture the
        # raw C++ build outputs for the three modules that dominate native
        # compile time (Reanimated worklets, Worklets runtime, Nitro modules).
        # The pnpm glob covers the resolved package paths; the top-level glob
        # covers the hoisted symlink case. node_modules churn on lockfile
        # change so we key off pnpm-lock.yaml.
        path: |
          apps/app/android/app/.cxx
          apps/app/android/build
          node_modules/.pnpm/react-native-reanimated@*/node_modules/react-native-reanimated/android/build
          node_modules/.pnpm/react-native-worklets@*/node_modules/react-native-worklets/android/build
          node_modules/.pnpm/react-native-nitro-modules@*/node_modules/react-native-nitro-modules/android/build
          node_modules/react-native-reanimated/android/build
          node_modules/react-native-worklets/android/build
          node_modules/react-native-nitro-modules/android/build
        key: ${{ runner.os }}-android-native-${{ inputs.build-type }}-${{ inputs.cache-key-suffix }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-android-native-${{ inputs.build-type }}-${{ inputs.cache-key-suffix }}-
          ${{ runner.os }}-android-native-${{ inputs.build-type }}-

    - name: "📦 Cache Metro Bundler"
      if: inputs.cache-native-builds == 'true'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: |
          /tmp/metro-*
          /tmp/haste-map-*
        key: ${{ runner.os }}-metro-${{ inputs.cache-key-suffix }}-${{ hashFiles('pnpm-lock.yaml', 'apps/app/metro.config.js') }}
        restore-keys: |
          ${{ runner.os }}-metro-${{ inputs.cache-key-suffix }}-
          ${{ runner.os }}-metro-

    - name: "🏗️ Build Android APK"
      id: build
      shell: bash
      run: |
        cd apps/app/android
        chmod +x gradlew

        BUILD_TYPE="${{ inputs.build-type }}"

        # GRADLE_USER_HOME defaults to $HOME/.gradle so the AMI pre-baked
        # wrapper dist (terraform/runners/packer/runner-ami.pkr.hcl) and the
        # actions/cache layers above are actually used. A previous version of
        # this action pinned GRADLE_USER_HOME to $RUNNER_TEMP/gradle to avoid
        # gradle.properties duplication, but RUNNER_TEMP is ephemeral and the
        # override silently defeated every cross-job Gradle cache (LS-4933).
        # The gradle.properties writes below use `>` (truncate) so a shared
        # GRADLE_USER_HOME does not accumulate duplicate entries.

        # --- Memory hardening ---
        # 1. Override org.gradle.jvmargs in the project gradle.properties directly.
        #    Expo prebuild regenerates android/ each run so this never persists to repo.
        #    Belt-and-suspenders: also write $HOME/.gradle/gradle.properties (truncate).
        if grep -q '^org\.gradle\.jvmargs=' gradle.properties; then
          sed -i 's|^org\.gradle\.jvmargs=.*|org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g|' gradle.properties
        else
          printf '\norg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g\n' >> gradle.properties
        fi
        EFFECTIVE_JVMARGS="$(grep -m1 '^org\.gradle\.jvmargs=' gradle.properties || true)"
        if [ -z "$EFFECTIVE_JVMARGS" ]; then
          echo "❌ Failed to configure org.gradle.jvmargs in gradle.properties"
          exit 1
        fi
        echo "ℹ️  Effective jvmargs: $EFFECTIVE_JVMARGS"
        mkdir -p "$HOME/.gradle"
        printf 'org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g\n' > "$HOME/.gradle/gradle.properties"

        # 2. Limit parallel C++ jobs per CMake invocation.
        #    Ninja defaults to nCPU parallel clang++ processes.
        export CMAKE_BUILD_PARALLEL_LEVEL=2

        # 3. Log memory every 30s so we can see what's consuming RAM if it OOMs.
        (while true; do
          free -m | awk '/^Mem:/{printf "[mem] used=%sMB free=%sMB\n", $3, $4}'
          sleep 30
        done) &
        MEM_MONITOR_PID=$!
        trap "kill $MEM_MONITOR_PID 2>/dev/null || true" EXIT

        # Memory budget on 8GB runner:
        #   Gradle daemon JVM:  2GB heap + up to 1GB metaspace = ~3GB (jvmargs above)
        #   Node/Metro:         2GB (NODE_OPTIONS in workflow)
        #   Native clang++:    ~2 clang++ × 400MB ≈ 800MB (sequential --no-parallel)
        #   OS + other:        ~500MB
        #   Total:             ~6.3GB ✅

        # Shared Gradle flags — single source of truth for all Android builds
        # --no-parallel: prevents same-project ABI tasks running concurrently,
        #   which was causing ~4 simultaneous clang++ compilations even with --max-workers=2.
        # --warning-mode=all: enumerate each Gradle deprecation (incl. Gradle 10
        #   incompatibilities) by source location instead of the default summary
        #   line. Cheap visibility for future upgrade work.
        GRADLE_FLAGS="--no-daemon --stacktrace --no-parallel --max-workers=1 --build-cache --warning-mode=all"

        # ABI filtering — Reanimated v4 C++ worklet compilation is expensive
        # Debug:   arm64-v8a only (single ABI, fast iteration)
        # Release: arm64-v8a (99%+ devices) + x86_64 (emulators/ChromeOS)
        if [ "$BUILD_TYPE" = "release" ]; then
          ABI_FLAG="-PreactNativeArchitectures=arm64-v8a,x86_64"
        else
          ABI_FLAG="-PreactNativeArchitectures=arm64-v8a"
        fi

        echo "🏗️ Starting Android $BUILD_TYPE build at $(date)"
        echo "   Gradle flags: $GRADLE_FLAGS $ABI_FLAG ${{ inputs.extra-gradle-flags }}"
        BUILD_START=$(date +%s)

        if [ "$BUILD_TYPE" = "release" ]; then
          ${{ inputs.gradle-executable }} assembleRelease $GRADLE_FLAGS $ABI_FLAG ${{ inputs.extra-gradle-flags }}
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
        else
          ${{ inputs.gradle-executable }} assembleDebug $GRADLE_FLAGS $ABI_FLAG ${{ inputs.extra-gradle-flags }}
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
        fi

        BUILD_END=$(date +%s)
        BUILD_TIME=$((BUILD_END - BUILD_START))

        if [ ! -f "$APK_PATH" ]; then
          echo "❌ APK not found at $APK_PATH"
          exit 1
        fi

        APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
        echo "✅ APK built successfully: $APK_SIZE in ${BUILD_TIME}s"

        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
        echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT

    - name: "🧪 APK Validation"
      if: success()
      shell: bash
      run: |
        cd apps/app/android
        APK_PATH="${{ steps.build.outputs.apk_path }}"

        echo "🔍 Validating APK structure..."
        if command -v aapt >/dev/null 2>&1; then
          aapt dump badging "$APK_PATH" | head -5
          echo "✅ APK validation passed"
        else
          # Fallback: verify it's a valid ZIP (APK is a ZIP)
          if file "$APK_PATH" | grep -q "Zip archive\|Java archive"; then
            echo "✅ APK is a valid archive"
          else
            echo "⚠️ APK structure could not be verified"
          fi
        fi

    - name: "📊 Build Summary"
      if: always()
      shell: bash
      run: |
        echo "## 🤖 Android Build (${{ inputs.build-type }})" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Type**: ${{ inputs.build-type }}" >> $GITHUB_STEP_SUMMARY

        APK_SIZE="${{ steps.build.outputs.apk_size }}"
        BUILD_TIME="${{ steps.build.outputs.build_time }}"

        if [ -n "$APK_SIZE" ]; then
          echo "- **APK Size**: $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Time**: ${BUILD_TIME}s" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **Status**: ❌ Failed" >> $GITHUB_STEP_SUMMARY
        fi
