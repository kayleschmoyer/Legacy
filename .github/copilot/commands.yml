# Command Reference for AI Agents
# Use this for quick command lookup without loading full documentation

validation:
  typecheck: "pnpm exec nx affected -t typecheck"
  lint: "pnpm exec nx affected -t lint --fix"
  test: "pnpm exec nx affected -t test"
  build: "pnpm exec nx affected -t build"
  quick: "make quick-check"
  full: "make pre-commit"

workflow:
  branch_from_main: "git checkout main && git pull && twig switch LS-{ticket}"
  branch_from_current: "twig switch LS-{ticket} -p current"
  view_tree: "twig tree"
  rebase_tree: "make rebase-tree"
  commit: "git add . && git commit -m '{message}' && git push origin HEAD"
  create_pr: "twig github pr create-pr"

jira:
  view: "acli jira workitem view LS-{ticket}"
  start: "acli jira workitem transition --key LS-{ticket} --status 'In Progress'"
  review: "acli jira workitem transition --key LS-{ticket} --status 'In Review'"
  done: "acli jira workitem transition --key LS-{ticket} --status 'Done'"
  refresh_path: "$env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')"

nx_patterns:
  affected: "pnpm exec nx affected -t {target}"
  specific_project: "pnpm exec nx run {project}:{target}"
  by_tag: "pnpm exec nx run-many -t {target} --projects=tag:scope:{tag}"
  graph: "pnpm exec nx graph"
  reset: "pnpm exec nx reset"

troubleshooting:
  rebuild_libs: "pnpm run build:libs"
  sync_env: "pnpm run sync-env"
  kill_port: "pnpm dlx kill-port {port}"
  clean_nx: "pnpm exec nx reset"
  clean_deps: "rm -rf node_modules && pnpm install"

environment:
  platform: "Windows PowerShell"
  monorepo: "Nx workspace"
  package_manager: "pnpm v9.12.1"
  jira_project: "LS"
  branch_tool: "Twig"
