version: 2
updates:
  # NPM dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    commit-message:
      prefix: "chore"
      include: "scope"
    reviewers:
      - "bkrupa"
    assignees:
      - "bkrupa"
    open-pull-requests-limit: 3
    # Reduce frequency for major updates to avoid peer dependency conflicts
    target-branch: "main"

    # Ignore problematic major version updates that commonly cause peer dependency conflicts
    ignore:
      # TypeScript ESLint ecosystem - major updates often break peer dependencies
      - dependency-name: "@typescript-eslint/eslint-plugin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/parser"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

      # React ecosystem - major updates require careful coordination
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major"]

      # NX ecosystem - all major bumps are batched via the nx-ecosystem group
      # below (which includes major in its update-types) so all nx + @nx/* +
      # @nrwl/* packages move together in one PR. Do NOT add individual nx
      # major ignore rules here — ignore takes precedence over groups and
      # would suppress the batched PR entirely (see PR #2284 for context).

      # Jest ecosystem - major updates can break testing setup
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]

      # Expo - major updates require careful React Native version coordination
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]

      # Metro ecosystem - pinned for Expo SDK 53 / React Native 0.79.6 compatibility
      # These versions are specifically pinned to prevent TerminalReporter export conflicts
      - dependency-name: "metro"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "metro-config"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/metro-config"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/cli"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native/metro-config"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

      # Storybook - major updates often require migration
      - dependency-name: "@storybook/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@storybook/react-vite"
        update-types: ["version-update:semver-major"]
    groups:
      # TypeScript ESLint ecosystem - keep these together to avoid peer dependency conflicts
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "eslint-config-*"
        update-types:
          - "minor"
          - "patch"

      # React ecosystem - critical to keep versions aligned
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "react-router*"
        update-types:
          - "minor"
          - "patch"

      # React Native ecosystem - very sensitive to version mismatches
      # Metro dependencies are specifically ignored above to maintain compatibility
      react-native-ecosystem:
        patterns:
          - "react-native"
          - "@react-native*"
          - "@react-native-community/*"
          - "react-native-*"
          - "expo*"
          - "@expo/*"
          # Note: metro* patterns are kept for other metro packages not specifically pinned
        update-types:
          - "patch"

      # NX ecosystem - keep ALL NX packages together including major bumps.
      # Major Nx version upgrades require all nx + @nx/* + @nrwl/* packages to
      # move in lockstep (see PR #2284 where a solo @nx/jest major bump pulled
      # in nx@22 as a transitive dep alongside nx@21, breaking the workspace).
      nx-ecosystem:
        patterns:
          - "nx"
          - "@nx/*"
          - "@nrwl/*"
        update-types:
          - "major"
          - "minor"
          - "patch"

      # Jest ecosystem
      jest-ecosystem:
        patterns:
          - "jest"
          - "@jest/*"
          - "jest-*"
          - "@types/jest"
        update-types:
          - "minor"
          - "patch"

      # Apollo GraphQL ecosystem
      apollo-ecosystem:
        patterns:
          - "@apollo/*"
          - "graphql"
          - "@graphql-*"
          - "graphile*"
          - "postgraphile"
          - "grafast"
          - "grafserv"
        update-types:
          - "minor"
          - "patch"

      # Storybook ecosystem
      storybook-ecosystem:
        patterns:
          - "@storybook/*"
          - "storybook"
        update-types:
          - "minor"
          - "patch"

      # Tamagui ecosystem
      tamagui-ecosystem:
        patterns:
          - "tamagui"
          - "@tamagui/*"
        update-types:
          - "patch"

      # AWS SDK ecosystem
      aws-ecosystem:
        patterns:
          - "@aws-sdk/*"
          - "aws-*"
        update-types:
          - "minor"
          - "patch"

      # Playwright — must bump @playwright/test and playwright in lockstep so the
      # CI runner-ami-drift-check workflow can find a single resolved
      # playwright-core version matching the Packer AMI. Versions are exact-pinned
      # in package.json (no caret) to prevent silent drift during ad-hoc
      # `pnpm install --no-frozen-lockfile` runs — dependabot still drives
      # intentional bumps by rewriting the pin. See LS-2429.
      playwright-ecosystem:
        patterns:
          - "@playwright/test"
          - "playwright"
        update-types:
          - "minor"
          - "patch"

      # Development tools and types (safer to update)
      dev-tools:
        patterns:
          - "@types/*"
          - "prettier"
          - "typescript"
          - "rimraf"
          - "npkill"
          - "@swc*"
          - "esbuild"
          - "vite*"
          - "@vitejs/*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions - separate schedule to avoid conflicts
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    commit-message:
      prefix: "ci"
      include: "scope"
    reviewers:
      - "bkrupa"
    assignees:
      - "bkrupa"
    open-pull-requests-limit: 2
    groups:
      all-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker - least frequent updates
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    commit-message:
      prefix: "docker"
      include: "scope"
    reviewers:
      - "bkrupa"
    assignees:
      - "bkrupa"
    open-pull-requests-limit: 1
