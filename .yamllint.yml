---
# yamllint configuration for Legacy Sports
# GitHub Actions workflow files have inherently long lines and markdown bodies
# with intentional trailing spaces — relax those rules accordingly.
extends: default

rules:
  line-length:
    max: 200
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on", "off", "yes", "no"]
  comments:
    min-spaces-from-content: 1
  trailing-spaces: disable
