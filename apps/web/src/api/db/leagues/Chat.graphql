query GetLeagueChatMessages($leagueId: Int!, $limit: Int) {
  getLeagueMessages(leagueId: $leagueId, limit: $limit) {
    id
    userId
    messageText
    timestamp
    messageType
    gifUrl
    metadata
    sender {
      username
    }
  }
}

mutation SendLeagueChatMessage(
  $leagueId: Int!
  $messageText: String!
  $gifUrl: String
) {
  sendLeagueMessage(
    leagueId: $leagueId
    messageText: $messageText
    gifUrl: $gifUrl
  ) {
    id
    userId
    messageText
    timestamp
    messageType
    gifUrl
    metadata
    sender {
      username
    }
  }
}
