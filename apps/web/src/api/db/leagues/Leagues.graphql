fragment League on League {
  id
  name
  owner
  maxRosterSize
  currentMatchup
  currentWeekNumber
  draftStatus
  inviteCode
  playerPool
  weekAdvanceStatus
  waiverType
  waiverEnabled
  faabBudgetDefault
  spStartsPerMatchup
  gamesPerMatchup
  minCareerGames
  minCareerSeasons
  totalMatchups
  playoffEnabled
  playoffFormat
  playoffMultiWeek
  lmNotes
  isMockDraft
  isPublic
  logoUrl
  bannerUrl
  primaryColor
  secondaryColor
  userMembership {
    ...LeagueMember
  }
  # teams field not available in deployed schema - needs Lambda deployment
  # teams {
  #   id
  #   name
  #   leagueId
  # }
}

fragment LeagueMember on LeagueMember {
  leagueId
  userId
  teamId
  permissionLevel
}

fragment LeaguePosition on LeaguePosition {
  id
  leagueId
  positionType
}

query GetLeagueById($id: Int!) {
  league(id: $id) {
    ...League
  }
}

mutation CreateLeagueAndTeams($input: CreateLeagueAndTeamsInput!) {
  createLeagueAndTeams(input: $input) {
    league {
      ...League
    }
  }
}

query GetUserLeagues {
  userLeagues {
    ...League
  }
}

query GetPositionsForLeague($leagueId: Int!) {
  leaguePositions(leagueId: $leagueId) {
    ...LeaguePosition
  }
}

mutation DeleteAllLeagues {
  deleteAllLeagues
}

mutation DeleteLeague($leagueId: Int!) {
  deleteLeague(leagueId: $leagueId)
}

mutation StartDraft($leagueId: Int!, $selectionMethod: String) {
  startDraft(leagueId: $leagueId, selectionMethod: $selectionMethod) {
    ...League
  }
}

mutation InitializeDraft(
  $leagueId: Int!
  $draftOrder: String
  $draftMode: String
  $selectionMethod: String
) {
  initializeDraft(
    leagueId: $leagueId
    draftOrder: $draftOrder
    draftMode: $draftMode
    selectionMethod: $selectionMethod
  ) {
    id
    leagueId
    draftMode
    selectionMethod
    draftOrder
    currentPick
    pickTimeLimitSeconds
    currentPickDeadline
    draftStartedAt
    draftCompletedAt
  }
}

mutation JoinLeagueByCode($inviteCode: String!, $teamName: String!) {
  joinLeagueByCode(inviteCode: $inviteCode, teamName: $teamName) {
    id
    name
    leagueId
  }
}

query ValidateInviteCode($code: String!) {
  validateInviteCode(code: $code) {
    leagueName
    totalSpots
    availableSpots
    isFull
  }
}

query GetLeagueTeams($leagueId: Int!) {
  leagueTeams(leagueId: $leagueId) {
    id
    name
    leagueId
    waiverOrder
    faabBudget
    isLocked
    logoUrl
    primaryColor
    secondaryColor
    avatarUrl
    bannerUrl
  }
}

query GetLeagueDraft($leagueId: Int!) {
  getLeagueDraft(leagueId: $leagueId) {
    id
    leagueId
    draftMode
    selectionMethod
    draftOrder
    currentPick
    draftStartedAt
    draftCompletedAt
    scheduledAt
  }
}

mutation UpdateDraftSettings($input: UpdateDraftSettingsInput!) {
  updateDraftSettings(input: $input) {
    id
    leagueId
    draftMode
    selectionMethod
    draftOrder
    currentPick
    playerPool
    draftStartedAt
    draftCompletedAt
    scheduledAt
  }
}

mutation RenameTeam($teamId: Int!, $leagueId: Int!, $newName: String!) {
  renameTeam(teamId: $teamId, leagueId: $leagueId, newName: $newName) {
    id
    name
    leagueId
  }
}

mutation UpdateLeagueSettings($input: UpdateLeagueSettingsInput!) {
  updateLeagueSettings(input: $input) {
    ...League
  }
}

# ── Public League Discovery ──────────────────────────────────────────────

query GetPublicLeagues(
  $search: String
  $draftStatus: String
  $playerPool: String
  $limit: Int
  $offset: Int
) {
  publicLeagues(
    search: $search
    draftStatus: $draftStatus
    playerPool: $playerPool
    limit: $limit
    offset: $offset
  ) {
    id
    name
    owner
    maxRosterSize
    draftStatus
    playerPool
    isPublic
    totalSpots
    availableSpots
    isFull
    isAlreadyMember
  }
}

mutation JoinPublicLeague($leagueId: Int!, $teamName: String!) {
  joinPublicLeague(leagueId: $leagueId, teamName: $teamName) {
    success
    message
    leagueId
    teamId
  }
}
