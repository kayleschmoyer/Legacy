fragment PlayoffBracket on PlayoffBracket {
  id
  leagueId
  season
  format
  startWeek
  endWeek
  championTeamId
  status
  createdAt
  updatedAt
  championTeam {
    id
    name
  }
  matchups {
    ...PlayoffMatchup
  }
}

fragment PlayoffMatchup on PlayoffMatchup {
  id
  bracketId
  round
  matchupNumber
  highSeedTeamId
  lowSeedTeamId
  winnerTeamId
  highSeedScore
  lowSeedScore
  weekNumber
  status
  isMultiWeek
  highSeedTeam {
    id
    name
  }
  lowSeedTeam {
    id
    name
  }
  winnerTeam {
    id
    name
  }
}

fragment PlayoffSeed on PlayoffSeed {
  id
  bracketId
  teamId
  seedNumber
  regularSeasonWins
  regularSeasonLosses
  pointsFor
  team {
    id
    name
  }
}

query GetPlayoffBracket($leagueId: Int!, $season: Int) {
  getPlayoffBracket(leagueId: $leagueId, season: $season) {
    ...PlayoffBracket
  }
}

query GetPlayoffSeeds($bracketId: Int!) {
  getPlayoffSeeds(bracketId: $bracketId) {
    ...PlayoffSeed
  }
}
