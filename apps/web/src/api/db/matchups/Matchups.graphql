fragment Matchup on Matchup {
  id
  weekNumber
  leagueId
  team1Id
  team2Id
  team1Score
  team2Score
  status
  statsLoadingStatus
  selectedSeason
  gamesPerMatchup
  startTime
  endTime
}

query GetMatchupById($id: Int!) {
  getMatchupById(id: $id) {
    ...Matchup
  }
}

query GetMatchupsForLeague($leagueId: Int!, $weekNumber: Int) {
  getMatchupsForLeague(leagueId: $leagueId, weekNumber: $weekNumber) {
    ...Matchup
  }
}

query GetCurrentMatchupForLeague($leagueId: Int!) {
  getCurrentMatchupForLeague(leagueId: $leagueId) {
    ...Matchup
  }
}

query GetMatchupsByWeek($leagueId: Int!, $weekNumber: Int!) {
  getMatchupsByWeek(leagueId: $leagueId, weekNumber: $weekNumber) {
    ...Matchup
  }
}

query GetLeagueStandings($leagueId: Int!) {
  getLeagueStandings(leagueId: $leagueId) {
    teamId
    teamName
    wins
    losses
    ties
    winPercentage
    pointsFor
    pointsAgainst
  }
}

query GetMatchupHistory(
  $leagueId: Int!
  $season: Int
  $teamId: Int
  $status: MatchupStatus
  $limit: Int
) {
  getMatchupHistory(
    leagueId: $leagueId
    season: $season
    teamId: $teamId
    status: $status
    limit: $limit
  ) {
    ...Matchup
  }
}

fragment MatchupPlayerGame on MatchupPlayerGame {
  id
  matchupPlayerId
  gameNum
  battingGameNum
  fieldingGameNum
  pitchingGameNum
  fieldingGamePos
  # NOTE: Score fields removed - frontend calculates using @legacy-sports/scoring
  battingStats {
    playerId
    season
    gameNum
    plateAppearances
    atBats
    runs
    hits
    doubles
    triples
    homeRuns
    rbi
    stolenBases
    caughtStealing
    baseOnBalls
    strikeouts
    groundedIntoDoublePlays
    hitByPitch
    sacrificeHits
    intentionalBaseOnBalls
    battingAverage
  }
  pitchingStats {
    playerId
    season
    gameNum
    wins
    losses
    gamesStarted
    gamesFinished
    completeGames
    shutouts
    saves
    inningsPitched
    hits
    runs
    earnedRuns
    homeRuns
    baseOnBalls
    intentionalBaseOnBalls
    strikeouts
    hitByPitch
    battersFaced
    outsRecorded
    era
  }
  fieldingStats {
    playerId
    season
    gameNum
    position
    games
    gamesStarted
    inningsPlayed
    putouts
    assists
    errors
    doublePlays
    passedBalls
    stolenBasesAllowed
    caughtStealing
    fieldingPercentage
  }
}

fragment MatchupPlayer on MatchupPlayer {
  id
  matchupId
  playerId
  season
  teamId
  positionId
  player {
    id
    firstName
    lastName
    brefId
  }
  games {
    ...MatchupPlayerGame
  }
  seasonBatting {
    playerId
    season
    games
    plateAppearances
    atBats
    runs
    hits
    doubles
    triples
    homeRuns
    rbi
    stolenBases
    caughtStealing
    baseOnBalls
    strikeouts
    groundedIntoDoublePlays
    hitByPitch
    sacrificeHits
    intentionalBaseOnBalls
  }
  seasonPitching {
    playerId
    season
    games
    wins
    losses
    gamesStarted
    gamesFinished
    completeGames
    shutouts
    saves
    inningsPitched
    hits
    runs
    earnedRuns
    homeRuns
    baseOnBalls
    intentionalBaseOnBalls
    strikeouts
    hitByPitch
    battersFaced
    outsRecorded
  }
  seasonFielding {
    playerId
    season
    games
    inningsDefended
    chances
    putouts
    assists
    errors
    doublePlays
  }
}

query GetMatchupPlayers($matchupId: Int!) {
  getMatchupPlayers(matchupId: $matchupId) {
    ...MatchupPlayer
  }
}

mutation AdvanceLeagueWeek($leagueId: Int!) {
  advanceLeagueWeek(leagueId: $leagueId) {
    ...Matchup
  }
}

# Season stats for projection calculations
query GetPlayerSeasonStats($playerId: Int!, $season: Int!) {
  playerSeasonBatting(playerId: $playerId, season: $season) {
    playerId
    season
    games
    plateAppearances
    atBats
    runs
    hits
    doubles
    triples
    homeRuns
    rbi
    stolenBases
    caughtStealing
    baseOnBalls
    strikeouts
    groundedIntoDoublePlays
    hitByPitch
    sacrificeHits
    intentionalBaseOnBalls
  }
  playerSeasonPitching(playerId: $playerId, season: $season) {
    playerId
    season
    games
    wins
    losses
    gamesStarted
    gamesFinished
    completeGames
    shutouts
    saves
    inningsPitched
    hits
    runs
    earnedRuns
    homeRuns
    baseOnBalls
    intentionalBaseOnBalls
    strikeouts
    hitByPitch
    battersFaced
    outsRecorded
  }
  playerSeasonFielding(playerId: $playerId, season: $season) {
    playerId
    season
    games
    inningsDefended
    chances
    putouts
    assists
    errors
    doublePlays
  }
}

# Query to fetch ALL season stats for a player (batting, pitching, fielding) across all seasons
query GetAllPlayerSeasonStats($playerId: Int!) {
  playerSeasonBatting(playerId: $playerId) {
    season
    team
    games
    plateAppearances
    atBats
    runs
    hits
    doubles
    triples
    homeRuns
    rbi
    stolenBases
    caughtStealing
    baseOnBalls
    strikeouts
    battingAverage
    onBasePercentage
    sluggingPercentage
  }
  playerSeasonPitching(playerId: $playerId) {
    season
    team
    games
    wins
    losses
    gamesStarted
    completeGames
    shutouts
    saves
    inningsPitched
    hits
    runs
    earnedRuns
    homeRuns
    baseOnBalls
    strikeouts
    earnedRunAverage
    whip
  }
  playerSeasonFielding(playerId: $playerId) {
    season
    team
    position
    games
    gamesStarted
    inningsDefended
    putouts
    assists
    errors
    doublePlays
    fieldingPercentage
  }
}

mutation TriggerGameSelection($matchupId: Int!, $weekNumber: Int!) {
  triggerGameSelection(matchupId: $matchupId, weekNumber: $weekNumber)
}

mutation AdvanceWeekGames($leagueId: Int!, $weekNumber: Int!) {
  advanceWeekGames(leagueId: $leagueId, weekNumber: $weekNumber)
}
