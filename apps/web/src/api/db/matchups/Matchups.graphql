fragment Matchup on Matchup {
  id
  weekNumber
  leagueId
  team1Id
  team2Id
  team1Score
  team2Score
  status
  statsLoadingStatus
  gamesPerMatchup
  spStartsPerMatchup
  selectedGamesCount
  startTime
  endTime
}

query GetMatchupById($id: Int!) {
  getMatchupById(id: $id) {
    ...Matchup
  }
}

query GetMatchupsForLeague($leagueId: Int!, $weekNumber: Int) {
  getMatchupsForLeague(leagueId: $leagueId, weekNumber: $weekNumber) {
    ...Matchup
  }
}

query GetCurrentMatchupForLeague($leagueId: Int!) {
  getCurrentMatchupForLeague(leagueId: $leagueId) {
    ...Matchup
  }
}

query GetMatchupsByWeek($leagueId: Int!, $weekNumber: Int!) {
  getMatchupsByWeek(leagueId: $leagueId, weekNumber: $weekNumber) {
    ...Matchup
  }
}

query GetLeagueStandings($leagueId: Int!) {
  getLeagueStandings(leagueId: $leagueId) {
    teamId
    teamName
    wins
    losses
    ties
    winPercentage
    pointsFor
    pointsAgainst
  }
}

query GetMatchupHistory(
  $leagueId: Int!
  $season: Int
  $teamId: Int
  $status: MatchupStatus
  $limit: Int
) {
  getMatchupHistory(
    leagueId: $leagueId
    season: $season
    teamId: $teamId
    status: $status
    limit: $limit
  ) {
    ...Matchup
  }
}

fragment MatchupPlayer on MatchupPlayer {
  id
  matchupId
  playerId
  teamId
  positionId
  season
  numberOfGames
  player {
    id
    firstName
    lastName
    brefId
    eligiblePositions
  }
  seasonBatting {
    games
    plateAppearances
    atBats
    runs
    hits
    doubles
    triples
    homeRuns
    rbi
    stolenBases
    caughtStealing
    baseOnBalls
    strikeouts
    groundedIntoDoublePlays
    hitByPitch
    sacrificeHits
    intentionalBaseOnBalls
    battingAverage
    onBasePercentage
    sluggingPercentage
  }
  seasonPitching {
    wins
    losses
    winLossPercentage
    earnedRunAverage
    games
    gamesStarted
    gamesFinished
    completeGames
    shutouts
    saves
    inningsPitched
    hits
    runs
    earnedRuns
    homeRuns
    baseOnBalls
    intentionalBaseOnBalls
    strikeouts
    hitByPitch
    balks
    wildPitches
    battersFaced
    outsRecorded
  }
  seasonFielding {
    games
    gamesStarted
    inningsDefended
    chances
    putouts
    assists
    errors
    doublePlays
    fieldingPercentage
  }
  games {
    id
    matchupPlayerId
    gameNum
    gameIdentifier
    fieldingGamePos
    statsLoadingStatus
    spSkipped
    battingGame {
      playerId
      season
      gameNum
      gameIdentifier
      plateAppearances
      atBats
      runs
      hits
      doubles
      triples
      homeRuns
      rbi
      stolenBases
      caughtStealing
      baseOnBalls
      strikeouts
      groundedIntoDoublePlays
      hitByPitch
      sacrificeHits
      sacrificeFlies
      intentionalBaseOnBalls
      battingAverage
    }
    pitchingGame {
      playerId
      season
      gameNum
      gameIdentifier
      wins
      losses
      gamesStarted
      gamesFinished
      completeGames
      shutouts
      saves
      inningsPitched
      hits
      runs
      earnedRuns
      homeRuns
      baseOnBalls
      intentionalBaseOnBalls
      strikeouts
      hitByPitch
      battersFaced
      outsRecorded
      era
    }
    fieldingGame {
      playerId
      season
      gameNum
      gameIdentifier
      position
      games
      gamesStarted
      inningsPlayed
      putouts
      assists
      errors
      doublePlays
      passedBalls
      stolenBasesAllowed
      caughtStealing
      fieldingPercentage
    }
  }
}

query GetMatchupPlayers($matchupId: Int!) {
  getMatchupPlayers(matchupId: $matchupId) {
    ...MatchupPlayer
  }
}

mutation TriggerGameSelection($matchupId: Int!, $gameNumber: Int!) {
  triggerGameSelection(matchupId: $matchupId, gameNumber: $gameNumber)
}

mutation AdvanceLeagueWeek($leagueId: Int!) {
  advanceLeagueWeek(leagueId: $leagueId) {
    matchups {
      ...Matchup
    }
    currentMatchupId
  }
}

query GetMatchupRoster($matchupId: Int!, $teamId: Int!) {
  getMatchupRoster(matchupId: $matchupId, teamId: $teamId) {
    ...MatchupPlayer
  }
}

query GetTeamMatchupHistory($leagueId: Int!, $teamId: Int!, $limit: Int) {
  getTeamMatchupHistory(leagueId: $leagueId, teamId: $teamId, limit: $limit) {
    ...Matchup
  }
}

mutation UpdateMatchupPlayerPosition($matchupPlayerId: Int!, $positionId: Int) {
  updateMatchupPlayerPosition(
    matchupPlayerId: $matchupPlayerId
    positionId: $positionId
  ) {
    ...MatchupPlayer
  }
}

mutation SwapMatchupPlayerPositions(
  $matchupPlayerIdA: Int!
  $positionIdA: Int
  $matchupPlayerIdB: Int!
  $positionIdB: Int
) {
  swapMatchupPlayerPositions(
    matchupPlayerIdA: $matchupPlayerIdA
    positionIdA: $positionIdA
    matchupPlayerIdB: $matchupPlayerIdB
    positionIdB: $positionIdB
  ) {
    ...MatchupPlayer
  }
}
