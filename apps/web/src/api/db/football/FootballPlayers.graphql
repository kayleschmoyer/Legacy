fragment FootballPlayerHeader on FootballPlayer {
  id
  firstName
  lastName
  position
  isDst
  nflTeam
  pfrId
  headshotUrl
  previousTeams
  careerStats {
    passing {
      yds
      td
      int
      rating
    }
    rushing {
      yds
      td
    }
    receiving {
      rec
      yds
      td
    }
    kicking {
      fgm
      fga
      fgPct
    }
    defense {
      sacks
      int
      ptsAllowedPerG
    }
    idp {
      soloTkl
      astTkl
      sacks
      int
      ff
    }
  }
}

fragment FootballPlayerDetailExtras on FootballPlayer {
  careerStats {
    defense {
      g
      fumRec
      defTd
      ydsAllowedPerG
    }
  }
  seasonStats {
    passing {
      season
      team
      g
      cmp
      att
      yds
      td
      int
      rating
    }
    rushing {
      season
      team
      g
      att
      yds
      td
      ydsPerAtt
    }
    receiving {
      season
      team
      g
      tgt
      rec
      yds
      td
      ydsPerRec
    }
    defense {
      season
      team
      g
      sacks
      int
      fumRec
      defTd
      ptsAllowed
    }
  }
}

query FootballPlayers(
  $position: String
  $nflTeam: String
  $search: String
  $after: String
) {
  footballPlayers(
    position: $position
    nflTeam: $nflTeam
    search: $search
    after: $after
  ) {
    nodes {
      ...FootballPlayerHeader
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query FootballPlayer($id: Int!) {
  footballPlayer(id: $id) {
    ...FootballPlayerHeader
    ...FootballPlayerDetailExtras
  }
}
