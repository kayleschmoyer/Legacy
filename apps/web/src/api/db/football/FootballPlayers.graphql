query FootballPlayers(
  $position: String
  $nflTeam: String
  $search: String
  $after: String
) {
  footballPlayers(
    position: $position
    nflTeam: $nflTeam
    search: $search
    after: $after
  ) {
    nodes {
      id
      firstName
      lastName
      position
      isDst
      nflTeam
      pfrId
      careerStats {
        passing {
          yds
          td
          int
          rating
        }
        rushing {
          yds
          td
        }
        receiving {
          rec
          yds
          td
        }
        kicking {
          fgm
          fga
        }
        defense {
          sacks
          int
          ptsAllowedPerG
        }
        idp {
          soloTkl
          astTkl
          sacks
          int
          ff
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query FootballPlayer($id: Int!) {
  footballPlayer(id: $id) {
    id
    firstName
    lastName
    position
    isDst
    nflTeam
    pfrId
    careerStats {
      passing {
        yds
        td
        int
        rating
      }
      rushing {
        yds
        td
      }
      receiving {
        rec
        yds
        td
      }
      kicking {
        fgm
        fga
      }
      defense {
        sacks
        int
        ptsAllowedPerG
      }
      idp {
        soloTkl
        astTkl
        sacks
        int
        ff
      }
    }
    seasonStats {
      passing {
        season
        team
        g
        cmp
        att
        yds
        td
        int
        rating
      }
      rushing {
        season
        team
        g
        att
        yds
        td
        ydsPerAtt
      }
      receiving {
        season
        team
        g
        tgt
        rec
        yds
        td
        ydsPerRec
      }
    }
  }
}
