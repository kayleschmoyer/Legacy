<!doctype html>
<html>
  <head>
    <title>OAuth Callback</title>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 50px;
        color: #333;
      }
      .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .error {
        color: #e74c3c;
      }
    </style>
  </head>
  <body>
    <h2>Processing OAuth Login...</h2>
    <div class="spinner"></div>
    <p id="status">Completing authentication...</p>

    <script>
      function handleOAuthCallback() {
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const code = urlParams.get('code');
          const error = urlParams.get('error');
          const errorDescription = urlParams.get('error_description');

          if (error) {
            document.getElementById('status').innerHTML =
              '<span class="error">Authentication failed: ' +
              (errorDescription || error) +
              '</span>';

            // Send error to parent window
            if (window.opener) {
              window.opener.postMessage(
                {
                  type: 'GOOGLE_OAUTH_ERROR',
                  error: error,
                  error_description: errorDescription,
                },
                window.location.origin,
              );
            }

            setTimeout(() => window.close(), 3000);
            return;
          }

          if (code) {
            document.getElementById('status').textContent =
              'Authentication successful! Closing window...';

            // Send authorization code to parent window
            if (window.opener) {
              window.opener.postMessage(
                {
                  type: 'GOOGLE_OAUTH_SUCCESS',
                  code: code,
                },
                window.location.origin,
              );
            }

            // Close the popup
            setTimeout(() => window.close(), 1000);
          } else {
            document.getElementById('status').innerHTML =
              '<span class="error">No authorization code received</span>';

            if (window.opener) {
              window.opener.postMessage(
                {
                  type: 'GOOGLE_OAUTH_ERROR',
                  error: 'no_code',
                  error_description: 'No authorization code received',
                },
                window.location.origin,
              );
            }

            setTimeout(() => window.close(), 3000);
          }
        } catch (e) {
          console.error('OAuth callback error:', e);
          document.getElementById('status').innerHTML =
            '<span class="error">Unexpected error: ' + e.message + '</span>';

          if (window.opener) {
            window.opener.postMessage(
              {
                type: 'GOOGLE_OAUTH_ERROR',
                error: 'callback_error',
                error_description: e.message,
              },
              window.location.origin,
            );
          }

          setTimeout(() => window.close(), 3000);
        }
      }

      // Execute when page loads
      window.addEventListener('load', handleOAuthCallback);
    </script>
  </body>
</html>
