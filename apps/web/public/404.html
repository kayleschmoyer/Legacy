<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Legacy Sports</title>
    <!--
      Single Page App routing for GitHub Pages.
      When GitHub Pages can't find a file it serves this 404.html.
      We encode the full path into a query-string redirect so the browser
      navigates to the root index.html, which then reconstructs the URL
      via the companion script below.

      Based on https://github.com/rafgraph/spa-github-pages
      segmentCount = 0 because we use a custom domain (no repo sub-path).
    -->
    <script>
      var segmentCount = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + segmentCount)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(segmentCount)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
