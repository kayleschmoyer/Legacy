    <!-- Editorial typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap"
      rel="stylesheet"
    />

    <!--
      Restore the full URL after a GitHub Pages 404 redirect.
      The 404.html encodes the original path into a query-string; this script
      reads it back and replaces the browser history entry with the real URL
      so React Router sees the intended route.
      See public/404.html for the other half of this mechanism.
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            });
          window.history.replaceState(
            null,
            null,
            decoded.shift() +
              (decoded.length ? '?' + decoded.join('&') : '') +
              l.hash,
          );
        }
      })(window.location);
    </script>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Google Analytics 4 - loaded dynamically in main.tsx if configured -->
  </head>
  <body>
