<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Legacy Sports</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Default metadata (overridden dynamically per-page by PageMeta component) -->
    <meta
      name="description"
      content="Legacy Sports — the fantasy baseball league manager built for serious fans. Create leagues, draft players, track stats, and compete with friends."
    />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Legacy Sports" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Legacy Sports | Fantasy Baseball League Manager"
    />
    <meta
      property="og:description"
      content="Legacy Sports — the fantasy baseball league manager built for serious fans. Create leagues, draft players, track stats, and compete with friends."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/logo-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Legacy Sports | Fantasy Baseball League Manager"
    />
    <meta
      name="twitter:description"
      content="Legacy Sports — the fantasy baseball league manager built for serious fans. Create leagues, draft players, track stats, and compete with friends."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/logo-512.png" />

    <!--
      LS-9529: there is deliberately no rel=icon link of type image/svg+xml
      here. The former favicon.svg was a 9.6 MB full-detail Inkscape export,
      and Chrome prefers an SVG icon over the .ico when both are declared — so
      it pulled all 9.6 MB on every cold navigation just to draw a 16x16 tab
      icon. SVGO bottoms out at ~1.35 MB even at lossy integer precision, so
      the 3 KB .ico below is the icon for every browser. Recover the vector
      source from git if it is ever needed:
        git show 48fb4b3df:apps/web/public/favicon.svg
      Do not write an example link tag in this comment — Vite's HTML parser
      lifts a literal tag out of a comment into the document head as a real
      element, which is how a href-less icon link first shipped here.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/styles.css" />

    <!-- Editorial typography (self-hosted woff2) -->
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <!--
      Restore the full URL after a GitHub Pages 404 redirect.
      The 404.html encodes the original path into a query-string; this script
      reads it back and replaces the browser history entry with the real URL
      so React Router sees the intended route.
      See public/404.html for the other half of this mechanism.
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            });
          window.history.replaceState(
            null,
            null,
            decoded.shift() +
              (decoded.length ? '?' + decoded.join('&') : '') +
              l.hash,
          );
        }
      })(window.location);
    </script>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Google Analytics 4 - loaded dynamically in main.tsx if configured -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
