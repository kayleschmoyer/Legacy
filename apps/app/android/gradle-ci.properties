# CI-specific Gradle properties for faster, more reliable builds
# Reduced memory usage for CI environment
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Disable parallel builds in CI to prevent resource conflicts
org.gradle.parallel=false
org.gradle.configureondemand=false

# Disable daemon in CI (prevents hanging processes)
org.gradle.daemon=false

# Use fewer workers in CI
org.gradle.workers.max=2

# AndroidX package structure
android.useAndroidX=true
android.enableJetifier=true

# Disable PNG crunching in CI builds for speed
android.enablePngCrunchInReleaseBuilds=false

# Single architecture for faster CI builds (can be overridden for release)
reactNativeArchitectures=arm64-v8a

# Disable new architecture for stability
newArchEnabled=false

# Use Hermes for better performance
hermesEnabled=true

# Expo settings
expo.gif.enabled=false
expo.webp.enabled=false
expo.webp.animated=false
EX_DEV_CLIENT_NETWORK_INSPECTOR=false
expo.useLegacyPackaging=true
expo.edgeToEdgeEnabled=false