# CI-specific Gradle properties for faster, more reliable builds
# Optimized memory usage for CI environment - increased for better performance
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -XX:+UseStringDeduplication -XX:+ParallelRefProcEnabled -XX:+UnlockExperimentalVMOptions -XX:+UseCGroupMemoryLimitForHeap

# Enable parallel builds and configure workers for CI optimization
org.gradle.parallel=true
org.gradle.configureondemand=true

# Disable daemon in CI (prevents hanging processes)
org.gradle.daemon=false

# CI build performance optimizations
# Configuration cache disabled due to external node processes in React Native
# org.gradle.configuration-cache=true  # Would be ideal but conflicts with RN setup

# Optimize workers for CI environment (GitHub Actions has 2 cores)
org.gradle.workers.max=4

# Enable build cache for faster incremental builds
org.gradle.caching=true
# android.enableBuildCache=true  # REMOVED: Deprecated in AGP 7.0+, superseded by org.gradle.caching

# Additional build caching optimizations for CI
# Configuration cache disabled due to external node processes in React Native
# org.gradle.configuration-cache=true  # Would be ideal but conflicts with RN setup

# Disable unnecessary features for CI
android.enableR8.fullMode=false
# android.enableSeparateAnnotationProcessing=true  # REMOVED: Deprecated in AGP 4.0+

# Console and logging optimizations for CI
org.gradle.console=plain
org.gradle.logging.level=lifecycle

# Network timeouts (increased for CI reliability)
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.network.retry.max.count=3

# File system watching - enable for better performance  
org.gradle.vfs.watch=true
org.gradle.vfs.verbose=false

# Warning handling for CI
org.gradle.warning.mode=summary

# AndroidX package structure
android.useAndroidX=true
android.enableJetifier=true

# Disable PNG crunching in CI builds for speed
android.enablePngCrunchInReleaseBuilds=false

# Single architecture for faster CI builds (can be overridden for release)
reactNativeArchitectures=arm64-v8a

# Disable new architecture for stability
newArchEnabled=false

# Use Hermes for better performance
hermesEnabled=true

# Additional CI optimizations
android.enableDesugaring=false
android.enableR8=true
android.enableR8.fullMode=false
android.enableProguardInReleaseBuilds=false
android.enableSeparateAnnotationProcessing=false

# Expo settings
expo.gif.enabled=false
expo.webp.enabled=false
expo.webp.animated=false
EX_DEV_CLIENT_NETWORK_INSPECTOR=false
expo.useLegacyPackaging=true
expo.edgeToEdgeEnabled=false
