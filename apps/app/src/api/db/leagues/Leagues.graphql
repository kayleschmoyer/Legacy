fragment League on League {
  id
  name
  owner
  currentMatchup
  leagueMembers @include(if: $withMembers) {
    nodes {
      ...LeagueMember
    }
  }
  matchupByCurrentMatchup @include(if: $withMatchup) {
    ...Matchup
  }
  teams @include(if: $withTeams) {
    nodes {
      ...Team
    }
  }
}

fragment LeagueMember on LeagueMember {
  leagueId
  permissionLevel
  teamId
  userId
  user {
    ...User
  }
}

fragment LeaguePosition on LeaguePosition {
  id
  leagueId
  positionType
}

query GetLeagueById(
  $id: Int!
  $withMembers: Boolean = false
  $withTeams: Boolean = false
  $withMatchup: Boolean = false
) {
  league(id: $id) {
    ...League
  }
}

mutation CreateLeague(
  $input: CreateLeagueAndTeamsInput!
  $withMembers: Boolean = false
  $withTeams: Boolean = false
  $withMatchup: Boolean = false
) {
  createLeagueAndTeams(input: $input) {
    league {
      ...League
    }
  }
}

query GetPositionsForLeague($leagueId: Int!) {
  leaguePositions(condition: { leagueId: $leagueId }) {
    nodes {
      ...LeaguePosition
    }
  }
}
