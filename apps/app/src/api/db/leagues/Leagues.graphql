fragment League on League {
  id
  name
  owner
}

fragment LeagueMember on LeagueMember {
  leagueId
  permissionLevel
  teamId
  userId
  user {
    ...User
  }
}

fragment LeaguesWithTeamsAndMembers on League {
  ...League
  leagueMembers {
    nodes {
      ...LeagueMember
    }
  }
  teams {
    nodes {
      ...Team
    }
  }
}

query GetLeagueById($id: Int!) {
  league(id: $id) {
    ...LeaguesWithTeamsAndMembers
  }
}

mutation CreateLeague($input: CreateLeagueAndTeamsInput!) {
  createLeagueAndTeams(input: $input) {
    league {
      ...LeaguesWithTeamsAndMembers
    }
  }
}
