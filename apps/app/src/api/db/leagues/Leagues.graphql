fragment AppLeague on League {
  id
  name
  owner
  maxRosterSize
  gamesPerMatchup
  currentMatchup
  currentWeekNumber
  draftStatus
  leaguePhase
  inviteCode
  lmNotes
  playerPool
  waiverEnabled
  waiverType
  weekAdvanceStatus
  sport
  defensiveFormat
  pitcherStartsPerMatchup
  minCareerGames
  minCareerSeasons
  totalMatchups
  playoffEnabled
  playoffFormat
  playoffMultiWeek
  salaryCapEnabled
  salaryCap
  eraFilter
  baseballHofOnly
  customEraStartYear
  customEraEndYear
  frozenAt
  seasonNumber
  logoUrl
  bannerUrl
  primaryColor
  secondaryColor
  userMembership {
    ...AppLeagueMember
  }
  # teams field not available in deployed schema - needs Lambda deployment
  # teams {
  #   id
  #   name
  #   leagueId
  # }
  # leagueMembers field not available
  # leagueMembers @include(if: $withMembers) {
  #   nodes {
  #     ...AppLeagueMember
  #   }
  # }
  # matchupByCurrentMatchup field not available
  # matchupByCurrentMatchup @include(if: $withMatchup) {
  #   ...AppMatchup
  # }
}

fragment AppLeagueMember on LeagueMember {
  leagueId
  permissionLevel
  teamId
  userId
  # user field not available, only userId
  # user {
  #   ...User
  # }
}

fragment LeaguePosition on LeaguePosition {
  id
  leagueId
  positionType
}

query GetLeagueById(
  $id: Int!
  $withMembers: Boolean = false
  $withTeams: Boolean = false
  $withMatchup: Boolean = false
) {
  league(id: $id) {
    ...AppLeague
  }
}

mutation CreateLeague(
  $input: CreateLeagueAndTeamsInput!
  $withMembers: Boolean = false
  $withTeams: Boolean = false
  $withMatchup: Boolean = false
) {
  createLeagueAndTeams(input: $input) {
    league {
      ...AppLeague
    }
  }
}

query GetPositionsForLeague($leagueId: Int!) {
  leaguePositions(leagueId: $leagueId) {
    ...LeaguePosition
  }
}

query GetUserLeagues {
  userLeagues {
    ...AppLeague
  }
}

mutation DeleteAllLeagues {
  deleteAllLeagues
}

mutation StartDraft($leagueId: Int!, $selectionMethod: String) {
  startDraft(leagueId: $leagueId, selectionMethod: $selectionMethod) {
    ...AppLeague
  }
}

query GetLeagueTeams($leagueId: Int!) {
  leagueTeams(leagueId: $leagueId) {
    id
    name
    leagueId
  }
}

# ── Public League Discovery ──────────────────────────────────────────────

query GetPublicLeagues(
  $search: String
  $draftStatus: String
  $playerPool: String
  $limit: Int
  $offset: Int
) {
  publicLeagues(
    search: $search
    draftStatus: $draftStatus
    playerPool: $playerPool
    limit: $limit
    offset: $offset
  ) {
    id
    name
    owner
    maxRosterSize
    draftStatus
    playerPool
    isPublic
    totalSpots
    availableSpots
    isFull
    isAlreadyMember
  }
}

mutation JoinPublicLeague($leagueId: Int!, $teamName: String!) {
  joinPublicLeague(leagueId: $leagueId, teamName: $teamName) {
    success
    message
    leagueId
    teamId
  }
}

# ── Mock Draft ───────────────────────────────────────────────────────────
# Free users get 2 mock drafts/week; the server enforces the limit in
# initializeMockDraft and returns PremiumRequiredError when it is exceeded.

mutation InitializeMockDraft(
  $numTeams: Int!
  $rosterSize: Int!
  $userPickPosition: Int!
  $pickTimeLimitSeconds: Int
  $draftOrder: String
  $playerPool: String
) {
  initializeMockDraft(
    numTeams: $numTeams
    rosterSize: $rosterSize
    userPickPosition: $userPickPosition
    pickTimeLimitSeconds: $pickTimeLimitSeconds
    draftOrder: $draftOrder
    playerPool: $playerPool
  ) {
    leagueId
    draftId
  }
}

query GetMyMockDraftUsage {
  getMyMockDraftUsage {
    used
    limit
    remaining
    isUnlimited
  }
}
