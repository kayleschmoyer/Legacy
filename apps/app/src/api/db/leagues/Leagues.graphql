fragment League on League {
  id
  name
  owner
  currentMatchup
  draftStatus
  userMembership {
    ...LeagueMember
  }
  # leagueMembers field not available
  # leagueMembers @include(if: $withMembers) {
  #   nodes {
  #     ...LeagueMember
  #   }
  # }
  # matchupByCurrentMatchup field not available  
  # matchupByCurrentMatchup @include(if: $withMatchup) {
  #   ...Matchup
  # }
  # teams field not available
  # teams @include(if: $withTeams) {
  #   nodes {
  #     ...Team
  #   }
  # }
}

fragment LeagueMember on LeagueMember {
  leagueId
  permissionLevel
  teamId
  userId
  # user field not available, only userId
  # user {
  #   ...User
  # }
}

fragment LeaguePosition on LeaguePosition {
  id
  leagueId
  positionType
}

query GetLeagueById(
  $id: Int!
  $withMembers: Boolean = false
  $withTeams: Boolean = false
  $withMatchup: Boolean = false
) {
  league(id: $id) {
    ...League
  }
}

mutation CreateLeague(
  $input: CreateLeagueAndTeamsInput!
  $withMembers: Boolean = false
  $withTeams: Boolean = false
  $withMatchup: Boolean = false
) {
  createLeagueAndTeams(input: $input) {
    league {
      ...League
    }
  }
}

query GetPositionsForLeague($leagueId: Int!) {
  leaguePositions(leagueId: $leagueId) {
    ...LeaguePosition
  }
}

query GetUserLeagues {
  userLeagues {
    ...League
  }
}

mutation DeleteAllLeagues {
  deleteAllLeagues
}

mutation StartDraft($leagueId: Int!, $draftType: String) {
  startDraft(leagueId: $leagueId, draftType: $draftType) {
    ...League
  }
}
