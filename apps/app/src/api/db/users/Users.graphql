fragment User on User {
  id
  email
  username
  avatarUrl
  accessLevel
  subscriptionTier
}

query GetUserByEmail($email: String!) {
  userByEmail(email: $email) {
    ...User
  }
}

query GetLeaguesForUser(
  $id: Int!
  $withMembers: Boolean = false
  $withMatchup: Boolean = false
  $withTeams: Boolean = false
) {
  user(id: $id) {
    # leagueMembers field not available on User
    # leagueMembers {
    #   nodes {
    #     league {
    #       ...League
    #     }
    #   }
    # }
    ...User
  }
}

query GetUserById($id: Int!) {
  user(id: $id) {
    ...User
  }
}
mutation UpdateUsername($username: String!) {
  updateUsername(username: $username) {
    ...User
  }
}

mutation UpdateUserAvatar($avatarUrl: String) {
  updateUserAvatar(avatarUrl: $avatarUrl) {
    id
    username
    avatarUrl
  }
}
