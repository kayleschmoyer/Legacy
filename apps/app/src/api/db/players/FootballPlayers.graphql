query FootballPlayers(
  $position: String
  $nflTeam: String
  $search: String
  $after: String
) {
  footballPlayers(
    position: $position
    nflTeam: $nflTeam
    search: $search
    after: $after
  ) {
    nodes {
      id
      firstName
      lastName
      position
      isDst
      nflTeam
      pfrId
      headshotUrl
      previousTeams
      careerStats {
        passing {
          yds
          td
          int
          rating
        }
        rushing {
          yds
          td
        }
        receiving {
          rec
          yds
          td
        }
        kicking {
          fgm
          fga
          fgPct
        }
        defense {
          sacks
          int
          ptsAllowedPerG
        }
        idp {
          soloTkl
          astTkl
          sacks
          int
          ff
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query FootballPlayer($id: Int!) {
  footballPlayer(id: $id) {
    id
    firstName
    lastName
    position
    isDst
    nflTeam
    pfrId
    headshotUrl
    previousTeams
    injuriesLastSyncedAt
    seasonStats {
      passing {
        season
        team
        g
        yds
        td
        int
        rating
      }
      rushing {
        season
        team
        g
        att
        yds
        td
      }
      receiving {
        season
        team
        g
        tgt
        rec
        yds
        td
      }
      kicking {
        season
        team
        g
        fgm
        fga
        xpm
        xpa
      }
      defense {
        season
        team
        g
        sacks
        int
        fumRec
        defTd
        ptsAllowed
      }
      idp {
        season
        team
        g
        soloTkl
        astTkl
        sacks
        int
        pd
        ff
        fr
        defTd
        safeties
      }
    }
    careerStats {
      passing {
        yds
        td
        int
        rating
      }
      rushing {
        yds
        td
      }
      receiving {
        rec
        yds
        td
      }
      kicking {
        fgm
        fga
        fgPct
      }
      defense {
        g
        sacks
        int
        fumRec
        defTd
        ptsAllowedPerG
        ydsAllowedPerG
      }
      idp {
        soloTkl
        astTkl
        sacks
        int
        ff
      }
    }
  }
}
