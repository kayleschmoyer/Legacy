fragment Team on Team {
  id
  leagueId
  name
  logoUrl
  primaryColor
  secondaryColor
  avatarUrl
  bannerUrl
}

fragment AppTeamMember on TeamMember {
  id
  playerId
  positionId
  teamId
  leagueId
  onTradeBlock
  player {
    id
    firstName
    lastName
    brefId
    eligiblePositions
  }
}

query GetTeamMembers($teamId: Int!) {
  teamMembers(teamId: $teamId) {
    ...AppTeamMember
  }
}

mutation UpdateTeamMemberPosition($teamMemberId: Int!, $positionId: Int) {
  updateTeamMemberPosition(
    teamMemberId: $teamMemberId
    positionId: $positionId
  ) {
    ...AppTeamMember
  }
}

mutation SwapTeamMemberPositions(
  $teamMemberIdA: Int!
  $positionIdA: Int
  $teamMemberIdB: Int!
  $positionIdB: Int
) {
  swapTeamMemberPositions(
    teamMemberIdA: $teamMemberIdA
    positionIdA: $positionIdA
    teamMemberIdB: $teamMemberIdB
    positionIdB: $positionIdB
  ) {
    ...AppTeamMember
  }
}

mutation SetTradeBlock($teamMemberId: Int!, $onTradeBlock: Boolean!) {
  setTradeBlock(teamMemberId: $teamMemberId, onTradeBlock: $onTradeBlock) {
    ...AppTeamMember
  }
}

query GetTeamById($teamId: Int!) {
  team: teamById(teamId: $teamId) {
    ...Team
  }
}

query GetLeagueTradeBlock($leagueId: Int!) {
  leagueTradeBlock(leagueId: $leagueId) {
    ...AppTeamMember
  }
}

# ── Waiver Claims ────────────────────────────────────────────────────────────

query GetTeamWaiverClaims($teamId: Int!, $status: String) {
  teamWaiverClaims(teamId: $teamId, status: $status) {
    id
    leagueId
    teamId
    playerId
    dropPlayerId
    faabBid
    status
    errorMessage
    playerName
    dropPlayerName
    processedAt
    createdAt
  }
}

mutation CancelWaiverClaim($claimId: Int!) {
  cancelWaiverClaim(claimId: $claimId) {
    id
    status
    errorMessage
    processedAt
  }
}

mutation UpdateTeamBranding(
  $teamId: Int!
  $leagueId: Int!
  $avatarUrl: String
  $bannerUrl: String
) {
  updateTeamBranding(
    teamId: $teamId
    leagueId: $leagueId
    avatarUrl: $avatarUrl
    bannerUrl: $bannerUrl
  ) {
    ...Team
  }
}
