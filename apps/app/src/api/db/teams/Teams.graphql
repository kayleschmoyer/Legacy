fragment Team on Team {
  id
  leagueId
  name
}

fragment TeamMember on TeamMember {
  id
  playerId
  positionId
  teamId
}

fragment TeamMemberWithPositions on TeamMember {
  ...TeamMember
  player @include(if: $withPositions) {
    ...Player
    playerEligiblePositions @include(if: $withPositions) {
      nodes {
        ...PlayerEligiblePosition
      }
    }
  }
}

query GetTeamById($teamId: Int!, $withPositions: Boolean = false) {
  team(id: $teamId) {
    teamMembers {
      nodes {
        ...TeamMemberWithPositions
      }
    }
    ...Team
  }
}

mutation UpdateTeamMemberPosition($teamMemberId: Int!, $positionId: Int) {
  updateTeamMember(
    input: { patch: { positionId: $positionId }, id: $teamMemberId }
  ) {
    teamMember {
      id
      leagueId
      playerId
      positionId
    }
  }
}
