query AdminRevenueStats {
  adminRevenueStats {
    totalSubscribers
    totalPremiumUsers
    totalFreeUsers
    totalUsers
    conversionRate
    newSubscribersThisMonth
    statusBreakdown {
      status
      count
    }
    stripeSubscribers
    subscriberGrowth {
      month
      newSubscribers
    }
  }
}
