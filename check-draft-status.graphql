# Query to check draft status and identify issues
# Replace 1 with your actual league ID

query CheckDraftStatus($leagueId: Int!) {
  league(id: $leagueId) {
    id
    name
    owner
    draftStatus
    maxRosterSize
    currentMatchup
    
    # Get teams in the league
    teams {
      id
      name
      
      # Get team members (player assignments)
      teamMembers {
        id
        playerId
        positionId
        player {
          id
          firstName
          lastName
        }
      }
    }
  }
  
  # Get league positions configured
  leaguePositions(leagueId: $leagueId) {
    id
    positionType
  }
}
