# Test query for the new team connection in UserMembership (LeagueMember)
query TestUserMembershipTeamConnection($leagueId: Int!) {
  league(id: $leagueId) {
    id
    name
    userMembership {
      leagueId
      userId
      teamId
      permissionLevel
      # New team field - resolves to actual Team object
      team {
        id
        name
        leagueId
      }
    }
  }
}
