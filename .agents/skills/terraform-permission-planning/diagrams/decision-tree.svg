<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" font-family="Literata, Georgia, serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B3A5C"/>
    </marker>
    <style>
      .title { font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 24px; fill: #0A0F1A; letter-spacing: 0.02em; }
      .q { font-weight: 700; font-size: 13px; fill: #0A0F1A; text-anchor: middle; }
      .leaf-title { font-weight: 700; font-size: 13px; fill: #FFFFFF; text-anchor: middle; }
      .leaf-body { font-size: 11px; fill: #FFFFFF; text-anchor: middle; }
      .label { font-size: 11px; font-weight: 700; fill: #1B3A5C; }
      .meta { font-size: 11px; fill: #16223A; }
    </style>
  </defs>

  <rect width="920" height="700" fill="#F7F4EC"/>
  <text x="460" y="40" text-anchor="middle" class="title">WHICH POLICY DOES THIS PERMISSION GO IN?</text>
  <line x1="120" y1="55" x2="800" y2="55" stroke="#C5A55A" stroke-width="2"/>

  <!-- Q1 -->
  <polygon points="460,75 620,145 460,215 300,145" fill="#FFFFFF" stroke="#1B3A5C" stroke-width="2"/>
  <text x="460" y="135" class="q">Is the action read-only?</text>
  <text x="460" y="153" class="q">(Get* / List* / Describe*)</text>

  <!-- Q1 YES -> Q-plan -->
  <line x1="300" y1="145" x2="180" y2="200" stroke="#1B3A5C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="215" y="165" class="label">YES</text>

  <!-- Q1 NO -> Q-write -->
  <line x1="620" y1="145" x2="740" y2="200" stroke="#1B3A5C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="685" y="165" class="label">NO</text>

  <!-- LEFT BRANCH: read-only -->
  <rect x="60" y="205" width="240" height="80" rx="6" fill="#1B3A5C"/>
  <text x="180" y="232" class="leaf-title">github_actions_plan_policy</text>
  <text x="180" y="252" class="leaf-body">inline, 10,240 B limit</text>
  <text x="180" y="268" class="leaf-body">used by PR plan workflow</text>
  <text x="180" y="280" class="leaf-body">+ also add to supplemental (apply role refresh)</text>

  <!-- RIGHT BRANCH: write -->
  <polygon points="740,210 880,265 740,320 600,265" fill="#FFFFFF" stroke="#1B3A5C" stroke-width="2"/>
  <text x="740" y="255" class="q">Does the action support</text>
  <text x="740" y="273" class="q">resource-level perms?</text>
  <text x="740" y="291" class="q">(check Service Auth Ref)</text>

  <!-- YES (right) -> supplemental scoped -->
  <line x1="740" y1="320" x2="660" y2="395" stroke="#1B3A5C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="680" y="350" class="label">YES</text>

  <!-- NO (right) -> supplemental wildcard -->
  <line x1="880" y1="265" x2="880" y2="395" stroke="#1B3A5C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="888" y="340" class="label">NO</text>

  <!-- Leaf: supplemental scoped -->
  <rect x="450" y="400" width="280" height="100" rx="6" fill="#1B3A5C"/>
  <text x="590" y="427" class="leaf-title">github_actions_supplemental</text>
  <text x="590" y="447" class="leaf-body">managed, 6,144 B / version</text>
  <text x="590" y="465" class="leaf-body">scope to narrowest resource ARN</text>
  <text x="590" y="481" class="leaf-body">use locals.account_id / locals.region</text>
  <text x="590" y="495" class="leaf-body">e.g. arn:...:legacy-sports-dev-*</text>

  <!-- Leaf: supplemental wildcard -->
  <rect x="760" y="400" width="150" height="100" rx="6" fill="#C41E3A"/>
  <text x="835" y="427" class="leaf-title">supplemental</text>
  <text x="835" y="445" class="leaf-body">SEPARATE statement</text>
  <text x="835" y="461" class="leaf-body">Resource = "*"</text>
  <text x="835" y="478" class="leaf-body">never mix with</text>
  <text x="835" y="492" class="leaf-body">scoped actions</text>

  <!-- Q2 hangs off LEFT branch: do you ALSO need apply-role read? -->
  <polygon points="180,335 320,395 180,455 40,395" fill="#FFFFFF" stroke="#1B3A5C" stroke-width="2"/>
  <text x="180" y="388" class="q">Will the resource</text>
  <text x="180" y="406" class="q">be applied (not just</text>
  <text x="180" y="424" class="q">read via data source)?</text>

  <line x1="180" y1="285" x2="180" y2="335" stroke="#1B3A5C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Q2 YES -> mirror to supplemental -->
  <line x1="320" y1="395" x2="450" y2="450" stroke="#1B3A5C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="415" class="label">YES &#8594; also supplemental</text>

  <!-- Q2 NO -> plan only -->
  <rect x="20" y="475" width="240" height="60" rx="6" fill="#16223A"/>
  <text x="140" y="502" class="leaf-title">plan_policy only</text>
  <text x="140" y="520" class="leaf-body">pure data-source read; no apply</text>
  <line x1="140" y1="455" x2="140" y2="475" stroke="#1B3A5C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="55" y="470" class="label">NO</text>

  <!-- DO NOT EDIT box -->
  <rect x="320" y="555" width="580" height="60" rx="6" fill="#F0E8D2" stroke="#C41E3A" stroke-width="2"/>
  <text x="610" y="580" text-anchor="middle" class="q" style="fill:#C41E3A">DO NOT EDIT: github_actions_additional</text>
  <text x="610" y="600" text-anchor="middle" class="meta">inline, near 10 KB limit since LS-3839 &#8212; closed for new statements; only remove or fix typos</text>

  <!-- Legend -->
  <rect x="20" y="555" width="280" height="115" rx="6" fill="#FFFFFF" stroke="#1B3A5C" stroke-width="1"/>
  <text x="35" y="578" class="q" style="text-anchor:start">Legend</text>
  <rect x="35" y="588" width="14" height="14" fill="#1B3A5C"/>
  <text x="55" y="600" class="meta">target policy (apply or plan)</text>
  <rect x="35" y="608" width="14" height="14" fill="#C41E3A"/>
  <text x="55" y="620" class="meta">requires special handling</text>
  <rect x="35" y="628" width="14" height="14" fill="#16223A"/>
  <text x="55" y="640" class="meta">narrow case</text>
  <rect x="35" y="648" width="14" height="14" fill="#FFFFFF" stroke="#1B3A5C"/>
  <text x="55" y="660" class="meta">decision</text>

  <!-- Footer hint -->
  <text x="460" y="690" text-anchor="middle" class="meta" style="font-style:italic">Both roles share permission boundary github_actions_boundary &#8212; never edit unless granting access to a new namespace.</text>
</svg>
